# =============================================================================
# demo.studybuddy.app — host-level nginx vhost (Cloudflare Origin Cert)
#
# Lives at /etc/nginx/sites-available/demo.studybuddy.app.conf, symlinked from
# sites-enabled/. Installed by scripts/demo/provision.sh as the second-tenant
# bootstrap on a CX22 already running mambakkam.net's host nginx. Reloaded
# manually by the operator after edits (NOT auto-deployed — a syntax error
# would take down the co-tenant mambakkam.net site too).
#
# Architecture:
#   Internet → Cloudflare (TLS, DDoS) → :443 here → 127.0.0.1:8443
#                                                   │
#                                                   └─ docker-compose.demo.yml
#                                                      compose-internal nginx
#                                                      (which then proxies
#                                                       /api → fastapi container,
#                                                       /content → bind-mount,
#                                                       / → next.js container)
#
# SSL is via a Cloudflare Origin Certificate that covers BOTH mambakkam.net
# and demo.studybuddy.app — a single cert at /etc/ssl/cloudflare/origin-*.pem
# is shared between this vhost and mambakkam.net's vhost. mambakkam.net's
# first-tenant provision.sh generates this cert with the SAN list before
# StudyBuddy joins the box.
# Cloudflare → SSL/TLS mode "Full (strict)" requires a valid origin cert.
#
# Note: the compose-internal nginx (scripts/demo/nginx.conf) does NOT
# terminate Cloudflare TLS anymore — that happens here at the host level.
# The compose-internal nginx must bind to 127.0.0.1:8443 (NOT 0.0.0.0:443)
# so the host nginx is the only thing on the public 443.
# =============================================================================

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name demo.studybuddy.app;

    # Cloudflare's "Always Use HTTPS" handles this at the edge, but we redirect
    # at the origin too in case anyone hits the VPS IP directly.
    return 301 https://demo.studybuddy.app$request_uri;
}

# ── apex — main app ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.studybuddy.app;

    ssl_certificate     /etc/ssl/cloudflare/origin-cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    # Modern TLS only (Cloudflare Origin Cert supports these out of the box)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Logs ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/demo.studybuddy.app.access.log;
    error_log  /var/log/nginx/demo.studybuddy.app.error.log;

    # ── Security headers ──────────────────────────────────────────────────
    # HSTS: tell browsers (and Cloudflare) to require HTTPS for 1 year.
    # Only safe to ship after the cert chain is verified working end-to-end.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Body / proxy limits ───────────────────────────────────────────────
    # Generous for content uploads + curriculum XLSX (matches the
    # compose-internal nginx setting in scripts/demo/nginx.conf).
    client_max_body_size 50m;

    # ── Default location — proxy to the StudyBuddy compose stack ──────────
    # Everything (api, web, content static, healthz) is fronted by the
    # compose-internal nginx on 127.0.0.1:8443. We hand off TLS termination
    # here and re-encrypt to the upstream loopback (or speak HTTP if the
    # compose-internal nginx is configured to listen plain on 8443 instead;
    # both work, this assumes plain HTTP on the loopback for simplicity).
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Allow long-running connections for SSE / long polling / streamed responses
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── /metrics — gated by Cloudflare Access ────────────────────────────
    # The StudyBuddy /metrics endpoint is bearer-token-protected on the
    # application side (see backend/src/core/observability.py — checks
    # METRICS_TOKEN). The local Prometheus on this VPS scrapes it directly
    # over the loopback at 127.0.0.1:8443/metrics WITHOUT going through
    # this public surface, so this location exists only to allow Grafana
    # Cloud (or the operator) to scrape from outside via Cloudflare Tunnel.
    #
    # Defence in depth: Cloudflare Access at the edge + bearer token at
    # the application + Cloudflare-IP allowlist at this nginx layer.
    # The Cloudflare IP list below is the v4 set as of 2026-05; refresh
    # from https://www.cloudflare.com/ips/ on a quarterly cadence.
    location = /metrics {
        # Cloudflare IP allowlist (v4) — drop everything else.
        allow 173.245.48.0/20;
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 141.101.64.0/18;
        allow 108.162.192.0/18;
        allow 190.93.240.0/20;
        allow 188.114.96.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        allow 162.158.0.0/15;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 172.64.0.0/13;
        allow 131.0.72.0/22;
        deny  all;

        # Belt-and-braces: refuse if Cloudflare didn't stamp the Access JWT.
        if ($http_cf_access_jwt_assertion = "") {
            return 403;
        }

        # Pass the bearer token through to the FastAPI /metrics handler.
        # Operator: configure Cloudflare Access service-token to add the
        # Authorization header automatically, OR have the scraper send it.
        proxy_pass http://127.0.0.1:8443/metrics;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
