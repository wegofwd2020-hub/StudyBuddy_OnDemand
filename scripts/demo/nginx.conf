# =============================================================================
# scripts/demo/nginx.conf — config for the compose-internal nginx container
#
# Mounted into the nginx service in docker-compose.demo.yml as
# /etc/nginx/nginx.conf.
#
# Architecture (since 2026-05-13 — the host-vhost docstring at
# infra/nginx/demo.usestudybuddy.com.conf is the canonical reference):
#
#   Cloudflare (TLS, DDoS)
#     → host nginx :443     (terminates TLS via Origin Cert, routes by Host header)
#     → 127.0.0.1:8443      (loopback)
#     → THIS nginx (plain HTTP, port 8443 inside the container)
#         /api/*           → fastapi container
#         /healthz, /readyz, /metrics → fastapi container
#         /content/*       → bind-mount /srv/content/   (lesson JSON + audio)
#         /sample-visuals/*→ bind-mount /srv/sample-visuals/ (44 tutorial MP4s)
#         /                → next.js container
#
# This nginx no longer terminates TLS — the host nginx (installed by
# scripts/demo/provision.sh step 5) does. Drop port 80 too; the host
# vhost handles the HTTP→HTTPS redirect.
#
# Last validated locally on 2026-05-13:
#   docker run --rm --network studybuddy_ondemand_default \
#     -v "$(pwd)/scripts/demo/nginx.conf:/etc/nginx/nginx.conf:ro" \
#     nginx:alpine nginx -t
#   → "test is successful"
# Live curl probes from the same network (port-published to host loopback):
#   GET /healthz       → 200 (FastAPI top-level route)
#   GET /              → 200 (Next.js root via `location /` upstream)
#   GET /api/v1/*      → proxied to api:8000 upstream (chain verified)
# Not testable in standalone validation: /content/ and /sample-visuals/
# bind-mount aliases (need /data/content + /data/sample-visuals to exist —
# verified by the 3 HEAD checks in scripts/demo/smoke.sh at launch).
# Host-nginx → loopback hand-off only validatable on the actual VPS;
# Day -4 staging dry-run is the first opportunity.
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  server_tokens   off;
  client_max_body_size 50M;   # generous for content uploads + curriculum XLSX

  gzip on;
  gzip_types
    application/javascript application/json application/xml
    text/css text/plain text/javascript text/xml
    image/svg+xml;
  gzip_min_length 1024;

  # Map upstream addresses (compose service names work via Docker DNS)
  upstream api {
    server api:8000;
    keepalive 32;
  }
  upstream web {
    server web:3000;
    keepalive 32;
  }

  # Trust X-Forwarded-* from the host nginx on loopback only.
  # Without this, $scheme/$remote_addr show "http"/"172.x.x.x" (the docker
  # bridge) rather than the real client's HTTPS connection from Cloudflare.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 127.0.0.1;
  real_ip_header   X-Forwarded-For;

  server {
    listen 8443 default_server;
    listen [::]:8443 default_server;
    server_name _;

    # Standard security headers (these get re-applied by the host nginx too,
    # but defense-in-depth on the application response path is cheap).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── /api/* → FastAPI ─────────────────────────────────────────────────────
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Connection        "";
      proxy_buffering off;
      proxy_read_timeout 60s;
    }

    # ── /healthz, /readyz, /metrics (top-level FastAPI routes) ──────────────
    location ~ ^/(healthz|readyz|metrics)$ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }

    # ── /content/* → static files from /data/content (faster than via API) ──
    location /content/ {
      alias /srv/content/;
      add_header Cache-Control "public, max-age=3600";
      access_log off;   # high-volume, low signal
    }

    # ── /sample-visuals/* → static MP4s + SVGs from /data/sample-visuals ────
    # Tutorial JSON files embed videos via /sample-visuals/<unit>/<file>.mp4
    # URLs. The actual bytes are gitignored (web/public/sample-visuals/) so
    # they're not in the Docker image — they're rsync'd to /data/sample-visuals
    # on the VPS and bind-mounted to /srv/sample-visuals here.
    location /sample-visuals/ {
      alias /srv/sample-visuals/;
      add_header Cache-Control "public, max-age=86400";   # 1 day — content is content-hashed in URL
      access_log off;
    }

    # ── Everything else → Next.js ────────────────────────────────────────────
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_buffering off;
      proxy_read_timeout 60s;
    }
  }
}
