# =============================================================================
# scripts/demo/nginx.conf — host-level config for the demo Nginx container
#
# Mounted into the nginx service in docker-compose.demo.yml as /etc/nginx/nginx.conf.
# Terminates HTTPS via Cloudflare Origin Cert; proxies /api/* to the FastAPI
# backend; serves /content/* directly from the bind-mounted content store; routes
# everything else to the Next.js web service.
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  server_tokens   off;
  client_max_body_size 50M;   # generous for content uploads + curriculum XLSX

  gzip on;
  gzip_types
    application/javascript application/json application/xml
    text/css text/plain text/javascript text/xml
    image/svg+xml;
  gzip_min_length 1024;

  # Map upstream addresses (compose service names work via Docker DNS)
  upstream api {
    server api:8000;
    keepalive 32;
  }
  upstream web {
    server web:3000;
    keepalive 32;
  }

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health-probe path stays HTTP (Cloudflare uplink check)
    location = /healthz {
      proxy_pass http://api/healthz;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS server ──────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.studybuddy.app;

    ssl_certificate     /etc/ssl/cloudflare/origin-cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Standard security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── /api/* → FastAPI ─────────────────────────────────────────────────────
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      proxy_buffering off;
      proxy_read_timeout 60s;
    }

    # ── /healthz, /readyz, /metrics (top-level FastAPI routes) ──────────────
    location ~ ^/(healthz|readyz|metrics)$ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }

    # ── /content/* → static files from /data/content (faster than via API) ──
    location /content/ {
      alias /srv/content/;
      add_header Cache-Control "public, max-age=3600";
      access_log off;   # high-volume, low signal
    }

    # ── /sample-visuals/* → static MP4s + SVGs from /data/sample-visuals ────
    # Tutorial JSON files embed videos via /sample-visuals/<unit>/<file>.mp4
    # URLs. The actual bytes are gitignored (web/public/sample-visuals/) so
    # they're not in the Docker image — they're rsync'd to /data/sample-visuals
    # on the VPS and bind-mounted to /srv/sample-visuals here.
    location /sample-visuals/ {
      alias /srv/sample-visuals/;
      add_header Cache-Control "public, max-age=86400";   # 1 day — content is content-hashed in URL
      access_log off;
    }

    # ── Everything else → Next.js ────────────────────────────────────────────
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_buffering off;
      proxy_read_timeout 60s;
    }
  }
}
