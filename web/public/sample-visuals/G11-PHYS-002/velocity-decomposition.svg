<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="Velocity Decomposition into Horizontal and Vertical Components">
  <title>Velocity Decomposition into Horizontal and Vertical Components</title>
  <desc>An initial velocity vector at 60° decomposed into its horizontal and vertical components.</desc>
  
  <defs>
    <marker id="ah-vec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
    <marker id="ah-vx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dd6b20" />
    </marker>
    <marker id="ah-vy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#319795" />
    </marker>
  </defs>

  <text x="240" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Initial Velocity Decomposition</text>

  <!-- Ground -->
  <line x1="60" y1="240" x2="450" y2="240" stroke="#1a202c" stroke-width="1.5" />

  <!-- Projectile dot -->
  <circle cx="90" cy="240" r="6" fill="#1a202c" />

  <!-- Total velocity arrow -->
  <line x1="90" y1="240" x2="180" y2="84.11542731880104" stroke="#2b6cb0" stroke-width="3.5" marker-end="url(#ah-vec)" />
  <text x="131" y="148.05771365940052" font="13px system-ui" font-size="13" font-weight="700" fill="#2b6cb0">v = 20 m/s</text>
  <text x="120" y="230" font="12px system-ui" font-size="12" fill="#2b6cb0" font-style="italic">θ = 60°</text>

  <!-- Horizontal component -->
  <line x1="90" y1="270" x2="180" y2="270" stroke="#dd6b20" stroke-width="3" marker-end="url(#ah-vx)" />
  <text x="135" y="290" font="12px system-ui" font-size="12" font-weight="600" fill="#dd6b20" text-anchor="middle">vₓ = v cos θ ≈ 10 m/s</text>

  <!-- Vertical component (drawn as separate ghost arrow to the right) -->
  <line x1="230" y1="240" x2="230" y2="84.11542731880104" stroke="#319795" stroke-width="3" marker-end="url(#ah-vy)" />
  <text x="240" y="162.05771365940052" font="12px system-ui" font-size="12" font-weight="600" fill="#319795">v_y = v sin θ</text>
  <text x="240" y="176.05771365940052" font="12px system-ui" font-size="12" font-weight="600" fill="#319795">≈ 17.3 m/s</text>

  <!-- Right-angle marker -->
  <path d="M 90 258 L 102 258 L 102 270" fill="none" stroke="#dd6b20" stroke-width="1" />

  <text x="240" y="308" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Independent horizontal and vertical motions combine to produce the parabolic trajectory.</text>

</svg>
