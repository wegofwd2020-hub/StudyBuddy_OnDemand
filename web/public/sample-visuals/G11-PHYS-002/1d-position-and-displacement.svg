<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-label="1-D Position and Displacement">
  <title>1-D Position and Displacement</title>
  <desc>A number line with origin marked, initial and final positions, and a green arrow showing the +4 m displacement.</desc>
  
  <text x="260" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">1-D Motion: Position and Displacement</text>

  <!-- Number line -->
  <line x1="40" y1="100" x2="480" y2="100" stroke="#1a202c" stroke-width="1.5" />
  <!-- Tick marks -->
  <line x1="40" y1="94" x2="40" y2="106" stroke="#1a202c" stroke-width="1" /><text x="40" y="124" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">-2</text>
  <line x1="84" y1="94" x2="84" y2="106" stroke="#1a202c" stroke-width="1" /><text x="84" y="124" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">-1</text>
  <line x1="128" y1="94" x2="128" y2="106" stroke="#1a202c" stroke-width="1" /><text x="128" y="124" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">0</text>
  <line x1="172" y1="94" x2="172" y2="106" stroke="#1a202c" stroke-width="1" /><text x="172" y="124" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">1</text>
  <line x1="216" y1="94" x2="216" y2="106" stroke="#1a202c" stroke-width="1" /><text x="216" y="124" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">2</text>
  <line x1="260" y1="94" x2="260" y2="106" stroke="#1a202c" stroke-width="1" /><text x="260" y="124" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">3</text>
  <line x1="304" y1="94" x2="304" y2="106" stroke="#1a202c" stroke-width="1" /><text x="304" y="124" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">4</text>
  <line x1="348" y1="94" x2="348" y2="106" stroke="#1a202c" stroke-width="1" /><text x="348" y="124" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">5</text>
  <line x1="392" y1="94" x2="392" y2="106" stroke="#1a202c" stroke-width="1" /><text x="392" y="124" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">6</text>
  <line x1="436" y1="94" x2="436" y2="106" stroke="#1a202c" stroke-width="1" /><text x="436" y="124" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">7</text>
  <line x1="480" y1="94" x2="480" y2="106" stroke="#1a202c" stroke-width="1" /><text x="480" y="124" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">8</text>

  <!-- Origin marker -->
  <circle cx="128" cy="100" r="4" fill="#1a202c" />
  <text x="128" y="84" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">O (origin)</text>

  <!-- x_i and x_f markers -->
  <circle cx="172" cy="100" r="6" fill="#2b6cb0" />
  <text x="172" y="82" font="12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">x_i = 1</text>

  <circle cx="348" cy="100" r="6" fill="#dd6b20" />
  <text x="348" y="82" font="12px system-ui" font-size="12" font-weight="700" fill="#dd6b20" text-anchor="middle">x_f = 5</text>

  <!-- Displacement arrow below -->
  <defs>
    <marker id="arrow-disp1d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" />
    </marker>
  </defs>
  <line x1="178" y1="150" x2="342" y2="150" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-disp1d)" />
  <text x="260" y="175" font="13px system-ui" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">Δx = x_f − x_i = +4 m</text>

  <text x="260" y="190" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Position is location relative to origin; displacement is the change in position.</text>

</svg>
