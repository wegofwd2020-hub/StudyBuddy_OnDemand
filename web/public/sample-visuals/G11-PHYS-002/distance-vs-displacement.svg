<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Distance vs Displacement">
  <title>Distance vs Displacement</title>
  <desc>A curved path from A to B with the straight-line displacement vector overlaid showing the difference.</desc>
  
  <defs>
    <marker id="arrow-displacement" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
  </defs>

  <text x="240" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Distance vs. Displacement</text>

  <!-- Curved path from A to B -->
  <path d="M 80 200 Q 160 60, 260 130 T 400 80"
        fill="none" stroke="#dd6b20" stroke-width="3.5" />
  <!-- Direction arrows along path -->
  <path d="M 200 100 L 215 110 L 200 120" fill="none" stroke="#dd6b20" stroke-width="2" />

  <!-- Straight displacement vector (A → B) -->
  <line x1="80" y1="200" x2="400" y2="80"
        stroke="#2b6cb0" stroke-width="3"
        stroke-dasharray="6 4"
        marker-end="url(#arrow-displacement)" />

  <!-- Endpoint dots -->
  <circle cx="80" cy="200" r="6" fill="#1a202c" />
  <text x="68" y="220" font="14px system-ui" font-size="14" font-weight="700" fill="#1a202c">A</text>
  <circle cx="400" cy="80" r="6" fill="#1a202c" />
  <text x="408" y="78" font="14px system-ui" font-size="14" font-weight="700" fill="#1a202c">B</text>

  <!-- Legend -->
  <g transform="translate(80, 240)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#dd6b20" stroke-width="3.5" />
    <text x="50" y="4" font="12px system-ui" font-size="12" fill="#1a202c">Distance: total path length (scalar)</text>
  </g>
  <g transform="translate(80, 260)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2b6cb0" stroke-width="3" stroke-dasharray="6 4" />
    <text x="50" y="4" font="12px system-ui" font-size="12" fill="#1a202c">Displacement: A → B (vector)</text>
  </g>

</svg>
