# =============================================================================
# StudyBuddy OnDemand — Docker Compose: Demo (Hetzner) override
#
# Layered on top of the base `docker-compose.yml`. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml \
#     --env-file .env.demo up -d
#
# What this override does vs. local-dev compose:
#   - Drops PgBouncer (no connection pressure at demo scale; one less service)
#   - Drops celery-beat-standby (single Beat is fine for demo redundancy)
#   - Drops the stripe-cli profile (not relevant on a public demo box)
#   - Adds an Nginx reverse proxy that terminates HTTPS via Cloudflare cert
#   - Switches every service to `restart: always` so the box self-heals on reboot
#   - Pins explicit named volumes (so `docker compose down -v` does NOT eat data)
#   - Wires the API directly to PostgreSQL (no PgBouncer hop) via DATABASE_URL
#     override
#   - Pulls images from GHCR instead of building from source on the demo box
#     (faster cold-starts; no need for build toolchain on a 4 GB RAM VPS)
#
# Companion docs:
#   - docs/DEMO_LAUNCH_PLAN.md (this PR)
#   - studybuddy-docs/docs/dev/DEMO_HOSTING_GUIDE.md (Hetzner architecture)
# =============================================================================

# YAML anchor — same logging cap on every service. Caps each container's
# json-file logs at 10 MB × 5 files = 50 MB max per container before rotation.
# Promtail (in the monitoring compose stack) tails the same files and ships
# to Grafana Cloud Loki, so this is just on-disk retention; the cloud is the
# search-and-history surface.
x-logging-cap: &logging-cap
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # Same image as dev; production-style restart + named volume.
  db:
    restart: always
    logging: *logging-cap
    volumes:
      - studybuddy_demo_pgdata:/var/lib/postgresql/data
    # No need to expose 5432 publicly — only internal services need it.
    ports: []

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    restart: always
    logging: *logging-cap
    volumes:
      - studybuddy_demo_redis:/data
    ports: []

  # ── PgBouncer — DROPPED on demo ────────────────────────────────────────────
  # PgBouncer adds value at hundreds-of-connections scale. With ≤20 concurrent
  # demo users, asyncpg's built-in pool is sufficient. The API connects directly
  # to db:5432 instead of pgbouncer:5432.
  pgbouncer:
    profiles: ["never"]   # `profiles` makes the service inert unless explicitly enabled
    deploy:
      replicas: 0

  # ── Migrate (one-shot) ─────────────────────────────────────────────────────
  # Same one-shot behaviour. Compose deletes the container when it exits; the
  # image is pulled from GHCR rather than built locally.
  migrate:
    image: ghcr.io/wegofwd2020-hub/studybuddy-api:latest
    build: !reset null   # disable the local build directive from base compose
    pull_policy: always
    logging: *logging-cap
    env_file: !override
      - .env.demo
    environment:
      # Talk to db directly — no PgBouncer on demo.
      DATABASE_URL: postgresql://studybuddy:${POSTGRES_PASSWORD}@db:5432/studybuddy
      # alembic/env.py reads TEST_DB_URL before DATABASE_URL — blank it so
      # migrations always target the demo DB, not studybuddy_test.
      TEST_DB_URL: ""
    volumes: !override
      - /data/content:/data/content
      - /opt/studybuddy/data:/data
    # Base compose depends on db only — preserved here explicitly so the demo
    # stack does not pick up any future pgbouncer/migrate references via YAML
    # anchors.
    depends_on: !override
      db:
        condition: service_healthy

  # ── FastAPI ────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/wegofwd2020-hub/studybuddy-api:latest
    build: !reset null
    pull_policy: always
    restart: always
    logging: *logging-cap
    env_file: !override
      - .env.demo
    environment:
      DATABASE_URL: postgresql://studybuddy:${POSTGRES_PASSWORD}@db:5432/studybuddy
      DIRECT_DB_URL: postgresql://studybuddy:${POSTGRES_PASSWORD}@db:5432/studybuddy
      TEST_DB_URL: ""
      APP_ENV: staging
      LOG_LEVEL: INFO
      SENTRY_ENVIRONMENT: demo
      # Two workers for a 2 vCPU box — gunicorn formula (2*N+1) without overcommitting RAM
      GUNICORN_WORKERS: "2"
    # No host-port mapping on demo — Nginx fronts everything.
    ports: []
    # Drop pgbouncer (disabled in demo) and migrate (one-shot dependency is
    # satisfied at compose-up time anyway).
    depends_on: !override
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes: !override
      - /data/content:/data/content

  # ── Celery worker (io + default queues) ────────────────────────────────────
  celery-worker:
    image: ghcr.io/wegofwd2020-hub/studybuddy-api:latest
    build: !reset null
    pull_policy: always
    restart: always
    logging: *logging-cap
    env_file: !override
      - .env.demo
    environment:
      DATABASE_URL: postgresql://studybuddy:${POSTGRES_PASSWORD}@db:5432/studybuddy
      TEST_DB_URL: ""
    depends_on: !override
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes: !override
      - /data/content:/data/content

  # ── Celery pipeline worker — DROPPED on demo ───────────────────────────────
  # The pipeline runs on the operator's dev machine for demo (no Anthropic key
  # on the demo box; no risk of unexpected API spend). See DEMO_HOSTING_GUIDE.md
  # §"Run the Pipeline on Your Dev Machine, Not on Demo".
  celery-pipeline:
    profiles: ["never"]
    deploy:
      replicas: 0
    # Drop the base-compose depends_on chain so compose validation does not
    # require pgbouncer (which is also profiles:never).
    depends_on: !override
      db:
        condition: service_healthy

  # ── Celery Beat — single primary on demo ───────────────────────────────────
  celery-beat-primary:
    image: ghcr.io/wegofwd2020-hub/studybuddy-api:latest
    build: !reset null
    pull_policy: always
    restart: always
    logging: *logging-cap
    env_file: !override
      - .env.demo
    environment:
      DATABASE_URL: postgresql://studybuddy:${POSTGRES_PASSWORD}@db:5432/studybuddy
      TEST_DB_URL: ""
    depends_on: !override
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes: !override
      - /data/content:/data/content

  # ── Celery Beat standby — DROPPED on demo ─────────────────────────────────
  # The standby uses RedBeat to take over if primary dies. At demo scale, a
  # single Beat that the operator can restart is fine.
  celery-beat-standby:
    profiles: ["never"]
    deploy:
      replicas: 0
    depends_on: !override
      db:
        condition: service_healthy

  # ── Next.js web ────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/wegofwd2020-hub/studybuddy-web:latest
    build: !reset null
    pull_policy: always
    restart: always
    logging: *logging-cap
    command: ["node", "server.js"]   # production mode (built output)
    env_file: !override
      - .env.demo
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://demo.usestudybuddy.com/api/v1
      INTERNAL_API_URL: http://api:8000/api/v1
      # Used by /app/api/auth/logout to build the post-logout redirect URL.
      # Without this, the route falls back to http://localhost:3000 and the
      # browser ends up on a non-routable address.
      NEXT_PUBLIC_APP_URL: https://demo.usestudybuddy.com
    # Internal port only — Nginx fronts it.
    ports: []
    # Base compose bind-mounts ./web:/app for dev hot-reload, which overlays
    # the image's built server.js. Reset that, then mount only the operator-
    # synced tutorial MP4s at the path Next.js serves them from.
    volumes: !override
      - /data/videos:/app/public/videos:ro

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  # Terminates TLS via Cloudflare Origin Cert. Routes `/api/*` to the API
  # service and everything else to the Next.js web service. Serves static
  # asset directly from the content_store volume (faster than proxying via
  # FastAPI).
  nginx:
    image: nginx:alpine
    restart: always
    logging: *logging-cap
    # Loopback-only on 127.0.0.1:8443. The HOST nginx (installed by
    # scripts/demo/provision.sh step 5) listens on 0.0.0.0:80 + 0.0.0.0:443,
    # terminates TLS via the Cloudflare Origin Cert, and proxies plain HTTP
    # to this loopback port. Two nginxes can't both bind :443 on the host,
    # and only the host nginx can route both tenants (mambakkam + studybuddy)
    # by Host header — so this one lives behind it on a private port.
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./scripts/demo/nginx.conf:/etc/nginx/nginx.conf:ro
      - /data/content:/srv/content:ro              # serve audio MP3 + lesson JSON directly
      - /data/sample-visuals:/srv/sample-visuals:ro   # 44 tutorial MP4s + SVGs (gitignored; rsync'd by operator)
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes — persistent across `docker compose down` (NOT `down -v`)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  studybuddy_demo_pgdata:
    name: studybuddy_demo_pgdata
  studybuddy_demo_redis:
    name: studybuddy_demo_redis
