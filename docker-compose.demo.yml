# =============================================================================
# StudyBuddy OnDemand — Docker Compose: Demo (Hetzner) override
#
# Layered on top of the base `docker-compose.yml`. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml \
#     --env-file .env.demo up -d
#
# What this override does vs. local-dev compose:
#   - Drops PgBouncer (no connection pressure at demo scale; one less service)
#   - Drops celery-beat-standby (single Beat is fine for demo redundancy)
#   - Drops the stripe-cli profile (not relevant on a public demo box)
#   - Adds an Nginx reverse proxy that terminates HTTPS via Cloudflare cert
#   - Switches every service to `restart: always` so the box self-heals on reboot
#   - Pins explicit named volumes (so `docker compose down -v` does NOT eat data)
#   - Wires the API directly to PostgreSQL (no PgBouncer hop) via DATABASE_URL
#     override
#   - Pulls images from GHCR instead of building from source on the demo box
#     (faster cold-starts; no need for build toolchain on a 4 GB RAM VPS)
#
# Companion docs:
#   - docs/DEMO_LAUNCH_PLAN.md (this PR)
#   - studybuddy-docs/docs/dev/DEMO_HOSTING_GUIDE.md (Hetzner architecture)
# =============================================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # Same image as dev; production-style restart + named volume.
  db:
    restart: always
    volumes:
      - studybuddy_demo_pgdata:/var/lib/postgresql/data
    # No need to expose 5432 publicly — only internal services need it.
    ports: []

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    restart: always
    volumes:
      - studybuddy_demo_redis:/data
    ports: []

  # ── PgBouncer — DROPPED on demo ────────────────────────────────────────────
  # PgBouncer adds value at hundreds-of-connections scale. With ≤20 concurrent
  # demo users, asyncpg's built-in pool is sufficient. The API connects directly
  # to db:5432 instead of pgbouncer:5432.
  pgbouncer:
    profiles: ["never"]   # `profiles` makes the service inert unless explicitly enabled
    deploy:
      replicas: 0

  # ── Migrate (one-shot) ─────────────────────────────────────────────────────
  # Same one-shot behaviour. Compose deletes the container when it exits; the
  # image is pulled from GHCR rather than built locally.
  migrate:
    image: ghcr.io/wegofwd2020-hub/studybuddy-api:latest
    build: !reset null   # disable the local build directive from base compose
    pull_policy: always
    environment:
      # Talk to db directly — no PgBouncer on demo.
      DATABASE_URL: postgresql://studybuddy:${POSTGRES_PASSWORD}@db:5432/studybuddy

  # ── FastAPI ────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/wegofwd2020-hub/studybuddy-api:latest
    build: !reset null
    pull_policy: always
    restart: always
    environment:
      DATABASE_URL: postgresql://studybuddy:${POSTGRES_PASSWORD}@db:5432/studybuddy
      DIRECT_DB_URL: postgresql://studybuddy:${POSTGRES_PASSWORD}@db:5432/studybuddy
      APP_ENV: staging
      LOG_LEVEL: INFO
      SENTRY_ENVIRONMENT: demo
      # Two workers for a 2 vCPU box — gunicorn formula (2*N+1) without overcommitting RAM
      GUNICORN_WORKERS: "2"
    # No host-port mapping on demo — Nginx fronts everything.
    ports: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Celery worker (io + default queues) ────────────────────────────────────
  celery-worker:
    image: ghcr.io/wegofwd2020-hub/studybuddy-api:latest
    build: !reset null
    pull_policy: always
    restart: always
    environment:
      DATABASE_URL: postgresql://studybuddy:${POSTGRES_PASSWORD}@db:5432/studybuddy

  # ── Celery pipeline worker — DROPPED on demo ───────────────────────────────
  # The pipeline runs on the operator's dev machine for demo (no Anthropic key
  # on the demo box; no risk of unexpected API spend). See DEMO_HOSTING_GUIDE.md
  # §"Run the Pipeline on Your Dev Machine, Not on Demo".
  celery-pipeline:
    profiles: ["never"]
    deploy:
      replicas: 0

  # ── Celery Beat — single primary on demo ───────────────────────────────────
  celery-beat-primary:
    image: ghcr.io/wegofwd2020-hub/studybuddy-api:latest
    build: !reset null
    pull_policy: always
    restart: always
    environment:
      DATABASE_URL: postgresql://studybuddy:${POSTGRES_PASSWORD}@db:5432/studybuddy

  # ── Celery Beat standby — DROPPED on demo ─────────────────────────────────
  # The standby uses RedBeat to take over if primary dies. At demo scale, a
  # single Beat that the operator can restart is fine.
  celery-beat-standby:
    profiles: ["never"]
    deploy:
      replicas: 0

  # ── Next.js web ────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/wegofwd2020-hub/studybuddy-web:latest
    build: !reset null
    pull_policy: always
    restart: always
    command: ["node", "server.js"]   # production mode (built output)
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://demo.studybuddy.app/api/v1
      INTERNAL_API_URL: http://api:8000/api/v1
    # Internal port only — Nginx fronts it.
    ports: []

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  # Terminates TLS via Cloudflare Origin Cert. Routes `/api/*` to the API
  # service and everything else to the Next.js web service. Serves static
  # asset directly from the content_store volume (faster than proxying via
  # FastAPI).
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/demo/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
      - /data/content:/srv/content:ro   # serve audio MP3 + JSON directly
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes — persistent across `docker compose down` (NOT `down -v`)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  studybuddy_demo_pgdata:
    name: studybuddy_demo_pgdata
  studybuddy_demo_redis:
    name: studybuddy_demo_redis
