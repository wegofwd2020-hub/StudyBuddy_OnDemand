# =============================================================================
# .github/workflows/deploy-demo.yml — auto-deploy to demo VPS on merge to main
#
# Triggers:
#   - push to main (auto)
#   - workflow_dispatch (manual; useful for redeploying without a code change)
#
# Required repo secrets (configure under Settings → Secrets and variables → Actions):
#   DEMO_VPS_HOST       — e.g. demo.usestudybuddy.com or the VPS public IP
#   DEMO_VPS_USER       — e.g. deploy
#   DEMO_VPS_SSH_KEY    — private SSH key matching authorized_keys on the VPS
#                         (the public key is pasted into /home/deploy/.ssh/authorized_keys
#                         by scripts/demo/provision.sh)
#   GHCR_TOKEN          — personal access token with write:packages scope (for image push)
#                         (alternatively, configure GITHUB_TOKEN with packages:write)
#
# Flow:
#   1. CI tests pass first (the existing test.yml workflow does this on every push;
#      this workflow waits for that one to succeed via `workflow_run` trigger if
#      preferred, but here we re-check the basics inline to keep this one
#      self-contained)
#   2. Build api + web Docker images
#   3. Push images to GHCR tagged :latest and :<short-sha>
#   4. SSH to demo VPS; git pull; docker compose pull; up -d
#   5. Wait for healthchecks
#   6. Run scripts/demo/smoke.sh against the public domain
#   7. On smoke failure: open a GitHub issue tagged `incident:demo`
#   8. Post a deploy-summary comment on the most recent merge commit (success or failure)
# =============================================================================

name: Deploy — Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false   # never interrupt a running deploy mid-flight

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_REPO_OWNER: ${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ── 1. Build + push images ─────────────────────────────────────────────────
  build-and-push:
    name: Build + push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      # The deploy job checks the running containers against this exact tag,
      # so a stale box cannot report success (#583).
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v6

      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build + push API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/studybuddy-api:latest
            ghcr.io/${{ github.repository_owner }}/studybuddy-api:${{ steps.sha.outputs.short }}
          build-args: |
            BUILD_ID=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build + push web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/studybuddy-web:latest
            ghcr.io/${{ github.repository_owner }}/studybuddy-web:${{ steps.sha.outputs.short }}
          build-args: |
            NEXT_PUBLIC_DEMO_MODE=true
            NEXT_PUBLIC_BUILD_ID=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ── 2. Deploy to VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to demo VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write   # incident-opener step creates `incident:demo` issues
    steps:
      - name: Checkout (for scripts/demo/smoke.sh)
        uses: actions/checkout@v6

      - name: Add SSH host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEMO_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEMO_VPS_SSH_KEY }}

      - name: Pull latest code on VPS
        run: |
          ssh ${{ secrets.DEMO_VPS_USER }}@${{ secrets.DEMO_VPS_HOST }} \
            'cd /opt/studybuddy && sudo /usr/bin/git -C /opt/studybuddy pull --ff-only origin main'

      - name: Pull new images + roll services
        run: |
          ssh ${{ secrets.DEMO_VPS_USER }}@${{ secrets.DEMO_VPS_HOST }} '
            cd /opt/studybuddy && \
            sudo /usr/bin/docker compose \
              -f docker-compose.yml \
              -f docker-compose.demo.yml \
              --env-file .env.demo \
              pull && \
            sudo /usr/bin/docker compose \
              -f docker-compose.yml \
              -f docker-compose.demo.yml \
              --env-file .env.demo \
              up -d --remove-orphans
          '

      # `docker compose up -d` only recreates services whose spec changed.
      # Nginx is left alone in two failure modes:
      #   1. api/web rolled → their bridge-network IP changed but nginx keeps
      #      the old IP cached (mitigated since 2026-05-19 by resolver +
      #      variable-based proxy_pass in scripts/demo/nginx.conf, which
      #      re-resolves within 10s, but a force-recreate avoids the 10s window).
      #   2. scripts/demo/nginx.conf was edited → the single-file bind mount
      #      pinned the original inode at container-start; `git pull` replaces
      #      the file (new inode) and the running container can no longer see
      #      the new content. `nginx -s reload` doesn't help — it re-reads the
      #      same stale inode. Force-recreate is the only reliable fix.
      # Cost: ~2s of nginx unavailability per deploy. Acceptable at demo scale.
      - name: Force-recreate demo nginx (refresh config bind-mount + upstream IPs)
        run: |
          ssh ${{ secrets.DEMO_VPS_USER }}@${{ secrets.DEMO_VPS_HOST }} '
            cd /opt/studybuddy && \
            sudo /usr/bin/docker compose \
              -f docker-compose.yml \
              -f docker-compose.demo.yml \
              --env-file .env.demo \
              up -d --force-recreate --no-deps nginx
          '

      # The heart of #583: a green run used to prove only that commands exited 0.
      # On 2026-08-14 the box was still serving images from nine days earlier
      # while the workflow reported success, so every "merged and deployed"
      # claim — including ones made to the QA tester — rested on a separate
      # manual check.
      #
      # Compose pins `:latest`, so a pull that silently no-ops leaves the old
      # image running. The build job also tags `:<short-sha>`, which names
      # exactly what this run produced; comparing image IDs turns "did it ship?"
      # into a question the workflow can answer itself.
      # Was `sleep 30`. A fixed wait is a guess about startup time, and on
      # 2026-08-28 it guessed wrong: the smoke check ran against containers that
      # were still coming up, went red, and opened an incident (#687) for a
      # deploy that had in fact shipped correctly. A red run that actually
      # succeeded is worse than a slow one — the reflex is to roll back
      # something that is fine.
      - name: Wait until the demo is actually serving
        run: |
          set -uo pipefail
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                     https://demo.usestudybuddy.com/healthz --max-time 10 || echo 000)
            if [ "$code" = "200" ]; then
              echo "ready after $((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::demo did not return 200 from /healthz within 120s"
          exit 1

      # #583's acceptance, and the first version of this check got it wrong:
      # it compared image IDs over SSH using `sudo docker pull` / `inspect`,
      # which the deploy user is not permitted to run —
      #
      #   (root) NOPASSWD: /usr/bin/docker compose *, ...
      #
      # I had tested it as root, so it passed by hand and failed in CI. Asking
      # the running app what it is needs no sudo at all, and is what the issue
      # asked for: "compares a build identifier from the running app against the
      # commit being deployed".
      - name: Verify the demo is running THIS commit
        env:
          SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}
        run: |
          set -uo pipefail
          fail=0

          api=$(curl -s https://demo.usestudybuddy.com/api/v1/health --max-time 15 \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build",""))' \
                  2>/dev/null || echo "")
          if [ "$api" != "$SHORT_SHA" ]; then
            echo "::error::api is not running this commit — expected '$SHORT_SHA', got '$api'"
            fail=1
          else
            echo "api ok — running $SHORT_SHA"
          fi

          web=$(curl -s https://demo.usestudybuddy.com/build-id --max-time 15 \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_id",""))' \
                  2>/dev/null || echo "")
          if [ "$web" != "$SHORT_SHA" ]; then
            echo "::error::web is not running this commit — expected '$SHORT_SHA', got '$web'"
            fail=1
          else
            echo "web ok — running $SHORT_SHA"
          fi

          exit $fail

      # Smoke targets the public hostname, not DEMO_VPS_HOST. The latter is the
      # bare VPS IP used for SSH; hitting `https://<IP>/healthz` from the runner
      # fails with status=000 (no Cloudflare proxy, no valid origin TLS for that
      # SAN). Public URL is hardcoded — it's not a secret and is fixed per
      # docs/DEMO_LAUNCH_PLAN.md (Phase 2 DNS).
      - name: Run smoke check
        id: smoke
        run: |
          chmod +x scripts/demo/smoke.sh
          scripts/demo/smoke.sh https://demo.usestudybuddy.com
        continue-on-error: true   # let us open an issue on failure

      - name: Open incident issue on smoke failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.sha.substring(0, 8);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `incident:demo — smoke check failed after deploy ${sha}`,
              labels: ['incident:demo', 'priority:high'],
              body: [
                `Smoke check failed after auto-deploy of \`${sha}\` to demo.usestudybuddy.com.`,
                ``,
                `**Workflow run:** ${runUrl}`,
                ``,
                `**Triage:**`,
                `1. Visit the workflow run above; expand the "Run smoke check" step for the failed assertion.`,
                `2. SSH to the demo VPS and inspect: \`docker compose logs --tail=200 api\``,
                `3. If the issue is the deploy itself (not the code): roll back per the rollback section of \`docs/DEMO_LAUNCH_PLAN.md\` §2.`,
                `4. If the issue is the code: revert the offending commit and merge to main; this workflow will redeploy.`,
                ``,
                `Auto-rollback is intentionally **not** wired — the operator should triage and decide.`,
              ].join('\n'),
            });

      - name: Fail job if smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Post-deploy summary
        if: always()
        run: |
          echo "## Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** https://${{ secrets.DEMO_VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke result:** ${{ steps.smoke.outcome }}" >> $GITHUB_STEP_SUMMARY
