name: API Docs Regeneration

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC = 23:00 EST (00:00 EDT) — after progress (02:00) + drift (03:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      DOCS_WRITE_TOKEN_PRESENT: ${{ secrets.DOCS_REPO_WRITE_TOKEN != '' }}
    steps:
      - name: Skip if DOCS_REPO_WRITE_TOKEN not configured
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'false'
        run: |
          echo "::warning::DOCS_REPO_WRITE_TOKEN not set — api-docs regeneration skipped."
          echo "Add a fine-grained PAT with Contents:Read-and-write on wegofwd2020-hub/studybuddy-docs as repo secret DOCS_REPO_WRITE_TOKEN."
          exit 0

      - name: Checkout application repo
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout docs repo
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          repository: wegofwd2020-hub/studybuddy-docs
          token: ${{ secrets.DOCS_REPO_WRITE_TOKEN }}
          path: docs

      - name: Set up Python
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate API reference
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        run: |
          python3 app/scripts/generate_api_reference.py \
            --src app/backend/src \
            --out docs/docs/api/API_REFERENCE.md

      - name: Generate Celery task index
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        run: |
          python3 app/scripts/generate_celery_index.py \
            --src app/backend/src \
            --out docs/docs/api/CELERY_TASKS.md

      - name: Commit and push to docs repo if changed
        if: env.DOCS_WRITE_TOKEN_PRESENT == 'true'
        working-directory: docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/API_REFERENCE.md docs/api/CELERY_TASKS.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(api-docs): nightly regeneration from StudyBuddy_OnDemand

Auto-generated by .github/workflows/api-docs.yml in StudyBuddy_OnDemand.
Source: AST scan of backend/src/**/router.py + **/*.py for Celery tasks."
          git push
