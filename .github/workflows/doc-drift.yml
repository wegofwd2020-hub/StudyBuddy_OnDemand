name: Documentation Drift Check

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = 22:00 EST (23:00 EDT in summer)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      DOCS_TOKEN_PRESENT: ${{ secrets.DOCS_REPO_TOKEN != '' }}
    steps:
      # FAIL, do not skip.
      #
      # This step used to `exit 0` with a warning, so the job reported success
      # every night while checking nothing — a 4-second run whose only output was
      # an annotation nobody reads. The documentation it guards drifted for five
      # months (docs top out at migration 0048; the repo is at 0069) and this
      # check stayed green throughout.
      #
      # A guard that cannot run is broken, and broken things should look broken.
      - name: Require DOCS_REPO_TOKEN
        if: env.DOCS_TOKEN_PRESENT == 'false'
        run: |
          echo "::error::DOCS_REPO_TOKEN is not set — the drift check cannot run."
          echo ""
          echo "This job is failing on purpose. It previously exited 0 in this"
          echo "situation, which made an unconfigured check indistinguishable from"
          echo "a passing one."
          echo ""
          echo "Fix: add a PAT with Contents:read on wegofwd2020-hub/studybuddy-docs"
          echo "as the repository secret DOCS_REPO_TOKEN."
          echo "Or, if the drift check is no longer wanted, delete this workflow"
          echo "rather than leaving it permanently green and inert."
          exit 1

      - name: Checkout application repo
        if: env.DOCS_TOKEN_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout docs repo
        if: env.DOCS_TOKEN_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          repository: wegofwd2020-hub/studybuddy-docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs

      - name: Set up Python
        if: env.DOCS_TOKEN_PRESENT == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run drift scanner
        if: env.DOCS_TOKEN_PRESENT == 'true'
        id: drift
        run: |
          set +e
          python3 app/scripts/check_doc_drift.py \
            --app app \
            --docs docs/docs \
            --out drift-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # The scanner documents 0 = clean, 1 = drift. Any other code is the scanner
      # itself failing, and must not be reported to a human as "documentation
      # drift detected" — that sends them to edit docs over a broken script.
      - name: Fail if the scanner itself broke
        if: env.DOCS_TOKEN_PRESENT == 'true' && steps.drift.outputs.exit_code != '0' && steps.drift.outputs.exit_code != '1'
        run: |
          echo "::error::check_doc_drift.py exited ${{ steps.drift.outputs.exit_code }} — expected 0 (clean) or 1 (drift)."
          exit 1

      - name: Upsert drift issue
        if: env.DOCS_TOKEN_PRESENT == 'true' && steps.drift.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: app
        run: |
          # Ensure label exists (idempotent).
          gh label create doc-drift --color FFA500 --description "Documentation references that no longer exist in source" 2>/dev/null || true

          body=$(cat ../drift-report.md)
          existing=$(gh issue list --label doc-drift --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            echo "Updated existing drift issue #$existing"
          else
            gh issue create \
              --title "Documentation drift detected ($(date -u +%F))" \
              --label doc-drift \
              --body "$body"
          fi

      - name: Close drift issue if clean
        if: env.DOCS_TOKEN_PRESENT == 'true' && steps.drift.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: app
        run: |
          for n in $(gh issue list --label doc-drift --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Drift resolved as of $(date -u +%F)."
          done

      - name: Upload report artifact
        if: env.DOCS_TOKEN_PRESENT == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.md
          retention-days: 14
