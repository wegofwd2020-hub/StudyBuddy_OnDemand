name: Progress Chart

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 21:00 EST (22:00 EDT in summer)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so git log sees everything

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate progress.json
        run: python3 scripts/generate_progress.py

      - name: Commit and push progress.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/progress.json
          if git diff --cached --quiet; then
            echo "No changes to progress.json"
            exit 0
          fi
          git commit -m "chore(progress): nightly update of docs/progress.json"
          git push
