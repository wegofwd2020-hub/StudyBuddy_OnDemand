name: Progress Chart

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 21:00 EST (22:00 EDT in summer)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so git log sees everything

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate progress.json
        run: python3 scripts/generate_progress.py

      - name: Commit and push the regenerated chart if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # BOTH outputs. generate_progress.py writes docs/PROGRESS.md and
          # docs/progress.json, but only the JSON was ever staged — so the chart
          # was regenerated nightly and then thrown away. docs/PROGRESS.md last
          # changed 2026-07-06 while the job ran green every night, and the
          # README linked to it as "regenerated nightly".
          git add docs/PROGRESS.md docs/progress.json
          if git diff --cached --quiet; then
            echo "No changes to the progress chart"
            exit 0
          fi
          git commit -m "chore(progress): nightly update of the progress chart"
          git push
