<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Epsilon-delta definition of a limit">
  <title>ε-δ Definition of a Limit</title>
  <desc>Diagram of the formal limit definition: for every horizontal ε-band around L, there exists a vertical δ-band around a such that whenever 0 &lt; |x − a| &lt; δ, the value f(x) lies inside the ε-band.</desc>

  <defs>
    <style>
      .panel    { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .axis     { stroke: #94a3b8; stroke-width: 1.4; }
      .grid     { stroke: #e2e8f0; stroke-width: 0.6; }
      .curve    { fill: none; stroke: #2b6cb0; stroke-width: 3; stroke-linecap: round; }
      .epsband  { fill: #fef3c7; opacity: 0.55; }
      .deltaband{ fill: #ddd6fe; opacity: 0.55; }
      .epsline  { stroke: #d97706; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .deltaline{ stroke: #6b46c1; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .heading  { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .axislbl  { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .lbl      { font: bold 12px system-ui, sans-serif; }
      .note     { font: 11px system-ui, sans-serif; fill: #4a5568; }
      .markpt   { fill: #c05621; stroke: white; stroke-width: 2; }
    </style>
  </defs>

  <text class="heading" x="320" y="22">ε-δ definition: for every ε &gt; 0, there exists δ &gt; 0</text>

  <!-- Plot frame: x in [0, 4] mapped to [60, 380] (80 px per unit); y in [0, 4] mapped to [260, 60] (50 px per unit) -->
  <rect class="panel" x="60" y="60" width="320" height="200"/>

  <!-- L = 2 (py = 160), a = 2 (px = 220), eps = 0.6 → eps_top py = 130, eps_bot py = 190 (50·0.6 = 30 px),
       delta = 0.5 → delta_left px = 180, delta_right px = 260 (80·0.5 = 40 px) -->

  <!-- ε-band (horizontal yellow strip across plot) -->
  <rect class="epsband" x="60" y="130" width="320" height="60"/>
  <!-- δ-band (vertical purple strip across plot) -->
  <rect class="deltaband" x="180" y="60" width="80" height="200"/>

  <!-- grid -->
  <line class="grid" x1="140" y1="60" x2="140" y2="260"/>
  <line class="grid" x1="220" y1="60" x2="220" y2="260"/>
  <line class="grid" x1="300" y1="60" x2="300" y2="260"/>
  <line class="grid" x1="60"  y1="210" x2="380" y2="210"/>
  <line class="grid" x1="60"  y1="160" x2="380" y2="160"/>
  <line class="grid" x1="60"  y1="110" x2="380" y2="110"/>

  <!-- axes (no internal axis since we've put origin at lower-left of plot) -->
  <line class="axis" x1="60" y1="260" x2="380" y2="260"/>
  <line class="axis" x1="60" y1="60"  x2="60"  y2="260"/>

  <!-- f(x) chosen as a smooth increasing curve through (a, L) = (2, 2): use y = 0.5·x + 1 (line) for clarity -->
  <line class="curve" x1="60" y1="235" x2="380" y2="75"/>

  <!-- Mark (a, L) = (2, 2) -->
  <circle class="markpt" cx="220" cy="160" r="5"/>
  <text class="lbl" x="232" y="156" fill="#c05621">(a, L)</text>

  <!-- ε-band lines and labels -->
  <line class="epsline" x1="60" y1="130" x2="380" y2="130"/>
  <line class="epsline" x1="60" y1="190" x2="380" y2="190"/>
  <text class="lbl" x="55" y="134" fill="#d97706" text-anchor="end">L + ε</text>
  <text class="lbl" x="55" y="194" fill="#d97706" text-anchor="end">L − ε</text>
  <text class="lbl" x="55" y="164" fill="#1a202c" text-anchor="end">L</text>

  <!-- δ-band lines and labels -->
  <line class="deltaline" x1="180" y1="60" x2="180" y2="260"/>
  <line class="deltaline" x1="260" y1="60" x2="260" y2="260"/>
  <text class="lbl" x="180" y="276" fill="#6b46c1" text-anchor="middle">a − δ</text>
  <text class="lbl" x="220" y="276" fill="#1a202c" text-anchor="middle">a</text>
  <text class="lbl" x="260" y="276" fill="#6b46c1" text-anchor="middle">a + δ</text>

  <!-- Highlight the curve segment inside the δ-band -->
  <line x1="180" y1="145" x2="260" y2="175" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

  <!-- Right panel: formal definition -->
  <g transform="translate(410, 60)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
    <text font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" x="100" y="22" text-anchor="middle">Formal definition</text>
    <text font="11px system-ui" font-size="11" fill="#1a202c" x="14" y="46" font-style="italic">lim (x → a) f(x) = L</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="64">means: for every ε &gt; 0,</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="80">there exists δ &gt; 0 such that</text>
    <text font="11px system-ui" font-size="11" fill="#1a202c" x="14" y="100" font-style="italic">0 &lt; |x − a| &lt; δ</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="116">implies</text>
    <text font="11px system-ui" font-size="11" fill="#1a202c" x="14" y="134" font-style="italic">|f(x) − L| &lt; ε.</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="160">Read it as a game:</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="176">tell me any ε; I'll find δ.</text>
  </g>

  <!-- Caption -->
  <text x="220" y="316" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Inside the purple δ-band the curve stays inside the yellow ε-band — the limit holds.</text>
  <text x="220" y="334" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Make ε smaller and a smaller δ still works; that is what "lim = L" means.</text>
</svg>
