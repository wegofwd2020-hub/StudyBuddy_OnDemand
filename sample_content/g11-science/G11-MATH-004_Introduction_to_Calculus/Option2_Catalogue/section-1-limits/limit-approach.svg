<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Limit visualisation: f(x) approaches L as x approaches a">
  <title>Limit Approach: f(x) → L as x → a</title>
  <desc>Graph of f(x) = (x² − 1)/(x − 1) approaching the limit L = 2 as x approaches 1. A hollow circle marks the removable discontinuity at (1, 2); arrows show the function value approaching L from both sides.</desc>

  <defs>
    <style>
      .panel   { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .axis    { stroke: #94a3b8; stroke-width: 1.4; }
      .grid    { stroke: #e2e8f0; stroke-width: 0.6; }
      .curve   { fill: none; stroke: #2b6cb0; stroke-width: 3; stroke-linecap: round; }
      .approachL { stroke: #6b46c1; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .axislbl { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .lbl     { font: bold 12px system-ui, sans-serif; }
      .note    { font: 11px system-ui, sans-serif; fill: #4a5568; }
      .arrow   { stroke: #c05621; stroke-width: 1.6; fill: none; }
      .holept  { fill: white; stroke: #2b6cb0; stroke-width: 2.5; }
      .limpt   { fill: #6b46c1; stroke: white; stroke-width: 2; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c05621"/>
    </marker>
  </defs>

  <text class="heading" x="320" y="22">Limit:  lim (x → 1) of  (x² − 1)/(x − 1)  =  2</text>

  <!-- Plot frame: x ∈ [-1, 3] mapped to [60, 380], y ∈ [-1, 5] mapped to [260, 60] -->
  <rect class="panel" x="60" y="60" width="320" height="200"/>

  <!-- vertical grid x = 0,1,2,3 → px = 140,220,300,380 -->
  <line class="grid" x1="140" y1="60" x2="140" y2="260"/>
  <line class="grid" x1="220" y1="60" x2="220" y2="260"/>
  <line class="grid" x1="300" y1="60" x2="300" y2="260"/>
  <!-- horizontal grid y = 0,1,2,3,4 -->
  <line class="grid" x1="60" y1="227" x2="380" y2="227"/>
  <line class="grid" x1="60" y1="193" x2="380" y2="193"/>
  <line class="grid" x1="60" y1="160" x2="380" y2="160"/>
  <line class="grid" x1="60" y1="127" x2="380" y2="127"/>
  <line class="grid" x1="60" y1="93"  x2="380" y2="93"/>

  <!-- axes (x-axis at y=0 → py=227; y-axis at x=0 → px=140) -->
  <line class="axis" x1="60" y1="227" x2="380" y2="227"/>
  <line class="axis" x1="140" y1="60" x2="140" y2="260"/>

  <!-- tick labels -->
  <text class="axislbl" x="140" y="241">0</text>
  <text class="axislbl" x="220" y="241">1</text>
  <text class="axislbl" x="300" y="241">2</text>
  <text class="axislbl" x="370" y="241">3</text>
  <text class="axislbl" x="132" y="231" text-anchor="end">0</text>
  <text class="axislbl" x="132" y="197" text-anchor="end">1</text>
  <text class="axislbl" x="132" y="164" text-anchor="end">2</text>
  <text class="axislbl" x="132" y="131" text-anchor="end">3</text>
  <text class="axislbl" x="132" y="97"  text-anchor="end">4</text>
  <text class="axislbl" x="392" y="231">x</text>
  <text class="axislbl" x="140" y="55">y</text>

  <!-- f(x) = (x²-1)/(x-1) = x+1 for x ≠ 1.
       Plot the line y = x+1 over x∈[-1, 3] minus the point at x=1.
       Points: x=-1→(60,160); x=0→(140,193); x=1→(220,160 — HOLE); x=2→(300,127); x=3→(380,93).
       Map: x_px = 140 + 80·x;  y_px = 227 - 33·y -->
  <line class="curve" x1="60" y1="160" x2="218" y2="161"/>
  <line class="curve" x1="222" y1="159" x2="380" y2="93"/>

  <!-- Hollow circle at the removable discontinuity (1, 2) -->
  <circle class="holept" cx="220" cy="160" r="5"/>

  <!-- Dashed lines showing approach to L = 2 -->
  <line class="approachL" x1="60" y1="160" x2="380" y2="160"/>
  <line class="approachL" x1="220" y1="160" x2="220" y2="260"/>
  <text class="lbl" x="385" y="156" fill="#6b46c1" text-anchor="end">y = L = 2</text>
  <text class="lbl" x="226" y="76" fill="#6b46c1">x = 1</text>

  <!-- Approach arrows: x from left toward 1 -->
  <path class="arrow" d="M 175 200 Q 195 175, 215 162" marker-end="url(#arr)"/>
  <text class="note" x="155" y="218">x → 1⁻</text>
  <!-- x from right toward 1 -->
  <path class="arrow" d="M 265 145 Q 245 152, 225 159" marker-end="url(#arr)"/>
  <text class="note" x="270" y="143">x → 1⁺</text>

  <!-- Limit point indicator (small filled disc at L=2 on y-axis side, just informational) -->
  <circle class="limpt" cx="140" cy="160" r="4"/>

  <!-- Right panel: algebraic explanation -->
  <g transform="translate(410, 60)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
    <text font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" x="100" y="22" text-anchor="middle">Why the limit exists</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="46">Direct substitution gives 0/0,</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="60">an indeterminate form.</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="84">Factor and cancel:</text>
    <text font="13px system-ui" font-size="13" fill="#1a202c" x="14" y="104" font-style="italic">(x² − 1)/(x − 1)</text>
    <text font="13px system-ui" font-size="13" fill="#1a202c" x="14" y="122" font-style="italic">= (x − 1)(x + 1)/(x − 1)</text>
    <text font="13px system-ui" font-size="13" fill="#1a202c" x="14" y="140" font-style="italic">= x + 1   (x ≠ 1)</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="166">As x → 1, x + 1 → 2,</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="180">so the limit equals 2.</text>
  </g>

  <text x="320" y="296" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">A limit describes the value f(x) approaches; the function need not be defined at x = a.</text>
</svg>
