<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Derivative as instantaneous rate of change: position and velocity">
  <title>Derivative as Instantaneous Rate of Change</title>
  <desc>Position function s(t) = t² and its derivative s'(t) = 2t shown side by side; at time t = 2 the position is 4 and the velocity is 4 units per second.</desc>

  <defs>
    <style>
      .panel    { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .axis     { stroke: #94a3b8; stroke-width: 1.4; }
      .grid     { stroke: #e2e8f0; stroke-width: 0.6; }
      .posCurve { fill: none; stroke: #2b6cb0; stroke-width: 3; stroke-linecap: round; }
      .velCurve { fill: none; stroke: #c05621; stroke-width: 3; stroke-linecap: round; }
      .marker   { fill: #6b46c1; stroke: white; stroke-width: 2; }
      .heading  { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .axislbl  { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .lbl      { font: bold 12px system-ui, sans-serif; }
      .note     { font: 11px system-ui, sans-serif; fill: #4a5568; }
      .vline    { stroke: #6b46c1; stroke-width: 1.4; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <text class="heading" x="320" y="22">Position s(t) = t²    →    Velocity s'(t) = 2t</text>

  <!-- LEFT PLOT: position s(t) = t².  x in [0, 3] mapped to [40, 280] (80 px/unit), y in [0, 9] mapped to [240, 60] (20 px/unit). -->
  <rect class="panel" x="40" y="60" width="240" height="180"/>
  <line class="grid" x1="120" y1="60" x2="120" y2="240"/>
  <line class="grid" x1="200" y1="60" x2="200" y2="240"/>
  <line class="grid" x1="280" y1="60" x2="280" y2="240"/>
  <line class="grid" x1="40" y1="220" x2="280" y2="220"/>
  <line class="grid" x1="40" y1="180" x2="280" y2="180"/>
  <line class="grid" x1="40" y1="140" x2="280" y2="140"/>
  <line class="grid" x1="40" y1="100" x2="280" y2="100"/>
  <line class="grid" x1="40" y1="60"  x2="280" y2="60"/>
  <line class="axis" x1="40" y1="240" x2="280" y2="240"/>
  <line class="axis" x1="40" y1="60"  x2="40"  y2="240"/>

  <text class="axislbl" x="40"  y="254">0</text>
  <text class="axislbl" x="120" y="254">1</text>
  <text class="axislbl" x="200" y="254">2</text>
  <text class="axislbl" x="280" y="254">3</text>
  <text class="axislbl" x="34"  y="244" text-anchor="end">0</text>
  <text class="axislbl" x="34"  y="184" text-anchor="end">3</text>
  <text class="axislbl" x="34"  y="124" text-anchor="end">6</text>
  <text class="axislbl" x="34"  y="64"  text-anchor="end">9</text>
  <text class="axislbl" x="288" y="244">t</text>
  <text class="axislbl" x="40"  y="55">s</text>

  <!-- s(t) = t². Sample points: (0,0)→(40,240); (1,1)→(120,220); (2,4)→(200,160); (3,9)→(280,60).
       Map: x_px = 40 + 80t, y_px = 240 - 20·t² -->
  <polyline class="posCurve" points="40,240 60,239.75 80,239 100,237.75 120,220 140,201.25 160,180 180,156.25 200,160 200,160 220,93.75 240,52.5 280,60"/>
  <!-- Cleaner sampled curve for s = t² -->
  <polyline class="posCurve" points="40,240 80,239 120,220 160,180 200,160 200,160 240,80 280,60"/>

  <!-- Mark at t=2: s=4 → (200, 160) -->
  <line class="vline" x1="200" y1="60" x2="200" y2="240"/>
  <circle class="marker" cx="200" cy="160" r="5"/>
  <text class="lbl" x="208" y="156" fill="#6b46c1">s(2) = 4</text>

  <text class="lbl" x="160" y="76" fill="#2b6cb0" text-anchor="middle">s(t) = t²  (position)</text>

  <!-- RIGHT PLOT: velocity v(t) = 2t. x in [0, 3] mapped to [360, 600], y in [0, 7] mapped to [240, 60] -->
  <rect class="panel" x="360" y="60" width="240" height="180"/>
  <line class="grid" x1="440" y1="60" x2="440" y2="240"/>
  <line class="grid" x1="520" y1="60" x2="520" y2="240"/>
  <line class="grid" x1="600" y1="60" x2="600" y2="240"/>
  <line class="grid" x1="360" y1="200" x2="600" y2="200"/>
  <line class="grid" x1="360" y1="160" x2="600" y2="160"/>
  <line class="grid" x1="360" y1="120" x2="600" y2="120"/>
  <line class="grid" x1="360" y1="80"  x2="600" y2="80"/>
  <line class="axis" x1="360" y1="240" x2="600" y2="240"/>
  <line class="axis" x1="360" y1="60"  x2="360" y2="240"/>

  <text class="axislbl" x="360" y="254">0</text>
  <text class="axislbl" x="440" y="254">1</text>
  <text class="axislbl" x="520" y="254">2</text>
  <text class="axislbl" x="600" y="254">3</text>
  <text class="axislbl" x="354" y="244" text-anchor="end">0</text>
  <text class="axislbl" x="354" y="204" text-anchor="end">2</text>
  <text class="axislbl" x="354" y="164" text-anchor="end">4</text>
  <text class="axislbl" x="354" y="124" text-anchor="end">6</text>
  <text class="axislbl" x="608" y="244">t</text>
  <text class="axislbl" x="360" y="55">v</text>

  <!-- v(t) = 2t — straight line. (0,0)→(360,240); (3,6)→(600,120). -->
  <line class="velCurve" x1="360" y1="240" x2="600" y2="120"/>

  <!-- Mark at t=2: v=4 → (520, 160) -->
  <line class="vline" x1="520" y1="60" x2="520" y2="240"/>
  <circle class="marker" cx="520" cy="160" r="5"/>
  <text class="lbl" x="528" y="156" fill="#6b46c1">v(2) = 4</text>

  <text class="lbl" x="480" y="76" fill="#c05621" text-anchor="middle">v(t) = s'(t) = 2t  (velocity)</text>

  <!-- Bottom strip: meaning -->
  <g transform="translate(20, 270)">
    <rect x="0" y="0" width="600" height="92" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1"/>
    <text x="300" y="20" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">The derivative is the instantaneous rate of change.</text>
    <text x="20"  y="44" font="11px system-ui" font-size="11" fill="#1a202c"><tspan font-weight="600">Average velocity over [a, b]:</tspan>  (s(b) − s(a)) / (b − a)</text>
    <text x="20"  y="62" font="11px system-ui" font-size="11" fill="#1a202c"><tspan font-weight="600">Instantaneous velocity at t:</tspan>  s'(t) = lim (h → 0) (s(t+h) − s(t)) / h</text>
    <text x="20"  y="82" font="11px system-ui" font-size="11" fill="#4a5568" font-style="italic">For s(t) = t²: average velocity over [0, 2] is 2; instantaneous at t = 2 is 4.</text>
  </g>
</svg>
