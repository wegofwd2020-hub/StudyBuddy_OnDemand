<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Fundamental Theorem of Calculus: area under f equals difference of antiderivative values">
  <title>Fundamental Theorem of Calculus</title>
  <desc>Shaded area under f(x) = x² from a = 1 to b = 2 equals F(b) − F(a) where F(x) = x³/3; the value is 8/3 − 1/3 = 7/3.</desc>

  <defs>
    <style>
      .panel    { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .axis     { stroke: #94a3b8; stroke-width: 1.4; }
      .grid     { stroke: #e2e8f0; stroke-width: 0.6; }
      .curve    { fill: none; stroke: #2b6cb0; stroke-width: 3; stroke-linecap: round; }
      .area     { fill: #6b46c1; fill-opacity: 0.30; }
      .heading  { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .axislbl  { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .lbl      { font: bold 12px system-ui, sans-serif; }
      .note     { font: 11px system-ui, sans-serif; fill: #4a5568; }
      .vline    { stroke: #c05621; stroke-width: 1.4; stroke-dasharray: 4 4; }
      .Fcurve   { fill: none; stroke: #c05621; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 4; }
    </style>
  </defs>

  <text class="heading" x="320" y="22">FTC:   ∫ₐᵇ f(x) dx  =  F(b) − F(a)</text>

  <!-- LEFT plot: f(x) = x² with shaded area from a=1 to b=2 -->
  <!-- frame: x in [0, 2.5] mapped to [50, 350] (300/2.5 = 120 px/unit), y in [0, 5] mapped to [260, 60] (200/5 = 40 px/unit) -->
  <rect class="panel" x="50" y="60" width="300" height="200"/>

  <!-- xToPx(x) = 50 + 120·x; yToPx(y) = 260 - 40·y -->

  <!-- grid: x = 0.5, 1, 1.5, 2 → 110, 170, 230, 290 -->
  <line class="grid" x1="110" y1="60" x2="110" y2="260"/>
  <line class="grid" x1="170" y1="60" x2="170" y2="260"/>
  <line class="grid" x1="230" y1="60" x2="230" y2="260"/>
  <line class="grid" x1="290" y1="60" x2="290" y2="260"/>
  <!-- y grid: 1, 2, 3, 4 → 220, 180, 140, 100 -->
  <line class="grid" x1="50" y1="220" x2="350" y2="220"/>
  <line class="grid" x1="50" y1="180" x2="350" y2="180"/>
  <line class="grid" x1="50" y1="140" x2="350" y2="140"/>
  <line class="grid" x1="50" y1="100" x2="350" y2="100"/>

  <line class="axis" x1="50" y1="260" x2="350" y2="260"/>
  <line class="axis" x1="50" y1="60"  x2="50"  y2="260"/>

  <text class="axislbl" x="50"  y="276">0</text>
  <text class="axislbl" x="170" y="276">a = 1</text>
  <text class="axislbl" x="290" y="276">b = 2</text>
  <text class="axislbl" x="44"  y="264" text-anchor="end">0</text>
  <text class="axislbl" x="44"  y="224" text-anchor="end">1</text>
  <text class="axislbl" x="44"  y="184" text-anchor="end">2</text>
  <text class="axislbl" x="44"  y="144" text-anchor="end">3</text>
  <text class="axislbl" x="44"  y="104" text-anchor="end">4</text>
  <text class="axislbl" x="356" y="264">x</text>
  <text class="axislbl" x="50"  y="55">y</text>

  <!-- Shaded area from x=1 to x=2 under y = x². Sample fine path:
       x=1: y=1 → (170, 220).  x=1.25: y=1.5625 → (200, 197.5).  x=1.5: y=2.25 → (230, 170).
       x=1.75: y=3.0625 → (260, 137.5).  x=2: y=4 → (290, 100).
       Polygon: (170,260)-(170,220)-(200,197.5)-(230,170)-(260,137.5)-(290,100)-(290,260)-close. -->
  <path class="area" d="M 170 260 L 170 220 L 185 211.0 L 200 197.5 L 215 184.4 L 230 170 L 245 154.4 L 260 137.5 L 275 119.4 L 290 100 L 290 260 Z"/>

  <!-- Curve y = x² over x in [0, 2.2]:
       x=0(0,260); 0.25(0.0625,257.5); 0.5(0.25,250); 0.75(0.5625,237.5); 1(1,220); 1.25(1.5625,197.5);
       1.5(2.25,170); 1.75(3.0625,137.5); 2(4,100); 2.2(4.84,66.4) -->
  <polyline class="curve" points="50,260 80,257.5 110,250 140,237.5 170,220 200,197.5 230,170 260,137.5 290,100 314,68"/>

  <!-- Boundaries (vertical dashed at x = a and b) -->
  <line class="vline" x1="170" y1="60" x2="170" y2="260"/>
  <line class="vline" x1="290" y1="60" x2="290" y2="260"/>

  <!-- Area label -->
  <text class="lbl" x="230" y="200" fill="#6b46c1" text-anchor="middle">A</text>

  <!-- Caption under left plot -->
  <text x="200" y="296" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">f(x) = x²,  shaded area = ∫₁² x² dx</text>

  <!-- RIGHT panel: F(x) = x³/3 mini-plot showing F(b) - F(a) -->
  <g transform="translate(380, 60)">
    <rect x="0" y="0" width="240" height="200" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>

    <!-- Sub-plot frame: x in [0, 2.5] mapped to [10, 230] (220/2.5 = 88 px/unit); y in [0, 3.5] mapped to [180, 20] (160/3.5 = 45.71 px/unit).
         xToPx(x) = 10 + 88x; yToPx(y) = 180 - 45.71·y. -->

    <!-- ticks -->
    <line stroke="#94a3b8" stroke-width="1.4" x1="10" y1="180" x2="230" y2="180"/>
    <line stroke="#94a3b8" stroke-width="1.4" x1="10" y1="20" x2="10"  y2="180"/>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="10" y="194" text-anchor="middle">0</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="98" y="194" text-anchor="middle">a=1</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="186" y="194" text-anchor="middle">b=2</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="6" y="183" text-anchor="end">0</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="6" y="123" text-anchor="end">1</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="6" y="63" text-anchor="end">2</text>

    <!-- F(x) = x³/3.  F(0)=0; F(1)=1/3≈0.333; F(2)=8/3≈2.667.
         (0,0)→(10,180); (0.5,0.0417)→(54, 178.1); (1,0.333)→(98, 164.7); (1.5,1.125)→(142, 128.6); (2, 2.667)→(186, 58.1); (2.2, 3.549) clip to top? Actually y=3.549 → py=180-162.2=17.8 (above y_top=20). Use 2.15 → 3.31 → py=29.6 -->
    <polyline class="Fcurve" points="10,180 54,178.1 98,164.7 142,128.6 186,58.1 220,30"/>

    <!-- Mark F(a) and F(b) on curve -->
    <circle fill="#c05621" stroke="white" stroke-width="2" cx="98" cy="164.7" r="5"/>
    <circle fill="#c05621" stroke="white" stroke-width="2" cx="186" cy="58.1" r="5"/>

    <!-- Horizontal lines from points to y-axis -->
    <line stroke="#c05621" stroke-width="1.2" stroke-dasharray="3 3" x1="10" y1="164.7" x2="98" y2="164.7"/>
    <line stroke="#c05621" stroke-width="1.2" stroke-dasharray="3 3" x1="10" y1="58.1" x2="186" y2="58.1"/>

    <!-- Vertical lines from points to x-axis -->
    <line stroke="#c05621" stroke-width="1.2" stroke-dasharray="3 3" x1="98" y1="164.7" x2="98" y2="180"/>
    <line stroke="#c05621" stroke-width="1.2" stroke-dasharray="3 3" x1="186" y1="58.1" x2="186" y2="180"/>

    <!-- Brace-like indicator from F(a) to F(b) on left axis -->
    <line stroke="#6b46c1" stroke-width="2" x1="10" y1="58.1" x2="10" y2="164.7"/>
    <text font="bold 11px system-ui" font-size="11" font-weight="700" fill="#6b46c1" x="14" y="115">F(b) − F(a) = 7/3</text>

    <!-- Caption -->
    <text font="bold 11px system-ui" font-size="11" font-weight="700" fill="#c05621" x="120" y="16" text-anchor="middle">F(x) = x³/3</text>
  </g>

  <!-- Bottom strip: FTC statement and computation -->
  <g transform="translate(20, 310)">
    <rect x="0" y="0" width="600" height="60" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1"/>
    <text x="300" y="20" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">∫₁² x² dx = [ x³/3 ]₁² = 8/3 − 1/3 = 7/3 ≈ 2.333</text>
    <text x="300" y="42" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">The shaded area on the left equals the vertical jump  F(b) − F(a)  on the right.  Differentiation and integration are inverse operations.</text>
  </g>
</svg>
