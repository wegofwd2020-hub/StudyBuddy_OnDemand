<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Increasing and decreasing intervals identified by sign of the derivative">
  <title>Increasing / Decreasing Intervals from f'(x)</title>
  <desc>Curve f(x) = x³ − 3x with sign chart for f'(x) = 3x² − 3 = 3(x − 1)(x + 1); intervals (−∞, −1) and (1, ∞) where f' &gt; 0 are marked increasing, (−1, 1) where f' &lt; 0 is marked decreasing.</desc>

  <defs>
    <style>
      .panel    { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .axis     { stroke: #94a3b8; stroke-width: 1.4; }
      .grid     { stroke: #e2e8f0; stroke-width: 0.6; }
      .curveInc { fill: none; stroke: #2f855a; stroke-width: 4; stroke-linecap: round; }
      .curveDec { fill: none; stroke: #c05621; stroke-width: 4; stroke-linecap: round; }
      .heading  { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .axislbl  { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .lbl      { font: bold 12px system-ui, sans-serif; }
      .note     { font: 11px system-ui, sans-serif; fill: #4a5568; }
      .vline    { stroke: #6b46c1; stroke-width: 1.4; stroke-dasharray: 4 4; }
      .markpt   { stroke: white; stroke-width: 2; }
      .signRow  { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .pos      { fill: #2f855a; }
      .neg      { fill: #c05621; }
    </style>
  </defs>

  <text class="heading" x="320" y="22">f(x) = x³ − 3x:  f' &gt; 0 → increasing,  f' &lt; 0 → decreasing</text>

  <!-- Plot frame: x in [-2.2, 2.2] mapped to [60, 380] (320/4.4 = 72.73 px/unit), y in [-4.5, 4.5] mapped to [240, 60] (180/9 = 20 px/unit) -->
  <rect class="panel" x="60" y="60" width="320" height="180"/>

  <!-- grid (x integers -2..2 at px = 60+72.73·(x+2.2)). x=-2: 75; x=-1: 147; x=0: 220; x=1: 293; x=2: 365. -->
  <line class="grid" x1="75"  y1="60" x2="75"  y2="240"/>
  <line class="grid" x1="147" y1="60" x2="147" y2="240"/>
  <line class="grid" x1="293" y1="60" x2="293" y2="240"/>
  <line class="grid" x1="365" y1="60" x2="365" y2="240"/>
  <!-- y grid: -4,-2,2,4 -->
  <line class="grid" x1="60" y1="230" x2="380" y2="230"/>
  <line class="grid" x1="60" y1="190" x2="380" y2="190"/>
  <line class="grid" x1="60" y1="110" x2="380" y2="110"/>
  <line class="grid" x1="60" y1="70"  x2="380" y2="70"/>

  <!-- axes: x-axis y=0 → py = 240 - 0·20 = 240... but we set y center at y=0 → py = 240 - (0 - (-4.5))·20 = 240 - 90 = 150. Recompute: yToPx(0) = 240 - 20·(0-(-4.5)) = 240 - 90 = 150.
       Actually simpler: y axis from -4.5 (py=240) to 4.5 (py=60), so y=0 → py=150. -->
  <line class="axis" x1="60" y1="150" x2="380" y2="150"/>
  <line class="axis" x1="220" y1="60" x2="220" y2="240"/>

  <text class="axislbl" x="75"  y="262">−2</text>
  <text class="axislbl" x="147" y="262">−1</text>
  <text class="axislbl" x="220" y="262">0</text>
  <text class="axislbl" x="293" y="262">1</text>
  <text class="axislbl" x="365" y="262">2</text>
  <text class="axislbl" x="212" y="234" text-anchor="end">−4</text>
  <text class="axislbl" x="212" y="194" text-anchor="end">−2</text>
  <text class="axislbl" x="212" y="114" text-anchor="end">2</text>
  <text class="axislbl" x="212" y="74"  text-anchor="end">4</text>
  <text class="axislbl" x="392" y="154">x</text>
  <text class="axislbl" x="220" y="55">y</text>

  <!-- Plot f(x) = x³ - 3x.  yToPx(y) = 150 - 20·y; xToPx(x) = 220 + 72.73·x.
       Sample x = -2 → y=-2 → (75, 190); -1.5 → y=1.125 → (111, 128); -1 → y=2 → (147, 110); -0.5 → y=1.375 → (184, 122);
       0 → y=0 → (220, 150); 0.5 → y=-1.375 → (256, 178); 1 → y=-2 → (293, 190); 1.5 → y=-0.375 → (329, 158); 2 → y=2 → (365, 110). -->

  <!-- Increasing portion (x ≤ -1): green -->
  <polyline class="curveInc" points="75,190 111,128 147,110"/>
  <!-- Decreasing portion (-1 ≤ x ≤ 1): orange -->
  <polyline class="curveDec" points="147,110 184,122 220,150 256,178 293,190"/>
  <!-- Increasing portion (x ≥ 1): green -->
  <polyline class="curveInc" points="293,190 329,158 365,110"/>

  <!-- Critical points (x=-1, y=2) → (147, 110) local max; (x=1, y=-2) → (293, 190) local min -->
  <circle class="markpt" cx="147" cy="110" r="6" fill="#6b46c1"/>
  <circle class="markpt" cx="293" cy="190" r="6" fill="#6b46c1"/>
  <text class="lbl" x="141" y="100" fill="#6b46c1" text-anchor="end">local max (−1, 2)</text>
  <text class="lbl" x="299" y="206" fill="#6b46c1">local min (1, −2)</text>

  <!-- Vertical dashed lines at critical x-values -->
  <line class="vline" x1="147" y1="60" x2="147" y2="240"/>
  <line class="vline" x1="293" y1="60" x2="293" y2="240"/>

  <!-- Sign chart row underneath: derivative sign on intervals -->
  <g transform="translate(60, 290)">
    <rect class="signRow" x="0" y="0" width="320" height="60" rx="6"/>
    <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" x="160" y="16" text-anchor="middle">Sign of f'(x) = 3(x − 1)(x + 1)</text>
    <!-- Three colored bands beneath axis: -inf to -1; -1 to 1; 1 to inf -->
    <rect class="pos" x="6"   y="26" width="81" height="14"/>
    <rect class="neg" x="87"  y="26" width="146" height="14"/>
    <rect class="pos" x="233" y="26" width="81" height="14"/>
    <text x="46"  y="38" font="bold 11px system-ui" font-size="11" fill="white" text-anchor="middle">+</text>
    <text x="160" y="38" font="bold 11px system-ui" font-size="11" fill="white" text-anchor="middle">−</text>
    <text x="274" y="38" font="bold 11px system-ui" font-size="11" fill="white" text-anchor="middle">+</text>
    <text x="46"  y="54" font="11px system-ui" font-size="11" fill="#1a202c" text-anchor="middle">increasing</text>
    <text x="160" y="54" font="11px system-ui" font-size="11" fill="#1a202c" text-anchor="middle">decreasing</text>
    <text x="274" y="54" font="11px system-ui" font-size="11" fill="#1a202c" text-anchor="middle">increasing</text>
    <text x="86"  y="22" font="bold 10px system-ui" font-size="10" fill="#6b46c1" text-anchor="middle">−1</text>
    <text x="234" y="22" font="bold 10px system-ui" font-size="10" fill="#6b46c1" text-anchor="middle">1</text>
  </g>

  <!-- Right strip: rule -->
  <g transform="translate(410, 60)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
    <text font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" x="100" y="22" text-anchor="middle">First-derivative test</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="46">If  f'(x) &gt; 0  on (a, b),</text>
    <text font="11px system-ui" font-size="11" fill="#1a202c" x="14" y="62" font-weight="600">f is increasing there.</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="86">If  f'(x) &lt; 0  on (a, b),</text>
    <text font="11px system-ui" font-size="11" fill="#1a202c" x="14" y="102" font-weight="600">f is decreasing there.</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="128">Critical numbers: where</text>
    <text font="11px system-ui" font-size="11" fill="#1a202c" x="14" y="144" font-style="italic">f'(x) = 0  or  undefined.</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="170">Here  3x² − 3 = 0</text>
    <text font="11px system-ui" font-size="11" fill="#1a202c" x="14" y="186" font-style="italic">→  x = ±1.</text>
  </g>
</svg>
