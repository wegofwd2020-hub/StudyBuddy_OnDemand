<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Open, closed, and isolated thermodynamic systems">
  <title>Open, Closed, and Isolated Systems</title>
  <desc>Three side-by-side beakers illustrating the three types of thermodynamic system. Open: matter and energy can both cross the boundary. Closed: only energy crosses. Isolated: nothing crosses (rigid, insulated walls).</desc>

  <defs>
    <marker id="sys-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="sys-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
    <pattern id="insulation-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#92400e" stroke-width="2"/>
    </pattern>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">System, Surroundings, and Boundary</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">A "system" is the part of the universe under study. The "surroundings" are everything else. The "boundary" controls what crosses.</text>

  <!-- ═══ OPEN SYSTEM ═══ -->
  <g transform="translate(40, 70)">
    <text x="105" y="14" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Open System</text>

    <!-- Beaker (no lid) -->
    <path d="M 30 60 L 30 200 L 180 200 L 180 60" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.5"/>
    <line x1="20" y1="60" x2="190" y2="60" stroke="#2b6cb0" stroke-width="3"/>
    <!-- liquid -->
    <rect x="33" y="120" width="144" height="78" fill="#93c5fd" opacity="0.7"/>
    <!-- steam wisps -->
    <path d="M 70 120 Q 65 100 75 85 Q 80 70 70 50" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 105 120 Q 110 100 100 85 Q 95 70 105 45" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 140 120 Q 135 100 145 85 Q 150 70 140 50" fill="none" stroke="#94a3b8" stroke-width="2"/>

    <!-- arrows: matter out (top) -->
    <line x1="105" y1="55" x2="105" y2="20" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#sys-arrow-blue)"/>
    <text x="118" y="35" font-size="10" font-weight="700" fill="#2b6cb0">matter</text>

    <!-- arrows: heat in (side) -->
    <line x1="0" y1="160" x2="28" y2="160" stroke="#dc2626" stroke-width="2.5" marker-end="url(#sys-arrow-red)"/>
    <text x="-8" y="178" font-size="10" font-weight="700" fill="#dc2626">heat</text>

    <text x="105" y="225" font-size="11" fill="#1a202c" text-anchor="middle" font-weight="700">e.g. boiling water</text>
    <text x="105" y="242" font-size="10" fill="#4a5568" text-anchor="middle">in an open pot</text>
    <text x="105" y="262" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">matter ✓ &amp; energy ✓</text>
  </g>

  <!-- ═══ CLOSED SYSTEM ═══ -->
  <g transform="translate(265, 70)">
    <text x="105" y="14" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">Closed System</text>

    <!-- Sealed flask -->
    <path d="M 30 60 L 30 200 L 180 200 L 180 60" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.5"/>
    <line x1="20" y1="60" x2="190" y2="60" stroke="#2b6cb0" stroke-width="3"/>
    <!-- stopper / lid -->
    <rect x="80" y="40" width="50" height="22" fill="#92400e" stroke="#1a202c" stroke-width="2" rx="2"/>
    <text x="105" y="56" font-size="9" fill="#fef3c7" text-anchor="middle" font-weight="700">sealed</text>
    <!-- liquid -->
    <rect x="33" y="120" width="144" height="78" fill="#93c5fd" opacity="0.7"/>

    <!-- matter blocked: red X over a matter arrow -->
    <line x1="105" y1="40" x2="105" y2="20" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="98" y1="22" x2="112" y2="36" stroke="#dc2626" stroke-width="3"/>
    <line x1="112" y1="22" x2="98" y2="36" stroke="#dc2626" stroke-width="3"/>
    <text x="118" y="20" font-size="10" font-weight="700" fill="#dc2626">no matter</text>

    <!-- heat in -->
    <line x1="0" y1="160" x2="28" y2="160" stroke="#dc2626" stroke-width="2.5" marker-end="url(#sys-arrow-red)"/>
    <text x="-8" y="178" font-size="10" font-weight="700" fill="#dc2626">heat</text>

    <text x="105" y="225" font-size="11" fill="#1a202c" text-anchor="middle" font-weight="700">e.g. sealed flask</text>
    <text x="105" y="242" font-size="10" fill="#4a5568" text-anchor="middle">on a hot plate</text>
    <text x="105" y="262" font-size="11" fill="#2b6cb0" text-anchor="middle" font-weight="700">matter ✗ · energy ✓</text>
  </g>

  <!-- ═══ ISOLATED SYSTEM ═══ -->
  <g transform="translate(490, 70)">
    <text x="105" y="14" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Isolated System</text>

    <!-- Thermos with insulated walls -->
    <rect x="22" y="56" width="166" height="148" fill="url(#insulation-hatch)" stroke="#92400e" stroke-width="2"/>
    <rect x="36" y="70" width="138" height="120" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.5"/>
    <rect x="38" y="120" width="134" height="68" fill="#93c5fd" opacity="0.7"/>
    <!-- stopper -->
    <rect x="80" y="46" width="50" height="22" fill="#92400e" stroke="#1a202c" stroke-width="2" rx="2"/>

    <!-- All blocked -->
    <line x1="0" y1="130" x2="20" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="2" y1="124" x2="18" y2="138" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="18" y1="124" x2="2" y2="138" stroke="#dc2626" stroke-width="2.5"/>
    <text x="-8" y="155" font-size="10" font-weight="700" fill="#dc2626">no heat</text>

    <line x1="105" y1="40" x2="105" y2="20" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="98" y1="22" x2="112" y2="36" stroke="#dc2626" stroke-width="3"/>
    <line x1="112" y1="22" x2="98" y2="36" stroke="#dc2626" stroke-width="3"/>
    <text x="118" y="20" font-size="10" font-weight="700" fill="#dc2626">no matter</text>

    <text x="105" y="225" font-size="11" fill="#1a202c" text-anchor="middle" font-weight="700">e.g. ideal thermos</text>
    <text x="105" y="242" font-size="10" fill="#4a5568" text-anchor="middle">(perfect insulation)</text>
    <text x="105" y="262" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">matter ✗ · energy ✗</text>
  </g>

  <text x="360" y="320" font-size="11" fill="#4a5568" text-anchor="middle" font-style="italic">Whether energy or matter can cross the boundary determines the system type — and which thermodynamic laws apply directly.</text>
</svg>
