<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Entropy as a count of microstates">
  <title>Entropy = ln(microstates)</title>
  <desc>Two boxes show the same total energy distributed two different ways. Left: all four particles in the same low-energy box (only one arrangement; W = 1). Right: four particles distributed across many cells (many arrangements; large W). Boltzmann's relation S = k_B ln W links higher disorder to higher entropy.</desc>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Entropy — How Many Ways Can the System Be Arranged?</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">A microstate = one specific arrangement of particles + energy. More microstates → higher entropy (Boltzmann: S = k_B ln W).</text>

  <!-- ═══ ORDERED — low entropy (left) ═══ -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="280" height="220" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="140" y="-12" font-size="14" font-weight="700" fill="#2b6cb0" text-anchor="middle">Ordered  ·  low entropy</text>

    <!-- 4×4 grid of cells -->
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="70" y1="20" x2="70" y2="200"/>
      <line x1="140" y1="20" x2="140" y2="200"/>
      <line x1="210" y1="20" x2="210" y2="200"/>
      <line x1="20" y1="65" x2="260" y2="65"/>
      <line x1="20" y1="110" x2="260" y2="110"/>
      <line x1="20" y1="155" x2="260" y2="155"/>
    </g>
    <rect x="20" y="20" width="240" height="180" fill="none" stroke="#94a3b8" stroke-width="1"/>

    <!-- All 4 particles in one cell -->
    <circle cx="50" cy="180" r="8" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="62" cy="172" r="8" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="42" cy="170" r="8" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="55" cy="160" r="8" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>

    <!-- count -->
    <rect x="60" y="226" width="160" height="32" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="140" y="247" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">W = 1   →   S small</text>
  </g>

  <!-- ═══ DISORDERED — high entropy (right) ═══ -->
  <g transform="translate(400, 70)">
    <rect x="0" y="0" width="280" height="220" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="140" y="-12" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">Disordered  ·  high entropy</text>

    <!-- 4×4 grid -->
    <g stroke="#fca5a5" stroke-width="1">
      <line x1="70" y1="20" x2="70" y2="200"/>
      <line x1="140" y1="20" x2="140" y2="200"/>
      <line x1="210" y1="20" x2="210" y2="200"/>
      <line x1="20" y1="65" x2="260" y2="65"/>
      <line x1="20" y1="110" x2="260" y2="110"/>
      <line x1="20" y1="155" x2="260" y2="155"/>
    </g>
    <rect x="20" y="20" width="240" height="180" fill="none" stroke="#fca5a5" stroke-width="1"/>

    <!-- 4 particles spread out -->
    <circle cx="55" cy="42" r="8" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="195" cy="85" r="8" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="100" cy="135" r="8" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="240" cy="180" r="8" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>

    <!-- count -->
    <rect x="50" y="226" width="180" height="32" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="140" y="247" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">W = 16⁴⁄24 = 1820 → S large</text>
  </g>

  <!-- Equation -->
  <rect x="180" y="320" width="360" height="42" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="360" y="345" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">S = k_B · ln(W)</text>
  <text x="360" y="358" font-size="10" fill="#4a5568" text-anchor="middle">k_B = 1.381 × 10⁻²³ J/K  ·  W = number of equally likely microstates</text>
</svg>
