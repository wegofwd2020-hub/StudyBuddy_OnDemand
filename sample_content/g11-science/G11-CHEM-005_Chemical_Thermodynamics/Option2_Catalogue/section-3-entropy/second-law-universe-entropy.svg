<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Second law of thermodynamics — total entropy increases">
  <title>Second Law — Entropy of the Universe Always Increases</title>
  <desc>Two coupled balances. The system's entropy can decrease (water freezing into ice), provided the surroundings' entropy increases by more (heat released warms the room). The sum, ΔS_universe, is always positive for any spontaneous process.</desc>

  <defs>
    <marker id="sl-up" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#15803d"/>
    </marker>
    <marker id="sl-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Second Law — ΔS_universe ≥ 0</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">For any spontaneous process the total entropy of (system + surroundings) strictly increases. Local order is bought with global disorder.</text>

  <!-- ─── SYSTEM (left) ─── -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="240" height="180" rx="12" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="120" y="22" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">SYSTEM (the water)</text>

    <!-- Water turning to ice -->
    <ellipse cx="70" cy="100" rx="36" ry="28" fill="#93c5fd" stroke="#1a202c" stroke-width="1.5"/>
    <text x="70" y="105" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">H₂O(l)</text>

    <line x1="115" y1="100" x2="155" y2="100" stroke="#1a202c" stroke-width="2" marker-end="url(#sl-down)"/>

    <rect x="170" y="78" width="56" height="44" fill="#bfdbfe" stroke="#1a202c" stroke-width="1.5"/>
    <line x1="170" y1="92" x2="226" y2="92" stroke="#ffffff" stroke-width="1"/>
    <line x1="184" y1="78" x2="184" y2="122" stroke="#ffffff" stroke-width="1"/>
    <line x1="212" y1="78" x2="212" y2="122" stroke="#ffffff" stroke-width="1"/>
    <text x="198" y="106" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">H₂O(s)</text>

    <text x="120" y="148" font-size="11" fill="#4a5568" text-anchor="middle">water → ice (more order)</text>

    <rect x="20" y="158" width="200" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="120" y="172" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">ΔS_system &lt; 0</text>
  </g>

  <!-- + sign -->
  <text x="320" y="180" font-size="36" font-weight="700" fill="#1a202c" text-anchor="middle">+</text>

  <!-- ─── SURROUNDINGS (right) ─── -->
  <g transform="translate(340, 80)">
    <rect x="0" y="0" width="240" height="180" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="120" y="22" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">SURROUNDINGS (the room)</text>

    <!-- Heat coming out of system, warming surroundings -->
    <path d="M 30 100 Q 50 80 80 100 Q 110 120 140 100" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M 30 130 Q 50 110 80 130 Q 110 150 140 130" fill="none" stroke="#fb923c" stroke-width="2.5"/>
    <text x="80" y="76" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">heat released</text>

    <!-- room thermometer -->
    <rect x="172" y="60" width="14" height="78" rx="3" fill="#f7fafc" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="179" cy="146" r="14" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <rect x="174" y="84" width="10" height="56" fill="#dc2626"/>
    <line x1="190" y1="76" x2="200" y2="76" stroke="#1a202c" stroke-width="1"/>
    <line x1="190" y1="98" x2="200" y2="98" stroke="#1a202c" stroke-width="1"/>
    <line x1="190" y1="120" x2="200" y2="120" stroke="#1a202c" stroke-width="1"/>
    <text x="218" y="78" font-size="9" fill="#4a5568">+T</text>
    <text x="218" y="124" font-size="9" fill="#4a5568">−T</text>

    <text x="120" y="148" font-size="11" fill="#4a5568" text-anchor="middle">heat spreads in room (more disorder)</text>

    <rect x="20" y="158" width="200" height="20" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
    <text x="120" y="172" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">ΔS_surroundings &gt; 0</text>
  </g>

  <!-- = sign -->
  <text x="360" y="298" font-size="36" font-weight="700" fill="#1a202c" text-anchor="middle">=</text>

  <!-- Universe sum -->
  <rect x="170" y="306" width="380" height="44" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="360" y="328" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">ΔS_universe = ΔS_system + ΔS_surroundings &gt; 0</text>
  <text x="360" y="345" font-size="10" fill="#4a5568" text-anchor="middle">If the heat dump beats the local ordering, freezing is spontaneous.</text>
</svg>
