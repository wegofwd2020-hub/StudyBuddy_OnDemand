<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Free expansion of a gas — entropy increase">
  <title>Free Expansion — Why Gases Spread Out</title>
  <desc>Two connected chambers separated by a partition. Before: all gas particles in the left half (low W, low S). The partition opens. After: particles fill both halves uniformly (much larger W, much larger S). Spreading happens spontaneously because the spread state has overwhelmingly more microstates.</desc>

  <defs>
    <marker id="exp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Free Expansion of an Ideal Gas — Entropy Increases</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">Same atoms, same energy. Doubling the volume doubles the addresses each particle can occupy → enormous gain in microstates.</text>

  <!-- ─── BEFORE ─── -->
  <g transform="translate(40, 70)">
    <text x="140" y="-2" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Before — partition closed</text>

    <rect x="0" y="20" width="280" height="160" fill="#f7fafc" stroke="#1a202c" stroke-width="2.5"/>
    <line x1="140" y1="20" x2="140" y2="180" stroke="#dc2626" stroke-width="4"/>
    <text x="140" y="200" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">partition</text>

    <!-- Left side: 16 dots crowded -->
    <g fill="#2b6cb0" stroke="#1a202c" stroke-width="0.8">
      <circle cx="22" cy="38" r="4"/><circle cx="48" cy="56" r="4"/>
      <circle cx="78" cy="42" r="4"/><circle cx="110" cy="60" r="4"/>
      <circle cx="32" cy="80" r="4"/><circle cx="68" cy="92" r="4"/>
      <circle cx="100" cy="80" r="4"/><circle cx="120" cy="100" r="4"/>
      <circle cx="40" cy="116" r="4"/><circle cx="80" cy="130" r="4"/>
      <circle cx="20" cy="150" r="4"/><circle cx="62" cy="158" r="4"/>
      <circle cx="98" cy="142" r="4"/><circle cx="124" cy="170" r="4"/>
      <circle cx="50" cy="172" r="4"/><circle cx="105" cy="168" r="4"/>
    </g>
    <!-- Right side: empty -->
    <text x="210" y="105" font-size="14" font-style="italic" fill="#94a3b8" text-anchor="middle">vacuum</text>

    <rect x="20" y="220" width="240" height="50" rx="6" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="140" y="240" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Volume V  ·  N particles</text>
    <text x="140" y="258" font-size="11" fill="#4a5568" text-anchor="middle">microstates W₁ small  ·  S₁ low</text>
  </g>

  <!-- Arrow between -->
  <line x1="350" y1="160" x2="396" y2="160" stroke="#15803d" stroke-width="3" marker-end="url(#exp-arrow)"/>
  <text x="373" y="148" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">remove</text>
  <text x="373" y="180" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">partition</text>

  <!-- ─── AFTER ─── -->
  <g transform="translate(400, 70)">
    <text x="140" y="-2" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">After — gas fills both sides</text>

    <rect x="0" y="20" width="280" height="160" fill="#f7fafc" stroke="#1a202c" stroke-width="2.5"/>
    <line x1="140" y1="20" x2="140" y2="180" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- 16 dots scattered across both halves -->
    <g fill="#2b6cb0" stroke="#1a202c" stroke-width="0.8">
      <circle cx="22" cy="42" r="4"/><circle cx="58" cy="38" r="4"/>
      <circle cx="100" cy="50" r="4"/><circle cx="155" cy="44" r="4"/>
      <circle cx="195" cy="58" r="4"/><circle cx="240" cy="40" r="4"/>
      <circle cx="38" cy="86" r="4"/><circle cx="78" cy="92" r="4"/>
      <circle cx="118" cy="80" r="4"/><circle cx="170" cy="92" r="4"/>
      <circle cx="218" cy="84" r="4"/><circle cx="262" cy="98" r="4"/>
      <circle cx="48" cy="138" r="4"/><circle cx="98" cy="148" r="4"/>
      <circle cx="148" cy="138" r="4"/><circle cx="208" cy="158" r="4"/>
    </g>

    <rect x="20" y="220" width="240" height="50" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="140" y="240" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Volume 2V  ·  N particles</text>
    <text x="140" y="258" font-size="11" fill="#4a5568" text-anchor="middle">microstates W₂ = 2ᴺ × W₁  ·  S₂ ≫ S₁</text>
  </g>

  <!-- ΔS bar -->
  <rect x="120" y="298" width="480" height="36" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="360" y="320" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">ΔS = N · k_B · ln 2  &gt; 0   ·   for one mole: ΔS ≈ +5.76 J/K</text>
  <text x="360" y="350" font-size="11" fill="#4a5568" text-anchor="middle" font-style="italic">No heat is needed. Spreading is favoured by sheer counting — order is one outcome; spread is many.</text>
</svg>
