<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Hess's law thermochemical cycle">
  <title>Hess's Law — Adding Reaction Steps</title>
  <desc>A thermochemical cycle for the formation of CO₂ from C(s) and O₂(g). Direct path: ΔH₁ = −393.5 kJ. Two-step path through CO(g): ΔH₂ + ΔH₃ = −110.5 + (−283.0) = −393.5 kJ. The two paths give the same total because enthalpy is a state function.</desc>

  <defs>
    <marker id="hess-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c"/>
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Hess's Law — Enthalpy Adds Along Any Path</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">If a reaction can be written as a sum of steps, ΔH for the overall reaction is the sum of the steps' ΔH values.</text>

  <!-- Three boxes: top-left reactants, top-right intermediate, bottom products -->

  <!-- Reactants box (top-left) -->
  <rect x="60" y="80" width="220" height="80" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="170" y="110" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">C(s) + O₂(g)</text>
  <text x="170" y="135" font-size="11" fill="#4a5568" text-anchor="middle">graphite + dioxygen</text>
  <text x="170" y="152" font-size="10" fill="#64748b" text-anchor="middle">START state</text>

  <!-- Intermediate box (top-right) -->
  <rect x="440" y="80" width="220" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="550" y="110" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">CO(g) + ½ O₂(g)</text>
  <text x="550" y="135" font-size="11" fill="#4a5568" text-anchor="middle">carbon monoxide</text>
  <text x="550" y="152" font-size="10" fill="#64748b" text-anchor="middle">INTERMEDIATE</text>

  <!-- Products box (bottom-centre) -->
  <rect x="240" y="270" width="240" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="360" y="300" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">CO₂(g)</text>
  <text x="360" y="325" font-size="11" fill="#4a5568" text-anchor="middle">carbon dioxide</text>
  <text x="360" y="342" font-size="10" fill="#64748b" text-anchor="middle">FINAL state</text>

  <!-- Arrow: direct path (R → P), bold across diagonal -->
  <line x1="220" y1="160" x2="300" y2="270" stroke="#1a202c" stroke-width="3" marker-end="url(#hess-arrow)"/>
  <rect x="178" y="190" width="120" height="36" rx="6" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
  <text x="238" y="208" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">ΔH₁ (direct)</text>
  <text x="238" y="222" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">−393.5 kJ</text>

  <!-- Arrow: step 1 (R → I) -->
  <line x1="280" y1="120" x2="438" y2="120" stroke="#1a202c" stroke-width="2.5" marker-end="url(#hess-arrow)"/>
  <rect x="320" y="80" width="80" height="32" rx="6" fill="#ffffff" stroke="#1a202c" stroke-width="1.2"/>
  <text x="360" y="96" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">ΔH₂</text>
  <text x="360" y="108" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">−110.5 kJ</text>

  <!-- Arrow: step 2 (I → P) -->
  <line x1="540" y1="160" x2="430" y2="270" stroke="#1a202c" stroke-width="2.5" marker-end="url(#hess-arrow)"/>
  <rect x="478" y="190" width="100" height="36" rx="6" fill="#ffffff" stroke="#1a202c" stroke-width="1.2"/>
  <text x="528" y="208" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">ΔH₃</text>
  <text x="528" y="222" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">−283.0 kJ</text>

  <!-- Verification line -->
  <rect x="120" y="358" width="480" height="20" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
  <text x="360" y="372" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">ΔH₁ = ΔH₂ + ΔH₃ →  −393.5 = (−110.5) + (−283.0) ✓</text>
</svg>
