<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Spontaneity vs rate decision tree">
  <title>Spontaneity vs Rate — Two Different Questions</title>
  <desc>A decision tree for analysing any reaction. First branch: is ΔG &lt; 0? If no, the forward reaction is non-spontaneous. If yes, ask the second question: is the activation energy E_a low enough at this T? If no, it's spontaneous but slow (use a catalyst or raise T). If yes, the reaction proceeds rapidly. Examples are pinned to each leaf.</desc>

  <defs>
    <marker id="dt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c"/>
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Putting It All Together — Spontaneity vs Rate</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">Thermodynamics says <tspan font-style="italic">whether</tspan> a reaction can happen.   Kinetics says <tspan font-style="italic">how fast</tspan> it does. Both must be favourable for an observed reaction.</text>

  <!-- Root: ΔG -->
  <rect x="280" y="64" width="160" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="360" y="86" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">Question 1</text>
  <text x="360" y="106" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Is ΔG &lt; 0?</text>

  <!-- Branch left (No) -->
  <line x1="320" y1="120" x2="170" y2="170" stroke="#1a202c" stroke-width="2" marker-end="url(#dt-arrow)"/>
  <text x="220" y="138" font-size="11" font-weight="700" fill="#dc2626">No</text>

  <!-- Leaf: non-spontaneous -->
  <rect x="40" y="172" width="240" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="160" y="194" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Non-spontaneous (forward)</text>
  <text x="160" y="216" font-size="11" fill="#1a202c" text-anchor="middle">Reverse reaction is favoured.</text>
  <text x="160" y="232" font-size="11" fill="#1a202c" text-anchor="middle">Drive it with energy input</text>
  <text x="160" y="248" font-size="11" fill="#1a202c" text-anchor="middle">(e.g. electrolysis, photosynthesis).</text>

  <!-- Branch right (Yes) -->
  <line x1="400" y1="120" x2="540" y2="170" stroke="#1a202c" stroke-width="2" marker-end="url(#dt-arrow)"/>
  <text x="500" y="138" font-size="11" font-weight="700" fill="#15803d">Yes</text>

  <!-- Question 2: Ea low? -->
  <rect x="460" y="172" width="220" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="570" y="194" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Question 2</text>
  <text x="570" y="214" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Is E_a low at this T?</text>

  <!-- Q2 branch left (No) -->
  <line x1="500" y1="228" x2="380" y2="290" stroke="#1a202c" stroke-width="2" marker-end="url(#dt-arrow)"/>
  <text x="430" y="252" font-size="11" font-weight="700" fill="#dc2626">No</text>

  <!-- Leaf: slow -->
  <rect x="240" y="296" width="280" height="84" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="380" y="318" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Spontaneous but slow</text>
  <text x="380" y="338" font-size="11" fill="#1a202c" text-anchor="middle">Diamond → graphite at room T (centuries)</text>
  <text x="380" y="354" font-size="11" fill="#1a202c" text-anchor="middle">H₂ + O₂ at room T (no spark)</text>
  <text x="380" y="370" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Fix: catalyst, or higher T.</text>

  <!-- Q2 branch right (Yes) -->
  <line x1="640" y1="228" x2="640" y2="290" stroke="#1a202c" stroke-width="2" marker-end="url(#dt-arrow)"/>
  <text x="654" y="262" font-size="11" font-weight="700" fill="#15803d">Yes</text>

  <!-- Leaf: spontaneous and fast -->
  <rect x="540" y="296" width="160" height="84" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="620" y="318" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Spontaneous &amp; fast</text>
  <text x="620" y="338" font-size="11" fill="#1a202c" text-anchor="middle">Acid–base mixing</text>
  <text x="620" y="354" font-size="11" fill="#1a202c" text-anchor="middle">Burning paper</text>
  <text x="620" y="370" font-size="11" fill="#1a202c" text-anchor="middle">(once lit)</text>
</svg>
