<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Homologous series of alkanes — methane through pentane with boiling point trend">
  <title>Homologous Series — Alkanes (CₙH₂ₙ₊₂)</title>
  <desc>The first five alkanes follow the formula CnH2n+2. Each member differs from the next by a single CH2 unit. Boiling point rises smoothly with chain length because London dispersion forces grow with surface area.</desc>

  <text x="380" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Homologous Series — Alkanes (CₙH₂ₙ₊₂)</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Each member differs by –CH₂– · gradual property change · same chemistry</text>

  <!-- table -->
  <rect x="20" y="60" width="720" height="280" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- header -->
  <rect x="20" y="60" width="720" height="36" fill="#1e293b" />
  <text x="70"  y="84" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">n</text>
  <text x="170" y="84" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Name</text>
  <text x="320" y="84" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Formula</text>
  <text x="490" y="84" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Skeletal</text>
  <text x="670" y="84" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">b.p. (°C)</text>

  <!-- col dividers -->
  <line x1="120" y1="60" x2="120" y2="340" stroke="#cbd5e1" stroke-width="1" />
  <line x1="220" y1="60" x2="220" y2="340" stroke="#cbd5e1" stroke-width="1" />
  <line x1="420" y1="60" x2="420" y2="340" stroke="#cbd5e1" stroke-width="1" />
  <line x1="620" y1="60" x2="620" y2="340" stroke="#cbd5e1" stroke-width="1" />

  <!-- row 1: methane -->
  <text x="70" y="124" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">1</text>
  <text x="170" y="124" font-size="12" fill="#1a202c" text-anchor="middle">Methane</text>
  <text x="320" y="124" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">CH₄</text>
  <!-- single carbon dot -->
  <circle cx="520" cy="120" r="4" fill="#1a202c" />
  <text x="670" y="124" font-size="12" fill="#1a202c" text-anchor="middle">−161.5</text>
  <line x1="20" y1="140" x2="740" y2="140" stroke="#e2e8f0" stroke-width="1" />

  <!-- row 2: ethane -->
  <text x="70" y="166" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">2</text>
  <text x="170" y="166" font-size="12" fill="#1a202c" text-anchor="middle">Ethane</text>
  <text x="320" y="166" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">C₂H₆</text>
  <line x1="500" y1="160" x2="540" y2="160" stroke="#1a202c" stroke-width="2" />
  <text x="670" y="166" font-size="12" fill="#1a202c" text-anchor="middle">−88.6</text>
  <line x1="20" y1="184" x2="740" y2="184" stroke="#e2e8f0" stroke-width="1" />

  <!-- row 3: propane -->
  <text x="70" y="210" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">3</text>
  <text x="170" y="210" font-size="12" fill="#1a202c" text-anchor="middle">Propane</text>
  <text x="320" y="210" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">C₃H₈</text>
  <polyline points="490,210 510,196 530,210" fill="none" stroke="#1a202c" stroke-width="2" />
  <text x="670" y="210" font-size="12" fill="#1a202c" text-anchor="middle">−42.1</text>
  <line x1="20" y1="228" x2="740" y2="228" stroke="#e2e8f0" stroke-width="1" />

  <!-- row 4: butane -->
  <text x="70" y="254" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">4</text>
  <text x="170" y="254" font-size="12" fill="#1a202c" text-anchor="middle">Butane</text>
  <text x="320" y="254" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">C₄H₁₀</text>
  <polyline points="478,256 500,240 522,256 544,240" fill="none" stroke="#1a202c" stroke-width="2" />
  <text x="670" y="254" font-size="12" fill="#1a202c" text-anchor="middle">−0.5</text>
  <line x1="20" y1="272" x2="740" y2="272" stroke="#e2e8f0" stroke-width="1" />

  <!-- row 5: pentane -->
  <text x="70" y="298" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">5</text>
  <text x="170" y="298" font-size="12" fill="#1a202c" text-anchor="middle">Pentane</text>
  <text x="320" y="298" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">C₅H₁₂</text>
  <polyline points="466,300 488,282 510,300 532,282 554,300" fill="none" stroke="#1a202c" stroke-width="2" />
  <text x="670" y="298" font-size="12" fill="#1a202c" text-anchor="middle">+36.1</text>
  <line x1="20" y1="316" x2="740" y2="316" stroke="#e2e8f0" stroke-width="1" />

  <!-- row 6: ellipsis -->
  <text x="70" y="332" font-size="13" font-weight="700" fill="#4a5568" text-anchor="middle">…</text>
  <text x="380" y="332" font-size="11" fill="#4a5568" text-anchor="middle">add another –CH₂– group → next homologue</text>

  <!-- ── boiling point trend chart ─────────────────────────────────────── -->
  <g transform="translate(20, 360)">
    <text x="360" y="0" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Boiling point trend — gradual rise with chain length</text>

    <!-- axes -->
    <line x1="60" y1="80" x2="700" y2="80" stroke="#475569" stroke-width="1.5" />
    <line x1="60" y1="80" x2="60"  y2="14" stroke="#475569" stroke-width="1.5" />

    <!-- y-axis ticks -->
    <text x="55" y="80" font-size="9" fill="#475569" text-anchor="end">−200</text>
    <text x="55" y="50" font-size="9" fill="#475569" text-anchor="end">−100</text>
    <text x="55" y="20" font-size="9" fill="#475569" text-anchor="end">0</text>
    <line x1="56" y1="50" x2="60" y2="50" stroke="#475569" stroke-width="1" />
    <line x1="56" y1="20" x2="60" y2="20" stroke="#475569" stroke-width="1" />

    <!-- x-axis labels -->
    <text x="160" y="94" font-size="9" fill="#475569" text-anchor="middle">CH₄</text>
    <text x="280" y="94" font-size="9" fill="#475569" text-anchor="middle">C₂H₆</text>
    <text x="400" y="94" font-size="9" fill="#475569" text-anchor="middle">C₃H₈</text>
    <text x="520" y="94" font-size="9" fill="#475569" text-anchor="middle">C₄H₁₀</text>
    <text x="640" y="94" font-size="9" fill="#475569" text-anchor="middle">C₅H₁₂</text>

    <!-- data points: y = 80 - (bp + 200) / 200 * 60  (scale −200..0 over 60px) -->
    <!-- −161.5 → 80 - 38.5/200*60 = 80 - 11.55 = 68.45 -->
    <!-- −88.6  → 80 - 111.4/200*60 = 80 - 33.42 = 46.58 -->
    <!-- −42.1  → 80 - 157.9/200*60 = 80 - 47.37 = 32.63 -->
    <!-- −0.5   → 80 - 199.5/200*60 = 80 - 59.85 = 20.15 -->
    <!-- 36.1   → 80 - 236.1/200*60 = 80 - 70.83 = 9.17  -->
    <polyline points="160,68.5 280,46.6 400,32.6 520,20.2 640,9.2"
      fill="none" stroke="#7c3aed" stroke-width="2.5" />

    <circle cx="160" cy="68.5" r="5" fill="#7c3aed" />
    <circle cx="280" cy="46.6" r="5" fill="#7c3aed" />
    <circle cx="400" cy="32.6" r="5" fill="#7c3aed" />
    <circle cx="520" cy="20.2" r="5" fill="#7c3aed" />
    <circle cx="640" cy="9.2" r="5" fill="#7c3aed" />
  </g>
</svg>
