<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-label="n-butane in five representations — molecular, condensed, expanded structural, skeletal and 3D">
  <title>n-Butane — Five Ways to Draw the Same Molecule</title>
  <desc>The same n-butane (C4H10) drawn five ways. Molecular formula counts atoms. Condensed merges H's onto each carbon. Expanded structural draws every C–H bond. Skeletal hides carbons and H's at the vertices. Wedge–dash 3D shows true tetrahedral geometry at each carbon.</desc>

  <text x="410" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">n-Butane (C₄H₁₀) — Five Common Representations</text>
  <text x="410" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Same molecule. Same formula. Different things emphasised. Pick the one your reader needs.</text>

  <!-- 1. molecular -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="150" height="240" rx="8" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="75" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">1 · Molecular</text>
    <text x="75" y="38" font-size="9" fill="#4a5568" text-anchor="middle">atom counts only</text>
    <text x="75" y="140" font-size="42" font-weight="700" fill="#1a202c" text-anchor="middle">C₄H₁₀</text>
    <text x="75" y="220" font-size="9" fill="#4a5568" text-anchor="middle">no connectivity info</text>
  </g>

  <!-- 2. condensed -->
  <g transform="translate(180, 60)">
    <rect x="0" y="0" width="180" height="240" rx="8" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="90" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">2 · Condensed</text>
    <text x="90" y="38" font-size="9" fill="#4a5568" text-anchor="middle">H's collapsed onto C</text>

    <text x="90" y="140" font-size="22" font-weight="700" fill="#1a202c" text-anchor="middle">CH₃–CH₂–CH₂–CH₃</text>
    <text x="90" y="170" font-size="11" fill="#4a5568" text-anchor="middle">or just CH₃CH₂CH₂CH₃</text>

    <text x="90" y="220" font-size="9" fill="#4a5568" text-anchor="middle">linear chain, hidden geometry</text>
  </g>

  <!-- 3. expanded structural -->
  <g transform="translate(370, 60)">
    <rect x="0" y="0" width="160" height="240" rx="8" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="80" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">3 · Expanded</text>
    <text x="80" y="38" font-size="9" fill="#4a5568" text-anchor="middle">every bond drawn</text>

    <!-- 4 carbons in a row -->
    <text x="22" y="140" font-size="14" font-weight="700" fill="#1a202c">H</text>
    <text x="22" y="100" font-size="14" font-weight="700" fill="#1a202c">H</text>
    <text x="22" y="180" font-size="14" font-weight="700" fill="#1a202c">H</text>

    <text x="58" y="140" font-size="14" font-weight="700" fill="#1a202c">C</text>
    <text x="84" y="140" font-size="14" font-weight="700" fill="#1a202c">C</text>
    <text x="110" y="140" font-size="14" font-weight="700" fill="#1a202c">C</text>
    <text x="136" y="140" font-size="14" font-weight="700" fill="#1a202c">C</text>

    <text x="58" y="100" font-size="14" font-weight="700" fill="#1a202c">H</text>
    <text x="58" y="180" font-size="14" font-weight="700" fill="#1a202c">H</text>
    <text x="84" y="100" font-size="14" font-weight="700" fill="#1a202c">H</text>
    <text x="84" y="180" font-size="14" font-weight="700" fill="#1a202c">H</text>
    <text x="110" y="100" font-size="14" font-weight="700" fill="#1a202c">H</text>
    <text x="110" y="180" font-size="14" font-weight="700" fill="#1a202c">H</text>

    <text x="146" y="140" font-size="14" font-weight="700" fill="#1a202c">H</text>
    <text x="146" y="100" font-size="14" font-weight="700" fill="#1a202c">H</text>
    <text x="146" y="180" font-size="14" font-weight="700" fill="#1a202c">H</text>

    <!-- bonds -->
    <line x1="32" y1="135" x2="50" y2="135" stroke="#1a202c" stroke-width="1.5" />
    <line x1="62" y1="135" x2="78" y2="135" stroke="#1a202c" stroke-width="1.5" />
    <line x1="88" y1="135" x2="104" y2="135" stroke="#1a202c" stroke-width="1.5" />
    <line x1="114" y1="135" x2="130" y2="135" stroke="#1a202c" stroke-width="1.5" />
    <line x1="140" y1="135" x2="144" y2="135" stroke="#1a202c" stroke-width="1.5" />

    <!-- vertical bonds C-H -->
    <line x1="60" y1="105" x2="60" y2="125" stroke="#1a202c" stroke-width="1.5" />
    <line x1="60" y1="145" x2="60" y2="172" stroke="#1a202c" stroke-width="1.5" />
    <line x1="86" y1="105" x2="86" y2="125" stroke="#1a202c" stroke-width="1.5" />
    <line x1="86" y1="145" x2="86" y2="172" stroke="#1a202c" stroke-width="1.5" />
    <line x1="112" y1="105" x2="112" y2="125" stroke="#1a202c" stroke-width="1.5" />
    <line x1="112" y1="145" x2="112" y2="172" stroke="#1a202c" stroke-width="1.5" />
    <!-- terminal H positions -->
    <line x1="25" y1="135" x2="22" y2="135" stroke="#1a202c" stroke-width="1.5" />

    <text x="80" y="220" font-size="9" fill="#4a5568" text-anchor="middle">all 14 atoms · bond-rich</text>
  </g>

  <!-- 4. skeletal -->
  <g transform="translate(540, 60)">
    <rect x="0" y="0" width="140" height="240" rx="8" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="70" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">4 · Skeletal</text>
    <text x="70" y="38" font-size="9" fill="#4a5568" text-anchor="middle">vertices = C, H's hidden</text>

    <!-- zigzag of 4 carbons (3 bonds) -->
    <polyline points="20,160 50,130 80,160 110,130" fill="none" stroke="#1a202c" stroke-width="2.5" />

    <text x="70" y="220" font-size="9" fill="#4a5568" text-anchor="middle">fastest to draw, hardest to count atoms</text>
  </g>

  <!-- 5. 3D wedge-dash -->
  <g transform="translate(690, 60)">
    <rect x="0" y="0" width="120" height="240" rx="8" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="60" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">5 · 3D wedge–dash</text>
    <text x="60" y="38" font-size="9" fill="#4a5568" text-anchor="middle">tetrahedral at each C</text>

    <!-- 4 carbons drawn as small zigzag -->
    <line x1="20" y1="120" x2="44" y2="100" stroke="#1a202c" stroke-width="2" />
    <line x1="44" y1="100" x2="68" y2="120" stroke="#1a202c" stroke-width="2" />
    <line x1="68" y1="120" x2="92" y2="100" stroke="#1a202c" stroke-width="2" />

    <circle cx="20" cy="120" r="10" fill="#1a202c" /><text x="20" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="44" cy="100" r="10" fill="#1a202c" /><text x="44" y="104" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="68" cy="120" r="10" fill="#1a202c" /><text x="68" y="124" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="92" cy="100" r="10" fill="#1a202c" /><text x="92" y="104" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">C</text>

    <!-- wedge to front-H on C2 -->
    <polygon points="44,100 36,72 52,72" fill="#1a202c" />
    <circle cx="44" cy="68" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1" />
    <text x="44" y="71" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

    <!-- dash to back-H on C2 -->
    <line x1="44" y1="100" x2="44" y2="148" stroke="#1a202c" stroke-width="1.5" stroke-dasharray="3 2" />
    <circle cx="44" cy="156" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1" />
    <text x="44" y="160" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

    <!-- wedge front-H on C3 -->
    <polygon points="68,120 60,148 76,148" fill="#1a202c" />
    <circle cx="68" cy="156" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1" />
    <text x="68" y="160" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

    <text x="60" y="218" font-size="9" fill="#4a5568" text-anchor="middle">true 3D shape</text>
  </g>

  <line x1="40" y1="324" x2="780" y2="324" stroke="#cbd5e1" stroke-width="1" />
  <text x="410" y="346" font-size="10" fill="#4a5568" text-anchor="middle">Skeletal is the working chemist's default. Wedge–dash appears when stereochemistry matters.</text>
</svg>
