<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-label="Five-step IUPAC naming flowchart for simple organic compounds">
  <title>IUPAC Naming — Five-Step Flowchart</title>
  <desc>Procedure for naming a simple organic compound: find the longest carbon chain containing the principal functional group, number it to give that group the lowest locant, identify substituents, list them alphabetically with locants, then assemble the full name.</desc>

  <text x="380" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">IUPAC Nomenclature — A Five-Step Procedure</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Follow the steps in order. They produce a unique name for any (simple) organic compound.</text>

  <!-- ── STEP 1 ─────────────────────────────────────────────────── -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="680" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="32" cy="32" r="20" fill="#1e40af" />
    <text x="32" y="38" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="68" y="28" font-size="13" font-weight="700" fill="#1e3a8a">Find the principal functional group</text>
    <text x="68" y="48" font-size="11" fill="#1e40af">Acid &gt; ester &gt; amide &gt; nitrile &gt; aldehyde &gt; ketone &gt; alcohol &gt; amine &gt; alkene &gt; alkyne &gt; alkane. Highest = "principal."</text>
  </g>

  <!-- arrow 1 -> 2 -->
  <line x1="380" y1="135" x2="380" y2="155" stroke="#475569" stroke-width="2" />
  <polygon points="374,151 386,151 380,162" fill="#475569" />

  <!-- ── STEP 2 ─────────────────────────────────────────────────── -->
  <g transform="translate(40, 165)">
    <rect x="0" y="0" width="680" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <circle cx="32" cy="32" r="20" fill="#15803d" />
    <text x="32" y="38" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="68" y="28" font-size="13" font-weight="700" fill="#14532d">Pick the longest carbon chain that contains it</text>
    <text x="68" y="48" font-size="11" fill="#15803d">This is the "parent chain." It dictates the suffix root: 1=meth, 2=eth, 3=prop, 4=but, 5=pent, 6=hex, 7=hept, 8=oct.</text>
  </g>

  <line x1="380" y1="230" x2="380" y2="250" stroke="#475569" stroke-width="2" />
  <polygon points="374,246 386,246 380,257" fill="#475569" />

  <!-- ── STEP 3 ─────────────────────────────────────────────────── -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="680" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <circle cx="32" cy="32" r="20" fill="#92400e" />
    <text x="32" y="38" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="68" y="28" font-size="13" font-weight="700" fill="#78350f">Number the chain</text>
    <text x="68" y="48" font-size="11" fill="#92400e">Give the principal group the lowest possible locant. If tied, lowest set of substituent locants wins.</text>
  </g>

  <line x1="380" y1="325" x2="380" y2="345" stroke="#475569" stroke-width="2" />
  <polygon points="374,341 386,341 380,352" fill="#475569" />

  <!-- ── STEP 4 ─────────────────────────────────────────────────── -->
  <g transform="translate(40, 355)">
    <rect x="0" y="0" width="680" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <circle cx="32" cy="32" r="20" fill="#5b21b6" />
    <text x="32" y="38" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="68" y="28" font-size="13" font-weight="700" fill="#4c1d95">Identify substituents · note locants</text>
    <text x="68" y="48" font-size="11" fill="#5b21b6">Methyl, ethyl, chloro, bromo, hydroxy (when –OH is not the principal group), nitro, etc.</text>
  </g>

  <line x1="380" y1="420" x2="380" y2="440" stroke="#475569" stroke-width="2" />
  <polygon points="374,436 386,436 380,447" fill="#475569" />

  <!-- ── STEP 5 ─────────────────────────────────────────────────── -->
  <g transform="translate(40, 450)">
    <rect x="0" y="0" width="680" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <circle cx="32" cy="32" r="20" fill="#991b1b" />
    <text x="32" y="38" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="68" y="28" font-size="13" font-weight="700" fill="#7f1d1d">Assemble — alphabetical substituents · root · suffix</text>
    <text x="68" y="48" font-size="11" fill="#991b1b">[locants-substituents]-[root]-[unsaturation]-[suffix]   e.g. 3-bromopent-2-en-1-ol</text>
  </g>
</svg>
