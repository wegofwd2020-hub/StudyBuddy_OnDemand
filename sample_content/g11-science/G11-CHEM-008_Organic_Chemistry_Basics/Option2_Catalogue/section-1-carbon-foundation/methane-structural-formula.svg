<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Methane CH4 in four representations — molecular, Lewis, structural and 3D">
  <title>Methane — Four Representations</title>
  <desc>The same molecule, four ways: molecular formula CH4, Lewis dot structure showing each shared pair, condensed structural formula H–C–H with bonds drawn out, and 3D wedge–dash projection showing the tetrahedral geometry.</desc>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Methane — One Molecule, Four Representations</text>
  <text x="360" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Each picture trades detail for compactness. Choose the representation that matches what you need to show.</text>

  <!-- panel 1: molecular formula -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="160" height="220" rx="8" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="80" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">1 · Molecular</text>
    <text x="80" y="38" font-size="10" fill="#4a5568" text-anchor="middle">how many of each atom</text>
    <text x="80" y="130" font-size="56" font-weight="700" fill="#1a202c" text-anchor="middle">CH₄</text>
    <text x="80" y="200" font-size="10" fill="#4a5568" text-anchor="middle">smallest · zero geometry info</text>
  </g>

  <!-- panel 2: Lewis dot -->
  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="160" height="220" rx="8" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="80" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">2 · Lewis dot</text>
    <text x="80" y="38" font-size="10" fill="#4a5568" text-anchor="middle">every shared pair shown</text>

    <!-- C centre -->
    <text x="80" y="125" font-size="28" font-weight="700" fill="#1a202c" text-anchor="middle">C</text>
    <!-- H atoms -->
    <text x="80" y="78" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="80" y="178" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="36" y="130" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="124" y="130" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

    <!-- shared pairs — two dots per bond -->
    <circle cx="74" cy="92" r="2.5" fill="#dc2626" /><circle cx="86" cy="92" r="2.5" fill="#dc2626" />
    <circle cx="74" cy="158" r="2.5" fill="#dc2626" /><circle cx="86" cy="158" r="2.5" fill="#dc2626" />
    <circle cx="50" cy="124" r="2.5" fill="#dc2626" /><circle cx="50" cy="136" r="2.5" fill="#dc2626" />
    <circle cx="110" cy="124" r="2.5" fill="#dc2626" /><circle cx="110" cy="136" r="2.5" fill="#dc2626" />

    <text x="80" y="200" font-size="10" fill="#4a5568" text-anchor="middle">2 dots = 1 bond pair</text>
  </g>

  <!-- panel 3: structural formula -->
  <g transform="translate(380, 60)">
    <rect x="0" y="0" width="160" height="220" rx="8" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="80" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">3 · Structural</text>
    <text x="80" y="38" font-size="10" fill="#4a5568" text-anchor="middle">bonds as lines</text>

    <text x="80" y="130" font-size="22" font-weight="700" fill="#1a202c" text-anchor="middle">C</text>
    <text x="80" y="80"  font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="80" y="180" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="36" y="135" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="124" y="135" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

    <!-- four bonds -->
    <line x1="80" y1="86" x2="80" y2="115" stroke="#1a202c" stroke-width="2" />
    <line x1="80" y1="135" x2="80" y2="165" stroke="#1a202c" stroke-width="2" />
    <line x1="46" y1="130" x2="68" y2="130" stroke="#1a202c" stroke-width="2" />
    <line x1="92" y1="130" x2="116" y2="130" stroke="#1a202c" stroke-width="2" />

    <text x="80" y="200" font-size="10" fill="#4a5568" text-anchor="middle">90° drawn — geometry implied</text>
  </g>

  <!-- panel 4: 3D wedge-dash -->
  <g transform="translate(560, 60)">
    <rect x="0" y="0" width="140" height="220" rx="8" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="70" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">4 · 3D wedge–dash</text>
    <text x="70" y="38" font-size="10" fill="#4a5568" text-anchor="middle">true tetrahedron</text>

    <!-- central C -->
    <circle cx="70" cy="130" r="14" fill="#1a202c" stroke="#0f172a" stroke-width="1.5" />
    <text x="70" y="135" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">C</text>

    <!-- in-plane bonds -->
    <line x1="70" y1="130" x2="32" y2="160" stroke="#1a202c" stroke-width="2" />
    <line x1="70" y1="130" x2="108" y2="160" stroke="#1a202c" stroke-width="2" />
    <!-- wedge (toward viewer) -->
    <polygon points="70,130 64,80 76,80" fill="#1a202c" />
    <!-- dash (away) -->
    <line x1="70" y1="130" x2="70" y2="190" stroke="#1a202c" stroke-width="2" stroke-dasharray="3 3" />

    <!-- H atoms -->
    <circle cx="70"  cy="74"  r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.2" />
    <text x="70"  y="78"  font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <circle cx="70"  cy="200" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.2" />
    <text x="70"  y="204" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <circle cx="26"  cy="166" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.2" />
    <text x="26"  y="170" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <circle cx="114" cy="166" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.2" />
    <text x="114" y="170" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

    <text x="70" y="217" font-size="9" fill="#4a5568" text-anchor="middle">109.5° between any pair</text>
  </g>

  <!-- legend -->
  <line x1="40" y1="294" x2="680" y2="294" stroke="#cbd5e1" stroke-width="1" />
  <text x="360" y="312" font-size="10" fill="#4a5568" text-anchor="middle">Tip — When asked "draw methane," check what's wanted: 1 hides geometry · 2 reveals electrons · 3 shows connectivity · 4 shows true 3D shape.</text>
</svg>
