<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="sp3 hybridised carbon — tetrahedral geometry, 109.5 degree bond angle">
  <title>sp³ Carbon — Tetrahedral Geometry, 109.5°</title>
  <desc>One 2s and three 2p atomic orbitals on carbon mix to give four equivalent sp³ hybrid orbitals. They point to the corners of a regular tetrahedron — every H–C–H angle is 109.5°. This is why methane and every alkane carbon is tetrahedral.</desc>

  <text x="320" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">sp³ Carbon — Tetrahedral Geometry (109.5°)</text>
  <text x="320" y="40" font-size="11" fill="#4a5568" text-anchor="middle">2s + 2p_x + 2p_y + 2p_z → four equivalent sp³ hybrid orbitals · all 4 C–H bonds equal</text>

  <!-- ── Left: orbital mixing diagram ─────────────────────────── -->
  <g transform="translate(40, 80)">
    <text x="120" y="0" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Orbital mixing</text>

    <!-- 2s -->
    <circle cx="30" cy="60" r="20" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
    <text x="30" y="64" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">2s</text>

    <text x="60" y="65" font-size="14" font-weight="700" fill="#1a202c">+</text>

    <!-- 2p_x  (dumbbell) -->
    <g transform="translate(95, 60)">
      <ellipse cx="-10" cy="0" rx="10" ry="20" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="1.5" />
      <ellipse cx="10" cy="0"  rx="10" ry="20" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="1.5" />
      <text x="0" y="36" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">2p_x</text>
    </g>

    <!-- 2p_y -->
    <g transform="translate(150, 60)">
      <ellipse cx="0" cy="-10" rx="10" ry="20" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="1.5" />
      <ellipse cx="0" cy="10"  rx="10" ry="20" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="1.5" />
      <text x="0" y="42" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">2p_y</text>
    </g>

    <!-- 2p_z (skewed) -->
    <g transform="translate(205, 60) rotate(45)">
      <ellipse cx="-10" cy="0" rx="10" ry="20" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="1.5" />
      <ellipse cx="10" cy="0"  rx="10" ry="20" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="1.5" />
    </g>
    <text x="205" y="102" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">2p_z</text>

    <!-- arrow -->
    <line x1="20" y1="140" x2="220" y2="140" stroke="#1a202c" stroke-width="2" />
    <polygon points="220,134 232,140 220,146" fill="#1a202c" />
    <text x="120" y="132" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">hybridise</text>

    <!-- four sp3 hybrids: lopsided lobes -->
    <g transform="translate(40, 180)">
      <ellipse cx="0" cy="0" rx="14" ry="26" fill="#22c55e" opacity="0.55" stroke="#15803d" stroke-width="1.5" />
      <ellipse cx="0" cy="-14" rx="6" ry="10" fill="#86efac" opacity="0.55" stroke="#15803d" stroke-width="1" />
    </g>
    <g transform="translate(85, 180)">
      <ellipse cx="0" cy="0" rx="14" ry="26" fill="#22c55e" opacity="0.55" stroke="#15803d" stroke-width="1.5" />
      <ellipse cx="0" cy="-14" rx="6" ry="10" fill="#86efac" opacity="0.55" stroke="#15803d" stroke-width="1" />
    </g>
    <g transform="translate(130, 180)">
      <ellipse cx="0" cy="0" rx="14" ry="26" fill="#22c55e" opacity="0.55" stroke="#15803d" stroke-width="1.5" />
      <ellipse cx="0" cy="-14" rx="6" ry="10" fill="#86efac" opacity="0.55" stroke="#15803d" stroke-width="1" />
    </g>
    <g transform="translate(175, 180)">
      <ellipse cx="0" cy="0" rx="14" ry="26" fill="#22c55e" opacity="0.55" stroke="#15803d" stroke-width="1.5" />
      <ellipse cx="0" cy="-14" rx="6" ry="10" fill="#86efac" opacity="0.55" stroke="#15803d" stroke-width="1" />
    </g>
    <text x="120" y="234" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">4 × sp³ hybrid orbitals (equivalent)</text>
  </g>

  <!-- ── Right: tetrahedral geometry of CH4 ─────────────────────── -->
  <g transform="translate(440, 200)">
    <text x="0" y="-110" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Tetrahedral CH₄</text>

    <!-- Four bond directions: front-up wedge, back-up dash, two side bonds in plane -->
    <!-- front-up wedge to H -->
    <polygon points="0,0 -8,-90 8,-90" fill="#1a202c" />
    <!-- back-up dash to H -->
    <line x1="0" y1="0" x2="0" y2="80" stroke="#1a202c" stroke-width="2" stroke-dasharray="4 4" />
    <!-- side-left -->
    <line x1="0" y1="0" x2="-78" y2="40" stroke="#1a202c" stroke-width="2.5" />
    <!-- side-right -->
    <line x1="0" y1="0" x2="78"  y2="40" stroke="#1a202c" stroke-width="2.5" />

    <!-- Central C -->
    <circle cx="0" cy="0" r="22" fill="#1a202c" stroke="#0f172a" stroke-width="2" />
    <text x="0" y="6" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">C</text>

    <!-- Hydrogens -->
    <circle cx="0"   cy="-100" r="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <text x="0"   y="-95"  font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

    <circle cx="0"   cy="92" r="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <text x="0"   y="97"  font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

    <circle cx="-90"  cy="48" r="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <text x="-90" y="53"  font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

    <circle cx="90" cy="48" r="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <text x="90"  y="53"  font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

    <!-- Bond-angle arc + label -->
    <path d="M -22 -15 A 28 28 0 0 1 22 -15" fill="none" stroke="#dc2626" stroke-width="1.5" />
    <text x="0" y="-30" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">109.5°</text>
  </g>

  <!-- Bottom legend -->
  <line x1="40" y1="338" x2="600" y2="338" stroke="#cbd5e1" stroke-width="1" />
  <text x="320" y="358" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Wedge = bond toward you · Dash = bond away · Plain line = in the plane of the page</text>
  <text x="320" y="372" font-size="10" fill="#4a5568" text-anchor="middle">Bond length C–H ≈ 109 pm · Bond enthalpy ≈ 413 kJ mol⁻¹ · Tetravalent: 4 bonds, no lone pairs</text>
</svg>
