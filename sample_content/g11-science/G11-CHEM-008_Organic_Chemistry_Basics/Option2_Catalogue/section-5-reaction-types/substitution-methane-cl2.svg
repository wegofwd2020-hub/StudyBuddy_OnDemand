<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Substitution reaction — methane plus chlorine gives chloromethane and HCl, photochemical free-radical mechanism">
  <title>Free-Radical Substitution — Methane + Chlorine</title>
  <desc>One H on methane is replaced by Cl. UV light splits Cl2 homolytically into two Cl radicals (initiation). Each Cl• abstracts an H to form HCl and a methyl radical, which reacts with Cl2 to give CH3Cl and another Cl• (propagation). The cycle continues until two radicals meet (termination).</desc>

  <text x="380" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Substitution — One Atom Swapped for Another</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">CH₄ + Cl₂ →  CH₃Cl + HCl  (UV light · free-radical chain mechanism)</text>

  <!-- Overall equation panel -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="680" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="340" y="22" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">OVERALL</text>

    <!-- methane -->
    <text x="80" y="58" font-size="20" font-weight="700" fill="#1a202c" text-anchor="middle">CH₄</text>
    <text x="80" y="74" font-size="9" fill="#4a5568" text-anchor="middle">methane</text>

    <text x="160" y="58" font-size="20" font-weight="700" fill="#1a202c" text-anchor="middle">+</text>

    <!-- chlorine -->
    <text x="240" y="58" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">Cl₂</text>
    <text x="240" y="74" font-size="9" fill="#4a5568" text-anchor="middle">chlorine</text>

    <!-- arrow with hv -->
    <line x1="290" y1="55" x2="380" y2="55" stroke="#1a202c" stroke-width="2" />
    <polygon points="380,49 392,55 380,61" fill="#1a202c" />
    <text x="335" y="40" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">hν (UV)</text>

    <!-- chloromethane -->
    <text x="450" y="58" font-size="20" font-weight="700" fill="#1a202c" text-anchor="middle">CH₃Cl</text>
    <text x="450" y="74" font-size="9" fill="#4a5568" text-anchor="middle">chloromethane</text>

    <text x="540" y="58" font-size="20" font-weight="700" fill="#1a202c" text-anchor="middle">+</text>

    <!-- HCl -->
    <text x="620" y="58" font-size="20" font-weight="700" fill="#1a202c" text-anchor="middle">HCl</text>
    <text x="620" y="74" font-size="9" fill="#4a5568" text-anchor="middle">hydrogen chloride</text>
  </g>

  <!-- Mechanism: 3 panels -->
  <g transform="translate(40, 170)">
    <text x="340" y="0" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Three-step chain mechanism</text>

    <!-- panel 1: initiation -->
    <rect x="0" y="14" width="220" height="140" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="110" y="34" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">1 · Initiation</text>
    <text x="110" y="50" font-size="9" fill="#92400e" text-anchor="middle">UV breaks Cl–Cl homolytically</text>
    <text x="110" y="86"  font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Cl–Cl</text>
    <line x1="98" y1="100" x2="122" y2="100" stroke="#1a202c" stroke-width="1.5" />
    <polygon points="122,96 130,100 122,104" fill="#1a202c" />
    <text x="110" y="120" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">2 Cl•</text>
    <text x="110" y="138" font-size="9" fill="#4a5568" text-anchor="middle">two free radicals</text>

    <!-- panel 2: propagation -->
    <rect x="230" y="14" width="220" height="140" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="340" y="34" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">2 · Propagation</text>
    <text x="340" y="50" font-size="9" fill="#15803d" text-anchor="middle">chain-carrying steps</text>
    <text x="340" y="76"  font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Cl• + CH₄ → HCl + CH₃•</text>
    <text x="340" y="98"  font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">CH₃• + Cl₂ → CH₃Cl + Cl•</text>
    <text x="340" y="124" font-size="9" fill="#4a5568" text-anchor="middle">each step makes one product</text>
    <text x="340" y="138" font-size="9" fill="#4a5568" text-anchor="middle">+ regenerates a radical</text>

    <!-- panel 3: termination -->
    <rect x="460" y="14" width="220" height="140" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="570" y="34" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">3 · Termination</text>
    <text x="570" y="50" font-size="9" fill="#991b1b" text-anchor="middle">two radicals combine</text>
    <text x="570" y="76"  font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Cl• + Cl• → Cl₂</text>
    <text x="570" y="98"  font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">CH₃• + CH₃• → C₂H₆</text>
    <text x="570" y="120" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">CH₃• + Cl• → CH₃Cl</text>
    <text x="570" y="138" font-size="9" fill="#4a5568" text-anchor="middle">chain ends</text>
  </g>

  <!-- bottom note -->
  <line x1="40" y1="332" x2="720" y2="332" stroke="#cbd5e1" stroke-width="1" />
  <text x="380" y="350" font-size="10" fill="#4a5568" text-anchor="middle">Substitution is the alkanes' headline reaction. Chain mechanism = small spark, lots of product.</text>
</svg>
