<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Rolling without slipping — velocity vectors at top, centre, and contact point">
  <title>Rolling without slipping — kinematic constraint v_cm = ω R</title>
  <desc>A wheel of radius R rolling rightward without slipping. The centre moves with speed v_cm = ω R. The top of the wheel moves at 2 v_cm. The contact point is instantaneously at rest. Kinetic energy splits into translational (½ M v²) and rotational (½ I ω²) parts.</desc>

  <defs>
    <marker id="arr-vcm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
    <marker id="arr-vtop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="arr-omega-roll" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" />
    </marker>
  </defs>

  <text x="320" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Rolling without slipping:  v_cm = ω R</text>

  <!-- ─── Wheel diagram ─── -->
  <g transform="translate(40, 50)">
    <!-- Ground -->
    <line x1="0" y1="200" x2="380" y2="200" stroke="#1a202c" stroke-width="1.5" />
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="20"  y1="200" x2="12"  y2="210" />
      <line x1="60"  y1="200" x2="52"  y2="210" />
      <line x1="100" y1="200" x2="92"  y2="210" />
      <line x1="140" y1="200" x2="132" y2="210" />
      <line x1="180" y1="200" x2="172" y2="210" />
      <line x1="220" y1="200" x2="212" y2="210" />
      <line x1="260" y1="200" x2="252" y2="210" />
      <line x1="300" y1="200" x2="292" y2="210" />
      <line x1="340" y1="200" x2="332" y2="210" />
    </g>

    <!-- Wheel: circle of radius 80 at centre (180, 120) -->
    <circle cx="180" cy="120" r="80" fill="#bee3f8" stroke="#1a202c" stroke-width="1.8" />
    <!-- Spokes -->
    <line x1="180" y1="40"  x2="180" y2="200" stroke="#1a202c" stroke-width="0.8" />
    <line x1="100" y1="120" x2="260" y2="120" stroke="#1a202c" stroke-width="0.8" />
    <line x1="124" y1="64"  x2="236" y2="176" stroke="#1a202c" stroke-width="0.8" />
    <line x1="124" y1="176" x2="236" y2="64"  stroke="#1a202c" stroke-width="0.8" />
    <!-- Centre dot -->
    <circle cx="180" cy="120" r="4" fill="#1a202c" />

    <!-- R indicator -->
    <line x1="180" y1="120" x2="220" y2="80" stroke="#dd6b20" stroke-width="1.5" />
    <text x="208" y="98" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dd6b20">R</text>

    <!-- ω curved arrow inside wheel -->
    <path d="M 145 95 A 45 45 0 0 1 215 95"
      fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arr-omega-roll)" />
    <text x="180" y="138" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">ω</text>

    <!-- v_cm at centre (rightward) -->
    <line x1="180" y1="120" x2="280" y2="120" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arr-vcm)" />
    <text x="290" y="124" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0">v_cm</text>

    <!-- v_top at top of wheel: 2 v_cm rightward -->
    <line x1="180" y1="40" x2="380" y2="40" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arr-vtop)" />
    <text x="290" y="32" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">v_top = 2 v_cm</text>

    <!-- Contact point label: instantaneously at rest -->
    <circle cx="180" cy="200" r="5" fill="#7c3aed" stroke="#1a202c" stroke-width="1.2" />
    <text x="190" y="218" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#7c3aed">v_contact = 0</text>
    <text x="190" y="232" font="9px system-ui" font-size="9" font-style="italic" fill="#7c3aed">(instantaneous axis of rotation)</text>

    <!-- Top of wheel label -->
    <text x="180" y="50" font="9px system-ui" font-size="9" font-style="italic" fill="#dc2626" text-anchor="middle">top</text>
  </g>

  <!-- ─── Equations panel ─── -->
  <g transform="translate(440, 50)">
    <rect x="0" y="0" width="180" height="240" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3" />
    <text x="90" y="22" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Constraint + KE split</text>

    <text x="90" y="50" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">v_cm = ω R</text>
    <text x="90" y="70" font="10px system-ui" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">(arc length = distance rolled)</text>

    <line x1="14" y1="86" x2="166" y2="86" stroke="#94a3b8" stroke-width="0.8" />

    <text x="90" y="106" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Total kinetic energy</text>
    <text x="90" y="130" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">KE = ½ M v_cm²</text>
    <text x="90" y="148" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">      + ½ I ω²</text>

    <line x1="14" y1="164" x2="166" y2="164" stroke="#94a3b8" stroke-width="0.8" />

    <text x="14" y="184" font="11px system-ui" font-size="11" fill="#1a202c">  translational  +  rotational</text>

    <text x="14" y="208" font="11px system-ui" font-size="11" fill="#1a202c">For solid sphere I = (2/5)MR²:</text>
    <text x="90" y="228" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">KE = (7/10) M v²</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="40" y="306" width="580" height="62" rx="8" fill="#fef3c7" stroke="#dd6b20" stroke-width="1.3" />
  <text x="330" y="328" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Pure rolling = pure rotation about the contact point.</text>
  <text x="330" y="346" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Static friction at the contact point is what enforces v_cm = ω R; it does no work because that point isn't moving.</text>
  <text x="330" y="362" font="10px system-ui" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">If v_cm ≠ ω R, the wheel is skidding (kinetic friction, energy lost to heat).</text>
</svg>
