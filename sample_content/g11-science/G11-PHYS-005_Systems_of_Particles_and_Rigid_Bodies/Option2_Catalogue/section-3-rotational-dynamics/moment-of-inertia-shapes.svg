<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Moment of inertia for common rigid shapes">
  <title>Moment of inertia — formulas for common shapes</title>
  <desc>Reference card showing the moment of inertia formula for six common shapes about a stated axis: thin rod about its centre (1/12 ML²), thin rod about its end (1/3 ML²), solid disk about central axis (1/2 MR²), thin hoop about central axis (MR²), solid sphere about diameter (2/5 MR²), and thin spherical shell about diameter (2/3 MR²). Each shape is sketched with its axis of rotation drawn dashed.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Moment of Inertia I = Σ mᵢ rᵢ²  — common shapes (about axis shown)</text>

  <!-- Equation reminder card -->
  <rect x="160" y="35" width="400" height="28" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2" />
  <text x="360" y="54" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">I = Σ mᵢ rᵢ²    (continuous:  I = ∫ r² dm)</text>

  <!-- Grid of 6 shapes: 3 cols x 2 rows -->
  <!-- Cell sizes: 220 x 140, padded -->

  <!-- ─── (1,1) Thin rod about centre — I = (1/12) M L² ─── -->
  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="110" y="20" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">Thin rod — about centre</text>

    <!-- rod horizontal -->
    <rect x="40" y="64" width="140" height="10" rx="3" fill="#bee3f8" stroke="#1a202c" stroke-width="1.2" />
    <!-- axis of rotation: vertical dashed through centre -->
    <line x1="110" y1="42" x2="110" y2="96" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="120" y="50" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#7c3aed">axis</text>
    <!-- L brace -->
    <line x1="40" y1="86" x2="180" y2="86" stroke="#1a202c" stroke-width="1" />
    <line x1="40" y1="82" x2="40" y2="90" stroke="#1a202c" stroke-width="1" />
    <line x1="180" y1="82" x2="180" y2="90" stroke="#1a202c" stroke-width="1" />
    <text x="110" y="100" font="11px system-ui" font-size="11" fill="#1a202c" text-anchor="middle">L</text>

    <text x="110" y="120" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">I = (1/12) M L²</text>
  </g>

  <!-- ─── (1,2) Thin rod about end — I = (1/3) M L² ─── -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="110" y="20" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">Thin rod — about end</text>

    <rect x="40" y="64" width="140" height="10" rx="3" fill="#bee3f8" stroke="#1a202c" stroke-width="1.2" />
    <!-- axis at left end -->
    <line x1="40" y1="42" x2="40" y2="96" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="50" y="50" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#7c3aed">axis</text>
    <line x1="40" y1="86" x2="180" y2="86" stroke="#1a202c" stroke-width="1" />
    <line x1="40" y1="82" x2="40" y2="90" stroke="#1a202c" stroke-width="1" />
    <line x1="180" y1="82" x2="180" y2="90" stroke="#1a202c" stroke-width="1" />
    <text x="110" y="100" font="11px system-ui" font-size="11" fill="#1a202c" text-anchor="middle">L</text>

    <text x="110" y="120" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">I = (1/3) M L²</text>
  </g>

  <!-- ─── (1,3) Solid disk about central axis — I = (1/2) M R² ─── -->
  <g transform="translate(480, 80)">
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="110" y="20" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">Solid disk / cylinder</text>

    <!-- ellipse for disk -->
    <ellipse cx="110" cy="68" rx="48" ry="14" fill="#bee3f8" stroke="#1a202c" stroke-width="1.2" />
    <ellipse cx="110" cy="68" rx="48" ry="14" fill="none" stroke="#1a202c" stroke-width="0.8" />
    <!-- vertical through-the-centre axis -->
    <line x1="110" y1="36" x2="110" y2="100" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="120" y="44" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#7c3aed">axis</text>
    <!-- R indicator -->
    <line x1="110" y1="68" x2="158" y2="68" stroke="#dd6b20" stroke-width="1.2" />
    <text x="134" y="82" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dd6b20" text-anchor="middle">R</text>

    <text x="110" y="120" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">I = (1/2) M R²</text>
  </g>

  <!-- ─── (2,1) Thin hoop / ring — I = M R² ─── -->
  <g transform="translate(20, 215)">
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="110" y="20" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">Thin hoop / ring</text>

    <ellipse cx="110" cy="68" rx="48" ry="14" fill="none" stroke="#1a202c" stroke-width="2" />
    <line x1="110" y1="36" x2="110" y2="100" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="120" y="44" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#7c3aed">axis</text>
    <line x1="110" y1="68" x2="158" y2="68" stroke="#dd6b20" stroke-width="1.2" />
    <text x="134" y="82" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dd6b20" text-anchor="middle">R</text>

    <text x="110" y="120" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">I = M R²</text>
  </g>

  <!-- ─── (2,2) Solid sphere — I = (2/5) M R² ─── -->
  <g transform="translate(250, 215)">
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="110" y="20" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">Solid sphere</text>

    <circle cx="110" cy="68" r="32" fill="#bee3f8" stroke="#1a202c" stroke-width="1.2" />
    <!-- meridian lines for visual depth -->
    <ellipse cx="110" cy="68" rx="32" ry="8" fill="none" stroke="#1a202c" stroke-width="0.6" />
    <line x1="110" y1="32" x2="110" y2="104" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="120" y="40" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#7c3aed">axis</text>
    <line x1="110" y1="68" x2="142" y2="68" stroke="#dd6b20" stroke-width="1.2" />
    <text x="126" y="82" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dd6b20" text-anchor="middle">R</text>

    <text x="110" y="120" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">I = (2/5) M R²</text>
  </g>

  <!-- ─── (2,3) Thin spherical shell — I = (2/3) M R² ─── -->
  <g transform="translate(480, 215)">
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="110" y="20" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">Thin spherical shell</text>

    <circle cx="110" cy="68" r="32" fill="none" stroke="#1a202c" stroke-width="2" />
    <ellipse cx="110" cy="68" rx="32" ry="8" fill="none" stroke="#1a202c" stroke-width="0.6" stroke-dasharray="2 2" />
    <line x1="110" y1="32" x2="110" y2="104" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="120" y="40" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#7c3aed">axis</text>
    <line x1="110" y1="68" x2="142" y2="68" stroke="#dd6b20" stroke-width="1.2" />
    <text x="126" y="82" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dd6b20" text-anchor="middle">R</text>

    <text x="110" y="120" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">I = (2/3) M R²</text>
  </g>

  <text x="360" y="356" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">More mass concentrated far from the axis → larger I → harder to start or stop spinning. Hoop &gt; disk &gt; sphere at equal M, R.</text>
</svg>
