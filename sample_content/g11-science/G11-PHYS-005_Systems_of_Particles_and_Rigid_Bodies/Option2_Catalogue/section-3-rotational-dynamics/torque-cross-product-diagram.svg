<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="Torque is the cross product of position vector r and force F, with right-hand rule">
  <title>Torque τ = r × F — vector diagram</title>
  <desc>A wrench rotates about a pivot. The position vector r points from the pivot to where the force F is applied. The torque vector τ = r × F is perpendicular to the plane (out of page if rotation is counter-clockwise). Magnitude τ = r F sin(θ), where θ is the angle between r and F. The lever arm is r⊥ = r sin(θ).</desc>

  <defs>
    <marker id="arr-rvec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
    <marker id="arr-fvec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="arr-leverarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
  </defs>

  <text x="300" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Torque  τ = r × F   (magnitude  τ = r F sin θ)</text>

  <!-- ─── Wrench panel ─── -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="340" height="260" rx="8" fill="#f7fafc" stroke="#e2e8f0" />

    <!-- Pivot at (60, 200) -->
    <circle cx="60" cy="200" r="8" fill="#1a202c" />
    <text x="34" y="200" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="end">pivot</text>

    <!-- Wrench: a thick line from pivot at angle 0° (along x). Force applied at end. -->
    <!-- Wrench drawn with a slight handle thickness (rectangle 60..280 horizontally at y=200) -->
    <rect x="60" y="194" width="220" height="12" rx="3" fill="#cbd5e1" stroke="#1a202c" stroke-width="1.2" />
    <!-- Hex socket head -->
    <polygon points="60,180 70,176 80,180 80,220 70,224 60,220" fill="#94a3b8" stroke="#1a202c" stroke-width="1.2" />

    <!-- r vector: from pivot (60, 200) to (260, 200) -->
    <line x1="60" y1="200" x2="260" y2="200" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arr-rvec)" />
    <text x="160" y="222" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">r</text>

    <!-- Force F at the end of wrench, pointing up-left at θ=120° from r (i.e. up and slightly back) -->
    <!-- end at (260, 200); vector to (200, 100) -->
    <line x1="260" y1="200" x2="200" y2="100" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-fvec)" />
    <text x="208" y="92" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">F</text>

    <!-- Angle θ between r (rightward) and F (up-left) at end of wrench -->
    <!-- Draw arc centered at (260,200) from angle 0 (right) to angle 120° (up-left). -->
    <path d="M 290 200 A 30 30 0 0 1 245 174" fill="none" stroke="#15803d" stroke-width="1.5" />
    <text x="296" y="186" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d">θ</text>

    <!-- Lever arm r⊥ = r sin θ, drawn from pivot vertically up to height (200 - r·sinθ_visual) — for visualisation.
         Use a perpendicular-from-line-of-action approach: drop perpendicular from pivot to the F-line.
         F-line passes through (260,200) toward (200,100) — direction (-60, -100)/√(60²+100²) = unit vector u≈(-0.514,-0.857).
         Foot of perpendicular from (60,200): not strictly needed; show r⊥ as dashed perpendicular distance from pivot to line of action. Compute geometrically:
         line: (260+s·-60, 200+s·-100). Vector from pivot to point on line: (260+s·-60-60, 200+s·-100-200) = (200-60s, -100s).
         Perp condition: dot with direction (-60,-100) = 0 ⇒ -60(200-60s) + -100(-100s) = 0 ⇒ -12000+3600s+10000s = 0 ⇒ s=12000/13600 ≈ 0.882.
         Foot ≈ (260 - 52.94, 200 - 88.24) = (207.06, 111.76).
    -->
    <line x1="60" y1="200" x2="207" y2="112" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" />
    <text x="106" y="160" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#7c3aed">r⊥ = r sin θ</text>

    <!-- Out-of-page τ symbol (counter-clockwise rotation): circle with dot -->
    <circle cx="120" cy="60" r="14" fill="#fff" stroke="#15803d" stroke-width="2" />
    <circle cx="120" cy="60" r="3" fill="#15803d" />
    <text x="142" y="56" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d">τ (out of page)</text>
    <text x="142" y="70" font="10px system-ui" font-size="10" font-style="italic" fill="#15803d">right-hand rule</text>
  </g>

  <!-- ─── Right-hand rule + formula panel ─── -->
  <g transform="translate(380, 50)">
    <rect x="0" y="0" width="200" height="260" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3" />
    <text x="100" y="22" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Right-hand rule</text>

    <!-- Hand cartoon: simplified -->
    <!-- Palm rectangle -->
    <rect x="35" y="50" width="60" height="80" rx="14" fill="#fed7aa" stroke="#1a202c" stroke-width="1.2" />
    <!-- Fingers curling -->
    <path d="M 95 58 Q 130 60 130 95 Q 130 128 95 128"
      fill="none" stroke="#2b6cb0" stroke-width="2.5" />
    <text x="148" y="80" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#2b6cb0">fingers:</text>
    <text x="148" y="92" font="10px system-ui" font-size="10" fill="#2b6cb0">r → F</text>

    <!-- Thumb up -->
    <line x1="55" y1="50" x2="55" y2="20" stroke="#15803d" stroke-width="3" marker-end="url(#arr-leverarm)" />
    <text x="14" y="32" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#15803d">thumb:</text>
    <text x="14" y="44" font="10px system-ui" font-size="10" fill="#15803d">τ direction</text>

    <!-- Magnitude formula box -->
    <rect x="14" y="148" width="172" height="100" rx="6" fill="#fff" stroke="#15803d" stroke-width="1" />
    <text x="100" y="168" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Magnitude</text>
    <text x="100" y="190" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">τ = r F sin θ</text>
    <text x="100" y="208" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">= F × (lever arm r⊥)</text>
    <text x="100" y="228" font="10px system-ui" font-size="10" fill="#1a202c" text-anchor="middle">Max torque at θ = 90°</text>
    <text x="100" y="242" font="10px system-ui" font-size="10" fill="#1a202c" text-anchor="middle">Zero torque if F ∥ r</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="20" y="324" width="560" height="46" rx="8" fill="#fef3c7" stroke="#dd6b20" stroke-width="1.3" />
  <text x="300" y="346" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Same force, longer wrench → more torque. Same wrench, push perpendicular → more torque.</text>
  <text x="300" y="362" font="10px system-ui" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">τ is the rotational analogue of force; SI unit N·m (do not call it a joule).</text>
</svg>
