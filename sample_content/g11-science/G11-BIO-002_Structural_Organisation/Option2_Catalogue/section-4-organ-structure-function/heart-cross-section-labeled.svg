<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-label="Heart cross-section labeled">
  <title>Human heart — labelled cross-section</title>
  <desc>An anterior cross-section of the human heart showing the four chambers, four valves, and the major blood vessels. Right atrium (top right of viewer) receives deoxygenated blood from the superior and inferior vena cava and passes it through the tricuspid valve to the right ventricle, which pumps it via the pulmonary valve into the pulmonary artery toward the lungs. Oxygenated blood returns from the lungs via the pulmonary veins into the left atrium, passes through the bicuspid (mitral) valve into the left ventricle, and is pumped via the aortic valve into the aorta to the body. Walls are colour-coded by oxygenation: red for oxygenated, blue for deoxygenated, with the thicker left-ventricle wall drawn proportionally.</desc>

  <text x="380" y="22" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Human Heart — Anterior Cross-Section</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Four chambers, four valves, two circulations. Wall thickness reflects pumping pressure.</text>

  <!-- Background -->
  <rect x="40" y="56" width="680" height="424" rx="14" fill="#f7fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Reader's-anatomical convention: right side of body = left of image -->

  <!-- ── Aorta arch (top centre, exits left ventricle) -->
  <path d="M 380 110 L 380 158 Q 380 88 460 88 Q 540 88 540 158" fill="none" stroke="#dc2626" stroke-width="14"/>
  <path d="M 380 110 L 380 158 Q 380 88 460 88 Q 540 88 540 158" fill="none" stroke="#7f1d1d" stroke-width="2"/>

  <!-- ── Superior vena cava (top right of viewer = patient's right) -->
  <rect x="240" y="80" width="22" height="80" fill="#2b6cb0" stroke="#1e3a8a" stroke-width="2"/>
  <!-- ── Pulmonary artery (between aorta and SVC, exits right ventricle) -->
  <path d="M 320 144 L 320 100 Q 320 80 296 80 L 280 80" fill="none" stroke="#2b6cb0" stroke-width="12"/>
  <path d="M 320 144 L 320 100 Q 320 80 296 80 L 280 80" fill="none" stroke="#1e3a8a" stroke-width="2"/>
  <!-- Branches into left/right pulmonary -->
  <line x1="296" y1="80" x2="276" y2="62" stroke="#2b6cb0" stroke-width="6"/>
  <line x1="296" y1="80" x2="316" y2="62" stroke="#2b6cb0" stroke-width="6"/>

  <!-- ── Pulmonary veins (entering left atrium, top-left of viewer) -->
  <line x1="500" y1="180" x2="540" y2="148" stroke="#dc2626" stroke-width="8"/>
  <line x1="510" y1="200" x2="558" y2="178" stroke="#dc2626" stroke-width="8"/>

  <!-- ── Inferior vena cava (bottom right of viewer) -->
  <rect x="240" y="380" width="22" height="80" fill="#2b6cb0" stroke="#1e3a8a" stroke-width="2"/>

  <!-- ── Heart muscle silhouette (myocardium) -->
  <path d="M 240 160 L 240 380 Q 260 440 380 460 Q 540 444 540 360 L 540 160 Q 480 130 380 160 Q 280 132 240 160 Z" fill="#fee2e2" stroke="#7f1d1d" stroke-width="3"/>

  <!-- Septum (interventricular) -->
  <line x1="380" y1="170" x2="380" y2="450" stroke="#7f1d1d" stroke-width="3"/>

  <!-- Atrial septum (interatrial) — partial line for atria -->
  <line x1="380" y1="160" x2="380" y2="270" stroke="#7f1d1d" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Atrioventricular boundary (atria above, ventricles below) -->
  <line x1="240" y1="270" x2="540" y2="270" stroke="#7f1d1d" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- ── Right atrium chamber (deox blue tint, viewer's left) -->
  <path d="M 248 168 L 248 268 L 376 268 L 376 168 Q 308 144 248 168 Z" fill="#dbeafe" stroke="none"/>
  <!-- ── Left atrium chamber (ox red tint, viewer's right) -->
  <path d="M 384 168 L 384 268 L 532 268 L 532 168 Q 460 142 384 168 Z" fill="#fee2e2" stroke="none"/>
  <!-- ── Right ventricle chamber (thinner wall, viewer's left) -->
  <path d="M 252 274 L 252 380 Q 280 432 376 446 L 376 274 Z" fill="#dbeafe" stroke="none"/>
  <!-- ── Left ventricle chamber (thicker wall, viewer's right) — make wall thicker by smaller chamber -->
  <path d="M 410 274 L 410 446 Q 510 432 524 380 L 524 274 Z" fill="#fee2e2" stroke="none"/>
  <!-- Left-ventricle thick wall outline -->
  <path d="M 410 274 L 410 446 Q 510 432 524 380 L 524 274 Z" fill="none" stroke="#7f1d1d" stroke-width="2"/>

  <!-- ── Tricuspid valve (RA → RV) -->
  <line x1="262" y1="270" x2="290" y2="290" stroke="#15803d" stroke-width="2.5"/>
  <line x1="320" y1="270" x2="310" y2="295" stroke="#15803d" stroke-width="2.5"/>
  <line x1="370" y1="270" x2="346" y2="294" stroke="#15803d" stroke-width="2.5"/>

  <!-- ── Bicuspid (mitral) valve (LA → LV) -->
  <line x1="412" y1="270" x2="436" y2="294" stroke="#15803d" stroke-width="2.5"/>
  <line x1="490" y1="270" x2="476" y2="296" stroke="#15803d" stroke-width="2.5"/>

  <!-- ── Pulmonary valve (RV → pulm artery, between heart & PA stem) -->
  <line x1="312" y1="160" x2="312" y2="146" stroke="#15803d" stroke-width="3"/>
  <line x1="320" y1="160" x2="320" y2="146" stroke="#15803d" stroke-width="3"/>
  <line x1="328" y1="160" x2="328" y2="146" stroke="#15803d" stroke-width="3"/>

  <!-- ── Aortic valve (LV → aorta) -->
  <line x1="372" y1="160" x2="372" y2="146" stroke="#15803d" stroke-width="3"/>
  <line x1="380" y1="160" x2="380" y2="146" stroke="#15803d" stroke-width="3"/>
  <line x1="388" y1="160" x2="388" y2="146" stroke="#15803d" stroke-width="3"/>

  <!-- Flow arrows -->
  <!-- Into RA from SVC -->
  <line x1="251" y1="158" x2="280" y2="200" stroke="#1e3a8a" stroke-width="1.5"/>
  <polygon points="276,196 282,202 274,204" fill="#1e3a8a"/>
  <!-- RA → RV -->
  <line x1="316" y1="220" x2="316" y2="320" stroke="#1e3a8a" stroke-width="1.5"/>
  <polygon points="312,316 316,326 320,316" fill="#1e3a8a"/>
  <!-- RV → pulmonary artery -->
  <line x1="316" y1="320" x2="320" y2="180" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="316,182 320,172 324,182" fill="#1e3a8a"/>
  <!-- Pulm vein → LA -->
  <line x1="500" y1="200" x2="460" y2="220" stroke="#7f1d1d" stroke-width="1.5"/>
  <polygon points="464,216 458,224 466,224" fill="#7f1d1d"/>
  <!-- LA → LV -->
  <line x1="466" y1="240" x2="466" y2="340" stroke="#7f1d1d" stroke-width="1.5"/>
  <polygon points="462,336 466,346 470,336" fill="#7f1d1d"/>
  <!-- LV → aorta -->
  <line x1="450" y1="340" x2="430" y2="180" stroke="#7f1d1d" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="426,184 430,174 434,184" fill="#7f1d1d"/>

  <!-- ── Labels ──────────────────────────────────────────────── -->
  <!-- Aorta -->
  <line x1="540" y1="100" x2="600" y2="74" stroke="#4a5568" stroke-width="0.8"/>
  <text x="608" y="74" font-size="11" font-weight="700" fill="#dc2626">Aorta</text>
  <text x="608" y="86" font-size="9" fill="#4a5568">to body</text>

  <!-- Pulmonary artery -->
  <line x1="276" y1="64" x2="180" y2="60" stroke="#4a5568" stroke-width="0.8"/>
  <text x="174" y="58" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="end">Pulmonary artery</text>
  <text x="174" y="70" font-size="9" fill="#4a5568" text-anchor="end">to lungs</text>

  <!-- SVC -->
  <line x1="240" y1="98" x2="180" y2="100" stroke="#4a5568" stroke-width="0.8"/>
  <text x="174" y="100" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="end">Superior vena cava</text>
  <text x="174" y="112" font-size="9" fill="#4a5568" text-anchor="end">from upper body</text>

  <!-- Pulmonary veins -->
  <line x1="556" y1="170" x2="640" y2="160" stroke="#4a5568" stroke-width="0.8"/>
  <text x="648" y="160" font-size="11" font-weight="700" fill="#dc2626">Pulmonary veins</text>
  <text x="648" y="172" font-size="9" fill="#4a5568">from lungs</text>

  <!-- IVC -->
  <line x1="240" y1="430" x2="180" y2="436" stroke="#4a5568" stroke-width="0.8"/>
  <text x="174" y="436" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="end">Inferior vena cava</text>
  <text x="174" y="448" font-size="9" fill="#4a5568" text-anchor="end">from lower body</text>

  <!-- Right atrium -->
  <text x="312" y="208" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Right</text>
  <text x="312" y="222" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">atrium</text>

  <!-- Left atrium -->
  <text x="460" y="208" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">Left</text>
  <text x="460" y="222" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">atrium</text>

  <!-- Right ventricle -->
  <text x="316" y="380" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Right</text>
  <text x="316" y="394" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">ventricle</text>

  <!-- Left ventricle (thicker wall callout) -->
  <text x="466" y="380" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">Left</text>
  <text x="466" y="394" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">ventricle</text>
  <line x1="524" y1="370" x2="600" y2="380" stroke="#4a5568" stroke-width="0.8"/>
  <text x="608" y="378" font-size="10" font-weight="700" fill="#7f1d1d">thicker wall</text>
  <text x="608" y="392" font-size="9" font-style="italic" fill="#4a5568">pumps to whole body</text>

  <!-- Septum -->
  <line x1="380" y1="412" x2="380" y2="488" stroke="#4a5568" stroke-width="0.8"/>
  <text x="380" y="500" font-size="10" font-weight="700" fill="#7f1d1d" text-anchor="middle">interventricular septum</text>

  <!-- Tricuspid valve -->
  <line x1="290" y1="296" x2="160" y2="300" stroke="#4a5568" stroke-width="0.8"/>
  <text x="154" y="298" font-size="10" font-weight="700" fill="#15803d" text-anchor="end">Tricuspid valve</text>
  <text x="154" y="310" font-size="9" font-style="italic" fill="#4a5568" text-anchor="end">RA → RV (3 cusps)</text>

  <!-- Mitral valve -->
  <line x1="476" y1="296" x2="608" y2="300" stroke="#4a5568" stroke-width="0.8"/>
  <text x="616" y="298" font-size="10" font-weight="700" fill="#15803d">Bicuspid (mitral) valve</text>
  <text x="616" y="310" font-size="9" font-style="italic" fill="#4a5568">LA → LV (2 cusps)</text>

  <!-- Pulmonary valve -->
  <line x1="320" y1="148" x2="320" y2="124" stroke="#4a5568" stroke-width="0.8"/>
  <text x="288" y="116" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Pulmonary valve</text>

  <!-- Aortic valve -->
  <line x1="380" y1="148" x2="380" y2="124" stroke="#4a5568" stroke-width="0.8"/>
  <text x="440" y="116" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Aortic valve</text>

  <!-- Bottom legend -->
  <g transform="translate(40, 488)">
    <rect x="0" y="0" width="20" height="14" fill="#fee2e2" stroke="#7f1d1d" stroke-width="1"/>
    <text x="26" y="12" font-size="10" fill="#4a5568">oxygenated blood (left side)</text>
    <rect x="220" y="0" width="20" height="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1"/>
    <text x="246" y="12" font-size="10" fill="#4a5568">deoxygenated blood (right side)</text>
    <line x1="450" y1="7" x2="470" y2="7" stroke="#15803d" stroke-width="3"/>
    <text x="476" y="12" font-size="10" fill="#4a5568">valves (one-way doors)</text>
  </g>
</svg>
