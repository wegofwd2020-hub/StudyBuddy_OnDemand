<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Xylem and phloem cross-section">
  <title>Xylem + Phloem — the two transport tissues</title>
  <desc>A side-by-side cross-section comparison of xylem and phloem, the two complex permanent tissues that make up plant vascular bundles. Xylem is shown on the left as wide hollow tubes (vessel elements and tracheids) with thick lignified walls — these dead cells transport water and minerals upward. Phloem is shown on the right as living sieve-tube elements (with sieve plates) flanked by smaller companion cells — these living cells transport sugars and amino acids both up and down. Direction arrows indicate the flow.</desc>

  <text x="380" y="22" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Xylem and Phloem — Cross-Sections</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Two complex tissues; two transport jobs.</text>

  <!-- ── Xylem panel (left) ─────────────────────────────────── -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="320" height="270" rx="10" fill="#f7fafc" stroke="#319795" stroke-width="2"/>
    <text x="160" y="22" font-size="13" font-weight="700" fill="#319795" text-anchor="middle">Xylem</text>
    <text x="160" y="38" font-size="10" fill="#4a5568" text-anchor="middle">water + minerals · upward only · dead cells</text>

    <!-- Vessel elements: wide hollow circles arranged vertically -->
    <g>
      <!-- Vessel 1 -->
      <circle cx="60" cy="70" r="22" fill="#ccfbf1" stroke="#319795" stroke-width="3"/>
      <circle cx="60" cy="70" r="14" fill="#fff"/>
      <circle cx="60" cy="120" r="22" fill="#ccfbf1" stroke="#319795" stroke-width="3"/>
      <circle cx="60" cy="120" r="14" fill="#fff"/>
      <circle cx="60" cy="170" r="22" fill="#ccfbf1" stroke="#319795" stroke-width="3"/>
      <circle cx="60" cy="170" r="14" fill="#fff"/>
      <circle cx="60" cy="220" r="22" fill="#ccfbf1" stroke="#319795" stroke-width="3"/>
      <circle cx="60" cy="220" r="14" fill="#fff"/>

      <!-- Vessel 2 -->
      <circle cx="120" cy="70" r="22" fill="#ccfbf1" stroke="#319795" stroke-width="3"/>
      <circle cx="120" cy="70" r="14" fill="#fff"/>
      <circle cx="120" cy="120" r="22" fill="#ccfbf1" stroke="#319795" stroke-width="3"/>
      <circle cx="120" cy="120" r="14" fill="#fff"/>
      <circle cx="120" cy="170" r="22" fill="#ccfbf1" stroke="#319795" stroke-width="3"/>
      <circle cx="120" cy="170" r="14" fill="#fff"/>
      <circle cx="120" cy="220" r="22" fill="#ccfbf1" stroke="#319795" stroke-width="3"/>
      <circle cx="120" cy="220" r="14" fill="#fff"/>
    </g>

    <!-- Tracheids (smaller, more pointed) -->
    <g>
      <ellipse cx="180" cy="70" rx="10" ry="14" fill="#ccfbf1" stroke="#319795" stroke-width="2"/>
      <ellipse cx="180" cy="120" rx="10" ry="14" fill="#ccfbf1" stroke="#319795" stroke-width="2"/>
      <ellipse cx="180" cy="170" rx="10" ry="14" fill="#ccfbf1" stroke="#319795" stroke-width="2"/>
      <ellipse cx="180" cy="220" rx="10" ry="14" fill="#ccfbf1" stroke="#319795" stroke-width="2"/>

      <ellipse cx="208" cy="84" rx="10" ry="14" fill="#ccfbf1" stroke="#319795" stroke-width="2"/>
      <ellipse cx="208" cy="134" rx="10" ry="14" fill="#ccfbf1" stroke="#319795" stroke-width="2"/>
      <ellipse cx="208" cy="184" rx="10" ry="14" fill="#ccfbf1" stroke="#319795" stroke-width="2"/>
      <ellipse cx="208" cy="234" rx="10" ry="14" fill="#ccfbf1" stroke="#319795" stroke-width="2"/>
    </g>

    <!-- Xylem fibres (small, packed) -->
    <g fill="#fed7aa" stroke="#b45309" stroke-width="0.8">
      <ellipse cx="240" cy="76" rx="5" ry="8"/>
      <ellipse cx="252" cy="92" rx="5" ry="8"/>
      <ellipse cx="240" cy="108" rx="5" ry="8"/>
      <ellipse cx="252" cy="124" rx="5" ry="8"/>
      <ellipse cx="240" cy="140" rx="5" ry="8"/>
      <ellipse cx="252" cy="156" rx="5" ry="8"/>
      <ellipse cx="240" cy="172" rx="5" ry="8"/>
      <ellipse cx="252" cy="188" rx="5" ry="8"/>
      <ellipse cx="240" cy="204" rx="5" ry="8"/>
      <ellipse cx="252" cy="220" rx="5" ry="8"/>
    </g>

    <!-- Direction arrow inside vessel -->
    <line x1="60" y1="240" x2="60" y2="60" stroke="#15803d" stroke-width="2"/>
    <polygon points="56,60 60,52 64,60" fill="#15803d"/>
    <text x="86" y="50" font-size="10" font-weight="700" fill="#15803d">flow ↑</text>

    <!-- Labels -->
    <line x1="60" y1="48" x2="60" y2="34" stroke="#319795" stroke-width="0.8"/>
    <text x="60" y="58" font-size="9" font-weight="700" fill="#319795" text-anchor="middle">vessel element</text>
    <line x1="180" y1="48" x2="180" y2="38" stroke="#319795" stroke-width="0.8"/>
    <text x="180" y="58" font-size="9" font-weight="700" fill="#319795" text-anchor="middle">tracheid</text>
    <line x1="246" y1="60" x2="246" y2="46" stroke="#b45309" stroke-width="0.8"/>
    <text x="246" y="58" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">fibre</text>

    <text x="20" y="260" font-size="10" font-weight="700" fill="#1a202c">Walls:</text>
    <text x="62" y="260" font-size="10" fill="#4a5568">thick, lignified</text>
    <text x="160" y="260" font-size="10" font-weight="700" fill="#1a202c">Cytoplasm:</text>
    <text x="220" y="260" font-size="10" fill="#4a5568">absent (dead)</text>
  </g>

  <!-- ── Phloem panel (right) ─────────────────────────────────── -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="320" height="270" rx="10" fill="#f7fafc" stroke="#15803d" stroke-width="2"/>
    <text x="160" y="22" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Phloem</text>
    <text x="160" y="38" font-size="10" fill="#4a5568" text-anchor="middle">sugars · up + down · living cells</text>

    <!-- Sieve tube elements with sieve plates (perforated end walls) -->
    <g>
      <rect x="48" y="56" width="48" height="46" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
      <line x1="48" y1="102" x2="96" y2="102" stroke="#15803d" stroke-width="2.5"/>
      <line x1="56" y1="100" x2="56" y2="104" stroke="#fff" stroke-width="1.5"/>
      <line x1="66" y1="100" x2="66" y2="104" stroke="#fff" stroke-width="1.5"/>
      <line x1="76" y1="100" x2="76" y2="104" stroke="#fff" stroke-width="1.5"/>
      <line x1="86" y1="100" x2="86" y2="104" stroke="#fff" stroke-width="1.5"/>

      <rect x="48" y="102" width="48" height="46" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
      <line x1="48" y1="148" x2="96" y2="148" stroke="#15803d" stroke-width="2.5"/>
      <line x1="56" y1="146" x2="56" y2="150" stroke="#fff" stroke-width="1.5"/>
      <line x1="66" y1="146" x2="66" y2="150" stroke="#fff" stroke-width="1.5"/>
      <line x1="76" y1="146" x2="76" y2="150" stroke="#fff" stroke-width="1.5"/>
      <line x1="86" y1="146" x2="86" y2="150" stroke="#fff" stroke-width="1.5"/>

      <rect x="48" y="148" width="48" height="46" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
      <line x1="48" y1="194" x2="96" y2="194" stroke="#15803d" stroke-width="2.5"/>
      <line x1="56" y1="192" x2="56" y2="196" stroke="#fff" stroke-width="1.5"/>
      <line x1="66" y1="192" x2="66" y2="196" stroke="#fff" stroke-width="1.5"/>
      <line x1="76" y1="192" x2="76" y2="196" stroke="#fff" stroke-width="1.5"/>
      <line x1="86" y1="192" x2="86" y2="196" stroke="#fff" stroke-width="1.5"/>

      <rect x="48" y="194" width="48" height="46" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    </g>

    <!-- Companion cells (small, dense, beside sieve tubes) -->
    <g>
      <rect x="100" y="60" width="20" height="38" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
      <ellipse cx="110" cy="78" rx="5" ry="7" fill="#14532d"/>
      <rect x="100" y="106" width="20" height="38" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
      <ellipse cx="110" cy="124" rx="5" ry="7" fill="#14532d"/>
      <rect x="100" y="152" width="20" height="38" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
      <ellipse cx="110" cy="170" rx="5" ry="7" fill="#14532d"/>
      <rect x="100" y="198" width="20" height="38" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
      <ellipse cx="110" cy="216" rx="5" ry="7" fill="#14532d"/>
    </g>

    <!-- Phloem fibres -->
    <g fill="#fed7aa" stroke="#b45309" stroke-width="0.8">
      <ellipse cx="160" cy="68" rx="5" ry="8"/>
      <ellipse cx="172" cy="84" rx="5" ry="8"/>
      <ellipse cx="160" cy="100" rx="5" ry="8"/>
      <ellipse cx="172" cy="116" rx="5" ry="8"/>
      <ellipse cx="160" cy="132" rx="5" ry="8"/>
      <ellipse cx="172" cy="148" rx="5" ry="8"/>
      <ellipse cx="160" cy="164" rx="5" ry="8"/>
      <ellipse cx="172" cy="180" rx="5" ry="8"/>
      <ellipse cx="160" cy="196" rx="5" ry="8"/>
      <ellipse cx="172" cy="212" rx="5" ry="8"/>
    </g>

    <!-- Phloem parenchyma -->
    <g fill="#fef3c7" stroke="#15803d" stroke-width="0.8">
      <circle cx="208" cy="74" r="9"/>
      <circle cx="226" cy="92" r="9"/>
      <circle cx="208" cy="112" r="9"/>
      <circle cx="226" cy="130" r="9"/>
      <circle cx="208" cy="150" r="9"/>
      <circle cx="226" cy="168" r="9"/>
      <circle cx="208" cy="188" r="9"/>
      <circle cx="226" cy="206" r="9"/>
    </g>

    <!-- Bidirectional arrow inside sieve tube -->
    <line x1="72" y1="234" x2="72" y2="60" stroke="#dc2626" stroke-width="2"/>
    <polygon points="68,60 72,52 76,60" fill="#dc2626"/>
    <polygon points="68,234 72,242 76,234" fill="#dc2626"/>
    <text x="20" y="160" font-size="10" font-weight="700" fill="#dc2626">↕</text>
    <text x="20" y="174" font-size="9" fill="#dc2626">flow</text>

    <!-- Labels -->
    <line x1="72" y1="46" x2="72" y2="34" stroke="#15803d" stroke-width="0.8"/>
    <text x="72" y="58" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">sieve tube</text>
    <line x1="110" y1="48" x2="110" y2="36" stroke="#15803d" stroke-width="0.8"/>
    <text x="138" y="58" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">companion cell</text>
    <line x1="166" y1="60" x2="166" y2="46" stroke="#b45309" stroke-width="0.8"/>
    <text x="166" y="58" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">fibre</text>
    <line x1="218" y1="62" x2="218" y2="46" stroke="#15803d" stroke-width="0.8"/>
    <text x="240" y="58" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">parenchyma</text>

    <text x="20" y="260" font-size="10" font-weight="700" fill="#1a202c">Walls:</text>
    <text x="62" y="260" font-size="10" fill="#4a5568">thin, cellulose</text>
    <text x="160" y="260" font-size="10" font-weight="700" fill="#1a202c">Cytoplasm:</text>
    <text x="220" y="260" font-size="10" fill="#4a5568">present (alive)</text>
  </g>

  <!-- Bottom comparison -->
  <text x="380" y="354" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Together, xylem + phloem form the vascular bundle — the plant's plumbing.</text>
  <text x="380" y="370" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">The girdling experiment: cut a ring of bark (which contains phloem) and the tree dies above the cut, even though water still rises through the wood (xylem).</text>
</svg>
