<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="Meristematic regions on a plant">
  <title>Meristematic regions — apical, lateral, intercalary</title>
  <desc>A simplified plant diagram showing the three locations of meristematic (actively dividing) tissue. Apical meristems sit at the tip of the shoot and the tip of the root, driving primary growth in length. Lateral meristems (vascular cambium and cork cambium) are vertical cylinders inside the stem and root, driving secondary growth in girth. Intercalary meristems sit at the base of leaves and at nodes (especially in grasses), allowing regrowth after grazing or mowing. Each region is colour-coded and labelled with what kind of growth it produces.</desc>

  <text x="360" y="22" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Meristematic Regions — Where the Plant Grows</text>
  <text x="360" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Three locations of dividing cells — each adds a different kind of growth.</text>

  <!-- Sky/ground reference -->
  <rect x="0" y="58" width="720" height="280" fill="#f7fafc"/>
  <rect x="0" y="338" width="720" height="120" fill="#fef3c7" opacity="0.5"/>
  <line x1="0" y1="338" x2="720" y2="338" stroke="#78350f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="700" y="354" font-size="10" fill="#78350f" text-anchor="end">soil line</text>

  <!-- ── Plant body ────────────────────────────────────────────────── -->
  <!-- Stem -->
  <rect x="346" y="120" width="28" height="218" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <!-- Shoot tip -->
  <path d="M 346 120 Q 360 92 374 120 Z" fill="#86efac" stroke="#15803d" stroke-width="1.8"/>
  <!-- Apical bud / leaves at tip -->
  <path d="M 360 96 Q 350 88 354 76 Q 360 70 366 76 Q 370 88 360 96 Z" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>

  <!-- Lower leaves with intercalary meristem markers -->
  <g>
    <!-- left leaf at upper node -->
    <path d="M 346 168 Q 318 156 296 168 Q 280 178 296 188 Q 322 196 346 184 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <!-- right leaf at upper node -->
    <path d="M 374 168 Q 402 156 424 168 Q 440 178 424 188 Q 398 196 374 184 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <!-- left leaf at lower node -->
    <path d="M 346 244 Q 320 230 296 242 Q 282 252 296 262 Q 320 270 346 258 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <!-- right leaf at lower node -->
    <path d="M 374 244 Q 400 230 424 242 Q 438 252 424 262 Q 400 270 374 258 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <!-- node markers (rings) -->
    <ellipse cx="360" cy="178" rx="14" ry="3" fill="none" stroke="#15803d" stroke-width="1"/>
    <ellipse cx="360" cy="252" rx="14" ry="3" fill="none" stroke="#15803d" stroke-width="1"/>
  </g>

  <!-- Root system below soil -->
  <path d="M 346 338 Q 340 380 320 414 Q 308 432 304 458" fill="none" stroke="#78350f" stroke-width="3"/>
  <path d="M 374 338 Q 380 380 400 414 Q 412 432 416 458" fill="none" stroke="#78350f" stroke-width="3"/>
  <path d="M 360 338 L 360 460" stroke="#78350f" stroke-width="3"/>
  <!-- Lateral roots -->
  <path d="M 340 384 Q 310 388 286 404" fill="none" stroke="#78350f" stroke-width="1.5"/>
  <path d="M 380 384 Q 410 388 434 404" fill="none" stroke="#78350f" stroke-width="1.5"/>
  <path d="M 354 420 Q 332 428 318 442" fill="none" stroke="#78350f" stroke-width="1.5"/>
  <path d="M 366 420 Q 388 428 402 442" fill="none" stroke="#78350f" stroke-width="1.5"/>

  <!-- Root tip caps -->
  <ellipse cx="304" cy="458" rx="6" ry="4" fill="#dc2626" opacity="0.6"/>
  <ellipse cx="416" cy="458" rx="6" ry="4" fill="#dc2626" opacity="0.6"/>
  <ellipse cx="360" cy="460" rx="6" ry="4" fill="#dc2626" opacity="0.6"/>

  <!-- ── Highlight 1: Apical meristem (shoot tip) ─────────────────── -->
  <circle cx="360" cy="86" r="22" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="382" y1="80" x2="510" y2="68" stroke="#dc2626" stroke-width="1"/>
  <g transform="translate(515, 56)">
    <rect x="0" y="0" width="200" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="10" y="18" font-size="12" font-weight="700" fill="#dc2626">Apical meristem (shoot)</text>
    <text x="10" y="34" font-size="10" fill="#4a5568">Tip of every shoot + branch</text>
    <text x="10" y="48" font-size="10" font-weight="700" fill="#1a202c">Drives: primary growth</text>
    <text x="10" y="60" font-size="9" font-style="italic" fill="#4a5568">(adds height; new leaves)</text>
  </g>

  <!-- ── Highlight 2: Apical meristem (root tip) ──────────────────── -->
  <circle cx="416" cy="450" r="18" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="434" y1="450" x2="520" y2="446" stroke="#dc2626" stroke-width="1"/>
  <g transform="translate(525, 416)">
    <rect x="0" y="0" width="190" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="10" y="18" font-size="12" font-weight="700" fill="#dc2626">Apical meristem (root)</text>
    <text x="10" y="34" font-size="10" fill="#4a5568">Just behind every root cap</text>
    <text x="10" y="48" font-size="10" font-weight="700" fill="#1a202c">Drives: root elongation</text>
  </g>

  <!-- ── Highlight 3: Lateral meristem (vascular cambium) ─────────── -->
  <rect x="350" y="180" width="20" height="150" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="350" y1="240" x2="220" y2="240" stroke="#7c3aed" stroke-width="1"/>
  <g transform="translate(20, 210)">
    <rect x="0" y="0" width="200" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="10" y="18" font-size="12" font-weight="700" fill="#7c3aed">Lateral meristem</text>
    <text x="10" y="34" font-size="10" fill="#4a5568">Vertical cylinder inside stem + root</text>
    <text x="10" y="48" font-size="10" font-weight="700" fill="#1a202c">Drives: secondary growth</text>
    <text x="10" y="60" font-size="9" font-style="italic" fill="#4a5568">(adds girth; tree rings)</text>
  </g>

  <!-- ── Highlight 4: Intercalary meristem ────────────────────────── -->
  <ellipse cx="360" cy="178" rx="18" ry="6" fill="none" stroke="#319795" stroke-width="2" stroke-dasharray="4 2"/>
  <ellipse cx="360" cy="252" rx="18" ry="6" fill="none" stroke="#319795" stroke-width="2" stroke-dasharray="4 2"/>
  <line x1="378" y1="252" x2="510" y2="270" stroke="#319795" stroke-width="1"/>
  <g transform="translate(515, 248)">
    <rect x="0" y="0" width="200" height="62" rx="8" fill="#ccfbf1" stroke="#319795" stroke-width="1.5"/>
    <text x="10" y="18" font-size="12" font-weight="700" fill="#319795">Intercalary meristem</text>
    <text x="10" y="34" font-size="10" fill="#4a5568">At nodes + bases of leaves</text>
    <text x="10" y="48" font-size="10" font-weight="700" fill="#1a202c">Drives: regrowth after grazing</text>
    <text x="10" y="60" font-size="9" font-style="italic" fill="#4a5568">(common in grasses)</text>
  </g>

  <!-- Bottom caption -->
  <text x="360" y="476" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">Meristems are pockets of permanently young, dividing cells. Everywhere else in the plant, cells are differentiated and rarely divide.</text>
</svg>
