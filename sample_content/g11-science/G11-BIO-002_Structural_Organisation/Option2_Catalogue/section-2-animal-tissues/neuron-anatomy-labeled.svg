<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Neuron anatomy labeled">
  <title>Neuron anatomy — the unit cell of the nervous system</title>
  <desc>A horizontally elongated multipolar neuron drawn in cross-section style. The diagram labels eight components: dendrites (signal-receiving branches at the left), cell body (soma) containing the nucleus, axon hillock (transition zone), axon (long signal-carrying cable), myelin sheath (segmented insulating wraps formed by Schwann cells), nodes of Ranvier (gaps between sheath segments), Schwann cells (one labelled), and axon terminals (synaptic end-bulbs at the right). An arrow at the bottom shows the direction of impulse propagation from dendrites to terminals.</desc>

  <text x="380" y="22" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Neuron — Anatomy of the Nerve Cell</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">One neuron carries an electrical signal from dendrites → cell body → axon → terminals.</text>

  <!-- Dendrites (left side, branched tree) -->
  <g stroke="#7c3aed" fill="none">
    <line x1="40" y1="120" x2="120" y2="160" stroke-width="3"/>
    <line x1="50" y1="92" x2="118" y2="155" stroke-width="3"/>
    <line x1="42" y1="160" x2="120" y2="170" stroke-width="3"/>
    <line x1="48" y1="194" x2="118" y2="178" stroke-width="3"/>
    <line x1="60" y1="76" x2="118" y2="150" stroke-width="2.5"/>
    <line x1="72" y1="216" x2="120" y2="184" stroke-width="2.5"/>
    <!-- sub-branches -->
    <line x1="50" y1="104" x2="32" y2="86" stroke-width="1.4"/>
    <line x1="50" y1="104" x2="38" y2="116" stroke-width="1.4"/>
    <line x1="56" y1="86" x2="40" y2="68" stroke-width="1.4"/>
    <line x1="56" y1="86" x2="62" y2="62" stroke-width="1.4"/>
    <line x1="64" y1="80" x2="76" y2="56" stroke-width="1.4"/>
    <line x1="48" y1="146" x2="30" y2="142" stroke-width="1.4"/>
    <line x1="48" y1="174" x2="30" y2="180" stroke-width="1.4"/>
    <line x1="56" y1="200" x2="40" y2="216" stroke-width="1.4"/>
    <line x1="64" y1="208" x2="60" y2="232" stroke-width="1.4"/>
  </g>

  <!-- Cell body (soma) -->
  <ellipse cx="170" cy="160" rx="56" ry="46" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <!-- Nucleus -->
  <ellipse cx="170" cy="160" rx="22" ry="18" fill="#7c3aed" opacity="0.65"/>
  <!-- Nucleolus -->
  <circle cx="170" cy="160" r="6" fill="#fff"/>
  <circle cx="170" cy="160" r="3" fill="#4a1d96"/>

  <!-- Axon hillock + axon (long, with myelin segments) -->
  <path d="M 226 160 Q 240 160 256 160 L 660 160" fill="none" stroke="#7c3aed" stroke-width="5"/>

  <!-- Myelin sheath segments -->
  <ellipse cx="290" cy="160" rx="28" ry="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="362" cy="160" rx="28" ry="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="434" cy="160" rx="28" ry="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="506" cy="160" rx="28" ry="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="578" cy="160" rx="28" ry="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>

  <!-- Schwann-cell nuclei dotted on segments -->
  <ellipse cx="290" cy="152" rx="3" ry="2" fill="#78350f"/>
  <ellipse cx="362" cy="152" rx="3" ry="2" fill="#78350f"/>
  <ellipse cx="434" cy="152" rx="3" ry="2" fill="#78350f"/>
  <ellipse cx="506" cy="152" rx="3" ry="2" fill="#78350f"/>
  <ellipse cx="578" cy="152" rx="3" ry="2" fill="#78350f"/>

  <!-- Axon terminals (synaptic boutons) -->
  <line x1="660" y1="160" x2="690" y2="120" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="660" y1="160" x2="700" y2="140" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="660" y1="160" x2="708" y2="160" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="660" y1="160" x2="700" y2="180" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="660" y1="160" x2="690" y2="200" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="694" cy="116" r="5" fill="#7c3aed"/>
  <circle cx="704" cy="138" r="5" fill="#7c3aed"/>
  <circle cx="712" cy="160" r="5" fill="#7c3aed"/>
  <circle cx="704" cy="182" r="5" fill="#7c3aed"/>
  <circle cx="694" cy="204" r="5" fill="#7c3aed"/>

  <!-- Labels with leader lines -->
  <line x1="60" y1="74" x2="60" y2="58" stroke="#4a5568" stroke-width="0.8"/>
  <text x="60" y="54" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">dendrites</text>
  <text x="60" y="68" font-size="9" fill="#4a5568" text-anchor="middle">receive signals</text>

  <line x1="170" y1="206" x2="170" y2="232" stroke="#4a5568" stroke-width="0.8"/>
  <text x="170" y="248" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">cell body (soma)</text>
  <text x="170" y="262" font-size="9" fill="#4a5568" text-anchor="middle">contains nucleus, organelles</text>

  <line x1="170" y1="138" x2="170" y2="116" stroke="#4a5568" stroke-width="0.8"/>
  <text x="170" y="112" font-size="10" fill="#4a1d96" text-anchor="middle">nucleus</text>

  <line x1="240" y1="160" x2="240" y2="120" stroke="#4a5568" stroke-width="0.8"/>
  <text x="240" y="116" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">axon hillock</text>

  <line x1="362" y1="172" x2="362" y2="208" stroke="#4a5568" stroke-width="0.8"/>
  <text x="362" y="224" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">myelin sheath</text>
  <text x="362" y="238" font-size="9" fill="#4a5568" text-anchor="middle">insulating wrap (Schwann cells)</text>

  <line x1="326" y1="160" x2="326" y2="106" stroke="#4a5568" stroke-width="0.8"/>
  <text x="326" y="100" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">node of Ranvier</text>
  <text x="326" y="114" font-size="9" fill="#4a5568" text-anchor="middle">gap between sheaths</text>

  <line x1="506" y1="160" x2="506" y2="106" stroke="#4a5568" stroke-width="0.8"/>
  <text x="506" y="100" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">axon</text>
  <text x="506" y="114" font-size="9" fill="#4a5568" text-anchor="middle">conducts impulse</text>

  <line x1="700" y1="220" x2="700" y2="248" stroke="#4a5568" stroke-width="0.8"/>
  <text x="700" y="262" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">axon terminals</text>
  <text x="700" y="276" font-size="9" fill="#4a5568" text-anchor="middle">release neurotransmitter</text>

  <!-- Direction arrow at bottom -->
  <line x1="100" y1="296" x2="660" y2="296" stroke="#15803d" stroke-width="2"/>
  <polygon points="660,290 672,296 660,302" fill="#15803d"/>
  <text x="380" y="312" font-size="11" font-style="italic" fill="#15803d" text-anchor="middle">Direction of impulse propagation</text>
</svg>
