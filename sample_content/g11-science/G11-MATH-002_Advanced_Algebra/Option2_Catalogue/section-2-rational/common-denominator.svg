<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Adding rational expressions using a common denominator">
  <title>Common Denominator: 1/(x−1) + 2/(x+3)</title>
  <desc>Each fraction is multiplied by the missing factor to share a common denominator (x−1)(x+3); numerators are then summed.</desc>

  <defs>
    <style>
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .step    { font: 12px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; font-style: italic; }
      .num     { font: 14px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; font-weight: 600; }
      .multby  { font: 11px system-ui, sans-serif; fill: #6b46c1; text-anchor: middle; font-style: italic; }
      .frac-line { stroke: #1a202c; stroke-width: 1.4; }
      .arrow { stroke: #6b46c1; stroke-width: 1.6; }
      .panel { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1.2; }
    </style>
  </defs>

  <text class="heading" x="320" y="22">Adding fractions:  use a common denominator</text>

  <!-- Original sum: 1/(x-1) + 2/(x+3) -->
  <g transform="translate(60, 50)">
    <text class="step" x="200" y="-4">Step 1 — original</text>
    <!-- frac 1 -->
    <text class="num" x="60" y="40">1</text>
    <line class="frac-line" x1="30" y1="48" x2="90" y2="48"/>
    <text class="num" x="60" y="68">x − 1</text>
    <!-- + sign -->
    <text class="num" x="200" y="56">+</text>
    <!-- frac 2 -->
    <text class="num" x="340" y="40">2</text>
    <line class="frac-line" x1="305" y1="48" x2="375" y2="48"/>
    <text class="num" x="340" y="68">x + 3</text>
  </g>

  <!-- Step 2: each multiplied -->
  <g transform="translate(60, 130)">
    <text class="step" x="200" y="-4">Step 2 — multiply by missing factor (highlighted)</text>
    <!-- frac 1: 1·(x+3) / (x-1)(x+3) -->
    <text class="num" x="60" y="40"><tspan>1 · </tspan><tspan fill="#6b46c1">(x + 3)</tspan></text>
    <line class="frac-line" x1="20" y1="48" x2="125" y2="48"/>
    <text class="num" x="60" y="68"><tspan>(x − 1)</tspan><tspan fill="#6b46c1">(x + 3)</tspan></text>
    <!-- + sign -->
    <text class="num" x="200" y="56">+</text>
    <!-- frac 2: 2·(x-1) / (x+3)(x-1) -->
    <text class="num" x="340" y="40"><tspan>2 · </tspan><tspan fill="#6b46c1">(x − 1)</tspan></text>
    <line class="frac-line" x1="280" y1="48" x2="395" y2="48"/>
    <text class="num" x="340" y="68"><tspan fill="#6b46c1">(x − 1)</tspan><tspan>(x + 3)</tspan></text>

    <!-- annotation -->
    <text class="multby" x="200" y="100">Multiply top and bottom of each by the factor it is missing.</text>
  </g>

  <!-- Step 3: combined numerator over LCD -->
  <g transform="translate(140, 232)">
    <rect class="panel" x="0" y="0" width="360" height="74" rx="8"/>
    <text class="step" x="180" y="-4">Step 3 — combine over the LCD, expand &amp; simplify</text>
    <text class="num" x="180" y="32">(x + 3) + 2(x − 1)</text>
    <line class="frac-line" x1="50" y1="40" x2="310" y2="40"/>
    <text class="num" x="180" y="60">(x − 1)(x + 3)</text>
  </g>

  <!-- Final answer banner -->
  <g transform="translate(195, 0)">
    <rect x="0" y="306" width="0" height="0" fill="none"/>
  </g>
</svg>
