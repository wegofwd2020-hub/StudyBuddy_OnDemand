<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Sign analysis number line for a polynomial inequality">
  <title>Sign Analysis: (x + 1)(x − 2)(x − 4) &gt; 0</title>
  <desc>Number line with critical points at x = −1, 2, 4 dividing into four intervals; each interval's sign is computed from the three factors.</desc>

  <defs>
    <style>
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .nl    { stroke: #1a202c; stroke-width: 1.6; }
      .tick  { stroke: #1a202c; stroke-width: 1; }
      .crit-open  { fill: white; stroke: #c53030; stroke-width: 2.5; }
      .pos-fill { fill: #c6f6d5; }
      .neg-fill { fill: #fed7d7; }
      .lbl   { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .crit  { font: bold 12px system-ui, sans-serif; fill: #c53030; text-anchor: middle; }
      .sign  { font: bold 18px system-ui, sans-serif; text-anchor: middle; }
      .sol   { stroke: #2f855a; stroke-width: 5; stroke-linecap: round; }
      .factor-row { font: 12px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
    </style>
  </defs>

  <text class="heading" x="320" y="22">Sign analysis:  (x + 1)(x − 2)(x − 4) &gt; 0</text>

  <!-- Number line: x in [-3, 6] mapped to px = 60 + (x+3)/9 * 520 -->
  <!-- Critical points: x=-1 → px=60 + 2/9*520 = 60 + 115.6 = 175.6; x=2 → px=60+5/9*520=60+288.9=348.9; x=4 → px=60+7/9*520=60+404.4=464.4 -->

  <!-- Background regions (slightly tinted) -->
  <rect class="neg-fill" x="60"    y="160" width="115.6" height="40" opacity="0.5"/>
  <rect class="pos-fill" x="175.6" y="160" width="173.3" height="40" opacity="0.6"/>
  <rect class="neg-fill" x="348.9" y="160" width="115.5" height="40" opacity="0.5"/>
  <rect class="pos-fill" x="464.4" y="160" width="115.6" height="40" opacity="0.6"/>

  <!-- Number line -->
  <line class="nl" x1="60" y1="180" x2="580" y2="180"/>

  <!-- Tick marks at integer values -->
  <line class="tick" x1="60" y1="174"    x2="60" y2="186"/>    <text class="lbl" x="60"    y="202">−3</text>
  <line class="tick" x1="117.8" y1="174" x2="117.8" y2="186"/> <text class="lbl" x="117.8" y="202">−2</text>
  <line class="tick" x1="175.6" y1="174" x2="175.6" y2="186"/>
  <line class="tick" x1="233.3" y1="174" x2="233.3" y2="186"/> <text class="lbl" x="233.3" y="202">0</text>
  <line class="tick" x1="291.1" y1="174" x2="291.1" y2="186"/> <text class="lbl" x="291.1" y="202">1</text>
  <line class="tick" x1="348.9" y1="174" x2="348.9" y2="186"/>
  <line class="tick" x1="406.7" y1="174" x2="406.7" y2="186"/> <text class="lbl" x="406.7" y="202">3</text>
  <line class="tick" x1="464.4" y1="174" x2="464.4" y2="186"/>
  <line class="tick" x1="522.2" y1="174" x2="522.2" y2="186"/> <text class="lbl" x="522.2" y="202">5</text>
  <line class="tick" x1="580"   y1="174" x2="580"   y2="186"/> <text class="lbl" x="580"   y="202">6</text>

  <!-- Critical points (open since strict inequality) -->
  <circle class="crit-open" cx="175.6" cy="180" r="6"/>
  <text class="crit" x="175.6" y="222">x = −1</text>
  <circle class="crit-open" cx="348.9" cy="180" r="6"/>
  <text class="crit" x="348.9" y="222">x = 2</text>
  <circle class="crit-open" cx="464.4" cy="180" r="6"/>
  <text class="crit" x="464.4" y="222">x = 4</text>

  <!-- Test-point signs in each interval -->
  <text class="sign" x="117.8" y="148" fill="#c53030">−</text>
  <text class="sign" x="262"   y="148" fill="#2f855a">+</text>
  <text class="sign" x="406.7" y="148" fill="#c53030">−</text>
  <text class="sign" x="522.2" y="148" fill="#2f855a">+</text>

  <!-- Test-point captions -->
  <text class="lbl" x="117.8" y="135">test x = −2</text>
  <text class="lbl" x="262"   y="135">test x = 0</text>
  <text class="lbl" x="406.7" y="135">test x = 3</text>
  <text class="lbl" x="522.2" y="135">test x = 5</text>

  <!-- Factor-by-factor sign rows -->
  <g transform="translate(0, 60)">
    <text class="factor-row" font-weight="700" x="35" y="0" text-anchor="start">Factor signs:</text>
    <text class="factor-row" x="35"    y="22" text-anchor="start">x + 1</text>
    <text class="factor-row" x="117.8" y="22" fill="#c53030">−</text>
    <text class="factor-row" x="262"   y="22" fill="#2f855a">+</text>
    <text class="factor-row" x="406.7" y="22" fill="#2f855a">+</text>
    <text class="factor-row" x="522.2" y="22" fill="#2f855a">+</text>

    <text class="factor-row" x="35"    y="40" text-anchor="start">x − 2</text>
    <text class="factor-row" x="117.8" y="40" fill="#c53030">−</text>
    <text class="factor-row" x="262"   y="40" fill="#c53030">−</text>
    <text class="factor-row" x="406.7" y="40" fill="#2f855a">+</text>
    <text class="factor-row" x="522.2" y="40" fill="#2f855a">+</text>

    <text class="factor-row" x="35"    y="58" text-anchor="start">x − 4</text>
    <text class="factor-row" x="117.8" y="58" fill="#c53030">−</text>
    <text class="factor-row" x="262"   y="58" fill="#c53030">−</text>
    <text class="factor-row" x="406.7" y="58" fill="#c53030">−</text>
    <text class="factor-row" x="522.2" y="58" fill="#2f855a">+</text>
  </g>

  <!-- Solution segments -->
  <line class="sol" x1="175.6" y1="260" x2="348.9" y2="260"/>
  <line class="sol" x1="464.4" y1="260" x2="580"   y2="260"/>
  <circle cx="175.6" cy="260" r="5" fill="white" stroke="#2f855a" stroke-width="2.5"/>
  <circle cx="348.9" cy="260" r="5" fill="white" stroke="#2f855a" stroke-width="2.5"/>
  <circle cx="464.4" cy="260" r="5" fill="white" stroke="#2f855a" stroke-width="2.5"/>

  <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2f855a" x="60" y="252">Solution:</text>
  <text font="bold 13px system-ui" font-size="13" font-weight="700" fill="#2f855a" x="320" y="284" text-anchor="middle">x ∈ (−1, 2) ∪ (4, ∞)</text>

  <text x="320" y="308" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Open circles because the inequality is strict (&gt; 0, not ≥ 0).</text>
</svg>
