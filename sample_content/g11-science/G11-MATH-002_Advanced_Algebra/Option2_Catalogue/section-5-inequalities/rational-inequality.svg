<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Rational inequality with vertical asymptote">
  <title>Rational Inequality:  (x − 1) / (x − 3) ≥ 0</title>
  <desc>Two branches of y = (x − 1)/(x − 3) separated by a vertical asymptote at x = 3; solution set marked on the x-axis with closed bracket at x = 1 and open at x = 3.</desc>

  <defs>
    <style>
      .axis    { stroke: #94a3b8; stroke-width: 1.4; }
      .grid    { stroke: #e2e8f0; stroke-width: 0.6; }
      .va      { stroke: #c53030; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .ha      { stroke: #6b46c1; stroke-width: 1.4; stroke-dasharray: 4 4; }
      .curve   { fill: none; stroke: #2b6cb0; stroke-width: 3; stroke-linecap: round; }
      .axislbl { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .lbl     { font: bold 12px system-ui, sans-serif; }
      .panel   { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .closed  { fill: #2f855a; stroke: white; stroke-width: 2; }
      .open    { fill: white; stroke: #c53030; stroke-width: 2.5; }
      .sol     { stroke: #2f855a; stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>

  <text class="heading" x="300" y="22">Rational inequality:  (x − 1) / (x − 3)  ≥  0</text>

  <!-- Plot frame -->
  <rect class="panel" x="60" y="60" width="320" height="180"/>

  <!-- vertical grid x = 0,1,2,3,4,5,6 → 105.7, 151.4, 197.1, 242.9, 288.6, 334.3, 380 -->
  <line class="grid" x1="105.7" y1="60" x2="105.7" y2="240"/>
  <line class="grid" x1="151.4" y1="60" x2="151.4" y2="240"/>
  <line class="grid" x1="197.1" y1="60" x2="197.1" y2="240"/>
  <line class="grid" x1="288.6" y1="60" x2="288.6" y2="240"/>
  <line class="grid" x1="334.3" y1="60" x2="334.3" y2="240"/>

  <!-- horizontal grid y = -2,2 → 105, 195 -->
  <line class="grid" x1="60" y1="105" x2="380" y2="105"/>
  <line class="grid" x1="60" y1="195" x2="380" y2="195"/>

  <!-- axes -->
  <line class="axis" x1="60" y1="150" x2="380" y2="150"/>
  <line class="axis" x1="105.7" y1="60" x2="105.7" y2="240"/>

  <!-- horizontal asymptote y = 1 → py = 127.5 -->
  <line class="ha" x1="60" y1="127.5" x2="380" y2="127.5"/>
  <text class="lbl" x="370" y="121" fill="#6b46c1" text-anchor="end">HA: y = 1</text>

  <!-- vertical asymptote x = 3 → px = 242.86 -->
  <line class="va" x1="242.86" y1="60" x2="242.86" y2="240"/>
  <text class="lbl" x="247" y="74" fill="#c53030">VA: x = 3</text>

  <!-- Left branch from x=-1 to x=2.7 -->
  <polyline class="curve" points="60,138.75 105.7,142.5 151.4,150 197.1,172.5 220,200 232,232"/>

  <!-- Right branch from x=3.3 to x=6 -->
  <polyline class="curve" points="254,68 266,90 288.6,82.5 334.3,105 380,112.5"/>

  <!-- ticks -->
  <text class="axislbl" x="105.7" y="164">0</text>
  <text class="axislbl" x="151.4" y="164">1</text>
  <text class="axislbl" x="197.1" y="164">2</text>
  <text class="axislbl" x="242.86" y="164" fill="#c53030">3</text>
  <text class="axislbl" x="288.6" y="164">4</text>
  <text class="axislbl" x="334.3" y="164">5</text>
  <text class="axislbl" x="380" y="164">6</text>
  <text class="axislbl" x="95" y="109" text-anchor="end">2</text>
  <text class="axislbl" x="95" y="199" text-anchor="end">−2</text>
  <text class="axislbl" x="392" y="154">x</text>
  <text class="axislbl" x="105.7" y="55">y</text>

  <!-- Equation label on plot -->
  <text class="lbl" x="100" y="98" fill="#2b6cb0">y = (x − 1)/(x − 3)</text>

  <!-- Solution segments on number line below -->
  <line class="sol" x1="60"    y1="270" x2="151.4" y2="270"/>
  <line class="sol" x1="242.86" y1="270" x2="380"   y2="270"/>

  <!-- closed at x=1, open at x=3 -->
  <circle class="closed" cx="151.4" cy="270" r="6"/>
  <circle class="open"   cx="242.86" cy="270" r="6"/>

  <!-- Left arrow indicator -->
  <text font="11px system-ui" font-size="11" fill="#2f855a" x="55" y="270" text-anchor="end">−∞</text>
  <text font="11px system-ui" font-size="11" fill="#2f855a" x="385" y="270">∞</text>

  <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2f855a" x="60" y="294">Solution:  (−∞, 1] ∪ (3, ∞)</text>
  <text font="11px system-ui" font-size="11" fill="#4a5568" x="60" y="312" font-style="italic">Closed at x = 1 (numerator = 0 satisfies ≥);   open at x = 3 (denominator = 0, undefined).</text>

  <!-- Right side: critical-point logic -->
  <g transform="translate(410, 60)">
    <rect x="0" y="0" width="180" height="170" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
    <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" x="90" y="20" text-anchor="middle">Critical points</text>
    <text font="11px system-ui" font-size="11" fill="#1a202c" x="14" y="42">• x = 1  (numerator = 0)</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="58" font-style="italic">  closed bracket — included</text>
    <text font="11px system-ui" font-size="11" fill="#1a202c" x="14" y="80">• x = 3  (denominator = 0)</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="96" font-style="italic">  open bracket — excluded</text>
    <text font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" x="14" y="124">Sign in each zone:</text>
    <text font="11px system-ui" font-size="11" fill="#2f855a" x="14" y="142">x &lt; 1:    + ✓</text>
    <text font="11px system-ui" font-size="11" fill="#c53030" x="14" y="158">1 &lt; x &lt; 3:  −</text>
    <text font="11px system-ui" font-size="11" fill="#2f855a" x="100" y="142">x &gt; 3:    + ✓</text>
  </g>
</svg>
