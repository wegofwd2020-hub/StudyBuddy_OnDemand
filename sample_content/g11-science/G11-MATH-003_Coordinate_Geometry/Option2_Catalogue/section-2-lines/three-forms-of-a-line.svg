<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Three equivalent forms for the equation of the same straight line">
  <title>Three Forms of a Line: Slope-Intercept, Point-Slope, Two-Point</title>
  <desc>The same line — passing through (2, 3) and (4, 7) with slope 2 — written in three equivalent forms: slope-intercept y = 2x − 1, point-slope y − 3 = 2(x − 2), and two-point (y − 3)/(x − 2) = (7 − 3)/(4 − 2). All collapse to y = 2x − 1.</desc>

  <defs>
    <style>
      .axis    { stroke: #94a3b8; stroke-width: 1.4; }
      .grid    { stroke: #e2e8f0; stroke-width: 0.6; }
      .panel   { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .line    { stroke: #2b6cb0; stroke-width: 3; stroke-linecap: round; }
      .pt      { fill: #c05621; stroke: white; stroke-width: 2; }
      .yint    { fill: #6b46c1; stroke: white; stroke-width: 2.5; }
      .axislbl { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .lbl     { font: bold 12px system-ui, sans-serif; }
      .formA   { fill: #ebf8ff; stroke: #2b6cb0; stroke-width: 1.5; }
      .formB   { fill: #fffaf0; stroke: #dd6b20; stroke-width: 1.5; }
      .formC   { fill: #f0fff4; stroke: #2f855a; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="heading" x="320" y="22">Same line, three forms:  slope-intercept, point-slope, two-point</text>

  <!-- Plot frame: x ∈ [−2, 6], y ∈ [−2, 8].  Frame width 280 (35 px/u), height 280 (28 px/u). Use 30 each: x range 8 → 240 wide; y range 10 → 300 tall.  Frame x: 60..300 (240 wide), y: 40..340 (300 tall) but viewBox height 340 means y_max = 340.  Use frame x:60..300, y:30..330. Origin (60+30*2, 330-30*2) = (120, 270) -->
  <rect class="panel" x="60" y="30" width="240" height="300"/>

  <!-- Vertical grid x = −2..6 step 30 -->
  <line class="grid" x1="90"  y1="30" x2="90"  y2="330"/>
  <line class="grid" x1="120" y1="30" x2="120" y2="330"/>
  <line class="grid" x1="150" y1="30" x2="150" y2="330"/>
  <line class="grid" x1="180" y1="30" x2="180" y2="330"/>
  <line class="grid" x1="210" y1="30" x2="210" y2="330"/>
  <line class="grid" x1="240" y1="30" x2="240" y2="330"/>
  <line class="grid" x1="270" y1="30" x2="270" y2="330"/>
  <!-- Horizontal grid y = −2..8 step 30 -->
  <line class="grid" x1="60" y1="300" x2="300" y2="300"/>
  <line class="grid" x1="60" y1="240" x2="300" y2="240"/>
  <line class="grid" x1="60" y1="210" x2="300" y2="210"/>
  <line class="grid" x1="60" y1="180" x2="300" y2="180"/>
  <line class="grid" x1="60" y1="150" x2="300" y2="150"/>
  <line class="grid" x1="60" y1="120" x2="300" y2="120"/>
  <line class="grid" x1="60" y1="90"  x2="300" y2="90"/>
  <line class="grid" x1="60" y1="60"  x2="300" y2="60"/>

  <!-- Axes -->
  <line class="axis" x1="60"  y1="270" x2="300" y2="270"/>
  <line class="axis" x1="120" y1="30"  x2="120" y2="330"/>

  <!-- Tick labels x -->
  <text class="axislbl" x="90"  y="284">−1</text>
  <text class="axislbl" x="120" y="284">0</text>
  <text class="axislbl" x="150" y="284">1</text>
  <text class="axislbl" x="180" y="284">2</text>
  <text class="axislbl" x="210" y="284">3</text>
  <text class="axislbl" x="240" y="284">4</text>
  <text class="axislbl" x="270" y="284">5</text>
  <!-- Tick labels y -->
  <text class="axislbl" x="112" y="304" text-anchor="end">−1</text>
  <text class="axislbl" x="112" y="244" text-anchor="end">1</text>
  <text class="axislbl" x="112" y="214" text-anchor="end">2</text>
  <text class="axislbl" x="112" y="184" text-anchor="end">3</text>
  <text class="axislbl" x="112" y="154" text-anchor="end">4</text>
  <text class="axislbl" x="112" y="124" text-anchor="end">5</text>
  <text class="axislbl" x="112" y="94"  text-anchor="end">6</text>
  <text class="axislbl" x="112" y="64"  text-anchor="end">7</text>
  <text class="axislbl" x="308" y="274">x</text>
  <text class="axislbl" x="120" y="24">y</text>

  <!-- Line y = 2x − 1.  At x = -1: y = -3 (clipped to y = -2 at x = 0.5).  Use endpoints inside frame.  At x = -0.5: y = -2 → (105, 330);   at x = 4.5: y = 8 → (255, 30) -->
  <line class="line" x1="105" y1="330" x2="255" y2="30"/>

  <!-- y-intercept (0, -1) → (120, 300) -->
  <circle class="yint" cx="120" cy="300" r="6"/>
  <text class="lbl" x="58" y="310" fill="#6b46c1">y-int (0, −1)</text>

  <!-- Point P (2, 3) → (180, 180) -->
  <circle class="pt" cx="180" cy="180" r="6"/>
  <text class="lbl" x="190" y="174" fill="#c05621">P(2, 3)</text>

  <!-- Point Q (4, 7) → (240, 60) -->
  <circle class="pt" cx="240" cy="60" r="6"/>
  <text class="lbl" x="250" y="54" fill="#c05621">Q(4, 7)</text>

  <!-- Right panel: three forms -->
  <g transform="translate(320, 36)">
    <text font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" x="0" y="0">Three equivalent equations</text>

    <!-- Form A: slope-intercept -->
    <g transform="translate(0, 16)">
      <rect class="formA" x="0" y="0" width="300" height="78" rx="8"/>
      <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" x="14" y="20">Slope-intercept form</text>
      <text font="italic 14px system-ui" font-size="14" fill="#1a202c" x="14" y="44">y  =  m·x  +  b</text>
      <text font="italic 14px system-ui" font-size="14" fill="#1a202c" x="14" y="66">y  =  2x  −  1</text>
      <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="170" y="44">m = slope</text>
      <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="170" y="66">b = y-intercept</text>
    </g>

    <!-- Form B: point-slope -->
    <g transform="translate(0, 102)">
      <rect class="formB" x="0" y="0" width="300" height="78" rx="8"/>
      <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dd6b20" x="14" y="20">Point-slope form</text>
      <text font="italic 14px system-ui" font-size="14" fill="#1a202c" x="14" y="44">y  −  y₁  =  m (x  −  x₁)</text>
      <text font="italic 14px system-ui" font-size="14" fill="#1a202c" x="14" y="66">y  −  3  =  2(x  −  2)</text>
      <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="186" y="44">use any pt P(x₁, y₁)</text>
      <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="186" y="66">+ slope m</text>
    </g>

    <!-- Form C: two-point -->
    <g transform="translate(0, 188)">
      <rect class="formC" x="0" y="0" width="300" height="100" rx="8"/>
      <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2f855a" x="14" y="20">Two-point form</text>
      <text font="italic 14px system-ui" font-size="14" fill="#1a202c" x="14" y="50">(y − y₁) / (x − x₁) = (y₂ − y₁) / (x₂ − x₁)</text>
      <text font="italic 14px system-ui" font-size="14" fill="#1a202c" x="14" y="80">(y − 3)/(x − 2) = (7 − 3)/(4 − 2) = 2</text>
      <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="14" y="96">use two distinct points P, Q on the line</text>
    </g>

    <!-- Common collapse arrow -->
    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#1a202c" x="0" y="306">All three rearrange to the same equation:</text>
    <rect x="0" y="312" width="300" height="22" rx="4" fill="#1a202c"/>
    <text font="bold 13px system-ui" font-size="13" font-weight="700" fill="#fffaf0" x="150" y="328" text-anchor="middle">y  =  2x  −  1</text>
  </g>
</svg>
