<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" role="img" aria-label="Slope as rise over run, computed from two points on a line">
  <title>Slope: Rise over Run</title>
  <desc>The line through P(1, 1) and Q(5, 4) has slope m = rise/run = (4 − 1)/(5 − 1) = 3/4. The change in y (rise = 3) and change in x (run = 4) are drawn as the legs of a right triangle.</desc>

  <defs>
    <style>
      .axis    { stroke: #94a3b8; stroke-width: 1.4; }
      .grid    { stroke: #e2e8f0; stroke-width: 0.6; }
      .panel   { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .line    { stroke: #2b6cb0; stroke-width: 3; stroke-linecap: round; }
      .run     { stroke: #dd6b20; stroke-width: 4; stroke-linecap: round; }
      .rise    { stroke: #2f855a; stroke-width: 4; stroke-linecap: round; }
      .pt      { fill: #c05621; stroke: white; stroke-width: 2; }
      .axislbl { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .lbl     { font: bold 12px system-ui, sans-serif; }
      .triFill { fill: #2f855a; opacity: 0.07; }
    </style>
  </defs>

  <text class="heading" x="310" y="22">Slope of a line:  m  =  rise / run  =  (y₂ − y₁) / (x₂ − x₁)</text>

  <!-- Plot frame: x ∈ [−1, 7], y ∈ [−1, 6].  Frame 60..380 (width 320, 40 px/unit) and 50..330 (height 280, 40 px/unit). Origin (60+40, 330-40) = (100, 290) -->
  <rect class="panel" x="60" y="50" width="320" height="280"/>

  <!-- Vertical grid lines: x = −1..7 → 60+40*(x+1) → 60..380 step 40 -->
  <line class="grid" x1="100" y1="50" x2="100" y2="330"/>
  <line class="grid" x1="140" y1="50" x2="140" y2="330"/>
  <line class="grid" x1="180" y1="50" x2="180" y2="330"/>
  <line class="grid" x1="220" y1="50" x2="220" y2="330"/>
  <line class="grid" x1="260" y1="50" x2="260" y2="330"/>
  <line class="grid" x1="300" y1="50" x2="300" y2="330"/>
  <line class="grid" x1="340" y1="50" x2="340" y2="330"/>
  <!-- Horizontal grid lines: y = −1..6 → 330 - 40*(y+1) → 330..50 step 40 -->
  <line class="grid" x1="60" y1="290" x2="380" y2="290"/>
  <line class="grid" x1="60" y1="250" x2="380" y2="250"/>
  <line class="grid" x1="60" y1="210" x2="380" y2="210"/>
  <line class="grid" x1="60" y1="170" x2="380" y2="170"/>
  <line class="grid" x1="60" y1="130" x2="380" y2="130"/>
  <line class="grid" x1="60" y1="90"  x2="380" y2="90"/>

  <!-- Axes -->
  <line class="axis" x1="60"  y1="290" x2="380" y2="290"/>
  <line class="axis" x1="100" y1="50"  x2="100" y2="330"/>

  <!-- Tick labels -->
  <text class="axislbl" x="100" y="304">0</text>
  <text class="axislbl" x="140" y="304">1</text>
  <text class="axislbl" x="180" y="304">2</text>
  <text class="axislbl" x="220" y="304">3</text>
  <text class="axislbl" x="260" y="304">4</text>
  <text class="axislbl" x="300" y="304">5</text>
  <text class="axislbl" x="340" y="304">6</text>
  <text class="axislbl" x="92"  y="294" text-anchor="end">0</text>
  <text class="axislbl" x="92"  y="254" text-anchor="end">1</text>
  <text class="axislbl" x="92"  y="214" text-anchor="end">2</text>
  <text class="axislbl" x="92"  y="174" text-anchor="end">3</text>
  <text class="axislbl" x="92"  y="134" text-anchor="end">4</text>
  <text class="axislbl" x="92"  y="94"  text-anchor="end">5</text>
  <text class="axislbl" x="388" y="294">x</text>
  <text class="axislbl" x="100" y="44">y</text>

  <!-- P = (1, 1) → (140, 250); Q = (5, 4) → (300, 130); knee = (5, 1) → (300, 250) -->

  <!-- Line through P and Q, extended a bit.  Direction: (160, -120). Extend ±0.6 -->
  <!-- Line eq: y = 0.75x + 0.25.  At x = 0: y = 0.25 → (100, 280); at x = 6.5: y = 5.125 → (320, 84.5) -->
  <line class="line" x1="100" y1="280" x2="370" y2="77.5"/>

  <!-- Right triangle fill -->
  <polygon class="triFill" points="140,250 300,250 300,130"/>

  <!-- Run leg -->
  <line class="run" x1="140" y1="250" x2="300" y2="250"/>
  <text class="lbl" x="220" y="270" fill="#dd6b20" text-anchor="middle">run = 4</text>

  <!-- Rise leg -->
  <line class="rise" x1="300" y1="250" x2="300" y2="130"/>
  <text class="lbl" x="310" y="194" fill="#2f855a">rise = 3</text>

  <!-- Right-angle square -->
  <rect x="290" y="240" width="10" height="10" fill="none" stroke="#1a202c" stroke-width="1"/>

  <!-- Endpoints -->
  <circle class="pt" cx="140" cy="250" r="6"/>
  <text class="lbl" x="116" y="244" fill="#c05621">P(1, 1)</text>
  <circle class="pt" cx="300" cy="130" r="6"/>
  <text class="lbl" x="310" y="124" fill="#c05621">Q(5, 4)</text>

  <!-- Right panel: derivation -->
  <g transform="translate(400, 50)">
    <rect x="0" y="0" width="200" height="280" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
    <text font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" x="100" y="24" text-anchor="middle">Compute the slope</text>

    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="52">P(x₁, y₁) = (1, 1)</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="70">Q(x₂, y₂) = (5, 4)</text>

    <line x1="14" y1="86" x2="186" y2="86" stroke="#cbd5e0"/>

    <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2f855a" x="14" y="106">rise (Δy)</text>
    <text font="italic 13px system-ui" font-size="13" fill="#1a202c" x="14" y="124">= y₂ − y₁ = 4 − 1 = 3</text>

    <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dd6b20" x="14" y="152">run (Δx)</text>
    <text font="italic 13px system-ui" font-size="13" fill="#1a202c" x="14" y="170">= x₂ − x₁ = 5 − 1 = 4</text>

    <rect x="14" y="186" width="172" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" x="100" y="210" text-anchor="middle">m  =  3 / 4</text>

    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="14" y="246">Sign of m:</text>
    <text font="11px system-ui" font-size="11" fill="#2f855a" x="14" y="262">m &gt; 0  →  rises  ↗</text>
    <text font="11px system-ui" font-size="11" fill="#c53030" x="100" y="262">m &lt; 0  →  falls  ↘</text>
  </g>

  <text x="310" y="350" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Horizontal line:  m = 0.   Vertical line:  m undefined  (run = 0).</text>
</svg>
