<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Ellipse defined as the set of points whose distances from two foci sum to a constant">
  <title>Ellipse: Sum of Distances from Two Foci is Constant</title>
  <desc>The ellipse x²/25 + y²/9 = 1 has semi-major axis a = 5, semi-minor axis b = 3, and foci F₁(−4, 0), F₂(4, 0). For any point P on the ellipse, |PF₁| + |PF₂| = 2a = 10. Sample point P(0, 3) verifies the property.</desc>

  <defs>
    <style>
      .axis      { stroke: #94a3b8; stroke-width: 1.4; }
      .grid      { stroke: #e2e8f0; stroke-width: 0.6; }
      .panel     { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .ellipse   { fill: rgba(43, 108, 176, 0.08); stroke: #2b6cb0; stroke-width: 3; }
      .focusPt   { fill: #c05621; stroke: white; stroke-width: 2.5; }
      .vertex    { fill: #2f855a; stroke: white; stroke-width: 2; }
      .samplePt  { fill: #6b46c1; stroke: white; stroke-width: 2; }
      .ray1      { stroke: #c05621; stroke-width: 2.5; stroke-linecap: round; }
      .ray2      { stroke: #c05621; stroke-width: 2.5; stroke-linecap: round; }
      .axislbl   { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .heading   { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .lbl       { font: bold 12px system-ui, sans-serif; }
    </style>
  </defs>

  <text class="heading" x="320" y="22">Ellipse:  |PF₁| + |PF₂|  =  2a  (constant)</text>

  <!-- Plot frame: x ∈ [-6, 6], y ∈ [-4, 4].  Frame width 12*22=264, height 8*22=176.  Frame x:60..324, y:60..236. Origin (60+22*6, 236-22*4) = (192, 148) -->
  <rect class="panel" x="60" y="60" width="264" height="176"/>

  <!-- Vertical grid (omit origin and main verts) -->
  <line class="grid" x1="82"  y1="60" x2="82"  y2="236"/>
  <line class="grid" x1="126" y1="60" x2="126" y2="236"/>
  <line class="grid" x1="148" y1="60" x2="148" y2="236"/>
  <line class="grid" x1="170" y1="60" x2="170" y2="236"/>
  <line class="grid" x1="214" y1="60" x2="214" y2="236"/>
  <line class="grid" x1="236" y1="60" x2="236" y2="236"/>
  <line class="grid" x1="258" y1="60" x2="258" y2="236"/>
  <line class="grid" x1="302" y1="60" x2="302" y2="236"/>
  <!-- Horizontal grid -->
  <line class="grid" x1="60" y1="214" x2="324" y2="214"/>
  <line class="grid" x1="60" y1="192" x2="324" y2="192"/>
  <line class="grid" x1="60" y1="170" x2="324" y2="170"/>
  <line class="grid" x1="60" y1="126" x2="324" y2="126"/>
  <line class="grid" x1="60" y1="104" x2="324" y2="104"/>
  <line class="grid" x1="60" y1="82"  x2="324" y2="82"/>

  <!-- Axes -->
  <line class="axis" x1="60"  y1="148" x2="324" y2="148"/>
  <line class="axis" x1="192" y1="60"  x2="192" y2="236"/>

  <!-- Tick labels -->
  <text class="axislbl" x="82"  y="162">−5</text>
  <text class="axislbl" x="104" y="162">−4</text>
  <text class="axislbl" x="280" y="162">4</text>
  <text class="axislbl" x="302" y="162">5</text>
  <text class="axislbl" x="184" y="86"  text-anchor="end">3</text>
  <text class="axislbl" x="184" y="214" text-anchor="end">−3</text>
  <text class="axislbl" x="332" y="152">x</text>
  <text class="axislbl" x="192" y="54">y</text>

  <!-- Ellipse: center (0,0), a=5 (x-radius 110 px), b=3 (y-radius 66 px) -->
  <ellipse class="ellipse" cx="192" cy="148" rx="110" ry="66"/>

  <!-- Foci F1=(-4, 0)→(104, 148);  F2=(4, 0)→(280, 148) -->
  <circle class="focusPt" cx="104" cy="148" r="6"/>
  <text class="lbl" x="92" y="166" fill="#c05621">F₁(−4, 0)</text>
  <circle class="focusPt" cx="280" cy="148" r="6"/>
  <text class="lbl" x="268" y="166" fill="#c05621">F₂(4, 0)</text>

  <!-- Vertices on major axis: (-5, 0)→(82, 148); (5, 0)→(302, 148) -->
  <circle class="vertex" cx="82"  cy="148" r="5"/>
  <circle class="vertex" cx="302" cy="148" r="5"/>
  <text class="axislbl" x="82"  y="138" text-anchor="middle">(−5, 0)</text>
  <text class="axislbl" x="302" y="138" text-anchor="middle">(5, 0)</text>

  <!-- Sample point P(0, 3) → (192, 82) -->
  <circle class="samplePt" cx="192" cy="82" r="6"/>
  <text class="lbl" x="200" y="78" fill="#6b46c1">P(0, 3)</text>

  <!-- Rays -->
  <line class="ray1" x1="104" y1="148" x2="192" y2="82"/>
  <line class="ray2" x1="280" y1="148" x2="192" y2="82"/>

  <!-- Distance labels -->
  <text class="lbl" x="135" y="106" fill="#c05621">|PF₁| = 5</text>
  <text class="lbl" x="248" y="106" fill="#c05621">|PF₂| = 5</text>

  <!-- Right panel -->
  <g transform="translate(340, 40)">
    <rect x="0" y="0" width="290" height="260" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
    <text font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" x="145" y="22" text-anchor="middle">Standard equation and key constants</text>

    <text font="italic 14px system-ui" font-size="14" fill="#1a202c" x="145" y="50" text-anchor="middle">x² / a²  +  y² / b²  =  1</text>
    <text font="italic 14px system-ui" font-size="14" fill="#1a202c" x="145" y="74" text-anchor="middle">x² / 25  +  y² / 9  =  1</text>

    <line x1="14" y1="90" x2="276" y2="90" stroke="#cbd5e0"/>

    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="110">Semi-major axis</text>
    <text font="italic 12px system-ui" font-size="12" fill="#1a202c" x="156" y="110">a  =  5</text>

    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="130">Semi-minor axis</text>
    <text font="italic 12px system-ui" font-size="12" fill="#1a202c" x="156" y="130">b  =  3</text>

    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="150">Foci offset</text>
    <text font="italic 12px system-ui" font-size="12" fill="#1a202c" x="156" y="150">c  =  √(a² − b²)  =  4</text>

    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="170">Constant sum of distances</text>
    <text font="italic 12px system-ui" font-size="12" fill="#1a202c" x="156" y="170">2a  =  10</text>

    <rect x="14" y="186" width="262" height="40" rx="6" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/>
    <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" x="145" y="208" text-anchor="middle">Check P(0, 3):  5  +  5  =  10  ✓</text>

    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="14" y="246">Eccentricity  e = c / a = 4/5 = 0.8  (between 0 and 1).</text>
  </g>

  <text x="320" y="312" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">String-and-pin construction:  pin both foci, loop a string of length 2a, draw with a pencil — the trace is the ellipse.</text>
</svg>
