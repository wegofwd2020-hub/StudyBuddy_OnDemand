<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Convert a circle from general form to standard form by completing the square">
  <title>Circle: General Form → Standard Form via Completing the Square</title>
  <desc>The general-form equation x² + y² − 4x + 6y − 12 = 0 is converted to the standard form (x − 2)² + (y + 3)² = 25 by completing the square in x and in y. The circle has center (2, −3) and radius 5.</desc>

  <defs>
    <style>
      .panel    { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .stepBg   { fill: #fffaf0; stroke: #dd6b20; stroke-width: 1.4; }
      .stepBgFn { fill: #f0fff4; stroke: #2f855a; stroke-width: 1.5; }
      .heading  { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .stepLbl  { font: bold 12px system-ui, sans-serif; fill: #c05621; }
      .eq       { font: italic 13px system-ui, sans-serif; fill: #1a202c; }
      .eqBold   { font: bold italic 13px system-ui, sans-serif; fill: #1a202c; }
      .annot    { font: 11px system-ui, sans-serif; fill: #4a5568; }
      .axis     { stroke: #94a3b8; stroke-width: 1.4; }
      .grid     { stroke: #e2e8f0; stroke-width: 0.6; }
      .circle   { fill: rgba(43, 108, 176, 0.08); stroke: #2b6cb0; stroke-width: 3; }
      .center   { fill: #c05621; stroke: white; stroke-width: 2.5; }
      .radius   { stroke: #6b46c1; stroke-width: 3; stroke-linecap: round; }
      .axislbl  { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .lbl      { font: bold 12px system-ui, sans-serif; }
    </style>
  </defs>

  <text class="heading" x="320" y="22">Complete the square in x and in y to read off the center and radius</text>

  <!-- Left panel: derivation steps -->
  <g transform="translate(20, 38)">
    <rect class="stepBg" x="0" y="0" width="320" height="304" rx="8"/>
    <text font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" x="160" y="22" text-anchor="middle">Algebraic conversion</text>

    <text class="stepLbl" x="14" y="50">Step 1.   Start (general form):</text>
    <text class="eq"      x="22" y="70">x²  +  y²  −  4x  +  6y  −  12  =  0</text>

    <text class="stepLbl" x="14" y="98">Step 2.   Group x and y:</text>
    <text class="eq"      x="22" y="118">(x²  −  4x)   +   (y²  +  6y)   =   12</text>

    <text class="stepLbl" x="14" y="146">Step 3.   Add (b/2)² inside each group:</text>
    <text class="annot"   x="22" y="164">x: half of −4 is −2; squared = 4</text>
    <text class="annot"   x="22" y="180">y: half of  6 is  3; squared = 9</text>
    <text class="eq"      x="22" y="200">(x²  −  4x  +  4)   +   (y²  +  6y  +  9)   =   12  +  4  +  9</text>

    <text class="stepLbl" x="14" y="226">Step 4.   Factor each perfect square:</text>
    <text class="eq"      x="22" y="246">(x  −  2)²   +   (y  +  3)²   =   25</text>

    <rect class="stepBgFn" x="14" y="260" width="290" height="36" rx="6"/>
    <text class="eqBold"   x="160" y="282" text-anchor="middle">center C(2, −3),    radius r = √25 = 5</text>
  </g>

  <!-- Right panel: plotted circle -->
  <g transform="translate(360, 38)">
    <!-- Plot frame: x ∈ [−4, 8], y ∈ [−9, 3].  Frame width 12*22=264, height 12*22=264. Frame x:0..264, y:0..264.  Origin x=0 → 22*4=88; y=0 → 264-22*9=66 -->
    <rect class="panel" x="0" y="0" width="264" height="264"/>

    <!-- Vertical grid (omit origin and skip every other for cleanliness) -->
    <line class="grid" x1="22"  y1="0" x2="22"  y2="264"/>
    <line class="grid" x1="44"  y1="0" x2="44"  y2="264"/>
    <line class="grid" x1="66"  y1="0" x2="66"  y2="264"/>
    <line class="grid" x1="110" y1="0" x2="110" y2="264"/>
    <line class="grid" x1="132" y1="0" x2="132" y2="264"/>
    <line class="grid" x1="154" y1="0" x2="154" y2="264"/>
    <line class="grid" x1="176" y1="0" x2="176" y2="264"/>
    <line class="grid" x1="198" y1="0" x2="198" y2="264"/>
    <line class="grid" x1="220" y1="0" x2="220" y2="264"/>
    <line class="grid" x1="242" y1="0" x2="242" y2="264"/>
    <!-- Horizontal grid -->
    <line class="grid" x1="0" y1="22"  x2="264" y2="22"/>
    <line class="grid" x1="0" y1="44"  x2="264" y2="44"/>
    <line class="grid" x1="0" y1="88"  x2="264" y2="88"/>
    <line class="grid" x1="0" y1="110" x2="264" y2="110"/>
    <line class="grid" x1="0" y1="132" x2="264" y2="132"/>
    <line class="grid" x1="0" y1="176" x2="264" y2="176"/>
    <line class="grid" x1="0" y1="198" x2="264" y2="198"/>
    <line class="grid" x1="0" y1="220" x2="264" y2="220"/>
    <line class="grid" x1="0" y1="242" x2="264" y2="242"/>

    <!-- Axes (origin at 88, 66) -->
    <line class="axis" x1="0"  y1="66" x2="264" y2="66"/>
    <line class="axis" x1="88" y1="0"  x2="88"  y2="264"/>

    <!-- Tick labels x: -3,-2,-1,0,2,4,6,7 -->
    <text class="axislbl" x="22"  y="78">−3</text>
    <text class="axislbl" x="88"  y="78">0</text>
    <text class="axislbl" x="132" y="78">2</text>
    <text class="axislbl" x="176" y="78">4</text>
    <text class="axislbl" x="220" y="78">6</text>
    <text class="axislbl" x="264" y="78">8</text>
    <!-- Tick labels y: 2, 0, -3, -5, -8 -->
    <text class="axislbl" x="80" y="48"  text-anchor="end">2</text>
    <text class="axislbl" x="80" y="70"  text-anchor="end">0</text>
    <text class="axislbl" x="80" y="136" text-anchor="end">−3</text>
    <text class="axislbl" x="80" y="180" text-anchor="end">−5</text>
    <text class="axislbl" x="80" y="246" text-anchor="end">−8</text>
    <text class="axislbl" x="270" y="70">x</text>
    <text class="axislbl" x="88"  y="-4">y</text>

    <!-- Circle: center (2, -3) → (132, 132); radius 5 → 22*5=110 px.  Crops y ≥ -8 and y ≤ 2; x ≥ -3 (margin) and x ≤ 7. -->
    <circle class="circle" cx="132" cy="132" r="110"/>

    <!-- Center -->
    <circle class="center" cx="132" cy="132" r="6"/>
    <text class="lbl" x="140" y="128" fill="#c05621">C(2, −3)</text>

    <!-- Radius drawn to (7, -3) → (242, 132) -->
    <line class="radius" x1="132" y1="132" x2="242" y2="132"/>
    <text class="lbl" x="186" y="124" fill="#6b46c1" text-anchor="middle">r = 5</text>

    <!-- Subtle title under plot -->
    <text x="132" y="288" font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">(x − 2)² + (y + 3)² = 25</text>
  </g>

  <text x="320" y="350" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">If the right side comes out negative, the equation is empty (no real circle); if zero, it is a single point — the degenerate case.</text>
</svg>
