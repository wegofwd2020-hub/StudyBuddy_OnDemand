<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" role="img" aria-label="Circle in standard form with center and radius marked">
  <title>Circle: Standard Form (x − h)² + (y − k)² = r²</title>
  <desc>The circle (x − 2)² + (y − 1)² = 9 has center C(2, 1) and radius r = 3. A radius is drawn from the center to the boundary point (5, 1).</desc>

  <defs>
    <style>
      .axis    { stroke: #94a3b8; stroke-width: 1.4; }
      .grid    { stroke: #e2e8f0; stroke-width: 0.6; }
      .panel   { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .circle  { fill: rgba(43, 108, 176, 0.08); stroke: #2b6cb0; stroke-width: 3; }
      .center  { fill: #c05621; stroke: white; stroke-width: 2.5; }
      .radius  { stroke: #6b46c1; stroke-width: 3; stroke-linecap: round; }
      .ptOnC   { fill: #2f855a; stroke: white; stroke-width: 2; }
      .axislbl { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .lbl     { font: bold 12px system-ui, sans-serif; }
    </style>
  </defs>

  <text class="heading" x="310" y="22">Standard form:  (x − h)² + (y − k)² = r²</text>

  <!-- Plot frame: x ∈ [−3, 7], y ∈ [−4, 6].  Frame width 10*28=280, height 10*28=280.  Frame x:60..340, y:30..310. Origin at x=0 → 60+28*3=144, y=0 → 310-28*4=198 -->
  <rect class="panel" x="60" y="30" width="280" height="280"/>

  <!-- Vertical grid x = -3..7 step 28 (omit origin) -->
  <line class="grid" x1="88"  y1="30" x2="88"  y2="310"/>
  <line class="grid" x1="116" y1="30" x2="116" y2="310"/>
  <line class="grid" x1="172" y1="30" x2="172" y2="310"/>
  <line class="grid" x1="200" y1="30" x2="200" y2="310"/>
  <line class="grid" x1="228" y1="30" x2="228" y2="310"/>
  <line class="grid" x1="256" y1="30" x2="256" y2="310"/>
  <line class="grid" x1="284" y1="30" x2="284" y2="310"/>
  <line class="grid" x1="312" y1="30" x2="312" y2="310"/>
  <!-- Horizontal grid y = -4..6 step 28 (omit origin) -->
  <line class="grid" x1="60" y1="282" x2="340" y2="282"/>
  <line class="grid" x1="60" y1="254" x2="340" y2="254"/>
  <line class="grid" x1="60" y1="226" x2="340" y2="226"/>
  <line class="grid" x1="60" y1="170" x2="340" y2="170"/>
  <line class="grid" x1="60" y1="142" x2="340" y2="142"/>
  <line class="grid" x1="60" y1="114" x2="340" y2="114"/>
  <line class="grid" x1="60" y1="86"  x2="340" y2="86"/>
  <line class="grid" x1="60" y1="58"  x2="340" y2="58"/>

  <!-- Axes (origin at 144, 198) -->
  <line class="axis" x1="60"  y1="198" x2="340" y2="198"/>
  <line class="axis" x1="144" y1="30"  x2="144" y2="310"/>

  <!-- Tick labels x -->
  <text class="axislbl" x="88"  y="212">−2</text>
  <text class="axislbl" x="144" y="212">0</text>
  <text class="axislbl" x="200" y="212">2</text>
  <text class="axislbl" x="228" y="212">3</text>
  <text class="axislbl" x="284" y="212">5</text>
  <text class="axislbl" x="312" y="212">6</text>
  <!-- Tick labels y -->
  <text class="axislbl" x="136" y="286" text-anchor="end">−3</text>
  <text class="axislbl" x="136" y="258" text-anchor="end">−2</text>
  <text class="axislbl" x="136" y="174" text-anchor="end">1</text>
  <text class="axislbl" x="136" y="118" text-anchor="end">3</text>
  <text class="axislbl" x="136" y="62"  text-anchor="end">5</text>
  <text class="axislbl" x="348" y="202">x</text>
  <text class="axislbl" x="144" y="24">y</text>

  <!-- Circle: center (2, 1), r = 3.   Center px = 144+28*2 = 200, py = 198 - 28*1 = 170.  Radius px = 28*3 = 84 -->
  <circle class="circle" cx="200" cy="170" r="84"/>

  <!-- Center -->
  <circle class="center" cx="200" cy="170" r="6"/>
  <text class="lbl" x="208" y="166" fill="#c05621">C(2, 1)</text>

  <!-- Radius drawn to point (5, 1) → (284, 170) -->
  <line class="radius" x1="200" y1="170" x2="284" y2="170"/>
  <text class="lbl" x="240" y="162" fill="#6b46c1" text-anchor="middle">r = 3</text>

  <!-- Boundary point -->
  <circle class="ptOnC" cx="284" cy="170" r="5"/>
  <text class="lbl" x="290" y="186" fill="#2f855a">(5, 1)</text>

  <!-- Top + bottom of circle for emphasis -->
  <circle cx="200" cy="86" r="4" fill="#2f855a" stroke="white" stroke-width="1.5"/>
  <text class="axislbl" x="208" y="80" text-anchor="start">(2, 4)</text>
  <circle cx="200" cy="254" r="4" fill="#2f855a" stroke="white" stroke-width="1.5"/>
  <text class="axislbl" x="208" y="268" text-anchor="start">(2, −2)</text>

  <!-- Right panel: anatomy of standard form -->
  <g transform="translate(360, 36)">
    <rect x="0" y="0" width="240" height="270" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
    <text font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" x="120" y="22" text-anchor="middle">Read off (h, k, r)</text>

    <text font="italic 14px system-ui" font-size="14" fill="#1a202c" x="120" y="58" text-anchor="middle">(x − 2)²  +  (y − 1)²  =  9</text>

    <line x1="14" y1="76" x2="226" y2="76" stroke="#cbd5e0"/>

    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="98">Compare to:</text>
    <text font="italic 13px system-ui" font-size="13" fill="#1a202c" x="120" y="120" text-anchor="middle">(x − h)²  +  (y − k)²  =  r²</text>

    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="148">⇒ h = 2,  k = 1,  r² = 9</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="166">⇒ r = 3 (radius is non-negative)</text>

    <rect x="14" y="184" width="212" height="42" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" x="120" y="204" text-anchor="middle">center C(2, 1),  radius 3</text>
    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="120" y="220" text-anchor="middle">every point on the circle is 3 units from C</text>

    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="14" y="248">Watch the signs:  (x + 2)² ≡ (x − (−2))²,  so</text>
    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="14" y="262">(x + 2)² + (y − 1)² = 9 has center (−2, 1).</text>
  </g>

  <text x="310" y="316" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Definition: a circle is the set of all points at a fixed distance r (the radius) from a fixed point C (the center).</text>
</svg>
