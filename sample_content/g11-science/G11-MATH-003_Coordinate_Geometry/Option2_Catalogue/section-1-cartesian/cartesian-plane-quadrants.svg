<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Cartesian plane with the four quadrants labelled and several sample points plotted">
  <title>Cartesian Plane: Four Quadrants and Sample Points</title>
  <desc>The xy-plane is split by the x- and y-axes into four quadrants. Quadrant I (+x,+y), II (−x,+y), III (−x,−y), IV (+x,−y). Sample points (3,2), (−4,1), (−2,−3), and (4,−2) are plotted with their ordered-pair labels.</desc>

  <defs>
    <marker id="ah-cp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <style>
      .axis    { stroke: #4a5568; stroke-width: 1.6; }
      .grid    { stroke: #e2e8f0; stroke-width: 0.6; }
      .panel   { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .qI      { fill: #c6f6d5; opacity: 0.55; }
      .qII     { fill: #fefcbf; opacity: 0.55; }
      .qIII    { fill: #fed7d7; opacity: 0.55; }
      .qIV     { fill: #bee3f8; opacity: 0.55; }
      .pt      { stroke: white; stroke-width: 2; }
      .ptI     { fill: #2f855a; }
      .ptII    { fill: #b7791f; }
      .ptIII   { fill: #c53030; }
      .ptIV    { fill: #2b6cb0; }
      .axislbl { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .lbl     { font: bold 12px system-ui, sans-serif; }
      .qlbl    { font: bold 14px system-ui, sans-serif; fill: #2d3748; text-anchor: middle; }
    </style>
  </defs>

  <text class="heading" x="300" y="22">The Cartesian plane:  ordered pairs (x, y) and four quadrants</text>

  <!-- Plot frame: 60..420 x, 50..330 y; origin at (240, 190) → 6×7 unit grid, 30 px per unit -->
  <rect class="panel" x="60" y="50" width="360" height="280"/>

  <!-- Quadrant fills.  Origin at (240,190).  Q I = upper-right -->
  <rect class="qI"   x="240" y="50"  width="180" height="140"/>
  <rect class="qII"  x="60"  y="50"  width="180" height="140"/>
  <rect class="qIII" x="60"  y="190" width="180" height="140"/>
  <rect class="qIV"  x="240" y="190" width="180" height="140"/>

  <!-- vertical grid x = -6..6 → 60..420 step 30 -->
  <line class="grid" x1="90"  y1="50" x2="90"  y2="330"/>
  <line class="grid" x1="120" y1="50" x2="120" y2="330"/>
  <line class="grid" x1="150" y1="50" x2="150" y2="330"/>
  <line class="grid" x1="180" y1="50" x2="180" y2="330"/>
  <line class="grid" x1="210" y1="50" x2="210" y2="330"/>
  <line class="grid" x1="270" y1="50" x2="270" y2="330"/>
  <line class="grid" x1="300" y1="50" x2="300" y2="330"/>
  <line class="grid" x1="330" y1="50" x2="330" y2="330"/>
  <line class="grid" x1="360" y1="50" x2="360" y2="330"/>
  <line class="grid" x1="390" y1="50" x2="390" y2="330"/>

  <!-- horizontal grid y in {-4..4 except 0} → py = 190 - 30*y → 70,100,130,160,220,250,280,310 -->
  <line class="grid" x1="60" y1="70"  x2="420" y2="70"/>
  <line class="grid" x1="60" y1="100" x2="420" y2="100"/>
  <line class="grid" x1="60" y1="130" x2="420" y2="130"/>
  <line class="grid" x1="60" y1="160" x2="420" y2="160"/>
  <line class="grid" x1="60" y1="220" x2="420" y2="220"/>
  <line class="grid" x1="60" y1="250" x2="420" y2="250"/>
  <line class="grid" x1="60" y1="280" x2="420" y2="280"/>
  <line class="grid" x1="60" y1="310" x2="420" y2="310"/>

  <!-- axes with arrowheads -->
  <line class="axis" x1="60"  y1="190" x2="424" y2="190" marker-end="url(#ah-cp)"/>
  <line class="axis" x1="240" y1="334" x2="240" y2="46"  marker-end="url(#ah-cp)"/>

  <!-- tick labels x = -6..6 (skip 0) -->
  <text class="axislbl" x="90"  y="204">−5</text>
  <text class="axislbl" x="120" y="204">−4</text>
  <text class="axislbl" x="150" y="204">−3</text>
  <text class="axislbl" x="180" y="204">−2</text>
  <text class="axislbl" x="210" y="204">−1</text>
  <text class="axislbl" x="240" y="204">0</text>
  <text class="axislbl" x="270" y="204">1</text>
  <text class="axislbl" x="300" y="204">2</text>
  <text class="axislbl" x="330" y="204">3</text>
  <text class="axislbl" x="360" y="204">4</text>
  <text class="axislbl" x="390" y="204">5</text>
  <text class="axislbl" x="430" y="194">x</text>

  <!-- tick labels y = -4..4 (skip 0) -->
  <text class="axislbl" x="232" y="74"  text-anchor="end">4</text>
  <text class="axislbl" x="232" y="104" text-anchor="end">3</text>
  <text class="axislbl" x="232" y="134" text-anchor="end">2</text>
  <text class="axislbl" x="232" y="164" text-anchor="end">1</text>
  <text class="axislbl" x="232" y="224" text-anchor="end">−1</text>
  <text class="axislbl" x="232" y="254" text-anchor="end">−2</text>
  <text class="axislbl" x="232" y="284" text-anchor="end">−3</text>
  <text class="axislbl" x="232" y="314" text-anchor="end">−4</text>
  <text class="axislbl" x="244" y="44">y</text>

  <!-- Quadrant labels -->
  <text class="qlbl" x="330" y="78">Quadrant I</text>
  <text class="axislbl" x="330" y="93">(+x, +y)</text>
  <text class="qlbl" x="150" y="78">Quadrant II</text>
  <text class="axislbl" x="150" y="93">(−x, +y)</text>
  <text class="qlbl" x="150" y="306">Quadrant III</text>
  <text class="axislbl" x="150" y="321">(−x, −y)</text>
  <text class="qlbl" x="330" y="306">Quadrant IV</text>
  <text class="axislbl" x="330" y="321">(+x, −y)</text>

  <!-- Origin label -->
  <circle cx="240" cy="190" r="3.5" fill="#1a202c"/>
  <text class="axislbl" x="248" y="214">origin (0, 0)</text>

  <!-- Sample points -->
  <!-- (3, 2) → (330, 130) Q I -->
  <circle class="pt ptI" cx="330" cy="130" r="6"/>
  <text class="lbl" x="338" y="124" fill="#2f855a">(3, 2)</text>

  <!-- (−4, 1) → (120, 160) Q II -->
  <circle class="pt ptII" cx="120" cy="160" r="6"/>
  <text class="lbl" x="78" y="154" fill="#b7791f">(−4, 1)</text>

  <!-- (−2, −3) → (180, 280) Q III -->
  <circle class="pt ptIII" cx="180" cy="280" r="6"/>
  <text class="lbl" x="138" y="276" fill="#c53030">(−2, −3)</text>

  <!-- (4, −2) → (360, 250) Q IV -->
  <circle class="pt ptIV" cx="360" cy="250" r="6"/>
  <text class="lbl" x="368" y="244" fill="#2b6cb0">(4, −2)</text>

  <!-- Right legend panel -->
  <g transform="translate(440, 56)">
    <rect x="0" y="0" width="150" height="270" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
    <text font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" x="75" y="22" text-anchor="middle">Reading a point</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="44">An ordered pair</text>
    <text font="italic 13px system-ui" font-size="13" fill="#1a202c" x="12" y="62">(x, y)</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="80">x  =  signed</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="94">  horizontal step</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="112">y  =  signed</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="126">  vertical step</text>

    <line x1="12" y1="142" x2="138" y2="142" stroke="#cbd5e0"/>

    <text font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" x="12" y="160">Quadrant signs</text>
    <text font="11px system-ui" font-size="11" fill="#2f855a" x="12" y="178">I    (+, +)</text>
    <text font="11px system-ui" font-size="11" fill="#b7791f" x="12" y="194">II   (−, +)</text>
    <text font="11px system-ui" font-size="11" fill="#c53030" x="12" y="210">III  (−, −)</text>
    <text font="11px system-ui" font-size="11" fill="#2b6cb0" x="12" y="226">IV   (+, −)</text>

    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="12" y="252">Points on an axis</text>
    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="12" y="266">belong to NO quadrant.</text>
  </g>

  <text x="300" y="350" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">x first, then y — order matters: (3, 2) and (2, 3) are different points.</text>
</svg>
