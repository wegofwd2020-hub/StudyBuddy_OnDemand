<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" role="img" aria-label="Midpoint of a segment shown as the average of the endpoint coordinates">
  <title>Midpoint Formula: Average the Coordinates</title>
  <desc>The midpoint of segment AB with A(−2, 1) and B(6, 7) is M(2, 4). Each coordinate of M is the average of the matching coordinates of A and B.</desc>

  <defs>
    <style>
      .axis    { stroke: #94a3b8; stroke-width: 1.4; }
      .grid    { stroke: #e2e8f0; stroke-width: 0.6; }
      .panel   { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .seg     { stroke: #2b6cb0; stroke-width: 3.5; stroke-linecap: round; }
      .half1   { stroke: #2f855a; stroke-width: 4; stroke-linecap: round; opacity: 0.0; }
      .ptA     { fill: #c05621; stroke: white; stroke-width: 2; }
      .ptB     { fill: #c05621; stroke: white; stroke-width: 2; }
      .ptM     { fill: #6b46c1; stroke: white; stroke-width: 2.5; }
      .axislbl { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .lbl     { font: bold 12px system-ui, sans-serif; }
      .tickMark { stroke: #6b46c1; stroke-width: 2; }
    </style>
  </defs>

  <text class="heading" x="310" y="22">Midpoint:  M = ( (x₁ + x₂)/2 ,  (y₁ + y₂)/2 )</text>

  <!-- Plot frame: x ∈ [−4, 8], y ∈ [−1, 9].  Frame 60..360 (300 wide, 25 px/unit) and 50..300 (250 tall, 25 px/unit). Origin (60+25*4, 300-25*1) = (160, 275) -->
  <rect class="panel" x="60" y="50" width="300" height="250"/>

  <!-- Vertical grid lines: x = −4..8 → 60+25*(x+4) → 60..360 step 25 -->
  <line class="grid" x1="85"  y1="50" x2="85"  y2="300"/>
  <line class="grid" x1="110" y1="50" x2="110" y2="300"/>
  <line class="grid" x1="135" y1="50" x2="135" y2="300"/>
  <line class="grid" x1="185" y1="50" x2="185" y2="300"/>
  <line class="grid" x1="210" y1="50" x2="210" y2="300"/>
  <line class="grid" x1="235" y1="50" x2="235" y2="300"/>
  <line class="grid" x1="260" y1="50" x2="260" y2="300"/>
  <line class="grid" x1="285" y1="50" x2="285" y2="300"/>
  <line class="grid" x1="310" y1="50" x2="310" y2="300"/>
  <line class="grid" x1="335" y1="50" x2="335" y2="300"/>
  <!-- Horizontal grid lines: y = −1..9 → 300 - 25*(y+1) → 300..50 step 25 -->
  <line class="grid" x1="60" y1="275" x2="360" y2="275"/>
  <line class="grid" x1="60" y1="225" x2="360" y2="225"/>
  <line class="grid" x1="60" y1="200" x2="360" y2="200"/>
  <line class="grid" x1="60" y1="175" x2="360" y2="175"/>
  <line class="grid" x1="60" y1="125" x2="360" y2="125"/>
  <line class="grid" x1="60" y1="100" x2="360" y2="100"/>
  <line class="grid" x1="60" y1="75"  x2="360" y2="75"/>

  <!-- Axes (x-axis y=0 → py=275 ; y-axis x=0 → px=160) -->
  <line class="axis" x1="60"  y1="275" x2="360" y2="275"/>
  <line class="axis" x1="160" y1="50"  x2="160" y2="300"/>

  <!-- Tick labels x -->
  <text class="axislbl" x="85"  y="289">−3</text>
  <text class="axislbl" x="135" y="289">−1</text>
  <text class="axislbl" x="160" y="289">0</text>
  <text class="axislbl" x="185" y="289">1</text>
  <text class="axislbl" x="210" y="289">2</text>
  <text class="axislbl" x="285" y="289">5</text>
  <text class="axislbl" x="335" y="289">7</text>
  <!-- Tick labels y -->
  <text class="axislbl" x="152" y="278" text-anchor="end">0</text>
  <text class="axislbl" x="152" y="253" text-anchor="end">1</text>
  <text class="axislbl" x="152" y="178" text-anchor="end">4</text>
  <text class="axislbl" x="152" y="103" text-anchor="end">7</text>
  <text class="axislbl" x="152" y="78"  text-anchor="end">8</text>
  <text class="axislbl" x="368" y="279">x</text>
  <text class="axislbl" x="160" y="44">y</text>

  <!-- A = (−2, 1) → (110, 250); B = (6, 7) → (310, 100); M = (2, 4) → (210, 175) -->

  <!-- Segment AB -->
  <line class="seg" x1="110" y1="250" x2="310" y2="100"/>

  <!-- Tick marks at midpoint to show equal halves -->
  <line class="tickMark" x1="155" y1="207" x2="170" y2="216"/>
  <line class="tickMark" x1="160" y1="212" x2="165" y2="211"/>
  <line class="tickMark" x1="255" y1="135" x2="270" y2="144"/>
  <line class="tickMark" x1="260" y1="140" x2="265" y2="139"/>

  <!-- Endpoints + midpoint -->
  <circle class="ptA" cx="110" cy="250" r="6"/>
  <text class="lbl" x="76" y="262" fill="#c05621">A(−2, 1)</text>
  <circle class="ptB" cx="310" cy="100" r="6"/>
  <text class="lbl" x="320" y="94" fill="#c05621">B(6, 7)</text>
  <circle class="ptM" cx="210" cy="175" r="7"/>
  <text class="lbl" x="220" y="170" fill="#6b46c1">M(2, 4)</text>

  <!-- Faint dotted x and y projection lines from M to axes -->
  <line x1="210" y1="175" x2="210" y2="275" stroke="#6b46c1" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="160" y1="175" x2="210" y2="175" stroke="#6b46c1" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Right panel: averaging derivation -->
  <g transform="translate(380, 50)">
    <rect x="0" y="0" width="220" height="250" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
    <text font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" x="110" y="24" text-anchor="middle">Average each coordinate</text>

    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="52">A = (x₁, y₁) = (−2, 1)</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="70">B = (x₂, y₂) = (6, 7)</text>

    <line x1="14" y1="86" x2="206" y2="86" stroke="#cbd5e0"/>

    <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" x="14" y="106">x-coordinate</text>
    <text font="italic 13px system-ui" font-size="13" fill="#1a202c" x="14" y="126">x_M  =  (−2 + 6) / 2  =  2</text>

    <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2f855a" x="14" y="156">y-coordinate</text>
    <text font="italic 13px system-ui" font-size="13" fill="#1a202c" x="14" y="176">y_M  =  (1 + 7) / 2  =  4</text>

    <rect x="14" y="194" width="192" height="42" rx="6" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/>
    <text font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" x="110" y="214" text-anchor="middle">M  =  (2, 4)</text>
    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="110" y="230" text-anchor="middle">equidistant from A and B</text>
  </g>

  <text x="310" y="312" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Verify with the distance formula:  |AM|  =  |MB|  =  √(4² + 3²)  =  5.</text>
</svg>
