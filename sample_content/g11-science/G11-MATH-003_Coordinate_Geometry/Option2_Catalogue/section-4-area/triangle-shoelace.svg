<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Area of a triangle on the coordinate plane via the shoelace formula">
  <title>Triangle Area: Shoelace Formula</title>
  <desc>Area of triangle ABC with vertices A(1, 1), B(7, 2), C(3, 6). Using the shoelace formula, Area = ½ |x_A(y_B − y_C) + x_B(y_C − y_A) + x_C(y_A − y_B)| = ½ · 28 = 14 square units.</desc>

  <defs>
    <style>
      .axis    { stroke: #94a3b8; stroke-width: 1.4; }
      .grid    { stroke: #e2e8f0; stroke-width: 0.6; }
      .panel   { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .triFill { fill: rgba(43, 108, 176, 0.18); stroke: #2b6cb0; stroke-width: 3; stroke-linejoin: round; }
      .pt      { stroke: white; stroke-width: 2; }
      .ptA     { fill: #2f855a; }
      .ptB     { fill: #c05621; }
      .ptC     { fill: #6b46c1; }
      .axislbl { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .lbl     { font: bold 12px system-ui, sans-serif; }
      .arrow   { stroke: #2b6cb0; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <text class="heading" x="320" y="22">Shoelace formula:  Area = ½ |x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|</text>

  <!-- Plot frame: x ∈ [0, 9], y ∈ [0, 8].  Frame width 9*30=270, height 8*30=240. Frame x:60..330, y:50..290. Origin (60, 290) -->
  <rect class="panel" x="60" y="50" width="270" height="240"/>

  <!-- Vertical grid -->
  <line class="grid" x1="90"  y1="50" x2="90"  y2="290"/>
  <line class="grid" x1="120" y1="50" x2="120" y2="290"/>
  <line class="grid" x1="150" y1="50" x2="150" y2="290"/>
  <line class="grid" x1="180" y1="50" x2="180" y2="290"/>
  <line class="grid" x1="210" y1="50" x2="210" y2="290"/>
  <line class="grid" x1="240" y1="50" x2="240" y2="290"/>
  <line class="grid" x1="270" y1="50" x2="270" y2="290"/>
  <line class="grid" x1="300" y1="50" x2="300" y2="290"/>
  <!-- Horizontal grid -->
  <line class="grid" x1="60" y1="260" x2="330" y2="260"/>
  <line class="grid" x1="60" y1="230" x2="330" y2="230"/>
  <line class="grid" x1="60" y1="200" x2="330" y2="200"/>
  <line class="grid" x1="60" y1="170" x2="330" y2="170"/>
  <line class="grid" x1="60" y1="140" x2="330" y2="140"/>
  <line class="grid" x1="60" y1="110" x2="330" y2="110"/>
  <line class="grid" x1="60" y1="80"  x2="330" y2="80"/>

  <!-- Axes (y=0 axis at py=290; x=0 axis at px=60) -->
  <line class="axis" x1="60"  y1="290" x2="330" y2="290"/>
  <line class="axis" x1="60"  y1="50"  x2="60"  y2="290"/>

  <!-- Tick labels -->
  <text class="axislbl" x="60"  y="304">0</text>
  <text class="axislbl" x="90"  y="304">1</text>
  <text class="axislbl" x="180" y="304">4</text>
  <text class="axislbl" x="270" y="304">7</text>
  <text class="axislbl" x="300" y="304">8</text>
  <text class="axislbl" x="52"  y="294" text-anchor="end">0</text>
  <text class="axislbl" x="52"  y="264" text-anchor="end">1</text>
  <text class="axislbl" x="52"  y="174" text-anchor="end">4</text>
  <text class="axislbl" x="52"  y="84"  text-anchor="end">7</text>
  <text class="axislbl" x="338" y="294">x</text>
  <text class="axislbl" x="60"  y="44">y</text>

  <!-- Vertices: A=(1,1)→(90,260); B=(7,2)→(270,230); C=(3,6)→(150,110).  Counter-clockwise ordering -->
  <polygon class="triFill" points="90,260 270,230 150,110"/>

  <!-- CCW arrows along edges, just inside -->
  <path class="arrow" d="M 100 257 Q 180 243 260 232" marker-end="url(#ah-tri)"/>
  <path class="arrow" d="M 263 222 Q 200 168 158 116" marker-end="url(#ah-tri)"/>
  <path class="arrow" d="M 144 116 Q 116 188 96 254" marker-end="url(#ah-tri)"/>

  <defs>
    <marker id="ah-tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- Vertices -->
  <circle class="pt ptA" cx="90"  cy="260" r="6"/>
  <text class="lbl" x="74" y="278" fill="#2f855a">A(1, 1)</text>
  <circle class="pt ptB" cx="270" cy="230" r="6"/>
  <text class="lbl" x="280" y="226" fill="#c05621">B(7, 2)</text>
  <circle class="pt ptC" cx="150" cy="110" r="6"/>
  <text class="lbl" x="160" y="104" fill="#6b46c1">C(3, 6)</text>

  <!-- Right panel: shoelace computation -->
  <g transform="translate(360, 40)">
    <rect x="0" y="0" width="270" height="280" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
    <text font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" x="135" y="22" text-anchor="middle">Substitute the coordinates</text>

    <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2f855a" x="14" y="50">x_A(y_B − y_C)  =  1·(2 − 6)  =  −4</text>
    <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#c05621" x="14" y="74">x_B(y_C − y_A)  =  7·(6 − 1)  =  35</text>
    <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#6b46c1" x="14" y="98">x_C(y_A − y_B)  =  3·(1 − 2)  =  −3</text>

    <line x1="14" y1="112" x2="256" y2="112" stroke="#cbd5e0"/>

    <text font="italic 13px system-ui" font-size="13" fill="#1a202c" x="14" y="134">sum  =  −4 + 35 − 3  =  28</text>
    <text font="italic 13px system-ui" font-size="13" fill="#1a202c" x="14" y="156">|sum|  =  28   (sign tells orientation)</text>

    <rect x="14" y="172" width="242" height="44" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" x="135" y="194" text-anchor="middle">Area  =  ½ · 28  =  14  sq units</text>
    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="135" y="210" text-anchor="middle">positive sum ⇒ vertices listed counter-clockwise</text>

    <text font="11px system-ui" font-size="11" fill="#4a5568" x="14" y="240">Determinant view:</text>
    <text font="italic 12px system-ui" font-size="12" fill="#1a202c" x="14" y="258">Area = ½ |det( B − A,  C − A )|</text>
    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="14" y="272">= ½ |(6)(5) − (1)(2)|  =  ½·28  =  14   ✓</text>
  </g>

  <text x="320" y="332" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Collinear vertices give signed sum = 0 — area zero is the algebraic test for collinearity.</text>
</svg>
