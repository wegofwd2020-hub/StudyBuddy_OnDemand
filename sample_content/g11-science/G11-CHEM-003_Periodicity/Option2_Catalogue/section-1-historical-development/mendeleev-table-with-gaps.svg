<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Mendeleev table excerpt with predicted gaps">
  <title>Mendeleev's 1869 Table — Excerpt with Predicted Gaps</title>
  <desc>Excerpt of Mendeleev's periodic table organised by atomic mass. Boxes for known elements (H, Li, Be, B, C; Na, Mg, Al, Si; K, Ca, ?, ?, As, Se) are filled in. Two gaps marked with question marks correspond to eka-aluminium (Gallium, discovered 1875) and eka-silicon (Germanium, discovered 1886). A side panel lists the predicted vs measured properties of eka-silicon.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Mendeleev's 1869 Table — Gaps that Predicted New Elements</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Ordered by atomic mass; gaps left for missing elements with predicted properties.</text>

  <!-- Group headings -->
  <g font="bold 11px system-ui" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">
    <text x="80" y="68">Group I</text>
    <text x="140" y="68">Group II</text>
    <text x="200" y="68">Group III</text>
    <text x="260" y="68">Group IV</text>
    <text x="320" y="68">Group V</text>
    <text x="380" y="68">Group VI</text>
  </g>

  <!-- Period 2 (row 1 here): Li Be B C N O -->
  <g>
    <rect x="50" y="76" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="80" y="92" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Li</text>
    <text x="80" y="106" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">7</text>
    <rect x="110" y="76" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="140" y="92" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Be</text>
    <text x="140" y="106" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">9</text>
    <rect x="170" y="76" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="200" y="92" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">B</text>
    <text x="200" y="106" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">11</text>
    <rect x="230" y="76" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="260" y="92" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">C</text>
    <text x="260" y="106" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">12</text>
    <rect x="290" y="76" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="320" y="92" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">N</text>
    <text x="320" y="106" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">14</text>
    <rect x="350" y="76" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="380" y="92" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">O</text>
    <text x="380" y="106" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">16</text>
  </g>

  <!-- Period 3: Na Mg Al Si P S -->
  <g>
    <rect x="50" y="116" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="80" y="132" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Na</text>
    <text x="80" y="146" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">23</text>
    <rect x="110" y="116" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="140" y="132" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Mg</text>
    <text x="140" y="146" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">24</text>
    <rect x="170" y="116" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="200" y="132" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Al</text>
    <text x="200" y="146" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">27</text>
    <rect x="230" y="116" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="260" y="132" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Si</text>
    <text x="260" y="146" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">28</text>
    <rect x="290" y="116" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="320" y="132" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">P</text>
    <text x="320" y="146" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">31</text>
    <rect x="350" y="116" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="380" y="132" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">S</text>
    <text x="380" y="146" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">32</text>
  </g>

  <!-- Period 4: K Ca ?(eka-Al) ?(eka-Si) As Se -->
  <g>
    <rect x="50" y="156" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="80" y="172" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">K</text>
    <text x="80" y="186" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">39</text>
    <rect x="110" y="156" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="140" y="172" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Ca</text>
    <text x="140" y="186" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">40</text>
    <!-- gap: eka-Aluminium (Ga) -->
    <rect x="170" y="156" width="60" height="36" rx="4" fill="#fef3c7" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="200" y="174" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle">?</text>
    <text x="200" y="188" font="9px system-ui" font-size="9" fill="#dc2626" text-anchor="middle">~68</text>
    <!-- gap: eka-Silicon (Ge) -->
    <rect x="230" y="156" width="60" height="36" rx="4" fill="#fef3c7" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="260" y="174" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle">?</text>
    <text x="260" y="188" font="9px system-ui" font-size="9" fill="#dc2626" text-anchor="middle">~72</text>
    <rect x="290" y="156" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="320" y="172" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">As</text>
    <text x="320" y="186" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">75</text>
    <rect x="350" y="156" width="60" height="36" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="380" y="172" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Se</text>
    <text x="380" y="186" font="9px system-ui" font-size="9" fill="#1e3a8a" text-anchor="middle">79</text>
  </g>

  <!-- Arrows pointing to gaps -->
  <line x1="200" y1="208" x2="200" y2="195" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="222" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">eka-Al</text>
  <text x="200" y="234" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">→ Gallium (1875)</text>

  <line x1="260" y1="208" x2="260" y2="195" stroke="#dc2626" stroke-width="1.5"/>
  <text x="260" y="222" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">eka-Si</text>
  <text x="260" y="234" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">→ Germanium (1886)</text>

  <!-- Side panel: predicted vs measured for eka-silicon -->
  <g transform="translate(440, 76)">
    <rect x="0" y="0" width="260" height="170" rx="10" fill="#f7fafc" stroke="#dc2626" stroke-width="1.5"/>
    <text x="130" y="20" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">eka-silicon  →  Germanium</text>

    <text x="14" y="42" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1a202c">property</text>
    <text x="140" y="42" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">Mendeleev (1871)</text>
    <text x="232" y="42" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">measured</text>

    <line x1="10" y1="48" x2="252" y2="48" stroke="#cbd5e0" stroke-width="1"/>

    <text x="14" y="65" font="10px system-ui" font-size="10" fill="#4a5568">atomic mass</text>
    <text x="140" y="65" font="10px system-ui" font-size="10" fill="#1e3a8a" text-anchor="middle">72</text>
    <text x="232" y="65" font="10px system-ui" font-size="10" fill="#15803d" text-anchor="middle">72.6</text>

    <text x="14" y="83" font="10px system-ui" font-size="10" fill="#4a5568">density (g/cm³)</text>
    <text x="140" y="83" font="10px system-ui" font-size="10" fill="#1e3a8a" text-anchor="middle">5.5</text>
    <text x="232" y="83" font="10px system-ui" font-size="10" fill="#15803d" text-anchor="middle">5.32</text>

    <text x="14" y="101" font="10px system-ui" font-size="10" fill="#4a5568">colour</text>
    <text x="140" y="101" font="10px system-ui" font-size="10" fill="#1e3a8a" text-anchor="middle">dark grey</text>
    <text x="232" y="101" font="10px system-ui" font-size="10" fill="#15803d" text-anchor="middle">grey-white</text>

    <text x="14" y="119" font="10px system-ui" font-size="10" fill="#4a5568">M—O formula</text>
    <text x="140" y="119" font="10px system-ui" font-size="10" fill="#1e3a8a" text-anchor="middle">EsO₂</text>
    <text x="232" y="119" font="10px system-ui" font-size="10" fill="#15803d" text-anchor="middle">GeO₂</text>

    <text x="14" y="137" font="10px system-ui" font-size="10" fill="#4a5568">M—Cl boil pt.</text>
    <text x="140" y="137" font="10px system-ui" font-size="10" fill="#1e3a8a" text-anchor="middle">&lt; 100 °C</text>
    <text x="232" y="137" font="10px system-ui" font-size="10" fill="#15803d" text-anchor="middle">86 °C</text>

    <text x="130" y="160" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">prediction validated 15 years later</text>
  </g>

  <text x="360" y="266" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Mendeleev arranged elements by atomic mass — but left blanks where the pattern demanded an unknown.</text>
  <text x="360" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">When Ga (1875) and Ge (1886) were discovered, their properties matched his predictions almost exactly.</text>
  <text x="360" y="302" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">A periodic table that predicts new elements is a periodic table that captures something real.</text>

</svg>
