<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Periodic table evolution timeline">
  <title>Evolution of the Periodic Table — Timeline</title>
  <desc>Horizontal timeline from 1817 to 1913 showing four landmark contributions: Döbereiner's triads (1817), Newlands' law of octaves (1865), Mendeleev's table by atomic mass (1869), and Moseley's reordering by atomic number (1913). Each milestone has a name, year, and one-line idea card above the spine.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Evolution of the Periodic Table — Four Milestones</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">From triads to atomic number: a century of trying to read order out of the elements.</text>

  <!-- Spine -->
  <line x1="60" y1="180" x2="660" y2="180" stroke="#1a202c" stroke-width="3"/>
  <polygon points="660,180 650,174 650,186" fill="#1a202c"/>

  <!-- Year ticks -->
  <g font="bold 11px system-ui" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">
    <line x1="120" y1="180" x2="120" y2="190" stroke="#1a202c" stroke-width="1.5"/>
    <text x="120" y="206">1817</text>
    <line x1="280" y1="180" x2="280" y2="190" stroke="#1a202c" stroke-width="1.5"/>
    <text x="280" y="206">1865</text>
    <line x1="440" y1="180" x2="440" y2="190" stroke="#1a202c" stroke-width="1.5"/>
    <text x="440" y="206">1869</text>
    <line x1="600" y1="180" x2="600" y2="190" stroke="#1a202c" stroke-width="1.5"/>
    <text x="600" y="206">1913</text>
  </g>

  <!-- Card 1: Döbereiner -->
  <g>
    <rect x="40" y="60" width="160" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="120" y="80" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Döbereiner</text>
    <text x="120" y="98" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Law of Triads</text>
    <text x="120" y="118" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">groups of 3 with</text>
    <text x="120" y="130" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">middle = avg of ends</text>
    <text x="120" y="148" font="bold 9px system-ui" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">Li · Na · K</text>
    <line x1="120" y1="160" x2="120" y2="178" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Card 2: Newlands -->
  <g>
    <rect x="200" y="60" width="160" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="280" y="80" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Newlands</text>
    <text x="280" y="98" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">Law of Octaves</text>
    <text x="280" y="118" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">every 8th element</text>
    <text x="280" y="130" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">repeats properties</text>
    <text x="280" y="148" font="bold 9px system-ui" font-size="9" font-weight="700" fill="#14532d" text-anchor="middle">Li · Be · B · C · N · O · F · Na</text>
    <line x1="280" y1="160" x2="280" y2="178" stroke="#15803d" stroke-width="1.5"/>
  </g>

  <!-- Card 3: Mendeleev -->
  <g>
    <rect x="360" y="60" width="160" height="100" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="440" y="80" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Mendeleev</text>
    <text x="440" y="98" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Table by atomic mass</text>
    <text x="440" y="118" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">left gaps for</text>
    <text x="440" y="130" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">undiscovered elements</text>
    <text x="440" y="148" font="bold 9px system-ui" font-size="9" font-weight="700" fill="#1e3a8a" text-anchor="middle">predicted Ga, Ge, Sc</text>
    <line x1="440" y1="160" x2="440" y2="178" stroke="#2b6cb0" stroke-width="1.5"/>
  </g>

  <!-- Card 4: Moseley -->
  <g>
    <rect x="520" y="60" width="160" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="80" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Moseley</text>
    <text x="600" y="98" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Atomic number Z</text>
    <text x="600" y="118" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">X-ray data → order by</text>
    <text x="600" y="130" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">proton count, not mass</text>
    <text x="600" y="148" font="bold 9px system-ui" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">fixed Te/I, Ar/K, Co/Ni</text>
    <line x1="600" y1="160" x2="600" y2="178" stroke="#dc2626" stroke-width="1.5"/>
  </g>

  <!-- The "modern law" call-out -->
  <g transform="translate(60, 230)">
    <rect x="0" y="0" width="600" height="58" rx="10" fill="#f7fafc" stroke="#1a202c" stroke-width="1.5"/>
    <text x="300" y="22" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Modern Periodic Law (Moseley, 1913)</text>
    <text x="300" y="42" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">"The properties of elements are a periodic function of their atomic number."</text>
  </g>

  <text x="360" y="306" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Each step kept the periodicity insight; only the ordering rule changed — from mass to count of protons.</text>

</svg>
