<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Anomalous properties of second-period elements">
  <title>Second-Period Anomalies — Why Li, Be, B, C, N, O, F Misbehave</title>
  <desc>Three callout cards showing how second-period elements break trends from their group-mates. Card 1: Li / Be diagonal-relationship — Li resembles Mg, Be resembles Al. Card 2: maximum covalency — N caps at 4, but P can reach 5 (PCl5); O caps at 2, but S reaches 6 (SF6). Card 3: small-size effect — H–F dimerises into HF chains via H-bonding; H–Cl, H–Br, H–I do not.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Second-Period Anomalies — When the Trend Breaks</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Three reasons period-2 elements behave differently from their group-mates: small size, no d-orbital, strong H-bonds.</text>

  <!-- Card 1: Diagonal relationship -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="220" height="270" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="110" y="22" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">1. Diagonal Relationship</text>
    <text x="110" y="42" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Li resembles Mg; Be resembles Al.</text>

    <!-- Mini diagonal grid -->
    <g transform="translate(40, 62)">
      <!-- Li -->
      <rect x="0" y="0" width="56" height="48" rx="4" fill="#fff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="28" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Li</text>
      <text x="28" y="38" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">Group 1</text>

      <!-- Be -->
      <rect x="60" y="0" width="56" height="48" rx="4" fill="#fff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="88" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Be</text>
      <text x="88" y="38" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">Group 2</text>

      <!-- Mg (period 3, group 2) -->
      <rect x="60" y="58" width="56" height="48" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="88" y="80" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Mg</text>
      <text x="88" y="96" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">Group 2</text>

      <!-- Al (group 13) -->
      <rect x="120" y="58" width="56" height="48" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="148" y="80" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Al</text>
      <text x="148" y="96" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">Group 13</text>

      <!-- Diagonal arrows -->
      <line x1="56" y1="48" x2="60" y2="58" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2"/>
      <line x1="0" y1="0" x2="60" y2="0" stroke="none"/>
      <!-- Li → Mg arrow -->
      <line x1="40" y1="40" x2="76" y2="64" stroke="#dc2626" stroke-width="2"/>
      <polygon points="76,64 70,60 70,68" fill="#dc2626"/>
      <!-- Be → Al arrow -->
      <line x1="100" y1="40" x2="136" y2="64" stroke="#dc2626" stroke-width="2"/>
      <polygon points="136,64 130,60 130,68" fill="#dc2626"/>
    </g>

    <text x="110" y="200" font="10px system-ui" font-size="10" fill="#1a202c" text-anchor="middle">Small + high charge-density</text>
    <text x="110" y="216" font="10px system-ui" font-size="10" fill="#1a202c" text-anchor="middle">cations behave like the next</text>
    <text x="110" y="232" font="10px system-ui" font-size="10" fill="#1a202c" text-anchor="middle">column down a row.</text>
    <text x="110" y="256" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Li, Be → "lighter" cousins of Mg, Al</text>
  </g>

  <!-- Card 2: Maximum covalency -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="220" height="270" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <text x="110" y="22" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">2. Capped Covalency</text>
    <text x="110" y="42" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Period 2 has no d-orbital available.</text>

    <!-- Comparison table: N vs P, O vs S -->
    <g transform="translate(20, 62)">
      <!-- Header -->
      <text x="40" y="14" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#7c2d12" text-anchor="middle">Period 2</text>
      <text x="140" y="14" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#7c2d12" text-anchor="middle">Period 3</text>

      <!-- N row -->
      <rect x="0" y="22" width="80" height="44" rx="4" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
      <text x="40" y="40" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">NCl₃</text>
      <text x="40" y="58" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">N covalency = 3</text>

      <text x="105" y="48" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#7c2d12" text-anchor="middle">vs</text>

      <rect x="120" y="22" width="80" height="44" rx="4" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
      <text x="160" y="40" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">PCl₅</text>
      <text x="160" y="58" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">P covalency = 5 ★</text>

      <!-- O row -->
      <rect x="0" y="76" width="80" height="44" rx="4" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
      <text x="40" y="94" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">OF₂</text>
      <text x="40" y="112" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">O covalency = 2</text>

      <text x="105" y="102" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#7c2d12" text-anchor="middle">vs</text>

      <rect x="120" y="76" width="80" height="44" rx="4" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
      <text x="160" y="94" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">SF₆</text>
      <text x="160" y="112" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">S covalency = 6 ★</text>
    </g>

    <text x="110" y="216" font="10px system-ui" font-size="10" fill="#1a202c" text-anchor="middle">N, O, F have only 2s + 2p</text>
    <text x="110" y="232" font="10px system-ui" font-size="10" fill="#1a202c" text-anchor="middle">→ max 8 valence-electron seats.</text>
    <text x="110" y="256" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#7c2d12" text-anchor="middle">P, S can use 3d → expand octet.</text>
  </g>

  <!-- Card 3: Hydrogen bonding (HF anomaly) -->
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="220" height="270" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="110" y="22" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">3. Strong H-bonding</text>
    <text x="110" y="42" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Small + electronegative → H-bonds.</text>

    <!-- Sketch HF chain -->
    <g transform="translate(20, 70)">
      <!-- HF unit 1 -->
      <circle cx="20" cy="20" r="10" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
      <text x="20" y="24" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
      <line x1="29" y1="20" x2="46" y2="20" stroke="#1a202c" stroke-width="2"/>
      <circle cx="55" cy="20" r="14" fill="#dcfce7" stroke="#14532d" stroke-width="1.5"/>
      <text x="55" y="24" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">F</text>

      <!-- H-bond (dashed) -->
      <line x1="68" y1="20" x2="88" y2="20" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- HF unit 2 -->
      <circle cx="98" cy="20" r="10" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
      <text x="98" y="24" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
      <line x1="107" y1="20" x2="124" y2="20" stroke="#1a202c" stroke-width="2"/>
      <circle cx="133" cy="20" r="14" fill="#dcfce7" stroke="#14532d" stroke-width="1.5"/>
      <text x="133" y="24" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">F</text>

      <!-- H-bond -->
      <line x1="146" y1="20" x2="166" y2="20" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- HF unit 3 -->
      <circle cx="176" cy="20" r="10" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
      <text x="176" y="24" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

      <text x="90" y="58" font="bold 9px system-ui" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">red dashes = H-bonds</text>
    </g>

    <!-- Boiling-point comparison -->
    <g transform="translate(20, 152)">
      <text x="90" y="0" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">Boiling points (°C)</text>

      <text x="0" y="20" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#14532d">HF</text>
      <text x="100" y="20" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end">+19.5 ★</text>

      <text x="0" y="40" font="11px system-ui" font-size="11" fill="#4a5568">HCl</text>
      <text x="100" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">−85</text>

      <text x="0" y="60" font="11px system-ui" font-size="11" fill="#4a5568">HBr</text>
      <text x="100" y="60" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">−66</text>

      <text x="0" y="80" font="11px system-ui" font-size="11" fill="#4a5568">HI</text>
      <text x="100" y="80" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">−35</text>

      <text x="180" y="50" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">HF is</text>
      <text x="180" y="64" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">100 °C</text>
      <text x="180" y="78" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">higher!</text>
    </g>
  </g>

  <!-- Bottom strip -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="640" height="32" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="320" y="20" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Period-2 elements are tiny — small atoms make tight bonds, can't reach d-orbitals, and concentrate charge sharply.</text>
  </g>

</svg>
