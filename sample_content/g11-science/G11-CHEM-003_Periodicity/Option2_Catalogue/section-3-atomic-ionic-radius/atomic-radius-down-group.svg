<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Atomic radius increases down group 1">
  <title>Atomic Radius — Increases Down a Group</title>
  <desc>Bar plot of atomic radius (in pm) for the alkali metals Li, Na, K, Rb, Cs. Bars rise from 152 pm (Li) to 265 pm (Cs). To the left of the bars, scaled circles show the relative sizes of each atom. The reason — extra shells outweigh extra nuclear charge — is given as a callout.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Atomic Radius — Down a Group (Alkali Metals)</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Each step down adds a whole new shell — atoms get bigger.</text>

  <!-- Atom-size visual: scaled circles on the left -->
  <g transform="translate(40, 60)">
    <text x="120" y="0" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">Relative atom sizes</text>
    <!-- Li r=15 (scaled), Na r=22, K r=31, Rb r=37, Cs r=42 -->
    <circle cx="40" cy="120" r="15" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="40" y="125" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Li</text>
    <circle cx="90" cy="120" r="22" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="90" y="125" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Na</text>
    <circle cx="150" cy="120" r="31" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="150" y="125" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">K</text>
    <circle cx="220" cy="120" r="37" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="220" y="125" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Rb</text>
    <circle cx="295" cy="120" r="42" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="295" y="125" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Cs</text>
  </g>

  <!-- Down-group arrow -->
  <g transform="translate(40, 200)">
    <line x1="20" y1="0" x2="320" y2="0" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="320,0 312,-5 312,5" fill="#dc2626"/>
    <text x="170" y="-6" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">going down Group 1 →</text>
  </g>

  <!-- Bar plot on the right: y-axis 0..280 pm -->
  <g transform="translate(380, 60)">
    <text x="160" y="0" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">Atomic radius (pm)</text>

    <!-- Y-axis -->
    <line x1="40" y1="20" x2="40" y2="220" stroke="#1a202c" stroke-width="1.5"/>
    <!-- X-axis -->
    <line x1="40" y1="220" x2="320" y2="220" stroke="#1a202c" stroke-width="1.5"/>

    <!-- Y-axis ticks: 0, 100, 200, 300 -->
    <g font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="end">
      <line x1="36" y1="220" x2="40" y2="220" stroke="#1a202c" stroke-width="1"/>
      <text x="34" y="223">0</text>
      <line x1="36" y1="148" x2="40" y2="148" stroke="#1a202c" stroke-width="1"/>
      <text x="34" y="151">100</text>
      <line x1="36" y1="76" x2="40" y2="76" stroke="#1a202c" stroke-width="1"/>
      <text x="34" y="79">200</text>
      <line x1="36" y1="4" x2="40" y2="4" stroke="#1a202c" stroke-width="1"/>
      <text x="34" y="7">300</text>
    </g>

    <!-- Bars: scale 1 pm = 0.72 px (so 100 pm = 72 px). Heights from 220 -->
    <!-- Li 152 → 220 - 152*0.72 = 220 - 109.4 = 110.6 -->
    <rect x="60" y="110.6" width="36" height="109.4" fill="#3b82f6" opacity="0.85" stroke="#1e3a8a" stroke-width="1"/>
    <text x="78" y="240" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Li</text>
    <text x="78" y="105" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">152</text>

    <!-- Na 186 → 220 - 134 = 86 -->
    <rect x="112" y="86.1" width="36" height="133.9" fill="#3b82f6" opacity="0.85" stroke="#1e3a8a" stroke-width="1"/>
    <text x="130" y="240" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Na</text>
    <text x="130" y="80" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">186</text>

    <!-- K 227 → 220 - 163.4 = 56.6 -->
    <rect x="164" y="56.6" width="36" height="163.4" fill="#3b82f6" opacity="0.85" stroke="#1e3a8a" stroke-width="1"/>
    <text x="182" y="240" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">K</text>
    <text x="182" y="50" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">227</text>

    <!-- Rb 248 → 220 - 178.6 = 41.4 -->
    <rect x="216" y="41.4" width="36" height="178.6" fill="#3b82f6" opacity="0.85" stroke="#1e3a8a" stroke-width="1"/>
    <text x="234" y="240" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Rb</text>
    <text x="234" y="36" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">248</text>

    <!-- Cs 265 → 220 - 190.8 = 29.2 -->
    <rect x="268" y="29.2" width="36" height="190.8" fill="#3b82f6" opacity="0.85" stroke="#1e3a8a" stroke-width="1"/>
    <text x="286" y="240" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Cs</text>
    <text x="286" y="24" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">265</text>

    <text x="160" y="262" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">element (Z increases →)</text>
  </g>

  <!-- Why callout -->
  <g transform="translate(40, 296)">
    <rect x="0" y="0" width="640" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="320" y="20" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Why bigger? Each new period adds a whole new electron shell (n increases).</text>
    <text x="320" y="36" font="11px system-ui" font-size="11" fill="#92400e" text-anchor="middle">The added shell out-shields the added nuclear charge — the outermost electron lives further from the pull.</text>
  </g>

</svg>
