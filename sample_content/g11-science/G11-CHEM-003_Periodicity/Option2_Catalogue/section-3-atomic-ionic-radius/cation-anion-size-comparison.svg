<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Cation versus anion size comparison Na Cl">
  <title>Ionic Radius — Cations Shrink, Anions Swell</title>
  <desc>Two side-by-side comparisons. Left: Na atom (186 pm, 11 protons + 11 electrons) becomes Na⁺ (102 pm, 11 protons + 10 electrons) — loses an entire shell, much smaller. Right: Cl atom (99 pm, 17 protons + 17 electrons) becomes Cl⁻ (181 pm, 17 protons + 18 electrons) — extra electron repels and the cloud expands. Each pair is drawn to scale. Numbers and a one-line explanation accompany each.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Ionic Radius — Lose vs Gain Electrons</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Cation (lose e⁻) → smaller. Anion (gain e⁻) → bigger. Number of protons doesn't change.</text>

  <!-- Left panel: Na vs Na+ -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="340" height="220" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="170" y="20" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Sodium  ·  Group 1 alkali metal</text>

    <!-- Na atom: r=56 (scaled, 1 pm = 0.30 px) -->
    <circle cx="80" cy="120" r="56" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="80" cy="120" r="6" fill="#dc2626"/>
    <text x="80" y="100" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Na</text>
    <text x="80" y="140" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">11 p⁺  ·  11 e⁻</text>
    <text x="80" y="194" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">186 pm</text>
    <text x="80" y="208" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">3 shells</text>

    <!-- Arrow -->
    <line x1="148" y1="120" x2="200" y2="120" stroke="#dc2626" stroke-width="2" marker-end="url(#cation-arr)"/>
    <text x="174" y="108" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">– 1 e⁻</text>
    <text x="174" y="135" font="9px system-ui" font-size="9" fill="#dc2626" text-anchor="middle">lose outer shell</text>

    <!-- Na+ ion: r=31 (scaled) -->
    <circle cx="260" cy="120" r="31" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <circle cx="260" cy="120" r="6" fill="#dc2626"/>
    <text x="260" y="106" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">Na⁺</text>
    <text x="260" y="138" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">11 p⁺  ·  10 e⁻</text>
    <text x="260" y="194" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">102 pm</text>
    <text x="260" y="208" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">2 shells (Ne core)</text>
  </g>

  <!-- Right panel: Cl vs Cl- -->
  <g transform="translate(380, 60)">
    <rect x="0" y="0" width="320" height="220" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <text x="160" y="20" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">Chlorine  ·  Group 17 halogen</text>

    <!-- Cl atom: r=30 (scaled) -->
    <circle cx="80" cy="120" r="30" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <circle cx="80" cy="120" r="6" fill="#dc2626"/>
    <text x="80" y="106" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#7c2d12" text-anchor="middle">Cl</text>
    <text x="80" y="138" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">17 p⁺  ·  17 e⁻</text>
    <text x="80" y="194" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#7c2d12" text-anchor="middle">99 pm</text>
    <text x="80" y="208" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">3 shells</text>

    <!-- Arrow -->
    <line x1="124" y1="120" x2="180" y2="120" stroke="#15803d" stroke-width="2" marker-end="url(#anion-arr)"/>
    <text x="152" y="108" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">+ 1 e⁻</text>
    <text x="152" y="135" font="9px system-ui" font-size="9" fill="#15803d" text-anchor="middle">extra repulsion</text>

    <!-- Cl- ion: r=54 (scaled) -->
    <circle cx="240" cy="120" r="54" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <circle cx="240" cy="120" r="6" fill="#dc2626"/>
    <text x="240" y="100" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Cl⁻</text>
    <text x="240" y="140" font="9px system-ui" font-size="9" fill="#1a202c" text-anchor="middle">17 p⁺  ·  18 e⁻</text>
    <text x="240" y="190" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">181 pm</text>
    <text x="240" y="204" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">3 shells (Ar config)</text>
  </g>

  <defs>
    <marker id="cation-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="anion-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- Comparison summary -->
  <g transform="translate(40, 296)">
    <rect x="0" y="0" width="640" height="50" rx="10" fill="#f7fafc" stroke="#1a202c" stroke-width="1.5"/>
    <text x="320" y="18" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Cation: same protons, fewer electrons → tighter pull → smaller.  Anion: same protons, more electrons → looser cloud → bigger.</text>
    <text x="320" y="36" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Isoelectronic species (same e⁻ count) compared by Z: more protons ↔ smaller ion.  e.g. Na⁺ (102 pm) &lt; F⁻ (133 pm).</text>
  </g>

</svg>
