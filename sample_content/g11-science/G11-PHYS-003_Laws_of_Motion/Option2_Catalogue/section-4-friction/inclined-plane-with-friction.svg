<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" role="img" aria-label="Block on a 25° inclined plane with friction — free body diagram">
  <title>Block on inclined plane with friction</title>
  <desc>A block resting on a slope at 25°. Weight mg points straight down; the normal N pushes perpendicular to the slope; friction f acts up the slope. Weight is decomposed into components along and perpendicular to the slope.</desc>

  <defs>
    <marker id="inc-arr-N" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#319795" />
    </marker>
    <marker id="inc-arr-W" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="inc-arr-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dd6b20" />
    </marker>
    <marker id="inc-arr-comp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
  </defs>

  <text x="260" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Inclined Plane with Friction (θ = 25°)</text>

  <!-- Inclined plane triangle: vertices (60, 280), (440, 280), (60, 103) -->
  <path d="M 60 280 L 440 280 L 60 103 Z" fill="#fef9c3" stroke="#1a202c" stroke-width="1.5" />
  <!-- Hatching the bottom -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="80" y1="280" x2="72" y2="292" />
    <line x1="120" y1="280" x2="112" y2="292" />
    <line x1="160" y1="280" x2="152" y2="292" />
    <line x1="200" y1="280" x2="192" y2="292" />
    <line x1="240" y1="280" x2="232" y2="292" />
    <line x1="280" y1="280" x2="272" y2="292" />
    <line x1="320" y1="280" x2="312" y2="292" />
    <line x1="360" y1="280" x2="352" y2="292" />
    <line x1="400" y1="280" x2="392" y2="292" />
    <line x1="440" y1="280" x2="432" y2="292" />
  </g>
  <!-- Angle θ marker at the bottom-right corner -->
  <path d="M 405 280 A 35 35 0 0 0 397.92 263.84" fill="none" stroke="#1a202c" stroke-width="1.2" />
  <text x="395" y="271" font="12px system-ui" font-size="12" font-style="italic" fill="#1a202c" text-anchor="end">θ</text>

  <!-- Block (rotated 25°) — corners computed: TL(257.49,129.13), TR(311.87,154.49), BR(286.51,208.87), BL(232.13,183.51) -->
  <polygon points="257.49,129.13 311.87,154.49 286.51,208.87 232.13,183.51" fill="#bee3f8" stroke="#1a202c" stroke-width="1.5" />
  <text x="272" y="173" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">m</text>

  <!-- Force arrows from block center (272, 169) -->
  <!-- Weight mg straight down -->
  <line x1="272" y1="169" x2="272" y2="259" stroke="#dc2626" stroke-width="3" marker-end="url(#inc-arr-W)" />
  <text x="282" y="240" font="13px system-ui" font-size="13" font-weight="700" fill="#dc2626">mg</text>

  <!-- Normal N out of slope -->
  <line x1="272" y1="169" x2="301.58" y2="105.56" stroke="#319795" stroke-width="3" marker-end="url(#inc-arr-N)" />
  <text x="307" y="100" font="13px system-ui" font-size="13" font-weight="700" fill="#319795">N</text>

  <!-- Friction f up-slope -->
  <line x1="272" y1="169" x2="208.56" y2="139.42" stroke="#dd6b20" stroke-width="3" marker-end="url(#inc-arr-f)" />
  <text x="195" y="125" font="13px system-ui" font-size="13" font-weight="700" fill="#dd6b20">f</text>

  <!-- mg components (lighter purple, dashed slightly) -->
  <line x1="272" y1="169" x2="335.44" y2="198.58" stroke="#7c3aed" stroke-width="2" marker-end="url(#inc-arr-comp)" stroke-dasharray="2 2" />
  <text x="345" y="208" font="12px system-ui" font-size="12" font-weight="700" fill="#7c3aed">mg sin θ</text>

  <line x1="272" y1="169" x2="242.42" y2="232.44" stroke="#7c3aed" stroke-width="2" marker-end="url(#inc-arr-comp)" stroke-dasharray="2 2" />
  <text x="200" y="252" font="12px system-ui" font-size="12" font-weight="700" fill="#7c3aed">mg cos θ</text>

  <!-- Equation card -->
  <rect x="40" y="295" width="440" height="20" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1" />
  <text x="260" y="309" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Along slope:  ma = mg sin θ − f       Perpendicular:  N = mg cos θ       (so f_max = μ_s mg cos θ)</text>
</svg>
