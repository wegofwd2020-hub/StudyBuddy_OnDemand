<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" role="img" aria-label="Typical friction coefficients table">
  <title>Typical friction coefficients</title>
  <desc>Reference table of typical static and kinetic friction coefficients for common surface pairs, with the relationship f equals mu times N noted at the top.</desc>

  <text x="260" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Typical friction coefficients (approximate)</text>

  <!-- Equation reminder -->
  <rect x="100" y="35" width="320" height="30" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2" />
  <text x="260" y="55" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">f_s ≤ μ_s N        f_k = μ_k N        (and  μ_s &gt; μ_k)</text>

  <!-- Table -->
  <g transform="translate(40, 80)">
    <!-- Header row -->
    <rect x="0" y="0" width="440" height="34" fill="#bee3f8" stroke="#1a202c" stroke-width="1" />
    <text x="120" y="22" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Surface pair</text>
    <text x="290" y="22" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">μ_s  (static)</text>
    <text x="395" y="22" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dd6b20" text-anchor="middle">μ_k  (kinetic)</text>

    <!-- Rows -->
    <rect x="0" y="34" width="440" height="28" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="53" font="12px system-ui" font-size="12" fill="#1a202c">Rubber on dry concrete</text>
    <text x="290" y="53" font="12px system-ui" font-size="12" font-weight="600" fill="#2b6cb0" text-anchor="middle">1.0</text>
    <text x="395" y="53" font="12px system-ui" font-size="12" font-weight="600" fill="#dd6b20" text-anchor="middle">0.8</text>

    <rect x="0" y="62" width="440" height="28" fill="#fff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="81" font="12px system-ui" font-size="12" fill="#1a202c">Rubber on wet concrete</text>
    <text x="290" y="81" font="12px system-ui" font-size="12" font-weight="600" fill="#2b6cb0" text-anchor="middle">0.7</text>
    <text x="395" y="81" font="12px system-ui" font-size="12" font-weight="600" fill="#dd6b20" text-anchor="middle">0.5</text>

    <rect x="0" y="90" width="440" height="28" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="109" font="12px system-ui" font-size="12" fill="#1a202c">Wood on wood</text>
    <text x="290" y="109" font="12px system-ui" font-size="12" font-weight="600" fill="#2b6cb0" text-anchor="middle">0.5</text>
    <text x="395" y="109" font="12px system-ui" font-size="12" font-weight="600" fill="#dd6b20" text-anchor="middle">0.3</text>

    <rect x="0" y="118" width="440" height="28" fill="#fff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="137" font="12px system-ui" font-size="12" fill="#1a202c">Steel on steel (dry)</text>
    <text x="290" y="137" font="12px system-ui" font-size="12" font-weight="600" fill="#2b6cb0" text-anchor="middle">0.7</text>
    <text x="395" y="137" font="12px system-ui" font-size="12" font-weight="600" fill="#dd6b20" text-anchor="middle">0.6</text>

    <rect x="0" y="146" width="440" height="28" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="165" font="12px system-ui" font-size="12" fill="#1a202c">Steel on steel (oiled)</text>
    <text x="290" y="165" font="12px system-ui" font-size="12" font-weight="600" fill="#2b6cb0" text-anchor="middle">0.15</text>
    <text x="395" y="165" font="12px system-ui" font-size="12" font-weight="600" fill="#dd6b20" text-anchor="middle">0.06</text>

    <rect x="0" y="174" width="440" height="28" fill="#fff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="193" font="12px system-ui" font-size="12" fill="#1a202c">Ice on ice</text>
    <text x="290" y="193" font="12px system-ui" font-size="12" font-weight="600" fill="#2b6cb0" text-anchor="middle">0.10</text>
    <text x="395" y="193" font="12px system-ui" font-size="12" font-weight="600" fill="#dd6b20" text-anchor="middle">0.03</text>

    <rect x="0" y="202" width="440" height="28" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="221" font="12px system-ui" font-size="12" fill="#1a202c">Teflon on Teflon</text>
    <text x="290" y="221" font="12px system-ui" font-size="12" font-weight="600" fill="#2b6cb0" text-anchor="middle">0.04</text>
    <text x="395" y="221" font="12px system-ui" font-size="12" font-weight="600" fill="#dd6b20" text-anchor="middle">0.04</text>
  </g>

  <text x="260" y="312" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Coefficients are dimensionless and depend on both surfaces — not just one.  Real values vary with cleanliness, temperature, and load.</text>
</svg>
