    fill="none" stroke="#dd6b20" stroke-width="3.5" stroke-linecap="round" />

  <!-- Sample points -->
  <circle cx="125" cy="32" r="4" fill="#dd6b20" />
  <text x="135" y="34" font="11px system-ui" font-size="11" font-weight="600" fill="#dd6b20">1 kg → 12 m/s²</text>
  <circle cx="190" cy="151" r="4" fill="#dd6b20" />
  <text x="200" y="148" font="11px system-ui" font-size="11" font-weight="600" fill="#dd6b20">2 kg → 6 m/s²</text>
  <circle cx="320" cy="210.33" r="4" fill="#dd6b20" />
  <text x="330" y="207" font="11px system-ui" font-size="11" font-weight="600" fill="#dd6b20">4 kg → 3 m/s²</text>

  <text x="255" y="316" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">a is inversely proportional to mass at fixed force.  Doubling m halves a.</text>
</svg>
