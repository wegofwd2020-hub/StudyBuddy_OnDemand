<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="Acceleration versus mass at fixed net force">
  <title>Acceleration vs mass at fixed net force</title>
  <desc>Hyperbolic curve a = F/m for F = 12 N, showing that acceleration is inversely proportional to mass when the net force is held constant.</desc>

  <rect x="60" y="32" width="390" height="238" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Vertical grid (m: 0..6, every 1) -->
  <line x1="60" y1="32" x2="60" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="60" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0</text>
  <line x1="125" y1="32" x2="125" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="125" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">1</text>
  <line x1="190" y1="32" x2="190" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="190" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">2</text>
  <line x1="255" y1="32" x2="255" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="255" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">3</text>
  <line x1="320" y1="32" x2="320" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="320" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">4</text>
  <line x1="385" y1="32" x2="385" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="385" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">5</text>
  <line x1="450" y1="32" x2="450" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="450" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">6</text>

  <!-- Horizontal grid (a: 0..12, every 2) -->
  <line x1="60" y1="270" x2="450" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="274" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">0</text>
  <line x1="60" y1="230.33" x2="450" y2="230.33" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="234.33" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">2</text>
  <line x1="60" y1="190.67" x2="450" y2="190.67" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="194.67" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">4</text>
  <line x1="60" y1="151" x2="450" y2="151" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="155" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">6</text>
  <line x1="60" y1="111.33" x2="450" y2="111.33" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="115.33" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">8</text>
  <line x1="60" y1="71.67" x2="450" y2="71.67" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="75.67" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">10</text>
  <line x1="60" y1="32" x2="450" y2="32" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="36" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">12</text>

  <line x1="60" y1="270" x2="450" y2="270" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="60" y1="32" x2="60" y2="270" stroke="#94a3b8" stroke-width="1.2" />

  <text x="255" y="302" font="13px system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle">m (kg)</text>
  <text x="24" y="151" font="13px system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle" transform="rotate(-90 24 151)">a (m/s²)</text>

  <text x="255" y="20" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">a vs m at fixed force (F = 12 N)</text>

