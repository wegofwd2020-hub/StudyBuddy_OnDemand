<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="A walker pushing the ground backward — ground pushes walker forward">
  <title>Walking — action–reaction at the foot</title>
  <desc>A simplified walker pushes the ground backward with their foot (action). The ground pushes the foot forward with an equal and opposite force (reaction); this forward reaction is what propels the walker.</desc>

  <defs>
    <marker id="arr-walk-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="arr-walk-fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" />
    </marker>
  </defs>

  <text x="240" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Newton's Third Law: Walking</text>

  <!-- Stick-figure walker -->
  <!-- Head -->
  <circle cx="240" cy="80" r="14" fill="#fde68a" stroke="#1a202c" stroke-width="1.5" />
  <!-- Torso -->
  <line x1="240" y1="94" x2="240" y2="160" stroke="#1a202c" stroke-width="2.5" />
  <!-- Arms (mid-stride) -->
  <line x1="240" y1="115" x2="220" y2="145" stroke="#1a202c" stroke-width="2.2" />
  <line x1="240" y1="115" x2="262" y2="142" stroke="#1a202c" stroke-width="2.2" />
  <!-- Legs (back leg pushing) -->
  <line x1="240" y1="160" x2="218" y2="210" stroke="#1a202c" stroke-width="2.5" />
  <line x1="218" y1="210" x2="200" y2="240" stroke="#1a202c" stroke-width="2.5" />
  <!-- Front leg (planted ahead) -->
  <line x1="240" y1="160" x2="265" y2="215" stroke="#1a202c" stroke-width="2.5" />
  <line x1="265" y1="215" x2="280" y2="240" stroke="#1a202c" stroke-width="2.5" />
  <!-- Foot (back, pushing into ground) -->
  <ellipse cx="200" cy="244" rx="14" ry="4" fill="#1a202c" />
  <!-- Foot (front) -->
  <ellipse cx="280" cy="244" rx="14" ry="4" fill="#1a202c" />

  <!-- Ground -->
  <line x1="40" y1="250" x2="440" y2="250" stroke="#1a202c" stroke-width="1.5" />
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="50" y1="250" x2="42" y2="262" />
    <line x1="80" y1="250" x2="72" y2="262" />
    <line x1="110" y1="250" x2="102" y2="262" />
    <line x1="140" y1="250" x2="132" y2="262" />
    <line x1="170" y1="250" x2="162" y2="262" />
    <line x1="200" y1="250" x2="192" y2="262" />
    <line x1="230" y1="250" x2="222" y2="262" />
    <line x1="260" y1="250" x2="252" y2="262" />
    <line x1="290" y1="250" x2="282" y2="262" />
    <line x1="320" y1="250" x2="312" y2="262" />
    <line x1="350" y1="250" x2="342" y2="262" />
    <line x1="380" y1="250" x2="372" y2="262" />
    <line x1="410" y1="250" x2="402" y2="262" />
    <line x1="430" y1="250" x2="422" y2="262" />
  </g>

  <!-- F_foot→ground: backward (left), starts at the back foot, goes left -->
  <line x1="190" y1="262" x2="120" y2="262" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arr-walk-back)" />
  <text x="155" y="280" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">F_foot→ground</text>
  <text x="155" y="294" font="11px system-ui" font-size="11" font-style="italic" fill="#dc2626" text-anchor="middle">(action — on ground)</text>

  <!-- F_ground→foot: forward (right), drawn upward at foot at +30° from ground (to suggest friction reaction) -->
  <line x1="210" y1="244" x2="285" y2="218" stroke="#15803d" stroke-width="3.5" marker-end="url(#arr-walk-fwd)" />
  <text x="320" y="208" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d">F_ground→foot</text>
  <text x="320" y="222" font="11px system-ui" font-size="11" font-style="italic" fill="#15803d">(reaction — on you)</text>

  <text x="240" y="312" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Reaction force from the ground is what pushes the walker forward — friction makes this possible.</text>
</svg>
