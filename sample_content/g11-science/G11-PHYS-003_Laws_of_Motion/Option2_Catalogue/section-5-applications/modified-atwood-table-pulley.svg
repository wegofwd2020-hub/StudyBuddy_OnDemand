<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320" role="img" aria-label="Modified Atwood — block on a table connected over a pulley to a hanging mass">
  <title>Modified Atwood — table and hanging mass</title>
  <desc>Mass m1 sits on a horizontal table; a light string runs from m1 over a frictionless pulley at the edge of the table down to a hanging mass m2. Free-body diagrams and the resulting acceleration formula are shown.</desc>

  <defs>
    <marker id="ma-arr-T" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
    <marker id="ma-arr-W" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="ma-arr-N" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#319795" />
    </marker>
    <marker id="ma-arr-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dd6b20" />
    </marker>
    <marker id="ma-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" />
    </marker>
  </defs>

  <text x="270" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Modified Atwood — Block on Table + Hanging Mass</text>

  <!-- Table top -->
  <line x1="40" y1="120" x2="320" y2="120" stroke="#1a202c" stroke-width="2" />
  <!-- Table legs -->
  <line x1="80" y1="120" x2="80" y2="200" stroke="#1a202c" stroke-width="2" />
  <line x1="300" y1="120" x2="300" y2="200" stroke="#1a202c" stroke-width="2" />
  <!-- Floor (just floor line, faint) -->
  <line x1="40" y1="220" x2="320" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" />
  <!-- Table-top hatching -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="60" y1="120" x2="52" y2="132" />
    <line x1="100" y1="120" x2="92" y2="132" />
    <line x1="140" y1="120" x2="132" y2="132" />
    <line x1="180" y1="120" x2="172" y2="132" />
    <line x1="220" y1="120" x2="212" y2="132" />
    <line x1="260" y1="120" x2="252" y2="132" />
    <line x1="300" y1="120" x2="292" y2="132" />
  </g>

  <!-- m1 on table -->
  <rect x="130" y="80" width="50" height="40" rx="3" fill="#bee3f8" stroke="#1a202c" stroke-width="1.5" />
  <text x="155" y="105" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">m₁</text>

  <!-- String from m1 horizontally to pulley -->
  <line x1="180" y1="100" x2="320" y2="100" stroke="#1a202c" stroke-width="1.5" />
  <!-- Pulley at table edge -->
  <circle cx="328" cy="108" r="12" fill="#fed7aa" stroke="#1a202c" stroke-width="1.5" />
  <circle cx="328" cy="108" r="2.5" fill="#1a202c" />
  <!-- String over pulley going down -->
  <line x1="340" y1="108" x2="340" y2="240" stroke="#1a202c" stroke-width="1.5" />

  <!-- m2 hanging -->
  <rect x="312" y="240" width="56" height="50" rx="3" fill="#fed7aa" stroke="#1a202c" stroke-width="1.5" />
  <text x="340" y="270" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">m₂</text>

  <!-- Forces on m1 (small) -->
  <!-- T to the right -->
  <line x1="180" y1="92" x2="220" y2="92" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ma-arr-T)" />
  <text x="200" y="84" font="11px system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">T</text>
  <!-- friction (optional) to the left -->
  <line x1="130" y1="92" x2="100" y2="92" stroke="#dd6b20" stroke-width="2.5" marker-end="url(#ma-arr-f)" />
  <text x="115" y="84" font="11px system-ui" font-size="11" font-weight="700" fill="#dd6b20" text-anchor="middle">f</text>
  <!-- N up -->
  <line x1="155" y1="80" x2="155" y2="50" stroke="#319795" stroke-width="2.5" marker-end="url(#ma-arr-N)" />
  <text x="165" y="63" font="11px system-ui" font-size="11" font-weight="700" fill="#319795">N</text>
  <!-- m1g down (inside block, faint) -->
  <line x1="155" y1="120" x2="155" y2="148" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ma-arr-W)" />
  <text x="165" y="140" font="11px system-ui" font-size="11" font-weight="700" fill="#dc2626">m₁g</text>

  <!-- Forces on m2 -->
  <!-- T up -->
  <line x1="380" y1="240" x2="380" y2="208" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ma-arr-T)" />
  <text x="390" y="225" font="11px system-ui" font-size="11" font-weight="700" fill="#7c3aed">T</text>
  <!-- m2 g down -->
  <line x1="380" y1="290" x2="380" y2="320" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ma-arr-W)" />
  <text x="390" y="312" font="11px system-ui" font-size="11" font-weight="700" fill="#dc2626">m₂g</text>

  <!-- Acceleration arrows -->
  <line x1="155" y1="35" x2="220" y2="35" stroke="#15803d" stroke-width="2.5" marker-end="url(#ma-arr-a)" />
  <text x="135" y="38" font="12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="end">a</text>

  <!-- Equations -->
  <rect x="40" y="295" width="270" height="22" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1" />
  <text x="175" y="310" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">a = (m₂ g − f) / (m₁ + m₂)</text>

  <text x="270" y="155" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">m₁: T − f = m₁ a</text>
  <text x="430" y="180" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">m₂: m₂ g − T = m₂ a</text>
</svg>
