<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Common types of forces in mechanics">
  <title>Common types of forces in mechanics</title>
  <desc>A reference card showing the four common force types you meet in Grade 11 mechanics: weight, normal, applied/contact push or pull, and tension along a rope.</desc>

  <defs>
    <marker id="arr-grav" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="arr-norm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#319795" />
    </marker>
    <marker id="arr-app" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
    <marker id="arr-ten" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
  </defs>

  <text x="300" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Common Force Types in Mechanics</text>

  <!-- Card 1: Weight -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="135" height="240" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="67.5" y="22" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">Weight (W = mg)</text>
    <!-- Object floating to show gravity downward -->
    <circle cx="67.5" cy="80" r="14" fill="#fecaca" stroke="#1a202c" stroke-width="1.2" />
    <text x="67.5" y="85" font="bold 10px system-ui" font-size="10" fill="#1a202c" text-anchor="middle">m</text>
    <line x1="67.5" y1="100" x2="67.5" y2="160" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-grav)" />
    <text x="80" y="135" font="11px system-ui" font-size="11" font-weight="700" fill="#dc2626">mg</text>
    <text x="67.5" y="195" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Always acts</text>
    <text x="67.5" y="210" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">downward (toward</text>
    <text x="67.5" y="225" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Earth's center).</text>
  </g>

  <!-- Card 2: Normal -->
  <g transform="translate(165, 50)">
    <rect x="0" y="0" width="135" height="240" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="67.5" y="22" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#319795" text-anchor="middle">Normal (N)</text>
    <line x1="20" y1="135" x2="115" y2="135" stroke="#1a202c" stroke-width="1.5" />
    <rect x="50" y="105" width="35" height="30" rx="2" fill="#bee3f8" stroke="#1a202c" stroke-width="1.2" />
    <line x1="67.5" y1="105" x2="67.5" y2="55" stroke="#319795" stroke-width="3" marker-end="url(#arr-norm)" />
    <text x="76" y="80" font="11px system-ui" font-size="11" font-weight="700" fill="#319795">N</text>
    <text x="67.5" y="170" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Surface push,</text>
    <text x="67.5" y="185" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">perpendicular to</text>
    <text x="67.5" y="200" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">contact surface.</text>
    <text x="67.5" y="220" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Adjusts to balance</text>
  </g>

  <!-- Card 3: Applied -->
  <g transform="translate(310, 50)">
    <rect x="0" y="0" width="135" height="240" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="67.5" y="22" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">Applied / Contact (F)</text>
    <line x1="20" y1="135" x2="115" y2="135" stroke="#1a202c" stroke-width="1.5" />
    <rect x="55" y="105" width="35" height="30" rx="2" fill="#bee3f8" stroke="#1a202c" stroke-width="1.2" />
    <line x1="20" y1="120" x2="53" y2="120" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arr-app)" />
    <text x="36" y="111" font="11px system-ui" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="middle">F</text>
    <text x="67.5" y="170" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">A push or pull</text>
    <text x="67.5" y="185" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">from a hand,</text>
    <text x="67.5" y="200" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">spring, motor, etc.</text>
    <text x="67.5" y="220" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Direction = direction</text>
  </g>

  <!-- Card 4: Tension -->
  <g transform="translate(455, 50)">
    <rect x="0" y="0" width="135" height="240" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="67.5" y="22" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">Tension (T)</text>
    <!-- Anchor on top -->
    <rect x="55" y="40" width="25" height="10" fill="#1a202c" />
    <!-- Rope -->
    <line x1="67.5" y1="50" x2="67.5" y2="115" stroke="#1a202c" stroke-width="1.5" />
    <!-- Block -->
    <rect x="50" y="115" width="35" height="30" rx="2" fill="#e9d5ff" stroke="#1a202c" stroke-width="1.2" />
    <text x="67.5" y="135" font="bold 10px system-ui" font-size="10" fill="#1a202c" text-anchor="middle">m</text>
    <!-- Tension arrow on block (up) -->
    <line x1="80" y1="115" x2="80" y2="75" stroke="#7c3aed" stroke-width="3" marker-end="url(#arr-ten)" />
    <text x="92" y="98" font="11px system-ui" font-size="11" font-weight="700" fill="#7c3aed">T</text>
    <text x="67.5" y="175" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Pull along a</text>
    <text x="67.5" y="190" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">rope, string, or</text>
    <text x="67.5" y="205" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">cable.</text>
    <text x="67.5" y="225" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Same magnitude</text>
  </g>

  <text x="300" y="310" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Every force is a vector — magnitude (newtons) and direction. Free-body diagrams pick out only forces acting on the body.</text>
</svg>
