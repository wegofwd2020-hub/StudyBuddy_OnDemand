<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Mean and uncertainty from repeated measurements">
  <title>Mean &amp; Uncertainty from Repeated Measurements</title>
  <desc>Ten repeated measurements of a pendulum period plotted as scatter, with the mean and the ± standard deviation band drawn through them, and the formulas for sample mean and standard deviation listed below.</desc>

  <text x="360" y="24" font-family="system-ui" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Reporting a Measurement: x̄ ± σ — sample mean and uncertainty</text>
  <text x="360" y="44" font-family="system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">a 1.0 m simple pendulum, 10 timed periods, expected T ≈ 2.01 s</text>

  <!-- Plot frame -->
  <rect x="60" y="68" width="640" height="170" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- y-axis labels (T = 1.95 .. 2.10 s) -->
  <g font-family="system-ui" font-size="10" fill="#4a5568">
    <line x1="60" y1="80"  x2="700" y2="80"  stroke="#e2e8f0" />
    <text x="54" y="84"  text-anchor="end">2.10</text>
    <line x1="60" y1="111" x2="700" y2="111" stroke="#e2e8f0" />
    <text x="54" y="115" text-anchor="end">2.05</text>
    <line x1="60" y1="142" x2="700" y2="142" stroke="#e2e8f0" />
    <text x="54" y="146" text-anchor="end">2.00</text>
    <line x1="60" y1="173" x2="700" y2="173" stroke="#e2e8f0" />
    <text x="54" y="177" text-anchor="end">1.95</text>
    <line x1="60" y1="204" x2="700" y2="204" stroke="#e2e8f0" />
    <text x="54" y="208" text-anchor="end">1.90</text>
    <line x1="60" y1="235" x2="700" y2="235" stroke="#94a3b8" />
  </g>
  <text x="34" y="160" font-family="system-ui" font-size="12" font-weight="600" fill="#1a202c"
        text-anchor="middle" transform="rotate(-90 34 160)">period T (s)</text>

  <!-- x axis: trial 1..10 evenly spaced. range 80..680 → 60 px per step starting at trial 1 = 92 -->
  <g font-family="system-ui" font-size="10" fill="#4a5568">
    <text x="92" y="252" text-anchor="middle">1</text>
    <text x="155" y="252" text-anchor="middle">2</text>
    <text x="217" y="252" text-anchor="middle">3</text>
    <text x="280" y="252" text-anchor="middle">4</text>
    <text x="343" y="252" text-anchor="middle">5</text>
    <text x="405" y="252" text-anchor="middle">6</text>
    <text x="468" y="252" text-anchor="middle">7</text>
    <text x="531" y="252" text-anchor="middle">8</text>
    <text x="593" y="252" text-anchor="middle">9</text>
    <text x="656" y="252" text-anchor="middle">10</text>
  </g>
  <text x="380" y="270" font-family="system-ui" font-size="12" font-weight="600" fill="#1a202c" text-anchor="middle">trial number</text>

  <!-- Mean band: x̄ = 2.012 s, σ = 0.024 s. y(2.012) = ?
       y at T=2.10 is 80, T=1.90 is 204; slope = (204-80)/(1.90-2.10) = -620 per second.
       So y(T) = 80 + (2.10 - T) * 620.
       y(2.012) = 80 + 0.088*620 = 80 + 54.6 = 134.6
       y(2.012 + 0.024) = 80 + 0.064*620 = 80 + 39.7 = 119.7
       y(2.012 - 0.024) = 80 + 0.112*620 = 80 + 69.4 = 149.4 -->
  <rect x="60" y="119.7" width="640" height="29.7" fill="#dcfce7" fill-opacity="0.55" />
  <line x1="60" y1="134.6" x2="700" y2="134.6" stroke="#15803d" stroke-width="2" stroke-dasharray="6 3" />
  <line x1="60" y1="119.7" x2="700" y2="119.7" stroke="#15803d" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="60" y1="149.4" x2="700" y2="149.4" stroke="#15803d" stroke-width="1" stroke-dasharray="3 3" />

  <text x="690" y="130" font-family="system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="end">x̄ = 2.012 s</text>
  <text x="690" y="115" font-family="system-ui" font-size="10" fill="#15803d" text-anchor="end">x̄ + σ = 2.036</text>
  <text x="690" y="160" font-family="system-ui" font-size="10" fill="#15803d" text-anchor="end">x̄ − σ = 1.988</text>

  <!-- Data points: trial 1..10 periods (s):
       1.99, 2.04, 2.00, 2.05, 1.97, 2.03, 2.01, 2.04, 2.00, 1.99
       y for each = 80 + (2.10 - T) * 620 -->
  <g fill="#dd6b20">
    <!-- T=1.99 -> y = 80 + 0.11*620 = 80+68.2 = 148.2 -->
    <circle cx="92"  cy="148.2" r="5" />
    <!-- T=2.04 -> y = 80 + 0.06*620 = 80+37.2 = 117.2 -->
    <circle cx="155" cy="117.2" r="5" />
    <!-- T=2.00 -> y = 80 + 0.10*620 = 80+62 = 142 -->
    <circle cx="217" cy="142.0" r="5" />
    <!-- T=2.05 -> y = 80 + 0.05*620 = 80+31 = 111 -->
    <circle cx="280" cy="111.0" r="5" />
    <!-- T=1.97 -> y = 80 + 0.13*620 = 80+80.6 = 160.6 -->
    <circle cx="343" cy="160.6" r="5" />
    <!-- T=2.03 -> y = 80 + 0.07*620 = 80+43.4 = 123.4 -->
    <circle cx="405" cy="123.4" r="5" />
    <!-- T=2.01 -> y = 80 + 0.09*620 = 80+55.8 = 135.8 -->
    <circle cx="468" cy="135.8" r="5" />
    <!-- T=2.04 -> y = 117.2 -->
    <circle cx="531" cy="117.2" r="5" />
    <!-- T=2.00 -> y = 142.0 -->
    <circle cx="593" cy="142.0" r="5" />
    <!-- T=1.99 -> y = 148.2 -->
    <circle cx="656" cy="148.2" r="5" />
  </g>

  <!-- Formula footer -->
  <rect x="20" y="284" width="680" height="62" rx="10" fill="#f7fafc" stroke="#e2e8f0" />
  <text x="32" y="304" font-family="system-ui" font-size="12" font-weight="700" fill="#1a202c">
    Sample mean &amp; standard deviation
  </text>
  <text x="32" y="324" font-family="system-ui" font-size="13" fill="#1a202c">
    <tspan font-weight="700" fill="#15803d">x̄ = (1/N) Σ xᵢ</tspan>
    <tspan fill="#4a5568" font-size="11">  — best estimate of the true value</tspan>
  </text>
  <text x="32" y="342" font-family="system-ui" font-size="13" fill="#1a202c">
    <tspan font-weight="700" fill="#15803d">σ = √[ (1/(N−1)) Σ (xᵢ − x̄)² ]</tspan>
    <tspan fill="#4a5568" font-size="11">  — uncertainty in a single reading.  Report:  T = (2.012 ± 0.024) s</tspan>
  </text>
</svg>
