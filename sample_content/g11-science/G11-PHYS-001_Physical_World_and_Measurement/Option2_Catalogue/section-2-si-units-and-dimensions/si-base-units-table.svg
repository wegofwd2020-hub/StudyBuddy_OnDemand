<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="The seven SI base units">
  <title>The seven SI base units</title>
  <desc>Table listing the seven SI base quantities, their unit name, symbol, dimensional symbol, and the defining constant under the 2019 SI redefinition.</desc>

  <text x="360" y="26" font-family="system-ui" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">The Seven SI Base Units</text>
  <text x="360" y="46" font-family="system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">since 2019, every base unit is defined by fixing the value of a fundamental constant of nature</text>

  <!-- Table frame -->
  <rect x="20" y="62" width="680" height="280" rx="8" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Header row -->
  <rect x="20" y="62" width="680" height="34" rx="8" fill="#dbeafe" stroke="#2b6cb0" />
  <g font-family="system-ui" font-size="12" font-weight="700" fill="#1a202c">
    <text x="40"  y="84">Quantity</text>
    <text x="170" y="84">Unit name</text>
    <text x="290" y="84">Symbol</text>
    <text x="370" y="84">Dimension</text>
    <text x="470" y="84">Defining constant (2019)</text>
  </g>

  <!-- Row separator lines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="20" y1="96"  x2="700" y2="96"  />
    <line x1="20" y1="130" x2="700" y2="130" />
    <line x1="20" y1="164" x2="700" y2="164" />
    <line x1="20" y1="198" x2="700" y2="198" />
    <line x1="20" y1="232" x2="700" y2="232" />
    <line x1="20" y1="266" x2="700" y2="266" />
    <line x1="20" y1="300" x2="700" y2="300" />
  </g>
  <!-- Column separators -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="160" y1="62" x2="160" y2="342" />
    <line x1="280" y1="62" x2="280" y2="342" />
    <line x1="360" y1="62" x2="360" y2="342" />
    <line x1="460" y1="62" x2="460" y2="342" />
  </g>

  <!-- Rows -->
  <g font-family="system-ui" font-size="12" fill="#1a202c">
    <!-- length -->
    <text x="40"  y="118">length</text>
    <text x="170" y="118">metre</text>
    <text x="290" y="118" font-weight="700">m</text>
    <text x="370" y="118" font-weight="700" fill="#2b6cb0">[L]</text>
    <text x="470" y="118" fill="#4a5568">speed of light  c = 299 792 458 m/s</text>

    <!-- mass -->
    <text x="40"  y="152">mass</text>
    <text x="170" y="152">kilogram</text>
    <text x="290" y="152" font-weight="700">kg</text>
    <text x="370" y="152" font-weight="700" fill="#2b6cb0">[M]</text>
    <text x="470" y="152" fill="#4a5568">Planck constant  h = 6.626 × 10⁻³⁴ J·s</text>

    <!-- time -->
    <text x="40"  y="186">time</text>
    <text x="170" y="186">second</text>
    <text x="290" y="186" font-weight="700">s</text>
    <text x="370" y="186" font-weight="700" fill="#2b6cb0">[T]</text>
    <text x="470" y="186" fill="#4a5568">Cs hyperfine  Δν = 9 192 631 770 Hz</text>

    <!-- electric current -->
    <text x="40"  y="220">electric current</text>
    <text x="170" y="220">ampere</text>
    <text x="290" y="220" font-weight="700">A</text>
    <text x="370" y="220" font-weight="700" fill="#2b6cb0">[I]</text>
    <text x="470" y="220" fill="#4a5568">elementary charge  e = 1.602 × 10⁻¹⁹ C</text>

    <!-- temperature -->
    <text x="40"  y="254">thermodynamic temp.</text>
    <text x="170" y="254">kelvin</text>
    <text x="290" y="254" font-weight="700">K</text>
    <text x="370" y="254" font-weight="700" fill="#2b6cb0">[Θ]</text>
    <text x="470" y="254" fill="#4a5568">Boltzmann  k = 1.381 × 10⁻²³ J/K</text>

    <!-- amount of substance -->
    <text x="40"  y="288">amount of substance</text>
    <text x="170" y="288">mole</text>
    <text x="290" y="288" font-weight="700">mol</text>
    <text x="370" y="288" font-weight="700" fill="#2b6cb0">[N]</text>
    <text x="470" y="288" fill="#4a5568">Avogadro  Nₐ = 6.022 × 10²³ /mol</text>

    <!-- luminous intensity -->
    <text x="40"  y="322">luminous intensity</text>
    <text x="170" y="322">candela</text>
    <text x="290" y="322" font-weight="700">cd</text>
    <text x="370" y="322" font-weight="700" fill="#2b6cb0">[J]</text>
    <text x="470" y="322" fill="#4a5568">luminous efficacy  K_cd = 683 lm/W</text>
  </g>
</svg>
