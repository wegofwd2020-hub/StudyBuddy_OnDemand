<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="SI prefix ladder">
  <title>SI Prefixes — the ladder of powers of 10</title>
  <desc>Vertical ladder showing common SI prefixes from femto (10^-15) up to peta (10^15) with symbol, name, and a familiar example for each.</desc>

  <text x="360" y="26" font-family="system-ui" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">SI Prefixes — every step is a factor of 1000 (10³)</text>
  <text x="360" y="46" font-family="system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">use prefixes to keep numbers in a readable range — 5.3 km is friendlier than 5300 m</text>

  <!-- Central ladder -->
  <line x1="360" y1="64" x2="360" y2="358" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Each rung at y = 76, 110, 144, ... step 34 -->
  <!-- Headers -->
  <g font-family="system-ui" font-size="10" font-weight="700" fill="#4a5568">
    <text x="170" y="74" text-anchor="middle">prefix · symbol</text>
    <text x="360" y="74" text-anchor="middle">power of 10</text>
    <text x="550" y="74" text-anchor="middle">familiar example</text>
  </g>

  <!-- Rungs (label-left, power-centre, example-right) -->
  <g font-family="system-ui" font-size="12" fill="#1a202c">
    <!-- peta P 10^15 -->
    <line x1="340" y1="100" x2="380" y2="100" stroke="#7c3aed" stroke-width="2" />
    <text x="170" y="104" text-anchor="middle" font-weight="700" fill="#7c3aed">peta · P</text>
    <text x="360" y="104" text-anchor="middle" font-weight="700">10¹⁵</text>
    <text x="550" y="104" text-anchor="middle" fill="#4a5568">global yearly internet traffic ~ 5 PB/s peak</text>

    <!-- tera T 10^12 -->
    <line x1="340" y1="134" x2="380" y2="134" stroke="#7c3aed" stroke-width="2" />
    <text x="170" y="138" text-anchor="middle" font-weight="700" fill="#7c3aed">tera · T</text>
    <text x="360" y="138" text-anchor="middle" font-weight="700">10¹²</text>
    <text x="550" y="138" text-anchor="middle" fill="#4a5568">a 1 TB hard drive</text>

    <!-- giga G 10^9 -->
    <line x1="340" y1="168" x2="380" y2="168" stroke="#7c3aed" stroke-width="2" />
    <text x="170" y="172" text-anchor="middle" font-weight="700" fill="#7c3aed">giga · G</text>
    <text x="360" y="172" text-anchor="middle" font-weight="700">10⁹</text>
    <text x="550" y="172" text-anchor="middle" fill="#4a5568">3 GHz CPU clock</text>

    <!-- mega M 10^6 -->
    <line x1="340" y1="202" x2="380" y2="202" stroke="#dd6b20" stroke-width="2" />
    <text x="170" y="206" text-anchor="middle" font-weight="700" fill="#dd6b20">mega · M</text>
    <text x="360" y="206" text-anchor="middle" font-weight="700">10⁶</text>
    <text x="550" y="206" text-anchor="middle" fill="#4a5568">a 5 MP camera image</text>

    <!-- kilo k 10^3 -->
    <line x1="340" y1="236" x2="380" y2="236" stroke="#dd6b20" stroke-width="2" />
    <text x="170" y="240" text-anchor="middle" font-weight="700" fill="#dd6b20">kilo · k</text>
    <text x="360" y="240" text-anchor="middle" font-weight="700">10³</text>
    <text x="550" y="240" text-anchor="middle" fill="#4a5568">a 1 km running track</text>

    <!-- 10^0 base -->
    <line x1="320" y1="270" x2="400" y2="270" stroke="#1a202c" stroke-width="2" />
    <text x="170" y="274" text-anchor="middle" font-weight="700" fill="#1a202c">— · (none)</text>
    <text x="360" y="274" text-anchor="middle" font-weight="700">10⁰</text>
    <text x="550" y="274" text-anchor="middle" fill="#4a5568">a 1 m human-scale ruler</text>

    <!-- milli m 10^-3 -->
    <line x1="340" y1="304" x2="380" y2="304" stroke="#2b6cb0" stroke-width="2" />
    <text x="170" y="308" text-anchor="middle" font-weight="700" fill="#2b6cb0">milli · m</text>
    <text x="360" y="308" text-anchor="middle" font-weight="700">10⁻³</text>
    <text x="550" y="308" text-anchor="middle" fill="#4a5568">a 1 mm pencil-tip ball</text>

    <!-- micro μ 10^-6 -->
    <line x1="340" y1="338" x2="380" y2="338" stroke="#2b6cb0" stroke-width="2" />
    <text x="170" y="342" text-anchor="middle" font-weight="700" fill="#2b6cb0">micro · μ</text>
    <text x="360" y="342" text-anchor="middle" font-weight="700">10⁻⁶</text>
    <text x="550" y="342" text-anchor="middle" fill="#4a5568">a red blood cell ~ 8 μm</text>

    <!-- nano / pico / femto: stacked at bottom row 372 -->
    <text x="170" y="372" text-anchor="middle" font-weight="700" fill="#2b6cb0">nano · n  (10⁻⁹)</text>
    <text x="360" y="372" text-anchor="middle" font-style="italic" fill="#4a5568">·  pico · p  (10⁻¹²)  ·</text>
    <text x="550" y="372" text-anchor="middle" font-weight="700" fill="#2b6cb0">femto · f  (10⁻¹⁵)</text>
  </g>
</svg>
