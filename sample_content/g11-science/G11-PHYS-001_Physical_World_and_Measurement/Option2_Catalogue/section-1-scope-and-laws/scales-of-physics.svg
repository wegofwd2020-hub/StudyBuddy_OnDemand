<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Scales of Physics from Planck length to observable universe">
  <title>Scales of Physics</title>
  <desc>A logarithmic axis from 10^-35 m (Planck length) to 10^26 m (observable universe), with milestone scales — proton, atom, virus, human, Earth, Sun, galaxy — labelled along the way.</desc>

  <text x="380" y="26" font-family="system-ui" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">The Scales of Physics — from the Planck length to the observable universe</text>
  <text x="380" y="46" font-family="system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">a single set of physical laws, applied across 61 orders of magnitude</text>

  <!-- Axis -->
  <line x1="40" y1="200" x2="720" y2="200" stroke="#1a202c" stroke-width="1.5" />
  <!-- Axis tick marks at every 10 powers (61 powers, span 680 px ≈ 11.15 px per power) -->
  <!-- Powers: -35, -30, -25, ..., 25 -->
  <g font-family="system-ui" font-size="10" fill="#4a5568" text-anchor="middle">
    <line x1="40"  y1="195" x2="40"  y2="205" stroke="#1a202c" stroke-width="1" /><text x="40"  y="220">10⁻³⁵</text>
    <line x1="96"  y1="195" x2="96"  y2="205" stroke="#1a202c" stroke-width="1" /><text x="96"  y="220">10⁻³⁰</text>
    <line x1="151" y1="195" x2="151" y2="205" stroke="#1a202c" stroke-width="1" /><text x="151" y="220">10⁻²⁵</text>
    <line x1="207" y1="195" x2="207" y2="205" stroke="#1a202c" stroke-width="1" /><text x="207" y="220">10⁻²⁰</text>
    <line x1="263" y1="195" x2="263" y2="205" stroke="#1a202c" stroke-width="1" /><text x="263" y="220">10⁻¹⁵</text>
    <line x1="318" y1="195" x2="318" y2="205" stroke="#1a202c" stroke-width="1" /><text x="318" y="220">10⁻¹⁰</text>
    <line x1="374" y1="195" x2="374" y2="205" stroke="#1a202c" stroke-width="1" /><text x="374" y="220">10⁻⁵</text>
    <line x1="430" y1="195" x2="430" y2="205" stroke="#1a202c" stroke-width="1" /><text x="430" y="220">10⁰</text>
    <line x1="485" y1="195" x2="485" y2="205" stroke="#1a202c" stroke-width="1" /><text x="485" y="220">10⁵</text>
    <line x1="541" y1="195" x2="541" y2="205" stroke="#1a202c" stroke-width="1" /><text x="541" y="220">10¹⁰</text>
    <line x1="597" y1="195" x2="597" y2="205" stroke="#1a202c" stroke-width="1" /><text x="597" y="220">10¹⁵</text>
    <line x1="652" y1="195" x2="652" y2="205" stroke="#1a202c" stroke-width="1" /><text x="652" y="220">10²⁰</text>
    <line x1="708" y1="195" x2="708" y2="205" stroke="#1a202c" stroke-width="1" /><text x="708" y="220">10²⁵</text>
  </g>
  <text x="380" y="244" font-family="system-ui" font-size="11" font-weight="600" fill="#4a5568" text-anchor="middle">size in metres (log scale)</text>

  <!-- Domain bands (above axis) -->
  <!-- Quantum band: 10^-35 to 10^-9 -->
  <rect x="40"  y="78" width="291" height="22" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1" />
  <text x="186" y="93" font-family="system-ui" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="middle">Quantum domain</text>
  <!-- Classical band: 10^-9 to 10^7 -->
  <rect x="343" y="78" width="186" height="22" fill="#fef3c7" stroke="#dd6b20" stroke-width="1" />
  <text x="436" y="93" font-family="system-ui" font-size="11" font-weight="700" fill="#dd6b20" text-anchor="middle">Classical domain</text>
  <!-- Relativistic / cosmological band: 10^7 to 10^26 -->
  <rect x="540" y="78" width="180" height="22" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1" />
  <text x="630" y="93" font-family="system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">Cosmological / relativistic</text>

  <!-- Milestones (below axis), with vertical tick + label.
       Position formula: x = 40 + (power+35) * 11.15 -->
  <g font-family="system-ui" font-size="10" fill="#1a202c">
    <!-- Planck length 1.6e-35 m -->
    <line x1="44"  y1="186" x2="44"  y2="172" stroke="#7c3aed" stroke-width="1.5" />
    <circle cx="44"  cy="170" r="3" fill="#7c3aed" />
    <text x="44"  y="158" text-anchor="middle" fill="#7c3aed" font-weight="600">Planck length</text>
    <text x="44"  y="146" text-anchor="middle" fill="#4a5568">10⁻³⁵ m</text>

    <!-- Proton ~1e-15 m -->
    <line x1="263" y1="186" x2="263" y2="172" stroke="#2b6cb0" stroke-width="1.5" />
    <circle cx="263" cy="170" r="3" fill="#2b6cb0" />
    <text x="263" y="158" text-anchor="middle" fill="#2b6cb0" font-weight="600">proton</text>
    <text x="263" y="146" text-anchor="middle" fill="#4a5568">10⁻¹⁵ m</text>

    <!-- Atom 1e-10 m -->
    <line x1="318" y1="186" x2="318" y2="120" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="318" cy="118" r="3" fill="#2b6cb0" />
    <text x="318" y="116" text-anchor="middle" fill="#2b6cb0" font-weight="600" dy="-4">atom</text>
    <text x="318" y="116" text-anchor="middle" fill="#4a5568" dy="-16">10⁻¹⁰ m</text>

    <!-- Virus 1e-7 m -->
    <line x1="352" y1="186" x2="352" y2="172" stroke="#15803d" stroke-width="1.5" />
    <circle cx="352" cy="170" r="3" fill="#15803d" />
    <text x="352" y="158" text-anchor="middle" fill="#15803d" font-weight="600">virus</text>
    <text x="352" y="146" text-anchor="middle" fill="#4a5568">10⁻⁷ m</text>

    <!-- Human 1 m (10^0) -->
    <line x1="430" y1="186" x2="430" y2="120" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="430" cy="118" r="3" fill="#dd6b20" />
    <text x="430" y="116" text-anchor="middle" fill="#dd6b20" font-weight="600" dy="-4">human</text>
    <text x="430" y="116" text-anchor="middle" fill="#4a5568" dy="-16">1 m</text>

    <!-- Earth 6.4e6 m -->
    <line x1="500" y1="186" x2="500" y2="172" stroke="#dd6b20" stroke-width="1.5" />
    <circle cx="500" cy="170" r="3" fill="#dd6b20" />
    <text x="500" y="158" text-anchor="middle" fill="#dd6b20" font-weight="600">Earth (R)</text>
    <text x="500" y="146" text-anchor="middle" fill="#4a5568">6.4 × 10⁶ m</text>

    <!-- Sun 7e8 m -->
    <line x1="525" y1="186" x2="525" y2="120" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="525" cy="118" r="3" fill="#dd6b20" />
    <text x="525" y="116" text-anchor="middle" fill="#dd6b20" font-weight="600" dy="-4">Sun (R)</text>
    <text x="525" y="116" text-anchor="middle" fill="#4a5568" dy="-16">7 × 10⁸ m</text>

    <!-- Solar system 1e13 m -->
    <line x1="585" y1="186" x2="585" y2="172" stroke="#7c3aed" stroke-width="1.5" />
    <circle cx="585" cy="170" r="3" fill="#7c3aed" />
    <text x="585" y="158" text-anchor="middle" fill="#7c3aed" font-weight="600">solar system</text>
    <text x="585" y="146" text-anchor="middle" fill="#4a5568">10¹³ m</text>

    <!-- Galaxy 1e21 m -->
    <line x1="664" y1="186" x2="664" y2="172" stroke="#7c3aed" stroke-width="1.5" />
    <circle cx="664" cy="170" r="3" fill="#7c3aed" />
    <text x="664" y="158" text-anchor="middle" fill="#7c3aed" font-weight="600">Milky Way</text>
    <text x="664" y="146" text-anchor="middle" fill="#4a5568">10²¹ m</text>

    <!-- Observable universe 8.8e26 m -->
    <line x1="719" y1="186" x2="719" y2="120" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="719" cy="118" r="3" fill="#7c3aed" />
    <text x="700" y="116" text-anchor="end" fill="#7c3aed" font-weight="600" dy="-4">observable universe</text>
    <text x="700" y="116" text-anchor="end" fill="#4a5568" dy="-16">8.8 × 10²⁶ m</text>
  </g>

  <!-- Footer note -->
  <text x="380" y="288" font-family="system-ui" font-size="12" font-weight="600" fill="#1a202c" text-anchor="middle">
    Same physics across the chart — different effective theories at different scales.
  </text>
  <text x="380" y="308" font-family="system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">
    Quantum mechanics dominates the left band; Newtonian / classical the middle; general relativity the right.
  </text>
  <text x="380" y="326" font-family="system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">
    Unification of all three remains one of the open frontiers of physics.
  </text>
</svg>
