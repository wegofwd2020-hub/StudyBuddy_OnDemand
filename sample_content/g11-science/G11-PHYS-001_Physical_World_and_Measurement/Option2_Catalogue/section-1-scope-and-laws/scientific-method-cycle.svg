<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="Scientific method cycle">
  <title>The scientific method as a cycle</title>
  <desc>A circular flow showing observation, question, hypothesis, prediction, experiment, analysis feeding back to refined observation. Each node has a one-line example from physics.</desc>

  <text x="280" y="24" font-family="system-ui" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">The Scientific Method — a self-correcting cycle</text>
  <text x="280" y="44" font-family="system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">a hypothesis survives only as long as it agrees with new measurements</text>

  <defs>
    <marker id="cyclearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- Six nodes around a circle, centre (280, 210), radius 130 -->
  <!-- Position formula: cx = 280 + 130*cos(theta), cy = 210 + 130*sin(theta).
       theta = -90 + i*60 deg for i=0..5 -->
  <!-- 1. Observation:  theta = -90 → (280, 80)        -->
  <!-- 2. Question:     theta = -30 → (392.6, 145)     -->
  <!-- 3. Hypothesis:   theta = +30 → (392.6, 275)     -->
  <!-- 4. Prediction:   theta = +90 → (280, 340)       -->
  <!-- 5. Experiment:   theta = +150→ (167.4, 275)     -->
  <!-- 6. Analysis:     theta = +210→ (167.4, 145)     -->

  <g font-family="system-ui">
    <!-- Node 1 -->
    <circle cx="280" cy="100" r="46" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2" />
    <text x="280" y="98" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Observation</text>
    <text x="280" y="116" font-size="10" fill="#4a5568" text-anchor="middle">Mercury's orbit shifts</text>

    <!-- Node 2 -->
    <circle cx="403" cy="160" r="46" fill="#fef3c7" stroke="#dd6b20" stroke-width="2" />
    <text x="403" y="158" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Question</text>
    <text x="403" y="176" font-size="10" fill="#4a5568" text-anchor="middle">why does it precess?</text>

    <!-- Node 3 -->
    <circle cx="403" cy="280" r="46" fill="#e9d5ff" stroke="#7c3aed" stroke-width="2" />
    <text x="403" y="278" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Hypothesis</text>
    <text x="403" y="296" font-size="10" fill="#4a5568" text-anchor="middle">spacetime curves</text>

    <!-- Node 4 -->
    <circle cx="280" cy="340" r="46" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
    <text x="280" y="338" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Prediction</text>
    <text x="280" y="356" font-size="10" fill="#4a5568" text-anchor="middle">light bends near Sun</text>

    <!-- Node 5 -->
    <circle cx="157" cy="280" r="46" fill="#fed7aa" stroke="#dd6b20" stroke-width="2" />
    <text x="157" y="278" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Experiment</text>
    <text x="157" y="296" font-size="10" fill="#4a5568" text-anchor="middle">1919 eclipse</text>

    <!-- Node 6 -->
    <circle cx="157" cy="160" r="46" fill="#cffafe" stroke="#0891b2" stroke-width="2" />
    <text x="157" y="158" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Analysis</text>
    <text x="157" y="176" font-size="10" fill="#4a5568" text-anchor="middle">deflection ≈ 1.75″</text>
  </g>

  <!-- Arrows connecting in cycle -->
  <!-- 1 -> 2 -->
  <path d="M 320 116 A 130 130 0 0 1 363 144" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#cyclearrow)" />
  <!-- 2 -> 3 -->
  <path d="M 403 206 A 130 130 0 0 1 403 234" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#cyclearrow)" />
  <!-- 3 -> 4 -->
  <path d="M 363 296 A 130 130 0 0 1 320 324" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#cyclearrow)" />
  <!-- 4 -> 5 -->
  <path d="M 240 324 A 130 130 0 0 1 197 296" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#cyclearrow)" />
  <!-- 5 -> 6 -->
  <path d="M 157 234 A 130 130 0 0 1 157 206" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#cyclearrow)" />
  <!-- 6 -> 1 -->
  <path d="M 197 144 A 130 130 0 0 1 240 116" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#cyclearrow)" />

  <!-- Centre note -->
  <text x="280" y="208" font-family="system-ui" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">refine,</text>
  <text x="280" y="224" font-family="system-ui" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">repeat</text>
</svg>
