<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Combustion of methane — balanced reaction with energy release">
  <title>Combustion of Methane — CH₄ + 2 O₂ → CO₂ + 2 H₂O</title>
  <desc>Complete combustion of methane. One molecule of methane reacts with two molecules of oxygen to give one molecule of carbon dioxide and two molecules of water. ΔH = −890 kJ/mol (highly exothermic). Atom counts balance: 1 C left and right; 4 H left (in CH4) = 4 H right (2 × H2O); 4 O left (2 × O2) = 2 + 2 = 4 O right.</desc>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Combustion of Methane — Complete Oxidation</text>
  <text x="360" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Strong C–H, C–C bonds break; very strong C=O, O–H bonds form → energy out</text>

  <defs>
    <marker id="rxn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c" />
    </marker>
    <radialGradient id="flame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
  </defs>

  <!-- LEFT (reactants): CH4 + 2 O2 -->
  <!-- CH4 -->
  <g transform="translate(80 180)">
    <circle cx="0" cy="0" r="22" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <!-- 4 H tetrahedrally projected -->
    <line x1="0" y1="-22" x2="0" y2="-50" stroke="#1a202c" stroke-width="2"/>
    <circle cx="0" cy="-62" r="10" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <text x="0" y="-58" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <line x1="0" y1="22" x2="0" y2="50" stroke="#1a202c" stroke-width="2"/>
    <circle cx="0" cy="62" r="10" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <text x="0" y="66" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <line x1="-22" y1="0" x2="-50" y2="0" stroke="#1a202c" stroke-width="2"/>
    <circle cx="-62" cy="0" r="10" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <text x="-62" y="4" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <line x1="22" y1="0" x2="50" y2="0" stroke="#1a202c" stroke-width="2"/>
    <circle cx="62" cy="0" r="10" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <text x="62" y="4" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="0" y="100" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">CH₄</text>
    <text x="0" y="116" font-size="9" fill="#4a5568" text-anchor="middle">methane</text>
  </g>

  <text x="180" y="184" font-size="22" font-weight="700" fill="#1a202c" text-anchor="middle">+</text>

  <!-- 2 O2 -->
  <g transform="translate(240 140)">
    <text x="-22" y="-30" font-size="13" font-weight="700" fill="#dc2626">2</text>
    <circle cx="0" cy="0" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="0" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text>
    <circle cx="36" cy="0" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="36" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text>
    <line x1="14" y1="-5" x2="22" y2="-5" stroke="#1a202c" stroke-width="2"/>
    <line x1="14" y1="5" x2="22" y2="5" stroke="#1a202c" stroke-width="2"/>
  </g>
  <g transform="translate(240 220)">
    <circle cx="0" cy="0" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="0" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text>
    <circle cx="36" cy="0" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="36" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text>
    <line x1="14" y1="-5" x2="22" y2="-5" stroke="#1a202c" stroke-width="2"/>
    <line x1="14" y1="5" x2="22" y2="5" stroke="#1a202c" stroke-width="2"/>
  </g>
  <text x="258" y="270" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">2 × O₂</text>
  <text x="258" y="286" font-size="9" fill="#4a5568" text-anchor="middle">oxygen</text>

  <!-- Reaction arrow with flame icon -->
  <line x1="324" y1="180" x2="412" y2="180" stroke="#1a202c" stroke-width="2.5" marker-end="url(#rxn-arrow)" />
  <ellipse cx="368" cy="156" rx="22" ry="14" fill="url(#flame)" stroke="none"/>
  <text x="368" y="160" font-size="9" font-weight="700" fill="#7c2d12" text-anchor="middle">spark</text>
  <text x="368" y="200" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">ΔH = −890 kJ/mol</text>

  <!-- RIGHT (products): CO2 + 2 H2O -->
  <!-- CO2 -->
  <g transform="translate(490 180)">
    <circle cx="-30" cy="0" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="-30" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text>
    <circle cx="0" cy="0" r="22" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="30" cy="0" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="30" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text>
    <!-- two double bonds -->
    <line x1="-22" y1="-5" x2="-15" y2="-5" stroke="#1a202c" stroke-width="2"/>
    <line x1="-22" y1="5" x2="-15" y2="5" stroke="#1a202c" stroke-width="2"/>
    <line x1="15" y1="-5" x2="22" y2="-5" stroke="#1a202c" stroke-width="2"/>
    <line x1="15" y1="5" x2="22" y2="5" stroke="#1a202c" stroke-width="2"/>
    <text x="0" y="38" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">CO₂</text>
    <text x="0" y="54" font-size="9" fill="#4a5568" text-anchor="middle">carbon dioxide</text>
  </g>

  <text x="580" y="184" font-size="22" font-weight="700" fill="#1a202c" text-anchor="middle">+</text>

  <!-- 2 H2O -->
  <g transform="translate(640 145)">
    <text x="-32" y="6" font-size="13" font-weight="700" fill="#1d4ed8">2</text>
    <circle cx="-14" cy="0" r="10" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <text x="-14" y="4" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <circle cx="14" cy="0" r="14" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="14" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text>
    <circle cx="42" cy="0" r="10" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <text x="42" y="4" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <line x1="-4" y1="0" x2="0" y2="0" stroke="#1a202c" stroke-width="1.5"/>
    <line x1="28" y1="0" x2="32" y2="0" stroke="#1a202c" stroke-width="1.5"/>
  </g>
  <g transform="translate(640 215)">
    <circle cx="-14" cy="0" r="10" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <text x="-14" y="4" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <circle cx="14" cy="0" r="14" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="14" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text>
    <circle cx="42" cy="0" r="10" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <text x="42" y="4" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <line x1="-4" y1="0" x2="0" y2="0" stroke="#1a202c" stroke-width="1.5"/>
    <line x1="28" y1="0" x2="32" y2="0" stroke="#1a202c" stroke-width="1.5"/>
  </g>
  <text x="654" y="260" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">2 × H₂O</text>
  <text x="654" y="276" font-size="9" fill="#4a5568" text-anchor="middle">water</text>

  <!-- Equation -->
  <rect x="40" y="304" width="640" height="44" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
  <text x="360" y="324" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">CH₄ (g) + 2 O₂ (g) → CO₂ (g) + 2 H₂O (l)     ΔH° = −890 kJ/mol</text>
  <text x="360" y="342" font-size="10" font-style="italic" fill="#475569" text-anchor="middle">Atom balance — C: 1 ≡ 1 · H: 4 ≡ 4 · O: 4 ≡ 4 ✓ · highly exothermic (used as natural-gas fuel)</text>
</svg>
