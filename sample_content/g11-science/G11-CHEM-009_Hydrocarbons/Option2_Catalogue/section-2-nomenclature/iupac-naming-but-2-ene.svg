<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="IUPAC naming of but-2-ene — locating the double bond">
  <title>IUPAC Naming — but-2-ene</title>
  <desc>Naming CH3-CH=CH-CH3. The parent chain is 4 carbons (butane → butene because of the C=C). Number to give the double bond the lowest locant: 1-2-3-4 places the C=C between C-2 and C-3 (locant 2). The IUPAC name is but-2-ene. Wrong numbering (4-3-2-1) would give but-2-ene as well by symmetry, but the standard rule is the smallest first-point-of-difference locant.</desc>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">IUPAC Naming — but-2-ene</text>
  <text x="360" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Locating a double bond: lowest locant rule applies to the C=C, not just substituents.</text>

  <!-- Step 1 — chain & double bond -->
  <rect x="20" y="60" width="680" height="150" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="360" y="80" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Step 1 — Identify the longest chain that includes the C=C</text>

  <g transform="translate(160 140)">
    <circle cx="0" cy="0" r="16" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="0" y="4" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="80" cy="0" r="16" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="80" y="4" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="160" cy="0" r="16" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="160" y="4" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="240" cy="0" r="16" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="240" y="4" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <!-- single bond 1-2 -->
    <line x1="16" y1="0" x2="64" y2="0" stroke="#1a202c" stroke-width="2.5"/>
    <!-- double bond 2-3 -->
    <line x1="96" y1="-5" x2="144" y2="-5" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="96" y1="5" x2="144" y2="5" stroke="#dc2626" stroke-width="2.5"/>
    <!-- single bond 3-4 -->
    <line x1="176" y1="0" x2="224" y2="0" stroke="#1a202c" stroke-width="2.5"/>
    <!-- numbers -->
    <text x="0" y="38" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">1</text>
    <text x="80" y="38" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">2</text>
    <text x="160" y="38" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">3</text>
    <text x="240" y="38" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">4</text>
    <!-- H labels -->
    <text x="0" y="-26" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">H₃C</text>
    <text x="80" y="-26" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">CH</text>
    <text x="160" y="-26" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">CH</text>
    <text x="240" y="-26" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">CH₃</text>
    <text x="120" y="-22" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">C=C</text>
  </g>

  <!-- Step 2 — locant rule -->
  <rect x="20" y="226" width="320" height="118" rx="8" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
  <text x="180" y="246" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Step 2 — Lowest locant for C=C</text>
  <text x="180" y="272" font-size="11" fill="#1a202c" text-anchor="middle">Number 1→4: C=C between 2 and 3 → locant <tspan font-weight="700">2</tspan></text>
  <text x="180" y="294" font-size="11" fill="#1a202c" text-anchor="middle">Number 4→1: C=C between 3 and 2 → locant <tspan font-weight="700">2</tspan></text>
  <text x="180" y="320" font-size="10" font-style="italic" fill="#475569" text-anchor="middle">Symmetric here — both give "2". Always use lower of the two carbons.</text>

  <!-- Step 3 — assemble -->
  <rect x="360" y="226" width="340" height="118" rx="8" fill="#fff" stroke="#7e22ce" stroke-width="2"/>
  <text x="530" y="246" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">Step 3 — Assemble</text>
  <text x="530" y="280" font-size="22" font-weight="700" fill="#1a202c" text-anchor="middle">but-2-ene</text>
  <text x="530" y="300" font-size="11" fill="#4a5568" text-anchor="middle">parent: but- (4C) · suffix: -ene (C=C)</text>
  <text x="530" y="318" font-size="11" fill="#4a5568" text-anchor="middle">locant inserted before suffix: 2</text>

  <text x="360" y="370" font-size="11" font-style="italic" fill="#475569" text-anchor="middle">For alkynes, replace -ene with -yne (e.g. ethyne HC≡CH; pent-2-yne CH₃-C≡C-CH₂-CH₃).</text>
</svg>
