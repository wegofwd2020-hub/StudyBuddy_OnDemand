<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="IUPAC naming of 2-methylpropane — step-by-step">
  <title>IUPAC Naming Walkthrough — 2-methylpropane</title>
  <desc>Step-by-step naming of (CH3)3CH. Step 1: identify the longest continuous carbon chain (3 carbons → propane). Step 2: number the chain to give the substituent the lowest locant (numbering from either end gives the methyl at C-2). Step 3: name and locate substituents (one methyl group at C-2). Step 4: assemble the IUPAC name as 2-methylpropane.</desc>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">IUPAC Naming — 2-Methylpropane (isobutane)</text>
  <text x="360" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Four steps: longest chain → number → substituents → assemble</text>

  <!-- Step 1 — Skeleton (top-left) -->
  <rect x="20" y="60" width="320" height="140" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="180" y="80" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Step 1 — Find the longest chain</text>

  <!-- Carbon skeleton drawing: 3-C chain horizontal + 1 branch -->
  <g transform="translate(80 130)">
    <!-- 3 carbons in a row -->
    <circle cx="0" cy="0" r="14" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="0" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="60" cy="0" r="14" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="60" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="120" cy="0" r="14" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="120" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <line x1="14" y1="0" x2="46" y2="0" stroke="#1a202c" stroke-width="2.5"/>
    <line x1="74" y1="0" x2="106" y2="0" stroke="#1a202c" stroke-width="2.5"/>
    <!-- branch up from middle C -->
    <line x1="60" y1="-14" x2="60" y2="-44" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="60" cy="-58" r="14" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="60" y="-54" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <text x="60" y="-78" font-size="10" fill="#dc2626" text-anchor="middle">CH₃ branch</text>
    <!-- highlight main chain -->
    <rect x="-22" y="-22" width="164" height="44" rx="22" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="60" y="46" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">main chain: 3 C → propane</text>
  </g>

  <!-- Step 2 — Numbering (top-right) -->
  <rect x="360" y="60" width="340" height="140" rx="8" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
  <text x="530" y="80" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Step 2 — Number to lowest locant</text>

  <g transform="translate(420 130)">
    <!-- 3 carbons -->
    <circle cx="0" cy="0" r="14" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="0" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="60" cy="0" r="14" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="60" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="120" cy="0" r="14" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
    <text x="120" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <line x1="14" y1="0" x2="46" y2="0" stroke="#1a202c" stroke-width="2.5"/>
    <line x1="74" y1="0" x2="106" y2="0" stroke="#1a202c" stroke-width="2.5"/>
    <line x1="60" y1="-14" x2="60" y2="-44" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="60" cy="-58" r="14" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="60" y="-54" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <!-- numbers 1,2,3 -->
    <text x="0" y="32" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">1</text>
    <text x="60" y="32" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">2</text>
    <text x="120" y="32" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">3</text>
    <text x="60" y="56" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">methyl at C-2 (either way)</text>
  </g>

  <!-- Step 3 — Substituents (bottom-left) -->
  <rect x="20" y="220" width="320" height="120" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
  <text x="180" y="240" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Step 3 — Identify substituents</text>
  <text x="180" y="270" font-size="11" fill="#1a202c" text-anchor="middle">1 × CH₃ group → "methyl"</text>
  <text x="180" y="292" font-size="11" fill="#1a202c" text-anchor="middle">attached to carbon number → 2</text>
  <text x="180" y="316" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">prefix: "2-methyl-"</text>

  <!-- Step 4 — Assemble (bottom-right) -->
  <rect x="360" y="220" width="340" height="120" rx="8" fill="#fff" stroke="#7e22ce" stroke-width="2"/>
  <text x="530" y="240" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">Step 4 — Assemble the name</text>
  <text x="530" y="276" font-size="22" font-weight="700" fill="#1a202c" text-anchor="middle">2-methylpropane</text>
  <text x="530" y="300" font-size="11" fill="#4a5568" text-anchor="middle">[locant]-[substituent][parent]</text>
  <text x="530" y="320" font-size="10" font-style="italic" fill="#475569" text-anchor="middle">(common name: isobutane — not IUPAC)</text>

  <text x="360" y="365" font-size="11" font-style="italic" fill="#475569" text-anchor="middle">Lowest-locant rule: choose the numbering that gives the lower set of substituent positions.</text>
</svg>
