<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Overview of isomerism types — structural and stereo">
  <title>Types of Isomerism — Overview</title>
  <desc>Tree diagram of isomerism in hydrocarbons. Top: isomers (same molecular formula, different structure). Branch 1: structural isomers — chain (different carbon skeleton), position (functional group at different position), and functional-group (different functional group, less common in pure hydrocarbons). Branch 2: stereoisomers — geometric (cis/trans, requires C=C) and optical (chiral centre with four different substituents, requires stereocentre).</desc>

  <defs>
    <marker id="iso-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Types of Isomerism in Hydrocarbons</text>
  <text x="360" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Same molecular formula · different molecules</text>

  <!-- ROOT -->
  <rect x="280" y="56" width="160" height="44" rx="8" fill="#1e3a8a" stroke="#0f172a" stroke-width="1.5" />
  <text x="360" y="76" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">ISOMERISM</text>
  <text x="360" y="92" font-size="9" fill="#cbd5e1" text-anchor="middle">same C and H count, different layout</text>

  <!-- 2 main branches -->
  <line x1="360" y1="100" x2="180" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#iso-arrow)" />
  <line x1="360" y1="100" x2="540" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#iso-arrow)" />

  <rect x="100" y="142" width="160" height="42" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5" />
  <text x="180" y="162" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Structural</text>
  <text x="180" y="176" font-size="9" fill="#1e3a8a" text-anchor="middle">different connectivity</text>

  <rect x="460" y="142" width="160" height="42" rx="8" fill="#fde68a" stroke="#92400e" stroke-width="1.5" />
  <text x="540" y="162" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Stereo</text>
  <text x="540" y="176" font-size="9" fill="#92400e" text-anchor="middle">same connectivity, diff. 3-D</text>

  <!-- Structural sub-branches -->
  <line x1="180" y1="184" x2="80" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#iso-arrow)" />
  <line x1="180" y1="184" x2="180" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#iso-arrow)" />
  <line x1="180" y1="184" x2="280" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#iso-arrow)" />

  <rect x="20" y="226" width="120" height="60" rx="8" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="80" y="246" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Chain</text>
  <text x="80" y="262" font-size="9" fill="#1a202c" text-anchor="middle">diff. C skeleton</text>
  <text x="80" y="278" font-size="9" fill="#4a5568" text-anchor="middle">e.g. n- vs iso-pentane</text>

  <rect x="120" y="226" width="120" height="60" rx="8" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="180" y="246" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Position</text>
  <text x="180" y="262" font-size="9" fill="#1a202c" text-anchor="middle">diff. C=C location</text>
  <text x="180" y="278" font-size="9" fill="#4a5568" text-anchor="middle">e.g. but-1-ene vs but-2-ene</text>

  <rect x="220" y="226" width="120" height="60" rx="8" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="280" y="246" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Functional</text>
  <text x="280" y="262" font-size="9" fill="#1a202c" text-anchor="middle">alkene vs cycloalkane</text>
  <text x="280" y="278" font-size="9" fill="#4a5568" text-anchor="middle">e.g. C₃H₆: propene/cycloprop.</text>

  <!-- Stereo sub-branches -->
  <line x1="540" y1="184" x2="460" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#iso-arrow)" />
  <line x1="540" y1="184" x2="620" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#iso-arrow)" />

  <rect x="380" y="226" width="160" height="80" rx="8" fill="#fff" stroke="#92400e" stroke-width="1.5"/>
  <text x="460" y="246" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Geometric (cis–trans)</text>
  <text x="460" y="262" font-size="9" fill="#1a202c" text-anchor="middle">restricted rotation around C=C</text>
  <text x="460" y="278" font-size="9" fill="#4a5568" text-anchor="middle">requires 2 different groups on</text>
  <text x="460" y="294" font-size="9" fill="#4a5568" text-anchor="middle">EACH double-bond carbon</text>

  <rect x="540" y="226" width="160" height="80" rx="8" fill="#fff" stroke="#92400e" stroke-width="1.5"/>
  <text x="620" y="246" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Optical (chiral)</text>
  <text x="620" y="262" font-size="9" fill="#1a202c" text-anchor="middle">non-superimposable mirror image</text>
  <text x="620" y="278" font-size="9" fill="#4a5568" text-anchor="middle">requires 4 different groups on</text>
  <text x="620" y="294" font-size="9" fill="#4a5568" text-anchor="middle">a single sp³ carbon (stereocentre)</text>

  <!-- Footer -->
  <rect x="40" y="324" width="640" height="42" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
  <text x="360" y="344" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Quick test</text>
  <text x="360" y="360" font-size="10" fill="#1a202c" text-anchor="middle">Same atoms? → isomer. Different bonds? → structural. Same bonds, different orientation? → stereo.</text>
</svg>
