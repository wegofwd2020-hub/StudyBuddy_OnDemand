<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Saturated vs unsaturated hydrocarbons — ethane, ethene, ethyne">
  <title>Saturated vs Unsaturated — Ethane, Ethene, Ethyne</title>
  <desc>Three two-carbon hydrocarbons drawn as Lewis-style line structures. Ethane (C2H6, single bond, saturated). Ethene (C2H4, double bond, unsaturated). Ethyne (C2H2, triple bond, unsaturated). Bond order rises; H count drops by 2 each step.</desc>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Saturated → Unsaturated: bond order vs H count</text>
  <text x="360" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Each extra π-bond removes two hydrogens — same C₂ skeleton, three molecules.</text>

  <!-- Three column dividers -->
  <line x1="240" y1="60" x2="240" y2="320" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="480" y1="60" x2="480" y2="320" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ETHANE (left): C2H6, single bond -->
  <text x="120" y="80" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Ethane (C₂H₆)</text>
  <text x="120" y="98" font-size="10" fill="#15803d" text-anchor="middle">Saturated · single C–C bond</text>

  <!-- C atoms -->
  <circle cx="80" cy="170" r="20" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
  <text x="80" y="174" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">C</text>
  <circle cx="160" cy="170" r="20" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
  <text x="160" y="174" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">C</text>
  <!-- single bond -->
  <line x1="100" y1="170" x2="140" y2="170" stroke="#1a202c" stroke-width="3" />
  <!-- H atoms — each C has 3 -->
  <g font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">
    <circle cx="50" cy="130" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="50" y="134">H</text>
    <circle cx="50" cy="170" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="50" y="174">H</text>
    <circle cx="50" cy="210" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="50" y="214">H</text>
    <circle cx="190" cy="130" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="190" y="134">H</text>
    <circle cx="190" cy="170" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="190" y="174">H</text>
    <circle cx="190" cy="210" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="190" y="214">H</text>
  </g>
  <!-- bonds to H -->
  <line x1="61" y1="138" x2="71" y2="156" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="60" y1="170" x2="60" y2="170" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="61" y1="170" x2="69" y2="170" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="61" y1="202" x2="71" y2="184" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="179" y1="138" x2="169" y2="156" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="179" y1="170" x2="171" y2="170" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="179" y1="202" x2="169" y2="184" stroke="#1a202c" stroke-width="1.5"/>

  <text x="120" y="270" font-size="11" fill="#1a202c" text-anchor="middle">H₃C–CH₃</text>
  <text x="120" y="288" font-size="10" fill="#15803d" text-anchor="middle">all sp³ · 109.5° angles</text>
  <text x="120" y="304" font-size="10" fill="#4a5568" text-anchor="middle">Reactivity: low — needs ignition</text>

  <!-- ETHENE (middle): C2H4, double bond -->
  <text x="360" y="80" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">Ethene (C₂H₄)</text>
  <text x="360" y="98" font-size="10" fill="#b91c1c" text-anchor="middle">Unsaturated · C=C double bond</text>

  <circle cx="320" cy="170" r="20" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
  <text x="320" y="174" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">C</text>
  <circle cx="400" cy="170" r="20" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
  <text x="400" y="174" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">C</text>
  <!-- double bond — two parallel lines -->
  <line x1="340" y1="164" x2="380" y2="164" stroke="#1a202c" stroke-width="3"/>
  <line x1="340" y1="176" x2="380" y2="176" stroke="#1a202c" stroke-width="3"/>
  <!-- 2 H per C -->
  <g font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">
    <circle cx="290" cy="140" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="290" y="144">H</text>
    <circle cx="290" cy="200" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="290" y="204">H</text>
    <circle cx="430" cy="140" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="430" y="144">H</text>
    <circle cx="430" cy="200" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="430" y="204">H</text>
  </g>
  <line x1="299" y1="148" x2="309" y2="158" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="299" y1="192" x2="309" y2="182" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="421" y1="148" x2="411" y2="158" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="421" y1="192" x2="411" y2="182" stroke="#1a202c" stroke-width="1.5"/>

  <text x="360" y="270" font-size="11" fill="#1a202c" text-anchor="middle">H₂C=CH₂</text>
  <text x="360" y="288" font-size="10" fill="#b91c1c" text-anchor="middle">all sp² · 120° angles · planar</text>
  <text x="360" y="304" font-size="10" fill="#4a5568" text-anchor="middle">Reactivity: high — π electrons add</text>

  <!-- ETHYNE (right): C2H2, triple bond -->
  <text x="600" y="80" font-size="13" font-weight="700" fill="#7e22ce" text-anchor="middle">Ethyne (C₂H₂)</text>
  <text x="600" y="98" font-size="10" fill="#7e22ce" text-anchor="middle">Unsaturated · C≡C triple bond</text>

  <circle cx="560" cy="170" r="20" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
  <text x="560" y="174" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">C</text>
  <circle cx="640" cy="170" r="20" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
  <text x="640" y="174" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">C</text>
  <!-- triple bond — three parallel lines -->
  <line x1="580" y1="160" x2="620" y2="160" stroke="#1a202c" stroke-width="3"/>
  <line x1="580" y1="170" x2="620" y2="170" stroke="#1a202c" stroke-width="3"/>
  <line x1="580" y1="180" x2="620" y2="180" stroke="#1a202c" stroke-width="3"/>
  <!-- 1 H per C — linear -->
  <g font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">
    <circle cx="525" cy="170" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="525" y="174">H</text>
    <circle cx="675" cy="170" r="11" fill="#fde68a" stroke="#92400e" stroke-width="1"/><text x="675" y="174">H</text>
  </g>
  <line x1="536" y1="170" x2="540" y2="170" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="660" y1="170" x2="664" y2="170" stroke="#1a202c" stroke-width="1.5"/>

  <text x="600" y="270" font-size="11" fill="#1a202c" text-anchor="middle">HC≡CH</text>
  <text x="600" y="288" font-size="10" fill="#7e22ce" text-anchor="middle">both sp · 180° angles · linear</text>
  <text x="600" y="304" font-size="10" fill="#4a5568" text-anchor="middle">Reactivity: very high — 2 π-bonds</text>

  <text x="360" y="340" font-size="11" font-style="italic" fill="#475569" text-anchor="middle">"Saturated" = no more H can be added; "unsaturated" = π-bonds can add H₂, X₂, HX, H₂O.</text>
</svg>
