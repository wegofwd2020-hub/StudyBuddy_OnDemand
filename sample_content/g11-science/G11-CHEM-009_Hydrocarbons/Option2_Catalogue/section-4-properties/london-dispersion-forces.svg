<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="London dispersion forces between two hydrocarbon chains">
  <title>London Dispersion — Why Hydrocarbons Stick Together</title>
  <desc>Two pentane molecules drawn as zigzag chains. Random electron motion creates a transient dipole on one chain, which induces an opposite dipole on the neighbour. The two transient dipoles attract — this is the London dispersion force. Longer or less branched chains have more surface contact area, so more induced-dipole interactions, hence higher boiling points.</desc>

  <defs>
    <marker id="ldf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7e22ce" />
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">London Dispersion — The Only Force Holding Alkanes Together</text>
  <text x="360" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Transient dipole on chain A induces an opposite dipole on chain B → instant attraction</text>

  <!-- Chain A (top) — pentane zigzag -->
  <g transform="translate(120 130)">
    <text x="200" y="-30" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Pentane molecule A</text>
    <!-- 5 C's in zigzag, each with H labels -->
    <g>
      <circle cx="0" cy="0" r="14" fill="#1f2937"/><text x="0" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
      <circle cx="80" cy="-30" r="14" fill="#1f2937"/><text x="80" y="-26" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
      <circle cx="160" cy="0" r="14" fill="#1f2937"/><text x="160" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
      <circle cx="240" cy="-30" r="14" fill="#1f2937"/><text x="240" y="-26" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
      <circle cx="320" cy="0" r="14" fill="#1f2937"/><text x="320" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
      <line x1="13" y1="-5" x2="67" y2="-25" stroke="#1a202c" stroke-width="2"/>
      <line x1="93" y1="-25" x2="147" y2="-5" stroke="#1a202c" stroke-width="2"/>
      <line x1="173" y1="-5" x2="227" y2="-25" stroke="#1a202c" stroke-width="2"/>
      <line x1="253" y1="-25" x2="307" y2="-5" stroke="#1a202c" stroke-width="2"/>
    </g>
    <!-- transient dipole pattern: δ- left, δ+ right -->
    <text x="-30" y="6" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">δ⁻</text>
    <text x="350" y="6" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">δ⁺</text>
    <!-- electron cloud bubble -->
    <ellipse cx="40" cy="-15" rx="60" ry="25" fill="rgba(220, 38, 38, 0.15)" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="40" y="-50" font-size="10" font-style="italic" fill="#dc2626" text-anchor="middle">e⁻ pile-up (instant)</text>
  </g>

  <!-- Vertical "induce" arrows -->
  <g transform="translate(160 200)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#7e22ce" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ldf-arrow)"/>
    <text x="-32" y="22" font-size="10" font-weight="700" fill="#7e22ce">induces</text>
  </g>
  <g transform="translate(440 200)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#7e22ce" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ldf-arrow)"/>
    <text x="14" y="22" font-size="10" font-weight="700" fill="#7e22ce">induces</text>
  </g>

  <!-- Chain B (bottom) — opposite dipole -->
  <g transform="translate(120 280)">
    <text x="200" y="40" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Pentane molecule B (induced dipole)</text>
    <g>
      <circle cx="0" cy="0" r="14" fill="#1f2937"/><text x="0" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
      <circle cx="80" cy="-30" r="14" fill="#1f2937"/><text x="80" y="-26" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
      <circle cx="160" cy="0" r="14" fill="#1f2937"/><text x="160" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
      <circle cx="240" cy="-30" r="14" fill="#1f2937"/><text x="240" y="-26" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
      <circle cx="320" cy="0" r="14" fill="#1f2937"/><text x="320" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
      <line x1="13" y1="-5" x2="67" y2="-25" stroke="#1a202c" stroke-width="2"/>
      <line x1="93" y1="-25" x2="147" y2="-5" stroke="#1a202c" stroke-width="2"/>
      <line x1="173" y1="-5" x2="227" y2="-25" stroke="#1a202c" stroke-width="2"/>
      <line x1="253" y1="-25" x2="307" y2="-5" stroke="#1a202c" stroke-width="2"/>
    </g>
    <!-- opposite dipole: δ+ left, δ- right -->
    <text x="-30" y="6" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">δ⁺</text>
    <text x="350" y="6" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">δ⁻</text>
    <ellipse cx="280" cy="-15" rx="60" ry="25" fill="rgba(220, 38, 38, 0.15)" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 2"/>
  </g>

  <!-- Footer note -->
  <rect x="40" y="346" width="640" height="28" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
  <text x="360" y="365" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">More C's, less branching, more surface contact = stronger LDF = higher b.p.</text>
</svg>
