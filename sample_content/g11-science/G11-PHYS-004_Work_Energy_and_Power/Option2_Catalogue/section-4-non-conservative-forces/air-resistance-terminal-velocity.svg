<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Air resistance and terminal velocity — falling skydiver reaching balance">
  <title>Air Resistance and Terminal Velocity</title>
  <desc>Left: a skydiver falls. Initially weight (mg) far exceeds drag, so the skydiver accelerates. As speed grows, drag F_drag rises until it equals weight; then net force is zero and the skydiver falls at a constant terminal velocity. Right: speed-versus-time curve approaches a horizontal asymptote at v_terminal ≈ 53 m/s for a typical 75 kg skydiver in belly-flat position.</desc>

  <defs>
    <marker id="we-tv-arr-W" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="we-tv-arr-D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
  </defs>

  <text x="300" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Air resistance grows with speed.   Terminal velocity = where drag balances weight.</text>

  <!-- ─── Left column: three free-body snapshots ─── -->
  <g>
    <!-- Snapshot 1: just released — only mg, almost no drag -->
    <text x="100" y="60" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Just released</text>
    <text x="100" y="76" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">v small</text>
    <circle cx="100" cy="115" r="14" fill="#fef9c3" stroke="#1a202c" stroke-width="1.4" />
    <text x="100" y="119" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">m</text>
    <line x1="100" y1="129" x2="100" y2="180" stroke="#dc2626" stroke-width="3" marker-end="url(#we-tv-arr-W)" />
    <text x="115" y="160" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626">mg</text>
    <line x1="100" y1="100" x2="100" y2="92" stroke="#2b6cb0" stroke-width="2.4" marker-end="url(#we-tv-arr-D)" />
    <text x="115" y="100" font="11px system-ui" font-size="11" font-weight="700" fill="#2b6cb0">F_drag</text>
    <text x="100" y="200" font="11px system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">a ≈ g</text>

    <!-- Snapshot 2: half-way — drag growing -->
    <text x="100" y="226" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Speeding up</text>
    <text x="100" y="242" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">v moderate</text>
    <circle cx="100" cy="280" r="14" fill="#fef9c3" stroke="#1a202c" stroke-width="1.4" />
    <text x="100" y="284" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">m</text>
    <line x1="100" y1="294" x2="100" y2="334" stroke="#dc2626" stroke-width="3" marker-end="url(#we-tv-arr-W)" />
    <text x="115" y="320" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626">mg</text>
    <line x1="100" y1="266" x2="100" y2="240" stroke="#2b6cb0" stroke-width="2.8" marker-end="url(#we-tv-arr-D)" />
    <text x="115" y="252" font="11px system-ui" font-size="11" font-weight="700" fill="#2b6cb0">F_drag ↑</text>
    <text x="100" y="350" font="11px system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">a < g</text>
  </g>

  <!-- Snapshot 3 (centred above the plot region) -->
  <g>
    <text x="220" y="60" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Terminal velocity</text>
    <text x="220" y="76" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">v = v_terminal</text>
    <circle cx="220" cy="115" r="14" fill="#fef9c3" stroke="#1a202c" stroke-width="1.4" />
    <text x="220" y="119" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">m</text>
    <line x1="220" y1="129" x2="220" y2="180" stroke="#dc2626" stroke-width="3" marker-end="url(#we-tv-arr-W)" />
    <text x="235" y="160" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626">mg</text>
    <line x1="220" y1="100" x2="220" y2="49" stroke="#2b6cb0" stroke-width="3" marker-end="url(#we-tv-arr-D)" />
    <text x="235" y="74" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0">F_drag = mg</text>
    <text x="220" y="200" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">a = 0    →   constant v</text>
  </g>

  <!-- ─── Right side: v(t) plot approaching v_terminal ─── -->
  <!-- Plot area: t in [0, 12] s mapped to [320, 580]; v in [0, 60] m/s mapped to [320, 90] -->
  <rect x="320" y="220" width="260" height="120" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Wait — let's instead position the plot at top-right so the snapshots sit below.
       Restart the right block with proper positioning: plot at (320, 230) → (580, 350) -->
  <rect x="320" y="220" width="260" height="120" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- x grid every 2 s. 260 px / 12 s = 21.67 px/s -->
  <line x1="320" y1="220" x2="320" y2="340" stroke="#94a3b8" stroke-width="1.2" />
  <text x="320" y="354" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0</text>
  <line x1="363.33" y1="220" x2="363.33" y2="340" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="363.33" y="354" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">2</text>
  <line x1="406.67" y1="220" x2="406.67" y2="340" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="406.67" y="354" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">4</text>
  <line x1="450" y1="220" x2="450" y2="340" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="450" y="354" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">6</text>
  <line x1="493.33" y1="220" x2="493.33" y2="340" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="493.33" y="354" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">8</text>
  <line x1="536.67" y1="220" x2="536.67" y2="340" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="536.67" y="354" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">10</text>
  <line x1="580" y1="220" x2="580" y2="340" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="580" y="354" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">12</text>

  <!-- y grid every 20 m/s, range 0..60. y px range 340..220 (120 px / 60 m/s = 2 px / m/s). -->
  <line x1="320" y1="340" x2="580" y2="340" stroke="#94a3b8" stroke-width="1.2" />
  <text x="314" y="344" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">0</text>
  <line x1="320" y1="300" x2="580" y2="300" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="314" y="304" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">20</text>
  <line x1="320" y1="260" x2="580" y2="260" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="314" y="264" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">40</text>
  <line x1="320" y1="220" x2="580" y2="220" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="314" y="224" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">60</text>

  <!-- Asymptote at v_term = 53 m/s, y = 340 - 53*2 = 234 -->
  <line x1="320" y1="234" x2="580" y2="234" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" />
  <text x="575" y="228" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end">v_terminal ≈ 53 m/s</text>

  <!-- v(t) approach curve: v(t) = vT (1 − e^{-t/τ}) with vT=53, τ=2.5 s
       Sample points (t, v): (0,0) (0.5, 9.6) (1, 17.5) (1.5, 24.0) (2, 29.4) (2.5, 33.5) (3, 36.9) (4, 42.3) (5, 45.8) (6, 48.0) (7, 49.4) (8, 50.4) (9, 51.0) (10, 51.5) (11, 51.8) (12, 52.1)
       Px: x = 320 + t*21.67, y = 340 - v*2 -->
  <polyline points="320,340 330.83,320.8 341.67,305.0 352.5,292.0 363.33,281.2 374.17,273.0 385,266.2 406.67,255.4 428.33,248.4 450,244.0 471.67,241.2 493.33,239.2 515,238.0 536.67,237.0 558.33,236.4 580,235.8"
            fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Axis labels -->
  <text x="450" y="370" font="12px system-ui" font-size="12" font-weight="600" fill="#1a202c" text-anchor="middle">t  (s)</text>
  <text x="290" y="280" font="12px system-ui" font-size="12" font-weight="600" fill="#1a202c" text-anchor="middle" transform="rotate(-90 290 280)">v  (m/s)</text>

  <!-- Title for plot -->
  <text x="450" y="212" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Speed approaches a horizontal asymptote</text>
</svg>
