<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Friction dissipation energy bar chart — kinetic energy converts to heat">
  <title>Friction dissipates KE as thermal energy</title>
  <desc>A block sliding on a rough surface starts with 100 J of kinetic energy. As it slides 5 m, friction does negative work and the block stops. The bar chart on the right shows kinetic energy decreasing from 100 J to 0 J while thermal energy rises from 0 J to 100 J. Total mechanical-plus-thermal energy is conserved.</desc>

  <text x="320" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Friction converts kinetic energy into heat — energy is conserved overall</text>
  <text x="320" y="40" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Block: m = 4 kg, initial v = 7.07 m/s → KE₀ = ½ · 4 · 7.07² ≈ 100 J;  μ_k = 0.51, d = 5 m, so f · d = 100 J.</text>

  <!-- ─── Left side: block + friction scenario ─── -->
  <g>
    <text x="160" y="80" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Sliding block on rough floor</text>

    <!-- Floor with hatching -->
    <line x1="40" y1="220" x2="320" y2="220" stroke="#94a3b8" stroke-width="1.5" />
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="60" y1="220" x2="52" y2="232" />
      <line x1="100" y1="220" x2="92" y2="232" />
      <line x1="140" y1="220" x2="132" y2="232" />
      <line x1="180" y1="220" x2="172" y2="232" />
      <line x1="220" y1="220" x2="212" y2="232" />
      <line x1="260" y1="220" x2="252" y2="232" />
      <line x1="300" y1="220" x2="292" y2="232" />
    </g>

    <!-- Initial block (left), bright -->
    <rect x="60" y="180" width="40" height="40" fill="#bee3f8" stroke="#1a202c" stroke-width="1.5" />
    <text x="80" y="205" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">m</text>
    <text x="80" y="248" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">start: v₀</text>

    <!-- Final block (right), faded — at rest -->
    <rect x="240" y="180" width="40" height="40" fill="#bee3f8" stroke="#1a202c" stroke-width="1.2" opacity="0.45" />
    <text x="260" y="205" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">m</text>
    <text x="260" y="248" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">end: v = 0</text>

    <!-- Displacement arrow -->
    <line x1="100" y1="262" x2="240" y2="262" stroke="#7c3aed" stroke-width="2.4" />
    <polygon points="240,262 232,258 232,266" fill="#7c3aed" />
    <text x="170" y="278" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">d = 5 m</text>

    <!-- Friction arrow on bottom-left of block (anti-parallel to motion) -->
    <line x1="100" y1="200" x2="60" y2="200" stroke="#dc2626" stroke-width="2.6" />
    <polygon points="60,200 68,196 68,204" fill="#dc2626" />
    <text x="50" y="196" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end">f</text>

    <!-- Heat radiating squiggles from path -->
    <g stroke="#dd6b20" stroke-width="1.4" fill="none" opacity="0.8">
      <path d="M 130 195 q 3 -6 0 -12 q -3 -6 0 -12" />
      <path d="M 165 195 q 3 -6 0 -12 q -3 -6 0 -12" />
      <path d="M 200 195 q 3 -6 0 -12 q -3 -6 0 -12" />
      <path d="M 235 195 q 3 -6 0 -12 q -3 -6 0 -12" />
    </g>
    <text x="180" y="166" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dd6b20" text-anchor="middle">heat to surface + air</text>

    <!-- Equation card -->
    <rect x="40" y="290" width="270" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" />
    <text x="175" y="308" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">W_friction = − f · d = − 100 J</text>
    <text x="175" y="328" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">All KE has become thermal energy.</text>
  </g>

  <!-- ─── Right side: stacked energy bar at four time points ─── -->
  <g>
    <text x="500" y="80" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Energy distribution over time</text>

    <!-- Bar template: each bar 50 px wide, total height 200 px representing 100 J. y range 100..300. -->
    <!-- 4 bars at x = 365, 425, 485, 545. Each shows KE (blue) on top, Thermal (orange) below.
         Frame 0%:  KE 100, Thermal 0
         Frame 33%: KE 67,  Thermal 33
         Frame 67%: KE 33,  Thermal 67
         Frame 100%:KE 0,   Thermal 100
         Px height = J * 2  (200 px / 100 J)  -->

    <!-- Bar 1: t = 0 -->
    <rect x="365" y="100" width="50" height="200" fill="#bee3f8" stroke="#1a202c" stroke-width="1.2" />
    <text x="390" y="200" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">KE</text>
    <text x="390" y="216" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">100 J</text>
    <text x="390" y="316" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">t = 0</text>

    <!-- Bar 2: 33% -->
    <rect x="425" y="166" width="50" height="134" fill="#bee3f8" stroke="#1a202c" stroke-width="1.2" />
    <rect x="425" y="100" width="50" height="66" fill="#fed7aa" stroke="#1a202c" stroke-width="1.2" />
    <text x="450" y="138" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">heat</text>
    <text x="450" y="154" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">33 J</text>
    <text x="450" y="232" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">KE</text>
    <text x="450" y="248" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">67 J</text>
    <text x="450" y="316" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">⅓</text>

    <!-- Bar 3: 67% -->
    <rect x="485" y="234" width="50" height="66" fill="#bee3f8" stroke="#1a202c" stroke-width="1.2" />
    <rect x="485" y="100" width="50" height="134" fill="#fed7aa" stroke="#1a202c" stroke-width="1.2" />
    <text x="510" y="160" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">heat</text>
    <text x="510" y="178" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">67 J</text>
    <text x="510" y="262" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">KE</text>
    <text x="510" y="278" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">33 J</text>
    <text x="510" y="316" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">⅔</text>

    <!-- Bar 4: t = stop -->
    <rect x="545" y="100" width="50" height="200" fill="#fed7aa" stroke="#1a202c" stroke-width="1.2" />
    <text x="570" y="200" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">heat</text>
    <text x="570" y="216" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">100 J</text>
    <text x="570" y="316" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">stop</text>

    <!-- Total energy line -->
    <line x1="355" y1="100" x2="605" y2="100" stroke="#15803d" stroke-width="1.6" stroke-dasharray="4 3" />
    <text x="610" y="104" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d">100 J total</text>
  </g>
</svg>
