<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Elastic potential energy of a spring — U = one-half k x squared parabola">
  <title>Spring (Elastic) Potential Energy: U = ½ k x²</title>
  <desc>Top: a spring at natural length (x = 0), then compressed and stretched. Bottom: a parabolic plot of elastic potential energy U = ½ k x² for k = 200 N/m. The curve is symmetric — equal compressions and extensions store equal energy.</desc>

  <text x="300" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Elastic Potential Energy:  U = ½ k x²    (k = 200 N/m)</text>
  <text x="300" y="40" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">x is the displacement from the spring's natural length, in either direction.</text>

  <!-- ─── Top row: 3 spring states (compressed, natural, stretched) ─── -->
  <g>
    <!-- Wall left -->
    <rect x="40" y="60" width="10" height="60" fill="#94a3b8" />

    <!-- Compressed: x = -0.2 m -->
    <text x="120" y="55" font="11px system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">x = − 0.2 m</text>
    <path d="M 50 90 L 60 80 L 70 100 L 80 80 L 90 100 L 100 80 L 110 100 L 120 80 L 130 90 L 160 90"
          fill="none" stroke="#1a202c" stroke-width="1.6" />
    <rect x="160" y="76" width="28" height="28" fill="#bee3f8" stroke="#1a202c" stroke-width="1.4" />

    <text x="120" y="125" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">U = ½(200)(0.2)² = 4 J</text>
  </g>

  <g>
    <!-- Wall mid -->
    <rect x="240" y="60" width="10" height="60" fill="#94a3b8" />

    <!-- Natural length: x = 0 -->
    <text x="320" y="55" font="11px system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">x = 0  (natural)</text>
    <path d="M 250 90 L 264 80 L 278 100 L 292 80 L 306 100 L 320 80 L 334 100 L 348 80 L 362 90 L 380 90"
          fill="none" stroke="#1a202c" stroke-width="1.6" />
    <rect x="380" y="76" width="28" height="28" fill="#bee3f8" stroke="#1a202c" stroke-width="1.4" />

    <text x="320" y="125" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">U = 0 J</text>
  </g>

  <g>
    <!-- Wall right -->
    <rect x="430" y="60" width="10" height="60" fill="#94a3b8" />

    <!-- Stretched: x = +0.3 m -->
    <text x="520" y="55" font="11px system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">x = + 0.3 m</text>
    <path d="M 440 90 L 456 80 L 472 100 L 488 80 L 504 100 L 520 80 L 536 100 L 552 80 L 568 90 L 580 90"
          fill="none" stroke="#1a202c" stroke-width="1.6" />
    <rect x="580" y="76" width="14" height="28" fill="#bee3f8" stroke="#1a202c" stroke-width="1.4" />

    <text x="520" y="125" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">U = ½(200)(0.3)² = 9 J</text>
  </g>

  <!-- ─── Bottom: U(x) parabola plot ─── -->
  <!-- Plot area x in [-0.4, +0.4] m mapped to [80, 520]; y in [0, 16] J mapped to [330, 160] -->
  <rect x="80" y="160" width="440" height="170" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Vertical grid every 0.1 m: x=0.0 → 300, 0.1 → 355, 0.2 → 410, 0.3 → 465, 0.4 → 520; -0.1 → 245, etc.
       Px formula: 300 + x*550 -->
  <line x1="80" y1="160" x2="80" y2="330" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="80" y="346" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">−0.4</text>
  <line x1="135" y1="160" x2="135" y2="330" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="135" y="346" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">−0.3</text>
  <line x1="190" y1="160" x2="190" y2="330" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="190" y="346" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">−0.2</text>
  <line x1="245" y1="160" x2="245" y2="330" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="245" y="346" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">−0.1</text>
  <line x1="300" y1="160" x2="300" y2="330" stroke="#94a3b8" stroke-width="1.2" />
  <text x="300" y="346" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">0</text>
  <line x1="355" y1="160" x2="355" y2="330" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="355" y="346" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0.1</text>
  <line x1="410" y1="160" x2="410" y2="330" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="410" y="346" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0.2</text>
  <line x1="465" y1="160" x2="465" y2="330" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="465" y="346" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0.3</text>
  <line x1="520" y1="160" x2="520" y2="330" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="520" y="346" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0.4</text>

  <!-- Horizontal grid every 4 J  (y range 0..16 → 170 px range, 10.625 px per J) -->
  <line x1="80" y1="330" x2="520" y2="330" stroke="#94a3b8" stroke-width="1.2" />
  <text x="74" y="334" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">0</text>
  <line x1="80" y1="287.5" x2="520" y2="287.5" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="74" y="291.5" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">4</text>
  <line x1="80" y1="245" x2="520" y2="245" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="74" y="249" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">8</text>
  <line x1="80" y1="202.5" x2="520" y2="202.5" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="74" y="206.5" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">12</text>
  <line x1="80" y1="160" x2="520" y2="160" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="74" y="164" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">16</text>

  <!-- Axis labels -->
  <text x="300" y="358" font="13px system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle">x  (m)</text>
  <text x="48" y="245" font="13px system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle" transform="rotate(-90 48 245)">U  (J)</text>

  <!-- Parabola U(x) = 100 x² for x in [-0.4, +0.4]
       (k=200 → U=½·200·x² = 100 x²)
       Sample: x=-0.4→U=16, x=-0.3→9, x=-0.2→4, x=-0.1→1, x=0→0, x=0.1→1, x=0.2→4, x=0.3→9, x=0.4→16
       Px (x_px = 300 + x*550, y_px = 330 - U*10.625):
         (-0.4,16) → (80, 160)
         (-0.3,9)  → (135, 234.375)
         (-0.2,4)  → (190, 287.5)
         (-0.1,1)  → (245, 319.375)
         (0,0)     → (300, 330)
         (0.1,1)   → (355, 319.375)
         (0.2,4)   → (410, 287.5)
         (0.3,9)   → (465, 234.375)
         (0.4,16)  → (520, 160) -->
  <polyline points="80,160 135,234.375 190,287.5 245,319.375 300,330 355,319.375 410,287.5 465,234.375 520,160"
            fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Highlight points matching the spring states above -->
  <circle cx="190" cy="287.5" r="4" fill="#7c3aed" />
  <circle cx="300" cy="330" r="4" fill="#7c3aed" />
  <circle cx="465" cy="234.375" r="4" fill="#7c3aed" />

  <text x="190" y="276" font="11px system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">4 J</text>
  <text x="465" y="225" font="11px system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">9 J</text>
</svg>
