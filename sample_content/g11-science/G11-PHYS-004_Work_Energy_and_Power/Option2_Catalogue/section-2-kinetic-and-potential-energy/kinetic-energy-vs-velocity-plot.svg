<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" role="img" aria-label="Kinetic energy versus speed — parabolic plot for a 2 kg mass">
  <title>Kinetic Energy vs Speed:  KE = ½ m v²</title>
  <desc>Plot of kinetic energy against speed for a 2 kg mass. Because KE depends on v squared, the relationship is a parabola passing through the origin. Doubling the speed quadruples the kinetic energy.</desc>

  <!-- Plot area: x in [0, 10] m/s mapped to [60, 460]; y in [0, 100] J mapped to [310, 60] -->
  <rect x="60" y="60" width="400" height="250" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Vertical grid (every 1 m/s) -->
  <line x1="100"  y1="60" x2="100"  y2="310" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="100"  y="328" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">1</text>
  <line x1="140"  y1="60" x2="140"  y2="310" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="140"  y="328" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">2</text>
  <line x1="180"  y1="60" x2="180"  y2="310" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="180"  y="328" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">3</text>
  <line x1="220"  y1="60" x2="220"  y2="310" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="220"  y="328" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">4</text>
  <line x1="260"  y1="60" x2="260"  y2="310" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="260"  y="328" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">5</text>
  <line x1="300"  y1="60" x2="300"  y2="310" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="300"  y="328" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">6</text>
  <line x1="340"  y1="60" x2="340"  y2="310" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="340"  y="328" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">7</text>
  <line x1="380"  y1="60" x2="380"  y2="310" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="380"  y="328" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">8</text>
  <line x1="420"  y1="60" x2="420"  y2="310" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="420"  y="328" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">9</text>
  <line x1="460"  y1="60" x2="460"  y2="310" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="460"  y="328" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">10</text>
  <text x="60"   y="328" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0</text>

  <!-- Horizontal grid (every 20 J)  - y range 0..100 mapped 310..60, so ΔPx/ΔJ = 250/100 = 2.5 -->
  <line x1="60" y1="310" x2="460" y2="310" stroke="#94a3b8" stroke-width="1.2" />
  <text x="54" y="314" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">0</text>
  <line x1="60" y1="260" x2="460" y2="260" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="264" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">20</text>
  <line x1="60" y1="210" x2="460" y2="210" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="214" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">40</text>
  <line x1="60" y1="160" x2="460" y2="160" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="164" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">60</text>
  <line x1="60" y1="110" x2="460" y2="110" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="114" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">80</text>
  <line x1="60" y1="60"  x2="460" y2="60"  stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="64" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">100</text>

  <!-- Axes -->
  <line x1="60" y1="60" x2="60" y2="310" stroke="#94a3b8" stroke-width="1.2" />

  <!-- Axis labels -->
  <text x="260" y="350" font="13px system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle">v  (m/s)</text>
  <text x="22" y="185" font="13px system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle" transform="rotate(-90 22 185)">KE  (J)</text>

  <!-- Title -->
  <text x="260" y="32" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">KE = ½ m v²    (m = 2 kg)</text>
  <text x="260" y="50" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">KE = v²  (with m = 2 kg, ½ · 2 = 1, so KE numerically equals v²)</text>

  <!-- Parabola y = v² for v in [0, 10], 250 px per 100 J = 2.5 px/J.
       Sample points: v=0 KE=0; v=1 KE=1; v=2 KE=4; v=3 KE=9; v=4 KE=16; v=5 KE=25;
       v=6 KE=36; v=7 KE=49; v=8 KE=64; v=9 KE=81; v=10 KE=100.
       Px coords: x = 60 + v*40, y = 310 - KE*2.5
       (0,0)→(60,310)  (1,1)→(100,307.5)  (2,4)→(140,300)  (3,9)→(180,287.5)
       (4,16)→(220,270)  (5,25)→(260,247.5)  (6,36)→(300,220)  (7,49)→(340,187.5)
       (8,64)→(380,150)  (9,81)→(420,107.5)  (10,100)→(460,60) -->
  <polyline points="60,310 100,307.5 140,300 180,287.5 220,270 260,247.5 300,220 340,187.5 380,150 420,107.5 460,60"
            fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Highlight points: v=2, v=4, v=6, v=8 -->
  <circle cx="140" cy="300" r="4" fill="#7c3aed" />
  <text x="148" y="296" font="11px system-ui" font-size="11" font-weight="600" fill="#7c3aed">v = 2 → KE = 4 J</text>

  <circle cx="220" cy="270" r="4" fill="#7c3aed" />
  <text x="228" y="266" font="11px system-ui" font-size="11" font-weight="600" fill="#7c3aed">v = 4 → KE = 16 J</text>

  <circle cx="300" cy="220" r="4" fill="#7c3aed" />
  <text x="308" y="216" font="11px system-ui" font-size="11" font-weight="600" fill="#7c3aed">v = 6 → KE = 36 J</text>

  <circle cx="380" cy="150" r="4" fill="#7c3aed" />
  <text x="388" y="146" font="11px system-ui" font-size="11" font-weight="600" fill="#7c3aed">v = 8 → KE = 64 J</text>

  <!-- Footnote: doubling v quadruples KE -->
  <text x="260" y="345" font="11px system-ui" font-size="11" font-style="italic" fill="#15803d" text-anchor="middle" font-weight="700">Double v ⇒ KE × 4.   KE grows quadratically — speed matters more than mass.</text>
</svg>
