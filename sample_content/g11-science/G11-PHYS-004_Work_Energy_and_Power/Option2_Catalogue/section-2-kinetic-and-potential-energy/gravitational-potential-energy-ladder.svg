<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Gravitational potential energy ladder — PE = mgh at three heights">
  <title>Gravitational PE = m g h — height ladder</title>
  <desc>A 2 kg ball is shown at three heights above the ground (1 m, 3 m, and 5 m). At each height, the gravitational potential energy PE = m g h is computed using g ≈ 9.8 m/s². PE rises linearly with height. Height is measured from the chosen reference level — the ground.</desc>

  <text x="300" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Gravitational Potential Energy:  PE = m g h    (m = 2 kg,  g = 9.8 m/s²)</text>
  <text x="300" y="40" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">PE depends on height above a chosen reference (here, the ground at h = 0).</text>

  <!-- Ground (reference level) -->
  <line x1="60" y1="320" x2="540" y2="320" stroke="#1a202c" stroke-width="2" />
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="80" y1="320" x2="72" y2="332" />
    <line x1="120" y1="320" x2="112" y2="332" />
    <line x1="160" y1="320" x2="152" y2="332" />
    <line x1="200" y1="320" x2="192" y2="332" />
    <line x1="240" y1="320" x2="232" y2="332" />
    <line x1="280" y1="320" x2="272" y2="332" />
    <line x1="320" y1="320" x2="312" y2="332" />
    <line x1="360" y1="320" x2="352" y2="332" />
    <line x1="400" y1="320" x2="392" y2="332" />
    <line x1="440" y1="320" x2="432" y2="332" />
    <line x1="480" y1="320" x2="472" y2="332" />
    <line x1="520" y1="320" x2="512" y2="332" />
  </g>
  <text x="50" y="324" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="end">h = 0</text>
  <text x="50" y="338" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="end">reference</text>

  <!-- Height marks: 1 m → y=270; 3 m → y=170; 5 m → y=70  (50 px per metre) -->
  <line x1="60" y1="270" x2="540" y2="270" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="4 4" />
  <text x="50" y="274" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="end">h = 1 m</text>

  <line x1="60" y1="170" x2="540" y2="170" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="4 4" />
  <text x="50" y="174" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="end">h = 3 m</text>

  <line x1="60" y1="70" x2="540" y2="70" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="4 4" />
  <text x="50" y="74" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="end">h = 5 m</text>

  <!-- Vertical reference axis on the right -->
  <line x1="540" y1="60" x2="540" y2="320" stroke="#94a3b8" stroke-width="1.2" />

  <!-- Ball 1: at h = 1 m -->
  <circle cx="180" cy="260" r="14" fill="#fef9c3" stroke="#1a202c" stroke-width="1.4" />
  <text x="180" y="264" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">m</text>
  <rect x="120" y="280" width="120" height="34" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2" />
  <text x="180" y="295" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">PE = 2 · 9.8 · 1</text>
  <text x="180" y="309" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">= 19.6 J</text>

  <!-- Ball 2: at h = 3 m -->
  <circle cx="320" cy="160" r="14" fill="#fef9c3" stroke="#1a202c" stroke-width="1.4" />
  <text x="320" y="164" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">m</text>
  <rect x="260" y="180" width="120" height="34" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2" />
  <text x="320" y="195" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">PE = 2 · 9.8 · 3</text>
  <text x="320" y="209" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">= 58.8 J</text>

  <!-- Ball 3: at h = 5 m -->
  <circle cx="460" cy="60" r="14" fill="#fef9c3" stroke="#1a202c" stroke-width="1.4" />
  <text x="460" y="64" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">m</text>
  <rect x="400" y="82" width="120" height="34" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2" />
  <text x="460" y="97" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">PE = 2 · 9.8 · 5</text>
  <text x="460" y="111" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">= 98 J</text>

  <!-- Annotation: linear scaling -->
  <text x="300" y="354" font="11px system-ui" font-size="11" font-style="italic" fill="#7c3aed" text-anchor="middle" font-weight="700">PE grows linearly with h.   Triple the height → triple the PE.</text>
</svg>
