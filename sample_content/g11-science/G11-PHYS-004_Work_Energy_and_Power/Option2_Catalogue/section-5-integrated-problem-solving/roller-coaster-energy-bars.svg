<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Roller coaster energy bar chart at four positions along the track">
  <title>Roller-Coaster Energy Conservation</title>
  <desc>A roller-coaster cart travels from A (top of the first hill at h = 40 m, at rest) over a dip B at h = 0, up a smaller hill C at h = 20 m, and finally down to D at h = 5 m. With friction neglected, total mechanical energy is constant; the bar chart at each position shows kinetic energy in blue and potential energy in green, summing to the same total.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Roller-coaster energy conservation (frictionless)   m = 500 kg,  g = 9.8 m/s²</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">KE + PE = constant.   At each point, KE is whatever's left after PE = m g h is taken out of the total.</text>

  <!-- Track profile: four key points
       A: top of first hill   (x = 80, h=40 m)   pixel y = 90
       B: bottom of dip       (x=240, h=0)       pixel y = 290
       C: top of second hill  (x=400, h=20 m)    pixel y = 190
       D: end                 (x=560, h=5 m)     pixel y = 265
       (px scale: 5 px / m of height, ground at y=290, so y = 290 − h*5) -->

  <!-- Ground / reference -->
  <line x1="40" y1="290" x2="690" y2="290" stroke="#1a202c" stroke-width="1.6" />
  <text x="36" y="294" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="end">h = 0</text>

  <!-- Track curve: smooth Bezier through A → B → C → D -->
  <path d="M 80 90 C 130 90 180 290 240 290 C 300 290 350 190 400 190 C 450 190 500 265 560 265 L 620 265"
        fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" />

  <!-- Carts at each marker -->
  <g>
    <rect x="68" y="78" width="24" height="14" fill="#dc2626" stroke="#1a202c" stroke-width="1.2" />
    <text x="80" y="68" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">A</text>
    <text x="80" y="56" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">h=40 m, v=0</text>
  </g>
  <g>
    <rect x="228" y="278" width="24" height="14" fill="#dc2626" stroke="#1a202c" stroke-width="1.2" />
    <text x="240" y="312" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">B</text>
    <text x="240" y="328" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">h=0, v_max</text>
  </g>
  <g>
    <rect x="388" y="178" width="24" height="14" fill="#dc2626" stroke="#1a202c" stroke-width="1.2" />
    <text x="400" y="168" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">C</text>
    <text x="400" y="156" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">h=20 m</text>
  </g>
  <g>
    <rect x="548" y="253" width="24" height="14" fill="#dc2626" stroke="#1a202c" stroke-width="1.2" />
    <text x="560" y="243" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">D</text>
    <text x="560" y="231" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">h=5 m</text>
  </g>

  <!-- ─── Energy bars below the track  ───
       Total energy E = m g h_A = 500 · 9.8 · 40 = 196 000 J = 196 kJ.
       At A: PE=196 kJ,  KE=0
       At B: PE=0,       KE=196 kJ
       At C: PE = 500·9.8·20 = 98 kJ,  KE = 196 − 98 = 98 kJ
       At D: PE = 500·9.8·5 = 24.5 kJ, KE = 196 − 24.5 = 171.5 kJ
       Bar height total 60 px = 196 kJ → 0.306 px/kJ -->
  <text x="360" y="358" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Energy bar at each position (KE blue + PE green, total constant)</text>

  <!-- Bar A at x=60..100 -->
  <rect x="60" y="320" width="40" height="60" fill="#15803d" stroke="#1a202c" stroke-width="1" />
  <text x="80" y="354" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">PE</text>
  <text x="80" y="368" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">196 kJ</text>
  <text x="80" y="392" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">A</text>

  <!-- Bar B at x=220..260: KE only -->
  <rect x="220" y="320" width="40" height="60" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" />
  <text x="240" y="354" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">KE</text>
  <text x="240" y="368" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">196 kJ</text>
  <text x="240" y="392" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">B</text>

  <!-- Bar C at x=380..420: PE 98 (30 px) on top, KE 98 (30 px) below.
       y top = 320 (start of bar). PE on top: y=320 → y=350 (30 px).  KE: y=350 → y=380. -->
  <rect x="380" y="320" width="40" height="30" fill="#15803d" stroke="#1a202c" stroke-width="1" />
  <rect x="380" y="350" width="40" height="30" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" />
  <text x="400" y="340" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">PE 98</text>
  <text x="400" y="370" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">KE 98</text>
  <text x="400" y="392" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">C</text>

  <!-- Bar D at x=540..580: PE 24.5 kJ → 7.5 px; KE 171.5 kJ → 52.5 px -->
  <rect x="540" y="320" width="40" height="7.5" fill="#15803d" stroke="#1a202c" stroke-width="1" />
  <rect x="540" y="327.5" width="40" height="52.5" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" />
  <text x="588" y="328" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#15803d">PE 24.5</text>
  <text x="560" y="357" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">KE</text>
  <text x="560" y="371" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">171.5 kJ</text>
  <text x="560" y="392" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">D</text>

  <!-- Total energy line -->
  <line x1="50" y1="320" x2="630" y2="320" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" />
  <text x="640" y="324" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626">E_total = 196 kJ</text>
</svg>
