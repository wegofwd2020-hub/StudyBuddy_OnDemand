<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Pendulum KE-PE energy swap at three positions">
  <title>Pendulum: KE ↔ PE swap during a swing</title>
  <desc>A simple pendulum is shown at three positions: the highest point on the right (turning point, all PE), the bottom of the swing (lowest point, all KE), and the highest point on the left (turning point, all PE again). Below each, an energy bar chart displays the KE and PE distribution. Mechanical energy is conserved: KE + PE has the same total at every point.</desc>

  <text x="300" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Pendulum:  KE ↔ PE swap (frictionless / no air drag)</text>
  <text x="300" y="40" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">m = 1 kg,  L = 1 m,  released from θ_max = 30° → height above lowest = 0.134 m → E_total ≈ 1.31 J.</text>

  <!-- Pivot point -->
  <circle cx="300" cy="80" r="5" fill="#1a202c" />
  <line x1="120" y1="74" x2="480" y2="74" stroke="#94a3b8" stroke-width="1.5" />
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="140" y1="74" x2="132" y2="84" />
    <line x1="180" y1="74" x2="172" y2="84" />
    <line x1="220" y1="74" x2="212" y2="84" />
    <line x1="260" y1="74" x2="252" y2="84" />
    <line x1="300" y1="74" x2="292" y2="84" />
    <line x1="340" y1="74" x2="332" y2="84" />
    <line x1="380" y1="74" x2="372" y2="84" />
    <line x1="420" y1="74" x2="412" y2="84" />
    <line x1="460" y1="74" x2="452" y2="84" />
  </g>

  <!-- ─── Three pendulum positions: left turning, bottom, right turning ───
       Pivot (300, 80). String length 150 px.  θ = 30° on each side (sin30=0.5, cos30=0.866).
       Bob positions:
         Right turning: (300 + 150·sin30, 80 + 150·cos30) = (375, 209.9)
         Bottom:        (300, 230)
         Left turning:  (225, 209.9) -->

  <!-- String left (faded) -->
  <line x1="300" y1="80" x2="225" y2="209.9" stroke="#1a202c" stroke-width="1.5" opacity="0.45" />
  <circle cx="225" cy="209.9" r="14" fill="#bee3f8" stroke="#1a202c" stroke-width="1.4" opacity="0.55" />

  <!-- String bottom (faded) -->
  <line x1="300" y1="80" x2="300" y2="230" stroke="#1a202c" stroke-width="1.5" opacity="0.45" />
  <circle cx="300" cy="230" r="14" fill="#bee3f8" stroke="#1a202c" stroke-width="1.4" opacity="0.55" />

  <!-- String right (active, bright) -->
  <line x1="300" y1="80" x2="375" y2="209.9" stroke="#1a202c" stroke-width="2" />
  <circle cx="375" cy="209.9" r="16" fill="#fef9c3" stroke="#1a202c" stroke-width="1.6" />
  <text x="375" y="214" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">m</text>

  <!-- Arc showing the swing path -->
  <path d="M 225 209.9 A 150 150 0 0 1 375 209.9" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" />

  <!-- Angle markers -->
  <path d="M 300 230 A 30 30 0 0 0 285 224.0" fill="none" stroke="#1a202c" stroke-width="1" />
  <text x="288" y="250" font="11px system-ui" font-size="11" font-style="italic" fill="#1a202c">θ</text>

  <!-- Position labels above each bob -->
  <text x="225" y="190" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Position 1</text>
  <text x="225" y="204" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">v = 0</text>

  <text x="300" y="210" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Position 2</text>
  <text x="300" y="224" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">v = v_max</text>

  <text x="375" y="190" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Position 3</text>
  <text x="375" y="204" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">v = 0</text>

  <!-- Reference height (lowest point) -->
  <line x1="200" y1="244" x2="400" y2="244" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="3 3" />
  <text x="200" y="248" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="end">h = 0</text>

  <!-- ─── Energy bar charts ─── -->
  <g>
    <text x="300" y="282" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Energy at each position (frictionless: total stays constant)</text>

    <!-- Bar template: 60 px wide, 50 px max height = 1.31 J full.  Position bars at y=290..340 -->

    <!-- Position 1 (left turn): all PE -->
    <rect x="195" y="290" width="60" height="50" fill="#15803d" stroke="#1a202c" stroke-width="1" />
    <text x="225" y="316" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">PE</text>
    <text x="225" y="330" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1.31 J</text>
    <text x="225" y="354" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">all PE</text>

    <!-- Position 2 (bottom): all KE -->
    <rect x="270" y="290" width="60" height="50" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" />
    <text x="300" y="316" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">KE</text>
    <text x="300" y="330" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1.31 J</text>
    <text x="300" y="354" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">all KE</text>

    <!-- Position 3 (right turn): all PE -->
    <rect x="345" y="290" width="60" height="50" fill="#15803d" stroke="#1a202c" stroke-width="1" />
    <text x="375" y="316" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">PE</text>
    <text x="375" y="330" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1.31 J</text>
    <text x="375" y="354" font="11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">all PE</text>

    <!-- Total line -->
    <line x1="180" y1="290" x2="430" y2="290" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" />
    <text x="438" y="294" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626">total 1.31 J</text>
  </g>

  <!-- Side equation card -->
  <rect x="450" y="290" width="140" height="60" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2" />
  <text x="520" y="307" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">v_max = √(2 g h)</text>
  <text x="520" y="324" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">= √(2·9.8·0.134)</text>
  <text x="520" y="341" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">≈ 1.62 m/s</text>
</svg>
