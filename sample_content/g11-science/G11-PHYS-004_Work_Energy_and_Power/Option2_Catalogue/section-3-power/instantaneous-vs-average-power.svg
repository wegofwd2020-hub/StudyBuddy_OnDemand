<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Instantaneous versus average power on a work-versus-time graph">
  <title>Instantaneous vs Average Power</title>
  <desc>A work-vs-time graph for an engine doing work non-uniformly. The total slope from t=0 to t=8 s gives the average power. The slope of the tangent at any single instant gives the instantaneous power. P_avg uses ΔW/Δt over the interval; P_inst uses dW/dt at a point.</desc>

  <text x="300" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Instantaneous vs Average Power on the W–t graph</text>
  <text x="300" y="40" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Slope of the W–t curve = power.   Average over an interval vs slope at one instant.</text>

  <!-- Plot area: t in [0, 8] s mapped to [80, 540]; W in [0, 1600] J mapped to [320, 70] -->
  <rect x="80" y="70" width="460" height="250" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Vertical grid every 1 s -->
  <line x1="80" y1="70" x2="80" y2="320" stroke="#94a3b8" stroke-width="1.2" />
  <text x="80" y="338" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0</text>
  <line x1="137.5" y1="70" x2="137.5" y2="320" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="137.5" y="338" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">1</text>
  <line x1="195" y1="70" x2="195" y2="320" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="195" y="338" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">2</text>
  <line x1="252.5" y1="70" x2="252.5" y2="320" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="252.5" y="338" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">3</text>
  <line x1="310" y1="70" x2="310" y2="320" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="310" y="338" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">4</text>
  <line x1="367.5" y1="70" x2="367.5" y2="320" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="367.5" y="338" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">5</text>
  <line x1="425" y1="70" x2="425" y2="320" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="425" y="338" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">6</text>
  <line x1="482.5" y1="70" x2="482.5" y2="320" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="482.5" y="338" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">7</text>
  <line x1="540" y1="70" x2="540" y2="320" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="540" y="338" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">8</text>

  <!-- Horizontal grid -->
  <line x1="80" y1="320" x2="540" y2="320" stroke="#94a3b8" stroke-width="1.2" />
  <text x="74" y="324" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">0</text>
  <line x1="80" y1="258.75" x2="540" y2="258.75" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="74" y="262.75" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">400</text>
  <line x1="80" y1="197.5" x2="540" y2="197.5" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="74" y="201.5" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">800</text>
  <line x1="80" y1="136.25" x2="540" y2="136.25" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="74" y="140.25" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">1200</text>
  <line x1="80" y1="75" x2="540" y2="75" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="74" y="79" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">1600</text>

  <!-- Axis labels -->
  <text x="310" y="358" font="13px system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle">t  (s)</text>
  <text x="44" y="195" font="13px system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle" transform="rotate(-90 44 195)">W  (J)</text>

  <!-- Curve W(t) — gentle then steep growth.  W(t) = 25 t² for t in [0, 8] gives W(8)=1600, smooth.
       Plot points (t, W) → px (x = 80 + t*57.5, y = 320 - W*0.15625):
       (0,0)→(80,320) (1,25)→(137.5, 316.09) (2,100)→(195,304.375) (3,225)→(252.5,284.84)
       (4,400)→(310,257.5) (5,625)→(367.5,222.34) (6,900)→(425,179.375) (7,1225)→(482.5,128.59) (8,1600)→(540,70) -->
  <polyline points="80,320 137.5,316.09 195,304.375 252.5,284.84 310,257.5 367.5,222.34 425,179.375 482.5,128.59 540,70"
            fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Average-power chord from (0,0) to (8,1600) — green dashed -->
  <line x1="80" y1="320" x2="540" y2="70" stroke="#15803d" stroke-width="2.4" stroke-dasharray="6 5" />
  <circle cx="80" cy="320" r="4" fill="#15803d" />
  <circle cx="540" cy="70" r="4" fill="#15803d" />
  <text x="540" y="62" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="end">Chord:  P_avg = ΔW/Δt = 1600/8 = 200 W</text>

  <!-- Tangent at t = 6 s.  W'(t) = 50 t → at t=6 dW/dt = 300 W.  W(6) = 900 J.
       Px point: (425, 179.375).  Tangent line through this point with slope dy/dx:
       In data: slope = 300 J/s.  Px slope = (300 J/s) * (-0.15625 px/J) / (1 px/s scaled = 57.5)
                                = -300 * 0.15625 / 57.5 px-per-px ≈ -0.815
       Draw segment from (375, 219.13) to (475, 137.625) — same px slope. -->
  <line x1="375" y1="219.13" x2="475" y2="137.625" stroke="#dc2626" stroke-width="2.4" />
  <circle cx="425" cy="179.375" r="4.5" fill="#dc2626" />
  <text x="430" y="178" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626">P_inst at t = 6 s</text>
  <text x="430" y="192" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626">= dW/dt = 300 W</text>

  <!-- Side legend -->
  <rect x="100" y="84" width="200" height="64" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1" />
  <text x="200" y="103" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">P_avg  =  ΔW / Δt   (chord)</text>
  <text x="200" y="123" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">P_inst =  dW/dt    (tangent)</text>
  <text x="200" y="141" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">P = F · v  for translational motion.</text>
</svg>
