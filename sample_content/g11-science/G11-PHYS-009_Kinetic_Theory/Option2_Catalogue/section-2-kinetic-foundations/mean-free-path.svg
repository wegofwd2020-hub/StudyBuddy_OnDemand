<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" role="img" aria-label="Mean Free Path Between Molecular Collisions">
  <title>Mean Free Path λ — Distance Between Collisions</title>
  <desc>Schematic showing one tracer molecule travelling through a gas with target molecules of diameter d. The tracer's straight-line path between collisions is the free path; averaging over many collisions gives the mean free path λ. The collision cylinder of radius d sweeps a volume π d squared v Δt; in time Δt the tracer encounters n times that volume worth of molecules. λ = 1 over (square root of 2 times pi d squared n) where n is number density.</desc>

  <text x="310" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Mean Free Path:  λ = 1 / (√2 · π d² · n)</text>

  <defs>
    <marker id="mfp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Outer container -->
  <rect x="40" y="50" width="380" height="220" fill="#f0f9ff" stroke="#1a202c" stroke-width="2" />

  <!-- Background target molecules (gray dots) -->
  <g fill="#94a3b8" stroke="#475569" stroke-width="0.8">
    <circle cx="80" cy="90" r="6" />
    <circle cx="155" cy="75" r="6" />
    <circle cx="240" cy="100" r="6" />
    <circle cx="315" cy="80" r="6" />
    <circle cx="385" cy="105" r="6" />
    <circle cx="105" cy="160" r="6" />
    <circle cx="200" cy="155" r="6" />
    <circle cx="275" cy="170" r="6" />
    <circle cx="350" cy="155" r="6" />
    <circle cx="135" cy="225" r="6" />
    <circle cx="220" cy="240" r="6" />
    <circle cx="305" cy="230" r="6" />
    <circle cx="385" cy="240" r="6" />
    <circle cx="65" cy="220" r="6" />
  </g>

  <!-- Tracer molecule path (red zigzag with each segment a free path) -->
  <!-- Path: start (60,200) → (130,170) → (200,200) → (270,160) → (330,205) → (400,180) -->
  <polyline points="60,200 130,170 200,200 270,160 330,205 400,180"
            fill="none" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round"
            stroke-dasharray="0" />

  <!-- Collision points (red dots) -->
  <circle cx="130" cy="170" r="4" fill="#dc2626" />
  <circle cx="200" cy="200" r="4" fill="#dc2626" />
  <circle cx="270" cy="160" r="4" fill="#dc2626" />
  <circle cx="330" cy="205" r="4" fill="#dc2626" />

  <!-- Tracer molecule -->
  <circle cx="60" cy="200" r="7" fill="#dc2626" stroke="#7c2d12" stroke-width="1.5" />
  <text x="46" y="218" font-size="10" font-weight="700" fill="#7c2d12">tracer</text>

  <!-- Final velocity arrow at end of path -->
  <line x1="395" y1="182" x2="408" y2="178" stroke="#dc2626" stroke-width="2.5" marker-end="url(#mfp-arr)" />

  <!-- Annotate one free path -->
  <line x1="135" y1="180" x2="195" y2="210" stroke="#15803d" stroke-width="1.2" stroke-dasharray="3 3" />
  <text x="155" y="205" font-size="11" font-weight="700" fill="#15803d">free path λᵢ</text>

  <!-- Collision-cylinder schematic (lower part, callout) -->
  <text x="80" y="296" font-size="10" font-weight="700" fill="#1a202c">collision-cylinder concept:</text>
  <line x1="200" y1="290" x2="380" y2="290" stroke="#1d4ed8" stroke-width="1.5" />
  <line x1="200" y1="300" x2="380" y2="300" stroke="#1d4ed8" stroke-width="1.5" />
  <ellipse cx="200" cy="295" rx="3" ry="5" fill="none" stroke="#1d4ed8" stroke-width="1.2" />
  <ellipse cx="380" cy="295" rx="3" ry="5" fill="none" stroke="#1d4ed8" stroke-width="1.2" />
  <text x="395" y="299" font-size="11" font-weight="700" fill="#1d4ed8">π d²·v·Δt</text>

  <!-- Right panel -->
  <rect x="440" y="50" width="160" height="220" rx="8" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="520" y="70" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Quick numbers</text>

  <text x="450" y="92" font-size="11" font-weight="700" fill="#1a202c">Air at 300 K, 1 atm</text>
  <text x="450" y="108" font-size="11" fill="#1a202c">d ≈ 0.37 nm</text>
  <text x="450" y="123" font-size="11" fill="#1a202c">n ≈ 2.4 × 10²⁵ /m³</text>
  <text x="450" y="138" font-size="11" font-weight="700" fill="#15803d">λ ≈ 70 nm</text>
  <text x="450" y="151" font-size="9" fill="#4a5568">≈ 200 × molecule size</text>

  <text x="450" y="180" font-size="11" font-weight="700" fill="#1a202c">Vacuum (10⁻⁶ Pa)</text>
  <text x="450" y="195" font-size="11" font-weight="700" fill="#15803d">λ ≈ 70 m</text>

  <text x="450" y="220" font-size="11" font-weight="700" fill="#1a202c">Collision rate</text>
  <text x="450" y="234" font-size="11" fill="#1a202c">f = ⟨v⟩ / λ</text>
  <text x="450" y="247" font-size="9" fill="#4a5568">≈ 7 × 10⁹ Hz at STP</text>

  <text x="310" y="312" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Between collisions a molecule moves in a straight line — but at STP each one collides about a billion times a second.</text>
</svg>
