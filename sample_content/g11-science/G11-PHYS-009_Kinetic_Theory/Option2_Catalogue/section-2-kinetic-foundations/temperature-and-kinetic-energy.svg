<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img" aria-label="Temperature and Average Translational Kinetic Energy">
  <title>Temperature is Average Translational Kinetic Energy</title>
  <desc>Two boxes of identical gas at different temperatures. The cool box has slow short velocity arrows; the hot box has fast long velocity arrows. The result panel shows that average translational kinetic energy per molecule equals three-halves k_B T, where k_B is the Boltzmann constant. RMS speed v_rms equals square root of three k_B T over m.</desc>

  <text x="310" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Temperature ↔ Average Kinetic Energy:  ½m⟨v²⟩ = ³⁄₂ k_B T</text>

  <defs>
    <marker id="tk-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="tk-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- ===== COLD BOX ===== -->
  <rect x="40" y="60" width="220" height="200" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
  <text x="150" y="80" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Cool gas  (T₁ = 200 K)</text>

  <!-- Slow molecules: short arrows -->
  <g>
    <circle cx="75" cy="120" r="4" fill="#1d4ed8" />
    <line x1="75" y1="120" x2="85" y2="115" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#tk-arr)" />

    <circle cx="135" cy="105" r="4" fill="#1d4ed8" />
    <line x1="135" y1="105" x2="142" y2="115" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#tk-arr)" />

    <circle cx="200" cy="130" r="4" fill="#1d4ed8" />
    <line x1="200" y1="130" x2="190" y2="138" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#tk-arr)" />

    <circle cx="100" cy="170" r="4" fill="#1d4ed8" />
    <line x1="100" y1="170" x2="108" y2="178" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#tk-arr)" />

    <circle cx="175" cy="180" r="4" fill="#1d4ed8" />
    <line x1="175" y1="180" x2="167" y2="172" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#tk-arr)" />

    <circle cx="225" cy="200" r="4" fill="#1d4ed8" />
    <line x1="225" y1="200" x2="234" y2="208" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#tk-arr)" />

    <circle cx="80" cy="220" r="4" fill="#1d4ed8" />
    <line x1="80" y1="220" x2="89" y2="213" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#tk-arr)" />

    <circle cx="155" cy="235" r="4" fill="#1d4ed8" />
    <line x1="155" y1="235" x2="148" y2="226" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#tk-arr)" />
  </g>

  <text x="150" y="278" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">slow molecules · low ⟨KE⟩</text>

  <!-- ===== HOT BOX ===== -->
  <rect x="290" y="60" width="220" height="200" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="400" y="80" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Hot gas  (T₂ = 800 K)</text>

  <!-- Fast molecules: long arrows -->
  <g>
    <circle cx="320" cy="115" r="4" fill="#dc2626" />
    <line x1="320" y1="115" x2="350" y2="105" stroke="#dc2626" stroke-width="1.8" marker-end="url(#tk-arr-r)" />

    <circle cx="395" cy="100" r="4" fill="#dc2626" />
    <line x1="395" y1="100" x2="370" y2="115" stroke="#dc2626" stroke-width="1.8" marker-end="url(#tk-arr-r)" />

    <circle cx="465" cy="120" r="4" fill="#dc2626" />
    <line x1="465" y1="120" x2="490" y2="100" stroke="#dc2626" stroke-width="1.8" marker-end="url(#tk-arr-r)" />

    <circle cx="345" cy="170" r="4" fill="#dc2626" />
    <line x1="345" y1="170" x2="320" y2="185" stroke="#dc2626" stroke-width="1.8" marker-end="url(#tk-arr-r)" />

    <circle cx="430" cy="160" r="4" fill="#dc2626" />
    <line x1="430" y1="160" x2="460" y2="175" stroke="#dc2626" stroke-width="1.8" marker-end="url(#tk-arr-r)" />

    <circle cx="380" cy="220" r="4" fill="#dc2626" />
    <line x1="380" y1="220" x2="410" y2="205" stroke="#dc2626" stroke-width="1.8" marker-end="url(#tk-arr-r)" />

    <circle cx="490" cy="210" r="4" fill="#dc2626" />
    <line x1="490" y1="210" x2="465" y2="225" stroke="#dc2626" stroke-width="1.8" marker-end="url(#tk-arr-r)" />

    <circle cx="320" cy="240" r="4" fill="#dc2626" />
    <line x1="320" y1="240" x2="345" y2="232" stroke="#dc2626" stroke-width="1.8" marker-end="url(#tk-arr-r)" />
  </g>

  <text x="400" y="278" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">fast molecules · high ⟨KE⟩</text>

  <!-- Bottom equation panel -->
  <rect x="40" y="290" width="540" height="55" rx="8" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="60" y="312" font-size="13" font-weight="700" fill="#1a202c">⟨KE_trans⟩ per molecule  =  ½m⟨v²⟩  =  ³⁄₂ k_B T</text>
  <text x="60" y="330" font-size="11" fill="#1a202c">k_B = 1.381 × 10⁻²³ J/K  (Boltzmann constant) ;  R = N_A · k_B</text>
  <text x="380" y="312" font-size="13" font-weight="700" fill="#dc2626">v_rms = √(3 k_B T / m)</text>
  <text x="380" y="330" font-size="10" font-style="italic" fill="#4a5568">RMS speed grows with √T, drops with √m.</text>
</svg>
