<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img" aria-label="Kinetic Theory: Molecules in a Box and Pressure">
  <title>Pressure from Molecular Collisions — Kinetic Theory Derivation</title>
  <desc>Cubical box of side L containing gas molecules of mass m. A representative molecule with x-velocity v_x bounces between two opposing walls. Each impact reverses momentum by 2 m v_x. Time between successive impacts on the same wall is 2 L over v_x. Averaging over N molecules and three orthogonal directions yields P = (1/3) (N/V) m mean-square-speed.</desc>

  <text x="310" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Pressure from Molecular Collisions:  P = ⅓ · (N/V) · m ⟨v²⟩</text>

  <defs>
    <marker id="kt-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="kt-arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Box (cube) -->
  <rect x="50" y="60" width="280" height="240" fill="#f0f9ff" stroke="#1a202c" stroke-width="2.5" />

  <!-- Side label L -->
  <text x="190" y="50" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">side  L</text>
  <line x1="50" y1="55" x2="330" y2="55" stroke="#1a202c" stroke-width="1" marker-start="url(#kt-arr-b-rev)" marker-end="url(#kt-arr-b)" />
  <text x="42" y="180" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle" transform="rotate(-90 42 180)">side  L</text>

  <!-- Random gas molecules (small dots with velocity arrows) -->
  <!-- Each is a circle + small arrow -->
  <g>
    <circle cx="90" cy="100" r="4" fill="#1d4ed8" />
    <line x1="90" y1="100" x2="105" y2="92" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#kt-arr-b)" />

    <circle cx="155" cy="120" r="4" fill="#1d4ed8" />
    <line x1="155" y1="120" x2="142" y2="135" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#kt-arr-b)" />

    <circle cx="220" cy="90" r="4" fill="#1d4ed8" />
    <line x1="220" y1="90" x2="232" y2="105" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#kt-arr-b)" />

    <circle cx="280" cy="140" r="4" fill="#1d4ed8" />
    <line x1="280" y1="140" x2="270" y2="125" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#kt-arr-b)" />

    <circle cx="110" cy="200" r="4" fill="#1d4ed8" />
    <line x1="110" y1="200" x2="125" y2="210" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#kt-arr-b)" />

    <circle cx="195" cy="240" r="4" fill="#1d4ed8" />
    <line x1="195" y1="240" x2="180" y2="232" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#kt-arr-b)" />

    <circle cx="260" cy="260" r="4" fill="#1d4ed8" />
    <line x1="260" y1="260" x2="275" y2="255" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#kt-arr-b)" />

    <circle cx="80" cy="270" r="4" fill="#1d4ed8" />
    <line x1="80" y1="270" x2="95" y2="262" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#kt-arr-b)" />
  </g>

  <!-- Highlighted molecule travelling along x: between left and right wall -->
  <circle cx="160" cy="180" r="6" fill="#dc2626" stroke="#7c2d12" stroke-width="1.5" />
  <text x="155" y="170" font-size="10" font-weight="700" fill="#7c2d12">m</text>

  <!-- Velocity arrow rightward to right wall -->
  <line x1="166" y1="180" x2="320" y2="180" stroke="#dc2626" stroke-width="2.5" marker-end="url(#kt-arr)" />
  <text x="245" y="172" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">v_x</text>

  <!-- Bounce path (dashed) showing reflection -->
  <line x1="320" y1="180" x2="60" y2="180" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4" />

  <!-- Wall impact mark -->
  <line x1="328" y1="170" x2="330" y2="190" stroke="#dc2626" stroke-width="3" />

  <!-- Momentum change annotation at right wall -->
  <text x="340" y="172" font-size="11" font-weight="700" fill="#dc2626">impact</text>
  <text x="340" y="186" font-size="11" fill="#dc2626">Δp = 2 m v_x</text>

  <!-- Time between impacts annotation at left side -->
  <text x="60" y="320" font-size="10" fill="#1a202c">round-trip:  Δt = 2L / v_x</text>

  <!-- Right panel: derivation -->
  <rect x="360" y="60" width="240" height="240" rx="8" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="480" y="80" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Derivation outline</text>

  <text x="370" y="105" font-size="11" font-weight="700" fill="#1a202c">1.  Momentum change</text>
  <text x="378" y="120" font-size="11" fill="#1a202c">|Δp| = 2 m v_x  per impact</text>

  <text x="370" y="142" font-size="11" font-weight="700" fill="#1a202c">2.  Force on wall (one molecule)</text>
  <text x="378" y="158" font-size="11" fill="#1a202c">F = Δp / Δt = m v_x² / L</text>

  <text x="370" y="180" font-size="11" font-weight="700" fill="#1a202c">3.  Pressure from N molecules</text>
  <text x="378" y="195" font-size="11" fill="#1a202c">P = N · m ⟨v_x²⟩ / L³</text>

  <text x="370" y="217" font-size="11" font-weight="700" fill="#1a202c">4.  Isotropy: ⟨v²⟩ = 3⟨v_x²⟩</text>

  <text x="370" y="245" font-size="13" font-weight="700" fill="#dc2626">P = ⅓ · (N/V) · m ⟨v²⟩</text>

  <text x="370" y="270" font-size="10" font-style="italic" fill="#4a5568">⟨v²⟩ = mean-square speed</text>
  <text x="370" y="284" font-size="10" font-style="italic" fill="#4a5568">N/V = number density</text>

  <text x="310" y="338" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Pressure on a container wall is the average rate at which molecular momentum is delivered to it.</text>
</svg>
