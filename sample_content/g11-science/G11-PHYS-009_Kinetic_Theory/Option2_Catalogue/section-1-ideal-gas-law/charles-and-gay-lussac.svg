<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img" aria-label="Charles's Law and Gay-Lussac's Law">
  <title>Charles's Law and Gay-Lussac's Law</title>
  <desc>Two adjacent linear plots. Left: Volume vs absolute temperature at constant pressure (Charles's Law) with three lines for three pressures, all passing through the origin (T = 0 K). Right: Pressure vs absolute temperature at constant volume (Gay-Lussac's Law) with three lines for three volumes, also through the origin. Dashed extrapolations to T = -273.15 °C define absolute zero.</desc>

  <text x="310" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Charles's Law (V vs T)  &amp;  Gay-Lussac's Law (P vs T)</text>

  <!-- ============= LEFT PLOT: V vs T at constant P (Charles) ============= -->
  <text x="170" y="48" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">V/T = constant   (P, n fixed)</text>

  <!-- Plot area -->
  <rect x="60" y="60" width="240" height="220" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Grid -->
  <g stroke="#e2e8f0" stroke-width="0.6">
    <line x1="60" y1="225" x2="300" y2="225" />
    <line x1="60" y1="170" x2="300" y2="170" />
    <line x1="60" y1="115" x2="300" y2="115" />
    <line x1="120" y1="60" x2="120" y2="280" />
    <line x1="180" y1="60" x2="180" y2="280" />
    <line x1="240" y1="60" x2="240" y2="280" />
  </g>

  <!-- Axes -->
  <line x1="60" y1="280" x2="300" y2="280" stroke="#1a202c" stroke-width="1.5" />
  <line x1="60" y1="60" x2="60" y2="280" stroke="#1a202c" stroke-width="1.5" />

  <!-- Axis labels -->
  <text x="170" y="306" font-size="12" font-weight="600" fill="#1a202c" text-anchor="middle">Absolute Temperature  T  (K)</text>
  <text x="32" y="170" font-size="12" font-weight="600" fill="#1a202c" text-anchor="middle" transform="rotate(-90 32 170)">Volume  V</text>

  <!-- Tick labels -->
  <text x="60" y="295" font-size="10" fill="#1a202c" text-anchor="middle">0</text>
  <text x="120" y="295" font-size="10" fill="#1a202c" text-anchor="middle">100</text>
  <text x="180" y="295" font-size="10" fill="#1a202c" text-anchor="middle">200</text>
  <text x="240" y="295" font-size="10" fill="#1a202c" text-anchor="middle">300</text>
  <text x="300" y="295" font-size="10" fill="#1a202c" text-anchor="middle">400</text>

  <!-- Three lines through origin: V = m * T. Origin (60,280). End at T=400 (x=300). -->
  <!-- Line P1 (low): slope steeper, ends at (300,75) -->
  <line x1="60" y1="280" x2="300" y2="75" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round" />
  <text x="306" y="80" font-size="11" font-weight="700" fill="#3b82f6">P₁ (low)</text>

  <!-- Line P2 (med): ends at (300,140) -->
  <line x1="60" y1="280" x2="300" y2="140" stroke="#dd6b20" stroke-width="2.6" stroke-linecap="round" />
  <text x="266" y="155" font-size="11" font-weight="700" fill="#dd6b20">P₂</text>

  <!-- Line P3 (high): ends at (300,205) -->
  <line x1="60" y1="280" x2="300" y2="205" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" />
  <text x="244" y="222" font-size="11" font-weight="700" fill="#dc2626">P₃ (high)</text>

  <!-- Extrapolation note -->
  <circle cx="60" cy="280" r="4" fill="#15803d" />
  <text x="68" y="276" font-size="10" font-weight="700" fill="#15803d">T = 0 K = −273.15 °C</text>
  <text x="68" y="262" font-size="9" fill="#15803d">absolute zero</text>

  <!-- ============= RIGHT PLOT: P vs T at constant V (Gay-Lussac) ============= -->
  <text x="475" y="48" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">P/T = constant   (V, n fixed)</text>

  <!-- Plot area -->
  <rect x="365" y="60" width="240" height="220" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Grid -->
  <g stroke="#e2e8f0" stroke-width="0.6">
    <line x1="365" y1="225" x2="605" y2="225" />
    <line x1="365" y1="170" x2="605" y2="170" />
    <line x1="365" y1="115" x2="605" y2="115" />
    <line x1="425" y1="60" x2="425" y2="280" />
    <line x1="485" y1="60" x2="485" y2="280" />
    <line x1="545" y1="60" x2="545" y2="280" />
  </g>

  <!-- Axes -->
  <line x1="365" y1="280" x2="605" y2="280" stroke="#1a202c" stroke-width="1.5" />
  <line x1="365" y1="60" x2="365" y2="280" stroke="#1a202c" stroke-width="1.5" />

  <!-- Axis labels -->
  <text x="475" y="306" font-size="12" font-weight="600" fill="#1a202c" text-anchor="middle">Absolute Temperature  T  (K)</text>
  <text x="337" y="170" font-size="12" font-weight="600" fill="#1a202c" text-anchor="middle" transform="rotate(-90 337 170)">Pressure  P</text>

  <text x="365" y="295" font-size="10" fill="#1a202c" text-anchor="middle">0</text>
  <text x="425" y="295" font-size="10" fill="#1a202c" text-anchor="middle">100</text>
  <text x="485" y="295" font-size="10" fill="#1a202c" text-anchor="middle">200</text>
  <text x="545" y="295" font-size="10" fill="#1a202c" text-anchor="middle">300</text>
  <text x="605" y="295" font-size="10" fill="#1a202c" text-anchor="middle">400</text>

  <!-- Three lines through origin: P = m * T -->
  <line x1="365" y1="280" x2="605" y2="75" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round" />
  <text x="557" y="70" font-size="11" font-weight="700" fill="#3b82f6">V₁ (small)</text>

  <line x1="365" y1="280" x2="605" y2="140" stroke="#dd6b20" stroke-width="2.6" stroke-linecap="round" />
  <text x="571" y="155" font-size="11" font-weight="700" fill="#dd6b20">V₂</text>

  <line x1="365" y1="280" x2="605" y2="205" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" />
  <text x="549" y="222" font-size="11" font-weight="700" fill="#dc2626">V₃ (large)</text>

  <!-- Bottom annotation panel -->
  <rect x="60" y="320" width="540" height="32" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="74" y="338" font-size="11" fill="#1a202c">Linear in absolute temperature.</text>
  <text x="220" y="338" font-size="11" font-weight="700" fill="#1d4ed8">V/T = nR/P</text>
  <text x="310" y="338" font-size="11" fill="#1a202c">·</text>
  <text x="320" y="338" font-size="11" font-weight="700" fill="#dc2626">P/T = nR/V</text>
  <text x="430" y="338" font-size="11" font-style="italic" fill="#4a5568">— always plot in Kelvin, never Celsius.</text>
</svg>
