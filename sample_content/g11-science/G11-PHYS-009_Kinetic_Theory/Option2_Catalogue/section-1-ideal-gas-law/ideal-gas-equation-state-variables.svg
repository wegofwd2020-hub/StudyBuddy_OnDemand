<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img" aria-label="Ideal Gas Equation and State Variables">
  <title>Ideal Gas Equation: PV = nRT</title>
  <desc>The four state variables P, V, n, T related by the ideal gas equation PV = nRT. Diagram shows a central equation panel and four labelled boxes around it identifying each variable, its symbol, SI unit, and what it controls. Universal gas constant R = 8.314 J / (mol K).</desc>

  <text x="310" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Ideal Gas Equation:  P V = n R T</text>

  <!-- Central equation banner -->
  <rect x="200" y="160" width="220" height="60" rx="10" fill="#fff7ed" stroke="#dd6b20" stroke-width="2.5" />
  <text x="310" y="195" font-size="28" font-weight="700" fill="#7c2d12" text-anchor="middle">P V = n R T</text>
  <text x="310" y="212" font-size="11" fill="#7c2d12" text-anchor="middle">single equation of state for an ideal gas</text>

  <!-- Pressure (top left) -->
  <rect x="50" y="60" width="180" height="78" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8" />
  <text x="140" y="80" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Pressure  P</text>
  <text x="60" y="100" font-size="11" fill="#1a202c">SI: pascal (Pa)</text>
  <text x="60" y="116" font-size="11" fill="#1a202c">1 atm ≈ 1.013 × 10⁵ Pa</text>
  <text x="60" y="132" font-size="10" font-style="italic" fill="#4a5568">force per unit wall area</text>

  <!-- Connector line -->
  <line x1="200" y1="138" x2="220" y2="160" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Volume (top right) -->
  <rect x="390" y="60" width="180" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.8" />
  <text x="480" y="80" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Volume  V</text>
  <text x="400" y="100" font-size="11" fill="#1a202c">SI: cubic metre (m³)</text>
  <text x="400" y="116" font-size="11" fill="#1a202c">1 L = 10⁻³ m³</text>
  <text x="400" y="132" font-size="10" font-style="italic" fill="#4a5568">space the gas occupies</text>

  <line x1="420" y1="138" x2="400" y2="160" stroke="#15803d" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Amount (bottom left) -->
  <rect x="50" y="240" width="180" height="78" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8" />
  <text x="140" y="260" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">Amount  n</text>
  <text x="60" y="280" font-size="11" fill="#1a202c">SI: mole (mol)</text>
  <text x="60" y="296" font-size="11" fill="#1a202c">1 mol = N_A = 6.022 × 10²³</text>
  <text x="60" y="312" font-size="10" font-style="italic" fill="#4a5568">how many gas molecules</text>

  <line x1="200" y1="240" x2="220" y2="220" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Temperature (bottom right) -->
  <rect x="390" y="240" width="180" height="78" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8" />
  <text x="480" y="260" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Temperature  T</text>
  <text x="400" y="280" font-size="11" fill="#1a202c">SI: kelvin (K)</text>
  <text x="400" y="296" font-size="11" fill="#1a202c">T(K) = T(°C) + 273.15</text>
  <text x="400" y="312" font-size="10" font-style="italic" fill="#4a5568">always absolute, never °C</text>

  <line x1="420" y1="240" x2="400" y2="220" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Constant R (under banner) -->
  <text x="310" y="240" font-size="11" font-weight="700" fill="#7c2d12" text-anchor="middle">R = 8.314  J / (mol·K)</text>
  <text x="310" y="254" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">universal gas constant — same for every gas</text>

  <!-- Bottom note -->
  <text x="310" y="345" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Boyle, Charles, and Avogadro's laws are special cases of P V = n R T when one variable is held fixed.</text>
</svg>
