<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img" aria-label="Degrees of Freedom for Monatomic, Diatomic, and Polyatomic Molecules">
  <title>Degrees of Freedom — Monatomic, Diatomic, Polyatomic</title>
  <desc>Three columns showing molecular shapes and their independent motion modes. Monatomic (e.g. helium): 3 translational degrees of freedom only, f = 3. Diatomic (e.g. nitrogen): 3 translational plus 2 rotational about axes perpendicular to the bond, f = 5 (vibration freezes out at room temperature). Polyatomic non-linear (e.g. water): 3 translational plus 3 rotational, f = 6.</desc>

  <text x="310" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Degrees of Freedom  f  per Molecule  (room temperature)</text>

  <defs>
    <marker id="df-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="df-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dd6b20" />
    </marker>
  </defs>

  <!-- ============== MONATOMIC ============== -->
  <rect x="30" y="50" width="180" height="240" rx="8" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="120" y="72" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Monatomic   (He, Ne, Ar)</text>

  <!-- Single atom -->
  <circle cx="120" cy="155" r="22" fill="#fde68a" stroke="#7c2d12" stroke-width="2" />
  <text x="120" y="160" font-size="11" font-weight="700" fill="#7c2d12" text-anchor="middle">He</text>

  <!-- 3 translation arrows -->
  <line x1="120" y1="155" x2="155" y2="155" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#df-arr)" />
  <text x="160" y="159" font-size="10" font-weight="700" fill="#1d4ed8">x</text>
  <line x1="120" y1="155" x2="120" y2="118" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#df-arr)" />
  <text x="125" y="115" font-size="10" font-weight="700" fill="#1d4ed8">y</text>
  <line x1="120" y1="155" x2="93" y2="180" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#df-arr)" />
  <text x="78" y="190" font-size="10" font-weight="700" fill="#1d4ed8">z</text>

  <!-- f count -->
  <rect x="50" y="218" width="140" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" />
  <text x="120" y="237" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">3 translational</text>
  <text x="120" y="252" font-size="10" fill="#1a202c" text-anchor="middle">no rotation (point mass)</text>
  <text x="120" y="270" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">f = 3</text>

  <!-- ============== DIATOMIC ============== -->
  <rect x="220" y="50" width="180" height="240" rx="8" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="310" y="72" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Diatomic   (N₂, O₂, H₂)</text>

  <!-- Two atoms with bond -->
  <line x1="285" y1="155" x2="335" y2="155" stroke="#475569" stroke-width="3" />
  <circle cx="285" cy="155" r="14" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" />
  <circle cx="335" cy="155" r="14" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" />
  <text x="285" y="160" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">N</text>
  <text x="335" y="160" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">N</text>

  <!-- 3 translation arrows (cluster centre at 310,155) -->
  <line x1="310" y1="120" x2="310" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#df-arr)" />
  <text x="316" y="103" font-size="9" font-weight="700" fill="#1d4ed8">trans</text>

  <!-- Two rotation arcs around perpendicular axes -->
  <path d="M 270 130 A 20 12 0 1 1 350 130" fill="none" stroke="#dd6b20" stroke-width="2" marker-end="url(#df-arr-r)" />
  <text x="310" y="118" font-size="9" font-weight="700" fill="#dd6b20" text-anchor="middle" display="none">rot</text>

  <path d="M 310 195 A 12 22 0 1 0 310 110" fill="none" stroke="#dd6b20" stroke-width="2" marker-end="url(#df-arr-r)" />
  <text x="345" y="195" font-size="10" font-weight="700" fill="#dd6b20">rot ×2</text>

  <!-- Vibrate spring annotation (frozen) -->
  <path d="M 285 175 q 4 6 8 0 q 4 -6 8 0 q 4 6 8 0 q 4 -6 8 0 q 4 6 8 0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="2 3" />
  <text x="310" y="195" font-size="9" fill="#94a3b8" text-anchor="middle">vibration: frozen at 300 K</text>

  <!-- f count -->
  <rect x="240" y="218" width="140" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" />
  <text x="310" y="234" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">3 trans + 2 rot</text>
  <text x="310" y="250" font-size="9" fill="#4a5568" text-anchor="middle">(3rd rot axis ≈ along bond,</text>
  <text x="310" y="262" font-size="9" fill="#4a5568" text-anchor="middle">  inertia ≈ 0 → ignored)</text>
  <text x="310" y="278" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">f = 5</text>

  <!-- ============== POLYATOMIC ============== -->
  <rect x="410" y="50" width="180" height="240" rx="8" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="500" y="72" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Polyatomic   (H₂O, NH₃, CH₄)</text>

  <!-- Water molecule -->
  <line x1="500" y1="135" x2="478" y2="172" stroke="#475569" stroke-width="3" />
  <line x1="500" y1="135" x2="522" y2="172" stroke="#475569" stroke-width="3" />
  <circle cx="500" cy="135" r="14" fill="#fecaca" stroke="#dc2626" stroke-width="2" />
  <circle cx="478" cy="172" r="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.8" />
  <circle cx="522" cy="172" r="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.8" />
  <text x="500" y="139" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">O</text>
  <text x="478" y="176" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">H</text>
  <text x="522" y="176" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">H</text>

  <!-- 3 trans -->
  <line x1="500" y1="100" x2="500" y2="80" stroke="#1d4ed8" stroke-width="2" marker-end="url(#df-arr)" />
  <text x="506" y="86" font-size="9" font-weight="700" fill="#1d4ed8">trans ×3</text>

  <!-- 3 rotation arcs -->
  <path d="M 460 195 A 22 12 0 1 1 540 195" fill="none" stroke="#dd6b20" stroke-width="2" marker-end="url(#df-arr-r)" />
  <text x="500" y="208" font-size="10" font-weight="700" fill="#dd6b20" text-anchor="middle">rot ×3</text>

  <!-- f count -->
  <rect x="430" y="218" width="140" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" />
  <text x="500" y="237" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">3 trans + 3 rot</text>
  <text x="500" y="252" font-size="10" fill="#1a202c" text-anchor="middle">non-linear shape</text>
  <text x="500" y="270" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">f = 6</text>

  <!-- Bottom note -->
  <text x="310" y="312" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Each independent quadratic energy term contributes ½ k_B T to the average energy of a molecule.</text>
  <text x="310" y="328" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Vibrations need higher T to "unfreeze" — quantum effect; classical equipartition over-counts at low T.</text>
</svg>
