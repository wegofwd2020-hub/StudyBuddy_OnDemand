<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img" aria-label="Equipartition Theorem and Molar Specific Heats">
  <title>Equipartition Theorem — Energy per Mode and Specific Heats</title>
  <desc>The equipartition theorem states each independent quadratic term in the energy contributes one-half k_B T to the average energy of a molecule. Internal energy U equals (f over 2) n R T. Molar heat capacity at constant volume C_v equals (f over 2) R, at constant pressure C_p equals C_v plus R, and the adiabatic index gamma equals C_p over C_v equals 1 plus 2 over f. A side table lists numerical values for monatomic (f equals 3), diatomic (f equals 5), and polyatomic non-linear (f equals 6) gases.</desc>

  <text x="310" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Equipartition Theorem &amp; Molar Specific Heats</text>

  <!-- Left panel: equipartition principle -->
  <rect x="30" y="48" width="280" height="270" rx="10" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="170" y="68" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Equipartition principle</text>

  <!-- Banner with the rule -->
  <rect x="48" y="80" width="244" height="46" rx="6" fill="#fff7ed" stroke="#dd6b20" stroke-width="1.6" />
  <text x="170" y="102" font-size="14" font-weight="700" fill="#7c2d12" text-anchor="middle">⟨ε⟩ per quadratic mode  =  ½ k_B T</text>
  <text x="170" y="118" font-size="10" font-style="italic" fill="#7c2d12" text-anchor="middle">in thermal equilibrium, classical limit</text>

  <!-- Bullets -->
  <text x="48" y="148" font-size="11" font-weight="700" fill="#1d4ed8">Translation:</text>
  <text x="142" y="148" font-size="11" fill="#1a202c">½ m v_x² + ½ m v_y² + ½ m v_z²</text>
  <text x="48" y="162" font-size="11" fill="#15803d">→ 3 modes  ⇒  ³⁄₂ k_B T per molecule</text>

  <text x="48" y="184" font-size="11" font-weight="700" fill="#dd6b20">Rotation:</text>
  <text x="125" y="184" font-size="11" fill="#1a202c">½ I ω² (per axis)</text>
  <text x="48" y="198" font-size="11" fill="#15803d">→ 0 / 2 / 3 modes (mono / dia / poly)</text>

  <text x="48" y="220" font-size="11" font-weight="700" fill="#9333ea">Vibration:</text>
  <text x="130" y="220" font-size="11" fill="#1a202c">½μẋ² + ½kx²  (2 modes)</text>
  <text x="48" y="234" font-size="11" fill="#94a3b8">— frozen out at room temperature</text>

  <!-- Total internal energy -->
  <rect x="48" y="252" width="244" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6" />
  <text x="170" y="272" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">U  =  (f / 2) · n R T</text>
  <text x="170" y="289" font-size="10" fill="#1a202c" text-anchor="middle">internal energy of n moles, f active modes</text>
  <text x="170" y="302" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">depends only on T (for an ideal gas)</text>

  <!-- Right panel: specific heats table -->
  <rect x="320" y="48" width="270" height="270" rx="10" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="455" y="68" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Molar specific heats</text>

  <!-- Formulae row -->
  <text x="335" y="92" font-size="11" font-weight="700" fill="#1a202c">C_v = (f/2) R</text>
  <text x="430" y="92" font-size="11" font-weight="700" fill="#1a202c">C_p = C_v + R</text>
  <text x="525" y="92" font-size="11" font-weight="700" fill="#dc2626">γ = 1 + 2/f</text>

  <!-- Table header -->
  <line x1="335" y1="108" x2="580" y2="108" stroke="#1a202c" stroke-width="1.5" />
  <text x="346" y="124" font-size="11" font-weight="700" fill="#1a202c">Type</text>
  <text x="403" y="124" font-size="11" font-weight="700" fill="#1a202c">f</text>
  <text x="438" y="124" font-size="11" font-weight="700" fill="#1d4ed8">C_v</text>
  <text x="486" y="124" font-size="11" font-weight="700" fill="#15803d">C_p</text>
  <text x="544" y="124" font-size="11" font-weight="700" fill="#dc2626">γ</text>
  <line x1="335" y1="130" x2="580" y2="130" stroke="#1a202c" stroke-width="1" />

  <!-- Monatomic row -->
  <text x="346" y="148" font-size="11" fill="#1a202c">monatomic</text>
  <text x="346" y="161" font-size="9" fill="#4a5568">He, Ar</text>
  <text x="403" y="148" font-size="11" font-weight="700" fill="#7c2d12">3</text>
  <text x="430" y="148" font-size="11" fill="#1d4ed8">³⁄₂ R</text>
  <text x="430" y="161" font-size="9" fill="#4a5568">12.47</text>
  <text x="478" y="148" font-size="11" fill="#15803d">⁵⁄₂ R</text>
  <text x="478" y="161" font-size="9" fill="#4a5568">20.79</text>
  <text x="544" y="148" font-size="11" font-weight="700" fill="#dc2626">5/3</text>
  <text x="544" y="161" font-size="9" fill="#4a5568">≈1.667</text>
  <line x1="335" y1="170" x2="580" y2="170" stroke="#cbd5e1" stroke-width="0.8" />

  <!-- Diatomic row -->
  <text x="346" y="186" font-size="11" fill="#1a202c">diatomic</text>
  <text x="346" y="199" font-size="9" fill="#4a5568">N₂, O₂, H₂</text>
  <text x="403" y="186" font-size="11" font-weight="700" fill="#7c2d12">5</text>
  <text x="430" y="186" font-size="11" fill="#1d4ed8">⁵⁄₂ R</text>
  <text x="430" y="199" font-size="9" fill="#4a5568">20.79</text>
  <text x="478" y="186" font-size="11" fill="#15803d">⁷⁄₂ R</text>
  <text x="478" y="199" font-size="9" fill="#4a5568">29.10</text>
  <text x="544" y="186" font-size="11" font-weight="700" fill="#dc2626">7/5</text>
  <text x="544" y="199" font-size="9" fill="#4a5568">= 1.40</text>
  <line x1="335" y1="208" x2="580" y2="208" stroke="#cbd5e1" stroke-width="0.8" />

  <!-- Polyatomic row -->
  <text x="346" y="224" font-size="11" fill="#1a202c">polyatomic</text>
  <text x="346" y="237" font-size="9" fill="#4a5568">H₂O, CH₄</text>
  <text x="403" y="224" font-size="11" font-weight="700" fill="#7c2d12">6</text>
  <text x="430" y="224" font-size="11" fill="#1d4ed8">3 R</text>
  <text x="430" y="237" font-size="9" fill="#4a5568">24.94</text>
  <text x="478" y="224" font-size="11" fill="#15803d">4 R</text>
  <text x="478" y="237" font-size="9" fill="#4a5568">33.26</text>
  <text x="544" y="224" font-size="11" font-weight="700" fill="#dc2626">4/3</text>
  <text x="544" y="237" font-size="9" fill="#4a5568">≈1.333</text>
  <line x1="335" y1="246" x2="580" y2="246" stroke="#1a202c" stroke-width="1" />

  <!-- Units note -->
  <text x="335" y="262" font-size="9" fill="#4a5568">Units: J / (mol · K).  R = 8.314 J / (mol·K).</text>

  <!-- Mayer's relation -->
  <rect x="335" y="270" width="245" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4" />
  <text x="457" y="287" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">C_p − C_v = R    (Mayer's relation)</text>
  <text x="457" y="302" font-size="9" fill="#4a5568" text-anchor="middle">extra heat goes into the work P·ΔV at constant P</text>

  <!-- Bottom note -->
  <text x="310" y="338" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Counting modes is enough to predict every gas's heat capacity — equipartition turns geometry into thermodynamics.</text>
</svg>
