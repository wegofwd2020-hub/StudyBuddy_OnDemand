<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Radial gravitational field lines around a planet pointing inward toward its centre">
  <title>Radial gravitational field around a planet</title>
  <desc>A spherical planet at the centre with sixteen field lines pointing radially inward. Gravitational field strength g equals G M over r squared, directed toward the planet centre. A test mass placed anywhere experiences a force F equals m g.</desc>

  <defs>
    <marker id="grav-fl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
    <radialGradient id="grav-planet" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#bee3f8" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
  </defs>

  <text x="240" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Gravitational Field — radial, inward</text>

  <!-- Planet in centre -->
  <g transform="translate(240, 180)">
    <circle r="44" fill="url(#grav-planet)" stroke="#1a202c" stroke-width="1.2" />
    <text y="5" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">M</text>
  </g>

  <!-- 16 radial field lines pointing inward -->
  <!-- We draw each from the outer end (radius 140) to just outside the planet (radius 50) -->
  <!-- Angles: 0, 22.5, 45, ..., 337.5 -->
  <g stroke="#2b6cb0" stroke-width="2" fill="none">
    <!-- 0° (right) -->
    <line x1="380" y1="180" x2="295" y2="180" marker-end="url(#grav-fl-arrow)" />
    <!-- 22.5° -->
    <line x1="369.4" y1="126.4" x2="286.2" y2="159.5" marker-end="url(#grav-fl-arrow)" />
    <!-- 45° -->
    <line x1="339" y1="81" x2="271.4" y2="148.6" marker-end="url(#grav-fl-arrow)" />
    <!-- 67.5° -->
    <line x1="293.6" y1="50.6" x2="252.5" y2="133.8" marker-end="url(#grav-fl-arrow)" />
    <!-- 90° (top) -->
    <line x1="240" y1="40" x2="240" y2="125" marker-end="url(#grav-fl-arrow)" />
    <!-- 112.5° -->
    <line x1="186.4" y1="50.6" x2="227.5" y2="133.8" marker-end="url(#grav-fl-arrow)" />
    <!-- 135° -->
    <line x1="141" y1="81" x2="208.6" y2="148.6" marker-end="url(#grav-fl-arrow)" />
    <!-- 157.5° -->
    <line x1="110.6" y1="126.4" x2="193.8" y2="159.5" marker-end="url(#grav-fl-arrow)" />
    <!-- 180° (left) -->
    <line x1="100" y1="180" x2="185" y2="180" marker-end="url(#grav-fl-arrow)" />
    <!-- 202.5° -->
    <line x1="110.6" y1="233.6" x2="193.8" y2="200.5" marker-end="url(#grav-fl-arrow)" />
    <!-- 225° -->
    <line x1="141" y1="279" x2="208.6" y2="211.4" marker-end="url(#grav-fl-arrow)" />
    <!-- 247.5° -->
    <line x1="186.4" y1="309.4" x2="227.5" y2="226.2" marker-end="url(#grav-fl-arrow)" />
    <!-- 270° (bottom) -->
    <line x1="240" y1="320" x2="240" y2="235" marker-end="url(#grav-fl-arrow)" />
    <!-- 292.5° -->
    <line x1="293.6" y1="309.4" x2="252.5" y2="226.2" marker-end="url(#grav-fl-arrow)" />
    <!-- 315° -->
    <line x1="339" y1="279" x2="271.4" y2="211.4" marker-end="url(#grav-fl-arrow)" />
    <!-- 337.5° -->
    <line x1="369.4" y1="233.6" x2="286.2" y2="200.5" marker-end="url(#grav-fl-arrow)" />
  </g>

  <!-- Test mass on the right field line, with force F = mg -->
  <circle cx="370" cy="180" r="7" fill="#dd6b20" stroke="#1a202c" stroke-width="1" />
  <text x="386" y="184" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dd6b20">m</text>
  <text x="386" y="200" font="11px system-ui" font-size="11" font-weight="700" fill="#dd6b20">F = m g</text>

  <!-- Distance r annotation -->
  <line x1="240" y1="248" x2="370" y2="248" stroke="#4a5568" stroke-width="0.8" stroke-dasharray="2 2" />
  <text x="305" y="262" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">r</text>

  <!-- Equation card -->
  <rect x="40" y="298" width="400" height="44" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2" />
  <text x="240" y="317" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">g (r)  =  G · M / r²       (vector points toward M)</text>
  <text x="240" y="335" font="10.5px system-ui" font-size="10.5" font-style="italic" fill="#15803d" text-anchor="middle">A test mass m at distance r feels  F = m g  — direction always inward, magnitude inverse-square.</text>
</svg>
