<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="Summary card of the six core gravitation formulas with units and where each one applies">
  <title>Gravitation — formula one-pager</title>
  <desc>Six gravitation formulas grouped by topic: Newton's law of universal gravitation, surface gravity, gravitational potential energy, orbital velocity, escape velocity, and Kepler's third law. Each formula card lists the equation, the SI units of each symbol, and a one-line note on when to use it.</desc>

  <rect x="0" y="0" width="720" height="480" fill="#fdfdfb" />

  <text x="360" y="30" font-family="system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Gravitation — Six Formulas to Remember</text>
  <text x="360" y="50" font-family="system-ui" font-size="12" font-style="italic" fill="#4a5568" text-anchor="middle">G = 6.674 × 10⁻¹¹  N·m² / kg²    ·    M_⊕ = 5.972 × 10²⁴ kg    ·    R_⊕ = 6.371 × 10⁶ m</text>

  <!-- Card 1: Newton's law of gravitation (top-left) -->
  <rect x="30" y="70" width="210" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
  <text x="135" y="92" font-family="system-ui" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">1.  NEWTON'S LAW</text>
  <text x="135" y="123" font-family="system-ui" font-size="20" font-weight="700" fill="#1a202c" text-anchor="middle">F = G m₁ m₂ / r²</text>
  <text x="135" y="148" font-family="system-ui" font-size="10.5" fill="#4a5568" text-anchor="middle">F: newtons   m₁,m₂: kg   r: metres</text>
  <text x="135" y="166" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">Mutual attraction between any</text>
  <text x="135" y="180" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">two point masses.</text>

  <!-- Card 2: Surface gravity (top-middle) -->
  <rect x="255" y="70" width="210" height="120" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5" />
  <text x="360" y="92" font-family="system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">2.  FIELD STRENGTH</text>
  <text x="360" y="123" font-family="system-ui" font-size="20" font-weight="700" fill="#1a202c" text-anchor="middle">g = G M / r²</text>
  <text x="360" y="148" font-family="system-ui" font-size="10.5" fill="#4a5568" text-anchor="middle">g: m/s²   M: source mass (kg)   r: m</text>
  <text x="360" y="166" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">At Earth's surface r = R_⊕,</text>
  <text x="360" y="180" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">g ≈ 9.81 m/s².</text>

  <!-- Card 3: Potential energy (top-right) -->
  <rect x="480" y="70" width="210" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="585" y="92" font-family="system-ui" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">3.  POTENTIAL ENERGY</text>
  <text x="585" y="123" font-family="system-ui" font-size="20" font-weight="700" fill="#1a202c" text-anchor="middle">U = − G M m / r</text>
  <text x="585" y="148" font-family="system-ui" font-size="10.5" fill="#4a5568" text-anchor="middle">U: joules (always negative)</text>
  <text x="585" y="166" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">Reference U = 0 at r → ∞.</text>
  <text x="585" y="180" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">Near surface: ΔU ≈ m g h.</text>

  <!-- Card 4: Orbital velocity (bottom-left) -->
  <rect x="30" y="210" width="210" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
  <text x="135" y="232" font-family="system-ui" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">4.  ORBITAL VELOCITY</text>
  <text x="135" y="263" font-family="system-ui" font-size="20" font-weight="700" fill="#1a202c" text-anchor="middle">v_orb = √( G M / r )</text>
  <text x="135" y="288" font-family="system-ui" font-size="10.5" fill="#4a5568" text-anchor="middle">v: m/s   M: central body (kg)</text>
  <text x="135" y="306" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">Speed for a circular orbit at</text>
  <text x="135" y="320" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">radius r. ISS: ≈ 7.7 km/s.</text>

  <!-- Card 5: Escape velocity (bottom-middle) -->
  <rect x="255" y="210" width="210" height="120" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" />
  <text x="360" y="232" font-family="system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">5.  ESCAPE VELOCITY</text>
  <text x="360" y="263" font-family="system-ui" font-size="20" font-weight="700" fill="#1a202c" text-anchor="middle">v_esc = √( 2 G M / R )</text>
  <text x="360" y="288" font-family="system-ui" font-size="10.5" fill="#4a5568" text-anchor="middle">R: launch radius (planet surface)</text>
  <text x="360" y="306" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">v_esc = √2 · v_orb at same r.</text>
  <text x="360" y="320" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">Earth: ≈ 11.2 km/s.</text>

  <!-- Card 6: Kepler's 3rd (bottom-right) -->
  <rect x="480" y="210" width="210" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="585" y="232" font-family="system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">6.  KEPLER'S 3RD LAW</text>
  <text x="585" y="263" font-family="system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">T² = (4π² / GM) · a³</text>
  <text x="585" y="288" font-family="system-ui" font-size="10.5" fill="#4a5568" text-anchor="middle">T: period   a: semi-major axis</text>
  <text x="585" y="306" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">Solar units: T(yr) = a(AU)^(3/2).</text>
  <text x="585" y="320" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">Same M for all bodies orbiting it.</text>

  <!-- Connections row -->
  <rect x="30" y="350" width="660" height="106" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" />
  <text x="360" y="370" font-family="system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">How they connect</text>

  <text x="50" y="392" font-family="system-ui" font-size="11" fill="#1a202c">•  g = F/m   →   formulas (1) and (2) are the same law, just divided by the test mass.</text>
  <text x="50" y="410" font-family="system-ui" font-size="11" fill="#1a202c">•  v_orb²/r = g(r)   →   gravity at orbit radius r supplies the centripetal force; rearrange to get formula (4).</text>
  <text x="50" y="428" font-family="system-ui" font-size="11" fill="#1a202c">•  ½ m v_esc² + U(R) = 0   →   set total mechanical energy to zero at the surface; rearrange to get formula (5).</text>
  <text x="50" y="446" font-family="system-ui" font-size="11" fill="#1a202c">•  Kepler (6) drops out of v_orb when you substitute v = 2πa/T into formula (4) and square.</text>

  <text x="360" y="473" font-family="system-ui" font-size="10.5" font-style="italic" fill="#64748b" text-anchor="middle">One law of gravity → six formulas covering forces, fields, energies, orbits, and timekeeping in the heavens.</text>
</svg>
