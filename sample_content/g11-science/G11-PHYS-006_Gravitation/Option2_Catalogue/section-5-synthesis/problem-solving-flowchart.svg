<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="Decision tree for choosing the right gravitation formula based on the problem context">
  <title>Problem-solving flowchart — which gravitation formula?</title>
  <desc>A four-level decision tree. Starting from any gravitation question, branch on whether the problem is near a planet's surface or general, then on whether it asks for a force, an energy, or an orbital quantity. Each leaf names the formula to use and gives one example.</desc>

  <defs>
    <marker id="fc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="560" fill="#fdfdfb" />

  <text x="360" y="28" font-family="system-ui" font-size="17" font-weight="700" fill="#1a202c" text-anchor="middle">Which gravitation formula should I use?</text>
  <text x="360" y="46" font-family="system-ui" font-size="11.5" font-style="italic" fill="#4a5568" text-anchor="middle">Walk top-to-bottom. The questions in diamonds match the wording students see in problem stems.</text>

  <!-- Start node -->
  <rect x="280" y="62" width="160" height="40" rx="20" fill="#1e293b" stroke="#0f172a" stroke-width="1.4" />
  <text x="360" y="86" font-family="system-ui" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Gravitation problem</text>

  <!-- Arrow to first decision -->
  <line x1="360" y1="102" x2="360" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#fc-arrow)" />

  <!-- Decision 1: near surface? (diamond) -->
  <polygon points="360,128 540,178 360,228 180,178" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" />
  <text x="360" y="172" font-family="system-ui" font-size="12.5" font-weight="700" fill="#1a202c" text-anchor="middle">Is the object's distance r</text>
  <text x="360" y="190" font-family="system-ui" font-size="12.5" font-weight="700" fill="#1a202c" text-anchor="middle">close to the planet radius R</text>
  <text x="360" y="208" font-family="system-ui" font-size="11.5" font-style="italic" fill="#4a5568" text-anchor="middle">(h ≪ R, e.g. ≤ 100 km up)?</text>

  <!-- YES branch (left): use g·h approximation -->
  <text x="225" y="242" font-family="system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">YES — near surface</text>
  <line x1="245" y1="195" x2="160" y2="252" stroke="#475569" stroke-width="1.5" marker-end="url(#fc-arrow)" />

  <!-- NO branch (right): use full law -->
  <text x="495" y="242" font-family="system-ui" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">NO — general / orbit / deep space</text>
  <line x1="475" y1="195" x2="560" y2="252" stroke="#475569" stroke-width="1.5" marker-end="url(#fc-arrow)" />

  <!-- LEFT branch: near-surface decision -->
  <polygon points="160,260 280,295 160,330 40,295" fill="#dcfce7" stroke="#15803d" stroke-width="1.4" />
  <text x="160" y="290" font-family="system-ui" font-size="11.5" font-weight="700" fill="#1a202c" text-anchor="middle">Asking for force or</text>
  <text x="160" y="305" font-family="system-ui" font-size="11.5" font-weight="700" fill="#1a202c" text-anchor="middle">change in PE?</text>

  <!-- Force leaf (LL) -->
  <line x1="100" y1="312" x2="80" y2="350" stroke="#475569" stroke-width="1.5" marker-end="url(#fc-arrow)" />
  <text x="65" y="334" font-family="system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">force / weight</text>
  <rect x="20" y="358" width="170" height="76" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2" />
  <text x="105" y="378" font-family="system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Use:  W = m g</text>
  <text x="105" y="396" font-family="system-ui" font-size="10.5" fill="#1a202c" text-anchor="middle">g = 9.81 m/s² (Earth)</text>
  <text x="105" y="412" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">e.g. weight of a 70 kg</text>
  <text x="105" y="426" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">person on Earth.</text>

  <!-- Energy leaf (LR) -->
  <line x1="220" y1="312" x2="240" y2="350" stroke="#475569" stroke-width="1.5" marker-end="url(#fc-arrow)" />
  <text x="262" y="334" font-family="system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">change in PE</text>
  <rect x="200" y="358" width="170" height="76" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2" />
  <text x="285" y="378" font-family="system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Use:  ΔU = m g h</text>
  <text x="285" y="396" font-family="system-ui" font-size="10.5" fill="#1a202c" text-anchor="middle">h: height climbed (m)</text>
  <text x="285" y="412" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">e.g. lifting a book</text>
  <text x="285" y="426" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">2 m off the floor.</text>

  <!-- RIGHT branch: general case decision -->
  <polygon points="560,260 680,295 560,330 440,295" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" />
  <text x="560" y="290" font-family="system-ui" font-size="11.5" font-weight="700" fill="#1a202c" text-anchor="middle">Asking for force, PE,</text>
  <text x="560" y="305" font-family="system-ui" font-size="11.5" font-weight="700" fill="#1a202c" text-anchor="middle">or orbital quantity?</text>

  <!-- Force leaf (RL) -->
  <line x1="490" y1="312" x2="465" y2="350" stroke="#475569" stroke-width="1.5" marker-end="url(#fc-arrow)" />
  <text x="455" y="334" font-family="system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">force / field</text>
  <rect x="395" y="358" width="170" height="76" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" />
  <text x="480" y="378" font-family="system-ui" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">F = G m₁m₂ / r²</text>
  <text x="480" y="394" font-family="system-ui" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="middle">or g = G M / r²</text>
  <text x="480" y="412" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">e.g. Moon's pull on Earth</text>
  <text x="480" y="426" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">causing tides.</text>

  <!-- PE leaf (RM) -->
  <line x1="560" y1="332" x2="600" y2="350" stroke="#475569" stroke-width="1.5" marker-end="url(#fc-arrow)" />
  <text x="635" y="334" font-family="system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">PE</text>
  <rect x="572" y="358" width="138" height="76" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" />
  <text x="641" y="378" font-family="system-ui" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">U = − GMm / r</text>
  <text x="641" y="396" font-family="system-ui" font-size="10.5" fill="#1a202c" text-anchor="middle">always negative</text>
  <text x="641" y="412" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">e.g. binding energy</text>
  <text x="641" y="426" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">of a satellite.</text>

  <!-- Orbital leaf (bottom row) -->
  <line x1="560" y1="332" x2="560" y2="450" stroke="#475569" stroke-width="1.5" marker-end="url(#fc-arrow)" />
  <text x="588" y="446" font-family="system-ui" font-size="11" font-weight="700" fill="#7c3aed">orbit / escape / period</text>
  <rect x="395" y="460" width="315" height="76" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" />
  <text x="552" y="480" font-family="system-ui" font-size="12.5" font-weight="700" fill="#7c3aed" text-anchor="middle">v_orb = √(GM/r)    ·    v_esc = √(2GM/R)    ·    T² ∝ a³</text>
  <text x="552" y="500" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">Pick the formula whose left side matches what the question asks.</text>
  <text x="552" y="516" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">e.g. ISS orbital speed (v_orb), launching to Mars (v_esc),</text>
  <text x="552" y="530" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568" text-anchor="middle">period of a new exoplanet (Kepler's 3rd).</text>

  <!-- Footer note -->
  <text x="360" y="552" font-family="system-ui" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">When in doubt, use the general formulas — they reduce to the surface ones automatically when r ≈ R.</text>
</svg>
