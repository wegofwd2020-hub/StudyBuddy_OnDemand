<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="Unified orbital energy diagram showing how the sign of total mechanical energy determines whether an orbit is elliptic parabolic or hyperbolic">
  <title>Total mechanical energy and orbit shape — bound vs escape vs hyperbolic</title>
  <desc>Plot of gravitational potential energy U of r as a negative well. Three horizontal lines mark fixed total mechanical energy E equal to kinetic plus potential. E less than zero produces a closed elliptical orbit, E equal to zero produces a parabolic escape orbit that just reaches infinity with zero kinetic energy, E greater than zero produces a hyperbolic orbit that leaves with finite speed at infinity.</desc>

  <defs>
    <marker id="oe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="460" fill="#fdfdfb" />

  <text x="360" y="28" font-family="system-ui" font-size="17" font-weight="700" fill="#1a202c" text-anchor="middle">Total mechanical energy E = KE + U  determines the orbit shape</text>
  <text x="360" y="46" font-family="system-ui" font-size="11.5" font-style="italic" fill="#4a5568" text-anchor="middle">U(r) = −GMm/r is fixed. The student picks v at launch, which sets KE — and therefore E.</text>

  <!-- Plot frame: x = 60..520, y = 70..330 -->
  <rect x="60" y="70" width="460" height="260" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Vertical axis ticks: r = 0..10 (just labels, plot itself starts at r ≥ ~1) -->
  <line x1="60" y1="330" x2="520" y2="330" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="60" y1="70" x2="60" y2="330" stroke="#94a3b8" stroke-width="1.2" />

  <text x="290" y="356" font-family="system-ui" font-size="12.5" font-weight="600" fill="#1a202c" text-anchor="middle">r  (distance from central mass)  →</text>
  <text x="34" y="200" font-family="system-ui" font-size="12.5" font-weight="600" fill="#1a202c" text-anchor="middle" transform="rotate(-90 34 200)">Energy  →</text>

  <!-- Zero-energy reference line (E = 0, dashed black) -->
  <line x1="60" y1="160" x2="520" y2="160" stroke="#1a202c" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="528" y="164" font-family="system-ui" font-size="11" font-weight="700" fill="#1a202c">E = 0  ⇒  parabola (escape)</text>
  <text x="528" y="178" font-family="system-ui" font-size="10.5" font-style="italic" fill="#4a5568">v = v_escape</text>

  <!-- Hyperbolic energy line (E > 0, purple, above zero line) -->
  <line x1="60" y1="105" x2="520" y2="105" stroke="#7c3aed" stroke-width="2" />
  <text x="528" y="109" font-family="system-ui" font-size="11" font-weight="700" fill="#7c3aed">E &gt; 0  ⇒  hyperbola</text>
  <text x="528" y="123" font-family="system-ui" font-size="10.5" font-style="italic" fill="#7c3aed">leaves with v∞ &gt; 0</text>

  <!-- Bound energy line (E < 0, red, below zero line) -->
  <line x1="60" y1="225" x2="520" y2="225" stroke="#dc2626" stroke-width="2" />
  <text x="528" y="229" font-family="system-ui" font-size="11" font-weight="700" fill="#dc2626">E &lt; 0  ⇒  ellipse (bound)</text>
  <text x="528" y="243" font-family="system-ui" font-size="10.5" font-style="italic" fill="#dc2626">cannot escape — stays in well</text>

  <!-- U(r) curve: U = -k/r, k chosen so U(r=1) = -8 in plot units. We're in pixel space.
       Inner area: x from 60 to 520 (width 460), y from 70 (top) to 330 (bottom).
       Map: r in [0, 10] → x in [60, 520]; xPx(r) = 60 + 46 * r.
       Energy axis: U from -10 (bottom of plot) to +5 (top of plot) (range 15) → y in [330, 70]; yPx(U) = 330 - (U+10)/15 * 260.
       So zero (U=0) at yPx = 330 - 10/15*260 = 330 - 173.33 = 156.67. We placed E=0 line at y=160 — close enough; let's keep our handcrafted positions.
       Use U(r) = -8/r. r=1 → U=-8 (yPx ≈ 330 - 2/15*260 = 330-34.67 = 295.33). r=2 → U=-4 (yPx ≈ 330 - 6/15*260 = 330-104 = 226). r=4 → U=-2 (yPx ≈ 330 - 8/15*260 = 330-138.67 = 191.33). r=8 → U=-1 (yPx ≈ 330 - 9/15*260 = 330-156 = 174). r=10 → U=-0.8 (yPx ≈ 330 - 9.2/15*260 = 330-159.47 = 170.53). -->

  <!-- Sampled U(r) = -8/r curve clipped at U=-9 (plot bottom). r samples: 0.9..10 -->
  <polyline points="101.4,323.78 105.4,313.42 109.4,304.20 113.4,295.93 117.4,288.45 121.4,281.66 125.4,275.46 129.4,269.78 133.4,264.55 137.4,259.71 141.4,255.23 145.4,251.05 149.4,247.16 153.4,243.51 157.4,240.09 161.4,236.86 165.4,233.83 169.4,230.95 173.4,228.23 177.4,225.65 181.4,223.19 185.4,220.85 189.4,218.62 193.4,216.49 197.4,214.45 201.4,212.50 205.4,210.62 209.4,208.82 213.4,207.10 217.4,205.43 221.4,203.83 225.4,202.28 229.4,200.79 233.4,199.34 237.4,197.95 241.4,196.59 245.4,195.28 249.4,194.01 253.4,192.78 257.4,191.58 261.4,190.42 265.4,189.29 269.4,188.20 273.4,187.13 277.4,186.09 281.4,185.08 285.4,184.10 289.4,183.14 293.4,182.20 297.4,181.29 301.4,180.40 305.4,179.53 309.4,178.68 313.4,177.85 317.4,177.04 321.4,176.25 325.4,175.48 329.4,174.72 333.4,173.98 337.4,173.25 341.4,172.54 345.4,171.84 349.4,171.16 353.4,170.49 357.4,169.84 361.4,169.20 365.4,168.57 369.4,167.95 373.4,167.34 377.4,166.74 381.4,166.16 385.4,165.58 389.4,165.02 393.4,164.46 397.4,163.92 401.4,163.38 405.4,162.85 409.4,162.34 413.4,161.83 417.4,161.32 421.4,160.83 425.4,160.34 429.4,159.86 433.4,159.39 437.4,158.93 441.4,158.47 445.4,158.02 449.4,157.58 453.4,157.14 457.4,156.71 461.4,156.29 465.4,155.87 469.4,155.46 473.4,155.05 477.4,154.65 481.4,154.26 485.4,153.87 489.4,153.49 493.4,153.11 497.4,152.74 501.4,152.37 505.4,152.01 509.4,151.65 513.4,151.30 517.4,150.95"
    fill="none" stroke="#dd6b20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <text x="125" y="318" font-family="system-ui" font-size="11" font-weight="700" fill="#dd6b20">U(r) = −GMm/r</text>

  <!-- Turning point for the bound orbit: at the bound-energy line E=-3 the orbit turns where U(r) = E.
       But for visual clarity, mark on the bound line where r_max happens. With U = -8/r and E = -3, r_max = 8/3 ≈ 2.67 → xPx = 60 + 46*2.67 ≈ 182.7.
       (Forget the full calc — just place markers at sensible visual spots.)
       Mark "turning point" on the bound line where it crosses U(r). Visually the bound line y=225 crosses the U curve near x ≈ 195 (between r=2 and r=2.5). -->
  <circle cx="195" cy="225" r="5" fill="#dc2626" stroke="#1a202c" stroke-width="1" />
  <text x="200" y="219" font-family="system-ui" font-size="10.5" font-weight="600" fill="#dc2626">turning point — KE = 0</text>

  <!-- KE bracket annotation at fixed r = 5 (xPx = 60 + 46*5 = 290) — show three KE values via vertical bars from U(r) up to each E line.
       At r=5, U ≈ -1.6. So U-line at xPx=290 is at y ≈ 330 - (-1.6+10)/15*260 = 330 - 8.4/15*260 = 330 - 145.6 = 184.4. -->
  <line x1="290" y1="184.4" x2="290" y2="225" stroke="#dc2626" stroke-width="2" />
  <text x="294" y="208" font-family="system-ui" font-size="9.5" font-weight="600" fill="#dc2626">KE&lt;0?</text>
  <text x="294" y="220" font-family="system-ui" font-size="9" font-style="italic" fill="#dc2626">(bound: r &gt; r_max here)</text>

  <line x1="370" y1="167.34" x2="370" y2="160" stroke="#1a202c" stroke-width="2" />
  <line x1="370" y1="167.34" x2="370" y2="105" stroke="#7c3aed" stroke-width="2" />
  <text x="378" y="135" font-family="system-ui" font-size="10" font-weight="700" fill="#7c3aed">KE = E − U &gt; 0</text>
  <text x="378" y="148" font-family="system-ui" font-size="9.5" font-style="italic" fill="#475569">(KE bracket for E&gt;0)</text>

  <!-- Bottom row of three trajectory mini-illustrations -->
  <text x="360" y="382" font-family="system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">The three orbit families (M = central mass, drawn at the focus)</text>

  <!-- Mini panel 1: Ellipse (E < 0) -->
  <rect x="40" y="392" width="200" height="58" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
  <ellipse cx="115" cy="421" rx="50" ry="22" fill="none" stroke="#dc2626" stroke-width="2" />
  <circle cx="135" cy="421" r="4" fill="#1e293b" />
  <text x="135" y="416" font-family="system-ui" font-size="9" font-weight="700" fill="#1e293b" text-anchor="middle">M</text>
  <text x="195" y="412" font-family="system-ui" font-size="10.5" font-weight="700" fill="#dc2626">E &lt; 0</text>
  <text x="195" y="426" font-family="system-ui" font-size="9.5" fill="#1a202c">ellipse</text>
  <text x="195" y="440" font-family="system-ui" font-size="9.5" font-style="italic" fill="#4a5568">closed orbit</text>

  <!-- Mini panel 2: Parabola (E = 0) -->
  <rect x="260" y="392" width="200" height="58" rx="6" fill="#f1f5f9" stroke="#1a202c" stroke-width="1.2" />
  <path d="M 280 442 Q 350 380 440 442" fill="none" stroke="#1a202c" stroke-width="2" />
  <circle cx="350" cy="425" r="4" fill="#1e293b" />
  <text x="350" y="420" font-family="system-ui" font-size="9" font-weight="700" fill="#1e293b" text-anchor="middle">M</text>
  <text x="290" y="412" font-family="system-ui" font-size="10.5" font-weight="700" fill="#1a202c">E = 0</text>
  <text x="290" y="426" font-family="system-ui" font-size="9.5" fill="#1a202c">parabola</text>
  <text x="290" y="440" font-family="system-ui" font-size="9.5" font-style="italic" fill="#4a5568">v∞ = 0</text>

  <!-- Mini panel 3: Hyperbola (E > 0) -->
  <rect x="480" y="392" width="200" height="58" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" />
  <path d="M 495 440 Q 555 420 580 410 Q 615 396 670 396" fill="none" stroke="#7c3aed" stroke-width="2" />
  <circle cx="575" cy="425" r="4" fill="#1e293b" />
  <text x="575" y="420" font-family="system-ui" font-size="9" font-weight="700" fill="#1e293b" text-anchor="middle">M</text>
  <text x="510" y="412" font-family="system-ui" font-size="10.5" font-weight="700" fill="#7c3aed">E &gt; 0</text>
  <text x="510" y="426" font-family="system-ui" font-size="9.5" fill="#1a202c">hyperbola</text>
  <text x="510" y="440" font-family="system-ui" font-size="9.5" font-style="italic" fill="#7c3aed">v∞ &gt; 0</text>

  <text x="360" y="455" font-family="system-ui" font-size="10.5" font-style="italic" fill="#64748b" text-anchor="middle">Same gravity, three trajectories — set by whether the launch KE clears the well or not.</text>
</svg>
