<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-label="Cavendish torsion balance experiment for measuring G">
  <title>Cavendish Experiment — measuring G</title>
  <desc>Schematic of Cavendish's 1798 torsion balance. Two small lead spheres on the ends of a horizontal rod are suspended from a fine wire; two large lead spheres are brought close. The gravitational pull twists the rod, deflecting a light beam reflected from a tiny mirror onto a distant scale. The measured deflection gives G.</desc>

  <defs>
    <radialGradient id="cav-small" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#cbd5e0" />
      <stop offset="100%" stop-color="#4a5568" />
    </radialGradient>
    <radialGradient id="cav-large" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#1a202c" />
    </radialGradient>
    <marker id="cav-arr-twist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="cav-arr-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
  </defs>

  <text x="280" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Cavendish Torsion Balance — measuring the gravitational constant G</text>

  <!-- Outer enclosure -->
  <rect x="60" y="50" width="440" height="200" rx="8" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4" />
  <text x="78" y="64" font="10px system-ui" font-size="10" font-style="italic" fill="#64748b">enclosure (still air)</text>

  <!-- Suspension wire from top -->
  <line x1="280" y1="50" x2="280" y2="135" stroke="#1a202c" stroke-width="0.8" />
  <text x="288" y="86" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568">torsion wire</text>

  <!-- Horizontal rod (rotated slightly to show twist; -8°) -->
  <g transform="rotate(-8 280 135)">
    <line x1="160" y1="135" x2="400" y2="135" stroke="#4a5568" stroke-width="3" />

    <!-- Small spheres at the ends -->
    <circle cx="160" cy="135" r="14" fill="url(#cav-small)" stroke="#1a202c" stroke-width="1" />
    <text x="160" y="139" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">m</text>

    <circle cx="400" cy="135" r="14" fill="url(#cav-small)" stroke="#1a202c" stroke-width="1" />
    <text x="400" y="139" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">m</text>

    <!-- Tiny mirror on rod -->
    <rect x="274" y="128" width="12" height="14" fill="#fef9c3" stroke="#1a202c" stroke-width="0.8" />
  </g>

  <!-- Large spheres (fixed, not rotated) -->
  <circle cx="120" cy="160" r="26" fill="url(#cav-large)" stroke="#1a202c" stroke-width="1.2" />
  <text x="120" y="165" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">M</text>

  <circle cx="440" cy="110" r="26" fill="url(#cav-large)" stroke="#1a202c" stroke-width="1.2" />
  <text x="440" y="115" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">M</text>

  <!-- Gravitational attraction arrows (small toward large) -->
  <line x1="146" y1="148" x2="172" y2="142" stroke="#7c3aed" stroke-width="2" marker-end="url(#cav-arr-twist)" />
  <line x1="414" y1="118" x2="388" y2="124" stroke="#7c3aed" stroke-width="2" marker-end="url(#cav-arr-twist)" />
  <text x="160" y="178" font="11px system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">F</text>
  <text x="400" y="98" font="11px system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">F</text>

  <!-- Twist indicator -->
  <path d="M 280 200 A 30 30 0 0 1 300 215" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#cav-arr-twist)" />
  <text x="320" y="220" font="11px system-ui" font-size="11" font-weight="700" fill="#dc2626">tiny twist θ</text>

  <!-- Light source + reflected beam -->
  <rect x="80" y="265" width="40" height="16" rx="2" fill="#fde68a" stroke="#1a202c" stroke-width="1" />
  <text x="100" y="277" font="10px system-ui" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">lamp</text>

  <line x1="120" y1="273" x2="265" y2="138" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="295" y1="138" x2="500" y2="265" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#cav-arr-light)" />

  <!-- Distant scale -->
  <line x1="430" y1="265" x2="510" y2="265" stroke="#1a202c" stroke-width="1.5" />
  <line x1="438" y1="265" x2="438" y2="272" stroke="#1a202c" stroke-width="0.8" />
  <line x1="454" y1="265" x2="454" y2="272" stroke="#1a202c" stroke-width="0.8" />
  <line x1="470" y1="265" x2="470" y2="272" stroke="#1a202c" stroke-width="0.8" />
  <line x1="486" y1="265" x2="486" y2="272" stroke="#1a202c" stroke-width="0.8" />
  <line x1="502" y1="265" x2="502" y2="272" stroke="#1a202c" stroke-width="0.8" />
  <text x="470" y="288" font="10px system-ui" font-size="10" fill="#1a202c" text-anchor="middle">scale  (deflection x)</text>

  <!-- Equation card -->
  <rect x="40" y="305" width="480" height="48" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2" />
  <text x="280" y="324" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">G  =  (κ θ · r²) / (2 · M · m · L)        Cavendish (1798) measured  G ≈ 6.74 × 10⁻¹¹  N·m²/kg²</text>
  <text x="280" y="343" font="10.5px system-ui" font-size="10.5" font-style="italic" fill="#15803d" text-anchor="middle">κ = wire torsion constant (from period of rod), L = half-rod length, θ = twist angle inferred from beam deflection x</text>
</svg>
