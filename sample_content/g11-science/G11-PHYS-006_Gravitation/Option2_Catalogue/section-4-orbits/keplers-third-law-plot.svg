<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-label="Kepler's third law shown as a log-log plot of orbital period versus semi-major axis for the eight planets">
  <title>Kepler's third law — log T vs log a for the solar system planets</title>
  <desc>Eight planets from Mercury to Neptune plotted on log10 axes. The semi-major axis a is in astronomical units and the orbital period T is in Earth years. The data points lie on a straight line of slope three over two, the signature of T squared proportional to a cubed.</desc>

  <rect x="60" y="32" width="390" height="238" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Vertical grid (log10 a from -0.5 to 1.5, every 0.5) -->
  <line x1="60" y1="32" x2="60" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="60" y="284" font-family="system-ui" font-size="11" fill="#4a5568" text-anchor="middle">−0.5</text>
  <line x1="152.86" y1="32" x2="152.86" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="152.86" y="284" font-family="system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0</text>
  <line x1="245.71" y1="32" x2="245.71" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="245.71" y="284" font-family="system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0.5</text>
  <line x1="338.57" y1="32" x2="338.57" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="338.57" y="284" font-family="system-ui" font-size="11" fill="#4a5568" text-anchor="middle">1.0</text>
  <line x1="431.43" y1="32" x2="431.43" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="431.43" y="284" font-family="system-ui" font-size="11" fill="#4a5568" text-anchor="middle">1.5</text>

  <!-- Horizontal grid (log10 T from -0.5 to 2.0, every 0.5) -->
  <line x1="60" y1="247.69" x2="450" y2="247.69" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="251.69" font-family="system-ui" font-size="11" fill="#4a5568" text-anchor="end">−0.5</text>
  <line x1="60" y1="210.50" x2="450" y2="210.50" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="214.50" font-family="system-ui" font-size="11" fill="#4a5568" text-anchor="end">0</text>
  <line x1="60" y1="173.31" x2="450" y2="173.31" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="177.31" font-family="system-ui" font-size="11" fill="#4a5568" text-anchor="end">0.5</text>
  <line x1="60" y1="136.13" x2="450" y2="136.13" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="140.13" font-family="system-ui" font-size="11" fill="#4a5568" text-anchor="end">1.0</text>
  <line x1="60" y1="98.94" x2="450" y2="98.94" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="102.94" font-family="system-ui" font-size="11" fill="#4a5568" text-anchor="end">1.5</text>
  <line x1="60" y1="61.75" x2="450" y2="61.75" stroke="#e2e8f0" stroke-width="0.6" />
  <text x="54" y="65.75" font-family="system-ui" font-size="11" fill="#4a5568" text-anchor="end">2.0</text>

  <line x1="60" y1="270" x2="450" y2="270" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="60" y1="32" x2="60" y2="270" stroke="#94a3b8" stroke-width="1.2" />

  <text x="255" y="302" font-family="system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle">log₁₀ a   (semi-major axis, AU)</text>
  <text x="24" y="151" font-family="system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle" transform="rotate(-90 24 151)">log₁₀ T   (orbital period, Earth years)</text>

  <text x="255" y="20" font-family="system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Kepler's third law:  T²  ∝  a³   (slope of log–log line = 3/2)</text>

  <!-- Best-fit line: slope 3/2 through origin (Earth at 0,0) -->
  <line x1="60" y1="266.28" x2="450" y2="43.16" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" />

  <!-- Slope label on line -->
  <text x="160" y="223" font-family="system-ui" font-size="11" font-style="italic" fill="#4a5568" transform="rotate(-30 160 223)">slope = 3/2</text>

  <!-- Data points (filled circles + planet labels) -->
  <!-- Mercury -->
  <circle cx="76.9" cy="256.6" r="4.5" fill="#7c3aed" stroke="#1a202c" stroke-width="0.8" />
  <text x="78" y="251" font-family="system-ui" font-size="10.5" font-weight="600" fill="#1a202c">Mercury</text>

  <!-- Venus -->
  <circle cx="126.3" cy="226.0" r="4.5" fill="#7c3aed" stroke="#1a202c" stroke-width="0.8" />
  <text x="132" y="222" font-family="system-ui" font-size="10.5" font-weight="600" fill="#1a202c">Venus</text>

  <!-- Earth -->
  <circle cx="152.9" cy="210.5" r="5" fill="#dc2626" stroke="#1a202c" stroke-width="0.8" />
  <text x="158" y="207" font-family="system-ui" font-size="10.5" font-weight="700" fill="#dc2626">Earth (1, 1)</text>

  <!-- Mars -->
  <circle cx="186.6" cy="190.1" r="4.5" fill="#dd6b20" stroke="#1a202c" stroke-width="0.8" />
  <text x="192" y="187" font-family="system-ui" font-size="10.5" font-weight="600" fill="#1a202c">Mars</text>

  <!-- Jupiter -->
  <circle cx="285.8" cy="130.6" r="5" fill="#7c3aed" stroke="#1a202c" stroke-width="0.8" />
  <text x="292" y="128" font-family="system-ui" font-size="10.5" font-weight="600" fill="#1a202c">Jupiter</text>

  <!-- Saturn -->
  <circle cx="335.0" cy="101.2" r="4.5" fill="#7c3aed" stroke="#1a202c" stroke-width="0.8" />
  <text x="341" y="98" font-family="system-ui" font-size="10.5" font-weight="600" fill="#1a202c">Saturn</text>

  <!-- Uranus -->
  <circle cx="391.3" cy="67.4" r="4.5" fill="#7c3aed" stroke="#1a202c" stroke-width="0.8" />
  <text x="354" y="64" font-family="system-ui" font-size="10.5" font-weight="600" fill="#1a202c">Uranus</text>

  <!-- Neptune -->
  <circle cx="427.4" cy="45.6" r="4.5" fill="#7c3aed" stroke="#1a202c" stroke-width="0.8" />
  <text x="386" y="42" font-family="system-ui" font-size="10.5" font-weight="600" fill="#1a202c">Neptune</text>

  <!-- Equation card -->
  <rect x="70" y="46" width="170" height="58" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2" />
  <text x="155" y="64" font-family="system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">T² = (4π² / GM_☉) · a³</text>
  <text x="155" y="80" font-family="system-ui" font-size="11" font-style="italic" fill="#15803d" text-anchor="middle">log T = (3/2) log a + const</text>
  <text x="155" y="96" font-family="system-ui" font-size="10.5" fill="#4a5568" text-anchor="middle">Solar units: const = 0  ⇒  T = a^(3/2)</text>

  <text x="240" y="320" font-family="system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Eight independent planets, eight points on one straight line — strong evidence Newton's gravity is the same law everywhere in the solar system.</text>
  <text x="240" y="334" font-family="system-ui" font-size="10" fill="#64748b" text-anchor="middle">Data: a in AU, T in Earth years.   Mercury 0.39, 0.24  ·  Earth 1, 1  ·  Jupiter 5.20, 11.86  ·  Neptune 30.05, 164.79.</text>
</svg>
