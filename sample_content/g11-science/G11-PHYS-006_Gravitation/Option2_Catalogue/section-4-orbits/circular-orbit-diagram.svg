<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Satellite in circular orbit with gravitational force toward planet and tangential velocity">
  <title>Circular orbit — centripetal force = gravity</title>
  <desc>A satellite at orbital radius r from the centre of a planet. Gravity points radially inward and acts as the centripetal force; velocity v is tangential to the orbit. Setting gravity equal to the centripetal requirement gives v equals square root of G M over r.</desc>

  <defs>
    <radialGradient id="orb-planet" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#bee3f8" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
    <marker id="orb-arr-grav" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
    <marker id="orb-arr-vel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dd6b20" />
    </marker>
  </defs>

  <text x="240" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Circular Orbit — gravity provides the centripetal force</text>

  <!-- Background star sparkles -->
  <g fill="#94a3b8">
    <circle cx="60" cy="60" r="0.8" />
    <circle cx="420" cy="80" r="1.0" />
    <circle cx="100" cy="280" r="0.8" />
    <circle cx="380" cy="260" r="0.8" />
    <circle cx="200" cy="40" r="0.8" />
    <circle cx="430" cy="180" r="1.0" />
    <circle cx="80" cy="200" r="0.8" />
    <circle cx="350" cy="40" r="0.8" />
  </g>

  <!-- Planet at centre (240, 200) -->
  <circle cx="240" cy="200" r="40" fill="url(#orb-planet)" stroke="#1a202c" stroke-width="1.2" />
  <text x="240" y="206" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">M</text>

  <!-- Orbit (radius 110) -->
  <circle cx="240" cy="200" r="110" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Satellite at angle 30° above horizontal (right side) — position: (240 + 110*cos(-30°), 200 + 110*sin(-30°)) = (240 + 95.26, 200 - 55) = (335.26, 145) -->
  <g transform="translate(335.26, 145)">
    <rect x="-12" y="-7" width="24" height="14" fill="#cbd5e0" stroke="#1a202c" stroke-width="1.2" rx="2" />
    <!-- Solar panels -->
    <rect x="-26" y="-3" width="12" height="6" fill="#1e3a8a" stroke="#1a202c" stroke-width="0.8" />
    <rect x="14" y="-3" width="12" height="6" fill="#1e3a8a" stroke="#1a202c" stroke-width="0.8" />
    <text x="0" y="-13" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">m</text>
  </g>

  <!-- Gravitational force F = mg radially inward from satellite toward planet centre -->
  <!-- Satellite at (335.26, 145), planet at (240, 200). Direction (-95.26, 55) normalised. -->
  <!-- Length 50 -->
  <line x1="335.26" y1="145" x2="291.0" y2="170.6" stroke="#7c3aed" stroke-width="3" marker-end="url(#orb-arr-grav)" />
  <text x="320" y="178" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#7c3aed">F_grav</text>
  <text x="335" y="195" font="11px system-ui" font-size="11" font-style="italic" fill="#7c3aed" text-anchor="middle">= G M m / r²</text>

  <!-- Velocity v tangential — perpendicular to r, in counter-clockwise direction.
       Tangent direction: rotate r-hat by 90° CCW: from (-95.26,55) (inward) — outward is (95.26,-55). Tangent CCW from r-hat is (-55, -95.26) normalised... actually:
       Position vector from centre: (95.26, -55). Tangent perpendicular CCW: rotate by 90° → (55, 95.26). For "counter-clockwise" we want negative rotation in screen coords (y inverts), so tangent is (-55, -95.26) normalised which points up-left.
       Actually for a satellite moving counter-clockwise on screen (upper-right going up-and-left), tangent is (-sin(theta), -cos(theta)) for theta measured from +x axis. theta = -30° (because y is up-down flipped). Let's just place v pointing up-left, magnitude 60 px. -->
  <line x1="335.26" y1="145" x2="307.5" y2="92.5" stroke="#dd6b20" stroke-width="3" marker-end="url(#orb-arr-vel)" />
  <text x="290" y="86" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dd6b20">v</text>
  <text x="290" y="100" font="11px system-ui" font-size="11" font-style="italic" fill="#dd6b20">tangential</text>

  <!-- Radius r marker from centre to satellite -->
  <line x1="240" y1="200" x2="335.26" y2="145" stroke="#1a202c" stroke-width="0.8" stroke-dasharray="2 2" />
  <text x="295" y="166" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">r</text>

  <!-- Equation card -->
  <rect x="40" y="290" width="400" height="58" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2" />
  <text x="240" y="309" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">G M m / r²  =  m v² / r        (gravity = centripetal force)</text>
  <text x="240" y="328" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">v_orbit  =  √( G M / r )</text>
  <text x="240" y="343" font="10.5px system-ui" font-size="10.5" font-style="italic" fill="#15803d" text-anchor="middle">Orbital speed depends only on the central mass M and the radius r — not on the satellite's mass m.</text>
</svg>
