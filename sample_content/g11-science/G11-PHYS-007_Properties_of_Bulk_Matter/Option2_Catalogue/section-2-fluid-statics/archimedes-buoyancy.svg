<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="Archimedes' Principle: Buoyant Force">
  <title>Archimedes' Principle — Buoyant Force</title>
  <desc>A solid block partially submerged in a fluid. The buoyant force F_B acting upward equals the weight of the fluid displaced by the submerged volume: F_B = ρ_fluid · V_displaced · g. Weight W acts downward.</desc>

  <text x="280" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Archimedes' Principle:  F_B = ρ_fluid · V_displaced · g</text>

  <defs>
    <marker id="ar-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" />
    </marker>
    <marker id="ar-dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <linearGradient id="ar-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <path d="M 50 70 L 50 270 L 320 270 L 320 70" fill="none" stroke="#1a202c" stroke-width="2.5" />

  <!-- Water -->
  <rect x="52" y="120" width="266" height="150" fill="url(#ar-water)" />

  <!-- Surface line -->
  <line x1="50" y1="120" x2="320" y2="120" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="56" y="115" font-size="10" font-weight="700" fill="#1d4ed8">surface</text>

  <!-- Block: half-submerged. Block top at y=90, bottom at y=210 -->
  <rect x="160" y="90" width="100" height="120" fill="#fde68a" stroke="#7c2d12" stroke-width="2.5" />
  <text x="210" y="155" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">block</text>
  <text x="210" y="172" font-size="11" fill="#7c2d12" text-anchor="middle">density ρ_object</text>

  <!-- Submerged-volume highlight (overlay between water surface y=120 and block bottom y=210) -->
  <rect x="160" y="120" width="100" height="90" fill="#3b82f6" opacity="0.32" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="210" y="200" font-size="10" font-style="italic" fill="#1d4ed8" text-anchor="middle">V_displaced</text>

  <!-- Weight arrow (centre of block, downward) -->
  <line x1="210" y1="150" x2="210" y2="244" stroke="#dc2626" stroke-width="4" marker-end="url(#ar-dn)" />
  <text x="222" y="244" font-size="14" font-weight="700" fill="#dc2626">W = m g</text>

  <!-- Buoyant force arrow (centre of block, upward, from below the displaced volume centroid) -->
  <line x1="190" y1="200" x2="190" y2="60" stroke="#15803d" stroke-width="4.5" marker-end="url(#ar-up)" />
  <text x="125" y="58" font-size="14" font-weight="700" fill="#15803d">F_B</text>

  <!-- Right panel -->
  <rect x="350" y="70" width="200" height="220" rx="8" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="450" y="92" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Three Cases</text>

  <!-- Case 1: floats -->
  <circle cx="370" cy="118" r="6" fill="#15803d" />
  <text x="382" y="116" font-size="12" font-weight="700" fill="#15803d">ρ_object &lt; ρ_fluid</text>
  <text x="382" y="130" font-size="10" fill="#4a5568">→ floats (partially submerged)</text>

  <!-- Case 2: neutral -->
  <circle cx="370" cy="160" r="6" fill="#1d4ed8" />
  <text x="382" y="158" font-size="12" font-weight="700" fill="#1d4ed8">ρ_object = ρ_fluid</text>
  <text x="382" y="172" font-size="10" fill="#4a5568">→ neutral (anywhere)</text>

  <!-- Case 3: sinks -->
  <circle cx="370" cy="202" r="6" fill="#dc2626" />
  <text x="382" y="200" font-size="12" font-weight="700" fill="#dc2626">ρ_object &gt; ρ_fluid</text>
  <text x="382" y="214" font-size="10" fill="#4a5568">→ sinks to bottom</text>

  <!-- Equilibrium for floating -->
  <line x1="360" y1="232" x2="540" y2="232" stroke="#cbd5e1" stroke-width="1" />
  <text x="370" y="252" font-size="11" fill="#1a202c">When floating in equilibrium:</text>
  <text x="370" y="272" font-size="13" font-weight="700" fill="#1a202c">F_B = W</text>

  <text x="280" y="312" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">A submerged or floating body experiences an upward force equal to the weight of fluid it displaces.</text>
</svg>
