<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Pascal's Principle: Hydraulic Press">
  <title>Pascal's Principle — Hydraulic Press</title>
  <desc>A small force F1 on a small piston of area A1 is transmitted through an incompressible fluid to a large piston of area A2, lifting a much larger force F2. Pressure is equal at both pistons: F1/A1 = F2/A2.</desc>

  <text x="300" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Pascal's Principle: Hydraulic Press   F₁ / A₁ = F₂ / A₂</text>

  <defs>
    <marker id="ph-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="ph-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" />
    </marker>
  </defs>

  <!-- U-shaped fluid container outline -->
  <!-- left cylinder small -->
  <path d="M 80 90 L 80 250 L 220 250 L 220 90"
        fill="none" stroke="#1a202c" stroke-width="2.5" />
  <!-- horizontal connector -->
  <line x1="220" y1="250" x2="380" y2="250" stroke="#1a202c" stroke-width="2.5" />
  <!-- right cylinder large -->
  <path d="M 380 250 L 380 90 M 520 250 L 520 90"
        fill="none" stroke="#1a202c" stroke-width="2.5" />

  <!-- Fluid (blue) -->
  <path d="M 80 130 L 80 250 L 220 250 L 220 230 L 380 230 L 380 90 L 520 90 L 520 250 L 380 250 L 380 230 L 220 230 L 220 130 L 80 130"
        fill="#bfdbfe" />

  <!-- Note: simpler approach: fill rectangles -->
  <rect x="82" y="130" width="136" height="120" fill="#bfdbfe" />
  <rect x="220" y="180" width="160" height="70" fill="#bfdbfe" />
  <rect x="382" y="100" width="136" height="150" fill="#bfdbfe" />

  <!-- Re-draw walls on top so fill doesn't bleed -->
  <path d="M 80 90 L 80 250 L 220 250 L 220 90"
        fill="none" stroke="#1a202c" stroke-width="2.5" />
  <line x1="220" y1="250" x2="380" y2="250" stroke="#1a202c" stroke-width="2.5" />
  <path d="M 380 90 L 380 250" fill="none" stroke="#1a202c" stroke-width="2.5" />
  <path d="M 520 90 L 520 250" fill="none" stroke="#1a202c" stroke-width="2.5" />

  <!-- Small piston (left) -->
  <rect x="80" y="118" width="140" height="14" fill="#94a3b8" stroke="#1a202c" stroke-width="1.5" />
  <text x="150" y="129" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">A₁</text>
  <!-- A1 width arrow -->
  <line x1="80" y1="142" x2="220" y2="142" stroke="#4a5568" stroke-width="1" />
  <line x1="80" y1="138" x2="80" y2="146" stroke="#4a5568" stroke-width="1" />
  <line x1="220" y1="138" x2="220" y2="146" stroke="#4a5568" stroke-width="1" />
  <text x="150" y="156" font-size="10" fill="#4a5568" text-anchor="middle">small area A₁</text>

  <!-- Large piston (right) -->
  <rect x="380" y="88" width="140" height="14" fill="#94a3b8" stroke="#1a202c" stroke-width="1.5" />
  <text x="450" y="99" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">A₂</text>
  <line x1="380" y1="78" x2="520" y2="78" stroke="#4a5568" stroke-width="1" />
  <line x1="380" y1="74" x2="380" y2="82" stroke="#4a5568" stroke-width="1" />
  <line x1="520" y1="74" x2="520" y2="82" stroke="#4a5568" stroke-width="1" />
  <text x="450" y="70" font-size="10" fill="#4a5568" text-anchor="middle">large area A₂</text>

  <!-- F1 down arrow on small piston -->
  <line x1="150" y1="60" x2="150" y2="113" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ph-red)" />
  <text x="155" y="58" font-size="14" font-weight="700" fill="#dc2626">F₁  (small input)</text>

  <!-- F2 up arrow from big piston -->
  <line x1="450" y1="135" x2="450" y2="108" stroke="#15803d" stroke-width="4.5" marker-end="url(#ph-grn)" />
  <text x="458" y="138" font-size="14" font-weight="700" fill="#15803d">F₂  (large output)</text>

  <!-- Arc / connecting transmission arrow inside fluid -->
  <text x="300" y="212" font-size="11" fill="#1d4ed8" font-style="italic" text-anchor="middle">incompressible fluid (same P everywhere at same depth)</text>

  <!-- Equations panel -->
  <rect x="60" y="270" width="500" height="40" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="80" y="288" font-size="13" fill="#1a202c">Pressure equality:</text>
  <text x="200" y="290" font-size="14" font-weight="700" fill="#dc2626">F₁ / A₁</text>
  <text x="270" y="290" font-size="14" font-weight="700" fill="#1a202c">=</text>
  <text x="290" y="290" font-size="14" font-weight="700" fill="#15803d">F₂ / A₂</text>
  <text x="360" y="290" font-size="13" fill="#1a202c">→ mechanical advantage =</text>
  <text x="525" y="290" font-size="14" font-weight="700" fill="#1d4ed8">A₂ / A₁</text>
  <text x="80" y="304" font-size="11" font-style="italic" fill="#4a5568">A pressure applied to a confined fluid is transmitted undiminished throughout the fluid.</text>
</svg>
