<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img" aria-label="Shear modulus and bulk modulus diagrams">
  <title>Shear Stress and Bulk Stress</title>
  <desc>Left: a block deformed by a tangential force F producing shear strain φ = Δx/L; shear modulus G = (F/A)/φ. Right: a body compressed equally on all sides by pressure ΔP producing fractional volume change ΔV/V; bulk modulus K = -ΔP / (ΔV/V).</desc>

  <text x="280" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Two Other Moduli: Shear (G) and Bulk (K)</text>

  <defs>
    <marker id="el-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="el-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- =============== Left panel: Shear =============== -->
  <text x="140" y="50" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Shear deformation</text>

  <!-- Floor -->
  <line x1="40" y1="220" x2="240" y2="220" stroke="#1a202c" stroke-width="2" />
  <g stroke="#1a202c" stroke-width="1.2">
    <line x1="48" y1="220" x2="38" y2="232" />
    <line x1="68" y1="220" x2="58" y2="232" />
    <line x1="88" y1="220" x2="78" y2="232" />
    <line x1="108" y1="220" x2="98" y2="232" />
    <line x1="128" y1="220" x2="118" y2="232" />
    <line x1="148" y1="220" x2="138" y2="232" />
    <line x1="168" y1="220" x2="158" y2="232" />
    <line x1="188" y1="220" x2="178" y2="232" />
    <line x1="208" y1="220" x2="198" y2="232" />
    <line x1="228" y1="220" x2="218" y2="232" />
  </g>

  <!-- Original block (dashed outline) -->
  <rect x="60" y="100" width="120" height="120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" />

  <!-- Sheared block (parallelogram): top shifted right by 30 px -->
  <polygon points="60,220 180,220 210,100 90,100" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2" />

  <!-- Tangential force F at top -->
  <line x1="115" y1="92" x2="200" y2="92" stroke="#dc2626" stroke-width="3.5" marker-end="url(#el-red)" />
  <text x="158" y="84" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">F</text>

  <!-- Shear angle φ -->
  <path d="M 90 110 A 14 14 0 0 0 76 124" fill="none" stroke="#15803d" stroke-width="1.5" />
  <text x="76" y="108" font-size="12" font-weight="700" fill="#15803d">φ</text>

  <!-- Δx label -->
  <line x1="60" y1="92" x2="90" y2="92" stroke="#1a202c" stroke-width="1" />
  <text x="75" y="78" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Δx</text>

  <!-- L label -->
  <line x1="225" y1="100" x2="225" y2="220" stroke="#1a202c" stroke-width="1" />
  <text x="232" y="164" font-size="11" font-weight="700" fill="#1a202c">L</text>

  <!-- Equations -->
  <text x="40" y="252" font-size="11" fill="#1a202c">shear strain  φ = Δx / L</text>
  <text x="40" y="268" font-size="11" font-weight="700" fill="#dc2626">G = (F/A) / φ</text>

  <!-- =============== Divider =============== -->
  <line x1="290" y1="40" x2="290" y2="270" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" />

  <!-- =============== Right panel: Bulk =============== -->
  <text x="430" y="50" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Bulk (volumetric) deformation</text>

  <!-- Original cube outline -->
  <rect x="380" y="100" width="120" height="120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" />

  <!-- Compressed cube -->
  <rect x="400" y="120" width="80" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2" />
  <text x="440" y="165" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">V − ΔV</text>

  <!-- Pressure arrows pointing inward -->
  <line x1="440" y1="78" x2="440" y2="115" stroke="#1d4ed8" stroke-width="3" marker-end="url(#el-blu)" />
  <text x="440" y="72" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">ΔP</text>

  <line x1="440" y1="242" x2="440" y2="205" stroke="#1d4ed8" stroke-width="3" marker-end="url(#el-blu)" />
  <text x="440" y="258" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">ΔP</text>

  <line x1="358" y1="160" x2="395" y2="160" stroke="#1d4ed8" stroke-width="3" marker-end="url(#el-blu)" />
  <text x="350" y="164" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="end">ΔP</text>

  <line x1="522" y1="160" x2="485" y2="160" stroke="#1d4ed8" stroke-width="3" marker-end="url(#el-blu)" />
  <text x="530" y="164" font-size="12" font-weight="700" fill="#1d4ed8">ΔP</text>

  <!-- Equation -->
  <text x="320" y="252" font-size="11" fill="#1a202c">vol. strain  ΔV / V</text>
  <text x="320" y="268" font-size="11" font-weight="700" fill="#1d4ed8">K = −ΔP / (ΔV / V)</text>
</svg>
