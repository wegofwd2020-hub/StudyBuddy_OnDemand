<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-label="Stress-Strain Curve with Elastic and Plastic Regions">
  <title>Stress-Strain Curve</title>
  <desc>Engineering stress vs strain curve for a ductile metal. Marks proportional limit, elastic limit, yield point, ultimate stress, and fracture point. Slope of the linear portion is Young's modulus E.</desc>

  <text x="280" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Stress–Strain Curve (ductile metal)</text>

  <!-- Plot area -->
  <rect x="70" y="40" width="450" height="260" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Grid lines -->
  <g stroke="#e2e8f0" stroke-width="0.6">
    <line x1="160" y1="40" x2="160" y2="300" />
    <line x1="250" y1="40" x2="250" y2="300" />
    <line x1="340" y1="40" x2="340" y2="300" />
    <line x1="430" y1="40" x2="430" y2="300" />
    <line x1="520" y1="40" x2="520" y2="300" />
    <line x1="70" y1="248" x2="520" y2="248" />
    <line x1="70" y1="196" x2="520" y2="196" />
    <line x1="70" y1="144" x2="520" y2="144" />
    <line x1="70" y1="92" x2="520" y2="92" />
  </g>

  <!-- Axes -->
  <line x1="70" y1="300" x2="520" y2="300" stroke="#1a202c" stroke-width="1.5" />
  <line x1="70" y1="40" x2="70" y2="300" stroke="#1a202c" stroke-width="1.5" />

  <!-- Axis labels -->
  <text x="295" y="332" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle">Strain  ε = ΔL / L₀</text>
  <text x="22" y="170" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle" transform="rotate(-90 22 170)">Stress  σ = F / A  (Pa)</text>

  <!-- Curve: piecewise -->
  <!-- Elastic linear: (70,300) → (180,170) [proportional limit P] -->
  <line x1="70" y1="300" x2="180" y2="170" stroke="#2b6cb0" stroke-width="3.5" stroke-linecap="round" />
  <!-- Slight curve to elastic limit E: (180,170) → (210,150) -->
  <path d="M 180 170 Q 195 158 210 150" fill="none" stroke="#2b6cb0" stroke-width="3.5" stroke-linecap="round" />
  <!-- Yield plateau: (210,150) → (260,148) -->
  <path d="M 210 150 Q 235 152 260 148" fill="none" stroke="#dd6b20" stroke-width="3.5" stroke-linecap="round" />
  <!-- Strain hardening to ultimate U: (260,148) → (400,80) -->
  <path d="M 260 148 Q 320 100 400 80" fill="none" stroke="#dd6b20" stroke-width="3.5" stroke-linecap="round" />
  <!-- Necking down to fracture F: (400,80) → (480,140) -->
  <path d="M 400 80 Q 440 105 480 140" fill="none" stroke="#dd6b20" stroke-width="3.5" stroke-linecap="round" />
  <!-- Fracture marker -->
  <text x="490" y="135" font-size="22" font-weight="700" fill="#c53030">×</text>

  <!-- Region shading -->
  <rect x="70" y="40" width="140" height="260" fill="#dbeafe" opacity="0.25" />
  <rect x="210" y="40" width="310" height="260" fill="#fed7aa" opacity="0.18" />

  <!-- Key points -->
  <circle cx="180" cy="170" r="5" fill="#1d4ed8" />
  <text x="142" y="190" font-size="11" font-weight="700" fill="#1d4ed8">P (prop. limit)</text>

  <circle cx="210" cy="150" r="5" fill="#1d4ed8" />
  <text x="218" y="142" font-size="11" font-weight="700" fill="#1d4ed8">E (elastic limit)</text>

  <circle cx="260" cy="148" r="5" fill="#dc2626" />
  <text x="266" y="166" font-size="11" font-weight="700" fill="#dc2626">Y (yield)</text>

  <circle cx="400" cy="80" r="6" fill="#dc2626" />
  <text x="370" y="68" font-size="11" font-weight="700" fill="#dc2626">U (ultimate σ_max)</text>

  <circle cx="480" cy="140" r="6" fill="#7c2d12" />
  <text x="488" y="160" font-size="11" font-weight="700" fill="#7c2d12">F (fracture)</text>

  <!-- Region labels -->
  <text x="140" y="62" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">ELASTIC</text>
  <text x="140" y="78" font-size="10" fill="#1d4ed8" text-anchor="middle">σ ∝ ε  (Hooke)</text>

  <text x="365" y="62" font-size="12" font-weight="700" fill="#9a3412" text-anchor="middle">PLASTIC</text>
  <text x="365" y="78" font-size="10" fill="#9a3412" text-anchor="middle">permanent deformation</text>

  <!-- Slope annotation -->
  <line x1="100" y1="265" x2="135" y2="225" stroke="#15803d" stroke-width="1.3" stroke-dasharray="4 3" />
  <text x="105" y="220" font-size="12" font-weight="700" fill="#15803d">slope = E</text>
  <text x="105" y="236" font-size="10" fill="#15803d">(Young's modulus)</text>

  <text x="280" y="352" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Below the elastic limit the material returns to its original length when load is removed.</text>
</svg>
