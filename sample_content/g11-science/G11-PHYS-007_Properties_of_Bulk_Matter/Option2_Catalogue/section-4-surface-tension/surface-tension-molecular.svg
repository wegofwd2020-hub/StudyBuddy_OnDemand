<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320" role="img" aria-label="Surface Tension: Molecular forces at and below surface">
  <title>Surface Tension — Molecular Forces</title>
  <desc>A liquid below its surface. A molecule deep in the bulk has cohesive forces from neighbours in every direction (net force zero). A molecule at the surface has no neighbours above, leaving a net inward (downward) force that creates the elastic skin we measure as surface tension.</desc>

  <text x="270" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Surface Tension — why a liquid surface acts like a stretched skin</text>

  <defs>
    <marker id="st-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="st-arr-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <linearGradient id="st-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <path d="M 60 60 L 60 270 L 480 270 L 480 60" fill="none" stroke="#1a202c" stroke-width="2.5" />
  <rect x="62" y="90" width="416" height="180" fill="url(#st-water)" />

  <!-- Surface line -->
  <line x1="60" y1="90" x2="480" y2="90" stroke="#1d4ed8" stroke-width="2" />
  <text x="270" y="80" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">liquid surface (the "skin")</text>

  <!-- Surface molecule (left), with arrows pointing only sideways and down -->
  <circle cx="170" cy="105" r="14" fill="#fde68a" stroke="#dc2626" stroke-width="2.5" />
  <text x="170" y="110" font-size="11" font-weight="700" fill="#7c2d12" text-anchor="middle">A</text>

  <!-- Arrows from surface molecule: down-left, down, down-right (no upward — air above) -->
  <line x1="170" y1="119" x2="155" y2="155" stroke="#dc2626" stroke-width="2" marker-end="url(#st-arr)" />
  <line x1="170" y1="119" x2="170" y2="160" stroke="#dc2626" stroke-width="2.5" marker-end="url(#st-arr)" />
  <line x1="170" y1="119" x2="185" y2="155" stroke="#dc2626" stroke-width="2" marker-end="url(#st-arr)" />
  <!-- horizontal sideways arrows -->
  <line x1="156" y1="105" x2="125" y2="105" stroke="#dc2626" stroke-width="2" marker-end="url(#st-arr)" />
  <line x1="184" y1="105" x2="215" y2="105" stroke="#dc2626" stroke-width="2" marker-end="url(#st-arr)" />

  <!-- Net force label for A -->
  <line x1="240" y1="105" x2="240" y2="155" stroke="#7c2d12" stroke-width="3.5" marker-end="url(#st-arr)" />
  <text x="247" y="135" font-size="12" font-weight="700" fill="#7c2d12">net F_A ≠ 0  (inward)</text>

  <!-- Bulk molecule (deep) -->
  <circle cx="350" cy="200" r="14" fill="#fde68a" stroke="#1d4ed8" stroke-width="2.5" />
  <text x="350" y="205" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">B</text>

  <!-- Arrows from bulk molecule: in all 8 directions (balanced) -->
  <line x1="350" y1="186" x2="350" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#st-arr-blu)" />
  <line x1="350" y1="214" x2="350" y2="240" stroke="#1d4ed8" stroke-width="2" marker-end="url(#st-arr-blu)" />
  <line x1="336" y1="200" x2="310" y2="200" stroke="#1d4ed8" stroke-width="2" marker-end="url(#st-arr-blu)" />
  <line x1="364" y1="200" x2="390" y2="200" stroke="#1d4ed8" stroke-width="2" marker-end="url(#st-arr-blu)" />
  <line x1="340" y1="190" x2="320" y2="170" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#st-arr-blu)" />
  <line x1="360" y1="190" x2="380" y2="170" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#st-arr-blu)" />
  <line x1="340" y1="210" x2="320" y2="230" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#st-arr-blu)" />
  <line x1="360" y1="210" x2="380" y2="230" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#st-arr-blu)" />

  <!-- Net force label for B -->
  <text x="270" y="208" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="end">net F_B = 0</text>
  <text x="270" y="224" font-size="10" fill="#1e3a8a" text-anchor="end">(balanced)</text>

  <!-- Equation panel -->
  <rect x="60" y="285" width="420" height="22" rx="5" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="70" y="300" font-size="11" fill="#1a202c">Surface tension</text>
  <text x="155" y="301" font-size="13" font-weight="700" fill="#1d4ed8">σ = F / L</text>
  <text x="225" y="300" font-size="11" fill="#1a202c">(force per unit length along the surface; SI: N/m)</text>

  <text x="270" y="316" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Surface molecules have higher potential energy → liquid minimises surface area (drops are spherical).</text>
</svg>
