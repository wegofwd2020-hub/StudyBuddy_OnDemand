<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320" role="img" aria-label="Capillary Rise of Water and Depression of Mercury">
  <title>Capillary Action — Rise and Depression</title>
  <desc>Two thin tubes dipped in different liquids. Water (wetting, contact angle &lt; 90°) climbs up the tube above the bulk surface. Mercury (non-wetting, contact angle &gt; 90°) is pushed down below the surface. Height h = 2σ cos θ / (ρ g r).</desc>

  <text x="290" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Capillary Rise / Depression:  h = (2σ cos θ) / (ρ g r)</text>

  <defs>
    <linearGradient id="cap-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cap-merc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <marker id="cap-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c" />
    </marker>
    <marker id="cap-arr-l" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#1a202c" />
    </marker>
  </defs>

  <!-- =============== LEFT: WATER (rise) =============== -->
  <text x="150" y="50" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Water — wetting (rises)</text>

  <!-- Beaker -->
  <path d="M 60 200 L 60 280 L 240 280 L 240 200" fill="none" stroke="#1a202c" stroke-width="2.5" />
  <rect x="62" y="205" width="176" height="75" fill="url(#cap-water)" />
  <line x1="60" y1="205" x2="240" y2="205" stroke="#1d4ed8" stroke-width="1.2" />

  <!-- Capillary tube (vertical, narrow) -->
  <line x1="135" y1="80" x2="135" y2="280" stroke="#1a202c" stroke-width="2" />
  <line x1="165" y1="80" x2="165" y2="280" stroke="#1a202c" stroke-width="2" />

  <!-- Water inside tube risen above surface to y=140 -->
  <rect x="135" y="140" width="30" height="140" fill="url(#cap-water)" />
  <!-- Concave meniscus inside tube -->
  <path d="M 135 140 Q 150 122 165 140" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5" />

  <!-- Surface line in beaker -->
  <line x1="62" y1="205" x2="135" y2="205" stroke="#1d4ed8" stroke-width="1.2" />
  <line x1="165" y1="205" x2="238" y2="205" stroke="#1d4ed8" stroke-width="1.2" />

  <!-- h dimension -->
  <line x1="200" y1="140" x2="200" y2="205" stroke="#15803d" stroke-width="1.5" marker-start="url(#cap-arr-l)" marker-end="url(#cap-arr)" />
  <text x="207" y="178" font-size="13" font-weight="700" fill="#15803d">h</text>

  <!-- Contact angle θ (acute) -->
  <text x="115" y="135" font-size="11" font-weight="700" fill="#dc2626">θ &lt; 90°</text>
  <path d="M 137 142 A 8 8 0 0 0 142 152" fill="none" stroke="#dc2626" stroke-width="1.5" />

  <!-- Tube radius label -->
  <line x1="135" y1="92" x2="165" y2="92" stroke="#1a202c" stroke-width="1" />
  <text x="150" y="86" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">2r</text>

  <!-- =============== Divider =============== -->
  <line x1="290" y1="40" x2="290" y2="290" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" />

  <!-- =============== RIGHT: MERCURY (depression) =============== -->
  <text x="430" y="50" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">Mercury — non-wetting (depressed)</text>

  <!-- Beaker -->
  <path d="M 340 200 L 340 280 L 520 280 L 520 200" fill="none" stroke="#1a202c" stroke-width="2.5" />
  <rect x="342" y="205" width="176" height="75" fill="url(#cap-merc)" />
  <line x1="340" y1="205" x2="520" y2="205" stroke="#475569" stroke-width="1.2" />

  <!-- Capillary tube -->
  <line x1="415" y1="80" x2="415" y2="280" stroke="#1a202c" stroke-width="2" />
  <line x1="445" y1="80" x2="445" y2="280" stroke="#1a202c" stroke-width="2" />

  <!-- Mercury inside tube DEPRESSED to y=240 -->
  <rect x="415" y="240" width="30" height="40" fill="url(#cap-merc)" />
  <!-- Convex meniscus (bulges upward) -->
  <path d="M 415 240 Q 430 252 445 240" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />

  <!-- Surface lines outside the tube -->
  <line x1="342" y1="205" x2="415" y2="205" stroke="#475569" stroke-width="1.2" />
  <line x1="445" y1="205" x2="518" y2="205" stroke="#475569" stroke-width="1.2" />

  <!-- h dimension (negative, below surface) -->
  <line x1="478" y1="205" x2="478" y2="240" stroke="#dc2626" stroke-width="1.5" marker-start="url(#cap-arr-l)" marker-end="url(#cap-arr)" />
  <text x="485" y="226" font-size="12" font-weight="700" fill="#dc2626">|h|</text>

  <!-- Contact angle θ (obtuse) -->
  <text x="395" y="235" font-size="11" font-weight="700" fill="#1d4ed8">θ &gt; 90°</text>
  <path d="M 417 240 A 8 8 0 0 1 415 252" fill="none" stroke="#1d4ed8" stroke-width="1.5" />

  <!-- =============== bottom equation panel =============== -->
  <rect x="50" y="295" width="500" height="20" rx="5" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="60" y="310" font-size="11" fill="#1a202c">Wetting (cos θ &gt; 0)</text>
  <text x="160" y="310" font-size="11" font-weight="700" fill="#15803d">→ rises</text>
  <text x="225" y="310" font-size="11" fill="#1a202c">·  Non-wetting (cos θ &lt; 0)</text>
  <text x="375" y="310" font-size="11" font-weight="700" fill="#dc2626">→ depressed</text>
  <text x="455" y="310" font-size="11" fill="#1a202c">·  thinner tube → larger h</text>
</svg>
