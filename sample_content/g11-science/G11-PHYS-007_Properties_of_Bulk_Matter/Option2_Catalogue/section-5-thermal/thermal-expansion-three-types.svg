<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" role="img" aria-label="Thermal Expansion: Linear, Area, and Volume">
  <title>Thermal Expansion — Linear, Area, Volume</title>
  <desc>Three diagrams showing thermal expansion in 1, 2, and 3 dimensions: a rod that grows longer; a metal sheet with both length and width growing; a cube whose volume increases. Coefficients α, β, γ relate by β ≈ 2α and γ ≈ 3α for isotropic solids.</desc>

  <text x="310" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Thermal Expansion of Solids</text>

  <defs>
    <marker id="te-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="te-arr-l" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- ============== Linear (left) ============== -->
  <text x="105" y="50" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Linear (1-D)</text>

  <!-- Rod cold (gray) at top, length 140 -->
  <rect x="35" y="80" width="140" height="14" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
  <text x="105" y="74" font-size="10" fill="#1a202c" text-anchor="middle">cold:  L₀</text>

  <!-- Rod hot (red) below, length 165 -->
  <rect x="35" y="120" width="165" height="16" fill="#fecaca" stroke="#dc2626" stroke-width="1.8" />
  <text x="105" y="113" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">hot:  L = L₀ + ΔL</text>

  <!-- ΔL marker -->
  <line x1="175" y1="148" x2="200" y2="148" stroke="#dc2626" stroke-width="1.4" marker-start="url(#te-arr-l)" marker-end="url(#te-arr)" />
  <text x="187" y="160" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">ΔL</text>

  <!-- Equation -->
  <rect x="20" y="180" width="190" height="86" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="115" y="200" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">ΔL = α · L₀ · ΔT</text>
  <text x="30" y="222" font-size="11" fill="#1a202c">α = linear expansion</text>
  <text x="30" y="238" font-size="11" fill="#1a202c">    coefficient (1/K)</text>
  <text x="30" y="256" font-size="10" fill="#4a5568">steel: α ≈ 12×10⁻⁶ /K</text>

  <!-- ============== Area (centre) ============== -->
  <text x="310" y="50" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Area (2-D)</text>

  <!-- Cold square (dashed) -->
  <rect x="245" y="70" width="80" height="80" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="285" y="64" font-size="10" fill="#94a3b8" text-anchor="middle">A₀</text>

  <!-- Hot square (solid red, larger) -->
  <rect x="245" y="70" width="100" height="100" fill="#fef3c7" stroke="#dc2626" stroke-width="2" />
  <text x="295" y="120" font-size="11" font-weight="700" fill="#7c2d12" text-anchor="middle">A = A₀ + ΔA</text>

  <!-- Expansion arrows -->
  <line x1="325" y1="110" x2="345" y2="110" stroke="#dc2626" stroke-width="2" marker-end="url(#te-arr)" />
  <line x1="285" y1="150" x2="285" y2="170" stroke="#dc2626" stroke-width="2" marker-end="url(#te-arr)" />

  <!-- Equation panel -->
  <rect x="225" y="180" width="180" height="86" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="315" y="200" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">ΔA = β · A₀ · ΔT</text>
  <text x="235" y="222" font-size="11" fill="#1a202c">β ≈ 2α</text>
  <text x="235" y="240" font-size="10" fill="#4a5568">(area coefficient ≈</text>
  <text x="235" y="254" font-size="10" fill="#4a5568">  twice the linear)</text>

  <!-- ============== Volume (right) ============== -->
  <text x="510" y="50" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Volume (3-D)</text>

  <!-- Cold cube (dashed isometric-ish) -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <rect x="455" y="80" width="60" height="60" />
    <line x1="515" y1="80" x2="535" y2="60" />
    <line x1="535" y1="60" x2="535" y2="120" />
    <line x1="515" y1="140" x2="535" y2="120" />
    <line x1="455" y1="80" x2="475" y2="60" />
    <line x1="475" y1="60" x2="535" y2="60" />
  </g>
  <text x="495" y="55" font-size="10" fill="#94a3b8" text-anchor="middle">V₀</text>

  <!-- Hot cube (solid, larger) -->
  <g stroke="#dc2626" stroke-width="2" fill="#fed7aa" fill-opacity="0.55">
    <rect x="455" y="80" width="80" height="80" />
    <polygon points="455,80 480,55 560,55 535,80" />
    <polygon points="535,80 560,55 560,135 535,160" />
  </g>
  <text x="495" y="125" font-size="11" font-weight="700" fill="#7c2d12" text-anchor="middle">V = V₀ + ΔV</text>

  <!-- Equation panel -->
  <rect x="430" y="180" width="180" height="86" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="520" y="200" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">ΔV = γ · V₀ · ΔT</text>
  <text x="440" y="222" font-size="11" fill="#1a202c">γ ≈ 3α</text>
  <text x="440" y="240" font-size="10" fill="#4a5568">(volume coefficient ≈</text>
  <text x="440" y="254" font-size="10" fill="#4a5568">  three times the linear)</text>

  <!-- Bottom note -->
  <text x="310" y="295" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Why railroads have expansion gaps and bridges sit on rollers — solids grow when heated.</text>
  <text x="310" y="310" font-size="10" fill="#4a5568" text-anchor="middle">Anomaly: water between 0–4 °C contracts when warmed — densest at 4 °C.</text>
</svg>
