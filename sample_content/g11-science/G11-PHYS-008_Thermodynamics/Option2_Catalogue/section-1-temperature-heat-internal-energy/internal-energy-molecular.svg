<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Internal energy as the sum of molecular kinetic and potential energies">
  <title>Internal Energy — Microscopic View</title>
  <desc>Two boxes show gas molecules at low and high temperature. The cold box has slow molecules (short velocity arrows). The hot box has fast molecules (long arrows). Internal energy U is the total kinetic plus potential energy of all the particles.</desc>

  <text x="300" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Internal Energy U — Molecular Picture</text>

  <defs>
    <marker id="iu-arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="iu-arr-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- ============= COLD ============= -->
  <text x="155" y="50" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Cold gas (low T)</text>
  <text x="155" y="66" font-size="11" font-style="italic" fill="#1e3a8a" text-anchor="middle">slow molecules — small KE</text>

  <rect x="40" y="80" width="230" height="160" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" />

  <!-- molecules in cold box -->
  <g>
    <circle cx="80" cy="115" r="7" fill="#1d4ed8" />
    <line x1="80" y1="115" x2="92" y2="113" stroke="#1d4ed8" stroke-width="2" marker-end="url(#iu-arr-c)" />

    <circle cx="135" cy="135" r="7" fill="#1d4ed8" />
    <line x1="135" y1="135" x2="143" y2="142" stroke="#1d4ed8" stroke-width="2" marker-end="url(#iu-arr-c)" />

    <circle cx="200" cy="110" r="7" fill="#1d4ed8" />
    <line x1="200" y1="110" x2="190" y2="105" stroke="#1d4ed8" stroke-width="2" marker-end="url(#iu-arr-c)" />

    <circle cx="105" cy="180" r="7" fill="#1d4ed8" />
    <line x1="105" y1="180" x2="100" y2="190" stroke="#1d4ed8" stroke-width="2" marker-end="url(#iu-arr-c)" />

    <circle cx="170" cy="200" r="7" fill="#1d4ed8" />
    <line x1="170" y1="200" x2="180" y2="196" stroke="#1d4ed8" stroke-width="2" marker-end="url(#iu-arr-c)" />

    <circle cx="225" cy="180" r="7" fill="#1d4ed8" />
    <line x1="225" y1="180" x2="217" y2="174" stroke="#1d4ed8" stroke-width="2" marker-end="url(#iu-arr-c)" />

    <circle cx="60" cy="220" r="7" fill="#1d4ed8" />
    <line x1="60" y1="220" x2="68" y2="225" stroke="#1d4ed8" stroke-width="2" marker-end="url(#iu-arr-c)" />

    <circle cx="240" cy="225" r="7" fill="#1d4ed8" />
    <line x1="240" y1="225" x2="234" y2="230" stroke="#1d4ed8" stroke-width="2" marker-end="url(#iu-arr-c)" />
  </g>

  <text x="155" y="262" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">U_cold = Σ ½ mv²  (small)</text>

  <!-- ============= HOT ============= -->
  <text x="445" y="50" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Hot gas (high T)</text>
  <text x="445" y="66" font-size="11" font-style="italic" fill="#7c2d12" text-anchor="middle">fast molecules — large KE</text>

  <rect x="330" y="80" width="230" height="160" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" />

  <!-- molecules in hot box (longer arrows = faster) -->
  <g>
    <circle cx="370" cy="115" r="7" fill="#dc2626" />
    <line x1="370" y1="115" x2="400" y2="105" stroke="#dc2626" stroke-width="2.4" marker-end="url(#iu-arr-h)" />

    <circle cx="425" cy="135" r="7" fill="#dc2626" />
    <line x1="425" y1="135" x2="445" y2="155" stroke="#dc2626" stroke-width="2.4" marker-end="url(#iu-arr-h)" />

    <circle cx="490" cy="110" r="7" fill="#dc2626" />
    <line x1="490" y1="110" x2="465" y2="100" stroke="#dc2626" stroke-width="2.4" marker-end="url(#iu-arr-h)" />

    <circle cx="395" cy="180" r="7" fill="#dc2626" />
    <line x1="395" y1="180" x2="380" y2="208" stroke="#dc2626" stroke-width="2.4" marker-end="url(#iu-arr-h)" />

    <circle cx="460" cy="200" r="7" fill="#dc2626" />
    <line x1="460" y1="200" x2="490" y2="190" stroke="#dc2626" stroke-width="2.4" marker-end="url(#iu-arr-h)" />

    <circle cx="515" cy="180" r="7" fill="#dc2626" />
    <line x1="515" y1="180" x2="495" y2="160" stroke="#dc2626" stroke-width="2.4" marker-end="url(#iu-arr-h)" />

    <circle cx="350" cy="220" r="7" fill="#dc2626" />
    <line x1="350" y1="220" x2="375" y2="232" stroke="#dc2626" stroke-width="2.4" marker-end="url(#iu-arr-h)" />

    <circle cx="530" cy="225" r="7" fill="#dc2626" />
    <line x1="530" y1="225" x2="510" y2="232" stroke="#dc2626" stroke-width="2.4" marker-end="url(#iu-arr-h)" />
  </g>

  <text x="445" y="262" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">U_hot = Σ ½ mv²  (large)</text>

  <!-- Bottom panel: definition + key result -->
  <rect x="30" y="278" width="540" height="38" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="42" y="296" font-size="12" font-weight="700" fill="#1a202c">Internal energy U  =  total KE of all particles  +  total PE between particles</text>
  <text x="42" y="312" font-size="11" fill="#15803d" font-style="italic">Temperature is a measure of the AVERAGE molecular KE.  More molecules or hotter molecules ⇒ higher U.</text>
</svg>
