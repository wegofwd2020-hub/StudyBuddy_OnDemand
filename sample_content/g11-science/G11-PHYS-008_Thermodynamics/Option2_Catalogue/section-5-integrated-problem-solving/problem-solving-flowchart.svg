<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460" role="img" aria-label="Decision flowchart for solving thermodynamics problems">
  <title>Thermodynamics Problem-Solving — Decision Flowchart</title>
  <desc>A top-down decision flowchart for picking the right thermodynamics formula. Identify whether the problem involves a single process or a full cycle, then identify the process type (isobaric, isochoric, isothermal, adiabatic, or cyclic) and apply the corresponding form of the First Law.</desc>

  <text x="300" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Solving a Thermodynamics Problem — Decision Flow</text>

  <defs>
    <marker id="ps-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c" />
    </marker>
  </defs>

  <!-- ============== Step 1 ============== -->
  <rect x="200" y="44" width="200" height="44" rx="8" fill="#fef3c7" stroke="#dd6b20" stroke-width="2" />
  <text x="300" y="62" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">1. Identify the system</text>
  <text x="300" y="78" font-size="10" fill="#7c2d12" text-anchor="middle">gas? cycle? engine? refrigerator?</text>

  <line x1="300" y1="88" x2="300" y2="112" stroke="#1a202c" stroke-width="1.6" marker-end="url(#ps-arr)" />

  <!-- ============== Step 2 ============== -->
  <rect x="200" y="116" width="200" height="46" rx="8" fill="#fef3c7" stroke="#dd6b20" stroke-width="2" />
  <text x="300" y="135" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">2. Single process or cycle?</text>
  <text x="300" y="152" font-size="10" fill="#7c2d12" text-anchor="middle">one segment vs. closed loop</text>

  <!-- Branch left (cycle) and right (single process) -->
  <line x1="300" y1="162" x2="300" y2="180" stroke="#1a202c" stroke-width="1.6" />
  <line x1="300" y1="180" x2="135" y2="180" stroke="#1a202c" stroke-width="1.6" />
  <line x1="135" y1="180" x2="135" y2="208" stroke="#1a202c" stroke-width="1.6" marker-end="url(#ps-arr)" />
  <line x1="300" y1="180" x2="465" y2="180" stroke="#1a202c" stroke-width="1.6" />
  <line x1="465" y1="180" x2="465" y2="208" stroke="#1a202c" stroke-width="1.6" marker-end="url(#ps-arr)" />

  <text x="220" y="194" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">cycle</text>
  <text x="384" y="194" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">single process</text>

  <!-- ============== Branch A: cycle ============== -->
  <rect x="40" y="212" width="190" height="46" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
  <text x="135" y="232" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">CYCLE — closed loop</text>
  <text x="135" y="250" font-size="10" fill="#1d4ed8" text-anchor="middle">ΔU = 0 over one cycle</text>

  <line x1="135" y1="258" x2="135" y2="280" stroke="#1a202c" stroke-width="1.6" marker-end="url(#ps-arr)" />

  <rect x="40" y="284" width="190" height="86" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
  <text x="135" y="302" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Engine</text>
  <text x="135" y="320" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">η = W ⁄ Q_H = 1 − Q_C ⁄ Q_H</text>
  <text x="135" y="340" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">Carnot bound:</text>
  <text x="135" y="358" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">η_max = 1 − T_C ⁄ T_H</text>

  <!-- ============== Branch B: single process ============== -->
  <rect x="370" y="212" width="190" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="465" y="231" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">PROCESS — one segment</text>
  <text x="465" y="250" font-size="10" fill="#dc2626" text-anchor="middle">apply ΔU = Q − W</text>

  <line x1="465" y1="258" x2="465" y2="280" stroke="#1a202c" stroke-width="1.6" marker-end="url(#ps-arr)" />

  <rect x="370" y="284" width="190" height="46" rx="8" fill="#fef3c7" stroke="#dd6b20" stroke-width="2" />
  <text x="465" y="304" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">Which type?</text>
  <text x="465" y="322" font-size="10" fill="#7c2d12" text-anchor="middle">P, V, T, or Q held constant?</text>

  <!-- Four leaf process boxes -->
  <line x1="465" y1="330" x2="465" y2="346" stroke="#1a202c" stroke-width="1.6" />
  <!-- spread to four columns: 285,395,465,540  → re-balance: 295, 410, 480, 555 -->
  <line x1="465" y1="346" x2="295" y2="346" stroke="#1a202c" stroke-width="1.6" />
  <line x1="295" y1="346" x2="295" y2="378" stroke="#1a202c" stroke-width="1.6" marker-end="url(#ps-arr)" />
  <line x1="465" y1="346" x2="555" y2="346" stroke="#1a202c" stroke-width="1.6" />
  <line x1="555" y1="346" x2="555" y2="378" stroke="#1a202c" stroke-width="1.6" marker-end="url(#ps-arr)" />
  <line x1="465" y1="346" x2="385" y2="346" stroke="#1a202c" stroke-width="1.6" />
  <line x1="385" y1="346" x2="385" y2="378" stroke="#1a202c" stroke-width="1.6" marker-end="url(#ps-arr)" />
  <line x1="475" y1="346" x2="475" y2="378" stroke="#1a202c" stroke-width="1.6" marker-end="url(#ps-arr)" />

  <rect x="245" y="382" width="100" height="58" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="295" y="396" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">Isobaric</text>
  <text x="295" y="412" font-size="10" fill="#1a202c" text-anchor="middle">W = P·ΔV</text>
  <text x="295" y="426" font-size="9" fill="#1a202c" text-anchor="middle">Q = nC_p·ΔT</text>
  <text x="295" y="438" font-size="8" fill="#7c2d12" text-anchor="middle">ΔU = nC_v·ΔT</text>

  <rect x="335" y="382" width="100" height="58" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="385" y="396" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Isochoric</text>
  <text x="385" y="412" font-size="10" fill="#1a202c" text-anchor="middle">W = 0</text>
  <text x="385" y="426" font-size="9" fill="#1a202c" text-anchor="middle">Q = nC_v·ΔT</text>
  <text x="385" y="438" font-size="8" fill="#7c2d12" text-anchor="middle">ΔU = Q</text>

  <rect x="425" y="382" width="100" height="58" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="475" y="396" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Isothermal</text>
  <text x="475" y="411" font-size="9" fill="#1a202c" text-anchor="middle">ΔU = 0,  Q = W</text>
  <text x="475" y="424" font-size="9" fill="#1a202c" text-anchor="middle">W = nRT ln(V₂/V₁)</text>

  <rect x="505" y="382" width="80" height="58" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="545" y="396" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">Adiabatic</text>
  <text x="545" y="411" font-size="9" fill="#1a202c" text-anchor="middle">Q = 0</text>
  <text x="545" y="424" font-size="9" fill="#1a202c" text-anchor="middle">ΔU = −W</text>
  <text x="545" y="436" font-size="8" fill="#1a202c" text-anchor="middle">PV^γ = const</text>
</svg>
