<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Efficiency comparison: real heat engines versus Carnot limit">
  <title>Efficiency Comparison — Real Engines vs Carnot Limit</title>
  <desc>A horizontal bar chart compares typical efficiencies of real heat engines (steam engine, gasoline car engine, diesel engine, combined-cycle gas plant) against the Carnot efficiency limit for the same hot and cold reservoir temperatures. All real efficiencies are below the Carnot bound.</desc>

  <text x="300" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Efficiency Map — Real Engines vs Carnot Limit</text>
  <text x="300" y="40" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Carnot is the upper bound — real (irreversible) engines fall below it.</text>

  <!-- Plot area -->
  <rect x="160" y="60" width="380" height="240" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Vertical grid (0 / 25 / 50 / 75 / 100 %) -->
  <g stroke="#e2e8f0" stroke-width="0.6">
    <line x1="255" y1="60" x2="255" y2="300" />
    <line x1="350" y1="60" x2="350" y2="300" />
    <line x1="445" y1="60" x2="445" y2="300" />
    <line x1="540" y1="60" x2="540" y2="300" />
  </g>

  <!-- Axes -->
  <line x1="160" y1="300" x2="540" y2="300" stroke="#1a202c" stroke-width="1.6" />
  <line x1="160" y1="60" x2="160" y2="300" stroke="#1a202c" stroke-width="1.6" />

  <!-- X-axis ticks -->
  <text x="160" y="318" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">0%</text>
  <text x="255" y="318" font-size="11" fill="#1a202c" text-anchor="middle">25%</text>
  <text x="350" y="318" font-size="11" fill="#1a202c" text-anchor="middle">50%</text>
  <text x="445" y="318" font-size="11" fill="#1a202c" text-anchor="middle">75%</text>
  <text x="540" y="318" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">100%</text>
  <text x="350" y="338" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Efficiency  η</text>

  <!-- Bars: each row is one engine. width is 380 px = 100%. -->
  <!-- y positions -->
  <!-- Steam engine (~10%) -->
  <text x="155" y="86" font-size="11" font-weight="700" fill="#1a202c" text-anchor="end">Steam locomotive</text>
  <rect x="160" y="74" width="38" height="16" fill="#1d4ed8" />
  <text x="206" y="86" font-size="10" font-weight="700" fill="#1d4ed8">10%</text>

  <!-- Gasoline car (~30%) -->
  <text x="155" y="116" font-size="11" font-weight="700" fill="#1a202c" text-anchor="end">Gasoline car</text>
  <rect x="160" y="104" width="114" height="16" fill="#1d4ed8" />
  <text x="282" y="116" font-size="10" font-weight="700" fill="#1d4ed8">30%</text>

  <!-- Diesel engine (~40%) -->
  <text x="155" y="146" font-size="11" font-weight="700" fill="#1a202c" text-anchor="end">Diesel truck</text>
  <rect x="160" y="134" width="152" height="16" fill="#1d4ed8" />
  <text x="320" y="146" font-size="10" font-weight="700" fill="#1d4ed8">40%</text>

  <!-- Combined-cycle gas plant (~60%) -->
  <text x="155" y="176" font-size="11" font-weight="700" fill="#1a202c" text-anchor="end">Combined-cycle plant</text>
  <rect x="160" y="164" width="228" height="16" fill="#1d4ed8" />
  <text x="396" y="176" font-size="10" font-weight="700" fill="#1d4ed8">60%</text>

  <!-- Carnot for steam (T_H=500K, T_C=300K → η=0.40) -->
  <text x="155" y="206" font-size="11" font-weight="700" fill="#15803d" text-anchor="end">Carnot @ 500/300 K</text>
  <rect x="160" y="194" width="152" height="16" fill="#15803d" opacity="0.85" />
  <text x="320" y="206" font-size="10" font-weight="700" fill="#15803d">40%</text>

  <!-- Carnot for combined cycle (T_H=1700K, T_C=300K → η ≈ 0.82) -->
  <text x="155" y="236" font-size="11" font-weight="700" fill="#15803d" text-anchor="end">Carnot @ 1700/300 K</text>
  <rect x="160" y="224" width="312" height="16" fill="#15803d" opacity="0.85" />
  <text x="480" y="236" font-size="10" font-weight="700" fill="#15803d">82%</text>

  <!-- Theoretical max (100%) — barred by Second Law -->
  <text x="155" y="266" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end">100% (forbidden)</text>
  <rect x="160" y="254" width="380" height="16" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="4 3" stroke-width="1.5" />
  <line x1="160" y1="254" x2="540" y2="270" stroke="#dc2626" stroke-width="2" />
  <line x1="540" y1="254" x2="160" y2="270" stroke="#dc2626" stroke-width="2" />
  <text x="546" y="266" font-size="10" font-weight="700" fill="#dc2626">2nd-law limit</text>

  <!-- Legend -->
  <rect x="160" y="284" width="14" height="10" fill="#1d4ed8" />
  <text x="180" y="293" font-size="10" fill="#1a202c">Real engine</text>
  <rect x="260" y="284" width="14" height="10" fill="#15803d" />
  <text x="280" y="293" font-size="10" fill="#1a202c">Carnot bound for same T_H,T_C</text>

  <!-- Bottom takeaway -->
  <rect x="20" y="338" width="560" height="20" rx="4" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="300" y="352" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Higher T_H or lower T_C raises the Carnot ceiling — but ALL real engines fall short of it.</text>
</svg>
