<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Carnot cycle on a PV diagram with two isothermal and two adiabatic processes">
  <title>Carnot Cycle — PV Diagram</title>
  <desc>The four-stroke Carnot cycle drawn on a P versus V diagram. A to B is isothermal expansion at T_H absorbing heat Q_H. B to C is adiabatic expansion cooling to T_C. C to D is isothermal compression at T_C rejecting heat Q_C. D to A is adiabatic compression returning to T_H. Adiabats are steeper than isotherms. Net work is the area enclosed.</desc>

  <text x="300" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Carnot Cycle on a PV Diagram</text>
  <text x="300" y="40" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Two reversible isotherms (T_H, T_C) connected by two reversible adiabats. Net work = area enclosed.</text>

  <!-- Plot area -->
  <rect x="80" y="60" width="460" height="260" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Grid -->
  <g stroke="#e2e8f0" stroke-width="0.6">
    <line x1="195" y1="60" x2="195" y2="320" />
    <line x1="310" y1="60" x2="310" y2="320" />
    <line x1="425" y1="60" x2="425" y2="320" />
    <line x1="80" y1="255" x2="540" y2="255" />
    <line x1="80" y1="190" x2="540" y2="190" />
    <line x1="80" y1="125" x2="540" y2="125" />
  </g>

  <!-- Axes -->
  <line x1="80" y1="320" x2="540" y2="320" stroke="#1a202c" stroke-width="1.8" />
  <line x1="80" y1="60" x2="80" y2="320" stroke="#1a202c" stroke-width="1.8" />

  <text x="310" y="354" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Volume V</text>
  <text x="22" y="190" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle" transform="rotate(-90 22 190)">Pressure P</text>

  <!-- Cycle paths.
       Coordinates of the four corner states:
         A = (138, 93)   start  (high P, low V), at T_H
         B = (253, 210)  end of isothermal expansion at T_H
         C = (425, 292)  end of adiabatic expansion (now at T_C)
         D = (241, 230)  end of isothermal compression at T_C
       From D back to A via adiabatic compression. -->

  <!-- A → B  isothermal expansion at T_H (red).  PV=k₁ -->
  <path d="M 138 93 C 175 138 215 180 253 210" fill="none" stroke="#dc2626" stroke-width="3.6" />

  <!-- B → C  adiabatic expansion (orange dashed).  PV^γ = const, steeper -->
  <path d="M 253 210 C 305 235 365 270 425 292" fill="none" stroke="#dd6b20" stroke-width="3.6" stroke-dasharray="9 5" />

  <!-- C → D  isothermal compression at T_C (blue).  PV=k₂ -->
  <path d="M 425 292 C 360 280 295 252 241 230" fill="none" stroke="#1d4ed8" stroke-width="3.6" />

  <!-- D → A  adiabatic compression (purple dashed). steeper -->
  <path d="M 241 230 C 210 195 170 145 138 93" fill="none" stroke="#7c3aed" stroke-width="3.6" stroke-dasharray="9 5" />

  <!-- Light fill of enclosed area showing net work (using the same Bezier control points) -->
  <path d="M 138 93
           C 175 138 215 180 253 210
           C 305 235 365 270 425 292
           C 360 280 295 252 241 230
           C 210 195 170 145 138 93 Z"
        fill="#fde68a" opacity="0.35" stroke="none" />

  <!-- Direction arrows on each leg -->
  <!-- A→B (mid) -->
  <polygon points="200,154 188,151 196,162" fill="#dc2626" />
  <!-- B→C (mid) -->
  <polygon points="335,253 322,254 332,261" fill="#dd6b20" />
  <!-- C→D (mid, going LEFT) -->
  <polygon points="335,279 348,277 340,286" fill="#1d4ed8" />
  <!-- D→A (mid, going UP-LEFT) -->
  <polygon points="190,165 200,170 195,158" fill="#7c3aed" />

  <!-- State labels A,B,C,D -->
  <circle cx="138" cy="93" r="5" fill="#1a202c" />
  <text x="116" y="86" font-size="14" font-weight="700" fill="#1a202c">A</text>

  <circle cx="253" cy="210" r="5" fill="#1a202c" />
  <text x="262" y="206" font-size="14" font-weight="700" fill="#1a202c">B</text>

  <circle cx="425" cy="292" r="5" fill="#1a202c" />
  <text x="432" y="306" font-size="14" font-weight="700" fill="#1a202c">C</text>

  <circle cx="241" cy="230" r="5" fill="#1a202c" />
  <text x="220" y="246" font-size="14" font-weight="700" fill="#1a202c">D</text>

  <!-- Process annotations -->
  <text x="105" y="120" font-size="11" font-weight="700" fill="#dc2626">A→B  isothermal (T_H)</text>
  <text x="105" y="134" font-size="10" fill="#dc2626">absorb Q_H</text>

  <text x="345" y="234" font-size="11" font-weight="700" fill="#dd6b20">B→C adiabatic</text>
  <text x="345" y="248" font-size="10" fill="#dd6b20">expansion · cools to T_C</text>

  <text x="290" y="312" font-size="11" font-weight="700" fill="#1d4ed8">C→D  isothermal (T_C)</text>
  <text x="290" y="326" font-size="10" fill="#1d4ed8" font-style="italic">(reject Q_C)</text>

  <text x="118" y="194" font-size="11" font-weight="700" fill="#7c3aed">D→A adiabatic</text>
  <text x="118" y="208" font-size="10" fill="#7c3aed">compression · heats to T_H</text>

  <!-- "Net work = enclosed area" callout -->
  <text x="296" y="180" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">W_net</text>
  <text x="296" y="196" font-size="10" font-style="italic" fill="#7c2d12" text-anchor="middle">enclosed area</text>

  <!-- Bottom efficiency panel -->
  <rect x="80" y="335" width="460" height="60" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" />
  <text x="92" y="354" font-size="12" font-weight="700" fill="#14532d">Carnot efficiency (the maximum possible between two reservoirs):</text>
  <text x="92" y="378" font-size="16" font-weight="700" fill="#15803d">η_Carnot = 1 − T_C ⁄ T_H</text>
  <text x="332" y="378" font-size="11" font-style="italic" fill="#14532d">  (temperatures in Kelvin)</text>
  <text x="92" y="392" font-size="10" font-style="italic" fill="#7c2d12">No real engine operating between T_H and T_C can exceed this — the cycle must be reversible to attain it.</text>
</svg>
