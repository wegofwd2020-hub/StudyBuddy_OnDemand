<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Two equivalent statements of the Second Law of Thermodynamics: Kelvin-Planck and Clausius">
  <title>Second Law — Kelvin–Planck and Clausius Statements</title>
  <desc>Left: Kelvin–Planck statement. No engine can completely convert heat from a single reservoir into work. Some heat must be rejected to a cold reservoir. Right: Clausius statement. Heat cannot flow spontaneously from a cold body to a hot body. The two statements are equivalent.</desc>

  <text x="300" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Second Law of Thermodynamics — Two Equivalent Statements</text>

  <defs>
    <marker id="sl-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="sl-arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- ============== LEFT: Kelvin–Planck ============== -->
  <rect x="20" y="40" width="280" height="280" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8" />
  <text x="160" y="62" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Kelvin–Planck statement</text>
  <text x="160" y="80" font-size="10" font-style="italic" fill="#1e3a8a" text-anchor="middle">"No process produces only work from heat."</text>

  <!-- Hot reservoir -->
  <rect x="50" y="100" width="220" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="160" y="122" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">Hot reservoir  T_H</text>

  <!-- Heat IN -->
  <line x1="160" y1="135" x2="160" y2="170" stroke="#dc2626" stroke-width="2.5" marker-end="url(#sl-arr-r)" />
  <text x="178" y="160" font-size="11" font-weight="700" fill="#dc2626">Q</text>

  <!-- Engine -->
  <circle cx="160" cy="200" r="32" fill="#fef3c7" stroke="#dd6b20" stroke-width="2.5" />
  <text x="160" y="206" font-size="11" font-weight="700" fill="#7c2d12" text-anchor="middle">engine</text>

  <!-- W out -->
  <line x1="192" y1="200" x2="246" y2="200" stroke="#15803d" stroke-width="2.8" marker-end="url(#sl-arr-b)" />
  <text x="220" y="192" font-size="11" font-weight="700" fill="#15803d">W</text>

  <!-- Big red X over engine: ❌ "impossible" -->
  <g stroke="#dc2626" stroke-width="6" stroke-linecap="round">
    <line x1="135" y1="175" x2="185" y2="225" />
    <line x1="185" y1="175" x2="135" y2="225" />
  </g>

  <text x="160" y="260" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">IMPOSSIBLE</text>
  <text x="160" y="278" font-size="10" fill="#1e3a8a" text-anchor="middle">A 100% efficient heat engine</text>
  <text x="160" y="294" font-size="10" fill="#1e3a8a" text-anchor="middle">cannot exist — some Q must</text>
  <text x="160" y="310" font-size="10" fill="#1e3a8a" text-anchor="middle">be rejected to a cold reservoir.</text>

  <!-- ============== RIGHT: Clausius ============== -->
  <rect x="320" y="40" width="260" height="280" rx="10" fill="#fff5f5" stroke="#dc2626" stroke-width="1.8" />
  <text x="450" y="62" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Clausius statement</text>
  <text x="450" y="80" font-size="10" font-style="italic" fill="#7c2d12" text-anchor="middle">"Heat does not spontaneously flow cold → hot."</text>

  <!-- Cold reservoir top -->
  <rect x="370" y="100" width="160" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
  <text x="450" y="122" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Cold body  T_C</text>

  <!-- Heat (impossible) flowing UP from cold to hot -->
  <line x1="450" y1="170" x2="450" y2="138" stroke="#dc2626" stroke-width="2.8" stroke-dasharray="6 4" marker-end="url(#sl-arr-r)" />
  <text x="466" y="160" font-size="11" font-weight="700" fill="#dc2626">Q</text>

  <!-- Hot reservoir bottom -->
  <rect x="370" y="170" width="160" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="450" y="192" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">Hot body  T_H  ( T_H &gt; T_C )</text>

  <!-- Big red X over the upward arrow -->
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <line x1="438" y1="146" x2="462" y2="170" />
    <line x1="462" y1="146" x2="438" y2="170" />
  </g>

  <text x="450" y="234" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">NOT SPONTANEOUS</text>
  <text x="450" y="254" font-size="10" fill="#7c2d12" text-anchor="middle">Heat naturally flows from hot</text>
  <text x="450" y="270" font-size="10" fill="#7c2d12" text-anchor="middle">to cold; the reverse requires</text>
  <text x="450" y="286" font-size="10" fill="#7c2d12" text-anchor="middle">work input (a refrigerator).</text>
  <text x="450" y="306" font-size="10" font-style="italic" fill="#dc2626" text-anchor="middle">Equivalent to Kelvin–Planck.</text>

  <!-- Bottom strip -->
  <rect x="20" y="334" width="560" height="22" rx="5" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="300" y="350" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Both statements rule out perpetual motion of the second kind — they are mathematically equivalent.</text>
</svg>
