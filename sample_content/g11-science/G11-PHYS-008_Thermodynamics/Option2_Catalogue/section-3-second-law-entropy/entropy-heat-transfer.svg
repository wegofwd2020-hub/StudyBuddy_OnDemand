<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Entropy change of two bodies during heat transfer between them">
  <title>Entropy Change in Heat Transfer — ΔS_total &gt; 0</title>
  <desc>A quantity of heat Q flows from a hot body at T_H to a cold body at T_C. The hot body's entropy decreases by Q over T_H. The cold body's entropy increases by Q over T_C. Because T_C is less than T_H, the gain exceeds the loss, so total entropy increases.</desc>

  <text x="300" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Entropy in Heat Transfer:  ΔS = Q ⁄ T</text>

  <defs>
    <marker id="ht-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- HOT body -->
  <rect x="50" y="80" width="180" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" />
  <text x="140" y="106" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Hot body  T_H = 400 K</text>

  <text x="140" y="146" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">ΔS_H = − Q ⁄ T_H</text>
  <text x="140" y="170" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">= − 100 ⁄ 400  =  − 0.25 J/K</text>
  <text x="140" y="194" font-size="10" font-style="italic" fill="#7c2d12" text-anchor="middle">entropy decreases</text>

  <!-- Heat arrow (right) -->
  <line x1="240" y1="140" x2="350" y2="140" stroke="#dc2626" stroke-width="5" marker-end="url(#ht-arr)" />
  <text x="295" y="130" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Q = 100 J</text>

  <!-- COLD body -->
  <rect x="370" y="80" width="180" height="120" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" />
  <text x="460" y="106" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Cold body  T_C = 250 K</text>

  <text x="460" y="146" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">ΔS_C = + Q ⁄ T_C</text>
  <text x="460" y="170" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">= + 100 ⁄ 250  =  + 0.40 J/K</text>
  <text x="460" y="194" font-size="10" font-style="italic" fill="#1e3a8a" text-anchor="middle">entropy increases</text>

  <!-- Sum panel -->
  <rect x="50" y="220" width="500" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" />
  <text x="62" y="240" font-size="12" font-weight="700" fill="#14532d">ΔS_total  =  ΔS_H + ΔS_C  =  −0.25 + 0.40  =  +0.15 J/K  &gt;  0</text>
  <text x="62" y="256" font-size="11" font-style="italic" fill="#15803d">Universe's entropy always increases for spontaneous heat flow.</text>

  <!-- Generalisation strip -->
  <rect x="50" y="270" width="500" height="38" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="62" y="288" font-size="12" font-weight="700" fill="#1a202c">For a reversible heat transfer at constant T:</text>
  <text x="320" y="288" font-size="13" font-weight="700" fill="#15803d">ΔS = Q_rev ⁄ T   (units: J/K)</text>
  <text x="62" y="304" font-size="10" fill="#7c2d12" font-style="italic">If T_H = T_C the transfer is reversible and ΔS_total = 0.  Real (finite-ΔT) transfers are irreversible: ΔS &gt; 0.</text>
</svg>
