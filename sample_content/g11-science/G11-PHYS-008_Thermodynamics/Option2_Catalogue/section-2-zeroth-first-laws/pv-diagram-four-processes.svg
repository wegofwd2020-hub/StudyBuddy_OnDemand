<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="PV diagram comparing isobaric, isochoric, isothermal, and adiabatic processes">
  <title>PV Diagram — Four Quasi-Static Processes</title>
  <desc>From a common starting point, four processes are shown on a P versus V diagram. Isobaric is a horizontal line at constant pressure. Isochoric is a vertical line at constant volume. Isothermal is a hyperbola PV equals constant. Adiabatic is steeper than isothermal because PV to the gamma equals constant.</desc>

  <text x="300" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">PV Diagram — Four Special Processes</text>

  <!-- Plot area: x from 80 to 540 (V), y from 60 to 320 (P) -->
  <rect x="80" y="60" width="460" height="260" fill="#f7fafc" stroke="#e2e8f0" />

  <!-- Grid -->
  <g stroke="#e2e8f0" stroke-width="0.6">
    <line x1="172" y1="60" x2="172" y2="320" />
    <line x1="264" y1="60" x2="264" y2="320" />
    <line x1="356" y1="60" x2="356" y2="320" />
    <line x1="448" y1="60" x2="448" y2="320" />
    <line x1="80" y1="268" x2="540" y2="268" />
    <line x1="80" y1="216" x2="540" y2="216" />
    <line x1="80" y1="164" x2="540" y2="164" />
    <line x1="80" y1="112" x2="540" y2="112" />
  </g>

  <!-- Axes -->
  <line x1="80" y1="320" x2="540" y2="320" stroke="#1a202c" stroke-width="1.8" />
  <line x1="80" y1="60" x2="80" y2="320" stroke="#1a202c" stroke-width="1.8" />

  <!-- Axis labels -->
  <text x="310" y="354" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Volume V</text>
  <text x="22" y="190" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle" transform="rotate(-90 22 190)">Pressure P</text>

  <!-- Common starting point S at (V0=2 → x=264, P0=2 → y=216) -->
  <circle cx="264" cy="216" r="6" fill="#1a202c" />
  <text x="276" y="224" font-size="12" font-weight="700" fill="#1a202c">S (P₀, V₀)</text>

  <!-- ============== ISOBARIC: horizontal to the right (P constant) ============== -->
  <line x1="264" y1="216" x2="490" y2="216" stroke="#dd6b20" stroke-width="3.5" />
  <polygon points="490,216 482,212 482,220" fill="#dd6b20" />
  <text x="478" y="208" font-size="12" font-weight="700" fill="#dd6b20">Isobaric (P = const)</text>
  <text x="380" y="234" font-size="10" font-style="italic" fill="#dd6b20">W = P ΔV</text>

  <!-- ============== ISOCHORIC: vertical upward (V constant) ============== -->
  <line x1="264" y1="216" x2="264" y2="80" stroke="#15803d" stroke-width="3.5" />
  <polygon points="264,80 260,88 268,88" fill="#15803d" />
  <text x="170" y="76" font-size="12" font-weight="700" fill="#15803d">Isochoric (V = const)</text>
  <text x="200" y="92" font-size="10" font-style="italic" fill="#15803d">W = 0,  ΔU = Q</text>

  <!-- ============== ISOTHERMAL: PV = const → P = k/V; through (V0,P0) where k=P0·V0=4 (in plot units) ==============
       Plot mapping: V_plot=2 → x=264. So x = 80 + 92*V → V = (x-80)/92
                     P_plot=2 → y=216. So y = 320 − 52*P → P = (320 − y)/52
       Need T(V) such that P*V = 4 in physics units, drawn via path samples.
       I'll draw the isotherm via cubic-bezier-approximated samples. -->
  <path d="M 172 76 C 195 110 220 145 264 216 C 320 270 400 296 540 312"
        fill="none" stroke="#1d4ed8" stroke-width="3.5" />
  <text x="100" y="72" font-size="12" font-weight="700" fill="#1d4ed8">Isothermal (T = const)</text>
  <text x="100" y="88" font-size="10" font-style="italic" fill="#1d4ed8">PV = const</text>

  <!-- ============== ADIABATIC: PV^γ = const → through same point but steeper.
       For γ=1.4, dP/dV is steeper than isothermal at same V. Path runs higher on left, lower on right. -->
  <path d="M 130 60 C 175 110 215 150 264 216 C 305 260 360 286 470 308"
        fill="none" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="9 5" />
  <text x="380" y="284" font-size="12" font-weight="700" fill="#dc2626">Adiabatic (Q = 0)</text>
  <text x="380" y="300" font-size="10" font-style="italic" fill="#dc2626">PV^γ = const  (steeper)</text>

  <!-- Legend / mini-equations panel -->
  <rect x="80" y="335" width="460" height="58" rx="6" fill="#f7fafc" stroke="#cbd5e1" />
  <text x="92" y="352" font-size="11" font-weight="700" fill="#dd6b20">Isobaric</text>
  <text x="158" y="352" font-size="10" fill="#1a202c">Q = nC_p ΔT,  W = PΔV</text>

  <text x="312" y="352" font-size="11" font-weight="700" fill="#15803d">Isochoric</text>
  <text x="382" y="352" font-size="10" fill="#1a202c">Q = nC_v ΔT,  W = 0</text>

  <text x="92" y="372" font-size="11" font-weight="700" fill="#1d4ed8">Isothermal</text>
  <text x="166" y="372" font-size="10" fill="#1a202c">ΔU = 0,  W = nRT ln(V₂/V₁)</text>

  <text x="312" y="372" font-size="11" font-weight="700" fill="#dc2626">Adiabatic</text>
  <text x="380" y="372" font-size="10" fill="#1a202c">Q = 0,  ΔU = −W</text>

  <text x="92" y="388" font-size="10" fill="#15803d" font-style="italic">Area under any curve = work done by the gas during that process.</text>
</svg>
