<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Magnitude of K and what it means">
  <title>What the Size of K Tells You</title>
  <desc>A horizontal scale of K values from very small to very large. K much less than 1 means equilibrium favours reactants; K near 1 means a comparable mix; K much greater than 1 means equilibrium favours products. Each region has a labelled mini flask showing the relative populations.</desc>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">The Size of K Tells You Where Equilibrium Sits</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">K is a ratio. Big K → the top is bigger. Small K → the bottom is bigger. K near 1 → comparable.</text>

  <!-- Number line -->
  <line x1="60" y1="160" x2="660" y2="160" stroke="#1a202c" stroke-width="2"/>

  <!-- Tick markers -->
  <g font-size="11" fill="#4a5568" font-weight="700" text-anchor="middle">
    <line x1="120" y1="156" x2="120" y2="164" stroke="#1a202c" stroke-width="2"/>
    <text x="120" y="180">K = 10⁻⁴</text>
    <line x1="240" y1="156" x2="240" y2="164" stroke="#1a202c" stroke-width="2"/>
    <text x="240" y="180">K = 10⁻²</text>
    <line x1="360" y1="156" x2="360" y2="164" stroke="#1a202c" stroke-width="2"/>
    <text x="360" y="180">K = 1</text>
    <line x1="480" y1="156" x2="480" y2="164" stroke="#1a202c" stroke-width="2"/>
    <text x="480" y="180">K = 10²</text>
    <line x1="600" y1="156" x2="600" y2="164" stroke="#1a202c" stroke-width="2"/>
    <text x="600" y="180">K = 10⁴</text>
  </g>

  <!-- Three labelled regions, color-coded -->
  <!-- Reactant-favoured -->
  <rect x="60" y="60" width="240" height="80" rx="8" fill="#fff7ed" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="180" y="80" font-size="12" font-weight="700" fill="#dd6b20" text-anchor="middle">K ≪ 1   reactants favoured</text>
  <!-- Mini flask: many reactant dots, few product squares -->
  <g transform="translate(110,90)">
    <circle cx="0"  cy="6" r="5" fill="#dd6b20"/>
    <circle cx="14" cy="14" r="5" fill="#dd6b20"/>
    <circle cx="28" cy="6" r="5" fill="#dd6b20"/>
    <circle cx="42" cy="18" r="5" fill="#dd6b20"/>
    <circle cx="56" cy="6" r="5" fill="#dd6b20"/>
    <circle cx="-12" cy="20" r="5" fill="#dd6b20"/>
    <rect x="64" y="14" width="9" height="9" fill="#15803d"/>
  </g>
  <text x="180" y="132" font-size="10" fill="#4a5568" text-anchor="middle" font-style="italic">"barely reacts"</text>

  <!-- Roughly even -->
  <rect x="312" y="60" width="96" height="80" rx="8" fill="#fefce8" stroke="#92400e" stroke-width="1.5"/>
  <text x="360" y="80" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">K ~ 1</text>
  <text x="360" y="94" font-size="10" fill="#92400e" text-anchor="middle">comparable</text>
  <g transform="translate(330,102)">
    <circle cx="0"  cy="6" r="5" fill="#dd6b20"/>
    <circle cx="14" cy="14" r="5" fill="#dd6b20"/>
    <circle cx="28" cy="6" r="5" fill="#dd6b20"/>
    <rect x="42" y="0" width="9" height="9" fill="#15803d"/>
    <rect x="55" y="9" width="9" height="9" fill="#15803d"/>
    <rect x="42" y="18" width="9" height="9" fill="#15803d"/>
  </g>

  <!-- Product-favoured -->
  <rect x="420" y="60" width="240" height="80" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="540" y="80" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">K ≫ 1   products favoured</text>
  <g transform="translate(470,90)">
    <circle cx="0"  cy="14" r="5" fill="#dd6b20"/>
    <rect x="14" y="6"  width="9" height="9" fill="#15803d"/>
    <rect x="28" y="14" width="9" height="9" fill="#15803d"/>
    <rect x="42" y="6"  width="9" height="9" fill="#15803d"/>
    <rect x="56" y="14" width="9" height="9" fill="#15803d"/>
    <rect x="70" y="6"  width="9" height="9" fill="#15803d"/>
    <rect x="84" y="14" width="9" height="9" fill="#15803d"/>
  </g>
  <text x="540" y="132" font-size="10" fill="#4a5568" text-anchor="middle" font-style="italic">"reacts to near-completion"</text>

  <!-- Real examples row -->
  <text x="60" y="220" font-size="11" font-weight="700" fill="#1a202c">Real examples (each at one specific T):</text>
  <text x="60" y="240" font-size="11" fill="#dd6b20">• N₂(g) + O₂(g) ⇌ 2 NO(g)   K ≈ 10⁻³⁰ at 25 °C</text>
  <text x="60" y="258" font-size="11" fill="#92400e">• H₂(g) + I₂(g) ⇌ 2 HI(g)   K ≈ 50 at 730 K</text>
  <text x="60" y="276" font-size="11" fill="#15803d">• 2 H₂(g) + O₂(g) ⇌ 2 H₂O(g)   K ≈ 10⁸⁰ at 25 °C</text>

  <!-- Footer -->
  <text x="360" y="306" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">K is dimensionless when written with activities. The number says where, not how fast.</text>
</svg>
