<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Reaction quotient Q compared with K predicts direction">
  <title>Reaction Quotient Q vs Equilibrium Constant K</title>
  <desc>A horizontal axis labelled Q with K marked at the centre. Three regions: Q less than K means too few products so reaction shifts forward; Q equals K means the system is at equilibrium; Q greater than K means too many products so reaction shifts reverse. Curved arrows show each shift direction.</desc>

  <defs>
    <marker id="qk-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="qk-arr-l" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Reaction Quotient Q — Compare with K to Predict the Shift</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">Q has the same form as K, but uses CURRENT (any-time) concentrations, not equilibrium ones.</text>

  <!-- Q definition box -->
  <rect x="60" y="60" width="280" height="80" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="200" y="82" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">Reaction quotient (any time t)</text>
  <text x="120" y="118" font-size="20" font-weight="700" fill="#1a202c">Q =</text>
  <text x="240" y="106" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">[C]<tspan baseline-shift="super" font-size="11">c</tspan>[D]<tspan baseline-shift="super" font-size="11">d</tspan></text>
  <line x1="195" y1="113" x2="285" y2="113" stroke="#1a202c" stroke-width="2"/>
  <text x="240" y="132" font-size="16" font-weight="700" fill="#dd6b20" text-anchor="middle">[A]<tspan baseline-shift="super" font-size="11">a</tspan>[B]<tspan baseline-shift="super" font-size="11">b</tspan></text>

  <!-- K definition box -->
  <rect x="380" y="60" width="280" height="80" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
  <text x="520" y="82" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Equilibrium constant (only at t = t_eq)</text>
  <text x="440" y="118" font-size="20" font-weight="700" fill="#1a202c">K =</text>
  <text x="560" y="106" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">[C]<tspan baseline-shift="super" font-size="11">c</tspan>[D]<tspan baseline-shift="super" font-size="11">d</tspan></text>
  <line x1="515" y1="113" x2="605" y2="113" stroke="#1a202c" stroke-width="2"/>
  <text x="560" y="132" font-size="16" font-weight="700" fill="#dd6b20" text-anchor="middle">[A]<tspan baseline-shift="super" font-size="11">a</tspan>[B]<tspan baseline-shift="super" font-size="11">b</tspan></text>

  <!-- Q axis with K at centre -->
  <line x1="80" y1="220" x2="640" y2="220" stroke="#1a202c" stroke-width="2"/>
  <line x1="360" y1="208" x2="360" y2="232" stroke="#1a202c" stroke-width="3"/>
  <text x="360" y="250" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Q = K</text>
  <text x="360" y="266" font-size="11" fill="#4a5568" text-anchor="middle">at equilibrium</text>

  <!-- Q < K region (left) — shift forward (right) -->
  <text x="180" y="208" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Q &lt; K</text>
  <text x="180" y="190" font-size="11" fill="#15803d" text-anchor="middle">too few products</text>
  <path d="M 100 200 Q 220 160, 340 200" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#qk-arr-r)"/>
  <text x="180" y="156" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">⇒ shift FORWARD (→)</text>

  <!-- Q > K region (right) — shift reverse (left) -->
  <text x="540" y="208" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Q &gt; K</text>
  <text x="540" y="190" font-size="11" fill="#dc2626" text-anchor="middle">too many products</text>
  <path d="M 620 200 Q 500 160, 380 200" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#qk-arr-l)"/>
  <text x="540" y="156" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">⇒ shift REVERSE (←)</text>

  <!-- Worked example -->
  <rect x="60" y="290" width="600" height="80" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="360" y="310" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Quick check — H₂ + I₂ ⇌ 2 HI,  K = 50 at 730 K</text>
  <text x="80"  y="332" font-size="11" fill="#1a202c">Mix [H₂]=0.1, [I₂]=0.1, [HI]=0.1  →  Q = (0.1)² / (0.1·0.1) = 1  ·  Q &lt; K  ⇒  forward.</text>
  <text x="80"  y="350" font-size="11" fill="#1a202c">Mix [H₂]=0.05, [I₂]=0.05, [HI]=2.0 →  Q = (2.0)² / (0.05·0.05) = 1600  ·  Q &gt; K  ⇒  reverse.</text>
  <text x="360" y="365" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">Q is just K's snapshot at the wrong time. The system always moves to make them equal.</text>
</svg>
