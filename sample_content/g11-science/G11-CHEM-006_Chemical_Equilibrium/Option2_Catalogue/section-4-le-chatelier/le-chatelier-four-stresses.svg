<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="Le Chateliers principle four stresses summary">
  <title>Le Chatelier's Principle — Four Stresses, Four Shifts</title>
  <desc>Four panels showing how an equilibrium responds to a stress. Add reactant: shifts forward to consume it. Increase pressure or decrease volume: shifts toward the side with fewer moles of gas. Increase temperature on an exothermic reaction: shifts reverse to absorb heat. Adding a catalyst: no shift, only faster approach. Each panel shows the stress, the shift direction, and a one-line rule.</desc>

  <defs>
    <marker id="lc-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="lc-arr-l" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#dc2626"/>
    </marker>
    <marker id="lc-arr-flat" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Le Chatelier's Principle — Four Stresses on an Equilibrium</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">"When a system at equilibrium is disturbed, it shifts in the direction that opposes the disturbance."</text>

  <!-- ═══ Panel 1: Concentration ═══ -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="310" height="170" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="155" y="20" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">1 · Add a reactant or product</text>

    <!-- Reaction arrows -->
    <text x="40"  y="60" font-size="14" font-weight="700" fill="#1a202c">A + B</text>
    <line x1="100" y1="56" x2="180" y2="56" stroke="#15803d" stroke-width="2.5" marker-end="url(#lc-arr-r)"/>
    <line x1="180" y1="64" x2="100" y2="64" stroke="#dc2626" stroke-width="2.5" marker-end="url(#lc-arr-l)"/>
    <text x="200" y="60" font-size="14" font-weight="700" fill="#1a202c">C + D</text>

    <text x="40"  y="100" font-size="11" font-weight="700" fill="#dc2626">+ extra A</text>
    <text x="40"  y="116" font-size="11" fill="#1a202c">→ shift forward (→), make more C, D</text>

    <text x="40"  y="140" font-size="11" font-weight="700" fill="#15803d">remove C</text>
    <text x="40"  y="156" font-size="11" fill="#1a202c">→ shift forward (→), replace what was lost</text>
  </g>

  <!-- ═══ Panel 2: Pressure / Volume ═══ -->
  <g transform="translate(370, 60)">
    <rect x="0" y="0" width="310" height="170" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
    <text x="155" y="20" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">2 · Change pressure / volume (gases)</text>

    <text x="20" y="50" font-size="13" font-weight="700" fill="#1a202c">N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g)</text>
    <text x="20" y="68" font-size="11" fill="#4a5568">      4 mol gas       2 mol gas</text>

    <text x="20" y="98" font-size="11" font-weight="700" fill="#dc2626">↑ pressure  (↓ volume)</text>
    <text x="20" y="114" font-size="11" fill="#1a202c">→ shift toward FEWER moles of gas (→ products)</text>

    <text x="20" y="138" font-size="11" font-weight="700" fill="#15803d">↓ pressure  (↑ volume)</text>
    <text x="20" y="154" font-size="11" fill="#1a202c">→ shift toward MORE moles of gas (← reactants)</text>
  </g>

  <!-- ═══ Panel 3: Temperature ═══ -->
  <g transform="translate(40, 250)">
    <rect x="0" y="0" width="310" height="170" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="155" y="20" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">3 · Change temperature (changes K too)</text>

    <text x="20" y="50" font-size="13" font-weight="700" fill="#1a202c">N₂ + 3 H₂ ⇌ 2 NH₃   ΔH = −92 kJ  (exo)</text>

    <text x="20" y="80" font-size="11" font-weight="700" fill="#dc2626">↑ T  (add heat)</text>
    <text x="20" y="96" font-size="11" fill="#1a202c">heat is a "product" → shift REVERSE  · K decreases</text>

    <text x="20" y="124" font-size="11" font-weight="700" fill="#15803d">↓ T  (remove heat)</text>
    <text x="20" y="140" font-size="11" fill="#1a202c">heat consumed in forward → shift FORWARD · K increases</text>
    <text x="20" y="158" font-size="10" font-style="italic" fill="#4a5568">⇒ T is the only stress that actually changes K.</text>
  </g>

  <!-- ═══ Panel 4: Catalyst ═══ -->
  <g transform="translate(370, 250)">
    <rect x="0" y="0" width="310" height="170" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="155" y="20" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">4 · Add a catalyst</text>

    <text x="40"  y="60" font-size="14" font-weight="700" fill="#1a202c">A + B</text>
    <line x1="100" y1="56" x2="180" y2="56" stroke="#4a5568" stroke-width="2.5" marker-end="url(#lc-arr-flat)"/>
    <line x1="180" y1="64" x2="100" y2="64" stroke="#4a5568" stroke-width="2.5" marker-end="url(#lc-arr-flat)"/>
    <text x="200" y="60" font-size="14" font-weight="700" fill="#1a202c">C + D</text>
    <text x="140" y="80" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">both rates increased equally</text>

    <text x="20" y="116" font-size="11" fill="#1a202c"><tspan font-weight="700">No shift.</tspan> Equilibrium reached <tspan font-weight="700">faster</tspan>.</text>
    <text x="20" y="134" font-size="11" fill="#1a202c">Same K. Same final concentrations.</text>
    <text x="20" y="158" font-size="10" font-style="italic" fill="#4a5568">A catalyst is a kinetic helper, not a position-shifter.</text>
  </g>

  <text x="360" y="448" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Rule of thumb: the system always pushes back against whatever you did to it.</text>
</svg>
