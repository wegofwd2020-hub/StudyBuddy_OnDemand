<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Concentration vs time approaching equilibrium">
  <title>Concentrations Approach Equilibrium</title>
  <desc>Line chart with time on the x-axis and concentration on the y-axis. Reactant concentration (orange) falls and levels off; product concentration (green) rises and levels off. After t_eq both curves are flat — concentrations are constant though molecules keep reacting in both directions.</desc>

  <defs>
    <marker id="cn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c"/>
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Concentrations vs Time — They Stop Changing, Not Reacting</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g) — closed flask at constant T.</text>

  <!-- Plot frame -->
  <line x1="80" y1="320" x2="640" y2="320" stroke="#1a202c" stroke-width="1.5" marker-end="url(#cn-arrow)"/>
  <line x1="80" y1="320" x2="80"  y2="70"  stroke="#1a202c" stroke-width="1.5" marker-end="url(#cn-arrow)"/>
  <text x="660" y="324" font-size="12" font-weight="700" fill="#1a202c">time</text>
  <text x="40" y="76" font-size="12" font-weight="700" fill="#1a202c">[X] / mol L⁻¹</text>

  <!-- Reactant curve (orange): high → plateaus -->
  <path d="M 80 100 Q 180 120, 260 165 Q 340 200, 420 220 L 620 220" fill="none" stroke="#dd6b20" stroke-width="3"/>

  <!-- Product curve (green): zero → plateaus -->
  <path d="M 80 320 Q 180 280, 260 230 Q 340 200, 420 180 L 620 180" fill="none" stroke="#15803d" stroke-width="3"/>

  <!-- Equilibrium region shading -->
  <rect x="420" y="70" width="220" height="250" fill="#fefce8" opacity="0.6"/>
  <line x1="420" y1="70" x2="420" y2="320" stroke="#92400e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="530" y="90" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">EQUILIBRIUM</text>
  <text x="530" y="106" font-size="10" fill="#92400e" text-anchor="middle">[reactants], [products] constant</text>
  <text x="420" y="338" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">t_eq</text>

  <!-- Curve labels -->
  <circle cx="170" cy="125" r="4" fill="#dd6b20"/>
  <text x="180" y="120" font-size="12" font-weight="700" fill="#dd6b20">[SO₂], [O₂] reactants</text>

  <circle cx="170" cy="290" r="4" fill="#15803d"/>
  <text x="180" y="295" font-size="12" font-weight="700" fill="#15803d">[SO₃] product</text>

  <!-- Note -->
  <rect x="100" y="338" width="520" height="34" rx="6" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="360" y="356" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Plateau ≠ stop. Each molecule still reacts — the two directions just cancel out.</text>
  <text x="360" y="370" font-size="10" fill="#4a5568" text-anchor="middle" font-style="italic">Equilibrium concentrations depend on T and starting amounts; the equilibrium constant K depends on T only.</text>
</svg>
