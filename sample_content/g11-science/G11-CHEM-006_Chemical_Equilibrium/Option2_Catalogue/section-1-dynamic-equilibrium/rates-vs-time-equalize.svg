<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Forward and reverse rates approaching equilibrium">
  <title>Forward and Reverse Rates vs Time — Approach to Equilibrium</title>
  <desc>Line chart with time on the x-axis and rate on the y-axis. The forward rate (blue) starts high and falls; the reverse rate (red) starts at zero and rises. At equilibrium time t_eq the two curves meet at a common value and stay equal — net rate is zero, but both directions are still happening.</desc>

  <defs>
    <marker id="rt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c"/>
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Forward and Reverse Rates Equalize at Equilibrium</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g) — both reactions never stop, they just match.</text>

  <!-- Plot frame -->
  <line x1="80" y1="320" x2="640" y2="320" stroke="#1a202c" stroke-width="1.5" marker-end="url(#rt-arrow)"/>
  <line x1="80" y1="320" x2="80"  y2="70"  stroke="#1a202c" stroke-width="1.5" marker-end="url(#rt-arrow)"/>
  <text x="660" y="324" font-size="12" font-weight="700" fill="#1a202c">time</text>
  <text x="44" y="76" font-size="12" font-weight="700" fill="#1a202c">rate</text>

  <!-- Y-axis tick: equilibrium rate -->
  <line x1="76" y1="200" x2="84" y2="200" stroke="#1a202c" stroke-width="1.5"/>
  <text x="72" y="204" font-size="10" fill="#4a5568" text-anchor="end">r_eq</text>

  <!-- Forward rate curve (blue) — starts high, decays toward r_eq -->
  <path d="M 80 90 Q 200 110, 280 150 Q 360 185, 440 200 L 620 200" fill="none" stroke="#2b6cb0" stroke-width="3"/>

  <!-- Reverse rate curve (red) — starts at 0, rises toward r_eq -->
  <path d="M 80 320 Q 200 290, 280 250 Q 360 215, 440 200 L 620 200" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- Equilibrium region shading -->
  <rect x="440" y="70" width="200" height="250" fill="#f0fdf4" opacity="0.55"/>
  <line x1="440" y1="70" x2="440" y2="320" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4"/>

  <text x="540" y="90" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">EQUILIBRIUM</text>
  <text x="540" y="106" font-size="10" fill="#15803d" text-anchor="middle">r_forward = r_reverse</text>
  <text x="540" y="120" font-size="10" fill="#15803d" text-anchor="middle">net change = 0</text>

  <!-- t_eq label -->
  <text x="440" y="338" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">t_eq</text>

  <!-- Curve labels -->
  <circle cx="200" cy="118" r="4" fill="#2b6cb0"/>
  <text x="210" y="113" font-size="12" font-weight="700" fill="#2b6cb0">forward rate r_f = k_f [N₂][H₂]³</text>

  <circle cx="200" cy="295" r="4" fill="#dc2626"/>
  <text x="210" y="298" font-size="12" font-weight="700" fill="#dc2626">reverse rate r_r = k_r [NH₃]²</text>

  <!-- Caption -->
  <text x="360" y="365" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Equilibrium is dynamic — molecules keep reacting, but each direction undoes the other. Concentrations stop changing.</text>
</svg>
