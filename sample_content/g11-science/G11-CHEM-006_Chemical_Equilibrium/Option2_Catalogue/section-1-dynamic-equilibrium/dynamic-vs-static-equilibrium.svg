<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Dynamic vs static equilibrium contrast">
  <title>Dynamic Equilibrium vs Static Equilibrium</title>
  <desc>Two side-by-side panels. Left: a static equilibrium — a book on a shelf, no motion, no exchange. Right: a dynamic chemical equilibrium — molecules continuously interconverting between reactant and product, with equal forward and reverse arrows. Chemical equilibria are always dynamic.</desc>

  <defs>
    <marker id="dyn-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="dyn-arr-l" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Dynamic vs Static — Why "Equilibrium" Doesn't Mean "Stopped"</text>

  <!-- ─── STATIC ─── -->
  <g transform="translate(40, 60)">
    <text x="150" y="14" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Static Equilibrium</text>
    <rect x="0" y="30" width="300" height="220" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>

    <!-- Shelf -->
    <line x1="40" y1="170" x2="260" y2="170" stroke="#1a202c" stroke-width="3"/>
    <!-- Book -->
    <rect x="120" y="135" width="60" height="35" fill="#92400e" stroke="#1a202c" stroke-width="1.5"/>
    <line x1="125" y1="142" x2="175" y2="142" stroke="#fef3c7" stroke-width="1"/>
    <line x1="125" y1="152" x2="175" y2="152" stroke="#fef3c7" stroke-width="1"/>
    <line x1="125" y1="162" x2="175" y2="162" stroke="#fef3c7" stroke-width="1"/>

    <!-- "no motion" tag -->
    <text x="150" y="200" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">no motion · no exchange</text>
    <text x="150" y="218" font-size="10" fill="#4a5568" text-anchor="middle">forces balance · nothing happens</text>

    <!-- Equation-style summary -->
    <rect x="20" y="240" width="260" height="36" rx="6" fill="#fff7ed" stroke="#92400e" stroke-width="1.2"/>
    <text x="150" y="262" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">r_forward = 0 = r_reverse</text>
  </g>

  <!-- Divider -->
  <line x1="360" y1="60" x2="360" y2="320" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ─── DYNAMIC ─── -->
  <g transform="translate(380, 60)">
    <text x="150" y="14" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Dynamic Equilibrium  (chemistry)</text>
    <rect x="0" y="30" width="300" height="220" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>

    <!-- Reactant cluster -->
    <g transform="translate(40, 90)">
      <circle cx="0"  cy="0"  r="9" fill="#2b6cb0" stroke="#1a202c" stroke-width="1"/>
      <circle cx="20" cy="14" r="9" fill="#2b6cb0" stroke="#1a202c" stroke-width="1"/>
      <circle cx="-6" cy="22" r="9" fill="#2b6cb0" stroke="#1a202c" stroke-width="1"/>
      <text x="10" y="-12" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="middle">A</text>
    </g>

    <!-- Product cluster -->
    <g transform="translate(220, 90)">
      <rect x="-10" y="-8" width="14" height="14" fill="#15803d" stroke="#1a202c" stroke-width="1"/>
      <rect x="10"  y="6"  width="14" height="14" fill="#15803d" stroke="#1a202c" stroke-width="1"/>
      <rect x="-2"  y="20" width="14" height="14" fill="#15803d" stroke="#1a202c" stroke-width="1"/>
      <text x="10" y="-12" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">B</text>
    </g>

    <!-- Forward arrow -->
    <line x1="80"  y1="100" x2="200" y2="100" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#dyn-arr-r)"/>
    <text x="140" y="93" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="middle">A → B</text>

    <!-- Reverse arrow -->
    <line x1="200" y1="120" x2="80" y2="120" stroke="#dc2626" stroke-width="2.5" marker-end="url(#dyn-arr-l)"/>
    <text x="140" y="138" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">B → A</text>

    <!-- "still reacting" tag -->
    <text x="150" y="200" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">molecules constantly switching</text>
    <text x="150" y="218" font-size="10" fill="#4a5568" text-anchor="middle">rates equal · concentrations constant</text>

    <rect x="20" y="240" width="260" height="36" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
    <text x="150" y="262" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">r_forward = r_reverse  &gt; 0</text>
  </g>

  <text x="360" y="345" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">A book sits still. A chemistry equilibrium runs hard in both directions and only looks still from outside.</text>
</svg>
