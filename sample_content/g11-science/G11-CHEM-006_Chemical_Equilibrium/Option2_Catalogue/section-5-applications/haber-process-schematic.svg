<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Haber process industrial schematic">
  <title>Haber Process — Compromise Conditions for Industrial NH₃</title>
  <desc>Block-flow diagram of the Haber process for ammonia synthesis. N₂ and H₂ are fed into a converter at 200 atm and ~450 °C with an iron catalyst. Effluent is cooled in a condenser; liquid NH₃ is removed and unreacted gases are recycled. Le Chatelier explains the conditions: high pressure favours the smaller-mole side; ΔH is negative so low T thermodynamically favours product but kinetics demand a moderate T; the catalyst speeds approach without changing K.</desc>

  <defs>
    <marker id="hp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c"/>
    </marker>
  </defs>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">The Haber Process — Equilibrium Engineering at Industrial Scale</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g)   ΔH = −92 kJ/mol   ·   feeds about half the world's nitrogen fertiliser.</text>

  <!-- Feed lines -->
  <g font-size="11" fill="#1a202c" font-weight="700">
    <rect x="40"  y="100" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="80" y="123" text-anchor="middle">N₂ feed</text>
    <rect x="40"  y="160" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="80" y="183" text-anchor="middle">H₂ feed</text>
  </g>
  <line x1="120" y1="118" x2="180" y2="148" stroke="#1a202c" stroke-width="2" marker-end="url(#hp-arr)"/>
  <line x1="120" y1="178" x2="180" y2="160" stroke="#1a202c" stroke-width="2" marker-end="url(#hp-arr)"/>

  <!-- Compressor -->
  <rect x="180" y="124" width="80" height="60" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="220" y="148" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Compressor</text>
  <text x="220" y="164" font-size="10" fill="#1a202c" text-anchor="middle">to ~200 atm</text>
  <text x="220" y="178" font-size="10" fill="#1a202c" text-anchor="middle">↑ P → fewer mol</text>

  <line x1="260" y1="154" x2="305" y2="154" stroke="#1a202c" stroke-width="2" marker-end="url(#hp-arr)"/>

  <!-- Converter (catalyst bed) -->
  <rect x="305" y="100" width="120" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="365" y="120" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">Converter</text>
  <text x="365" y="136" font-size="10" fill="#1a202c" text-anchor="middle">~ 450 °C</text>
  <!-- catalyst pellets -->
  <g fill="#92400e" stroke="#1a202c" stroke-width="0.5">
    <circle cx="325" cy="158" r="3"/><circle cx="335" cy="170" r="3"/><circle cx="346" cy="158" r="3"/>
    <circle cx="358" cy="172" r="3"/><circle cx="370" cy="158" r="3"/><circle cx="384" cy="170" r="3"/>
    <circle cx="396" cy="158" r="3"/><circle cx="408" cy="172" r="3"/><circle cx="334" cy="184" r="3"/>
    <circle cx="354" cy="190" r="3"/><circle cx="378" cy="184" r="3"/><circle cx="402" cy="190" r="3"/>
  </g>
  <text x="365" y="206" font-size="10" font-style="italic" fill="#92400e" text-anchor="middle">Fe catalyst (K₂O, Al₂O₃ promoters)</text>

  <line x1="425" y1="154" x2="470" y2="154" stroke="#1a202c" stroke-width="2" marker-end="url(#hp-arr)"/>

  <!-- Condenser / separator -->
  <rect x="470" y="124" width="100" height="60" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
  <text x="520" y="148" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="middle">Condenser</text>
  <text x="520" y="164" font-size="10" fill="#1a202c" text-anchor="middle">cool to liq.</text>
  <text x="520" y="178" font-size="10" fill="#1a202c" text-anchor="middle">remove NH₃</text>

  <!-- NH3 product out -->
  <line x1="520" y1="184" x2="520" y2="230" stroke="#1a202c" stroke-width="2" marker-end="url(#hp-arr)"/>
  <rect x="470" y="230" width="100" height="40" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="520" y="248" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">liquid NH₃</text>
  <text x="520" y="263" font-size="10" fill="#1a202c" text-anchor="middle">to fertiliser plant</text>

  <!-- Recycle loop -->
  <line x1="570" y1="154" x2="640" y2="154" stroke="#1a202c" stroke-width="2"/>
  <line x1="640" y1="154" x2="640" y2="84"  stroke="#1a202c" stroke-width="2"/>
  <line x1="640" y1="84"  x2="220" y2="84"  stroke="#1a202c" stroke-width="2"/>
  <line x1="220" y1="84"  x2="220" y2="124" stroke="#1a202c" stroke-width="2" marker-end="url(#hp-arr)"/>
  <text x="430" y="76" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">recycle unreacted N₂ + H₂</text>

  <!-- Le Chatelier reasoning panel -->
  <rect x="40" y="290" width="640" height="100" rx="8" fill="#fefce8" stroke="#92400e" stroke-width="1.5"/>
  <text x="60" y="312" font-size="12" font-weight="700" fill="#92400e">Why these conditions? — Le Chatelier vs kinetics</text>
  <text x="60" y="332" font-size="11" fill="#1a202c"><tspan font-weight="700">Pressure ~200 atm:</tspan> 4 mol gas → 2 mol gas, so high P shifts forward (more NH₃).</text>
  <text x="60" y="350" font-size="11" fill="#1a202c"><tspan font-weight="700">Temperature ~450 °C:</tspan> ΔH &lt; 0, so lower T gives higher K — but rate is too slow. 450 °C is a compromise.</text>
  <text x="60" y="368" font-size="11" fill="#1a202c"><tspan font-weight="700">Iron catalyst:</tspan> speeds both directions equally — same K, same NH₃ yield, but reached fast enough to be commercial.</text>
  <text x="60" y="384" font-size="11" fill="#1a202c"><tspan font-weight="700">Recycle:</tspan> single-pass conversion is only ~15% — recovering unreacted N₂/H₂ pushes overall yield to ~97%.</text>
</svg>
