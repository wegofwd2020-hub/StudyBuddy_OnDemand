<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Molar mass — periodic table excerpt">
  <title>Molar Mass — Read It Off the Periodic Table</title>
  <desc>A row of common-element periodic-table tiles (H, C, N, O, Na, Mg, Cl). Each tile shows the symbol, atomic number, and atomic mass in u. The atomic mass in u also gives the molar mass in g/mol — same number, different units. Below: example molar mass for water H₂O = 18 g/mol.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Molar Mass — Read It Off the Periodic Table</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">The atomic mass in u (per atom) and the molar mass in g/mol (per mole of atoms) are numerically identical.</text>

  <!-- Periodic table tiles row -->
  <g>
    <!-- H -->
    <rect x="60" y="70" width="80" height="90" rx="6" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="68" y="86" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1e3a8a">1</text>
    <text x="100" y="124" font="bold 26px system-ui" font-size="26" font-weight="700" fill="#1e3a8a" text-anchor="middle">H</text>
    <text x="100" y="148" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">1.008</text>

    <!-- C -->
    <rect x="150" y="70" width="80" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="158" y="86" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#92400e">6</text>
    <text x="190" y="124" font="bold 26px system-ui" font-size="26" font-weight="700" fill="#92400e" text-anchor="middle">C</text>
    <text x="190" y="148" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">12.01</text>

    <!-- N -->
    <rect x="240" y="70" width="80" height="90" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="248" y="86" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#14532d">7</text>
    <text x="280" y="124" font="bold 26px system-ui" font-size="26" font-weight="700" fill="#14532d" text-anchor="middle">N</text>
    <text x="280" y="148" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">14.01</text>

    <!-- O -->
    <rect x="330" y="70" width="80" height="90" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="338" y="86" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#991b1b">8</text>
    <text x="370" y="124" font="bold 26px system-ui" font-size="26" font-weight="700" fill="#991b1b" text-anchor="middle">O</text>
    <text x="370" y="148" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">16.00</text>

    <!-- Na -->
    <rect x="420" y="70" width="80" height="90" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <text x="428" y="86" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#7c2d12">11</text>
    <text x="460" y="124" font="bold 26px system-ui" font-size="26" font-weight="700" fill="#7c2d12" text-anchor="middle">Na</text>
    <text x="460" y="148" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">22.99</text>

    <!-- Mg -->
    <rect x="510" y="70" width="80" height="90" rx="6" fill="#fde68a" stroke="#a16207" stroke-width="2"/>
    <text x="518" y="86" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#713f12">12</text>
    <text x="550" y="124" font="bold 26px system-ui" font-size="26" font-weight="700" fill="#713f12" text-anchor="middle">Mg</text>
    <text x="550" y="148" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">24.31</text>

    <!-- Cl -->
    <rect x="600" y="70" width="80" height="90" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
    <text x="608" y="86" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#064e3b">17</text>
    <text x="640" y="124" font="bold 26px system-ui" font-size="26" font-weight="700" fill="#064e3b" text-anchor="middle">Cl</text>
    <text x="640" y="148" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">35.45</text>
  </g>

  <!-- Tile legend -->
  <text x="370" y="180" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">↑ atomic number   ·   ↑ symbol   ·   ↑ atomic mass (u  =  g/mol)</text>

  <!-- Worked example: H2O molar mass -->
  <rect x="60" y="200" width="620" height="130" rx="10" fill="#f7fafc" stroke="#1a202c" stroke-width="1.5"/>
  <text x="370" y="222" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Worked example  ·  Molar mass of  H₂O</text>

  <!-- breakdown -->
  <text x="100" y="252" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c">M(H₂O)</text>
  <text x="190" y="252" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c">=</text>
  <text x="220" y="252" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a">2 × M(H)</text>
  <text x="320" y="252" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c">+</text>
  <text x="345" y="252" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#991b1b">1 × M(O)</text>

  <text x="220" y="278" font="12px system-ui" font-size="12" fill="#1e3a8a" text-anchor="start">2 × 1.008 g/mol</text>
  <text x="345" y="278" font="12px system-ui" font-size="12" fill="#991b1b" text-anchor="start">1 × 16.00 g/mol</text>

  <text x="220" y="306" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a">2.016 g/mol</text>
  <text x="320" y="306" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c">+</text>
  <text x="345" y="306" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#991b1b">16.00 g/mol</text>

  <line x1="450" y1="246" x2="490" y2="246" stroke="#1a202c" stroke-width="1.5" marker-end="url(#mm-arr)"/>

  <text x="540" y="270" font="bold 22px system-ui" font-size="22" font-weight="700" fill="#1a202c" text-anchor="middle">18.02 g/mol</text>
  <text x="540" y="296" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">i.e. 1 mole of water = 18.02 g</text>

  <defs>
    <marker id="mm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c"/>
    </marker>
  </defs>

</svg>
