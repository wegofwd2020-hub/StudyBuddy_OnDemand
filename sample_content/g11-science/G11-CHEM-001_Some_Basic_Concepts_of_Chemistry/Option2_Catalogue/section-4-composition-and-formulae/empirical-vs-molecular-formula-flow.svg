<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Empirical vs molecular formula derivation flowchart">
  <title>Empirical vs Molecular Formula — Step-by-Step Flow</title>
  <desc>A five-step flowchart deriving the empirical and molecular formulas of glucose from percent composition (40 percent C, 6.7 percent H, 53.3 percent O) and a known molar mass of 180 g per mol. Steps: assume 100 g sample, divide each mass by molar mass to get moles, divide all by smallest, get empirical formula CH₂O, then divide molecular molar mass by empirical molar mass to get the multiplier (6) and the molecular formula C₆H₁₂O₆.</desc>

  <defs>
    <marker id="ef-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Empirical vs Molecular Formula  ·  Worked Example: Glucose</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Given: 40.0% C, 6.7% H, 53.3% O   ·   molecular molar mass = 180 g/mol</text>

  <!-- Step 1 -->
  <rect x="40" y="60" width="640" height="50" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
  <text x="60" y="82" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a">Step 1.</text>
  <text x="120" y="82" font="13px system-ui" font-size="13" fill="#1a202c">Assume a 100 g sample → percentages become grams.</text>
  <text x="120" y="100" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c">C: 40.0 g    ·    H: 6.7 g    ·    O: 53.3 g</text>

  <line x1="360" y1="112" x2="360" y2="130" stroke="#4a5568" stroke-width="2" marker-end="url(#ef-arr)"/>

  <!-- Step 2 -->
  <rect x="40" y="132" width="640" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="60" y="154" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#14532d">Step 2.</text>
  <text x="120" y="154" font="13px system-ui" font-size="13" fill="#1a202c">Convert each mass → moles by dividing by molar mass of element.</text>
  <text x="120" y="174" font="12px system-ui" font-size="12" fill="#1a202c">C: 40.0 ÷ 12.0 = 3.33 mol   ·   H: 6.7 ÷ 1.0 = 6.67 mol   ·   O: 53.3 ÷ 16.0 = 3.33 mol</text>

  <line x1="360" y1="194" x2="360" y2="212" stroke="#4a5568" stroke-width="2" marker-end="url(#ef-arr)"/>

  <!-- Step 3 -->
  <rect x="40" y="214" width="640" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="236" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#92400e">Step 3.</text>
  <text x="120" y="236" font="13px system-ui" font-size="13" fill="#1a202c">Divide all by the smallest mole count to get a whole-number ratio.</text>
  <text x="120" y="256" font="12px system-ui" font-size="12" fill="#1a202c">C: 3.33 ÷ 3.33 = 1   ·   H: 6.67 ÷ 3.33 = 2   ·   O: 3.33 ÷ 3.33 = 1</text>

  <line x1="360" y1="276" x2="360" y2="294" stroke="#4a5568" stroke-width="2" marker-end="url(#ef-arr)"/>

  <!-- Step 4: Empirical formula -->
  <rect x="40" y="296" width="640" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="318" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#991b1b">Step 4.</text>
  <text x="120" y="318" font="13px system-ui" font-size="13" fill="#1a202c">Empirical formula = simplest whole-number atom ratio.</text>
  <text x="500" y="318" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#991b1b">→  CH₂O</text>
  <text x="120" y="336" font="11px system-ui" font-size="11" fill="#4a5568">empirical molar mass  =  12 + 2(1) + 16  =  30 g/mol</text>

  <line x1="360" y1="348" x2="360" y2="366" stroke="#4a5568" stroke-width="2" marker-end="url(#ef-arr)"/>

  <!-- Step 5: Molecular formula -->
  <rect x="40" y="368" width="640" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="390" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#5b21b6">Step 5.</text>
  <text x="120" y="390" font="13px system-ui" font-size="13" fill="#1a202c">multiplier = (molecular M) / (empirical M)  =  180 / 30  =  6   →   multiply subscripts.</text>
  <text x="500" y="408" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#5b21b6">→  C₆H₁₂O₆</text>
  <text x="120" y="408" font="11px system-ui" font-size="11" fill="#4a5568">empirical CH₂O × 6  =  molecular C₆H₁₂O₆</text>

</svg>
