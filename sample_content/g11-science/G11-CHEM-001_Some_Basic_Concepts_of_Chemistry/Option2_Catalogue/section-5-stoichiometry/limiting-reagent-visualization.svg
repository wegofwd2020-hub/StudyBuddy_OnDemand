<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Limiting reagent visualisation — H2 plus O2 react in 2 to 1 ratio">
  <title>Limiting Reagent — Whoever Runs Out First</title>
  <desc>For 2 H₂ + O₂ → 2 H₂O. We start with 6 H₂ molecules and 4 O₂ molecules. Each O₂ needs 2 H₂. After 3 reactions, all 6 H₂ are used and only 3 O₂ are consumed; 1 O₂ molecule remains. H₂ is the limiting reagent; O₂ is the excess.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Limiting Reagent  ·  2 H₂ + O₂ → 2 H₂O</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Start with 6 H₂ and 4 O₂.  Each reaction needs 2 H₂ + 1 O₂.  Whoever runs out first stops everything.</text>

  <!-- BEFORE row -->
  <rect x="40" y="60" width="640" height="120" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
  <text x="60" y="82" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a">Before reaction</text>

  <!-- 6 H2 molecules -->
  <text x="80" y="106" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#92400e">6 H₂</text>
  <g>
    <circle cx="125" cy="130" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="143" cy="130" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <line x1="133" y1="130" x2="135" y2="130" stroke="#92400e" stroke-width="2"/>

    <circle cx="170" cy="130" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="188" cy="130" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>

    <circle cx="215" cy="130" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="233" cy="130" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>

    <circle cx="125" cy="160" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="143" cy="160" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>

    <circle cx="170" cy="160" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="188" cy="160" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>

    <circle cx="215" cy="160" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="233" cy="160" r="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  </g>

  <text x="290" y="148" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c">+</text>

  <!-- 4 O2 molecules -->
  <text x="320" y="106" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#991b1b">4 O₂</text>
  <g>
    <circle cx="365" cy="130" r="11" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="389" cy="130" r="11" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>

    <circle cx="425" cy="130" r="11" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="449" cy="130" r="11" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>

    <circle cx="365" cy="160" r="11" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="389" cy="160" r="11" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>

    <circle cx="425" cy="160" r="11" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="449" cy="160" r="11" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
  </g>

  <!-- pairing brackets to show 2H2 : 1O2 grouping -->
  <text x="540" y="118" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c">need 2 : 1</text>
  <text x="540" y="138" font="11px system-ui" font-size="11" fill="#1a202c">have 6 : 4 ratio</text>
  <text x="540" y="158" font="11px system-ui" font-size="11" fill="#1a202c">H₂ pairs available: 3</text>
  <text x="540" y="174" font="11px system-ui" font-size="11" fill="#1a202c">O₂ available: 4</text>

  <!-- Arrow down -->
  <line x1="360" y1="190" x2="360" y2="216" stroke="#4a5568" stroke-width="2.5" marker-end="url(#lr-arr)"/>
  <text x="380" y="208" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c">react</text>

  <!-- AFTER row -->
  <rect x="40" y="220" width="640" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="60" y="242" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#14532d">After reaction</text>

  <!-- 6 H2O molecules (product) -->
  <text x="80" y="266" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#14532d">6 H₂O</text>
  <g>
    <!-- water molecules: O with two H -->
    <g>
      <circle cx="135" cy="290" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.2"/>
      <circle cx="127" cy="282" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
      <circle cx="143" cy="282" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    </g>
    <g>
      <circle cx="175" cy="290" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.2"/>
      <circle cx="167" cy="282" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
      <circle cx="183" cy="282" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    </g>
    <g>
      <circle cx="215" cy="290" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.2"/>
      <circle cx="207" cy="282" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
      <circle cx="223" cy="282" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    </g>
    <g>
      <circle cx="135" cy="320" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.2"/>
      <circle cx="127" cy="312" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
      <circle cx="143" cy="312" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    </g>
    <g>
      <circle cx="175" cy="320" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.2"/>
      <circle cx="167" cy="312" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
      <circle cx="183" cy="312" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    </g>
    <g>
      <circle cx="215" cy="320" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.2"/>
      <circle cx="207" cy="312" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
      <circle cx="223" cy="312" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    </g>
  </g>

  <text x="290" y="305" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c">+</text>

  <!-- 0 H2 left, 1 O2 left, struck-through pairs -->
  <text x="320" y="266" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#991b1b">1 O₂ excess</text>
  <circle cx="365" cy="305" r="11" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
  <circle cx="389" cy="305" r="11" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>

  <!-- Used-up tally -->
  <rect x="430" y="266" width="240" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="550" y="284" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Used: 6 H₂ + 3 O₂</text>
  <text x="550" y="302" font="11px system-ui" font-size="11" fill="#92400e" text-anchor="middle">Made: 6 H₂O</text>
  <text x="550" y="320" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">Limiting: H₂   ·   Excess: O₂ (1 left)</text>

  <text x="360" y="362" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Always check: convert each starting amount to the SAME product, then take the SMALLER answer. That's your real yield.</text>

  <defs>
    <marker id="lr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

</svg>
