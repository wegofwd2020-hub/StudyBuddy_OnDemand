<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Percent yield calculation — theoretical vs actual">
  <title>Percent Yield — Theoretical vs Actual</title>
  <desc>A flow showing theoretical yield (calculated from stoichiometry) versus actual yield (measured in lab), with the percent-yield formula and a worked example: Mg + 2 HCl → MgCl₂ + H₂. Theoretical 95.2 g MgCl₂; actual 84.7 g MgCl₂; percent yield = 89 percent.</desc>

  <defs>
    <marker id="py-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Percent Yield  ·  How Close Did the Lab Result Come to the Calculation?</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Reactions are rarely 100% — losses happen from side reactions, transfer spills, incomplete reactions, evaporation.</text>

  <!-- Theoretical box -->
  <rect x="40" y="70" width="270" height="100" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
  <text x="175" y="92" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Theoretical Yield</text>
  <text x="175" y="112" font="11px system-ui" font-size="11" fill="#1e3a8a" text-anchor="middle">from balanced equation + limiting reagent</text>
  <text x="175" y="142" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">95.2 g  MgCl₂</text>
  <text x="175" y="160" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">paper-and-pencil maximum</text>

  <!-- Actual box -->
  <rect x="410" y="70" width="270" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="545" y="92" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">Actual Yield</text>
  <text x="545" y="112" font="11px system-ui" font-size="11" fill="#14532d" text-anchor="middle">measured on the balance after the experiment</text>
  <text x="545" y="142" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">84.7 g  MgCl₂</text>
  <text x="545" y="160" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">real-world result</text>

  <!-- Connecting arrows down -->
  <line x1="175" y1="172" x2="175" y2="200" stroke="#4a5568" stroke-width="1.5" marker-end="url(#py-arr)"/>
  <line x1="545" y1="172" x2="545" y2="200" stroke="#4a5568" stroke-width="1.5" marker-end="url(#py-arr)"/>

  <!-- Formula box -->
  <rect x="40" y="208" width="640" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="120" y="230" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">% yield  =</text>
  <!-- fraction -->
  <text x="290" y="226" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">actual yield</text>
  <line x1="220" y1="234" x2="360" y2="234" stroke="#1a202c" stroke-width="1.5"/>
  <text x="290" y="252" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">theoretical yield</text>
  <text x="392" y="240" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">×  100%</text>

  <!-- worked -->
  <text x="510" y="226" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">84.7</text>
  <line x1="475" y1="234" x2="555" y2="234" stroke="#1a202c" stroke-width="1.5"/>
  <text x="515" y="252" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">95.2</text>
  <text x="582" y="240" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c">×  100%</text>

  <!-- = -->
  <text x="650" y="240" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle">= 89%</text>

  <!-- Bottom callout -->
  <text x="360" y="298" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Reaction:  Mg(s)  +  2 HCl(aq)  →  MgCl₂(aq)  +  H₂(g)   ·   89% means we got 89 g of product for every 100 g possible.</text>

</svg>
