<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Law of Conservation of Mass — balance scale">
  <title>Law of Conservation of Mass</title>
  <desc>A balance scale showing reactants on the left pan and products on the right pan. Reactants: 2 H₂ + O₂ at 4 g + 32 g = 36 g. Products: 2 H₂O at 36 g. The scale stays level — total mass before = total mass after.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Law of Conservation of Mass</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">In a closed system, the total mass of reactants equals the total mass of products. Atoms are rearranged, never created or destroyed.</text>

  <!-- Balance scale -->
  <!-- Stand and base -->
  <line x1="360" y1="120" x2="360" y2="290" stroke="#1a202c" stroke-width="3"/>
  <rect x="320" y="290" width="80" height="14" rx="3" fill="#4a5568" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="290" y="304" width="140" height="10" rx="3" fill="#1a202c"/>

  <!-- Beam -->
  <line x1="120" y1="120" x2="600" y2="120" stroke="#1a202c" stroke-width="4"/>
  <circle cx="360" cy="120" r="8" fill="#fef3c7" stroke="#1a202c" stroke-width="2"/>

  <!-- Left strings -->
  <line x1="180" y1="120" x2="180" y2="170" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="240" y1="120" x2="240" y2="170" stroke="#4a5568" stroke-width="1.5"/>

  <!-- Right strings -->
  <line x1="480" y1="120" x2="480" y2="170" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="540" y1="120" x2="540" y2="170" stroke="#4a5568" stroke-width="1.5"/>

  <!-- Left pan -->
  <path d="M 130 170 Q 210 200 290 170" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="130" y1="170" x2="290" y2="170" stroke="#2b6cb0" stroke-width="2"/>

  <!-- Right pan -->
  <path d="M 430 170 Q 510 200 590 170" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <line x1="430" y1="170" x2="590" y2="170" stroke="#15803d" stroke-width="2"/>

  <!-- Pan labels -->
  <text x="210" y="100" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Reactants</text>
  <text x="510" y="100" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Products</text>

  <!-- LEFT pan contents: 2 H2 + O2 -->
  <!-- 2 H2 molecules -->
  <circle cx="170" cy="156" r="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <circle cx="182" cy="156" r="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="176" y="142" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H₂</text>

  <circle cx="200" cy="156" r="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <circle cx="212" cy="156" r="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="206" y="142" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H₂</text>

  <!-- O2 -->
  <circle cx="240" cy="156" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.2"/>
  <circle cx="258" cy="156" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.2"/>
  <text x="249" y="138" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">O₂</text>

  <!-- Mass label left -->
  <text x="210" y="225" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">2 H₂ + O₂</text>
  <text x="210" y="244" font="11px system-ui" font-size="11" fill="#1a202c" text-anchor="middle">2(2 g) + 32 g</text>
  <text x="210" y="262" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">= 36 g</text>

  <!-- RIGHT pan contents: 2 H2O -->
  <!-- water molecule 1 (O with 2 H) -->
  <circle cx="475" cy="158" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.2"/>
  <circle cx="466" cy="148" r="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <circle cx="484" cy="148" r="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="475" y="138" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">H₂O</text>

  <!-- water molecule 2 -->
  <circle cx="525" cy="158" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.2"/>
  <circle cx="516" cy="148" r="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <circle cx="534" cy="148" r="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="525" y="138" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">H₂O</text>

  <!-- Mass label right -->
  <text x="510" y="225" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">2 H₂O</text>
  <text x="510" y="244" font="11px system-ui" font-size="11" fill="#1a202c" text-anchor="middle">2(18 g)</text>
  <text x="510" y="262" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">= 36 g</text>

  <!-- Equation -->
  <text x="360" y="335" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">2 H₂  +  O₂   →   2 H₂O      ·      36 g  =  36 g  ✓</text>

</svg>
