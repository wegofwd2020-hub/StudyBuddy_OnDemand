<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Law of Definite Proportions — water samples">
  <title>Law of Definite Proportions</title>
  <desc>Three water samples from different sources (river, ocean, lab synthesis) all show the same mass ratio of hydrogen to oxygen — 1 g H : 8 g O — because pure H₂O always has the same composition.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Law of Definite Proportions (Proust, 1799)</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">A given compound, no matter the source, always contains the same elements in the same mass ratio.</text>

  <!-- Three sample panels -->
  <g>
    <!-- Sample 1 - River -->
    <rect x="40" y="70" width="200" height="180" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="140" y="92" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">River water (purified)</text>

    <!-- beaker icon -->
    <path d="M 100 110 L 100 168 Q 100 178 110 178 L 170 178 Q 180 178 180 168 L 180 110 Z" fill="#e0f2fe" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="100" y1="135" x2="180" y2="135" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- ratio bar -->
    <rect x="60" y="190" width="20" height="40" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <text x="70" y="244" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="70" y="186" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">1 g</text>

    <rect x="100" y="190" width="120" height="40" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <text x="160" y="216" font="bold 11px system-ui" font-size="11" font-weight="700" fill="white" text-anchor="middle">O — 8 g</text>
    <text x="160" y="186" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">8 g</text>
  </g>

  <g>
    <!-- Sample 2 - Ocean -->
    <rect x="260" y="70" width="200" height="180" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="360" y="92" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Ocean water (distilled)</text>

    <path d="M 320 110 L 320 168 Q 320 178 330 178 L 390 178 Q 400 178 400 168 L 400 110 Z" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
    <line x1="320" y1="135" x2="400" y2="135" stroke="#14532d" stroke-width="1" stroke-dasharray="3 2"/>

    <rect x="280" y="190" width="20" height="40" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <text x="290" y="244" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="290" y="186" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">1 g</text>

    <rect x="320" y="190" width="120" height="40" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <text x="380" y="216" font="bold 11px system-ui" font-size="11" font-weight="700" fill="white" text-anchor="middle">O — 8 g</text>
    <text x="380" y="186" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">8 g</text>
  </g>

  <g>
    <!-- Sample 3 - Lab -->
    <rect x="480" y="70" width="200" height="180" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="580" y="92" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Lab synthesis (H₂ + O₂ → H₂O)</text>

    <path d="M 540 110 L 540 168 Q 540 178 550 178 L 610 178 Q 620 178 620 168 L 620 110 Z" fill="#fef9c3" stroke="#92400e" stroke-width="2"/>
    <line x1="540" y1="135" x2="620" y2="135" stroke="#92400e" stroke-width="1" stroke-dasharray="3 2"/>

    <rect x="500" y="190" width="20" height="40" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <text x="510" y="244" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="510" y="186" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">1 g</text>

    <rect x="540" y="190" width="120" height="40" fill="#dc2626" stroke="#1a202c" stroke-width="1.5"/>
    <text x="600" y="216" font="bold 11px system-ui" font-size="11" font-weight="700" fill="white" text-anchor="middle">O — 8 g</text>
    <text x="600" y="186" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">8 g</text>
  </g>

  <!-- Bottom equation -->
  <text x="360" y="282" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">In every sample of pure H₂O:    mass of H : mass of O   =   1 : 8</text>
  <text x="360" y="302" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">If a different mass ratio is found, it isn't water — it's a different compound (e.g. H₂O₂ has 1 : 16).</text>

</svg>
