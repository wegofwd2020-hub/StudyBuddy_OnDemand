<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Rutherford nuclear model">
  <title>Rutherford nuclear model</title>
  <desc>A small dense red nucleus at center surrounded by two dashed orbital paths. Four small blue electrons sit on the orbits at various positions, illustrating the planetary atomic model.</desc>
  
  <text x="240" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Rutherford's Nuclear Model (1911)</text>
  <text x="240" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">A tiny dense positive nucleus surrounded by mostly empty space with electrons orbiting like planets.</text>

  <!-- Orbit -->
  <ellipse cx="240" cy="160" rx="90" ry="85.5" fill="none" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="4 4" />
  <ellipse cx="240" cy="160" rx="120" ry="114" fill="none" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- Tiny dense nucleus (overstated for visibility, real ratio ~10^-5) -->
  <circle cx="240" cy="160" r="14" fill="#dc2626" stroke="#1a202c" stroke-width="2" />
  <text x="240" y="164" font="bold 11px system-ui" font-size="11" font-weight="700" fill="white" text-anchor="middle">+</text>
  <text x="240" y="192" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">nucleus</text>
  <text x="240" y="208" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">~99.9% of mass</text>

  <!-- Electrons on orbits -->
  <circle cx="330" cy="160" r="7" fill="#2b6cb0" stroke="#1a202c" stroke-width="1.2" />
  <circle cx="177" cy="223" r="7" fill="#2b6cb0" stroke="#1a202c" stroke-width="1.2" />
  <circle cx="180" cy="58" r="7" fill="#2b6cb0" stroke="#1a202c" stroke-width="1.2" />
  <circle cx="342" cy="100" r="7" fill="#2b6cb0" stroke="#1a202c" stroke-width="1.2" />

  <!-- Empty-space callout -->
  <text x="80" y="120" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#4a5568">mostly empty space</text>

  <text x="240" y="268" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Problem: classically, an orbiting electron should radiate energy and spiral into the nucleus.</text>

</svg>
