<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" role="img" aria-label="Bohr shell model">
  <title>Bohr shell model</title>
  <desc>An atom diagram with three concentric quantized shells (K, L, M for n = 1, 2, 3). The nucleus sits at center; 2 electrons fill the K shell, 8 fill L, 5 fill M (phosphorus-like). A simplified energy-ladder shows the n = 1, 2, 3 levels rising vertically.</desc>
  
  <text x="260" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Bohr Shell Model</text>
  <text x="260" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Electrons occupy specific quantized circular shells. Higher n = farther from the nucleus and higher energy.</text>
<circle cx="260" cy="175" r="50" fill="none" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="4 3" /><text x="314" y="179" font="11px system-ui" font-size="11" fill="#4a5568">K (n=1)</text><circle cx="260" cy="175" r="95" fill="none" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="4 3" /><text x="359" y="179" font="11px system-ui" font-size="11" fill="#4a5568">L (n=2)</text><circle cx="260" cy="175" r="145" fill="none" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="4 3" /><text x="409" y="179" font="11px system-ui" font-size="11" fill="#4a5568">M (n=3)</text>
  <circle cx="260" cy="175" r="20" fill="#dc2626" stroke="#1a202c" stroke-width="2" />
  <text x="260" y="180" font="bold 12px system-ui" font-size="12" font-weight="700" fill="white" text-anchor="middle">nucleus</text>
<circle cx="310.0" cy="175.0" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="210.0" cy="175.0" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="353.1" cy="193.9" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="312.5" cy="254.2" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="241.1" cy="268.1" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="180.8" cy="227.5" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="166.9" cy="156.1" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="207.5" cy="95.8" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="278.9" cy="81.9" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="339.2" cy="122.5" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="393.6" cy="231.5" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="247.6" cy="319.5" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="118.8" cy="207.8" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="185.1" cy="50.8" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" /><circle cx="355.0" cy="65.4" r="6" fill="#2b6cb0" stroke="#1a202c" stroke-width="1" />
  <!-- Energy ladder on the right -->
  <g transform="translate(420, 60)">
    <text x="0" y="0" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c">Energy</text>
    <line x1="-2" y1="20" x2="60" y2="20" stroke="#4a5568" stroke-width="2" />
    <text x="64" y="24" font="10px system-ui" font-size="10" fill="#4a5568">n = 1</text>
    <line x1="-2" y1="80" x2="60" y2="80" stroke="#4a5568" stroke-width="2" />
    <text x="64" y="84" font="10px system-ui" font-size="10" fill="#4a5568">n = 2</text>
    <line x1="-2" y1="160" x2="60" y2="160" stroke="#4a5568" stroke-width="2" />
    <text x="64" y="164" font="10px system-ui" font-size="10" fill="#4a5568">n = 3</text>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#1a202c" stroke-width="1" marker-end="url(#energy-arr)" />
  </g>
  <defs>
    <marker id="energy-arr" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#1a202c" />
    </marker>
  </defs>

  <text x="260" y="305" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Electrons can only occupy shells; jumping between shells absorbs or emits a photon of fixed energy.</text>

</svg>
