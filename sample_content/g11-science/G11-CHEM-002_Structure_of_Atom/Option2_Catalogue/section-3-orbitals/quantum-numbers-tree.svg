<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320" role="img" aria-label="Quantum numbers — n l m_l m_s">
  <title>Quantum numbers — n l m_l m_s</title>
  <desc>Four labelled boxes showing the four quantum numbers in hierarchy: n (principal, energy/shell), l (azimuthal, subshell shape), m_l (magnetic, orientation), and m_s (spin). A row at the bottom translates l = 0,1,2,3 to s, p, d, f.</desc>
  
  <text x="270" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Quantum Numbers — n, l, mₗ, mₛ</text>

  <!-- Hierarchy boxes -->
  <g>
    <rect x="40" y="60" width="140" height="60" rx="8" fill="#f7fafc" stroke="#2b6cb0" stroke-width="2" />
    <text x="110" y="82" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#2b6cb0" text-anchor="middle">n  (principal)</text>
    <text x="110" y="102" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">1, 2, 3, ...</text>
    <text x="110" y="116" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">shell · energy</text>
  </g>
  <g>
    <rect x="200" y="60" width="140" height="60" rx="8" fill="#f7fafc" stroke="#dd6b20" stroke-width="2" />
    <text x="270" y="82" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#dd6b20" text-anchor="middle">l  (azimuthal)</text>
    <text x="270" y="102" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0 to n−1</text>
    <text x="270" y="116" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">subshell · shape</text>
  </g>
  <g>
    <rect x="360" y="60" width="140" height="60" rx="8" fill="#f7fafc" stroke="#319795" stroke-width="2" />
    <text x="430" y="82" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#319795" text-anchor="middle">mₗ  (magnetic)</text>
    <text x="430" y="102" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">−l to +l</text>
    <text x="430" y="116" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">orbital · orientation</text>
  </g>

  <!-- Arrows down to mₛ -->
  <line x1="270" y1="124" x2="270" y2="160" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4 3" />
  <g>
    <rect x="200" y="160" width="140" height="60" rx="8" fill="#f7fafc" stroke="#dc2626" stroke-width="2" />
    <text x="270" y="182" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">mₛ  (spin)</text>
    <text x="270" y="202" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">+½ or −½</text>
    <text x="270" y="216" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">electron spin</text>
  </g>

  <!-- Subshell letters for l -->
  <text x="60" y="252" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c">l = 0 → s</text>
  <text x="160" y="252" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c">l = 1 → p</text>
  <text x="260" y="252" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c">l = 2 → d</text>
  <text x="360" y="252" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c">l = 3 → f</text>

  <text x="270" y="280" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Together (n, l, mₗ, mₛ) is a unique address for each electron — Pauli exclusion forbids any duplicate.</text>
  <text x="270" y="298" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Example: 2p_z with spin up → (n=2, l=1, mₗ=0, mₛ=+½)</text>

</svg>
