<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" role="img" aria-label="Nitrogen orbital diagram with Hund's rule">
  <title>Nitrogen orbital diagram with Hund's rule</title>
  <desc>Five labelled orbital boxes (1s, 2s, 2pₓ, 2p_y, 2p_z) for nitrogen. The 1s and 2s boxes each hold paired up/down arrows (filled). Each of the three 2p boxes holds a single up arrow (Hund's rule: spread before pairing).</desc>
  
  <text x="250" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Orbital Diagram — Nitrogen (Hund's Rule)</text>
  <text x="250" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">N: 1s² 2s² 2p³ — three 2p electrons each occupy their own orbital with parallel spins.</text>

    <rect x="80" y="130" width="48" height="36" rx="6" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.8" />
    <text x="104" y="188" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">1s</text>
      <line x1="94" y1="160" x2="94" y2="136" stroke="#1a202c" stroke-width="2" marker-end="url(#hund-up)" />
      <line x1="114" y1="136" x2="114" y2="160" stroke="#1a202c" stroke-width="2" marker-end="url(#hund-down)" />
    <rect x="158" y="130" width="48" height="36" rx="6" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.8" />
    <text x="182" y="188" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">2s</text>
      <line x1="172" y1="160" x2="172" y2="136" stroke="#1a202c" stroke-width="2" marker-end="url(#hund-up)" />
      <line x1="192" y1="136" x2="192" y2="160" stroke="#1a202c" stroke-width="2" marker-end="url(#hund-down)" />
    <rect x="236" y="130" width="48" height="36" rx="6" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.8" />
    <text x="260" y="188" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">2pₓ</text>
      <line x1="260" y1="160" x2="260" y2="136" stroke="#15803d" stroke-width="2.5" marker-end="url(#hund-up)" />
    <rect x="296" y="130" width="48" height="36" rx="6" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.8" />
    <text x="320" y="188" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">2p_y</text>
      <line x1="320" y1="160" x2="320" y2="136" stroke="#15803d" stroke-width="2.5" marker-end="url(#hund-up)" />
    <rect x="356" y="130" width="48" height="36" rx="6" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.8" />
    <text x="380" y="188" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">2p_z</text>
      <line x1="380" y1="160" x2="380" y2="136" stroke="#15803d" stroke-width="2.5" marker-end="url(#hund-up)" />
  <defs>
    <marker id="hund-up" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#1a202c" />
    </marker>
    <marker id="hund-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#1a202c" />
    </marker>
  </defs>

  <!-- Annotation -->
  <line x1="280" y1="116" x2="450" y2="116" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="365" y="108" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Hund: spread before pairing</text>

  <text x="250" y="216" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Pauli: same orbital → opposite spins. Hund: same energy → maximize unpaired with parallel spins.</text>

</svg>
