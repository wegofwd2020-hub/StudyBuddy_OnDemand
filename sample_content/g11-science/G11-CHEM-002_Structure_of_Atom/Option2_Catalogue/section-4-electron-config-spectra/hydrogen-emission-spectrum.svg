<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="Hydrogen Balmer emission spectrum">
  <title>Hydrogen Balmer emission spectrum</title>
  <desc>Visible portion of hydrogen's emission spectrum: a black strip from 380 to 700 nm with four sharp coloured emission lines — Hα (red, 656.3 nm), Hβ (cyan, 486.1 nm), Hγ (violet, 434.0 nm), Hδ (deeper violet, 410.2 nm). Each line is annotated with the n→2 transition that produces it.</desc>
  
  <text x="300" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Hydrogen Emission Spectrum (Balmer Series, Visible)</text>
  <text x="300" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Discrete emission lines — each is a photon released as an electron drops to n = 2.</text>

  <!-- Black background strip for the spectrum -->
  <rect x="60" y="130" width="480" height="50" fill="#0f172a" stroke="#1a202c" stroke-width="1.5" />

  <!-- Wavelength axis tick marks below -->
  <line x1="60" y1="180" x2="540" y2="180" stroke="#1a202c" stroke-width="1" />

    <line x1="90" y1="180" x2="90" y2="186" stroke="#1a202c" stroke-width="1" />
    <text x="90" y="202" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">400</text>
    <line x1="165" y1="180" x2="165" y2="186" stroke="#1a202c" stroke-width="1" />
    <text x="165" y="202" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">450</text>
    <line x1="240" y1="180" x2="240" y2="186" stroke="#1a202c" stroke-width="1" />
    <text x="240" y="202" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">500</text>
    <line x1="315" y1="180" x2="315" y2="186" stroke="#1a202c" stroke-width="1" />
    <text x="315" y="202" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">550</text>
    <line x1="390" y1="180" x2="390" y2="186" stroke="#1a202c" stroke-width="1" />
    <text x="390" y="202" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">600</text>
    <line x1="465" y1="180" x2="465" y2="186" stroke="#1a202c" stroke-width="1" />
    <text x="465" y="202" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">650</text>
    <line x1="540" y1="180" x2="540" y2="186" stroke="#1a202c" stroke-width="1" />
    <text x="540" y="202" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">700</text><text x="300" y="224" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">wavelength λ (nm)</text>
    <line x1="474.44999999999993" y1="130" x2="474.44999999999993" y2="180" stroke="#ef4444" stroke-width="3.5" />
    <text x="474.44999999999993" y="122" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle">Hα</text>
    <text x="474.44999999999993" y="108" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">n=3 → 2</text>
    <text x="474.44999999999993" y="240" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">656.3 nm</text>
    <line x1="219.15000000000003" y1="130" x2="219.15000000000003" y2="180" stroke="#06b6d4" stroke-width="3.5" />
    <text x="219.15000000000003" y="122" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#06b6d4" text-anchor="middle">Hβ</text>
    <text x="219.15000000000003" y="108" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">n=4 → 2</text>
    <text x="219.15000000000003" y="240" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">486.1 nm</text>
    <line x1="141" y1="130" x2="141" y2="180" stroke="#7c3aed" stroke-width="3.5" />
    <text x="141" y="122" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">Hγ</text>
    <text x="141" y="108" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">n=5 → 2</text>
    <text x="141" y="240" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">434 nm</text>
    <line x1="105.29999999999998" y1="130" x2="105.29999999999998" y2="180" stroke="#5b21b6" stroke-width="3.5" />
    <text x="105.29999999999998" y="122" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">Hδ</text>
    <text x="105.29999999999998" y="108" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">n=6 → 2</text>
    <text x="105.29999999999998" y="240" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">410.2 nm</text>
  <text x="300" y="268" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Each line corresponds to a fixed energy gap E_n − E_2 = h ν. The pattern is a fingerprint of hydrogen.</text>

</svg>
