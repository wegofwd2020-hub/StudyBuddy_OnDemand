<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Aufbau diagonal filling order">
  <title>Aufbau diagonal filling order</title>
  <desc>A grid of orbital labels arranged by row (n = 1..7) and column (s, p, d, f). Diagonal red arrows sweep through the cells from top-left toward bottom-right indicating the Aufbau filling order: 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, ...</desc>
  
  <text x="240" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Aufbau — Diagonal Filling Order</text>
  <text x="240" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Fill orbitals in diagonal sweeps: 1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s ...</text>

  <text x="70" y="58" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">s</text>
  <text x="150" y="58" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">p</text>
  <text x="230" y="58" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">d</text>
  <text x="310" y="58" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">f</text>

