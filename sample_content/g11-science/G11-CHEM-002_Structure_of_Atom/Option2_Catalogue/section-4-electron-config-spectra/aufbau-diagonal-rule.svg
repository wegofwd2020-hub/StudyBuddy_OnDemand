    <text x="170" y="303" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">7p</text><defs><marker id="aufbau-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" /></marker></defs><line x1="170" y1="104" x2="90" y2="150" stroke="#dc2626" stroke-width="1.5" marker-end="url(#aufbau-arr)" opacity="0.75" /><line x1="170" y1="142" x2="90" y2="188" stroke="#dc2626" stroke-width="1.5" marker-end="url(#aufbau-arr)" opacity="0.75" /><line x1="250" y1="142" x2="90" y2="226" stroke="#dc2626" stroke-width="1.5" marker-end="url(#aufbau-arr)" opacity="0.75" /><line x1="250" y1="180" x2="90" y2="264" stroke="#dc2626" stroke-width="1.5" marker-end="url(#aufbau-arr)" opacity="0.75" /><line x1="330" y1="180" x2="90" y2="302" stroke="#dc2626" stroke-width="1.5" marker-end="url(#aufbau-arr)" opacity="0.75" /><line x1="330" y1="218" x2="170" y2="302" stroke="#dc2626" stroke-width="1.5" marker-end="url(#aufbau-arr)" opacity="0.75" />
  <text x="240" y="340" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Diagonal arrows indicate the order; each arrow's start is the next orbital to fill after the previous one ended.</text>

</svg>
