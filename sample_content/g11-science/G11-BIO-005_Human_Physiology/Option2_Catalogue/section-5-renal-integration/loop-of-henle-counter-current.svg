<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-label="Loop of Henle counter-current multiplier with medullary osmotic gradient">
  <title>Loop of Henle — counter-current multiplier and medullary gradient</title>
  <desc>A schematic of the loop of Henle showing how the medullary interstitial gradient is established and used. The loop has two limbs running side by side in opposite directions: the descending limb on the left carries filtrate from the cortex deep into the medulla and is highly permeable to water but impermeable to Na+ and Cl-; the ascending limb on the right carries filtrate back up to the cortex and is impermeable to water but actively pumps Na+ and Cl- out into the surrounding tissue. The medullary interstitium therefore becomes saltier and saltier with increasing depth, from about 300 mOsm/L at the cortex-medulla boundary to about 1200 mOsm/L at the deepest point. The diagram is shaded as a gradient from pale yellow at the top to deep orange at the bottom, with mOsm/L values marked along the right edge. Water moves out of the descending limb by osmosis at every level, concentrating the filtrate as it descends. Salts move out of the ascending limb by active transport at every level, diluting the filtrate as it ascends. The net effect — called the counter-current multiplier — uses one ATP-driven pump at each level to build a steep osmotic gradient that the collecting duct can later exploit to reabsorb water when ADH is present.</desc>

  <text x="380" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Loop of Henle — Counter-Current Multiplier</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Descending limb: water out · Ascending limb: salt out · Builds 300 → 1200 mOsm gradient</text>

  <!-- Background -->
  <rect x="20" y="56" width="720" height="464" rx="14" fill="#f7fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ── Medullary gradient (background colour band) ─────────── -->
  <defs>
    <linearGradient id="medGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fef3c7" stop-opacity="0.55"/>
      <stop offset="33%" stop-color="#fcd34d" stop-opacity="0.55"/>
      <stop offset="66%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect x="120" y="90" width="440" height="380" fill="url(#medGrad)" stroke="#92400e" stroke-width="1"/>

  <!-- Medulla / cortex divider (top edge of medulla) -->
  <line x1="120" y1="90" x2="560" y2="90" stroke="#92400e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="120" y="80" font-size="10" font-weight="700" fill="#92400e">cortex-medulla boundary</text>

  <!-- ── Osmotic gradient labels (right edge) ────────────────── -->
  <g font-size="11" font-weight="700">
    <text x="568" y="100" fill="#92400e">300 mOsm/L</text>
    <text x="568" y="195" fill="#92400e">600 mOsm/L</text>
    <text x="568" y="295" fill="#7c2d12">900 mOsm/L</text>
    <text x="568" y="465" fill="#7c2d12">1200 mOsm/L</text>
  </g>
  <text x="568" y="80" font-size="10" font-style="italic" fill="#4a5568">Interstitial osmolarity</text>

  <!-- Gradient tick marks -->
  <g stroke="#92400e" stroke-width="1">
    <line x1="562" y1="96" x2="566" y2="96"/>
    <line x1="562" y1="191" x2="566" y2="191"/>
    <line x1="562" y1="291" x2="566" y2="291"/>
    <line x1="562" y1="461" x2="566" y2="461"/>
  </g>

  <!-- ── Filtrate entry (top-left) ───────────────────────────── -->
  <path d="M 220 70 L 220 90" stroke="#1e3a8a" stroke-width="8"/>
  <polygon points="220,90 213,82 227,82" fill="#1e3a8a"/>
  <text x="220" y="65" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">filtrate from PCT</text>
  <text x="220" y="79" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">300 mOsm — isotonic</text>

  <!-- ── Descending limb (left) ──────────────────────────────── -->
  <path d="M 220 90 L 220 410 Q 230 440 260 440" fill="none" stroke="#1e3a8a" stroke-width="14"/>
  <path d="M 220 90 L 220 410 Q 230 440 260 440" fill="none" stroke="#dbeafe" stroke-width="9"/>

  <!-- Descending limb label -->
  <text x="170" y="160" font-size="11" font-weight="700" fill="#1e3a8a" transform="rotate(-90 170 160)" text-anchor="middle">DESCENDING LIMB</text>
  <text x="187" y="180" font-size="9" font-style="italic" fill="#475569" transform="rotate(-90 187 180)" text-anchor="middle">water-permeable, salt-impermeable</text>

  <!-- ── Ascending limb (right) ──────────────────────────────── -->
  <path d="M 260 440 Q 290 440 300 410 L 300 90" fill="none" stroke="#1e3a8a" stroke-width="14"/>
  <path d="M 260 440 Q 290 440 300 410 L 300 90" fill="none" stroke="#dbeafe" stroke-width="9"/>

  <!-- Ascending limb label -->
  <text x="350" y="160" font-size="11" font-weight="700" fill="#1e3a8a" transform="rotate(90 350 160)" text-anchor="middle">ASCENDING LIMB</text>
  <text x="333" y="180" font-size="9" font-style="italic" fill="#475569" transform="rotate(90 333 180)" text-anchor="middle">salt-permeable, water-impermeable</text>

  <!-- ── Flow direction arrows inside limbs ─────────────────── -->
  <g fill="#1e3a8a">
    <polygon points="220,150 215,142 225,142"/>
    <polygon points="220,250 215,242 225,242"/>
    <polygon points="220,350 215,342 225,342"/>
  </g>
  <g fill="#1e3a8a">
    <polygon points="300,400 295,408 305,408"/>
    <polygon points="300,300 295,308 305,308"/>
    <polygon points="300,180 295,188 305,188"/>
  </g>

  <!-- ── WATER OUT arrows (from descending limb to interstitium) ─ -->
  <g>
    <!-- Arrow 1 -->
    <path d="M 213 130 L 175 130" stroke="#15803d" stroke-width="2.5" fill="none"/>
    <polygon points="175,130 181,126 181,134" fill="#15803d"/>
    <text x="173" y="124" font-size="9" font-weight="700" fill="#15803d" text-anchor="end">H₂O</text>

    <!-- Arrow 2 -->
    <path d="M 213 200 L 165 200" stroke="#15803d" stroke-width="2.5" fill="none"/>
    <polygon points="165,200 171,196 171,204" fill="#15803d"/>
    <text x="163" y="194" font-size="9" font-weight="700" fill="#15803d" text-anchor="end">H₂O</text>

    <!-- Arrow 3 -->
    <path d="M 213 280 L 155 280" stroke="#15803d" stroke-width="2.5" fill="none"/>
    <polygon points="155,280 161,276 161,284" fill="#15803d"/>
    <text x="153" y="274" font-size="9" font-weight="700" fill="#15803d" text-anchor="end">H₂O</text>

    <!-- Arrow 4 (deep) -->
    <path d="M 213 370 L 150 370" stroke="#15803d" stroke-width="2.5" fill="none"/>
    <polygon points="150,370 156,366 156,374" fill="#15803d"/>
    <text x="148" y="364" font-size="9" font-weight="700" fill="#15803d" text-anchor="end">H₂O</text>
  </g>
  <text x="100" y="240" font-size="10" font-weight="700" fill="#15803d" transform="rotate(-90 100 240)" text-anchor="middle">water out (passive · osmosis)</text>

  <!-- ── SALT OUT arrows (from ascending limb to interstitium) ── -->
  <g>
    <!-- Arrow 1 -->
    <path d="M 307 130 L 400 130" stroke="#dc2626" stroke-width="2.5" fill="none"/>
    <polygon points="400,130 394,126 394,134" fill="#dc2626"/>
    <text x="404" y="124" font-size="9" font-weight="700" fill="#dc2626">Na⁺  Cl⁻</text>

    <!-- Arrow 2 -->
    <path d="M 307 200 L 410 200" stroke="#dc2626" stroke-width="2.5" fill="none"/>
    <polygon points="410,200 404,196 404,204" fill="#dc2626"/>
    <text x="414" y="194" font-size="9" font-weight="700" fill="#dc2626">Na⁺  Cl⁻</text>

    <!-- Arrow 3 -->
    <path d="M 307 280 L 420 280" stroke="#dc2626" stroke-width="2.5" fill="none"/>
    <polygon points="420,280 414,276 414,284" fill="#dc2626"/>
    <text x="424" y="274" font-size="9" font-weight="700" fill="#dc2626">Na⁺  Cl⁻</text>

    <!-- Arrow 4 (deep) -->
    <path d="M 307 370 L 430 370" stroke="#dc2626" stroke-width="2.5" fill="none"/>
    <polygon points="430,370 424,366 424,374" fill="#dc2626"/>
    <text x="434" y="364" font-size="9" font-weight="700" fill="#dc2626">Na⁺  Cl⁻</text>

    <!-- ATP markers (active transport) -->
    <g font-size="8" font-weight="700" fill="#7c3aed">
      <text x="316" y="142">ATP</text>
      <text x="316" y="212">ATP</text>
      <text x="316" y="292">ATP</text>
      <text x="316" y="382">ATP</text>
    </g>
  </g>
  <text x="460" y="240" font-size="10" font-weight="700" fill="#dc2626" transform="rotate(90 460 240)" text-anchor="middle">salt out (active · ATP)</text>

  <!-- ── Osmolarity tags along filtrate ─────────────────────── -->
  <!-- Descending limb inside -->
  <g font-size="9" font-weight="700">
    <rect x="206" y="100" width="30" height="14" rx="2" fill="#ffffff" stroke="#1e3a8a"/>
    <text x="221" y="111" fill="#1e3a8a" text-anchor="middle">300</text>

    <rect x="206" y="220" width="34" height="14" rx="2" fill="#ffffff" stroke="#1e3a8a"/>
    <text x="223" y="231" fill="#1e3a8a" text-anchor="middle">600</text>

    <rect x="206" y="340" width="34" height="14" rx="2" fill="#ffffff" stroke="#1e3a8a"/>
    <text x="223" y="351" fill="#1e3a8a" text-anchor="middle">900</text>

    <!-- Loop bottom -->
    <rect x="237" y="430" width="46" height="14" rx="2" fill="#ffffff" stroke="#7c2d12"/>
    <text x="260" y="441" fill="#7c2d12" text-anchor="middle">1200</text>

    <!-- Ascending limb inside (decreasing on way up) -->
    <rect x="287" y="340" width="34" height="14" rx="2" fill="#ffffff" stroke="#1e3a8a"/>
    <text x="304" y="351" fill="#1e3a8a" text-anchor="middle">800</text>

    <rect x="287" y="220" width="34" height="14" rx="2" fill="#ffffff" stroke="#1e3a8a"/>
    <text x="304" y="231" fill="#1e3a8a" text-anchor="middle">400</text>

    <rect x="287" y="100" width="34" height="14" rx="2" fill="#ffffff" stroke="#1e3a8a"/>
    <text x="304" y="111" fill="#1e3a8a" text-anchor="middle">100</text>
  </g>

  <!-- Exit to DCT -->
  <path d="M 300 90 L 300 70" stroke="#1e3a8a" stroke-width="8"/>
  <polygon points="300,70 293,82 307,82" fill="#1e3a8a"/>
  <text x="300" y="65" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">to DCT</text>
  <text x="300" y="79" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">100 mOsm — hypotonic</text>

  <!-- ══════════════════════════════════════════════════════════
       Side panel — counter-current explanation
       ═════════════════════════════════════════════════════════ -->
  <rect x="595" y="100" width="148" height="396" rx="8" fill="#ffffff" stroke="#1a202c" stroke-width="1.4"/>
  <text x="669" y="120" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Counter-current</text>
  <text x="669" y="134" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">multiplier</text>

  <g transform="translate(605, 154)">
    <!-- Step block -->
    <rect x="0" y="0" width="128" height="56" rx="4" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.4"/>
    <text x="64" y="14" font-size="9.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Descending</text>
    <text x="64" y="28" font-size="9" fill="#1a202c" text-anchor="middle">Water leaves</text>
    <text x="64" y="40" font-size="9" fill="#1a202c" text-anchor="middle">(osmosis,</text>
    <text x="64" y="52" font-size="9" fill="#1a202c" text-anchor="middle">passive)</text>
  </g>

  <g transform="translate(605, 220)">
    <rect x="0" y="0" width="128" height="56" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="64" y="14" font-size="9.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Ascending</text>
    <text x="64" y="28" font-size="9" fill="#1a202c" text-anchor="middle">Na⁺/Cl⁻ pumped</text>
    <text x="64" y="40" font-size="9" fill="#1a202c" text-anchor="middle">out (active,</text>
    <text x="64" y="52" font-size="9" fill="#1a202c" text-anchor="middle">needs ATP)</text>
  </g>

  <g transform="translate(605, 286)">
    <rect x="0" y="0" width="128" height="68" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
    <text x="64" y="14" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">Net result</text>
    <text x="64" y="28" font-size="9" fill="#1a202c" text-anchor="middle">Steep medullary</text>
    <text x="64" y="40" font-size="9" fill="#1a202c" text-anchor="middle">gradient</text>
    <text x="64" y="56" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">300 → 1200 mOsm</text>
  </g>

  <g transform="translate(605, 364)">
    <rect x="0" y="0" width="128" height="124" rx="4" fill="#dcfce7" stroke="#14532d" stroke-width="1.4"/>
    <text x="64" y="14" font-size="9.5" font-weight="700" fill="#14532d" text-anchor="middle">Why it matters</text>
    <text x="64" y="30" font-size="9" fill="#1a202c" text-anchor="middle">Collecting duct</text>
    <text x="64" y="42" font-size="9" fill="#1a202c" text-anchor="middle">runs through this</text>
    <text x="64" y="54" font-size="9" fill="#1a202c" text-anchor="middle">gradient.</text>
    <text x="64" y="74" font-size="9" fill="#1a202c" text-anchor="middle">When ADH opens</text>
    <text x="64" y="86" font-size="9" fill="#1a202c" text-anchor="middle">its water pores,</text>
    <text x="64" y="98" font-size="9" fill="#1a202c" text-anchor="middle">water flows OUT</text>
    <text x="64" y="112" font-size="9" font-weight="700" fill="#14532d" text-anchor="middle">→ concentrated urine</text>
  </g>

  <!-- ── Footer ──────────────────────────────────────────────── -->
  <text x="280" y="510" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">Only one ATP pump at each level is needed —</text>
  <text x="280" y="522" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">but its effect is multiplied across the whole loop length.</text>
</svg>
