<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-label="Chemical synapse — five-step neurotransmitter release sequence">
  <title>Chemical synapse — five-step transmission sequence</title>
  <desc>A cross-section of a chemical synapse showing how an electrical signal in the pre-synaptic neuron is converted to a chemical signal across the cleft and back to an electrical signal in the post-synaptic neuron. From left to right and labelled with five circled step numbers: (1) the action potential travels down the axon and arrives at the pre-synaptic terminal; (2) voltage-gated calcium channels open and Ca2+ ions flow into the terminal from the synaptic cleft; (3) Ca2+ triggers neurotransmitter-filled vesicles to dock with and fuse to the pre-synaptic membrane via SNARE proteins, emptying their contents into the cleft (exocytosis); (4) neurotransmitter molecules diffuse across the ~20 nanometre synaptic cleft; (5) neurotransmitter binds to ligand-gated ion channel receptors on the post-synaptic membrane, opening them and allowing Na+ to enter the post-synaptic cell, producing an excitatory post-synaptic potential. Excess neurotransmitter in the cleft is removed either by reuptake transporters or by enzymatic breakdown, terminating the signal.</desc>

  <text x="380" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Chemical Synapse — Five Steps from Electrical to Chemical to Electrical</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Action potential → Ca²⁺ influx → vesicle fusion → diffusion → receptor binding</text>

  <!-- Background -->
  <rect x="20" y="56" width="720" height="464" rx="14" fill="#f7fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ── Pre-synaptic axon terminal (upper structure) ─────────── -->
  <!-- Axon coming in from upper-left -->
  <rect x="40" y="100" width="200" height="36" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="140" y="124" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">myelinated axon</text>

  <!-- Action potential bolt -->
  <g>
    <polyline points="60,118 75,108 78,128 95,118" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <text x="75" y="92" font-size="10" font-weight="700" fill="#7f1d1d" text-anchor="middle">action potential</text>
  </g>

  <!-- Pre-synaptic bouton (large bulb) -->
  <path d="M 230 80 Q 130 100 130 250 Q 200 320 380 320 Q 460 320 460 250 Q 460 100 360 80 Z"
        fill="#dbeafe" stroke="#1e3a8a" stroke-width="2.5" transform="translate(20, 0)"/>

  <text x="315" y="115" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">PRE-SYNAPTIC TERMINAL</text>
  <text x="315" y="130" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">end of upstream neuron</text>

  <!-- Synaptic vesicles (round) -->
  <g fill="#86efac" stroke="#14532d" stroke-width="1.4">
    <circle cx="230" cy="170" r="12"/>
    <circle cx="265" cy="195" r="12"/>
    <circle cx="195" cy="215" r="12"/>
    <circle cx="240" cy="245" r="12"/>
    <circle cx="290" cy="240" r="12"/>
    <circle cx="200" cy="170" r="12"/>
    <circle cx="335" cy="200" r="12"/>
    <circle cx="365" cy="240" r="12"/>
    <circle cx="395" cy="195" r="12"/>
  </g>
  <!-- Neurotransmitter dots inside vesicles -->
  <g fill="#14532d">
    <circle cx="230" cy="170" r="2"/>
    <circle cx="232" cy="172" r="2"/>
    <circle cx="265" cy="195" r="2"/>
    <circle cx="267" cy="197" r="2"/>
    <circle cx="195" cy="215" r="2"/>
    <circle cx="240" cy="245" r="2"/>
    <circle cx="290" cy="240" r="2"/>
    <circle cx="200" cy="170" r="2"/>
    <circle cx="335" cy="200" r="2"/>
    <circle cx="365" cy="240" r="2"/>
    <circle cx="395" cy="195" r="2"/>
  </g>
  <text x="190" y="275" font-size="9" font-weight="700" fill="#14532d">synaptic vesicles</text>
  <text x="195" y="288" font-size="8" font-style="italic" fill="#4a5568">filled with neurotransmitter</text>

  <!-- Docked / fusing vesicle at membrane -->
  <ellipse cx="320" cy="312" rx="14" ry="8" fill="#dcfce7" stroke="#14532d" stroke-width="1.4"/>
  <g fill="#14532d">
    <circle cx="316" cy="316" r="1.5"/>
    <circle cx="320" cy="316" r="1.5"/>
    <circle cx="324" cy="316" r="1.5"/>
    <!-- Released NT spilling out -->
    <circle cx="320" cy="332" r="2"/>
    <circle cx="312" cy="338" r="2"/>
    <circle cx="328" cy="336" r="2"/>
  </g>

  <!-- Voltage-gated Ca²⁺ channels on pre-synaptic membrane -->
  <g>
    <rect x="180" y="316" width="16" height="14" rx="2" fill="#fbbf24" stroke="#92400e" stroke-width="1.4"/>
    <rect x="240" y="318" width="16" height="14" rx="2" fill="#fbbf24" stroke="#92400e" stroke-width="1.4"/>
    <rect x="370" y="316" width="16" height="14" rx="2" fill="#fbbf24" stroke="#92400e" stroke-width="1.4"/>
    <rect x="425" y="316" width="16" height="14" rx="2" fill="#fbbf24" stroke="#92400e" stroke-width="1.4"/>
  </g>
  <text x="142" y="328" font-size="9" font-weight="700" fill="#92400e" text-anchor="end">Ca²⁺ channels</text>

  <!-- Ca²⁺ ions flowing in (from below) -->
  <g fill="#dc2626" font-size="11" font-weight="700">
    <text x="186" y="350">Ca²⁺</text>
    <text x="248" y="350">Ca²⁺</text>
    <text x="376" y="350">Ca²⁺</text>
    <text x="431" y="354">Ca²⁺</text>
  </g>
  <g stroke="#dc2626" stroke-width="1.8" fill="none">
    <path d="M 188 348 L 188 332"/>
    <polygon points="188,332 184,338 192,338" fill="#dc2626"/>
    <path d="M 248 348 L 248 332"/>
    <polygon points="248,332 244,338 252,338" fill="#dc2626"/>
    <path d="M 378 348 L 378 332"/>
    <polygon points="378,332 374,338 382,338" fill="#dc2626"/>
  </g>

  <!-- ── Synaptic cleft ───────────────────────────────────────── -->
  <rect x="120" y="332" width="380" height="48" fill="#fef3c7" opacity="0.5"/>
  <text x="510" y="358" font-size="10" font-weight="700" fill="#92400e">SYNAPTIC CLEFT</text>
  <text x="510" y="372" font-size="9" font-style="italic" fill="#4a5568">~20 nm wide</text>

  <!-- Diffusing neurotransmitter molecules -->
  <g fill="#14532d">
    <circle cx="260" cy="346" r="2.5"/>
    <circle cx="275" cy="354" r="2.5"/>
    <circle cx="290" cy="348" r="2.5"/>
    <circle cx="305" cy="358" r="2.5"/>
    <circle cx="320" cy="350" r="2.5"/>
    <circle cx="335" cy="362" r="2.5"/>
    <circle cx="350" cy="354" r="2.5"/>
    <circle cx="365" cy="362" r="2.5"/>
    <circle cx="225" cy="356" r="2.5"/>
    <circle cx="245" cy="364" r="2.5"/>
  </g>
  <!-- Diffusion arrows -->
  <g stroke="#15803d" stroke-width="1.4" fill="none">
    <path d="M 290 348 L 290 376"/>
    <polygon points="290,376 286,370 294,370" fill="#15803d"/>
    <path d="M 340 350 L 340 376"/>
    <polygon points="340,376 336,370 344,370" fill="#15803d"/>
  </g>

  <!-- ── Post-synaptic membrane and cell ──────────────────────── -->
  <rect x="120" y="380" width="380" height="14" fill="#fecaca" stroke="#7f1d1d" stroke-width="2"/>

  <!-- Receptors (ligand-gated channels) -->
  <g>
    <rect x="200" y="376" width="22" height="22" rx="3" fill="#fbcfe8" stroke="#9f1239" stroke-width="1.6"/>
    <rect x="275" y="376" width="22" height="22" rx="3" fill="#fbcfe8" stroke="#9f1239" stroke-width="1.6"/>
    <rect x="345" y="376" width="22" height="22" rx="3" fill="#fbcfe8" stroke="#9f1239" stroke-width="1.6"/>
    <rect x="420" y="376" width="22" height="22" rx="3" fill="#fbcfe8" stroke="#9f1239" stroke-width="1.6"/>
  </g>
  <!-- NT docked in receptor -->
  <g fill="#14532d">
    <circle cx="211" cy="378" r="2.5"/>
    <circle cx="286" cy="378" r="2.5"/>
  </g>
  <text x="510" y="394" font-size="9" font-weight="700" fill="#9f1239">receptors</text>
  <text x="510" y="406" font-size="8" font-style="italic" fill="#4a5568">ligand-gated channels</text>

  <!-- Post-synaptic cell body -->
  <rect x="120" y="394" width="380" height="100" fill="#fee2e2" stroke="#7f1d1d" stroke-width="2"/>
  <text x="310" y="426" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">POST-SYNAPTIC NEURON</text>
  <text x="310" y="441" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">downstream cell</text>

  <!-- Na+ flowing into post-synaptic cell -->
  <g fill="#7c3aed" font-size="11" font-weight="700">
    <text x="207" y="454">Na⁺</text>
    <text x="282" y="466">Na⁺</text>
    <text x="350" y="454">Na⁺</text>
  </g>
  <g stroke="#7c3aed" stroke-width="1.6" fill="none">
    <path d="M 211 410 L 211 444"/>
    <polygon points="211,444 207,438 215,438" fill="#7c3aed"/>
    <path d="M 286 410 L 286 458"/>
    <polygon points="286,458 282,452 290,452" fill="#7c3aed"/>
    <path d="M 356 410 L 356 444"/>
    <polygon points="356,444 352,438 360,438" fill="#7c3aed"/>
  </g>

  <!-- Resulting EPSP (excitatory post-synaptic potential) -->
  <text x="310" y="475" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">→ depolarisation → EPSP</text>
  <text x="310" y="488" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">may trigger an action potential here</text>

  <!-- ── Step numbers (circled, large) ────────────────────────── -->
  <g>
    <!-- Step 1: AP arrives -->
    <circle cx="105" cy="118" r="14" fill="#dc2626" stroke="#1a202c" stroke-width="2"/>
    <text x="105" y="123" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

    <!-- Step 2: Ca2+ in -->
    <circle cx="148" cy="348" r="14" fill="#dc2626" stroke="#1a202c" stroke-width="2"/>
    <text x="148" y="353" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

    <!-- Step 3: vesicle fusion -->
    <circle cx="320" cy="282" r="14" fill="#dc2626" stroke="#1a202c" stroke-width="2"/>
    <text x="320" y="287" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

    <!-- Step 4: diffusion -->
    <circle cx="408" cy="356" r="14" fill="#dc2626" stroke="#1a202c" stroke-width="2"/>
    <text x="408" y="361" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

    <!-- Step 5: receptor binding -->
    <circle cx="458" cy="386" r="14" fill="#dc2626" stroke="#1a202c" stroke-width="2"/>
    <text x="458" y="391" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  </g>

  <!-- ── Legend / step list (right side) ──────────────────────── -->
  <rect x="560" y="100" width="180" height="290" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="650" y="120" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Five-step sequence</text>

  <g font-size="9.5" fill="#1a202c">
    <circle cx="572" cy="142" r="8" fill="#dc2626"/>
    <text x="572" y="146" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="586" y="140" font-weight="700">AP arrives</text>
    <text x="586" y="153" font-style="italic" fill="#4a5568">depolarises terminal</text>

    <circle cx="572" cy="182" r="8" fill="#dc2626"/>
    <text x="572" y="186" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="586" y="180" font-weight="700">Ca²⁺ enters</text>
    <text x="586" y="193" font-style="italic" fill="#4a5568">voltage-gated channels open</text>

    <circle cx="572" cy="222" r="8" fill="#dc2626"/>
    <text x="572" y="226" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="586" y="220" font-weight="700">Vesicles fuse</text>
    <text x="586" y="233" font-style="italic" fill="#4a5568">SNARE-mediated · exocytosis</text>

    <circle cx="572" cy="262" r="8" fill="#dc2626"/>
    <text x="572" y="266" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="586" y="260" font-weight="700">NT diffuses</text>
    <text x="586" y="273" font-style="italic" fill="#4a5568">across the 20 nm cleft</text>

    <circle cx="572" cy="302" r="8" fill="#dc2626"/>
    <text x="572" y="306" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="586" y="300" font-weight="700">NT binds receptor</text>
    <text x="586" y="313" font-style="italic" fill="#4a5568">opens ion channels · EPSP</text>
  </g>

  <!-- Termination note -->
  <rect x="568" y="328" width="166" height="56" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="651" y="344" font-size="9" font-weight="700" fill="#1a202c" text-anchor="middle">Signal termination</text>
  <text x="651" y="358" font-size="8" font-style="italic" fill="#4a5568" text-anchor="middle">reuptake transporters or</text>
  <text x="651" y="370" font-size="8" font-style="italic" fill="#4a5568" text-anchor="middle">enzymatic breakdown</text>
  <text x="651" y="382" font-size="8" font-style="italic" fill="#4a5568" text-anchor="middle">clear the cleft</text>

  <!-- Total event time -->
  <text x="380" y="510" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">Total synaptic delay: ~0.5-1 ms</text>
</svg>
