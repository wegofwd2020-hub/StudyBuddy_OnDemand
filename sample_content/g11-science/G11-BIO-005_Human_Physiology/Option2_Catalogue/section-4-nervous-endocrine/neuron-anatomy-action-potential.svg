<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="Neuron anatomy with action potential waveform">
  <title>Neuron anatomy and action potential — structure plus voltage trace</title>
  <desc>A two-panel teaching diagram. The upper panel shows a myelinated motor neuron drawn left-to-right: branching dendrites collect input on the left, the cell body (soma) contains the nucleus, the axon hillock is the trigger zone where the membrane potential is summed, the long axon is wrapped in segments of myelin sheath separated by gaps called nodes of Ranvier, and the axon terminals at the far right release neurotransmitter onto a target muscle fibre or other neuron. The lower panel plots membrane potential (Vm, millivolts) against time (milliseconds) for one action potential. The trace begins at the resting potential of -70 mV. A stimulus depolarises the membrane to the threshold near -55 mV; voltage-gated sodium channels open and the membrane rapidly depolarises to a peak of about +30 mV. Sodium channels then inactivate and voltage-gated potassium channels open, repolarising the membrane. Potassium channels close slowly, producing a brief hyperpolarisation undershoot to about -80 mV before the membrane returns to -70 mV. The whole event lasts about 2-3 milliseconds.</desc>

  <text x="380" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Neuron Anatomy and the Action Potential</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Structure (top) and one all-or-nothing electrical event (bottom) — total ~2-3 ms</text>

  <!-- Background -->
  <rect x="20" y="56" width="720" height="524" rx="14" fill="#f7fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ════════════════════════════════════════════════════════════
       UPPER PANEL — neuron anatomy
       ═══════════════════════════════════════════════════════════ -->
  <rect x="40" y="70" width="680" height="232" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="380" y="88" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">A · Motor neuron — input flows left to right</text>

  <!-- Dendrites (multiple branches on the left) -->
  <g stroke="#2b6cb0" stroke-width="3" fill="none">
    <path d="M 70 130 Q 95 140 130 160"/>
    <path d="M 60 160 Q 90 170 130 175"/>
    <path d="M 70 200 Q 95 195 130 188"/>
    <path d="M 80 230 Q 105 210 130 200"/>
    <path d="M 90 100 Q 110 130 130 155"/>
    <!-- Sub-branches -->
    <path d="M 70 130 L 50 120"/>
    <path d="M 70 130 L 50 145"/>
    <path d="M 60 160 L 40 155"/>
    <path d="M 60 160 L 42 168"/>
    <path d="M 70 200 L 48 198"/>
    <path d="M 80 230 L 55 232"/>
    <path d="M 80 230 L 60 245"/>
    <path d="M 90 100 L 70 88"/>
  </g>
  <text x="65" y="265" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Dendrites</text>
  <text x="65" y="278" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">receive inputs</text>

  <!-- Soma (cell body) -->
  <ellipse cx="170" cy="180" rx="42" ry="38" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2.5"/>
  <!-- Nucleus -->
  <circle cx="170" cy="180" r="16" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="170" y="184" font-size="9" font-weight="700" fill="#1e3a8a" text-anchor="middle">nucleus</text>
  <text x="170" y="240" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Soma</text>
  <text x="170" y="253" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">(cell body)</text>

  <!-- Axon hillock -->
  <path d="M 210 175 L 240 168 L 240 192 L 210 185 Z" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
  <text x="225" y="148" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Axon hillock</text>
  <line x1="225" y1="152" x2="225" y2="165" stroke="#92400e" stroke-width="1"/>
  <text x="225" y="160" font-size="8" font-style="italic" fill="#4a5568" text-anchor="middle">trigger zone</text>

  <!-- Axon (long horizontal line with myelin segments) -->
  <line x1="240" y1="180" x2="640" y2="180" stroke="#1e3a8a" stroke-width="3"/>

  <!-- Myelin sheath segments -->
  <g fill="#fef3c7" stroke="#b45309" stroke-width="1.6">
    <rect x="260" y="166" width="60" height="28" rx="10"/>
    <rect x="340" y="166" width="60" height="28" rx="10"/>
    <rect x="420" y="166" width="60" height="28" rx="10"/>
    <rect x="500" y="166" width="60" height="28" rx="10"/>
    <rect x="580" y="166" width="50" height="28" rx="10"/>
  </g>
  <!-- Nodes of Ranvier (gaps) -->
  <g fill="#dc2626">
    <circle cx="330" cy="180" r="2.5"/>
    <circle cx="410" cy="180" r="2.5"/>
    <circle cx="490" cy="180" r="2.5"/>
    <circle cx="570" cy="180" r="2.5"/>
  </g>

  <text x="290" y="218" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">myelin sheath</text>
  <line x1="290" y1="208" x2="290" y2="196" stroke="#b45309" stroke-width="1"/>
  <text x="450" y="155" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">node of Ranvier</text>
  <line x1="450" y1="157" x2="450" y2="172" stroke="#dc2626" stroke-width="1"/>
  <text x="380" y="234" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Axon</text>
  <text x="380" y="246" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">conducts action potential away from soma</text>

  <!-- Direction arrow -->
  <g>
    <path d="M 240 110 L 600 110" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="600,110 590,104 590,116" fill="#15803d"/>
    <text x="420" y="102" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">action potential propagates →</text>
  </g>

  <!-- Axon terminals -->
  <g stroke="#1e3a8a" stroke-width="2.5" fill="none">
    <path d="M 640 180 Q 658 168 670 158"/>
    <path d="M 640 180 Q 660 178 680 175"/>
    <path d="M 640 180 Q 660 190 678 200"/>
    <path d="M 640 180 Q 654 192 668 210"/>
  </g>
  <!-- Terminal boutons -->
  <g fill="#1e3a8a">
    <circle cx="670" cy="158" r="6"/>
    <circle cx="680" cy="175" r="6"/>
    <circle cx="678" cy="200" r="6"/>
    <circle cx="668" cy="210" r="6"/>
  </g>
  <text x="690" y="248" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Axon terminals</text>
  <text x="690" y="261" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">release neurotransmitter</text>

  <!-- Target muscle / next neuron strip -->
  <rect x="710" y="160" width="10" height="40" rx="2" fill="#fecaca" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="715" y="288" font-size="8" fill="#7f1d1d" text-anchor="middle">target</text>

  <!-- ════════════════════════════════════════════════════════════
       LOWER PANEL — action potential trace
       ═══════════════════════════════════════════════════════════ -->
  <rect x="40" y="312" width="680" height="262" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="380" y="330" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">B · Action potential — Vm (mV) vs time (ms)</text>

  <!-- Plot area: x = 110..680 (time 0..7 ms → ~81.4 px/ms)
                  y = 540..346 (Vm -90..+40 mV → 1.49 px/mV) -->
  <line x1="110" y1="540" x2="680" y2="540" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="110" y1="540" x2="110" y2="346" stroke="#1a202c" stroke-width="1.5"/>

  <!-- Y-axis labels: -90, -70, -55, 0, +30 -->
  <g font-size="9" fill="#4a5568" text-anchor="end">
    <line x1="106" y1="346" x2="110" y2="346" stroke="#1a202c"/><text x="102" y="350">+30</text>
    <line x1="106" y1="391" x2="110" y2="391" stroke="#1a202c"/><text x="102" y="395">0</text>
    <line x1="106" y1="473" x2="110" y2="473" stroke="#1a202c"/><text x="102" y="477">-55</text>
    <line x1="106" y1="495" x2="110" y2="495" stroke="#1a202c"/><text x="102" y="499">-70</text>
    <line x1="106" y1="525" x2="110" y2="525" stroke="#1a202c"/><text x="102" y="529">-90</text>
  </g>
  <text x="62" y="450" font-size="11" font-weight="700" fill="#1a202c" transform="rotate(-90 62 450)" text-anchor="middle">Membrane potential (mV)</text>

  <!-- X-axis labels: 0, 1, 2, 3, 4, 5, 6 ms -->
  <g font-size="9" fill="#4a5568" text-anchor="middle">
    <line x1="110" y1="540" x2="110" y2="544" stroke="#1a202c"/><text x="110" y="556">0</text>
    <line x1="191" y1="540" x2="191" y2="544" stroke="#1a202c"/><text x="191" y="556">1</text>
    <line x1="273" y1="540" x2="273" y2="544" stroke="#1a202c"/><text x="273" y="556">2</text>
    <line x1="354" y1="540" x2="354" y2="544" stroke="#1a202c"/><text x="354" y="556">3</text>
    <line x1="436" y1="540" x2="436" y2="544" stroke="#1a202c"/><text x="436" y="556">4</text>
    <line x1="517" y1="540" x2="517" y2="544" stroke="#1a202c"/><text x="517" y="556">5</text>
    <line x1="598" y1="540" x2="598" y2="544" stroke="#1a202c"/><text x="598" y="556">6</text>
  </g>
  <text x="395" y="572" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Time (ms)</text>

  <!-- Threshold guide line -->
  <line x1="110" y1="473" x2="680" y2="473" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="675" y="468" font-size="9" font-weight="700" fill="#dc2626" text-anchor="end">threshold ≈ -55 mV</text>

  <!-- Resting line -->
  <line x1="110" y1="495" x2="680" y2="495" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Trace -->
  <!-- Resting (0-1 ms) → small depolarisation → threshold at ~1.2 ms → peak at ~1.5 ms → repolarise → undershoot at ~3.5 ms → recovery -->
  <path d="M 110 495
           L 175 495
           Q 200 490 215 473
           Q 230 458 240 346
           Q 254 360 270 410
           Q 285 460 305 495
           Q 320 515 360 522
           Q 400 520 440 510
           Q 480 502 530 497
           L 680 495"
        fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- Phase shading + labels -->
  <!-- Depolarisation arrow -->
  <g>
    <path d="M 235 430 L 252 365" stroke="#15803d" stroke-width="1.5"/>
    <polygon points="252,365 248,373 257,374" fill="#15803d"/>
    <text x="222" y="408" font-size="9" font-weight="700" fill="#15803d">depolarisation</text>
    <text x="226" y="420" font-size="8" font-style="italic" fill="#4a5568">Na⁺ in</text>
  </g>

  <!-- Peak label -->
  <text x="245" y="338" font-size="10" font-weight="700" fill="#7f1d1d" text-anchor="middle">peak +30 mV</text>

  <!-- Repolarisation arrow -->
  <g>
    <path d="M 290 430 L 280 480" stroke="#b45309" stroke-width="1.5"/>
    <polygon points="280,480 275,471 285,473" fill="#b45309"/>
    <text x="310" y="440" font-size="9" font-weight="700" fill="#b45309">repolarisation</text>
    <text x="310" y="452" font-size="8" font-style="italic" fill="#4a5568">K⁺ out</text>
  </g>

  <!-- Hyperpolarisation -->
  <g>
    <line x1="360" y1="522" x2="360" y2="496" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="380" y="535" font-size="9" font-weight="700" fill="#1e3a8a">hyperpolarisation</text>
    <text x="380" y="546" font-size="8" font-style="italic" fill="#4a5568">undershoot</text>
  </g>

  <!-- Resting label -->
  <text x="140" y="488" font-size="9" font-weight="700" fill="#475569">resting</text>
  <text x="140" y="500" font-size="8" font-style="italic" fill="#4a5568">-70 mV</text>

  <!-- Recovery label -->
  <text x="600" y="488" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">return to rest</text>

  <!-- Stimulus marker -->
  <line x1="175" y1="540" x2="175" y2="495" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="170" y="332" font-size="8" font-weight="700" fill="#7c3aed">stimulus</text>
  <text x="170" y="344" font-size="7" fill="#4a5568">arrives</text>
</svg>
