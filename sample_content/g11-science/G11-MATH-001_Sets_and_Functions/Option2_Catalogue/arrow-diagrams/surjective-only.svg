<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-label="Surjective only">
  <title>Surjective only</title>
  <desc>Every element of B is hit; 1 and 2 collide on p.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e53e3e"/>
    </marker>
  </defs>
  <text x="200" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Surjective only</text>

  <!-- Set boundaries -->
  <ellipse cx="110" cy="120" rx="60" ry="90" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <ellipse cx="290" cy="120" rx="60" ry="90" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="110" y="40" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#2b6cb0" text-anchor="middle">A</text>
  <text x="290" y="40" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#dd6b20" text-anchor="middle">B</text>

  <!-- Elements -->
  <circle cx="110" cy="35" r="5" fill="#1a202c"/><text x="92" y="39" font="14px system-ui" font-size="14" fill="#1a202c" text-anchor="end">1</text>
  <circle cx="110" cy="85" r="5" fill="#1a202c"/><text x="92" y="89" font="14px system-ui" font-size="14" fill="#1a202c" text-anchor="end">2</text>
  <circle cx="110" cy="135" r="5" fill="#1a202c"/><text x="92" y="139" font="14px system-ui" font-size="14" fill="#1a202c" text-anchor="end">3</text>
  <circle cx="110" cy="185" r="5" fill="#1a202c"/><text x="92" y="189" font="14px system-ui" font-size="14" fill="#1a202c" text-anchor="end">4</text>
  <circle cx="290" cy="60" r="5" fill="#1a202c"/><text x="308" y="64" font="14px system-ui" font-size="14" fill="#1a202c">p</text>
  <circle cx="290" cy="110" r="5" fill="#1a202c"/><text x="308" y="114" font="14px system-ui" font-size="14" fill="#1a202c">q</text>
  <circle cx="290" cy="160" r="5" fill="#1a202c"/><text x="308" y="164" font="14px system-ui" font-size="14" fill="#1a202c">r</text>

  <!-- Arrows -->
  <line x1="116.9" y1="36.0" x2="283.1" y2="59.0" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-blue)" />
  <line x1="116.9" y1="84.0" x2="283.1" y2="61.0" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-blue)" />
  <line x1="116.9" y1="134.0" x2="283.1" y2="111.0" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-blue)" />
  <line x1="116.9" y1="184.0" x2="283.1" y2="161.0" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-blue)" />
  

  <!-- Caption -->
  <text x="200" y="228" font="13px system-ui" font-size="13" fill="#4a5568" text-anchor="middle">Every element of B is hit; 1 and 2 collide on p.</text>
</svg>
