<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Intersection of sets A and B shaded">
  <title>A ∩ B</title>
  <desc>Two overlapping circles A and B. Only the overlap region is shaded, indicating the intersection.</desc>
  <defs>
    <style>
      .universe { fill: #f7fafc; stroke: #888; stroke-width: 1; }
      .ringA { fill: none; stroke: #6b46c1; stroke-width: 1.5; }
      .ringB { fill: none; stroke: #6b46c1; stroke-width: 1.5; }
      .label { font: bold 16px system-ui, sans-serif; fill: #1a202c; }
      .universe-label { font: 13px system-ui, sans-serif; fill: #4a5568; }
      .caption { font: 14px system-ui, sans-serif; fill: #2d3748; }
    </style>
    <clipPath id="clipB-inter"><circle cx="195" cy="100" r="60"/></clipPath>
  </defs>
  <rect class="universe" x="10" y="10" width="300" height="170" rx="4"/>
  <text class="universe-label" x="20" y="30">𝕌</text>
  <circle class="ringA" cx="125" cy="100" r="60"/>
  <circle class="ringB" cx="195" cy="100" r="60"/>
  <!-- Shade only the overlap by clipping circle A to circle B -->
  <circle cx="125" cy="100" r="60" fill="#c084fc" fill-opacity="0.7" clip-path="url(#clipB-inter)"/>
  <text class="label" x="78" y="105">A</text>
  <text class="label" x="232" y="105">B</text>
  <text class="caption" x="160" y="205" text-anchor="middle">A ∩ B  =  only what is in both A and B</text>
</svg>
