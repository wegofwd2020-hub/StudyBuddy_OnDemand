<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Difference A minus B shaded">
  <title>A \ B</title>
  <desc>Two overlapping circles A and B. Only the part of A that does not overlap B is shaded.</desc>
  <defs>
    <style>
      .universe { fill: #f7fafc; stroke: #888; stroke-width: 1; }
      .ring { fill: none; stroke: #6b46c1; stroke-width: 1.5; }
      .label { font: bold 16px system-ui, sans-serif; fill: #1a202c; }
      .universe-label { font: 13px system-ui, sans-serif; fill: #4a5568; }
      .caption { font: 14px system-ui, sans-serif; fill: #2d3748; }
    </style>
    <mask id="cutB">
      <rect x="0" y="0" width="320" height="220" fill="white"/>
      <circle cx="195" cy="100" r="60" fill="black"/>
    </mask>
  </defs>
  <rect class="universe" x="10" y="10" width="300" height="170" rx="4"/>
  <text class="universe-label" x="20" y="30">𝕌</text>
  <!-- Shade A, mask out the part covered by B -->
  <circle cx="125" cy="100" r="60" fill="#c084fc" fill-opacity="0.7" mask="url(#cutB)"/>
  <circle class="ring" cx="125" cy="100" r="60"/>
  <circle class="ring" cx="195" cy="100" r="60"/>
  <text class="label" x="78" y="105">A</text>
  <text class="label" x="232" y="105">B</text>
  <text class="caption" x="160" y="205" text-anchor="middle">A \ B  =  in A but not in B</text>
</svg>
