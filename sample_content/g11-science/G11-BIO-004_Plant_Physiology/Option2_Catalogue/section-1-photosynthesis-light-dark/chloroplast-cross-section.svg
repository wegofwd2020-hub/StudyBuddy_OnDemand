<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Chloroplast cross-section with thylakoids and stroma labelled">
  <title>Chloroplast — Cross-Section</title>
  <desc>A labelled cross-section of a single chloroplast. The lens-shaped organelle is enclosed by a double membrane (outer and inner envelopes). Inside the stroma — the fluid-filled matrix — are stacks of disc-shaped thylakoids called grana, connected by tubular stroma lamellae (intergranal thylakoids). The thylakoid lumen is the enclosed space inside each disc. Light reactions happen on the thylakoid membranes; the Calvin cycle (dark reactions) happens in the stroma. Starch grains and ribosomes are also shown.</desc>

  <text x="380" y="24" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Chloroplast — Cross-Section</text>
  <text x="380" y="42" font-size="11" fill="#4a5568" text-anchor="middle">Light reactions on thylakoid membranes · Calvin cycle in stroma</text>

  <!-- Outer envelope -->
  <ellipse cx="380" cy="240" rx="320" ry="140" fill="#dcfce7" stroke="#14532d" stroke-width="3"/>
  <!-- Inner envelope -->
  <ellipse cx="380" cy="240" rx="306" ry="128" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <!-- Intermembrane space (the gap between envelopes) -->
  <text x="80" y="160" font-size="9" font-style="italic" fill="#4a5568">intermembrane space</text>
  <line x1="138" y1="158" x2="120" y2="138" stroke="#4a5568" stroke-width="0.8"/>

  <!-- Stroma label -->
  <text x="380" y="86" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">stroma</text>
  <text x="380" y="100" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">(fluid matrix · enzymes · DNA · ribosomes)</text>

  <!-- Granum 1 (left) — stack of 5 thylakoid discs -->
  <g transform="translate(170, 240)">
    <ellipse cx="0" cy="-40" rx="42" ry="11" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="-22" rx="42" ry="11" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="-4" rx="42" ry="11" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="14" rx="42" ry="11" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="32" rx="42" ry="11" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <!-- thylakoid lumen indicator on top disc -->
    <ellipse cx="0" cy="-40" rx="32" ry="5" fill="#bbf7d0"/>
  </g>

  <!-- Granum 2 (middle) -->
  <g transform="translate(380, 280)">
    <ellipse cx="0" cy="-50" rx="44" ry="11" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="-32" rx="44" ry="11" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="-14" rx="44" ry="11" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="4" rx="44" ry="11" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="22" rx="44" ry="11" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="40" rx="44" ry="11" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="-50" rx="34" ry="5" fill="#bbf7d0"/>
  </g>

  <!-- Granum 3 (right) -->
  <g transform="translate(580, 230)">
    <ellipse cx="0" cy="-30" rx="38" ry="10" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="-12" rx="38" ry="10" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="6" rx="38" ry="10" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="24" rx="38" ry="10" fill="#15803d" stroke="#14532d" stroke-width="1.2"/>
    <ellipse cx="0" cy="-30" rx="28" ry="4.5" fill="#bbf7d0"/>
  </g>

  <!-- Stroma lamellae (intergranal thylakoids — narrow tubes connecting grana) -->
  <path d="M 200 232 Q 280 200 336 230" fill="none" stroke="#15803d" stroke-width="6"/>
  <path d="M 200 252 Q 280 280 336 282" fill="none" stroke="#15803d" stroke-width="6"/>
  <path d="M 422 268 Q 500 240 542 218" fill="none" stroke="#15803d" stroke-width="6"/>
  <path d="M 422 240 Q 500 200 542 200" fill="none" stroke="#15803d" stroke-width="6"/>

  <!-- Starch grain -->
  <ellipse cx="280" cy="340" rx="22" ry="14" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="280" y="345" font-size="9" fill="#78350f" text-anchor="middle">starch</text>

  <!-- Ribosomes -->
  <circle cx="500" cy="320" r="4" fill="#dc2626"/>
  <circle cx="510" cy="328" r="4" fill="#dc2626"/>
  <circle cx="492" cy="332" r="4" fill="#dc2626"/>
  <circle cx="120" cy="280" r="4" fill="#dc2626"/>
  <circle cx="130" cy="290" r="4" fill="#dc2626"/>

  <!-- Plastid DNA loop -->
  <path d="M 460 160 Q 470 150 480 158 Q 490 168 480 178 Q 470 184 460 178 Q 450 168 460 160 Z" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="500" y="170" font-size="9" fill="#7c3aed">plastid DNA</text>

  <!-- Labels with leader lines -->
  <!-- Outer + inner envelope -->
  <line x1="100" y1="140" x2="160" y2="200" stroke="#14532d" stroke-width="1"/>
  <text x="50" y="128" font-size="10" font-weight="700" fill="#14532d">outer envelope</text>
  <text x="50" y="142" font-size="9" fill="#4a5568">freely permeable</text>

  <line x1="200" y1="120" x2="190" y2="180" stroke="#15803d" stroke-width="1"/>
  <text x="180" y="112" font-size="10" font-weight="700" fill="#15803d">inner envelope</text>
  <text x="180" y="126" font-size="9" fill="#4a5568">selective transport</text>

  <!-- Granum -->
  <line x1="170" y1="200" x2="170" y2="160" stroke="#14532d" stroke-width="1"/>
  <text x="170" y="148" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">granum</text>
  <text x="170" y="162" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">stack of thylakoids</text>

  <!-- Thylakoid + lumen -->
  <line x1="426" y1="225" x2="500" y2="120" stroke="#14532d" stroke-width="1"/>
  <text x="510" y="118" font-size="10" font-weight="700" fill="#14532d">thylakoid disc</text>
  <text x="510" y="132" font-size="9" fill="#4a5568">membrane = light reactions</text>
  <text x="510" y="144" font-size="9" fill="#4a5568">lumen (inside) = H⁺ store</text>

  <!-- Stroma lamella -->
  <line x1="490" y1="220" x2="560" y2="120" stroke="#15803d" stroke-width="1"/>
  <text x="660" y="118" font-size="10" font-weight="700" fill="#15803d" text-anchor="end">stroma lamella</text>
  <text x="660" y="132" font-size="9" fill="#4a5568" text-anchor="end">connects grana</text>

  <!-- Bottom legend -->
  <rect x="40" y="392" width="680" height="56" rx="6" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
  <circle cx="62" cy="412" r="7" fill="#15803d" stroke="#14532d" stroke-width="1"/>
  <text x="76" y="416" font-size="10" font-weight="700" fill="#14532d">Thylakoid membranes (green)</text>
  <text x="76" y="430" font-size="9" fill="#4a5568">photosystems · electron transport · ATP synthase · light reactions live here</text>

  <rect x="320" y="406" width="14" height="14" fill="#bbf7d0" stroke="#15803d" stroke-width="1"/>
  <text x="340" y="416" font-size="10" font-weight="700" fill="#14532d">Stroma (pale green)</text>
  <text x="340" y="430" font-size="9" fill="#4a5568">Calvin cycle (dark reactions) · CO₂ fixation · sugar synthesis</text>

  <ellipse cx="600" cy="412" rx="8" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="616" y="416" font-size="10" font-weight="700" fill="#78350f">Starch grain</text>
  <text x="616" y="430" font-size="9" fill="#4a5568">stored sugar</text>
</svg>
