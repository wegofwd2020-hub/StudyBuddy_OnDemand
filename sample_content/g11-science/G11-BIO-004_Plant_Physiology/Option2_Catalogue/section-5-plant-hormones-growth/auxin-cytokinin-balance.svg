<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Auxin to cytokinin ratio determines callus differentiation in tissue culture">
  <title>Auxin / Cytokinin Ratio — Tissue-Culture Decisions</title>
  <desc>The Skoog and Miller (1957) tobacco-callus experiment, summarised as a ratio diagram. A 2D field shows the same callus tissue grown on three different media. Top-left — high auxin, low cytokinin: the callus puts out roots only. Top-right — low auxin, high cytokinin: the callus forms shoots and leaves only. Centre — auxin and cytokinin balanced: the callus stays as undifferentiated callus, the proliferating mass used for cloning and genetic engineering. The diagram drives home the principle that hormone ratio, not absolute amount, decides developmental outcome — and underpins commercial micropropagation of crops like banana and potato.</desc>

  <text x="380" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Auxin / Cytokinin Ratio — Tissue-Culture Outcomes</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">The same cells grow into roots, shoots, or callus — the ratio of two hormones decides which</text>

  <!-- 2D matrix: x = cytokinin, y = auxin (inverted) -->
  <!-- Outer chart frame -->
  <rect x="120" y="68" width="520" height="280" rx="6" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>

  <!-- X axis: cytokinin -->
  <line x1="120" y1="348" x2="640" y2="348" stroke="#1a202c" stroke-width="2"/>
  <polygon points="640,344 654,348 640,352" fill="#1a202c"/>
  <text x="380" y="376" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Cytokinin concentration  →</text>

  <!-- Y axis: auxin -->
  <line x1="120" y1="348" x2="120" y2="68" stroke="#1a202c" stroke-width="2"/>
  <polygon points="116,68 120,54 124,68" fill="#1a202c"/>
  <text x="48" y="208" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle" transform="rotate(-90 48 208)">Auxin concentration  ↑</text>

  <!-- Quadrant labels -->
  <text x="160" y="86" font-size="9" fill="#4a5568">low cyt</text>
  <text x="160" y="98" font-size="9" font-weight="700" fill="#15803d">HIGH AUXIN</text>

  <text x="600" y="86" font-size="9" fill="#4a5568" text-anchor="end">high cyt</text>
  <text x="600" y="98" font-size="9" font-weight="700" fill="#15803d" text-anchor="end">HIGH AUXIN</text>

  <text x="160" y="324" font-size="9" fill="#4a5568">low cyt</text>
  <text x="160" y="338" font-size="9" font-weight="700" fill="#dc2626">low auxin</text>

  <text x="600" y="324" font-size="9" fill="#4a5568" text-anchor="end">high cyt</text>
  <text x="600" y="338" font-size="9" font-weight="700" fill="#dc2626" text-anchor="end">low auxin</text>

  <!-- ═══ Region 1 — top-left: high auxin / low cyt → ROOTS ═══ -->
  <rect x="138" y="108" width="160" height="100" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="218" y="128" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">→ ROOTS</text>
  <!-- Root drawing -->
  <g transform="translate(218, 162)">
    <line x1="0" y1="-22" x2="0" y2="20" stroke="#a16207" stroke-width="3"/>
    <path d="M 0 -10 Q -10 -4 -22 8 Q -28 14 -32 24" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 0 -2 Q 12 4 24 16 Q 30 22 32 30" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 0 8 Q -8 14 -16 26" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <path d="M 0 8 Q 8 14 16 26" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <line x1="-32" y1="24" x2="-36" y2="28" stroke="#a16207" stroke-width="0.7"/>
    <line x1="32" y1="30" x2="36" y2="34" stroke="#a16207" stroke-width="0.7"/>
  </g>
  <text x="218" y="200" font-size="9" font-style="italic" fill="#14532d" text-anchor="middle">callus → root primordia</text>

  <!-- ═══ Region 2 — top-right: high auxin + high cyt → CALLUS ═══ -->
  <rect x="320" y="108" width="160" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="400" y="128" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">→ CALLUS (cloning)</text>
  <!-- Callus drawing — undifferentiated mass -->
  <g transform="translate(400, 162)">
    <circle cx="-12" cy="-8" r="10" fill="#d97706" stroke="#78350f" stroke-width="1.2"/>
    <circle cx="2" cy="-12" r="10" fill="#d97706" stroke="#78350f" stroke-width="1.2"/>
    <circle cx="14" cy="-6" r="10" fill="#d97706" stroke="#78350f" stroke-width="1.2"/>
    <circle cx="-6" cy="6" r="10" fill="#d97706" stroke="#78350f" stroke-width="1.2"/>
    <circle cx="10" cy="10" r="10" fill="#d97706" stroke="#78350f" stroke-width="1.2"/>
    <circle cx="-18" cy="6" r="9" fill="#d97706" stroke="#78350f" stroke-width="1.2"/>
    <circle cx="22" cy="0" r="9" fill="#d97706" stroke="#78350f" stroke-width="1.2"/>
  </g>
  <text x="400" y="200" font-size="9" font-style="italic" fill="#78350f" text-anchor="middle">undifferentiated proliferating mass</text>

  <!-- ═══ Region 3 — middle-right (high cyt, low auxin) → SHOOTS ═══ -->
  <rect x="500" y="208" width="120" height="100" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="560" y="228" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">→ SHOOTS</text>
  <!-- Shoot drawing -->
  <g transform="translate(560, 264)">
    <line x1="0" y1="20" x2="0" y2="-20" stroke="#15803d" stroke-width="3"/>
    <ellipse cx="-12" cy="-12" rx="10" ry="5" fill="#86efac" stroke="#15803d" stroke-width="1"/>
    <ellipse cx="12" cy="-12" rx="10" ry="5" fill="#86efac" stroke="#15803d" stroke-width="1"/>
    <ellipse cx="-14" cy="0" rx="12" ry="5" fill="#86efac" stroke="#15803d" stroke-width="1"/>
    <ellipse cx="14" cy="0" rx="12" ry="5" fill="#86efac" stroke="#15803d" stroke-width="1"/>
    <ellipse cx="0" cy="-22" rx="6" ry="6" fill="#15803d"/>
  </g>
  <text x="560" y="300" font-size="9" font-style="italic" fill="#14532d" text-anchor="middle">shoots + leaves</text>

  <!-- ═══ Region 4 — bottom-left (low everything) → no growth ═══ -->
  <rect x="138" y="248" width="160" height="80" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="218" y="280" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">no callus growth</text>
  <text x="218" y="296" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">(both hormones too low)</text>

  <!-- Hormone gradient bars -->
  <!-- Auxin gradient on Y axis -->
  <defs>
    <linearGradient id="auxinGrad" x1="0" y1="100%" x2="0" y2="0%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="cytGrad" x1="0" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect x="100" y="68" width="14" height="280" fill="url(#auxinGrad)" stroke="#15803d" stroke-width="1"/>
  <rect x="120" y="354" width="520" height="12" fill="url(#cytGrad)" stroke="#b45309" stroke-width="1"/>

  <!-- Bottom: takeaway -->
  <rect x="40" y="384" width="680" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="402" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">Skoog &amp; Miller (1957) — hormone RATIO, not absolute amount, decides differentiation.</text>
</svg>
