<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Auxin phototropism mechanism — coleoptile bending toward light">
  <title>Auxin and Phototropism — Why Plants Bend Toward Light</title>
  <desc>A four-panel sequence showing the classic Went and Boysen-Jensen experiment on phototropism in oat coleoptiles. Panel 1 — even light, no auxin gradient: the seedling grows straight up. Panel 2 — light from one side: the auxin synthesised at the apex migrates laterally to the dark side. Panel 3 — auxin accumulated on the dark side causes those cells to elongate more than the lit side. Panel 4 — uneven elongation makes the coleoptile bend toward the light source. The cellular mechanism is shown to the right: auxin activates plasma-membrane H+ pumps, lowering the apoplastic pH, which loosens cell-wall expansins; loose walls let cells stretch as the vacuole takes in water. This is the acid-growth hypothesis.</desc>

  <text x="380" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Auxin and Phototropism — Bending Toward Light</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Auxin migrates to the dark side · cells there elongate more · the shoot bends toward light</text>

  <!-- ═══ Panel 1: even light → straight ═══ -->
  <g transform="translate(40, 64)">
    <rect x="0" y="0" width="170" height="240" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="85" y="20" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">1. Even light</text>
    <!-- Light arrows from above -->
    <text x="60" y="44" font-size="14" fill="#f59e0b">↓</text>
    <text x="80" y="44" font-size="14" fill="#f59e0b">↓</text>
    <text x="100" y="44" font-size="14" fill="#f59e0b">↓</text>
    <!-- Coleoptile -->
    <rect x="70" y="50" width="30" height="160" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="85" cy="50" rx="15" ry="6" fill="#15803d"/>
    <!-- Even auxin (dots both sides) -->
    <circle cx="78" cy="80" r="2.5" fill="#d97706"/>
    <circle cx="92" cy="80" r="2.5" fill="#d97706"/>
    <circle cx="78" cy="100" r="2.5" fill="#d97706"/>
    <circle cx="92" cy="100" r="2.5" fill="#d97706"/>
    <circle cx="78" cy="120" r="2.5" fill="#d97706"/>
    <circle cx="92" cy="120" r="2.5" fill="#d97706"/>
    <circle cx="78" cy="140" r="2.5" fill="#d97706"/>
    <circle cx="92" cy="140" r="2.5" fill="#d97706"/>
    <!-- Soil -->
    <rect x="0" y="210" width="170" height="30" fill="#a16207"/>
    <text x="85" y="226" font-size="9" font-style="italic" fill="#fef3c7" text-anchor="middle">soil</text>
    <text x="85" y="234" font-size="8" fill="#fef3c7" text-anchor="middle">straight upward growth</text>
  </g>

  <!-- ═══ Panel 2: side light, auxin migrates ═══ -->
  <g transform="translate(220, 64)">
    <rect x="0" y="0" width="170" height="240" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="85" y="20" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">2. Light from left</text>
    <!-- Light arrows from left -->
    <text x="14" y="80" font-size="14" fill="#f59e0b">→</text>
    <text x="14" y="110" font-size="14" fill="#f59e0b">→</text>
    <text x="14" y="140" font-size="14" fill="#f59e0b">→</text>
    <!-- Coleoptile (still straight) -->
    <rect x="70" y="50" width="30" height="160" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="85" cy="50" rx="15" ry="6" fill="#15803d"/>
    <!-- Auxin migrating to dark side (right) -->
    <text x="78" y="64" font-size="9" font-weight="700" fill="#d97706" text-anchor="middle">low</text>
    <text x="92" y="64" font-size="9" font-weight="700" fill="#d97706" text-anchor="middle">high</text>
    <circle cx="92" cy="80" r="3.5" fill="#d97706"/>
    <circle cx="92" cy="92" r="3.5" fill="#d97706"/>
    <circle cx="92" cy="104" r="3.5" fill="#d97706"/>
    <circle cx="92" cy="116" r="3.5" fill="#d97706"/>
    <circle cx="92" cy="128" r="3.5" fill="#d97706"/>
    <circle cx="92" cy="140" r="3.5" fill="#d97706"/>
    <circle cx="78" cy="100" r="2" fill="#d97706" opacity="0.5"/>
    <circle cx="78" cy="124" r="2" fill="#d97706" opacity="0.5"/>
    <!-- Lateral arrow showing migration -->
    <line x1="78" y1="68" x2="92" y2="68" stroke="#d97706" stroke-width="1.5"/>
    <polygon points="88,65 94,68 88,71" fill="#d97706"/>
    <!-- Soil -->
    <rect x="0" y="210" width="170" height="30" fill="#a16207"/>
    <text x="85" y="226" font-size="9" fill="#fef3c7" text-anchor="middle">auxin →</text>
    <text x="85" y="236" font-size="8" fill="#fef3c7" text-anchor="middle">accumulates dark side</text>
  </g>

  <!-- ═══ Panel 3 + 4: bending begins → bent ═══ -->
  <g transform="translate(400, 64)">
    <rect x="0" y="0" width="320" height="240" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="160" y="20" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">3. Dark-side cells elongate more → 4. Bending</text>

    <!-- Light arrows -->
    <text x="14" y="100" font-size="14" fill="#f59e0b">→</text>
    <text x="14" y="130" font-size="14" fill="#f59e0b">→</text>
    <text x="14" y="160" font-size="14" fill="#f59e0b">→</text>

    <!-- Bent coleoptile -->
    <path d="M 90 210 L 90 130 Q 90 90 130 70 L 158 60 L 158 50 L 174 50 L 174 60 L 148 80 Q 116 100 116 130 L 116 210 Z"
          fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="166" cy="50" rx="14" ry="6" fill="#15803d"/>

    <!-- Cell elongation indicators on dark side (longer arrows) -->
    <line x1="106" y1="170" x2="106" y2="138" stroke="#d97706" stroke-width="1.8"/>
    <polygon points="103,142 106,134 109,142" fill="#d97706"/>
    <line x1="106" y1="138" x2="106" y2="106" stroke="#d97706" stroke-width="1.8"/>
    <polygon points="103,110 106,102 109,110" fill="#d97706"/>
    <line x1="100" y1="200" x2="100" y2="178" stroke="#d97706" stroke-width="1.5"/>
    <polygon points="97,182 100,174 103,182" fill="#d97706"/>
    <text x="148" y="148" font-size="9" font-weight="700" fill="#d97706">long cells</text>
    <text x="148" y="160" font-size="9" font-weight="700" fill="#d97706">(more auxin)</text>

    <!-- Lit side has shorter arrows (small marks) -->
    <line x1="90" y1="178" x2="90" y2="170" stroke="#15803d" stroke-width="1"/>
    <line x1="90" y1="160" x2="90" y2="152" stroke="#15803d" stroke-width="1"/>
    <line x1="90" y1="142" x2="90" y2="134" stroke="#15803d" stroke-width="1"/>
    <text x="60" y="156" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">short cells</text>
    <text x="60" y="168" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">(less auxin)</text>

    <!-- Soil -->
    <rect x="0" y="210" width="320" height="30" fill="#a16207"/>
    <text x="160" y="230" font-size="9" font-weight="700" fill="#fef3c7" text-anchor="middle">tip bends → toward light</text>
  </g>

  <!-- ═══ Mechanism callout: acid-growth hypothesis ═══ -->
  <g transform="translate(40, 320)">
    <rect x="0" y="0" width="680" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="340" y="22" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">Cellular mechanism — the acid-growth hypothesis</text>

    <!-- Step 1: auxin in -->
    <rect x="14" y="34" width="124" height="78" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="76" y="50" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">1. Auxin enters cell</text>
    <circle cx="46" cy="74" r="6" fill="#d97706"/>
    <text x="46" y="78" font-size="8" font-weight="700" fill="#fef3c7" text-anchor="middle">IAA</text>
    <line x1="56" y1="74" x2="80" y2="74" stroke="#15803d" stroke-width="1.5"/>
    <polygon points="76,71 84,74 76,77" fill="#15803d"/>
    <rect x="84" y="60" width="38" height="28" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
    <text x="103" y="78" font-size="9" font-weight="700" fill="#14532d" text-anchor="middle">cell</text>
    <text x="76" y="104" font-size="9" font-style="italic" fill="#14532d" text-anchor="middle">activates H⁺ pumps</text>

    <!-- arrow -->
    <line x1="142" y1="74" x2="166" y2="74" stroke="#d97706" stroke-width="2"/>
    <polygon points="162,70 172,74 162,78" fill="#d97706"/>

    <!-- Step 2: H+ pumped -->
    <rect x="174" y="34" width="124" height="78" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="236" y="50" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">2. Wall acidifies</text>
    <text x="208" y="74" font-size="11" font-weight="700" fill="#dc2626">H⁺</text>
    <line x1="220" y1="74" x2="244" y2="74" stroke="#dc2626" stroke-width="1.5"/>
    <polygon points="240,71 248,74 240,77" fill="#dc2626"/>
    <text x="262" y="74" font-size="11" font-weight="700" fill="#dc2626">apoplast</text>
    <text x="236" y="98" font-size="9" font-style="italic" fill="#14532d" text-anchor="middle">pH drops to ~4.5</text>

    <!-- arrow -->
    <line x1="302" y1="74" x2="326" y2="74" stroke="#d97706" stroke-width="2"/>
    <polygon points="322,70 332,74 322,78" fill="#d97706"/>

    <!-- Step 3: expansins -->
    <rect x="334" y="34" width="124" height="78" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="396" y="50" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">3. Expansins active</text>
    <line x1="354" y1="68" x2="438" y2="68" stroke="#b45309" stroke-width="1.5"/>
    <line x1="354" y1="76" x2="438" y2="76" stroke="#b45309" stroke-width="1.5"/>
    <line x1="354" y1="84" x2="438" y2="84" stroke="#b45309" stroke-width="1.5"/>
    <line x1="372" y1="68" x2="372" y2="84" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2 1"/>
    <line x1="396" y1="68" x2="396" y2="84" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2 1"/>
    <line x1="420" y1="68" x2="420" y2="84" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2 1"/>
    <text x="396" y="104" font-size="9" font-style="italic" fill="#14532d" text-anchor="middle">cell wall loosens</text>

    <!-- arrow -->
    <line x1="462" y1="74" x2="486" y2="74" stroke="#d97706" stroke-width="2"/>
    <polygon points="482,70 492,74 482,78" fill="#d97706"/>

    <!-- Step 4: cell elongates -->
    <rect x="494" y="34" width="172" height="78" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="580" y="50" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">4. Cell elongates</text>
    <rect x="514" y="60" width="32" height="34" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
    <line x1="552" y1="76" x2="568" y2="76" stroke="#dc2626" stroke-width="1.5"/>
    <polygon points="564,72 574,76 564,80" fill="#dc2626"/>
    <rect x="576" y="60" width="78" height="34" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
    <text x="615" y="80" font-size="9" font-weight="700" fill="#14532d" text-anchor="middle">longer</text>
    <text x="580" y="104" font-size="9" font-style="italic" fill="#14532d" text-anchor="middle">vacuole takes in water</text>
  </g>

  <!-- Bottom citation -->
  <text x="380" y="452" font-size="9" font-style="italic" fill="#4a5568" text-anchor="middle">Classic experiments: Charles Darwin (1880) noticed the bending; Frits Went (1926) collected the active substance — IAA — in agar.</text>
</svg>
