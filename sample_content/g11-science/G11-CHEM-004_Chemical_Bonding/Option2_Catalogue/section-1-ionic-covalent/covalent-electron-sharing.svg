<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Covalent bond — two hydrogen atoms share a pair of electrons">
  <title>Covalent bond — H + H → H₂ (shared pair)</title>
  <desc>Two hydrogen atoms approach. Their 1s orbitals overlap and the two electrons are shared, forming an H–H single covalent bond. Each atom now has access to two electrons, achieving the duet (helium) configuration.</desc>

  <text x="300" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Covalent Bond — Sharing a Pair of Electrons (H + H → H₂)</text>
  <text x="300" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Non-metal + non-metal · 1s orbitals overlap · two electrons in the shared region</text>

  <!-- Left: separated H atoms -->
  <text x="160" y="70" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">Before — two atoms</text>

  <g>
    <circle cx="100" cy="160" r="32" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <circle cx="100" cy="160" r="6" fill="#dc2626" />
    <text x="100" y="164" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">H</text>
    <circle cx="124" cy="160" r="4" fill="#1e3a8a" stroke="#0f172a" stroke-width="1" />
    <text x="100" y="120" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">1 e⁻ (1s¹)</text>
    <text x="100" y="206" font-size="10" fill="#4a5568" text-anchor="middle">unpaired</text>
  </g>
  <g>
    <circle cx="220" cy="160" r="32" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <circle cx="220" cy="160" r="6" fill="#dc2626" />
    <text x="220" y="164" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">H</text>
    <circle cx="196" cy="160" r="4" fill="#1e3a8a" stroke="#0f172a" stroke-width="1" />
    <text x="220" y="120" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">1 e⁻ (1s¹)</text>
    <text x="220" y="206" font-size="10" fill="#4a5568" text-anchor="middle">unpaired</text>
  </g>

  <!-- Arrow -->
  <line x1="270" y1="160" x2="330" y2="160" stroke="#1a202c" stroke-width="2" />
  <polygon points="330,154 342,160 330,166" fill="#1a202c" />
  <text x="300" y="146" font-size="10" font-weight="700" fill="#1a202c" text-anchor="middle">overlap</text>

  <!-- Right: H₂ molecule with shared pair -->
  <text x="450" y="70" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">After — shared pair</text>

  <!-- Two overlapping circles -->
  <circle cx="430" cy="160" r="32" fill="#fee2e2" stroke="#dc2626" stroke-width="2" opacity="0.7" />
  <circle cx="480" cy="160" r="32" fill="#fee2e2" stroke="#dc2626" stroke-width="2" opacity="0.7" />
  <!-- nuclei -->
  <circle cx="430" cy="160" r="6" fill="#dc2626" />
  <text x="430" y="164" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">H</text>
  <circle cx="480" cy="160" r="6" fill="#dc2626" />
  <text x="480" y="164" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">H</text>
  <!-- shared pair (in overlap region between nuclei) -->
  <circle cx="450" cy="160" r="4.5" fill="#facc15" stroke="#92400e" stroke-width="1.2" />
  <circle cx="460" cy="160" r="4.5" fill="#facc15" stroke="#92400e" stroke-width="1.2" />
  <text x="455" y="124" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">shared pair</text>
  <line x1="455" y1="135" x2="455" y2="148" stroke="#92400e" stroke-width="1.2" />

  <!-- Lewis-style line -->
  <text x="455" y="225" font-size="22" font-weight="700" fill="#1a202c" text-anchor="middle">H — H</text>
  <text x="455" y="250" font-size="11" fill="#4a5568" text-anchor="middle">1 shared pair = 1 single bond</text>

  <!-- Bottom legend -->
  <line x1="40" y1="278" x2="560" y2="278" stroke="#cbd5e1" stroke-width="1" />
  <text x="300" y="298" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Each H now "feels" 2 electrons → duet (He) configuration achieved.</text>
  <text x="300" y="313" font-size="10" fill="#4a5568" text-anchor="middle">Bond length ≈ 74 pm · bond enthalpy ≈ 436 kJ mol⁻¹</text>
</svg>
