<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Three intermolecular forces — London dispersion, dipole-dipole, hydrogen bonding">
  <title>Three intermolecular forces — London dispersion, dipole-dipole, hydrogen bond</title>
  <desc>Three IMF panels comparing London dispersion (instantaneous induced dipoles in non-polar molecules), dipole-dipole (permanent dipoles aligning head-to-tail) and hydrogen bonding (a special strong dipole-dipole when H is bonded to N, O or F). Strength ranking: H-bond &gt; dipole-dipole &gt; London dispersion.</desc>

  <text x="380" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Intermolecular Forces — Between Molecules, Not Inside Them</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">All IMFs are weaker than covalent or ionic bonds. They set boiling/melting points, viscosity, and surface tension.</text>

  <!-- ── London dispersion ─────────────────────────────────────── -->
  <g transform="translate(140, 200)">
    <rect x="-110" y="-90" width="220" height="220" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <text x="0" y="-66" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">London dispersion</text>
    <text x="0" y="-50" font-size="10" fill="#4a5568" text-anchor="middle">all molecules · weakest · grows with size</text>

    <!-- Two non-polar molecules with transient dipole shading -->
    <ellipse cx="-44" cy="0" rx="32" ry="20" fill="url(#ld-grad-1)" stroke="#475569" stroke-width="1.5" />
    <ellipse cx="44"  cy="0" rx="32" ry="20" fill="url(#ld-grad-2)" stroke="#475569" stroke-width="1.5" />

    <defs>
      <linearGradient id="ld-grad-1" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#dc2626" stop-opacity="0.45" />
        <stop offset="100%" stop-color="#2b6cb0" stop-opacity="0.45" />
      </linearGradient>
      <linearGradient id="ld-grad-2" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#dc2626" stop-opacity="0.45" />
        <stop offset="100%" stop-color="#2b6cb0" stop-opacity="0.45" />
      </linearGradient>
    </defs>

    <text x="-58" y="-22" font-size="10" font-weight="700" fill="#dc2626">δ⁺</text>
    <text x="-26" y="-22" font-size="10" font-weight="700" fill="#2b6cb0">δ⁻</text>
    <text x="30"  y="-22" font-size="10" font-weight="700" fill="#dc2626">δ⁺</text>
    <text x="60"  y="-22" font-size="10" font-weight="700" fill="#2b6cb0">δ⁻</text>

    <!-- weak attraction (dotted) -->
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#475569" stroke-width="2" stroke-dasharray="2 2" />

    <text x="0" y="50" font-size="10" fill="#4a5568" text-anchor="middle">e⁻ density fluctuates → instant dipole</text>
    <text x="0" y="66" font-size="10" fill="#4a5568" text-anchor="middle">induces a dipole in its neighbour</text>
    <text x="0" y="100" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">~ 0.05 – 40 kJ mol⁻¹</text>
    <text x="0" y="118" font-size="10" fill="#4a5568" text-anchor="middle">e.g. He, N₂, CH₄, alkanes</text>
  </g>

  <!-- ── Dipole-dipole ─────────────────────────────────────────── -->
  <g transform="translate(380, 200)">
    <rect x="-110" y="-90" width="220" height="220" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="1.5" />
    <text x="0" y="-66" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Dipole–dipole</text>
    <text x="0" y="-50" font-size="10" fill="#4a5568" text-anchor="middle">polar molecules · permanent dipoles</text>

    <!-- Two HCl-like polar molecules aligned head-to-tail -->
    <g transform="translate(-44, 0)">
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#1a202c" stroke-width="2" />
      <circle cx="-22" cy="0" r="12" fill="#fef3c7" stroke="#92400e" stroke-width="1.5" />
      <text x="-22" y="4" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
      <circle cx="22"  cy="0" r="14" fill="#15803d" stroke="#1a202c" stroke-width="1.5" />
      <text x="22" y="4" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Cl</text>
      <text x="-22" y="-18" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">δ⁺</text>
      <text x="22"  y="-18" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="middle">δ⁻</text>
    </g>
    <g transform="translate(50, 0)">
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#1a202c" stroke-width="2" />
      <circle cx="-22" cy="0" r="12" fill="#fef3c7" stroke="#92400e" stroke-width="1.5" />
      <text x="-22" y="4" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
      <circle cx="22"  cy="0" r="14" fill="#15803d" stroke="#1a202c" stroke-width="1.5" />
      <text x="22" y="4" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Cl</text>
      <text x="-22" y="-18" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">δ⁺</text>
      <text x="22"  y="-18" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="middle">δ⁻</text>
    </g>

    <!-- attraction (Cl δ- ←→ H δ+ next molecule) -->
    <line x1="-22" y1="14" x2="28" y2="14" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3" />
    <text x="3" y="32" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">δ⁻ ⋯ δ⁺ attraction</text>

    <text x="0" y="100" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">~ 5 – 25 kJ mol⁻¹</text>
    <text x="0" y="118" font-size="10" fill="#4a5568" text-anchor="middle">e.g. HCl, CH₃Cl, acetone</text>
  </g>

  <!-- ── Hydrogen bond ─────────────────────────────────────────── -->
  <g transform="translate(620, 200)">
    <rect x="-110" y="-90" width="220" height="220" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="0" y="-66" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Hydrogen bond</text>
    <text x="0" y="-50" font-size="10" fill="#4a5568" text-anchor="middle">H–N/O/F donor · N/O/F acceptor</text>

    <!-- Two H₂O molecules with H-bond (dashed line) between O of one and H of other -->
    <g transform="translate(-44, -10)">
      <line x1="0" y1="0" x2="-22" y2="14" stroke="#1a202c" stroke-width="2" />
      <line x1="0" y1="0" x2="22"  y2="14" stroke="#1a202c" stroke-width="2" />
      <circle cx="0" cy="0" r="13" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
      <text x="0" y="4" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">O</text>
      <circle cx="-22" cy="14" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1" />
      <text x="-22" y="17" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
      <circle cx="22"  cy="14" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1" />
      <text x="22" y="17" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
      <text x="-14" y="-12" font-size="9" font-weight="700" fill="#2b6cb0">δ⁻</text>
      <text x="32" y="22" font-size="9" font-weight="700" fill="#dc2626">δ⁺</text>
    </g>

    <g transform="translate(54, 24)">
      <line x1="0" y1="0" x2="-22" y2="-14" stroke="#1a202c" stroke-width="2" />
      <line x1="0" y1="0" x2="22"  y2="-14" stroke="#1a202c" stroke-width="2" />
      <circle cx="0" cy="0" r="13" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
      <text x="0" y="4" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">O</text>
      <circle cx="-22" cy="-14" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1" />
      <text x="-22" y="-11" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
      <circle cx="22"  cy="-14" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1" />
      <text x="22" y="-11" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
      <text x="14" y="14" font-size="9" font-weight="700" fill="#2b6cb0">δ⁻</text>
      <text x="-44" y="-22" font-size="9" font-weight="700" fill="#dc2626">δ⁺</text>
    </g>

    <!-- H-bond dashed line — between O (top molecule) at (0+(-44), 0+(-10))=(-44,-10), and H (bottom molecule) at (-22+54, -14+24)=(32,10) — wait need a clean path. Use clearer geometry: -->
    <line x1="-22" y1="4" x2="32" y2="10" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3" />
    <text x="6" y="-2" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">H-bond</text>

    <text x="0" y="100" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">~ 10 – 40 kJ mol⁻¹</text>
    <text x="0" y="118" font-size="10" fill="#4a5568" text-anchor="middle">e.g. H₂O, NH₃, HF, DNA bases</text>
  </g>

  <!-- Strength ranking strip -->
  <line x1="40" y1="340" x2="720" y2="340" stroke="#cbd5e1" stroke-width="1" />
  <text x="380" y="360" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Strength ranking:  H-bond  &gt;  dipole-dipole  &gt;  London dispersion   ·   stronger IMF → higher boiling point</text>
</svg>
