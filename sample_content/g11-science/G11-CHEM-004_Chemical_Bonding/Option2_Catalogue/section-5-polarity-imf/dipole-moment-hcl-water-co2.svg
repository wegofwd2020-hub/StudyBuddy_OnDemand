<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Dipole moments — polar HCl, polar H2O, non-polar CO2">
  <title>Dipole moments — HCl, H₂O, CO₂</title>
  <desc>Three molecules. HCl has a single bond dipole; the molecule is polar. H₂O has two bond dipoles that add (vector sum non-zero) because the molecule is bent; the molecule is polar. CO₂ has two equal bond dipoles 180° apart that cancel; the molecule is non-polar overall.</desc>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Dipole Moments — Bond Polarity vs Molecular Polarity</text>
  <text x="360" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Bond dipole points from δ⁺ to δ⁻ (more electronegative atom). Molecular dipole = vector sum of bond dipoles.</text>

  <defs>
    <marker id="dp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="dp-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- ── HCl ─────────────────────────────────────────────────────── -->
  <g transform="translate(140, 200)">
    <rect x="-100" y="-90" width="200" height="220" rx="10" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="0" y="-66" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">HCl — polar</text>

    <!-- bond -->
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#1a202c" stroke-width="2.5" />
    <!-- H -->
    <circle cx="-30" cy="0" r="14" fill="#fef3c7" stroke="#92400e" stroke-width="1.5" />
    <text x="-30" y="4" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="-30" y="-22" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">δ⁺</text>
    <!-- Cl -->
    <circle cx="30" cy="0" r="16" fill="#15803d" stroke="#1a202c" stroke-width="1.5" />
    <text x="30" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Cl</text>
    <text x="30" y="-22" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">δ⁻</text>

    <!-- Dipole arrow (with cross at + tail) -->
    <line x1="-44" y1="40" x2="44" y2="40" stroke="#dc2626" stroke-width="2.5" marker-end="url(#dp-arrow)" />
    <line x1="-50" y1="34" x2="-38" y2="46" stroke="#dc2626" stroke-width="2" />
    <line x1="-50" y1="46" x2="-38" y2="34" stroke="#dc2626" stroke-width="2" />
    <text x="0" y="62" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">μ ≠ 0  (μ ≈ 1.08 D)</text>

    <text x="0" y="100" font-size="10" fill="#4a5568" text-anchor="middle">EN(Cl)=3.16 vs EN(H)=2.20</text>
    <text x="0" y="116" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">→ Polar molecule</text>
  </g>

  <!-- ── H₂O ─────────────────────────────────────────────────────── -->
  <g transform="translate(360, 200)">
    <rect x="-100" y="-90" width="200" height="220" rx="10" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="0" y="-66" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">H₂O — polar (bent)</text>

    <!-- bonds at 104.5° -->
    <line x1="0" y1="0" x2="-44" y2="34" stroke="#1a202c" stroke-width="2.5" />
    <line x1="0" y1="0" x2="44"  y2="34" stroke="#1a202c" stroke-width="2.5" />

    <!-- O -->
    <circle cx="0" cy="0" r="16" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
    <text x="0" y="4" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text>
    <text x="22" y="-12" font-size="13" font-weight="700" fill="#2b6cb0">δ⁻</text>

    <!-- H atoms -->
    <circle cx="-44" cy="34" r="13" fill="#fef3c7" stroke="#92400e" stroke-width="1.5" />
    <text x="-44" y="38" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <circle cx="44"  cy="34" r="13" fill="#fef3c7" stroke="#92400e" stroke-width="1.5" />
    <text x="44" y="38" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H</text>
    <text x="-58" y="56" font-size="13" font-weight="700" fill="#dc2626">δ⁺</text>
    <text x="58"  y="56" font-size="13" font-weight="700" fill="#dc2626">δ⁺</text>

    <!-- Bond dipoles (pointing toward O — i.e. up the bonds) -->
    <line x1="-30" y1="22" x2="-8"  y2="6" stroke="#2b6cb0" stroke-width="2" marker-end="url(#dp-arrow-blue)" />
    <line x1="30"  y1="22" x2="8"   y2="6" stroke="#2b6cb0" stroke-width="2" marker-end="url(#dp-arrow-blue)" />

    <!-- Net dipole arrow (up from O — i.e. pointing toward δ-) -->
    <line x1="0" y1="-8" x2="0" y2="-46" stroke="#dc2626" stroke-width="3" marker-end="url(#dp-arrow)" />
    <text x="14" y="-30" font-size="11" font-weight="700" fill="#dc2626">μ_net</text>
    <text x="0" y="76" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">μ ≠ 0  (μ ≈ 1.85 D)</text>

    <text x="0" y="100" font-size="10" fill="#4a5568" text-anchor="middle">Bent geometry → dipoles add</text>
    <text x="0" y="116" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">→ Polar molecule</text>
  </g>

  <!-- ── CO₂ ─────────────────────────────────────────────────────── -->
  <g transform="translate(580, 200)">
    <rect x="-100" y="-90" width="200" height="220" rx="10" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="0" y="-66" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">CO₂ — non-polar (linear)</text>

    <!-- linear bonds -->
    <line x1="-58" y1="0" x2="-22" y2="0" stroke="#1a202c" stroke-width="2.5" />
    <line x1="-58" y1="-4" x2="-22" y2="-4" stroke="#1a202c" stroke-width="2.5" />
    <line x1="22"  y1="0" x2="58"  y2="0" stroke="#1a202c" stroke-width="2.5" />
    <line x1="22"  y1="-4" x2="58"  y2="-4" stroke="#1a202c" stroke-width="2.5" />

    <!-- O - C - O -->
    <circle cx="-72" cy="-2" r="14" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
    <text x="-72" y="2" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text>
    <circle cx="0" cy="-2"   r="14" fill="#1a202c" stroke="#1a202c" stroke-width="1.5" />
    <text x="0" y="2" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <circle cx="72"  cy="-2" r="14" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
    <text x="72" y="2" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text>

    <text x="-72" y="-22" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">δ⁻</text>
    <text x="0"   y="-22" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">δ⁺</text>
    <text x="72"  y="-22" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">δ⁻</text>

    <!-- two bond dipole arrows pointing OUT (toward O, i.e. away from C) — equal & opposite -->
    <line x1="-12" y1="36" x2="-50" y2="36" stroke="#2b6cb0" stroke-width="2" marker-end="url(#dp-arrow-blue)" />
    <line x1="12"  y1="36" x2="50"  y2="36" stroke="#2b6cb0" stroke-width="2" marker-end="url(#dp-arrow-blue)" />

    <text x="0" y="62" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">dipoles cancel ↔</text>
    <text x="0" y="80" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">μ_net = 0 D</text>

    <text x="0" y="106" font-size="10" fill="#4a5568" text-anchor="middle">Bonds polar, but molecule symmetric</text>
    <text x="0" y="122" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">→ Non-polar molecule</text>
  </g>
</svg>
