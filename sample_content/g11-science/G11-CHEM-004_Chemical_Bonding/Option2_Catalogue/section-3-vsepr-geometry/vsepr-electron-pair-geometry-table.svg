<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-label="VSEPR table — steric number to electron-pair geometry to molecular shape">
  <title>VSEPR table — from steric number to molecular shape</title>
  <desc>Reference table mapping steric number (sum of bond pairs and lone pairs on the central atom) to electron-pair geometry, then to molecular shape based on lone-pair count, including bond angle and example molecule.</desc>

  <text x="380" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">VSEPR Reference — Steric Number → Electron Geometry → Molecular Shape</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Steric number = (σ-bonds) + (lone pairs on central atom). Multiple bonds count once.</text>

  <!-- Header row -->
  <rect x="20"  y="60" width="60"  height="32" fill="#1e3a8a" stroke="#1e3a8a" />
  <rect x="80"  y="60" width="160" height="32" fill="#1e3a8a" stroke="#1e3a8a" />
  <rect x="240" y="60" width="80"  height="32" fill="#1e3a8a" stroke="#1e3a8a" />
  <rect x="320" y="60" width="200" height="32" fill="#1e3a8a" stroke="#1e3a8a" />
  <rect x="520" y="60" width="100" height="32" fill="#1e3a8a" stroke="#1e3a8a" />
  <rect x="620" y="60" width="120" height="32" fill="#1e3a8a" stroke="#1e3a8a" />

  <text x="50"  y="80" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">SN</text>
  <text x="160" y="80" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Electron-pair geometry</text>
  <text x="280" y="80" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Lone pairs</text>
  <text x="420" y="80" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Molecular shape</text>
  <text x="570" y="80" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Bond angle</text>
  <text x="680" y="80" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Example</text>

  <!-- Row helpers (alternating shading) -->
  <!-- SN = 2 -->
  <rect x="20" y="92" width="720" height="32" fill="#f1f5f9" />
  <text x="50"  y="112" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">2</text>
  <text x="160" y="112" font-size="11" fill="#1a202c" text-anchor="middle">Linear</text>
  <text x="280" y="112" font-size="11" fill="#1a202c" text-anchor="middle">0</text>
  <text x="420" y="112" font-size="11" fill="#1a202c" text-anchor="middle">Linear</text>
  <text x="570" y="112" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">180°</text>
  <text x="680" y="112" font-size="11" fill="#1a202c" text-anchor="middle">CO₂, BeCl₂</text>

  <!-- SN = 3 — two molecular shapes (0 LP, 1 LP) -->
  <rect x="20" y="124" width="720" height="32" fill="#fff" />
  <text x="50"  y="144" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">3</text>
  <text x="160" y="144" font-size="11" fill="#1a202c" text-anchor="middle">Trigonal planar</text>
  <text x="280" y="144" font-size="11" fill="#1a202c" text-anchor="middle">0</text>
  <text x="420" y="144" font-size="11" fill="#1a202c" text-anchor="middle">Trigonal planar</text>
  <text x="570" y="144" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">120°</text>
  <text x="680" y="144" font-size="11" fill="#1a202c" text-anchor="middle">BF₃, SO₃</text>

  <rect x="20" y="156" width="720" height="32" fill="#f1f5f9" />
  <text x="50"  y="176" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">3</text>
  <text x="160" y="176" font-size="11" fill="#1a202c" text-anchor="middle">Trigonal planar</text>
  <text x="280" y="176" font-size="11" fill="#1a202c" text-anchor="middle">1</text>
  <text x="420" y="176" font-size="11" fill="#1a202c" text-anchor="middle">Bent</text>
  <text x="570" y="176" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">≈ 119°</text>
  <text x="680" y="176" font-size="11" fill="#1a202c" text-anchor="middle">SO₂, O₃</text>

  <!-- SN = 4 — three molecular shapes (0, 1, 2 LP) -->
  <rect x="20" y="188" width="720" height="32" fill="#fff" />
  <text x="50"  y="208" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">4</text>
  <text x="160" y="208" font-size="11" fill="#1a202c" text-anchor="middle">Tetrahedral</text>
  <text x="280" y="208" font-size="11" fill="#1a202c" text-anchor="middle">0</text>
  <text x="420" y="208" font-size="11" fill="#1a202c" text-anchor="middle">Tetrahedral</text>
  <text x="570" y="208" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">109.5°</text>
  <text x="680" y="208" font-size="11" fill="#1a202c" text-anchor="middle">CH₄, NH₄⁺</text>

  <rect x="20" y="220" width="720" height="32" fill="#f1f5f9" />
  <text x="50"  y="240" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">4</text>
  <text x="160" y="240" font-size="11" fill="#1a202c" text-anchor="middle">Tetrahedral</text>
  <text x="280" y="240" font-size="11" fill="#1a202c" text-anchor="middle">1</text>
  <text x="420" y="240" font-size="11" fill="#1a202c" text-anchor="middle">Trigonal pyramidal</text>
  <text x="570" y="240" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">107°</text>
  <text x="680" y="240" font-size="11" fill="#1a202c" text-anchor="middle">NH₃, PH₃</text>

  <rect x="20" y="252" width="720" height="32" fill="#fff" />
  <text x="50"  y="272" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">4</text>
  <text x="160" y="272" font-size="11" fill="#1a202c" text-anchor="middle">Tetrahedral</text>
  <text x="280" y="272" font-size="11" fill="#1a202c" text-anchor="middle">2</text>
  <text x="420" y="272" font-size="11" fill="#1a202c" text-anchor="middle">Bent</text>
  <text x="570" y="272" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">104.5°</text>
  <text x="680" y="272" font-size="11" fill="#1a202c" text-anchor="middle">H₂O, H₂S</text>

  <!-- SN = 5 — four molecular shapes (0–3 LP) -->
  <rect x="20" y="284" width="720" height="32" fill="#f1f5f9" />
  <text x="50"  y="304" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">5</text>
  <text x="160" y="304" font-size="11" fill="#1a202c" text-anchor="middle">Trigonal bipyramidal</text>
  <text x="280" y="304" font-size="11" fill="#1a202c" text-anchor="middle">0</text>
  <text x="420" y="304" font-size="11" fill="#1a202c" text-anchor="middle">Trigonal bipyramidal</text>
  <text x="570" y="304" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">90°/120°/180°</text>
  <text x="680" y="304" font-size="11" fill="#1a202c" text-anchor="middle">PCl₅</text>

  <rect x="20" y="316" width="720" height="32" fill="#fff" />
  <text x="50"  y="336" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">5</text>
  <text x="160" y="336" font-size="11" fill="#1a202c" text-anchor="middle">Trigonal bipyramidal</text>
  <text x="280" y="336" font-size="11" fill="#1a202c" text-anchor="middle">1</text>
  <text x="420" y="336" font-size="11" fill="#1a202c" text-anchor="middle">See-saw</text>
  <text x="570" y="336" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">~ 90°/120°</text>
  <text x="680" y="336" font-size="11" fill="#1a202c" text-anchor="middle">SF₄</text>

  <rect x="20" y="348" width="720" height="32" fill="#f1f5f9" />
  <text x="50"  y="368" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">5</text>
  <text x="160" y="368" font-size="11" fill="#1a202c" text-anchor="middle">Trigonal bipyramidal</text>
  <text x="280" y="368" font-size="11" fill="#1a202c" text-anchor="middle">2</text>
  <text x="420" y="368" font-size="11" fill="#1a202c" text-anchor="middle">T-shaped</text>
  <text x="570" y="368" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">~ 90°</text>
  <text x="680" y="368" font-size="11" fill="#1a202c" text-anchor="middle">ClF₃</text>

  <rect x="20" y="380" width="720" height="32" fill="#fff" />
  <text x="50"  y="400" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">5</text>
  <text x="160" y="400" font-size="11" fill="#1a202c" text-anchor="middle">Trigonal bipyramidal</text>
  <text x="280" y="400" font-size="11" fill="#1a202c" text-anchor="middle">3</text>
  <text x="420" y="400" font-size="11" fill="#1a202c" text-anchor="middle">Linear</text>
  <text x="570" y="400" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">180°</text>
  <text x="680" y="400" font-size="11" fill="#1a202c" text-anchor="middle">XeF₂, I₃⁻</text>

  <!-- SN = 6 -->
  <rect x="20" y="412" width="720" height="32" fill="#f1f5f9" />
  <text x="50"  y="432" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">6</text>
  <text x="160" y="432" font-size="11" fill="#1a202c" text-anchor="middle">Octahedral</text>
  <text x="280" y="432" font-size="11" fill="#1a202c" text-anchor="middle">0</text>
  <text x="420" y="432" font-size="11" fill="#1a202c" text-anchor="middle">Octahedral</text>
  <text x="570" y="432" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">90°</text>
  <text x="680" y="432" font-size="11" fill="#1a202c" text-anchor="middle">SF₆</text>

  <rect x="20" y="444" width="720" height="32" fill="#fff" />
  <text x="50"  y="464" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">6</text>
  <text x="160" y="464" font-size="11" fill="#1a202c" text-anchor="middle">Octahedral</text>
  <text x="280" y="464" font-size="11" fill="#1a202c" text-anchor="middle">2</text>
  <text x="420" y="464" font-size="11" fill="#1a202c" text-anchor="middle">Square planar</text>
  <text x="570" y="464" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">90°</text>
  <text x="680" y="464" font-size="11" fill="#1a202c" text-anchor="middle">XeF₄</text>

  <!-- Frame around table -->
  <rect x="20" y="60" width="720" height="416" fill="none" stroke="#1a202c" stroke-width="1.5" />
</svg>
