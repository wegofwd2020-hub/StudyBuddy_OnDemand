<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Hybrid orbitals sp, sp² and sp³ — geometries and example molecules">
  <title>Hybrid orbitals — sp, sp², sp³</title>
  <desc>Three hybridisation schemes. sp: one s + one p mix to give 2 hybrids 180° apart (linear, e.g. BeCl₂, C₂H₂). sp²: one s + two p give 3 hybrids 120° apart (trigonal planar, e.g. BF₃, C₂H₄). sp³: one s + three p give 4 hybrids 109.5° apart (tetrahedral, e.g. CH₄).</desc>

  <text x="360" y="22" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Hybrid Orbitals — Mixing Atomic Orbitals to Match Geometry</text>
  <text x="360" y="40" font-size="11" fill="#4a5568" text-anchor="middle">Number of hybrids = number of atomic orbitals mixed. Their geometry matches VSEPR exactly.</text>

  <!-- ── sp ──────────────────────────────────────────────────────── -->
  <g transform="translate(140, 200)">
    <rect x="-110" y="-80" width="220" height="220" rx="10" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="0" y="-58" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">sp hybridisation</text>
    <text x="0" y="-42" font-size="10" fill="#4a5568" text-anchor="middle">1s + 1p → 2 sp hybrids</text>

    <!-- Two opposite hybrid lobes (linear, 180°) -->
    <ellipse cx="-50" cy="0" rx="36" ry="18" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="2" />
    <ellipse cx="50"  cy="0" rx="36" ry="18" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="2" />
    <!-- Smaller back-lobe vestiges -->
    <ellipse cx="-22" cy="0" rx="10" ry="6" fill="#a78bfa" opacity="0.45" stroke="#7c3aed" stroke-width="1" />
    <ellipse cx="22"  cy="0" rx="10" ry="6" fill="#a78bfa" opacity="0.45" stroke="#7c3aed" stroke-width="1" />
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="6" fill="#1a202c" />

    <!-- Bond angle indicator -->
    <line x1="-72" y1="0" x2="72" y2="0" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3" />
    <text x="0" y="-22" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">180°</text>

    <text x="0" y="78"  font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">Linear · 2 σ bonds</text>
    <text x="0" y="96"  font-size="10" fill="#4a5568" text-anchor="middle">also 2p remain unhybridised → π bonds</text>
    <text x="0" y="114" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Examples: BeCl₂, C₂H₂ (acetylene)</text>
  </g>

  <!-- ── sp² ─────────────────────────────────────────────────────── -->
  <g transform="translate(360, 200)">
    <rect x="-110" y="-80" width="220" height="220" rx="10" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="0" y="-58" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">sp² hybridisation</text>
    <text x="0" y="-42" font-size="10" fill="#4a5568" text-anchor="middle">1s + 2p → 3 sp² hybrids</text>

    <!-- Three hybrid lobes at 120° (one up, two down-splayed) -->
    <!-- up -->
    <ellipse cx="0" cy="-30" rx="14" ry="32" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="2" />
    <!-- bottom-left (-120° from up = 240° from +x → in our coords, point down-left) -->
    <ellipse cx="-26" cy="15" rx="14" ry="32" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="2" transform="rotate(-120 -26 15)" />
    <!-- bottom-right (+120°) -->
    <ellipse cx="26" cy="15"  rx="14" ry="32" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="2" transform="rotate(120 26 15)" />

    <!-- Nucleus -->
    <circle cx="0" cy="0" r="6" fill="#1a202c" />

    <!-- Angle indicator -->
    <text x="40" y="-2" font-size="13" font-weight="700" fill="#dc2626">120°</text>
    <path d="M 0 -16 A 16 16 0 0 1 14 8" fill="none" stroke="#dc2626" stroke-width="1" />

    <text x="0" y="78"  font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">Trigonal planar · 3 σ bonds</text>
    <text x="0" y="96"  font-size="10" fill="#4a5568" text-anchor="middle">1 unhybridised p above/below plane → π bond</text>
    <text x="0" y="114" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Examples: BF₃, C₂H₄ (ethene)</text>
  </g>

  <!-- ── sp³ ─────────────────────────────────────────────────────── -->
  <g transform="translate(580, 200)">
    <rect x="-110" y="-80" width="220" height="220" rx="10" fill="#f7fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="0" y="-58" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">sp³ hybridisation</text>
    <text x="0" y="-42" font-size="10" fill="#4a5568" text-anchor="middle">1s + 3p → 4 sp³ hybrids</text>

    <!-- Four hybrid lobes at 109.5° (tetrahedral projection) -->
    <!-- up -->
    <ellipse cx="0" cy="-30" rx="12" ry="28" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="2" />
    <!-- down -->
    <ellipse cx="0" cy="30"  rx="12" ry="28" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="2" />
    <!-- left (slightly into the back) -->
    <ellipse cx="-30" cy="0" rx="12" ry="28" fill="#7c3aed" opacity="0.4" stroke="#7c3aed" stroke-width="2" transform="rotate(90 -30 0)" />
    <!-- right -->
    <ellipse cx="30" cy="0"  rx="12" ry="28" fill="#7c3aed" opacity="0.4" stroke="#7c3aed" stroke-width="2" transform="rotate(90 30 0)" />

    <!-- Nucleus -->
    <circle cx="0" cy="0" r="6" fill="#1a202c" />

    <!-- Angle indicator -->
    <text x="40" y="-12" font-size="13" font-weight="700" fill="#dc2626">109.5°</text>

    <text x="0" y="78"  font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">Tetrahedral · 4 σ bonds</text>
    <text x="0" y="96"  font-size="10" fill="#4a5568" text-anchor="middle">no leftover p → only σ bonds</text>
    <text x="0" y="114" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Examples: CH₄, NH₃, H₂O</text>
  </g>

  <!-- Bottom legend -->
  <line x1="40" y1="340" x2="680" y2="340" stroke="#cbd5e1" stroke-width="1" />
  <text x="360" y="360" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Steric number ↔ Hybridisation:  SN 2 → sp · SN 3 → sp² · SN 4 → sp³ · SN 5 → sp³d · SN 6 → sp³d²</text>
</svg>
