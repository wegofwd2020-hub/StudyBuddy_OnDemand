<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" role="img" aria-label="Acceleration-Time graph for UAM">
  <title>Acceleration-Time graph for UAM</title>
  <desc>Horizontal line at a = 2 m/s² showing constant acceleration during uniformly accelerated motion.</desc>
  <rect x="60" y="32" width="370" height="238" fill="#f7fafc" stroke="#e2e8f0" />
<line x1="60" y1="32" x2="60" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
<text x="60" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">0</text>
<line x1="134" y1="32" x2="134" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
<text x="134" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">1</text>
<line x1="208" y1="32" x2="208" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
<text x="208" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">2</text>
<line x1="282" y1="32" x2="282" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
<text x="282" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">3</text>
<line x1="356" y1="32" x2="356" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
<text x="356" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">4</text>
<line x1="430" y1="32" x2="430" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
<text x="430" y="284" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">5</text>
<line x1="60" y1="270" x2="430" y2="270" stroke="#e2e8f0" stroke-width="0.6" />
<text x="54" y="274" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">0</text>
<line x1="60" y1="210.5" x2="430" y2="210.5" stroke="#e2e8f0" stroke-width="0.6" />
<text x="54" y="214.5" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">1</text>
<line x1="60" y1="151" x2="430" y2="151" stroke="#e2e8f0" stroke-width="0.6" />
<text x="54" y="155" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">2</text>
<line x1="60" y1="91.5" x2="430" y2="91.5" stroke="#e2e8f0" stroke-width="0.6" />
<text x="54" y="95.5" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="end">3</text>
<line x1="60" y1="270" x2="430" y2="270" stroke="#94a3b8" stroke-width="1.2" />
<line x1="60" y1="32" x2="60" y2="270" stroke="#94a3b8" stroke-width="1.2" />
<text x="245" y="302" font="13px system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle">t (s)</text>
<text x="24" y="151" font="13px system-ui" font-size="13" font-weight="600" fill="#1a202c" text-anchor="middle" transform="rotate(-90 24 151)">a (m/s²)</text>
<text x="230" y="20" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Acceleration–Time:  a = constant  (UAM)</text>
<line x1="60" y1="151" x2="430" y2="151" stroke="#319795" stroke-width="3.5" />
<text x="245" y="139" font="11px system-ui" font-size="11" fill="#319795" font-weight="600" text-anchor="middle">a = 2 m/s² (constant)</text>
</svg>
