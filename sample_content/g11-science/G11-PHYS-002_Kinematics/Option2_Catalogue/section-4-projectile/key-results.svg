<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" role="img" aria-label="Projectile motion key results">
  <title>Projectile motion key results</title>
  <desc>Three result cards summarising time of flight, range, and maximum height for a level-launch projectile.</desc>
  
  <text x="260" y="24" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Key Results — Projectile Motion (level launch &amp; landing)</text>

  <!-- Three panels -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="155" height="220" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="77" y="26" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">Time of flight</text>
    <text x="77" y="80" font="14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">T = 2 vᵢ sin θ / g</text>
    <text x="77" y="120" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">When the projectile</text>
    <text x="77" y="135" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">lands at launch height.</text>
    <text x="77" y="180" font="12px system-ui" font-size="12" fill="#15803d" font-weight="600" text-anchor="middle">Symmetric:</text>
    <text x="77" y="196" font="11px system-ui" font-size="11" fill="#15803d" text-anchor="middle">t_up = t_down</text>
  </g>

  <g transform="translate(185, 60)">
    <rect x="0" y="0" width="155" height="220" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="77" y="26" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dd6b20" text-anchor="middle">Horizontal range</text>
    <text x="77" y="80" font="14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">R = vᵢ² sin 2θ / g</text>
    <text x="77" y="120" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Maximum range</text>
    <text x="77" y="135" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">at θ = 45°.</text>
    <text x="77" y="180" font="12px system-ui" font-size="12" fill="#15803d" font-weight="600" text-anchor="middle">θ + (90°−θ) give</text>
    <text x="77" y="196" font="11px system-ui" font-size="11" fill="#15803d" text-anchor="middle">the same range.</text>
  </g>

  <g transform="translate(350, 60)">
    <rect x="0" y="0" width="150" height="220" rx="8" fill="#f7fafc" stroke="#e2e8f0" />
    <text x="75" y="26" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#319795" text-anchor="middle">Maximum height</text>
    <text x="75" y="80" font="14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">y_max = vᵢ² sin² θ / 2g</text>
    <text x="75" y="120" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">At t = vᵢ sin θ / g</text>
    <text x="75" y="135" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">(half the time of flight).</text>
    <text x="75" y="180" font="12px system-ui" font-size="12" fill="#15803d" font-weight="600" text-anchor="middle">v_y = 0 at peak,</text>
    <text x="75" y="196" font="11px system-ui" font-size="11" fill="#15803d" text-anchor="middle">v_x is unchanged.</text>
  </g>

</svg>
