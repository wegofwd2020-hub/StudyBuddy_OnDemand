<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Box plot showing the five-number summary of an eleven-value dataset">
  <title>Box Plot: Five-Number Summary</title>
  <desc>Dataset (sorted): 4, 7, 8, 10, 11, 12, 13, 14, 15, 18, 22.  Minimum 4, first quartile Q1 8, median 12, third quartile Q3 15, maximum 22.  Interquartile range Q3 minus Q1 equals 7.  No values lie beyond the 1.5 times IQR fences, so no outliers are drawn.</desc>

  <defs>
    <marker id="ah-bp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <style>
      .axis    { stroke: #4a5568; stroke-width: 1.6; }
      .grid    { stroke: #e2e8f0; stroke-width: 0.6; }
      .panel   { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .box     { fill: #c084fc; fill-opacity: 0.45; stroke: #6b46c1; stroke-width: 2; }
      .median  { stroke: #c53030; stroke-width: 3.2; }
      .whisker { stroke: #4a5568; stroke-width: 2; }
      .cap     { stroke: #4a5568; stroke-width: 2; }
      .pt      { fill: #2d3748; }
      .axislbl { font: 11px system-ui, sans-serif; fill: #4a5568; text-anchor: middle; }
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .lbl     { font: bold 12px system-ui, sans-serif; }
    </style>
  </defs>

  <text class="heading" x="240" y="22">Box plot:  five-number summary  (min, Q₁, median, Q₃, max)</text>

  <!-- Number line: x ∈ [0, 25].  Frame x: 60..460 → 16 px per unit -->
  <rect class="panel" x="60" y="40" width="400" height="220"/>

  <!-- vertical grid lines at every 5 units → 60+16*5=140, 220, 300, 380, 460 -->
  <line class="grid" x1="140" y1="40" x2="140" y2="260"/>
  <line class="grid" x1="220" y1="40" x2="220" y2="260"/>
  <line class="grid" x1="300" y1="40" x2="300" y2="260"/>
  <line class="grid" x1="380" y1="40" x2="380" y2="260"/>

  <!-- Tiny tick marks per unit on the axis line for readability (omitted to keep clean) -->

  <!-- Box: from Q1 = 8 → 60 + 16*8 = 188 to Q3 = 15 → 60 + 16*15 = 300.  Box vertical: y 100..180 -->
  <rect class="box" x="188" y="100" width="112" height="80"/>

  <!-- Median line at x = 12 → 60 + 16*12 = 252 -->
  <line class="median" x1="252" y1="100" x2="252" y2="180"/>

  <!-- Whiskers from box to min/max along centreline y = 140 -->
  <!-- Left whisker: from min = 4 → 60+64 = 124 to Q1 = 188 -->
  <line class="whisker" x1="124" y1="140" x2="188" y2="140"/>
  <!-- Whisker cap at min -->
  <line class="cap" x1="124" y1="116" x2="124" y2="164"/>
  <!-- Right whisker: from Q3 = 300 to max = 22 → 60+352 = 412 -->
  <line class="whisker" x1="300" y1="140" x2="412" y2="140"/>
  <!-- Whisker cap at max -->
  <line class="cap" x1="412" y1="116" x2="412" y2="164"/>

  <!-- Data dot row above the axis (lightly drawn) -->
  <g opacity="0.6">
    <circle class="pt" cx="124" cy="220" r="3"/>
    <circle class="pt" cx="172" cy="220" r="3"/>
    <circle class="pt" cx="188" cy="220" r="3"/>
    <circle class="pt" cx="220" cy="220" r="3"/>
    <circle class="pt" cx="236" cy="220" r="3"/>
    <circle class="pt" cx="252" cy="220" r="3"/>
    <circle class="pt" cx="268" cy="220" r="3"/>
    <circle class="pt" cx="284" cy="220" r="3"/>
    <circle class="pt" cx="300" cy="220" r="3"/>
    <circle class="pt" cx="348" cy="220" r="3"/>
    <circle class="pt" cx="412" cy="220" r="3"/>
  </g>
  <text class="axislbl" x="60" y="226" text-anchor="start">data:</text>

  <!-- Number-line axis -->
  <line class="axis" x1="60" y1="260" x2="464" y2="260" marker-end="url(#ah-bp)"/>

  <!-- Tick labels (every 5 units) -->
  <text class="axislbl" x="60"  y="276">0</text>
  <text class="axislbl" x="140" y="276">5</text>
  <text class="axislbl" x="220" y="276">10</text>
  <text class="axislbl" x="300" y="276">15</text>
  <text class="axislbl" x="380" y="276">20</text>
  <text class="axislbl" x="460" y="276">25</text>
  <text class="axislbl" x="468" y="264">x</text>

  <!-- Five-number-summary callouts -->
  <text class="lbl" x="124" y="92"  fill="#4a5568" text-anchor="middle">min = 4</text>
  <text class="lbl" x="188" y="92"  fill="#6b46c1" text-anchor="middle">Q₁ = 8</text>
  <text class="lbl" x="252" y="92"  fill="#c53030" text-anchor="middle">median = 12</text>
  <text class="lbl" x="300" y="92"  fill="#6b46c1" text-anchor="middle">Q₃ = 15</text>
  <text class="lbl" x="412" y="92"  fill="#4a5568" text-anchor="middle">max = 22</text>

  <!-- IQR bracket: under the box -->
  <line x1="188" y1="194" x2="300" y2="194" stroke="#2b6cb0" stroke-width="1.6"/>
  <line x1="188" y1="190" x2="188" y2="198" stroke="#2b6cb0" stroke-width="1.6"/>
  <line x1="300" y1="190" x2="300" y2="198" stroke="#2b6cb0" stroke-width="1.6"/>
  <text class="axislbl" x="244" y="208" fill="#2b6cb0">IQR = Q₃ − Q₁ = 7</text>

  <!-- Right legend panel -->
  <g transform="translate(480, 46)">
    <rect x="0" y="0" width="150" height="220" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.4"/>
    <text font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" x="75" y="22" text-anchor="middle">Five-number summary</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="44">min   :  4</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="60">Q₁     :  8</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="76">median:  12</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="92">Q₃     :  15</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="108">max   :  22</text>

    <line x1="12" y1="120" x2="138" y2="120" stroke="#cbd5e0"/>

    <text font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" x="12" y="138">Outlier rule</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="154">below  Q₁ − 1.5·IQR</text>
    <text font="11px system-ui" font-size="11" fill="#4a5568" x="12" y="170">above  Q₃ + 1.5·IQR</text>
    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#4a5568" x="12" y="190">fences: −2.5 and 25.5</text>
    <text font="italic 11px system-ui" font-size="11" font-style="italic" fill="#2f855a" x="12" y="206">→ no outliers here</text>
  </g>

  <text x="320" y="304" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">The box covers the middle 50% of the data; whiskers reach the most extreme non-outlier values.</text>
</svg>
