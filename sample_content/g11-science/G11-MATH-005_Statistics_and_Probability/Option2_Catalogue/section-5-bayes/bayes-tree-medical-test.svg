<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Probability tree for a medical test illustrating Bayes' theorem">
  <title>Bayes' Theorem: Medical Test Probability Tree</title>
  <desc>A two-stage tree with first-stage branches Disease (probability 0.01) and No Disease (probability 0.99), each branching to a Positive or Negative test result.  Sensitivity P of positive given Disease is 0.99 and specificity P of negative given No Disease is 0.95.  The four joint probabilities are 0.0099, 0.0001, 0.0495, and 0.9405.  Applying Bayes, P of Disease given Positive equals 0.0099 divided by 0.0099 plus 0.0495 which is approximately one in six, or 16.7 percent.</desc>

  <defs>
    <style>
      .panel   { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .nodeR   { fill: #fefcbf; stroke: #b7791f; stroke-width: 2; }
      .nodeD   { fill: #fed7d7; stroke: #c53030; stroke-width: 2; }
      .nodeND  { fill: #c6f6d5; stroke: #2f855a; stroke-width: 2; }
      .nodeP   { fill: #bee3f8; stroke: #2b6cb0; stroke-width: 1.8; }
      .nodeN   { fill: #e2e8f0; stroke: #4a5568; stroke-width: 1.8; }
      .branch  { stroke: #6b46c1; stroke-width: 1.8; fill: none; }
      .branchHi{ stroke: #c53030; stroke-width: 2.6; fill: none; }
      .lblnode { font: bold 13px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .lblbr   { font: bold 11px system-ui, sans-serif; fill: #6b46c1; }
      .lblbrHi { font: bold 11px system-ui, sans-serif; fill: #c53030; }
      .heading { font: bold 15px system-ui, sans-serif; fill: #1a202c; text-anchor: middle; }
      .joint   { font: 11px system-ui, sans-serif; fill: #1a202c; }
      .formula { font: italic 13px system-ui, sans-serif; fill: #1a202c; }
    </style>
  </defs>

  <text class="heading" x="320" y="22">Bayes' theorem:  rare disease, accurate test → most positives are still false alarms</text>

  <rect class="panel" x="20" y="40" width="600" height="310"/>

  <!-- Root: at (60, 200) -->
  <circle class="nodeR" cx="60" cy="200" r="20"/>
  <text class="lblnode" x="60" y="205">·</text>

  <!-- First stage: Disease (top, y=110) and No Disease (bottom, y=290) at x=210 -->
  <line class="branchHi" x1="80" y1="195" x2="190" y2="115"/>
  <line class="branch"   x1="80" y1="205" x2="190" y2="285"/>

  <text class="lblbrHi" x="100" y="148">P(D) = 0.01</text>
  <text class="lblbr"   x="100" y="252">P(¬D) = 0.99</text>

  <g>
    <rect class="nodeD" x="186" y="92" width="58" height="38" rx="8"/>
    <text class="lblnode" x="215" y="115">D</text>
    <text class="lblnode" x="215" y="129" font-size="9.5" font-weight="400">disease</text>
  </g>
  <g>
    <rect class="nodeND" x="186" y="272" width="58" height="38" rx="8"/>
    <text class="lblnode" x="215" y="295">¬D</text>
    <text class="lblnode" x="215" y="307" font-size="9.5" font-weight="400">no disease</text>
  </g>

  <!-- Second stage from D (215, 111): + at (390, 70), − at (390, 130) -->
  <line class="branchHi" x1="244" y1="106" x2="370" y2="80"/>
  <line class="branch"   x1="244" y1="118" x2="370" y2="130"/>
  <text class="lblbrHi" x="280" y="86">P(+|D) = 0.99</text>
  <text class="lblbr"   x="280" y="138">P(−|D) = 0.01</text>

  <g>
    <rect class="nodeP" x="368" y="60" width="50" height="32" rx="8"/>
    <text class="lblnode" x="393" y="80">+</text>
  </g>
  <g>
    <rect class="nodeN" x="368" y="116" width="50" height="32" rx="8"/>
    <text class="lblnode" x="393" y="136">−</text>
  </g>

  <!-- Joint probabilities for D branches -->
  <g transform="translate(440, 60)">
    <rect x="0" y="0" width="124" height="32" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="1.6"/>
    <text class="joint" x="6" y="14">P(D ∩ +)</text>
    <text class="joint" x="6" y="28" font-weight="700">= 0.01 · 0.99 = 0.0099</text>
  </g>
  <g transform="translate(440, 116)">
    <rect x="0" y="0" width="124" height="32" rx="6" fill="#fffaf0" stroke="#b7791f" stroke-width="1.4"/>
    <text class="joint" x="6" y="14">P(D ∩ −)</text>
    <text class="joint" x="6" y="28">= 0.01 · 0.01 = 0.0001</text>
  </g>

  <!-- Second stage from ¬D (215, 291): + at (390, 250), − at (390, 310) -->
  <line class="branchHi" x1="244" y1="286" x2="370" y2="260"/>
  <line class="branch"   x1="244" y1="298" x2="370" y2="310"/>
  <text class="lblbrHi" x="280" y="266">P(+|¬D) = 0.05</text>
  <text class="lblbr"   x="280" y="318">P(−|¬D) = 0.95</text>

  <g>
    <rect class="nodeP" x="368" y="240" width="50" height="32" rx="8"/>
    <text class="lblnode" x="393" y="260">+</text>
  </g>
  <g>
    <rect class="nodeN" x="368" y="296" width="50" height="32" rx="8"/>
    <text class="lblnode" x="393" y="316">−</text>
  </g>

  <!-- Joint probabilities for ¬D branches -->
  <g transform="translate(440, 240)">
    <rect x="0" y="0" width="124" height="32" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="1.6"/>
    <text class="joint" x="6" y="14">P(¬D ∩ +)</text>
    <text class="joint" x="6" y="28" font-weight="700">= 0.99 · 0.05 = 0.0495</text>
  </g>
  <g transform="translate(440, 296)">
    <rect x="0" y="0" width="124" height="32" rx="6" fill="#fffaf0" stroke="#b7791f" stroke-width="1.4"/>
    <text class="joint" x="6" y="14">P(¬D ∩ −)</text>
    <text class="joint" x="6" y="28">= 0.99 · 0.95 = 0.9405</text>
  </g>

  <!-- Bottom posterior box -->
  <rect x="40" y="248" width="160" height="80" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" x="120" y="266" text-anchor="middle">Posterior:  P(D | +)</text>
  <text class="formula" x="50" y="286">= P(D ∩ +) / P(+)</text>
  <text class="formula" x="50" y="304">= 0.0099 / 0.0594</text>
  <text class="formula" x="120" y="322" font-weight="700" fill="#c53030" text-anchor="middle">≈ 0.167  (≈ 1 in 6)</text>

  <text x="320" y="370" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">Even with a 99 % accurate test, a positive result on a 1 % rare disease leaves only a ~17 % chance the patient actually has it.</text>
</svg>
