<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="LEO the lion goes GER mnemonic and OIL RIG mnemonic">
  <title>LEO the lion goes GER (and OIL RIG)</title>
  <desc>Two equivalent mnemonics for remembering oxidation versus reduction. LEO = Lose Electrons Oxidation; GER = Gain Electrons Reduction. OIL = Oxidation Is Loss; RIG = Reduction Is Gain.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Mnemonics — Which is Which?</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Two ways to remember the same fact. Pick whichever sticks.</text>

  <!-- LEO the lion panel -->
  <rect x="40" y="60" width="320" height="220" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="200" y="84" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">LEO the lion goes GER</text>

  <!-- Lion stick figure -->
  <circle cx="120" cy="148" r="28" fill="#f59e0b" stroke="#92400e" stroke-width="2" />
  <!-- mane -->
  <g stroke="#92400e" stroke-width="2" fill="none">
    <line x1="92" y1="135" x2="84" y2="125" />
    <line x1="92" y1="148" x2="80" y2="148" />
    <line x1="92" y1="162" x2="84" y2="172" />
    <line x1="148" y1="135" x2="156" y2="125" />
    <line x1="148" y1="148" x2="160" y2="148" />
    <line x1="148" y1="162" x2="156" y2="172" />
    <line x1="120" y1="120" x2="120" y2="110" />
  </g>
  <!-- eyes -->
  <circle cx="111" cy="146" r="2.5" fill="#0f172a" />
  <circle cx="129" cy="146" r="2.5" fill="#0f172a" />
  <!-- mouth -->
  <path d="M 110 158 Q 120 164 130 158" fill="none" stroke="#0f172a" stroke-width="1.5" />

  <!-- Speech bubble -->
  <path d="M 165 110 Q 175 100 195 100 L 320 100 Q 340 100 340 120 L 340 200 Q 340 220 320 220 L 195 220 Q 175 220 175 200 L 175 175 L 165 200 Z" fill="#ffffff" stroke="#92400e" stroke-width="1.5" />

  <text x="195" y="130" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626">L</text>
  <text x="210" y="130" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c">ose</text>
  <text x="195" y="148" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626">E</text>
  <text x="210" y="148" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c">lectrons →</text>
  <text x="195" y="166" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626">O</text>
  <text x="210" y="166" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c">xidation</text>

  <line x1="190" y1="174" x2="320" y2="174" stroke="#cbd5e1" stroke-width="0.7" />

  <text x="195" y="194" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d">G</text>
  <text x="210" y="194" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c">ain</text>
  <text x="195" y="212" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d">E</text>
  <text x="210" y="212" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c">lectrons →</text>
  <text x="245" y="212" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d">R</text>
  <text x="258" y="212" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c">eduction</text>

  <!-- OIL RIG panel -->
  <rect x="380" y="60" width="300" height="220" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2" />
  <text x="530" y="84" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">OIL RIG</text>

  <!-- Oil rig icon -->
  <g stroke="#1e3a8a" stroke-width="2" fill="none">
    <line x1="430" y1="220" x2="490" y2="220" />
    <line x1="440" y1="220" x2="460" y2="120" />
    <line x1="480" y1="220" x2="460" y2="120" />
    <line x1="445" y1="190" x2="475" y2="190" />
    <line x1="450" y1="160" x2="470" y2="160" />
    <line x1="460" y1="120" x2="460" y2="100" />
    <circle cx="460" cy="98" r="4" fill="#dc2626" stroke="#1e3a8a" />
  </g>

  <!-- OIL RIG text -->
  <text x="510" y="120" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#dc2626">O</text>
  <text x="525" y="120" font="bold 15px system-ui" font-size="15" font-weight="700" fill="#1a202c">xidation</text>
  <text x="510" y="142" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#dc2626">I</text>
  <text x="525" y="142" font="bold 15px system-ui" font-size="15" font-weight="700" fill="#1a202c">s</text>
  <text x="510" y="164" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#dc2626">L</text>
  <text x="525" y="164" font="bold 15px system-ui" font-size="15" font-weight="700" fill="#1a202c">oss (of e⁻)</text>

  <line x1="505" y1="174" x2="660" y2="174" stroke="#94a3b8" stroke-width="0.7" />

  <text x="510" y="196" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#15803d">R</text>
  <text x="525" y="196" font="bold 15px system-ui" font-size="15" font-weight="700" fill="#1a202c">eduction</text>
  <text x="510" y="218" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#15803d">I</text>
  <text x="525" y="218" font="bold 15px system-ui" font-size="15" font-weight="700" fill="#1a202c">s</text>
  <text x="510" y="240" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#15803d">G</text>
  <text x="525" y="240" font="bold 15px system-ui" font-size="15" font-weight="700" fill="#1a202c">ain (of e⁻)</text>

  <!-- Bottom caption -->
  <text x="360" y="304" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">"Reduction" sounds like the species' charge goes down — because the electron pile-up makes the oxidation state more negative.</text>
</svg>
