<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Rules for assigning oxidation states">
  <title>Rules for assigning oxidation states</title>
  <desc>An ordered list of seven priority rules for assigning oxidation numbers in a compound, with a worked example assigning oxidation states in KMnO4.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Assigning Oxidation States — Priority Rules</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Walk down the list. The first rule that applies wins; the last species inherits whatever balance is left.</text>

  <!-- Rules table -->
  <rect x="30" y="60" width="430" height="320" rx="8" fill="#f7fafc" stroke="#1a202c" stroke-width="1.5" />

  <!-- Header row -->
  <rect x="30" y="60" width="430" height="28" rx="8" fill="#1e3a8a" />
  <text x="50" y="79" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#ffffff">#</text>
  <text x="90" y="79" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#ffffff">Rule</text>
  <text x="370" y="79" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#ffffff">Value</text>

  <!-- Row 1 -->
  <text x="50" y="108" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a">1</text>
  <text x="90" y="108" font="11px system-ui" font-size="11" fill="#1a202c">Free element (Fe, O₂, H₂, S₈)</text>
  <text x="370" y="108" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d">0</text>
  <line x1="30" y1="118" x2="460" y2="118" stroke="#cbd5e1" stroke-width="0.7" />

  <!-- Row 2 -->
  <text x="50" y="138" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a">2</text>
  <text x="90" y="138" font="11px system-ui" font-size="11" fill="#1a202c">Monatomic ion</text>
  <text x="370" y="138" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d">= ion charge</text>
  <line x1="30" y1="148" x2="460" y2="148" stroke="#cbd5e1" stroke-width="0.7" />

  <!-- Row 3 -->
  <text x="50" y="168" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a">3</text>
  <text x="90" y="168" font="11px system-ui" font-size="11" fill="#1a202c">Group 1 metal in compound</text>
  <text x="370" y="168" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d">+1</text>
  <line x1="30" y1="178" x2="460" y2="178" stroke="#cbd5e1" stroke-width="0.7" />

  <!-- Row 4 -->
  <text x="50" y="198" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a">4</text>
  <text x="90" y="198" font="11px system-ui" font-size="11" fill="#1a202c">Group 2 metal in compound</text>
  <text x="370" y="198" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d">+2</text>
  <line x1="30" y1="208" x2="460" y2="208" stroke="#cbd5e1" stroke-width="0.7" />

  <!-- Row 5 -->
  <text x="50" y="228" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a">5</text>
  <text x="90" y="228" font="11px system-ui" font-size="11" fill="#1a202c">Fluorine in any compound</text>
  <text x="370" y="228" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d">−1</text>
  <line x1="30" y1="238" x2="460" y2="238" stroke="#cbd5e1" stroke-width="0.7" />

  <!-- Row 6 -->
  <text x="50" y="258" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a">6</text>
  <text x="90" y="258" font="11px system-ui" font-size="11" fill="#1a202c">H with non-metal</text>
  <text x="370" y="258" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d">+1</text>
  <text x="90" y="272" font="10px system-ui" font-size="10" fill="#dc2626">  H with metal (NaH, CaH₂)</text>
  <text x="370" y="272" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626">−1</text>
  <line x1="30" y1="282" x2="460" y2="282" stroke="#cbd5e1" stroke-width="0.7" />

  <!-- Row 7 -->
  <text x="50" y="302" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a">7</text>
  <text x="90" y="302" font="11px system-ui" font-size="11" fill="#1a202c">O usually</text>
  <text x="370" y="302" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d">−2</text>
  <text x="90" y="316" font="10px system-ui" font-size="10" fill="#dc2626">  in peroxides (H₂O₂)</text>
  <text x="370" y="316" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626">−1</text>
  <text x="90" y="330" font="10px system-ui" font-size="10" fill="#dc2626">  bonded to F (OF₂)</text>
  <text x="370" y="330" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626">+2</text>
  <line x1="30" y1="340" x2="460" y2="340" stroke="#cbd5e1" stroke-width="0.7" />

  <!-- Row 8 -->
  <text x="50" y="360" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a">8</text>
  <text x="90" y="360" font="11px system-ui" font-size="11" fill="#1a202c">Sum across compound</text>
  <text x="370" y="360" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d">= 0 (neutral)</text>
  <text x="90" y="374" font="10px system-ui" font-size="10" fill="#1a202c">Sum across polyatomic ion</text>
  <text x="370" y="374" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#15803d">= ion charge</text>

  <!-- Worked example: KMnO4 -->
  <rect x="480" y="60" width="220" height="320" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="590" y="82" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Worked: KMnO₄</text>

  <text x="500" y="110" font="11px system-ui" font-size="11" fill="#1a202c">Rule 3: K = +1</text>
  <text x="500" y="130" font="11px system-ui" font-size="11" fill="#1a202c">Rule 7: O = −2 (×4 = −8)</text>
  <text x="500" y="150" font="11px system-ui" font-size="11" fill="#1a202c">Rule 8: total = 0</text>

  <line x1="495" y1="160" x2="685" y2="160" stroke="#92400e" stroke-width="1" stroke-dasharray="3 3" />

  <text x="500" y="180" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c">(+1) + Mn + (−8) = 0</text>
  <text x="500" y="200" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626">Mn = +7</text>

  <line x1="495" y1="215" x2="685" y2="215" stroke="#92400e" stroke-width="1" stroke-dasharray="3 3" />

  <text x="500" y="236" font="11px system-ui" font-size="11" fill="#1a202c">Mn ranges 0 to +7;</text>
  <text x="500" y="252" font="11px system-ui" font-size="11" fill="#1a202c">+7 is its max — this is</text>
  <text x="500" y="268" font="11px system-ui" font-size="11" fill="#1a202c">why MnO₄⁻ is a strong</text>
  <text x="500" y="284" font="11px system-ui" font-size="11" fill="#1a202c">oxidising agent: Mn is</text>
  <text x="500" y="300" font="11px system-ui" font-size="11" fill="#1a202c">eager to gain electrons</text>
  <text x="500" y="316" font="11px system-ui" font-size="11" fill="#1a202c">(reduce to Mn²⁺ in acid).</text>

  <text x="590" y="350" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">+7 → +2  is a 5-electron drop</text>
  <text x="590" y="368" font="10px system-ui" font-size="10" fill="#92400e" text-anchor="middle">(used in the Section 2 example)</text>

  <!-- Bottom caption -->
  <text x="360" y="402" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Oxidation state is a bookkeeping device. Use it to spot which atoms gained or lost electron control.</text>
</svg>
