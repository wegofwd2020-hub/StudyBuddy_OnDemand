<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Cell voltage calculation E cell equals E cathode minus E anode">
  <title>Cell voltage — E°cell = E°cathode − E°anode</title>
  <desc>The formula for standard cell potential and a worked example for the Daniell cell. Both half-reaction potentials are looked up as reductions; the anode value is subtracted because that half-cell actually runs in the oxidation direction. A positive E cell means the reaction is spontaneous.</desc>

  <text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Cell Voltage — Combine the Half-Cells</text>
  <text x="360" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Always look up both potentials as reductions. The anode is the half-cell with the smaller (more negative) E°.</text>

  <!-- Master formula box -->
  <rect x="60" y="60" width="600" height="60" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="2" />
  <text x="360" y="98" font="bold 22px system-ui" font-size="22" font-weight="700" fill="#fef3c7" text-anchor="middle">E°cell  =  E°cathode  −  E°anode</text>

  <!-- Daniell example title -->
  <text x="60" y="146" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1e3a8a">Worked: Daniell cell — Zn(s) | Zn²⁺(1 M) ‖ Cu²⁺(1 M) | Cu(s)</text>

  <!-- Two boxes side by side: cathode + anode -->
  <rect x="60" y="160" width="280" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="200" y="180" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Cathode (reduction)</text>
  <text x="74" y="204" font="12px monospace" font-size="12" fill="#1a202c">Cu²⁺(aq) + 2 e⁻ → Cu(s)</text>
  <text x="200" y="232" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle">E°cathode = +0.34 V</text>
  <text x="200" y="262" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">looked up directly as written.</text>

  <rect x="380" y="160" width="280" height="120" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5" />
  <text x="520" y="180" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Anode (oxidation, but look up as reduction)</text>
  <text x="394" y="204" font="12px monospace" font-size="12" fill="#1a202c">Zn²⁺(aq) + 2 e⁻ → Zn(s)</text>
  <text x="520" y="232" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">E°anode = −0.76 V</text>
  <text x="520" y="262" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">don't flip the sign — subtract instead.</text>

  <!-- Calculation step -->
  <rect x="60" y="296" width="600" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="360" y="322" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">E°cell = (+0.34 V) − (−0.76 V) = +1.10 V    →   spontaneous (E° &gt; 0)</text>

  <!-- Bottom caption -->
  <text x="360" y="354" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Sign rule: E° &gt; 0 means ΔG° &lt; 0. This is the working voltage of a fresh Daniell cell at standard conditions.</text>
</svg>
