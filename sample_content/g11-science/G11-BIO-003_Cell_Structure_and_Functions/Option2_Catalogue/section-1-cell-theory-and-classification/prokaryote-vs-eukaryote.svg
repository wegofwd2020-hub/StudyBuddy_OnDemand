<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" role="img" aria-label="Prokaryotic versus eukaryotic cell side-by-side comparison">
  <title>Prokaryotic vs Eukaryotic — Two Cell Plans</title>
  <desc>Side-by-side labelled comparison of a typical prokaryotic cell (a bacterium, e.g. E. coli) on the left and a typical eukaryotic cell (an animal cell) on the right. Shared features (plasma membrane, ribosomes, cytoplasm, DNA) appear in both. Differences highlighted: prokaryotes lack a true nucleus and membrane-bound organelles; their DNA forms a circular nucleoid plus optional plasmids; ribosomes are 70S; size is roughly 1–5 μm. Eukaryotes have a true membrane-bound nucleus, an extensive endomembrane system (ER, Golgi), mitochondria, lysosomes, 80S ribosomes, and reach 10–100 μm. A comparison table along the bottom summarises seven traits.</desc>

  <text x="410" y="24" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Two Cell Plans — Prokaryotic vs Eukaryotic</text>
  <text x="410" y="42" font-size="11" fill="#4a5568" text-anchor="middle">Same four essentials (membrane · cytoplasm · ribosomes · DNA). Different organisation.</text>

  <!-- ── LEFT: Prokaryote (bacterium) ───────────────────────────── -->
  <text x="200" y="68" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">PROKARYOTIC CELL — bacterium (e.g. E. coli)</text>
  <text x="200" y="84" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">~1–5 μm · no nucleus · no membrane-bound organelles</text>

  <!-- Capsule (outermost) -->
  <ellipse cx="200" cy="190" rx="170" ry="92" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Cell wall -->
  <ellipse cx="200" cy="190" rx="158" ry="84" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <!-- Plasma membrane -->
  <ellipse cx="200" cy="190" rx="148" ry="76" fill="#faf5ff" stroke="#5b21b6" stroke-width="2"/>
  <!-- Cytoplasm fill (already implied) -->

  <!-- Nucleoid (circular DNA, irregular blob) -->
  <path d="M 160 170 Q 140 160 145 180 Q 135 200 165 210 Q 200 220 230 200 Q 250 180 230 165 Q 210 155 195 170 Q 180 162 160 170 Z"
        fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="200" y="190" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">nucleoid</text>
  <text x="200" y="204" font-size="9" fill="#4a5568" text-anchor="middle">(no envelope)</text>

  <!-- Plasmids -->
  <ellipse cx="120" cy="160" rx="10" ry="6" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <ellipse cx="278" cy="222" rx="11" ry="7" fill="none" stroke="#b45309" stroke-width="1.6"/>

  <!-- Ribosomes (70S, smaller dots) -->
  <g fill="#dc2626">
    <circle cx="100" cy="200" r="3"/>
    <circle cx="118" cy="220" r="3"/>
    <circle cx="140" cy="230" r="3"/>
    <circle cx="260" cy="160" r="3"/>
    <circle cx="285" cy="180" r="3"/>
    <circle cx="240" cy="148" r="3"/>
    <circle cx="115" cy="140" r="3"/>
    <circle cx="170" cy="148" r="3"/>
    <circle cx="295" cy="200" r="3"/>
    <circle cx="155" cy="225" r="3"/>
  </g>

  <!-- Flagellum -->
  <path d="M 360 195 Q 380 180 392 200 Q 405 220 420 200 Q 432 180 446 200" fill="none" stroke="#5b21b6" stroke-width="2.5"/>
  <!-- Pili -->
  <line x1="60" y1="160" x2="44" y2="148" stroke="#7c3aed" stroke-width="1.4"/>
  <line x1="58" y1="180" x2="40" y2="178" stroke="#7c3aed" stroke-width="1.4"/>
  <line x1="62" y1="220" x2="46" y2="234" stroke="#7c3aed" stroke-width="1.4"/>

  <!-- Labels (left, with leader lines) -->
  <line x1="56" y1="140" x2="20" y2="116" stroke="#7c3aed" stroke-width="1"/>
  <text x="20" y="110" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="start">pilus</text>

  <line x1="42" y1="190" x2="14" y2="190" stroke="#7c3aed" stroke-width="1"/>
  <text x="14" y="194" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="end">capsule</text>

  <line x1="80" y1="240" x2="44" y2="276" stroke="#7c3aed" stroke-width="1"/>
  <text x="44" y="290" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="start">cell wall</text>

  <line x1="110" y1="195" x2="36" y2="296" stroke="#7c3aed" stroke-width="1"/>
  <text x="76" y="296" font-size="10" font-weight="700" fill="#dc2626" text-anchor="start">ribosomes (70S)</text>

  <!-- Labels (right) -->
  <line x1="118" y1="158" x2="118" y2="118" stroke="#b45309" stroke-width="1"/>
  <text x="118" y="112" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">plasmid</text>

  <line x1="220" y1="200" x2="294" y2="118" stroke="#7c3aed" stroke-width="1"/>
  <text x="298" y="112" font-size="10" font-weight="700" fill="#5b21b6">circular DNA (nucleoid)</text>

  <line x1="370" y1="190" x2="368" y2="252" stroke="#7c3aed" stroke-width="1"/>
  <text x="380" y="266" font-size="10" font-weight="700" fill="#5b21b6">flagellum</text>

  <line x1="265" y1="220" x2="312" y2="266" stroke="#7c3aed" stroke-width="1"/>
  <text x="316" y="280" font-size="10" font-weight="700" fill="#5b21b6">plasma membrane</text>


  <!-- ── DIVIDER ─────────────────────────────────────────────── -->
  <line x1="410" y1="60" x2="410" y2="296" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="4 4"/>


  <!-- ── RIGHT: Eukaryote (animal cell) ─────────────────────── -->
  <text x="620" y="68" font-size="14" font-weight="700" fill="#2b6cb0" text-anchor="middle">EUKARYOTIC CELL — animal</text>
  <text x="620" y="84" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">~10–100 μm · membrane-bound nucleus + organelles</text>

  <!-- Plasma membrane -->
  <ellipse cx="620" cy="190" rx="170" ry="92" fill="#f0f9ff" stroke="#2b6cb0" stroke-width="2.5"/>

  <!-- Nucleus -->
  <circle cx="600" cy="180" r="44" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.4"/>
  <circle cx="600" cy="180" r="40" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="600" cy="180" r="14" fill="#2b6cb0" opacity="0.4"/>
  <text x="600" y="184" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">nucleus</text>
  <!-- Nuclear pores -->
  <circle cx="556" cy="180" r="2" fill="#1e3a8a"/>
  <circle cx="644" cy="180" r="2" fill="#1e3a8a"/>
  <circle cx="600" cy="136" r="2" fill="#1e3a8a"/>
  <circle cx="600" cy="224" r="2" fill="#1e3a8a"/>

  <!-- Mitochondrion -->
  <g transform="translate(700, 150)">
    <ellipse cx="0" cy="0" rx="32" ry="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <path d="M -24 0 Q -20 -8 -14 0 Q -8 8 -2 0 Q 4 -8 10 0 Q 16 8 22 0" fill="none" stroke="#dc2626" stroke-width="1.4"/>
  </g>
  <text x="700" y="134" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">mitochondrion</text>

  <!-- Rough ER (with ribosomes as dots) -->
  <path d="M 540 130 Q 560 124 564 142 Q 552 152 540 148 Q 526 144 540 130 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <circle cx="544" cy="130" r="1.8" fill="#dc2626"/>
  <circle cx="552" cy="126" r="1.8" fill="#dc2626"/>
  <circle cx="560" cy="132" r="1.8" fill="#dc2626"/>
  <circle cx="546" cy="148" r="1.8" fill="#dc2626"/>
  <circle cx="556" cy="148" r="1.8" fill="#dc2626"/>
  <text x="514" y="118" font-size="9" font-weight="700" fill="#b45309" text-anchor="end">rough ER</text>
  <line x1="518" y1="120" x2="540" y2="134" stroke="#b45309" stroke-width="1"/>

  <!-- Smooth ER -->
  <path d="M 564 222 Q 580 230 580 244 Q 568 252 558 244 Q 552 234 564 222 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="540" y="262" font-size="9" font-weight="700" fill="#b45309">smooth ER</text>

  <!-- Golgi apparatus (stack) -->
  <g transform="translate(560, 240)">
    <path d="M -22 0 Q 0 -8 22 0" fill="none" stroke="#15803d" stroke-width="2"/>
    <path d="M -22 6 Q 0 -2 22 6" fill="none" stroke="#15803d" stroke-width="2"/>
    <path d="M -22 12 Q 0 4 22 12" fill="none" stroke="#15803d" stroke-width="2"/>
    <path d="M -22 18 Q 0 10 22 18" fill="none" stroke="#15803d" stroke-width="2"/>
    <circle cx="-30" cy="6" r="3" fill="#15803d"/>
    <circle cx="30" cy="14" r="3" fill="#15803d"/>
  </g>
  <text x="560" y="270" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">Golgi</text>

  <!-- Lysosomes -->
  <circle cx="680" cy="220" r="9" fill="#fed7aa" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="680" cy="220" r="2" fill="#b45309"/>
  <text x="700" y="234" font-size="9" font-weight="700" fill="#b45309">lysosome</text>

  <!-- Free ribosomes -->
  <g fill="#dc2626">
    <circle cx="540" cy="200" r="2.8"/>
    <circle cx="556" cy="208" r="2.8"/>
    <circle cx="668" cy="184" r="2.8"/>
    <circle cx="654" cy="156" r="2.8"/>
    <circle cx="500" cy="184" r="2.8"/>
    <circle cx="510" cy="220" r="2.8"/>
    <circle cx="734" cy="178" r="2.8"/>
    <circle cx="738" cy="212" r="2.8"/>
  </g>
  <text x="500" y="248" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">ribosomes (80S)</text>

  <!-- Cytoskeleton hint -->
  <line x1="490" y1="160" x2="540" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <line x1="744" y1="200" x2="704" y2="186" stroke="#94a3b8" stroke-width="1"/>

  <!-- Nucleolus label -->
  <line x1="600" y1="180" x2="540" y2="100" stroke="#1e3a8a" stroke-width="1"/>
  <text x="540" y="96" font-size="9" font-weight="700" fill="#1e3a8a" text-anchor="end">nucleolus inside nucleus</text>

  <!-- Plasma membrane label -->
  <line x1="788" y1="190" x2="804" y2="190" stroke="#2b6cb0" stroke-width="1"/>
  <text x="788" y="262" font-size="9" font-weight="700" fill="#2b6cb0" text-anchor="end">plasma membrane</text>

  <!-- ── COMPARISON TABLE ────────────────────────────────────── -->
  <text x="410" y="320" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Side-by-Side</text>

  <!-- Header -->
  <rect x="40" y="332" width="240" height="22" fill="#f7fafc" stroke="#4a5568" stroke-width="1"/>
  <rect x="280" y="332" width="240" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <rect x="520" y="332" width="240" height="22" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1"/>
  <text x="160" y="348" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Feature</text>
  <text x="400" y="348" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">Prokaryote</text>
  <text x="640" y="348" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Eukaryote</text>

  <!-- Rows: 7 rows × 16px height -->
  <g font-size="10" fill="#1a202c">
    <rect x="40"  y="354" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="280" y="354" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="520" y="354" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <text x="50" y="367">Size</text>
    <text x="290" y="367">~1–5 μm</text>
    <text x="530" y="367">~10–100 μm (10–100× larger)</text>

    <rect x="40"  y="372" width="240" height="18" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="280" y="372" width="240" height="18" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="520" y="372" width="240" height="18" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.6"/>
    <text x="50" y="385">Nucleus</text>
    <text x="290" y="385">absent — nucleoid (free DNA)</text>
    <text x="530" y="385">true membrane-bound nucleus</text>

    <rect x="40"  y="390" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="280" y="390" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="520" y="390" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <text x="50" y="403">DNA shape</text>
    <text x="290" y="403">single circular chromosome + plasmids</text>
    <text x="530" y="403">multiple linear chromosomes</text>

    <rect x="40"  y="408" width="240" height="18" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="280" y="408" width="240" height="18" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="520" y="408" width="240" height="18" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.6"/>
    <text x="50" y="421">Membrane organelles</text>
    <text x="290" y="421">none (no ER · Golgi · mito · lyso)</text>
    <text x="530" y="421">ER · Golgi · mitochondria · lysosomes</text>

    <rect x="40"  y="426" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="280" y="426" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="520" y="426" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <text x="50" y="439">Ribosomes</text>
    <text x="290" y="439">70S (smaller)</text>
    <text x="530" y="439">80S (cytoplasm) · 70S (in mito)</text>

    <rect x="40"  y="444" width="240" height="18" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="280" y="444" width="240" height="18" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="520" y="444" width="240" height="18" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.6"/>
    <text x="50" y="457">Cell wall</text>
    <text x="290" y="457">peptidoglycan (bacteria)</text>
    <text x="530" y="457">cellulose (plants) · chitin (fungi) · none (animal)</text>

    <rect x="40"  y="462" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="280" y="462" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <rect x="520" y="462" width="240" height="18" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
    <text x="50" y="475">Examples</text>
    <text x="290" y="475">E. coli · Streptococcus · cyanobacteria</text>
    <text x="530" y="475">amoeba · Paramecium · plants · animals · fungi</text>
  </g>
</svg>
