<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Binomial name anatomy">
  <title>Binomial name anatomy — Homo sapiens</title>
  <desc>The scientific name "Homo sapiens" is dissected into its two parts: Homo (genus, capitalised, italic) and sapiens (specific epithet, lowercase, italic). Annotations call out the rules: italics, capitalisation pattern, Latinised endings, and the genus author abbreviation (Linnaeus, 1758).</desc>

  <text x="300" y="24" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Anatomy of a Scientific Name</text>
  <text x="300" y="42" font-size="11" fill="#4a5568" text-anchor="middle">Every species has a unique two-word Latin name. The format itself encodes information.</text>

  <!-- The name big and centred -->
  <text x="300" y="140" font-size="64" font-weight="700" font-style="italic" fill="#1a202c" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Homo sapiens</text>

  <!-- Genus brace + label -->
  <line x1="172" y1="156" x2="172" y2="172" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="172" y1="172" x2="290" y2="172" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="290" y1="156" x2="290" y2="172" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="231" y1="172" x2="231" y2="190" stroke="#2b6cb0" stroke-width="2"/>
  <text x="231" y="208" font-size="13" font-weight="700" fill="#2b6cb0" text-anchor="middle">GENUS</text>
  <text x="231" y="226" font-size="11" fill="#4a5568" text-anchor="middle">capitalised · italicised</text>
  <text x="231" y="240" font-size="11" fill="#4a5568" text-anchor="middle">noun</text>

  <!-- Species brace + label -->
  <line x1="298" y1="156" x2="298" y2="172" stroke="#dc2626" stroke-width="2"/>
  <line x1="298" y1="172" x2="430" y2="172" stroke="#dc2626" stroke-width="2"/>
  <line x1="430" y1="156" x2="430" y2="172" stroke="#dc2626" stroke-width="2"/>
  <line x1="364" y1="172" x2="364" y2="190" stroke="#dc2626" stroke-width="2"/>
  <text x="364" y="208" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">SPECIFIC EPITHET</text>
  <text x="364" y="226" font-size="11" fill="#4a5568" text-anchor="middle">lowercase · italicised</text>
  <text x="364" y="240" font-size="11" fill="#4a5568" text-anchor="middle">adjective</text>

  <!-- Side annotations -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="250" height="46" rx="6" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="10" y="18" font-size="11" font-weight="700" fill="#1e3a8a">Genus = Homo</text>
    <text x="10" y="34" font-size="10" fill="#4a5568">Latin "human" — shared with</text>
    <text x="10" y="46" font-size="10" fill="#4a5568">extinct relatives e.g. </text>
    <text x="120" y="46" font-size="10" font-style="italic" fill="#4a5568">H. erectus, H. habilis</text>
  </g>

  <g transform="translate(310, 260)">
    <rect x="0" y="0" width="250" height="46" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="10" y="18" font-size="11" font-weight="700" fill="#7f1d1d">Specific epithet = sapiens</text>
    <text x="10" y="34" font-size="10" fill="#4a5568">Latin "wise" — never used alone;</text>
    <text x="10" y="46" font-size="10" fill="#4a5568">always after the genus.</text>
  </g>

  <!-- Author note -->
  <text x="300" y="295" font-size="10" fill="#4a5568" text-anchor="middle" font-style="italic">Full citation: Homo sapiens Linnaeus, 1758  — author + year are added in formal taxonomic use.</text>
</svg>
