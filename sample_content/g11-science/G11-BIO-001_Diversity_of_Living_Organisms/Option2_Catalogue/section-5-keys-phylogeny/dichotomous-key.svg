<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Dichotomous key example">
  <title>Dichotomous key — identifying five backyard organisms</title>
  <desc>A branching dichotomous key. At each node, the user chooses between two contrasting characteristics. Path 1 (yes/no on photosynthetic) splits autotrophs from heterotrophs; subsequent nodes ask about cell wall, body symmetry, and locomotion. Five organisms are reached as terminal leaves: Rose plant, Mushroom, Earthworm, Pigeon, and Cat.</desc>

  <text x="380" y="22" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Dichotomous Key — Five Organisms</text>
  <text x="380" y="40" font-size="11" fill="#4a5568" text-anchor="middle">At every node, pick yes or no. The path leads to one species.</text>

  <!-- ── Q1 ──────────────────────────────────────────── -->
  <g transform="translate(280, 60)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#f7fafc" stroke="#1a202c" stroke-width="2"/>
    <text x="100" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">1. Photosynthetic?</text>
    <text x="100" y="40" font-size="10" fill="#4a5568" text-anchor="middle">does the organism make its own food?</text>
  </g>

  <!-- Q1 branches -->
  <line x1="320" y1="110" x2="160" y2="150" stroke="#15803d" stroke-width="2"/>
  <text x="220" y="128" font-size="11" font-weight="700" fill="#15803d">YES →</text>
  <line x1="440" y1="110" x2="600" y2="150" stroke="#dc2626" stroke-width="2"/>
  <text x="510" y="128" font-size="11" font-weight="700" fill="#dc2626">NO →</text>

  <!-- ── Q2 left: Plantae result ─────────────────────── -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="160" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="80" y="20" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Plantae</text>
    <text x="80" y="36" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">Rosa indica  (rose)</text>
  </g>

  <!-- ── Q2 right ─────────────────────────────────────── -->
  <g transform="translate(520, 150)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#f7fafc" stroke="#1a202c" stroke-width="2"/>
    <text x="100" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">2. Has cell wall?</text>
    <text x="100" y="40" font-size="10" fill="#4a5568" text-anchor="middle">chitin in this case</text>
  </g>

  <!-- Q2 branches -->
  <line x1="560" y1="200" x2="450" y2="240" stroke="#b45309" stroke-width="2"/>
  <text x="490" y="218" font-size="11" font-weight="700" fill="#b45309">YES →</text>
  <line x1="680" y1="200" x2="680" y2="240" stroke="#dc2626" stroke-width="2"/>
  <text x="688" y="225" font-size="11" font-weight="700" fill="#dc2626">NO ↓</text>

  <!-- Fungi result -->
  <g transform="translate(370, 240)">
    <rect x="0" y="0" width="160" height="44" rx="8" fill="#fed7aa" stroke="#b45309" stroke-width="2"/>
    <text x="80" y="20" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Fungi</text>
    <text x="80" y="36" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">Agaricus bisporus  (mushroom)</text>
  </g>

  <!-- ── Q3 ──────────────────────────────────────────── -->
  <g transform="translate(580, 240)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#f7fafc" stroke="#1a202c" stroke-width="2"/>
    <text x="80" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">3. Has a backbone?</text>
    <text x="80" y="40" font-size="10" fill="#4a5568" text-anchor="middle">vertebrate vs invertebrate</text>
  </g>

  <!-- Q3 branches -->
  <line x1="610" y1="290" x2="450" y2="330" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="308" font-size="11" font-weight="700" fill="#dc2626">NO →</text>
  <line x1="700" y1="290" x2="700" y2="330" stroke="#2b6cb0" stroke-width="2"/>
  <text x="708" y="315" font-size="11" font-weight="700" fill="#2b6cb0">YES ↓</text>

  <!-- Invertebrate result (earthworm) -->
  <g transform="translate(370, 330)">
    <rect x="0" y="0" width="160" height="44" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <text x="80" y="20" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="middle">Animalia (Annelida)</text>
    <text x="80" y="36" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">Lumbricus terrestris</text>
  </g>

  <!-- ── Q4 ──────────────────────────────────────────── -->
  <g transform="translate(580, 330)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#f7fafc" stroke="#1a202c" stroke-width="2"/>
    <text x="80" y="22" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">4. Has feathers?</text>
    <text x="80" y="40" font-size="10" fill="#4a5568" text-anchor="middle">birds vs other vertebrates</text>
  </g>

  <!-- Q4 branches -->
  <line x1="620" y1="380" x2="540" y2="408" stroke="#319795" stroke-width="2"/>
  <text x="560" y="396" font-size="11" font-weight="700" fill="#319795">YES →</text>
  <line x1="700" y1="380" x2="700" y2="408" stroke="#dc2626" stroke-width="2"/>
  <text x="708" y="402" font-size="11" font-weight="700" fill="#dc2626">NO ↓</text>

  <!-- Bird result -->
  <g transform="translate(380, 386)">
    <rect x="0" y="0" width="160" height="30" rx="8" fill="#ccfbf1" stroke="#319795" stroke-width="2"/>
    <text x="80" y="20" font-size="10" font-weight="700" fill="#319795" text-anchor="middle">Aves — </text>
    <text x="120" y="20" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">Columba livia</text>
  </g>

  <!-- Mammal result (cat) - to right of Q4 -->
  <g transform="translate(620, 386)">
    <rect x="0" y="0" width="160" height="30" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="80" y="20" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Mammalia — </text>
    <text x="125" y="20" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">Felis catus</text>
  </g>

  <text x="380" y="416" font-size="10" fill="#4a5568" text-anchor="middle" font-style="italic" opacity="0.0">spacer</text>
</svg>
