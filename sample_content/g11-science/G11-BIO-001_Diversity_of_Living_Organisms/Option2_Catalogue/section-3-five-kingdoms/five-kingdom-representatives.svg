<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="One representative organism per kingdom">
  <title>One representative organism per kingdom</title>
  <desc>Five simple stylised illustrations, one per kingdom: a rod-shaped bacterium for Monera, an Amoeba with pseudopodia for Protista, a mushroom for Fungi, a flowering plant for Plantae, and a fish for Animalia. Each is colour-keyed to the comparison chart.</desc>

  <text x="380" y="22" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">One Representative per Kingdom</text>

  <!-- ── Monera: rod bacterium ───────────────────────────────── -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="130" height="200" rx="10" fill="#f7fafc" stroke="#7c3aed" stroke-width="2"/>
    <text x="65" y="22" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">Monera</text>
    <!-- Rod-shaped bacterium -->
    <rect x="30" y="80" width="70" height="36" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <!-- Flagellum -->
    <path d="M 30 98 Q 18 92 14 100 Q 10 108 4 100" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    <!-- Inner DNA loop -->
    <ellipse cx="65" cy="98" rx="14" ry="6" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="65" y="160" font-size="11" font-style="italic" fill="#1a202c" text-anchor="middle">E. coli</text>
    <text x="65" y="178" font-size="10" fill="#4a5568" text-anchor="middle">prokaryotic</text>
    <text x="65" y="192" font-size="10" fill="#4a5568" text-anchor="middle">unicellular</text>
  </g>

  <!-- ── Protista: amoeba ────────────────────────────────────── -->
  <g transform="translate(190, 50)">
    <rect x="0" y="0" width="130" height="200" rx="10" fill="#f7fafc" stroke="#319795" stroke-width="2"/>
    <text x="65" y="22" font-size="12" font-weight="700" fill="#319795" text-anchor="middle">Protista</text>
    <!-- Amoeba blob with pseudopodia -->
    <path d="M 35 95 Q 22 80 30 70 Q 40 60 55 70 Q 70 60 80 70 Q 95 75 100 90 Q 110 100 100 115 Q 95 130 80 125 Q 70 135 55 125 Q 40 130 32 115 Q 25 105 35 95 Z" fill="#ccfbf1" stroke="#319795" stroke-width="2"/>
    <!-- Nucleus -->
    <circle cx="65" cy="98" r="10" fill="#319795" opacity="0.7"/>
    <circle cx="65" cy="98" r="3" fill="#fff"/>
    <!-- Food vacuole -->
    <circle cx="85" cy="105" r="4" fill="#fff" stroke="#319795" stroke-width="1"/>
    <text x="65" y="160" font-size="11" font-style="italic" fill="#1a202c" text-anchor="middle">Amoeba proteus</text>
    <text x="65" y="178" font-size="10" fill="#4a5568" text-anchor="middle">eukaryotic</text>
    <text x="65" y="192" font-size="10" fill="#4a5568" text-anchor="middle">unicellular</text>
  </g>

  <!-- ── Fungi: mushroom ─────────────────────────────────────── -->
  <g transform="translate(340, 50)">
    <rect x="0" y="0" width="130" height="200" rx="10" fill="#f7fafc" stroke="#b45309" stroke-width="2"/>
    <text x="65" y="22" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Fungi</text>
    <!-- Mushroom cap -->
    <path d="M 30 90 Q 30 60 65 60 Q 100 60 100 90 Z" fill="#fed7aa" stroke="#b45309" stroke-width="2"/>
    <!-- Cap spots -->
    <circle cx="50" cy="78" r="4" fill="#fff" stroke="#b45309" stroke-width="1"/>
    <circle cx="78" cy="74" r="3" fill="#fff" stroke="#b45309" stroke-width="1"/>
    <circle cx="68" cy="84" r="3" fill="#fff" stroke="#b45309" stroke-width="1"/>
    <!-- Gills under cap -->
    <line x1="34" y1="92" x2="36" y2="100" stroke="#b45309" stroke-width="1"/>
    <line x1="44" y1="92" x2="44" y2="100" stroke="#b45309" stroke-width="1"/>
    <line x1="54" y1="92" x2="54" y2="100" stroke="#b45309" stroke-width="1"/>
    <line x1="65" y1="92" x2="65" y2="100" stroke="#b45309" stroke-width="1"/>
    <line x1="76" y1="92" x2="76" y2="100" stroke="#b45309" stroke-width="1"/>
    <line x1="86" y1="92" x2="86" y2="100" stroke="#b45309" stroke-width="1"/>
    <line x1="96" y1="92" x2="94" y2="100" stroke="#b45309" stroke-width="1"/>
    <!-- Stem -->
    <rect x="55" y="100" width="20" height="40" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <!-- Ground -->
    <line x1="30" y1="142" x2="100" y2="142" stroke="#78350f" stroke-width="2"/>
    <text x="65" y="160" font-size="11" font-style="italic" fill="#1a202c" text-anchor="middle">Agaricus bisporus</text>
    <text x="65" y="178" font-size="10" fill="#4a5568" text-anchor="middle">heterotroph</text>
    <text x="65" y="192" font-size="10" fill="#4a5568" text-anchor="middle">chitin cell wall</text>
  </g>

  <!-- ── Plantae: flowering plant ────────────────────────────── -->
  <g transform="translate(490, 50)">
    <rect x="0" y="0" width="130" height="200" rx="10" fill="#f7fafc" stroke="#15803d" stroke-width="2"/>
    <text x="65" y="22" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Plantae</text>
    <!-- Flower -->
    <circle cx="65" cy="60" r="8" fill="#fbbf24" stroke="#1a202c" stroke-width="1"/>
    <circle cx="55" cy="56" r="5" fill="#fce7f3" stroke="#be185d" stroke-width="1"/>
    <circle cx="75" cy="56" r="5" fill="#fce7f3" stroke="#be185d" stroke-width="1"/>
    <circle cx="58" cy="68" r="5" fill="#fce7f3" stroke="#be185d" stroke-width="1"/>
    <circle cx="72" cy="68" r="5" fill="#fce7f3" stroke="#be185d" stroke-width="1"/>
    <!-- Stem -->
    <line x1="65" y1="68" x2="65" y2="135" stroke="#15803d" stroke-width="3"/>
    <!-- Leaves -->
    <path d="M 65 90 Q 45 88 38 100 Q 50 100 65 96 Z" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
    <path d="M 65 110 Q 85 108 92 120 Q 80 120 65 116 Z" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
    <!-- Soil -->
    <ellipse cx="65" cy="138" rx="32" ry="5" fill="#78350f" opacity="0.6"/>
    <text x="65" y="160" font-size="11" font-style="italic" fill="#1a202c" text-anchor="middle">Mangifera indica</text>
    <text x="65" y="178" font-size="10" fill="#4a5568" text-anchor="middle">photosynthetic</text>
    <text x="65" y="192" font-size="10" fill="#4a5568" text-anchor="middle">cellulose wall</text>
  </g>

  <!-- ── Animalia: fish ──────────────────────────────────────── -->
  <g transform="translate(640, 50)">
    <rect x="0" y="0" width="110" height="200" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="2"/>
    <text x="55" y="22" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">Animalia</text>
    <!-- Fish body -->
    <ellipse cx="50" cy="100" rx="32" ry="18" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <!-- Tail -->
    <path d="M 80 100 L 96 84 L 96 116 Z" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="32" cy="96" r="3" fill="#1a202c"/>
    <circle cx="32" cy="96" r="1.2" fill="#fff"/>
    <!-- Gill -->
    <path d="M 38 90 Q 36 100 38 110" fill="none" stroke="#2b6cb0" stroke-width="1"/>
    <!-- Top fin -->
    <path d="M 45 82 L 55 70 L 60 82 Z" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <!-- Bottom fin -->
    <path d="M 45 118 L 55 130 L 60 118 Z" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="55" y="160" font-size="11" font-style="italic" fill="#1a202c" text-anchor="middle">Carassius auratus</text>
    <text x="55" y="178" font-size="10" fill="#4a5568" text-anchor="middle">heterotroph</text>
    <text x="55" y="192" font-size="10" fill="#4a5568" text-anchor="middle">no cell wall</text>
  </g>

  <text x="380" y="270" font-size="10" fill="#4a5568" text-anchor="middle">Each kingdom captured with one diagnostic feature visible — the body plan tells you the kingdom at a glance.</text>
</svg>
