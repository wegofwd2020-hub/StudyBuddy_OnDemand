<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Taxonomic hierarchy ladder">
  <title>Taxonomic hierarchy — Domain to Species</title>
  <desc>An eight-rung ladder showing the major taxonomic ranks from Domain (broadest) at the top down to Species (most specific) at the bottom, with the grey wolf (Canis lupus) classified at each level. Each rung narrows visually to convey decreasing breadth.</desc>

  <text x="360" y="24" font-size="15" font-weight="700" fill="#1a202c" text-anchor="middle">Taxonomic Hierarchy — Broad to Specific</text>
  <text x="360" y="42" font-size="11" fill="#4a5568" text-anchor="middle">Each level groups organisms by shared characteristics. Lower = fewer organisms, more shared traits.</text>

  <!-- Column headings -->
  <text x="40" y="68" font-size="11" font-weight="700" fill="#1a202c">Rank</text>
  <text x="240" y="68" font-size="11" font-weight="700" fill="#1a202c">What it groups by</text>
  <text x="540" y="68" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">Grey wolf classification</text>

  <!-- Rung 1: Domain (widest) -->
  <rect x="40" y="80" width="640" height="34" rx="6" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="60" y="102" font-size="13" font-weight="700" fill="#1e3a8a">Domain</text>
  <text x="240" y="102" font-size="11" fill="#4a5568">Cell type — prokaryote vs eukaryote</text>
  <text x="540" y="102" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">Eukarya</text>

  <!-- Rung 2: Kingdom -->
  <rect x="60" y="120" width="600" height="34" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="80" y="142" font-size="13" font-weight="700" fill="#14532d">Kingdom</text>
  <text x="260" y="142" font-size="11" fill="#4a5568">Major body plan + nutrition mode</text>
  <text x="540" y="142" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Animalia</text>

  <!-- Rung 3: Phylum -->
  <rect x="85" y="160" width="550" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="105" y="182" font-size="13" font-weight="700" fill="#78350f">Phylum</text>
  <text x="280" y="182" font-size="11" fill="#4a5568">Fundamental anatomy (e.g. notochord)</text>
  <text x="540" y="182" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">Chordata</text>

  <!-- Rung 4: Class -->
  <rect x="115" y="200" width="490" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="135" y="222" font-size="13" font-weight="700" fill="#7f1d1d">Class</text>
  <text x="305" y="222" font-size="11" fill="#4a5568">Reproduction + body covering</text>
  <text x="540" y="222" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">Mammalia</text>

  <!-- Rung 5: Order -->
  <rect x="145" y="240" width="430" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="165" y="262" font-size="13" font-weight="700" fill="#312e81">Order</text>
  <text x="330" y="262" font-size="11" fill="#4a5568">Diet + dentition (carnivore teeth)</text>
  <text x="540" y="262" font-size="12" font-weight="700" fill="#6366f1" text-anchor="middle">Carnivora</text>

  <!-- Rung 6: Family -->
  <rect x="180" y="280" width="360" height="34" rx="6" fill="#ccfbf1" stroke="#319795" stroke-width="1.5"/>
  <text x="200" y="302" font-size="13" font-weight="700" fill="#134e4a">Family</text>
  <text x="345" y="302" font-size="11" fill="#4a5568">Skull + skeletal traits</text>
  <text x="540" y="302" font-size="12" font-weight="700" fill="#319795" text-anchor="middle">Canidae</text>

  <!-- Rung 7: Genus -->
  <rect x="215" y="320" width="290" height="34" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="235" y="342" font-size="13" font-weight="700" fill="#831843">Genus</text>
  <text x="365" y="342" font-size="11" fill="#4a5568">Closely related species</text>
  <text x="540" y="342" font-size="12" font-weight="700" font-style="italic" fill="#be185d" text-anchor="middle">Canis</text>

  <!-- Rung 8: Species (narrowest) -->
  <rect x="250" y="360" width="220" height="34" rx="6" fill="#1a202c" stroke="#1a202c" stroke-width="1.5"/>
  <text x="270" y="382" font-size="13" font-weight="700" fill="#f7fafc">Species</text>
  <text x="395" y="382" font-size="11" fill="#cbd5e1">One interbreeding pop.</text>
  <text x="540" y="382" font-size="12" font-weight="700" font-style="italic" fill="#f7fafc" text-anchor="middle">Canis lupus</text>

  <!-- Side bracket -->
  <line x1="20" y1="80" x2="20" y2="394" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="20" y1="80" x2="30" y2="80" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="20" y1="394" x2="30" y2="394" stroke="#4a5568" stroke-width="1.5"/>
  <text x="14" y="240" font-size="10" font-weight="700" fill="#4a5568" text-anchor="middle" transform="rotate(-90 14 240)">broad → specific</text>

  <text x="360" y="412" font-size="10" fill="#4a5568" text-anchor="middle">Mnemonic: "Dear King Philip Came Over For Good Soup" → Domain · Kingdom · Phylum · Class · Order · Family · Genus · Species</text>
</svg>
