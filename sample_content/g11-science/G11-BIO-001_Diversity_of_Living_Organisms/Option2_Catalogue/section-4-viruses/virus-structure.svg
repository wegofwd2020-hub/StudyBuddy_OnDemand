<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img" aria-label="General virus structure">
  <title>General virus structure — capsid, genome, envelope</title>
  <desc>Cross-section of an enveloped virus showing the icosahedral capsid (made of capsomeres), inner genetic material (single-stranded RNA), surrounding lipid envelope acquired from the host membrane, and embedded glycoprotein spikes used for host-cell attachment.</desc>

  <text x="310" y="22" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">General Virus Structure</text>
  <text x="310" y="40" font-size="11" fill="#4a5568" text-anchor="middle">A virus is a protein shell wrapped around genetic material — not a cell, not alive on its own.</text>

  <!-- Outer envelope (faint) -->
  <circle cx="220" cy="180" r="120" fill="#fee2e2" opacity="0.5" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 3"/>
  <!-- Capsid (icosahedral approximation = polygon) -->
  <polygon points="220,80 295,120 295,200 220,240 145,200 145,120" fill="#fed7aa" stroke="#b45309" stroke-width="2.5"/>
  <!-- Capsomere subunits (small circles) -->
  <circle cx="220" cy="80" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="295" cy="120" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="295" cy="200" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="220" cy="240" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="145" cy="200" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="145" cy="120" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="220" cy="160" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="185" cy="135" r="6" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
  <circle cx="255" cy="135" r="6" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
  <circle cx="185" cy="195" r="6" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
  <circle cx="255" cy="195" r="6" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>

  <!-- RNA strand inside (squiggle) -->
  <path d="M 190 150 Q 200 140 215 150 Q 230 160 240 145 Q 250 130 235 125 Q 215 130 205 145 Q 195 160 210 175 Q 230 180 240 170" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>

  <!-- Glycoprotein spikes -->
  <g stroke="#15803d" stroke-width="2.5" fill="#15803d">
    <line x1="220" y1="60" x2="220" y2="40"/>
    <circle cx="220" cy="38" r="4"/>
    <line x1="290" y1="100" x2="306" y2="84"/>
    <circle cx="308" cy="82" r="4"/>
    <line x1="290" y1="220" x2="306" y2="236"/>
    <circle cx="308" cy="238" r="4"/>
    <line x1="220" y1="260" x2="220" y2="280"/>
    <circle cx="220" cy="282" r="4"/>
    <line x1="150" y1="220" x2="134" y2="236"/>
    <circle cx="132" cy="238" r="4"/>
    <line x1="150" y1="100" x2="134" y2="84"/>
    <circle cx="132" cy="82" r="4"/>
  </g>

  <!-- Labels with leader lines -->
  <line x1="220" y1="38" x2="430" y2="60" stroke="#1a202c" stroke-width="1"/>
  <text x="438" y="55" font-size="12" font-weight="700" fill="#15803d">Glycoprotein spikes</text>
  <text x="438" y="70" font-size="10" fill="#4a5568">attach to host receptor</text>

  <line x1="340" y1="180" x2="430" y2="120" stroke="#1a202c" stroke-width="1"/>
  <text x="438" y="115" font-size="12" font-weight="700" fill="#dc2626">Lipid envelope</text>
  <text x="438" y="130" font-size="10" fill="#4a5568">stolen from host membrane</text>

  <line x1="295" y1="200" x2="430" y2="180" stroke="#1a202c" stroke-width="1"/>
  <text x="438" y="175" font-size="12" font-weight="700" fill="#b45309">Capsid (capsomeres)</text>
  <text x="438" y="190" font-size="10" fill="#4a5568">protein coat around genome</text>

  <line x1="220" y1="155" x2="430" y2="240" stroke="#1a202c" stroke-width="1"/>
  <text x="438" y="235" font-size="12" font-weight="700" fill="#2b6cb0">Genetic material</text>
  <text x="438" y="250" font-size="10" fill="#4a5568">DNA or RNA, ss or ds</text>

  <text x="310" y="320" font-size="11" fill="#4a5568" text-anchor="middle">A virus has no metabolism, no ribosomes, and cannot reproduce alone — it must hijack a living cell.</text>
  <text x="310" y="338" font-size="10" font-style="italic" fill="#4a5568" text-anchor="middle">Most enveloped viruses (influenza, coronaviruses, HIV) are 80–200 nm — too small to see in a light microscope.</text>
</svg>
