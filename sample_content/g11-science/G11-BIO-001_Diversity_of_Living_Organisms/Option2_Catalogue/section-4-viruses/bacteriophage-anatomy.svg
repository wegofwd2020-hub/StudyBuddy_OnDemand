<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="Bacteriophage T4 anatomy">
  <title>Bacteriophage T4 — labelled cross-section</title>
  <desc>Cross-section of bacteriophage T4 showing the icosahedral head containing double-stranded DNA, the collar, the contractile tail sheath surrounding the inner tail tube, the baseplate at the tail's end, and six tail fibres extending downward to grip the bacterial cell wall.</desc>

  <text x="300" y="22" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Bacteriophage T4 — Anatomy</text>
  <text x="300" y="40" font-size="11" fill="#4a5568" text-anchor="middle">A virus that infects bacteria. The "lunar lander" body plan is one of biology's most iconic shapes.</text>

  <!-- Head: icosahedral capsid -->
  <polygon points="200,80 270,110 270,180 200,210 130,180 130,110" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.5"/>
  <!-- DNA inside head as squiggle -->
  <path d="M 160 130 Q 180 115 200 130 Q 220 145 240 130 Q 220 155 200 145 Q 180 135 160 150 Q 200 165 220 175 Q 200 185 175 170" fill="none" stroke="#dc2626" stroke-width="2"/>

  <!-- Collar -->
  <rect x="180" y="210" width="40" height="10" fill="#94a3b8" stroke="#1a202c" stroke-width="1.5"/>

  <!-- Tail sheath (contractile) -->
  <rect x="187" y="220" width="26" height="80" fill="#cbd5e1" stroke="#1a202c" stroke-width="1.5"/>
  <!-- Sheath rings -->
  <line x1="187" y1="232" x2="213" y2="232" stroke="#64748b" stroke-width="1"/>
  <line x1="187" y1="244" x2="213" y2="244" stroke="#64748b" stroke-width="1"/>
  <line x1="187" y1="256" x2="213" y2="256" stroke="#64748b" stroke-width="1"/>
  <line x1="187" y1="268" x2="213" y2="268" stroke="#64748b" stroke-width="1"/>
  <line x1="187" y1="280" x2="213" y2="280" stroke="#64748b" stroke-width="1"/>
  <line x1="187" y1="292" x2="213" y2="292" stroke="#64748b" stroke-width="1"/>

  <!-- Tail tube (inner) - shown as central line -->
  <line x1="200" y1="220" x2="200" y2="300" stroke="#475569" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- Baseplate -->
  <rect x="170" y="300" width="60" height="12" fill="#94a3b8" stroke="#1a202c" stroke-width="1.5"/>

  <!-- Tail fibres (6 of them, splayed) -->
  <g stroke="#1e293b" stroke-width="2" fill="none">
    <path d="M 175 312 L 145 332 L 130 350"/>
    <path d="M 185 312 L 165 340 L 158 360"/>
    <path d="M 195 312 L 192 350"/>
    <path d="M 205 312 L 208 350"/>
    <path d="M 215 312 L 235 340 L 242 360"/>
    <path d="M 225 312 L 255 332 L 270 350"/>
  </g>

  <!-- Labels with leader lines -->
  <line x1="270" y1="120" x2="380" y2="100" stroke="#1a202c" stroke-width="1"/>
  <text x="388" y="96" font-size="12" font-weight="700" fill="#2b6cb0">Head (capsid)</text>
  <text x="388" y="110" font-size="10" fill="#4a5568">icosahedral protein shell</text>

  <line x1="220" y1="148" x2="380" y2="140" stroke="#1a202c" stroke-width="1"/>
  <text x="388" y="138" font-size="12" font-weight="700" fill="#dc2626">DNA genome</text>
  <text x="388" y="152" font-size="10" fill="#4a5568">double-stranded, ~169 kbp</text>

  <line x1="220" y1="215" x2="380" y2="180" stroke="#1a202c" stroke-width="1"/>
  <text x="388" y="178" font-size="12" font-weight="700" fill="#475569">Collar</text>

  <line x1="213" y1="260" x2="380" y2="220" stroke="#1a202c" stroke-width="1"/>
  <text x="388" y="218" font-size="12" font-weight="700" fill="#475569">Tail sheath</text>
  <text x="388" y="232" font-size="10" fill="#4a5568">contracts to inject DNA</text>

  <line x1="230" y1="306" x2="380" y2="265" stroke="#1a202c" stroke-width="1"/>
  <text x="388" y="263" font-size="12" font-weight="700" fill="#475569">Baseplate</text>

  <line x1="252" y1="345" x2="380" y2="310" stroke="#1a202c" stroke-width="1"/>
  <text x="388" y="308" font-size="12" font-weight="700" fill="#1e293b">Tail fibres</text>
  <text x="388" y="322" font-size="10" fill="#4a5568">grip host cell wall</text>

  <text x="300" y="370" font-size="10" fill="#4a5568" text-anchor="middle" font-style="italic">T4 infects E. coli — a workhorse in molecular biology since 1942.</text>
</svg>
