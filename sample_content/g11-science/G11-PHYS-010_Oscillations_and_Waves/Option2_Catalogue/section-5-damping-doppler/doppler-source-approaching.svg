<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Doppler effect approaching">
  <title>Doppler effect approaching</title>
  <desc>A moving source emits successive circular wavefronts. The wavefronts ahead of the source are compressed (heard higher); the wavefronts behind are spread out (heard lower).</desc>
<defs>
    <marker id="arrR3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#dc2626" />
    </marker>
  </defs>
<text x="360" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Doppler effect: source moving towards observer</text>
<text x="360" y="40" font="11px system-ui" font-size="11" font-style="italic" fill="#4a5568" text-anchor="middle">wavefronts ahead are compressed (higher frequency); behind, rarefied (lower)</text>
<circle cx="260" cy="180" r="130" fill="none" stroke="#2b6cb0" stroke-width="1.6" />
<circle cx="300" cy="180" r="95" fill="none" stroke="#2b6cb0" stroke-width="1.6" />
<circle cx="340" cy="180" r="60" fill="none" stroke="#2b6cb0" stroke-width="1.6" />
<circle cx="380" cy="180" r="25" fill="none" stroke="#2b6cb0" stroke-width="1.6" />
<circle cx="380" cy="180" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
<text x="380" y="210" font="11px system-ui" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">source</text>
<line x1="394" y1="180" x2="450" y2="180" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrR3)" />
<text x="422" y="172" font="11px system-ui" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">v_s</text>
<polygon points="580,168 568,192 592,192" fill="#15803d" stroke="#1a202c" stroke-width="1.5" />
<text x="580" y="210" font="11px system-ui" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">observer</text>
<text x="580" y="224" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">(higher pitch)</text>
<polygon points="90,168 78,192 102,192" fill="#dd6b20" stroke="#1a202c" stroke-width="1.5" />
<text x="90" y="210" font="11px system-ui" font-size="11" font-weight="600" fill="#dd6b20" text-anchor="middle">observer</text>
<text x="90" y="224" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">(lower pitch)</text>
<text x="360" y="322" font="12px system-ui" font-size="12" font-weight="600" fill="#1a202c" text-anchor="middle">f' = f · (v ± v_o) / (v ∓ v_s)   (top signs: source approaching observer)</text>
</svg>