<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 420" width="1140" height="420" role="img" aria-label="Groups versus periods on the periodic table">
  <title>Groups versus periods on the periodic table</title>
  <desc>A periodic table with the entire first column highlighted yellow (Group 1, the alkali metals) and the third row highlighted blue (Period 3). Annotations along the side and top label each highlight, emphasising that columns share outer-electron count and rows share shell count.</desc>
  
  <text x="570" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Groups (columns) vs Periods (rows)</text>
  <text x="570" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Same group = same outer-shell electron count = similar chemistry. Same period = same number of shells.</text>

