<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 400" width="1140" height="400" role="img" aria-label="Metals metalloids and non-metals zones">
  <title>Metals metalloids and non-metals zones</title>
  <desc>A periodic table with three distinct colour zones: metals (orange) on the left, non-metals (green) on the right, and a thin metalloid (purple) zone running diagonally between them. A red staircase line traces the diagonal boundary between metal and non-metal. Legend at the bottom labels each zone.</desc>
  
  <text x="570" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Metals · Metalloids · Non-metals</text>
  <text x="570" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">A diagonal "staircase" splits the table. Left of the line: metals. Right: non-metals. Touching the line: metalloids.</text>

