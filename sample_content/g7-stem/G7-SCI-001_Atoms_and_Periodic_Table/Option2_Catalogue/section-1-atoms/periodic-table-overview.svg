  <title>Periodic table overview periods 1 to 4</title>
  <desc>A periodic table showing 36 elements arranged in 4 periods and 18 groups, with cells coloured by category: alkali metals (yellow), alkaline earths (orange), transition metals (mint), post-transition metals (pale blue), metalloids (pale purple), nonmetals (pale red), halogens (lime), and noble gases (cyan). A legend at the bottom labels each colour.</desc>
  
