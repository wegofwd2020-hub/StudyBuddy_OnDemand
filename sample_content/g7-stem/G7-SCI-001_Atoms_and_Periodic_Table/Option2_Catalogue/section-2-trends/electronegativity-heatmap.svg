<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 420" width="1140" height="420" role="img" aria-label="Electronegativity — Periodic Trend">
  <title>Electronegativity — Periodic Trend</title>
  <desc>A periodic-table heatmap colouring each element's tile by Pauling-scale electronegativity. Stronger pullers (fluorine, oxygen) appear deepest red; weaker pullers (alkali metals, hydrogen) appear bluest. Noble gases are uncoloured because they don't form bonds. The pattern grows toward the upper-right corner.</desc>
  
  <text x="570" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Electronegativity — Periodic Trend</text>
  <text x="570" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">How much does each atom 'pull' shared electrons toward itself? Higher = redder. Fluorine wins (3.98).</text>

