<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 420" width="1140" height="420" role="img" aria-label="Atomic Radius — Periodic Trend">
  <title>Atomic Radius — Periodic Trend</title>
  <desc>A periodic-table heatmap colouring each element's tile by its atomic radius (in picometres). Larger atoms appear redder, smaller atoms bluer. The visual pattern shows radius shrinking from left to right within a period and growing from top to bottom within a group. A linear gradient legend at the bottom maps colour to value.</desc>
  
  <text x="570" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Atomic Radius — Periodic Trend</text>
  <text x="570" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">How big is each atom? Bigger atoms = redder. Trend: shrinks left-to-right, grows top-to-bottom.</text>

