<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 450" width="1140" height="450" role="img" aria-label="Periodic trends arrows summary">
  <title>Periodic trends arrows summary</title>
  <desc>A faint outline of the periodic table with three big trend arrows annotated: a red right-pointing arrow above the table labelled 'ionization energy + electronegativity INCREASE →', a blue right-pointing arrow below the table labelled 'atomic radius SHRINKS →', and a blue down-pointing arrow on the left side labelled 'radius GROWS ↓, IE/EN SHRINK ↓'. A short caption explains the proton-pull reasoning.</desc>
  
  <text x="570" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Periodic Trends — One-Page Summary</text>
  <text x="570" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Three trends, one diagram. Arrow direction = "increases this way".</text>
