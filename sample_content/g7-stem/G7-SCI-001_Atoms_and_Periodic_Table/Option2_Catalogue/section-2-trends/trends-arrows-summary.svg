  <defs>
    <marker id="trend-arr-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="trend-arr-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- Increasing IE/EN/EA across the period (right-pointing red arrow above the table) -->
  <line x1="30" y1="66" x2="1106" y2="66" stroke="#dc2626" stroke-width="3" marker-end="url(#trend-arr-up)" />
  <text x="568" y="58" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">ionization energy + electronegativity INCREASE →</text>

  <!-- Decreasing radius across the period (right-pointing blue arrow below the table) -->
  <line x1="30" y1="336" x2="1106" y2="336" stroke="#2b6cb0" stroke-width="3" marker-end="url(#trend-arr-down)" />
  <text x="568" y="356" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">atomic radius SHRINKS →</text>

  <!-- Group trends: down arrow on the left side -->
  <line x1="16" y1="80" x2="16" y2="320" stroke="#2b6cb0" stroke-width="3" marker-end="url(#trend-arr-down)" />
  <text x="8" y="200" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="end" transform="rotate(-90 8 200)">radius GROWS ↓ · IE/EN SHRINK ↓</text>

  <text x="570" y="400" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Right and up → smaller, harder-to-ionize, more grabby. Left and down → bigger, easy to ionize, less grabby.</text>
  <text x="570" y="418" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Why? More protons in the same shell → tighter pull on electrons → smaller radius and stronger grip.</text>
  <text x="570" y="436" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Add a shell (down) → outer electrons are farther away → bigger atom, looser hold.</text>

</svg>
