<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 420" width="1140" height="420" role="img" aria-label="First Ionization Energy — Periodic Trend">
  <title>First Ionization Energy — Periodic Trend</title>
  <desc>A periodic-table heatmap colouring each element's tile by its first ionization energy (in electron-volts). Higher ionization energies appear redder, lower bluer. The visual pattern is the inverse of atomic radius: ionization energy grows left-to-right and shrinks top-to-bottom. Noble gases stand out as bright red on the right edge.</desc>
  
  <text x="570" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">First Ionization Energy — Periodic Trend</text>
  <text x="570" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">How hard is it to rip off the outermost electron? Higher = redder. Trend: grows left-to-right, shrinks top-to-bottom.</text>

