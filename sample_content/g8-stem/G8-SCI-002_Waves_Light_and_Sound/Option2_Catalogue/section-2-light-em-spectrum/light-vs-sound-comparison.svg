<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Light versus sound comparison card">
  <title>Light versus sound comparison card</title>
  <desc>Side-by-side comparison of light and sound across five rows: type (transverse-EM vs longitudinal-pressure), needs medium (no vs yes), speed (3 × 10⁸ m/s vs 343 m/s), wavelength/frequency range (380-700 nm vs 20 Hz-20 kHz), and sense (eye vs ear).</desc>
  
  <text x="300" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Light vs Sound — Same Equation, Wildly Different Numbers</text>

  <g>
    <rect x="40" y="60" width="240" height="220" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="2" />
    <text x="160" y="86" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#2b6cb0" text-anchor="middle">Light</text>
    <text x="60" y="124" font="13px system-ui" font-size="13" fill="#1a202c">type:</text>
    <text x="270" y="124" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">transverse · electromagnetic</text>
    <text x="60" y="156" font="13px system-ui" font-size="13" fill="#1a202c">needs medium?</text>
    <text x="270" y="156" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="end">no — vacuum is fine</text>
    <text x="60" y="188" font="13px system-ui" font-size="13" fill="#1a202c">speed in vacuum:</text>
    <text x="270" y="188" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">3 × 10⁸ m/s</text>
    <text x="60" y="220" font="13px system-ui" font-size="13" fill="#1a202c">visible λ range:</text>
    <text x="270" y="220" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">380–700 nm</text>
    <text x="60" y="252" font="13px system-ui" font-size="13" fill="#1a202c">sense:</text>
    <text x="270" y="252" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">eye</text>
  </g>

  <g>
    <rect x="320" y="60" width="240" height="220" rx="10" fill="#f7fafc" stroke="#dd6b20" stroke-width="2" />
    <text x="440" y="86" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#dd6b20" text-anchor="middle">Sound</text>
    <text x="340" y="124" font="13px system-ui" font-size="13" fill="#1a202c">type:</text>
    <text x="550" y="124" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">longitudinal · pressure</text>
    <text x="340" y="156" font="13px system-ui" font-size="13" fill="#1a202c">needs medium?</text>
    <text x="550" y="156" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="end">yes — air, water, solids</text>
    <text x="340" y="188" font="13px system-ui" font-size="13" fill="#1a202c">speed in air:</text>
    <text x="550" y="188" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">343 m/s</text>
    <text x="340" y="220" font="13px system-ui" font-size="13" fill="#1a202c">audible f range:</text>
    <text x="550" y="220" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">20 Hz – 20 kHz</text>
    <text x="340" y="252" font="13px system-ui" font-size="13" fill="#1a202c">sense:</text>
    <text x="550" y="252" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">ear</text>
  </g>

  <text x="300" y="308" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Light is ~880,000× faster than sound in air. That's why thunder follows lightning.</text>

</svg>
