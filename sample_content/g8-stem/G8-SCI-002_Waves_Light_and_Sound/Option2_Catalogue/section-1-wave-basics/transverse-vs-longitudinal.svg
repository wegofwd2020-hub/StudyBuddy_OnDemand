<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Transverse versus longitudinal waves">
  <title>Transverse versus longitudinal waves</title>
  <desc>Two side-by-side wave illustrations: left shows a transverse sine wave with particle-motion arrow up/down and wave-direction arrow rightward. Right shows longitudinal sound-wave compressions and rarefactions as vertical lines that bunch and spread along the propagation direction.</desc>
  
  <text x="360" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Transverse vs Longitudinal Waves</text>
  <text x="360" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">It depends on which way the particles wiggle relative to which way the wave travels.</text>

  <!-- Transverse — sine wave with arrow showing wave direction -->
  <text x="180" y="100" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#2b6cb0" text-anchor="middle">Transverse (light, water surface)</text>
  <text x="180" y="118" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">particles ↕ · wave →</text>
