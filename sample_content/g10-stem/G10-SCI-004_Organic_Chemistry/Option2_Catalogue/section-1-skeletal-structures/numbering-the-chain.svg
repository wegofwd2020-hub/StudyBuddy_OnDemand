<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="Numbering the carbon chain by lowest locants">
  <title>Numbering the carbon chain by lowest locants</title>
  <desc>A skeletal structure of 2-methylbutane with carbons labelled 1, 2, 3, 4 from left to right and a CH₃ methyl branch hanging off carbon 2. Annotation explains that numbering from the right would put the methyl on carbon 3 — the IUPAC 'lowest locants' rule selects the lower-numbered direction.</desc>
  
  <text x="300" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Numbering the Chain — Choose the Lowest Locants</text>
  <text x="300" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Walk the longest chain. Number from whichever end gives the substituent(s) the smallest position number.</text>

  <!-- Skeletal -->
<line x1="100.0" y1="160.0" x2="118.0" y2="128.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><line x1="118.0" y1="128.8" x2="136.0" y2="160.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><line x1="136.0" y1="160.0" x2="154.0" y2="128.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><line x1="118.0" y1="128.8" x2="118.0" y2="160.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><text x="100" y="150" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">1</text><text x="118" y="118.82308546376021" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">2</text><text x="136" y="150" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">3</text><text x="154" y="118.82308546376021" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">4</text><text x="118" y="176" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dd6b20" text-anchor="middle">CH₃</text>
  <text x="178" y="153.8230854637602" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d">methyl on C2</text>

  <!-- "WRONG numbering" alternative -->
  <text x="450" y="100" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">numbered the wrong way:</text>
  <text x="450" y="118" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">methyl would land on C3 (bigger number)</text>

  <text x="300" y="250" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">2-methylbutane ✓</text>
  <text x="300" y="268" font="11px system-ui" font-size="11" fill="#dc2626" text-anchor="middle">3-methylbutane ✗ (same molecule, but rule says "lowest locants" → use the 2)</text>

</svg>
