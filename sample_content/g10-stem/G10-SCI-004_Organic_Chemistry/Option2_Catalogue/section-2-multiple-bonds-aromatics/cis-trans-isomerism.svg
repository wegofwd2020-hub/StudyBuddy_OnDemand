<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="Cis-trans isomers of 2-butene">
  <title>Cis-trans isomers of 2-butene</title>
  <desc>Two skeletal structures of 2-butene side by side. Cis-2-butene has both methyl substituents on the same side of the central double bond (both pointing up); trans-2-butene has the methyls on opposite sides (one up, one down).</desc>
  
  <text x="300" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Cis-Trans Isomers — Same Molecule, Different Geometry</text>
  <text x="300" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Substituents on a double bond can sit on the same side (cis) or opposite sides (trans).</text>

  <text x="160" y="100" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">cis-2-butene</text>
  <text x="160" y="116" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">methyls on same side (above)</text>
  
  <line x1="142.0" y1="164.0" x2="178.0" y2="164.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="142.0" y1="158.0" x2="178.0" y2="158.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="142.0" y1="160.0" x2="124.0" y2="128.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="178.0" y1="160.0" x2="196.0" y2="128.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <text x="440" y="100" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">trans-2-butene</text>
  <text x="440" y="116" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">methyls on opposite sides</text>
  
  <line x1="422.0" y1="164.0" x2="458.0" y2="164.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="422.0" y1="158.0" x2="458.0" y2="158.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="422.0" y1="160.0" x2="404.0" y2="128.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="458.0" y1="160.0" x2="476.0" y2="191.2" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <text x="300" y="250" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Same atoms, same connectivity. Different shapes → different physical properties.</text>
  <text x="300" y="268" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="middle">The double bond can't twist, so cis and trans are real different molecules — not just "rotated".</text>

</svg>
