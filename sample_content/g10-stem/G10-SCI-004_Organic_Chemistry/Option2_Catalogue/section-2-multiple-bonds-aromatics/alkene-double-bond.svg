<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Alkene series with double bonds">
  <title>Alkene series with double bonds</title>
  <desc>Three alkene structures: ethene (C₂H₄, two carbons joined by a double bond), propene (C₃H₆, three carbons with a double bond at one end), and but-2-ene (C₄H₈, four-carbon chain with the double bond between carbons 2 and 3).</desc>
  
  <text x="360" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Alkenes — One Double Bond (CₙH₂ₙ)</text>
  <text x="360" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">A "=" between two carbons means double bond. Suffix changes from -ane to -ene.</text>

  <text x="120" y="120" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">ethene</text>
  <text x="120" y="136" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">C₂H₄</text>
  
  <line x1="102.0" y1="174.0" x2="138.0" y2="174.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="102.0" y1="168.0" x2="138.0" y2="168.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <text x="320" y="120" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">propene</text>
  <text x="320" y="136" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">C₃H₆</text>
  
  <line x1="287.5" y1="172.0" x2="305.5" y2="140.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="282.3" y1="169.0" x2="300.3" y2="137.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="302.0" y1="138.8" x2="320.0" y2="170.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <text x="540" y="120" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">but-2-ene</text>
  <text x="540" y="136" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">C₄H₈</text>
  <line x1="486.0" y1="170.0" x2="504.0" y2="138.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  <line x1="500.5" y1="140.8" x2="518.5" y2="172.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="505.7" y1="137.8" x2="523.7" y2="169.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="522.0" y1="170.0" x2="540.0" y2="138.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <text x="360" y="264" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">The "2" in but-2-ene tells you the double bond starts at carbon 2.</text>

</svg>
