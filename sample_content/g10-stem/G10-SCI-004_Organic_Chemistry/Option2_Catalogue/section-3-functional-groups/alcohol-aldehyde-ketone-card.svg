<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Alcohol aldehyde and ketone functional groups">
  <title>Alcohol aldehyde and ketone functional groups</title>
  <desc>Three skeletal structures side by side: ethanol (two-carbon zigzag with an OH coming off the end carbon), ethanal (two-carbon zigzag with =O double-bonded plus H coming off the end carbon), and propan-2-one (three-carbon zigzag with =O double-bonded coming off the middle carbon).</desc>
  
  <text x="360" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Three Cousins: Alcohol · Aldehyde · Ketone</text>
  <text x="360" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">All three involve oxygen on the carbon skeleton — what differs is how the oxygen is attached.</text>

  <text x="160" y="100" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#ef4444" text-anchor="middle">alcohol</text>
  <text x="160" y="116" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">ethanol</text><line x1="110.0" y1="180.0" x2="128.0" y2="148.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><line x1="128.0" y1="148.8" x2="146.0" y2="180.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><text x="160.0" y="186.0" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#ef4444" text-anchor="middle">OH</text>
  <text x="380" y="100" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">aldehyde</text>
  <text x="380" y="116" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">ethanal</text><line x1="330.0" y1="180.0" x2="348.0" y2="148.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="351.5" y1="150.8" x2="369.5" y2="119.6" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="346.3" y1="147.8" x2="364.3" y2="116.6" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><text x="380.0" y="119.6" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#dc2626" text-anchor="middle">O</text><line x1="348.0" y1="148.8" x2="366.0" y2="180.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><text x="374.0" y="184.7" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">H</text>
  <text x="600" y="100" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">ketone</text>
  <text x="600" y="116" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">propan-2-one (acetone)</text><line x1="540.0" y1="180.0" x2="558.0" y2="148.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><line x1="558.0" y1="148.8" x2="576.0" y2="180.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="554.0" y1="148.8" x2="554.0" y2="180.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="560.0" y1="148.8" x2="560.0" y2="180.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><text x="558.0" y="204.0" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#dc2626" text-anchor="middle">O</text>
  <text x="360" y="290" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Alcohol: −OH at the end · Aldehyde: =O at the end · Ketone: =O in the middle of the chain.</text>
  <text x="360" y="308" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">Aldehyde + ketone share the same carbonyl group (C=O) — different position, different chemistry.</text>

</svg>
