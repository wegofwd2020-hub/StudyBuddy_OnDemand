<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="Carboxylic acid and ester functional groups">
  <title>Carboxylic acid and ester functional groups</title>
  <desc>Two structures side by side: ethanoic acid (the acid found in vinegar) shown with a two-carbon zigzag carrying =O and −OH on its terminal carbon, and methyl ethanoate (a fruity-smelling ester) shown with the −OH replaced by an −O−CH₃ group.</desc>
  
  <text x="300" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Carboxylic Acid + Ester — The Carbonyl + Oxygen Pair</text>

  <!-- Carboxylic acid: ethanoic acid -->
  <text x="170" y="80" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">carboxylic acid</text>
  <text x="170" y="96" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">ethanoic acid (vinegar!)</text><line x1="120.0" y1="160.0" x2="138.0" y2="128.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="141.5" y1="130.8" x2="159.5" y2="99.6" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="136.3" y1="127.8" x2="154.3" y2="96.6" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><text x="168.0" y="103.6" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#dc2626" text-anchor="middle">O</text><line x1="138.0" y1="128.8" x2="156.0" y2="160.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><text x="172.0" y="166.0" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#ef4444" text-anchor="middle">OH</text>
  <text x="430" y="80" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">ester</text>
  <text x="430" y="96" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">methyl ethanoate (fruity smell)</text><line x1="360.0" y1="160.0" x2="378.0" y2="128.8" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="381.5" y1="130.8" x2="399.5" y2="99.6" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="376.3" y1="127.8" x2="394.3" y2="96.6" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><text x="408.0" y="103.6" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#dc2626" text-anchor="middle">O</text><line x1="378.0" y1="128.8" x2="396.0" y2="160.0" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><text x="410.0" y="166.0" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#dc2626" text-anchor="middle">O</text><line x1="410.0" y1="160.0" x2="428.0" y2="191.2" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /><text x="444" y="197.1769145362398" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c">CH₃</text>
  <text x="300" y="244" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Replace the −OH of an acid with −O−R and you get an ester. Esters smell like flowers and fruit.</text>

</svg>
