<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-label="Motion strip — accelerated motion">
  <title>Motion strip — accelerated motion</title>
  <desc>Seven dots along a horizontal axis with progressively-increasing spacing, one per second from t = 0 to t = 6 s, showing the visual signature of uniformly-accelerated motion (gap growth ratio 1:3:5:7:9:11).</desc>
  
  <text x="240" y="22" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">Motion Strip — Accelerated Motion</text>
  <text x="240" y="40" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Strobe snapshots every 1 second — gaps grow each second because speed is increasing.</text>

  <line x1="40" y1="110" x2="440" y2="110" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4 4" />

  <circle cx="40" cy="110" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
  <text x="40" y="140" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">t = 0 s</text>
  <circle cx="51.111111111111114" cy="110" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
  <text x="51.111111111111114" y="140" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">t = 1 s</text>
  <circle cx="84.44444444444444" cy="110" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
  <text x="84.44444444444444" y="140" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">t = 2 s</text>
  <circle cx="140" cy="110" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
  <text x="140" y="140" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">t = 3 s</text>
  <circle cx="217.77777777777777" cy="110" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
  <text x="217.77777777777777" y="140" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">t = 4 s</text>
  <circle cx="317.77777777777777" cy="110" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
  <text x="317.77777777777777" y="140" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">t = 5 s</text>
  <circle cx="440" cy="110" r="9" fill="#dc2626" stroke="#1a202c" stroke-width="1.5" />
  <text x="440" y="140" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">t = 6 s</text>
  <line x1="50" y1="85" x2="41.111111111111114" y2="85" stroke="#dc2626" stroke-width="1.5" />
  <line x1="50" y1="80" x2="50" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <line x1="41.111111111111114" y1="80" x2="41.111111111111114" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <line x1="61.111111111111114" y1="85" x2="74.44444444444444" y2="85" stroke="#dc2626" stroke-width="1.5" />
  <line x1="61.111111111111114" y1="80" x2="61.111111111111114" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <line x1="74.44444444444444" y1="80" x2="74.44444444444444" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <line x1="94.44444444444444" y1="85" x2="130" y2="85" stroke="#dc2626" stroke-width="1.5" />
  <line x1="94.44444444444444" y1="80" x2="94.44444444444444" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <line x1="130" y1="80" x2="130" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <line x1="150" y1="85" x2="207.77777777777777" y2="85" stroke="#dc2626" stroke-width="1.5" />
  <line x1="150" y1="80" x2="150" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <line x1="207.77777777777777" y1="80" x2="207.77777777777777" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <line x1="227.77777777777777" y1="85" x2="307.77777777777777" y2="85" stroke="#dc2626" stroke-width="1.5" />
  <line x1="227.77777777777777" y1="80" x2="227.77777777777777" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <line x1="307.77777777777777" y1="80" x2="307.77777777777777" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <line x1="327.77777777777777" y1="85" x2="430" y2="85" stroke="#dc2626" stroke-width="1.5" />
  <line x1="327.77777777777777" y1="80" x2="327.77777777777777" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <line x1="430" y1="80" x2="430" y2="90" stroke="#dc2626" stroke-width="1.5" />
  <text x="240" y="72" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">gaps grow every second — speed is increasing → accelerated motion</text>

</svg>
