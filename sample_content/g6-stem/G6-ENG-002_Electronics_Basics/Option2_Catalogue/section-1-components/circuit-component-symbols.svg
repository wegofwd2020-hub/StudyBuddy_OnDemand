<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Circuit component symbols reference card">
  <title>Circuit component symbols reference card</title>
  <desc>An 8-cell grid showing the standard schematic symbols: wire (straight black line), resistor (zigzag), battery (long-and-short paired lines), lamp (circle with X), switch (open hinged lever), capacitor (two parallel lines), LED (triangle pointing into a bar with light arrows), and ground (three stacked horizontal lines). Each cell labels the component below the symbol.</desc>
  
  <text x="360" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Circuit Component Symbols — Reference Card</text>
  <text x="360" y="42" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">The standard shapes you'll see on every circuit diagram. Wires connect them at the open ends.</text>

    <rect x="20" y="60" width="165" height="120" rx="8" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5" />
    <text x="102.5" y="168" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Wire</text>
    <g transform="translate(30 70)"><line x1="40" y1="65" x2="130" y2="65" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" /></g>
    <rect x="195" y="60" width="165" height="120" rx="8" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5" />
    <text x="277.5" y="168" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">Resistor</text>
    <g transform="translate(205 70)">
  <path d="M 55,65 L 60.0,57 L 70.0,73 L 80.0,57 L 90.0,73 L 100.0,57 L 110.0,73 L 115,65" fill="none" stroke="#92400e" stroke-width="2.5" stroke-linejoin="miter" />
  </g>
