<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="Capacitor real component and schematic symbol">
  <title>Capacitor real component and schematic symbol</title>
  <desc>Side-by-side view: a real radial capacitor with cylindrical blue body and two leads on the left, labelled 10 μF. The right side shows the schematic two-parallel-lines symbol with C = 10 μF label.</desc>
  
  <text x="240" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Capacitor — Real Component and Symbol</text>

  <!-- Real capacitor (radial-cap body with leads) -->
  <text x="120" y="60" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">real component</text>
  <line x1="100" y1="180" x2="100" y2="120" stroke="#1a202c" stroke-width="2.5" />
  <line x1="140" y1="180" x2="140" y2="120" stroke="#1a202c" stroke-width="2.5" />
  <ellipse cx="120" cy="120" rx="44" ry="14" fill="#bfdbfe" stroke="#1a202c" stroke-width="2" />
  <rect x="76" y="78" width="88" height="42" fill="#bfdbfe" stroke="#1a202c" stroke-width="2" />
  <ellipse cx="120" cy="78" rx="44" ry="14" fill="#bfdbfe" stroke="#1a202c" stroke-width="2" />
  <text x="120" y="100" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">10 μF</text>
  <text x="120" y="115" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">+ —</text>

  <text x="120" y="200" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">two metal plates</text>
  <text x="120" y="214" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">separated by an insulator</text>

  <!-- Schematic symbol -->
  <text x="370" y="60" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">schematic symbol</text>
  <line x1="290" y1="120" x2="366" y2="120" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  <line x1="366" y1="104" x2="366" y2="136" stroke="#2b6cb0" stroke-width="3" />
  <line x1="374" y1="104" x2="374" y2="136" stroke="#2b6cb0" stroke-width="3" />
  <text x="370" y="96" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">C = 10 μF</text>
  <line x1="374" y1="120" x2="450" y2="120" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />

  <text x="240" y="248" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">A capacitor stores electric charge. Two parallel lines in the symbol = two parallel plates inside.</text>

</svg>
