<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Resistor real component and schematic symbol">
  <title>Resistor real component and schematic symbol</title>
  <desc>Side-by-side view: a real cylindrical resistor with four coloured value bands (brown, black, red, gold) and lead wires on the left, decoded as 1 kΩ. The right side shows the schematic zigzag symbol with R = 1 kΩ label.</desc>
  
  <text x="240" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Resistor — Real Component and Symbol</text>

  <!-- Real resistor (cylindrical body with colour bands and lead wires) -->
  <text x="120" y="60" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">real component</text>
  <line x1="40" y1="120" x2="80" y2="120" stroke="#1a202c" stroke-width="2.5" />
  <rect x="80" y="100" width="120" height="40" rx="20" fill="#fde68a" stroke="#1a202c" stroke-width="2" />
  <line x1="200" y1="120" x2="240" y2="120" stroke="#1a202c" stroke-width="2.5" />

  <!-- Colour bands (4-band code: brown, black, red, gold = 1 0 ×100 ±5% = 1 kΩ) -->
  <rect x="92" y="100" width="8" height="40" fill="#92400e" />
  <rect x="108" y="100" width="8" height="40" fill="#1a202c" />
  <rect x="124" y="100" width="8" height="40" fill="#dc2626" />
  <rect x="180" y="100" width="8" height="40" fill="#fbbf24" />

  <text x="92" y="170" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">brown</text>
  <text x="108" y="170" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">black</text>
  <text x="124" y="170" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">red</text>
  <text x="180" y="170" font="9px system-ui" font-size="9" fill="#4a5568" text-anchor="middle">gold</text>

  <text x="140" y="195" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">= 1 0 × 100 ±5% = 1 000 Ω</text>
  <text x="140" y="213" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">("one kilo-ohm, gold tolerance")</text>

  <!-- Schematic symbol -->
  <text x="370" y="60" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle">schematic symbol</text>
  <line x1="290" y1="120" x2="340" y2="120" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  <path d="M 340,120 L 345.0,112 L 355.0,128 L 365.0,112 L 375.0,128 L 385.0,112 L 395.0,128 L 400,120" fill="none" stroke="#92400e" stroke-width="2.5" stroke-linejoin="miter" />
  <text x="370" y="102" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">R = 1 kΩ</text>
  <line x1="400" y1="120" x2="450" y2="120" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />

  <text x="240" y="268" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">A resistor "pushes back" against current. The colour bands tell you exactly how much (in ohms).</text>

</svg>
