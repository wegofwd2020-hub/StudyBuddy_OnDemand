<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Simple lamp circuit">
  <title>Simple lamp circuit</title>
  <desc>A rectangular circuit loop with a 9-volt battery on the bottom, a closed switch on the top wire, and a lit amber lamp on the right wire. A green current arrow points right along the top wire showing direction of conventional current.</desc>
  
  <text x="240" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Simple Circuit — Battery, Switch, Lamp</text>

  <!-- Rectangle wires -->
  <line x1="80" y1="220" x2="80" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="80" y1="90" x2="240" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="260" y1="90" x2="400" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="400" y1="90" x2="400" y2="220" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="400" y1="220" x2="240" y2="220" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="240" y1="220" x2="80" y2="220" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Switch on top wire -->
  
  <circle cx="232" cy="90" r="3" fill="#4a5568" />
  <circle cx="268" cy="90" r="3" fill="#4a5568" />
  <line x1="232" y1="90" x2="268" y2="90" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round" />
  <text x="250" y="62" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#4a5568" text-anchor="middle">switch</text>

  <!-- Lamp on right wire (top) -->
  
  <circle cx="400" cy="155" r="36" fill="#fbbf24" opacity="0.18" />
  <circle cx="400" cy="155" r="22" fill="#fbbf24" fill-opacity="0.55" stroke="#1a202c" stroke-width="2" />
  <line x1="384.6" y1="139.6" x2="415.4" y2="170.4" stroke="#1a202c" stroke-width="2" />
  <line x1="384.6" y1="170.4" x2="415.4" y2="139.6" stroke="#1a202c" stroke-width="2" />
  <text x="400" y="195" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">lamp</text>
  <line x1="400" y1="90" x2="400" y2="133" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="400" y1="177" x2="400" y2="220" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Battery on bottom wire -->
  
  <line x1="146" y1="206" x2="146" y2="234" stroke="#1a202c" stroke-width="2.5" />
  <line x1="156" y1="198" x2="156" y2="242" stroke="#dc2626" stroke-width="3.5" />
  <line x1="166" y1="206" x2="166" y2="234" stroke="#1a202c" stroke-width="2.5" />
  <line x1="176" y1="198" x2="176" y2="242" stroke="#dc2626" stroke-width="3.5" />
  <text x="161" y="262" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">9 V battery</text>
  <text x="176" y="192" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">+</text>
  <text x="146" y="200" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">−</text>

  <!-- Current arrow on top wire -->
  
  <polygon points="180,81 180,99 190.8,90" fill="#15803d" />
  <text x="180" y="74" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">I</text>

  <!-- Caption -->
  <text x="240" y="262" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">switch closed → current flows → lamp lights up</text>
  <text x="240" y="282" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">A complete loop: battery pushes current through the switch, around the wire, through the lamp, back to the battery.</text>

</svg>
