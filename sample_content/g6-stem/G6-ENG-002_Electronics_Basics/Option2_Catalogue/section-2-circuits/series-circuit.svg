<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" role="img" aria-label="Series circuit with two lamps">
  <title>Series circuit with two lamps</title>
  <desc>A rectangular circuit with two lamps placed end-to-end on the top wire and a 9-volt battery on the bottom wire. Both lamps are lit. Two green current arrows point in the direction of flow, illustrating that the same current passes through both lamps in series.</desc>
  
  <text x="270" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Series Circuit — Two Lamps in a Single Loop</text>

  <!-- Rectangle -->
  <line x1="80" y1="220" x2="80" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="80" y1="90" x2="460" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="460" y1="90" x2="460" y2="220" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="460" y1="220" x2="80" y2="220" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Two lamps in series on top wire -->
  
  <circle cx="220" cy="90" r="32" fill="#fbbf24" opacity="0.18" />
  <circle cx="220" cy="90" r="18" fill="#fbbf24" fill-opacity="0.55" stroke="#1a202c" stroke-width="2" />
  <line x1="207.4" y1="77.4" x2="232.6" y2="102.6" stroke="#1a202c" stroke-width="2" />
  <line x1="207.4" y1="102.6" x2="232.6" y2="77.4" stroke="#1a202c" stroke-width="2" />
  <text x="220" y="126" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">lamp 1</text>
  <line x1="202" y1="90" x2="80" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="238" y1="90" x2="320" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  <circle cx="340" cy="90" r="32" fill="#fbbf24" opacity="0.18" />
  <circle cx="340" cy="90" r="18" fill="#fbbf24" fill-opacity="0.55" stroke="#1a202c" stroke-width="2" />
  <line x1="327.4" y1="77.4" x2="352.6" y2="102.6" stroke="#1a202c" stroke-width="2" />
  <line x1="327.4" y1="102.6" x2="352.6" y2="77.4" stroke="#1a202c" stroke-width="2" />
  <text x="340" y="126" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">lamp 2</text>
  <line x1="358" y1="90" x2="460" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Battery -->
  
  <line x1="266" y1="206" x2="266" y2="234" stroke="#1a202c" stroke-width="2.5" />
  <line x1="276" y1="198" x2="276" y2="242" stroke="#dc2626" stroke-width="3.5" />
  <line x1="286" y1="206" x2="286" y2="234" stroke="#1a202c" stroke-width="2.5" />
  <line x1="296" y1="198" x2="296" y2="242" stroke="#dc2626" stroke-width="3.5" />
  <text x="281" y="262" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">9 V</text>
  <text x="296" y="192" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">+</text>
  <text x="266" y="200" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">−</text>

  <!-- One current arrow (because series = same I everywhere) -->
  
  <polygon points="140,81 140,99 150.8,90" fill="#15803d" />
  <text x="140" y="74" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">I</text>
  
  <polygon points="420,211 420,229 409.2,220" fill="#15803d" />
  <text x="420" y="204" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">I</text>

  <!-- Caption: same current, voltage divides -->
  <text x="270" y="250" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">SAME current through both lamps  ·  voltage SPLITS between them</text>
  <text x="270" y="268" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">If one lamp breaks, the loop is broken — both go dark.</text>
  <text x="270" y="286" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Each lamp gets ~4.5 V (half of 9 V) — they look dimmer than a single lamp on the same battery.</text>

</svg>
