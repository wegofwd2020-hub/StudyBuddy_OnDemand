<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="LED with current-limit resistor">
  <title>LED with current-limit resistor</title>
  <desc>A simple loop with a 5-volt battery on the bottom, a 330-ohm resistor in series with a lit red LED on the top wire. A green current arrow shows I = 9 mA.</desc>
  
  <text x="240" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">LED with Current-Limit Resistor — Why It's Mandatory</text>

  <!-- Loop -->
  <line x1="80" y1="200" x2="80" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="80" y1="90" x2="400" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="400" y1="90" x2="400" y2="200" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="400" y1="200" x2="80" y2="200" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Resistor in line with LED -->
  
  <path d="M 150,90 L 155.0,82 L 165.0,98 L 175.0,82 L 185.0,98 L 195.0,82 L 205.0,98 L 210,90" fill="none" stroke="#92400e" stroke-width="2.5" stroke-linejoin="miter" />
  <text x="180" y="72" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">330 Ω</text>
  <line x1="80" y1="90" x2="150" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="210" y1="90" x2="280" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />

  <!-- LED -->
  
  <circle cx="310" cy="90" r="34" fill="#fbbf24" opacity="0.4" />
  <polygon points="298,78 298,102 318,90" fill="#dc2626" stroke="#dc2626" stroke-width="2.5" />
  <line x1="318" y1="78" x2="318" y2="102" stroke="#dc2626" stroke-width="2.5" />
  <!-- Two outgoing-light arrows -->
  <line x1="314" y1="72" x2="328" y2="60" stroke="#fbbf24" stroke-width="1.8" opacity="1" />
  <polygon points="328,60 324,66 332,66" fill="#fbbf24" opacity="1" />
  <line x1="322" y1="76" x2="336" y2="66" stroke="#fbbf24" stroke-width="1.8" opacity="1" />
  <polygon points="336,66 332,72 340,72" fill="#fbbf24" opacity="1" />
  <text x="310" y="118" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">LED</text>
  <line x1="327" y1="90" x2="400" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Battery -->
  
  <line x1="206" y1="186" x2="206" y2="214" stroke="#1a202c" stroke-width="2.5" />
  <line x1="216" y1="178" x2="216" y2="222" stroke="#dc2626" stroke-width="3.5" />
  <line x1="226" y1="186" x2="226" y2="214" stroke="#1a202c" stroke-width="2.5" />
  <line x1="236" y1="178" x2="236" y2="222" stroke="#dc2626" stroke-width="3.5" />
  <text x="221" y="242" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">5 V</text>
  <text x="236" y="172" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">+</text>
  <text x="206" y="180" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">−</text>

  <!-- Current arrow -->
  
  <polygon points="120,81 120,99 130.8,90" fill="#15803d" />
  <text x="120" y="74" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">I = 9 mA</text>

  <text x="240" y="230" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Resistor caps the current at a safe value</text>
  <text x="240" y="248" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Without the resistor: 5 V across the LED → too much current → LED burns out instantly.</text>
  <text x="240" y="266" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">A 330 Ω resistor drops ~3 V at 9 mA, leaving ~2 V for the LED — the LED's happy place.</text>

</svg>
