<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Series versus parallel circuits with a broken bulb">
  <title>Series versus parallel circuits with a broken bulb</title>
  <desc>Side-by-side comparison: left circuit is two lamps in series with both unlit and a red X marking one as broken (because the loop is broken, both go dark). Right circuit is two lamps in parallel with the left one X-marked broken but the right one still lit (because each branch is its own loop).</desc>
  
  <text x="360" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Series vs Parallel — When One Lamp Breaks</text>

  <!-- LEFT: Series with broken bulb -->
  <text x="180" y="60" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Series (one lamp broken)</text>
  <line x1="60" y1="200" x2="60" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="60" y1="100" x2="320" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="320" y1="100" x2="320" y2="200" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="320" y1="200" x2="60" y2="200" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  
  <circle cx="150" cy="100" r="16" fill="white" fill-opacity="1" stroke="#1a202c" stroke-width="2" />
  <line x1="138.8" y1="88.8" x2="161.2" y2="111.2" stroke="#1a202c" stroke-width="2" />
  <line x1="138.8" y1="111.2" x2="161.2" y2="88.8" stroke="#1a202c" stroke-width="2" />
  
  <line x1="134" y1="100" x2="60" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="166" y1="100" x2="240" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  
  <circle cx="260" cy="100" r="16" fill="white" fill-opacity="1" stroke="#1a202c" stroke-width="2" />
  <line x1="248.8" y1="88.8" x2="271.2" y2="111.2" stroke="#1a202c" stroke-width="2" />
  <line x1="248.8" y1="111.2" x2="271.2" y2="88.8" stroke="#1a202c" stroke-width="2" />
  
  <line x1="244" y1="86" x2="276" y2="114" stroke="#dc2626" stroke-width="2.5" />
  <line x1="276" y1="86" x2="244" y2="114" stroke="#dc2626" stroke-width="2.5" />
  <text x="260" y="138" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">BROKEN</text>
  <text x="150" y="138" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">also dark</text>
  
  <line x1="176" y1="186" x2="176" y2="214" stroke="#1a202c" stroke-width="2.5" />
  <line x1="186" y1="178" x2="186" y2="222" stroke="#dc2626" stroke-width="3.5" />
  <line x1="196" y1="186" x2="196" y2="214" stroke="#1a202c" stroke-width="2.5" />
  <line x1="206" y1="178" x2="206" y2="222" stroke="#dc2626" stroke-width="3.5" />
  <text x="191" y="242" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">9 V</text>
  <text x="206" y="172" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">+</text>
  <text x="176" y="180" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">−</text>
  <text x="180" y="240" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">↳ both go dark · loop is broken</text>

  <!-- Vertical divider -->
  <line x1="370" y1="80" x2="370" y2="320" stroke="#4a5568" stroke-width="1" stroke-dasharray="4 4" />

  <!-- RIGHT: Parallel with broken bulb -->
  <text x="540" y="60" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Parallel (one lamp broken)</text>
  <line x1="420" y1="220" x2="420" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="420" y1="100" x2="660" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="660" y1="100" x2="660" y2="220" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="420" y1="220" x2="660" y2="220" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="460" y1="100" x2="460" y2="130" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  
  <circle cx="460" cy="152" r="16" fill="white" fill-opacity="1" stroke="#1a202c" stroke-width="2" />
  <line x1="448.8" y1="140.8" x2="471.2" y2="163.2" stroke="#1a202c" stroke-width="2" />
  <line x1="448.8" y1="163.2" x2="471.2" y2="140.8" stroke="#1a202c" stroke-width="2" />
  
  <line x1="446" y1="138" x2="474" y2="166" stroke="#dc2626" stroke-width="2.5" />
  <line x1="474" y1="138" x2="446" y2="166" stroke="#dc2626" stroke-width="2.5" />
  <text x="460" y="195" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">BROKEN</text>
  <line x1="460" y1="174" x2="460" y2="220" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="620" y1="100" x2="620" y2="130" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  <circle cx="620" cy="152" r="30" fill="#fbbf24" opacity="0.18" />
  <circle cx="620" cy="152" r="16" fill="#fbbf24" fill-opacity="0.55" stroke="#1a202c" stroke-width="2" />
  <line x1="608.8" y1="140.8" x2="631.2" y2="163.2" stroke="#1a202c" stroke-width="2" />
  <line x1="608.8" y1="163.2" x2="631.2" y2="140.8" stroke="#1a202c" stroke-width="2" />
  
  <line x1="620" y1="174" x2="620" y2="220" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <text x="620" y="195" font="bold 10px system-ui" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">still on</text>
  
  <line x1="476" y1="206" x2="476" y2="234" stroke="#1a202c" stroke-width="2.5" />
  <line x1="486" y1="198" x2="486" y2="242" stroke="#dc2626" stroke-width="3.5" />
  <line x1="496" y1="206" x2="496" y2="234" stroke="#1a202c" stroke-width="2.5" />
  <line x1="506" y1="198" x2="506" y2="242" stroke="#dc2626" stroke-width="3.5" />
  <text x="491" y="262" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">9 V</text>
  <text x="506" y="192" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">+</text>
  <text x="476" y="200" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">−</text>
  <text x="540" y="280" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">↳ second lamp stays lit · second loop intact</text>

  <text x="360" y="350" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">This is why the wiring in your house is mostly parallel — one bulb burning out shouldn't kill the rest.</text>

</svg>
