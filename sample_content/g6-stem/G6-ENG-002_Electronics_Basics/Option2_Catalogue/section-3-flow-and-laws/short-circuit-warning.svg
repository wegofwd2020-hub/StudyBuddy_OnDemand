<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280" role="img" aria-label="Short circuit warning diagram">
  <title>Short circuit warning diagram</title>
  <desc>A circuit with a lamp on the top wire X-marked as bypassed, and a thick red wire jumping straight across from the wire above the battery to the wire below — short-circuiting the lamp. A red 'SHORT!' label and a 'I = HUGE' current arrow indicate the runaway-current danger.</desc>
  
  <text x="270" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">⚠ Short Circuit — Don't Do This</text>

  <!-- Outer loop with a lamp on top -->
  <line x1="80" y1="200" x2="80" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="80" y1="90" x2="460" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="460" y1="90" x2="460" y2="200" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="460" y1="200" x2="80" y2="200" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Lamp on top -->
  
  
  <circle cx="270" cy="90" r="18" fill="white" fill-opacity="1" stroke="#1a202c" stroke-width="2" />
  <line x1="257.4" y1="77.4" x2="282.6" y2="102.6" stroke="#1a202c" stroke-width="2" />
  <line x1="257.4" y1="102.6" x2="282.6" y2="77.4" stroke="#1a202c" stroke-width="2" />
  
  <line x1="80" y1="90" x2="252" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="288" y1="90" x2="460" y2="90" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Short-circuit wire (red, going across, bypassing the lamp) -->
  <line x1="180" y1="90" x2="180" y2="160" stroke="#dc2626" stroke-width="3" />
  <line x1="180" y1="160" x2="360" y2="160" stroke="#dc2626" stroke-width="3" />
  <line x1="360" y1="160" x2="360" y2="90" stroke="#dc2626" stroke-width="3" />

  <!-- X warning on the lamp -->
  <line x1="252" y1="72" x2="288" y2="108" stroke="#dc2626" stroke-width="2.5" />
  <line x1="288" y1="72" x2="252" y2="108" stroke="#dc2626" stroke-width="2.5" />

  <!-- Big "SHORT!" callout -->
  <text x="270" y="178" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle">SHORT!</text>
  <text x="270" y="195" font="11px system-ui" font-size="11" fill="#dc2626" text-anchor="middle">no resistance → huge current</text>

  <!-- Big current arrow on the short -->
  
  <polygon points="220,151 220,169 230.8,160" fill="#15803d" />
  
  <text x="220" y="143" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">I = HUGE</text>

  <!-- Battery -->
  
  <line x1="256" y1="186" x2="256" y2="214" stroke="#1a202c" stroke-width="2.5" />
  <line x1="266" y1="178" x2="266" y2="222" stroke="#dc2626" stroke-width="3.5" />
  <line x1="276" y1="186" x2="276" y2="214" stroke="#1a202c" stroke-width="2.5" />
  <line x1="286" y1="178" x2="286" y2="222" stroke="#dc2626" stroke-width="3.5" />
  <text x="271" y="242" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">9 V</text>
  <text x="286" y="172" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">+</text>
  <text x="256" y="180" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">−</text>

  <text x="270" y="250" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">A wire with no load straight across the battery → the battery overheats, melts, or catches fire.</text>
  <text x="270" y="268" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Always have something — a lamp, resistor, motor — between battery + and battery −. Never plain wire.</text>

</svg>
