<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Open versus closed switch comparison">
  <title>Open versus closed switch comparison</title>
  <desc>Two side-by-side identical lamp circuits. Left: switch shown open with the lamp unlit (no current can flow through the gap). Right: switch shown closed with the lamp lit and a green current arrow (loop is complete).</desc>
  
  <text x="360" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Open vs Closed Switch — The Difference Is Everything</text>

  <!-- LEFT: open switch -->
  <text x="180" y="60" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">switch OPEN  →  no current  →  lamp dark</text>
  <line x1="60" y1="200" x2="60" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="60" y1="100" x2="320" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="320" y1="100" x2="320" y2="200" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="320" y1="200" x2="60" y2="200" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  <circle cx="132" cy="100" r="3" fill="#4a5568" />
  <circle cx="168" cy="100" r="3" fill="#4a5568" />
  <line x1="132" y1="100" x2="164" y2="84" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round" />
  
  
  
  <circle cx="280" cy="100" r="16" fill="white" fill-opacity="1" stroke="#1a202c" stroke-width="2" />
  <line x1="268.8" y1="88.8" x2="291.2" y2="111.2" stroke="#1a202c" stroke-width="2" />
  <line x1="268.8" y1="111.2" x2="291.2" y2="88.8" stroke="#1a202c" stroke-width="2" />
  
  <line x1="132" y1="100" x2="60" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="168" y1="100" x2="264" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="296" y1="100" x2="320" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  <line x1="176" y1="186" x2="176" y2="214" stroke="#1a202c" stroke-width="2.5" />
  <line x1="186" y1="178" x2="186" y2="222" stroke="#dc2626" stroke-width="3.5" />
  <line x1="196" y1="186" x2="196" y2="214" stroke="#1a202c" stroke-width="2.5" />
  <line x1="206" y1="178" x2="206" y2="222" stroke="#dc2626" stroke-width="3.5" />
  <text x="191" y="242" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">9 V</text>
  <text x="206" y="172" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">+</text>
  <text x="176" y="180" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">−</text>
  <text x="180" y="248" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">loop has a gap → electrons can't get around</text>

  <line x1="370" y1="80" x2="370" y2="240" stroke="#4a5568" stroke-width="1" stroke-dasharray="4 4" />

  <!-- RIGHT: closed switch -->
  <text x="540" y="60" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">switch CLOSED  →  current flows  →  lamp lit</text>
  <line x1="420" y1="200" x2="420" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="420" y1="100" x2="680" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="680" y1="100" x2="680" y2="200" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="680" y1="200" x2="420" y2="200" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  <circle cx="492" cy="100" r="3" fill="#4a5568" />
  <circle cx="528" cy="100" r="3" fill="#4a5568" />
  <line x1="492" y1="100" x2="528" y2="100" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round" />
  
  
  <circle cx="640" cy="100" r="30" fill="#fbbf24" opacity="0.18" />
  <circle cx="640" cy="100" r="16" fill="#fbbf24" fill-opacity="0.55" stroke="#1a202c" stroke-width="2" />
  <line x1="628.8" y1="88.8" x2="651.2" y2="111.2" stroke="#1a202c" stroke-width="2" />
  <line x1="628.8" y1="111.2" x2="651.2" y2="88.8" stroke="#1a202c" stroke-width="2" />
  
  <line x1="492" y1="100" x2="420" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="528" y1="100" x2="624" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="656" y1="100" x2="680" y2="100" stroke="#1a202c" stroke-width="2.5" stroke-linecap="round" />
  
  <line x1="536" y1="186" x2="536" y2="214" stroke="#1a202c" stroke-width="2.5" />
  <line x1="546" y1="178" x2="546" y2="222" stroke="#dc2626" stroke-width="3.5" />
  <line x1="556" y1="186" x2="556" y2="214" stroke="#1a202c" stroke-width="2.5" />
  <line x1="566" y1="178" x2="566" y2="222" stroke="#dc2626" stroke-width="3.5" />
  <text x="551" y="242" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">9 V</text>
  <text x="566" y="172" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">+</text>
  <text x="536" y="180" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">−</text>
  
  <polygon points="460,91 460,109 470.8,100" fill="#15803d" />
  <text x="460" y="84" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">I</text>
  <text x="540" y="248" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">loop is complete → current flows from + to − to +</text>

</svg>
