<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280" role="img" aria-label="Cell membrane phospholipid bilayer">
  <title>Cell membrane phospholipid bilayer</title>
  <desc>A horizontal cross-section of a cell membrane showing two rows of phospholipid molecules. The top row has blue circular heads facing upward (toward outside-of-cell water) and tails dangling down; the bottom row mirrors it (heads down toward inside-of-cell water, tails up). A green protein channel is embedded across both rows. A single phospholipid is enlarged on the right with head and tails labelled.</desc>
  
  <text x="270" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Cell Membrane — Phospholipid Bilayer</text>

  <!-- Water labels -->
  <text x="40" y="60" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#2b6cb0">outside cell</text>
  <text x="40" y="78" font="11px system-ui" font-size="11" fill="#2b6cb0">(water)</text>
  <text x="40" y="220" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#2b6cb0">inside cell</text>
  <text x="40" y="238" font="11px system-ui" font-size="11" fill="#2b6cb0">(water)</text>

