  <!-- Single phospholipid callout (right side) -->
  <g transform="translate(470 130)">
    <circle cx="0" cy="0" r="14" fill="#2b6cb0" stroke="#1a202c" stroke-width="1.2" />
    <text x="0" y="3" font="bold 9px system-ui" font-size="9" font-weight="700" fill="white" text-anchor="middle">head</text>
    <text x="0" y="-22" font="10px system-ui" font-size="10" fill="#2b6cb0" text-anchor="middle">water-loving</text>
    <line x1="-5" y1="14" x2="-5" y2="50" stroke="#0c4a6e" stroke-width="2.5" />
    <line x1="5" y1="14" x2="5" y2="50" stroke="#0c4a6e" stroke-width="2.5" />
    <text x="0" y="68" font="10px system-ui" font-size="10" fill="#0c4a6e" text-anchor="middle">tails</text>
    <text x="0" y="82" font="10px system-ui" font-size="10" fill="#0c4a6e" text-anchor="middle">water-fearing</text>
  </g>

  <text x="270" y="266" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Heads love water and face outward. Tails fear water and hide in the middle. The cell's outer wall is two of these in a back-to-back layer.</text>

</svg>
