<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="Labeled animal cell with major organelles">
  <title>Labeled animal cell with major organelles</title>
  <desc>An animal cell shown as an irregular blob outlined by a cell membrane. Inside: a purple nucleus with a smaller nucleolus, three red bean-shaped mitochondria, an orange rough endoplasmic reticulum sprinkled with brown ribosome dots, an amber Golgi apparatus stack, two pink lysosomes, a slate centrosome, and free ribosomes in the cytoplasm. Each organelle has a leader-line label on the right side.</desc>
  
  <text x="360" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Animal Cell — Major Parts</text>

  <!-- Cell membrane (just the outline) -->
  <path d="M 80 240 Q 80 40, 280 20 T 640 210 Q 650 420, 440 460 T 80 240" fill="#fef9c3" stroke="#94a3b8" stroke-width="3.5" />

  <!-- Nucleus (off-center) -->
  <ellipse cx="330" cy="220" rx="80" ry="68" fill="#7c3aed" opacity="0.85" stroke="#1a202c" stroke-width="1.8" />
  <circle cx="310" cy="210" r="18" fill="#a855f7" stroke="#1a202c" stroke-width="1.2" />

  <!-- Mitochondria (3 of them, scattered) -->
  <ellipse cx="490" cy="160" rx="38" ry="20" fill="#dc2626" opacity="0.85" stroke="#1a202c" stroke-width="1.5" transform="rotate(-20 490 160)" />
  <ellipse cx="460" cy="350" rx="34" ry="18" fill="#dc2626" opacity="0.85" stroke="#1a202c" stroke-width="1.5" transform="rotate(35 460 350)" />
  <ellipse cx="190" cy="320" rx="32" ry="17" fill="#dc2626" opacity="0.85" stroke="#1a202c" stroke-width="1.5" transform="rotate(-50 190 320)" />

  <!-- Endoplasmic reticulum (rough), squiggly path with dots -->
  <path d="M 180 160 Q 230 110, 280 150 T 380 170 T 460 130"
    fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round" />
  <circle cx="379.0" cy="140.0" r="2.2" fill="#7c2d12" /><circle cx="295.8" cy="145.8" r="2.2" fill="#7c2d12" /><circle cx="264.6" cy="142.8" r="2.2" fill="#7c2d12" /><circle cx="189.3" cy="135.3" r="2.2" fill="#7c2d12" /><circle cx="273.4" cy="130.8" r="2.2" fill="#7c2d12" /><circle cx="291.6" cy="138.9" r="2.2" fill="#7c2d12" /><circle cx="348.9" cy="147.9" r="2.2" fill="#7c2d12" /><circle cx="266.1" cy="152.0" r="2.2" fill="#7c2d12" /><circle cx="269.1" cy="140.4" r="2.2" fill="#7c2d12" /><circle cx="238.6" cy="131.2" r="2.2" fill="#7c2d12" /><circle cx="322.2" cy="127.1" r="2.2" fill="#7c2d12" /><circle cx="296.5" cy="140.2" r="2.2" fill="#7c2d12" /><circle cx="297.0" cy="147.6" r="2.2" fill="#7c2d12" /><circle cx="210.2" cy="151.2" r="2.2" fill="#7c2d12" />

  <!-- Golgi apparatus (stacked curves) -->
  <g>
    <path d="M 160 370 Q 210 350, 260 370" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
    <path d="M 160 385 Q 210 365, 260 385" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
    <path d="M 160 400 Q 210 380, 260 400" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Lysosomes (small pink circles) -->
  <circle cx="540" cy="290" r="14" fill="#f472b6" stroke="#1a202c" stroke-width="1" />
  <circle cx="150" cy="180" r="11" fill="#f472b6" stroke="#1a202c" stroke-width="1" />

  <!-- Centrosome (slate, near nucleus) -->
  <g transform="translate(410 290)">
    <rect x="-8" y="-3" width="16" height="6" fill="#64748b" />
    <rect x="-3" y="-8" width="6" height="16" fill="#64748b" />
  </g>

  <!-- Free ribosomes scattered in cytoplasm -->
  <circle cx="614.0" cy="390.0" r="2.2" fill="#7c2d12" /><circle cx="562.2" cy="396.2" r="2.2" fill="#7c2d12" /><circle cx="530.8" cy="395.2" r="2.2" fill="#7c2d12" /><circle cx="537.3" cy="370.1" r="2.2" fill="#7c2d12" /><circle cx="564.7" cy="388.1" r="2.2" fill="#7c2d12" /><circle cx="597.0" cy="405.8" r="2.2" fill="#7c2d12" /><circle cx="546.2" cy="401.6" r="2.2" fill="#7c2d12" /><circle cx="545.4" cy="387.2" r="2.2" fill="#7c2d12" /><circle cx="570.1" cy="363.6" r="2.2" fill="#7c2d12" />

  <!-- Leader-line labels (right side) -->
  
  <line x1="240" y1="180" x2="680" y2="10" stroke="#7c3aed" stroke-width="1.5" />
  <text x="684" y="14"
    font="bold 13px system-ui" font-size="13" font-weight="700"
    fill="#7c3aed" text-anchor="start">Nucleus (control center)</text>
  
  <line x1="490" y1="160" x2="680" y2="60" stroke="#dc2626" stroke-width="1.5" />
  <text x="684" y="64"
    font="bold 13px system-ui" font-size="13" font-weight="700"
    fill="#dc2626" text-anchor="start">Mitochondrion (powerhouse)</text>
  
  <line x1="280" y1="145" x2="680" y2="110" stroke="#ea580c" stroke-width="1.5" />
  <text x="684" y="114"
    font="bold 13px system-ui" font-size="13" font-weight="700"
    fill="#ea580c" text-anchor="start">Rough ER (protein-making)</text>
  
  <line x1="210" y1="380" x2="680" y2="160" stroke="#f59e0b" stroke-width="1.5" />
  <text x="684" y="164"
    font="bold 13px system-ui" font-size="13" font-weight="700"
    fill="#f59e0b" text-anchor="start">Golgi (packaging)</text>
  
  <line x1="540" y1="290" x2="680" y2="210" stroke="#f472b6" stroke-width="1.5" />
  <text x="684" y="214"
    font="bold 13px system-ui" font-size="13" font-weight="700"
    fill="#f472b6" text-anchor="start">Lysosome (digestion)</text>
  
  <line x1="410" y1="290" x2="680" y2="260" stroke="#64748b" stroke-width="1.5" />
  <text x="684" y="264"
    font="bold 13px system-ui" font-size="13" font-weight="700"
    fill="#64748b" text-anchor="start">Centrosome</text>
  
  <line x1="650" y1="200" x2="680" y2="310" stroke="#94a3b8" stroke-width="1.5" />
  <text x="684" y="314"
    font="bold 13px system-ui" font-size="13" font-weight="700"
    fill="#94a3b8" text-anchor="start">Cell membrane</text>
  
  <line x1="580" y1="400" x2="680" y2="360" stroke="#854d0e" stroke-width="1.5" />
  <text x="684" y="364"
    font="bold 13px system-ui" font-size="13" font-weight="700"
    fill="#854d0e" text-anchor="start">Cytoplasm (jelly)</text>

</svg>
