<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Light vs electron microscope comparison">
  <title>Light vs electron microscope comparison</title>
  <desc>Two side-by-side circular views of the same cell. Left: a soft cream-and-purple light-microscope view labelled '~1000× magnification' with blurred organelles, captioned 'live cells, in colour'. Right: a sharp grey-on-black electron-microscope view labelled '~500,000× magnification' with crisp organelle outlines, captioned 'tiny parts visible, only dead cells, black-and-white'.</desc>
  
  <text x="360" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">What You See — Light vs Electron Microscope</text>

  <!-- Left: light microscope view of an animal cell (blurry, low detail) -->
  <g>
    <circle cx="180" cy="170" r="105" fill="#f7fafc" stroke="#1a202c" stroke-width="2" />
    <ellipse cx="175" cy="160" rx="70" ry="55" fill="#fef9c3" stroke="#94a3b8" stroke-width="2.5" filter="blur(0.6px)" />
    <ellipse cx="180" cy="155" rx="20" ry="16" fill="#7c3aed" opacity="0.7" filter="blur(0.8px)" />
    <ellipse cx="150" cy="180" rx="6" ry="3" fill="#dc2626" opacity="0.6" filter="blur(0.7px)" />
    <text x="180" y="64" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">Light Microscope</text>
    <text x="180" y="84" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">~1000× magnification</text>
    <text x="180" y="296" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">✓ live cells, in colour</text>
    <text x="180" y="310" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">but small parts blur together</text>
  </g>

  <!-- Right: electron microscope view of same cell (sharp, lots of detail, monochrome) -->
  <g>
    <circle cx="540" cy="170" r="105" fill="#0f172a" stroke="#1a202c" stroke-width="2" />
    <ellipse cx="535" cy="160" rx="70" ry="55" fill="#374151" stroke="#9ca3af" stroke-width="2" />
    <ellipse cx="540" cy="155" rx="22" ry="17" fill="#111827" stroke="#9ca3af" stroke-width="1.5" />
    <circle cx="544" cy="151" r="6" fill="#1f2937" stroke="#9ca3af" stroke-width="0.8" />
    <ellipse cx="510" cy="180" rx="8" ry="4" fill="#1f2937" stroke="#9ca3af" stroke-width="1" />
    <ellipse cx="565" cy="190" rx="7" ry="3.5" fill="#1f2937" stroke="#9ca3af" stroke-width="1" />
    <!-- ER squiggle (sharp, monochrome) -->
    <path d="M 500 190 Q 520 200, 550 193 T 590 188" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <text x="540" y="64" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#2b6cb0" text-anchor="middle">Electron Microscope</text>
    <text x="540" y="84" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">~500,000× magnification</text>
    <text x="540" y="296" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">✓ tiny parts visible</text>
    <text x="540" y="310" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">but only dead cells, black-and-white</text>
  </g>

  <!-- Center divider -->
  <line x1="360" y1="50" x2="360" y2="290" stroke="#4a5568" stroke-width="1" stroke-dasharray="4 4" />

</svg>
