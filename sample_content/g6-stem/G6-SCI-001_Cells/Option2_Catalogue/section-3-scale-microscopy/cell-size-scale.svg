<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Cell size scale chart">
  <title>Cell size scale chart</title>
  <desc>A horizontal logarithmic scale bar with five ticks from 100 nm (virus) to 1 mm (grain of sand). Above the bar, five small icons mark virus, bacterium, animal cell, plant cell, and grain of sand at their respective scale positions. Below the bar, three coloured ranges indicate which microscopy is required: electron microscope, light microscope, and naked eye.</desc>
  
  <text x="360" y="22" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">How Big is a Cell? Logarithmic Scale</text>

  <!-- Main horizontal axis -->
  <line x1="80" y1="160" x2="660" y2="160" stroke="#1a202c" stroke-width="2" />
  <polygon points="660,160 650,155 650,165" fill="#1a202c" />

  <!-- Scale ticks (decade markers): 100 nm, 1 μm, 10 μm, 100 μm, 1 mm -->

  <line x1="100" y1="155" x2="100" y2="170" stroke="#1a202c" stroke-width="2" />
  <text x="100" y="190" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">100 nm</text>
  <line x1="230" y1="155" x2="230" y2="170" stroke="#1a202c" stroke-width="2" />
  <text x="230" y="190" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">1 μm</text>
  <line x1="380" y1="155" x2="380" y2="170" stroke="#1a202c" stroke-width="2" />
  <text x="380" y="190" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">10 μm</text>
  <line x1="540" y1="155" x2="540" y2="170" stroke="#1a202c" stroke-width="2" />
  <text x="540" y="190" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">100 μm</text>
  <line x1="660" y1="155" x2="660" y2="170" stroke="#1a202c" stroke-width="2" />
  <text x="660" y="190" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#1a202c" text-anchor="middle">1 mm</text>
    <polygon points="94,110 94,100 100,94 106,100 106,110 100,116" fill="#c026d3" stroke="#1a202c" stroke-width="1" />
    <text x="100" y="50" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#c026d3" text-anchor="middle">virus</text>
    <text x="100" y="66" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">100 nm</text>
    <line x1="100" y1="116" x2="100" y2="155" stroke="#4a5568" stroke-width="1" stroke-dasharray="2 3" />
    <rect x="218" y="100" width="24" height="10" rx="5" fill="#0891b2" stroke="#1a202c" stroke-width="1" />
    <text x="230" y="50" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#0891b2" text-anchor="middle">bacterium</text>
    <text x="230" y="66" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">1–5 μm</text>
    <line x1="230" y1="116" x2="230" y2="155" stroke="#4a5568" stroke-width="1" stroke-dasharray="2 3" />
    <ellipse cx="380" cy="105" rx="22" ry="16" fill="#fef9c3" stroke="#94a3b8" stroke-width="1.8" />
              <ellipse cx="384" cy="103" rx="6" ry="5" fill="#7c3aed" />
    <text x="380" y="50" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">animal cell</text>
    <text x="380" y="66" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">10–30 μm</text>
    <line x1="380" y1="116" x2="380" y2="155" stroke="#4a5568" stroke-width="1" stroke-dasharray="2 3" />
    <rect x="512" y="80" width="56" height="50" rx="4" fill="#a16207" />
              <rect x="516" y="84" width="48" height="42" rx="2" fill="#fef9c3" />
              <ellipse cx="528" cy="93" rx="6" ry="4" fill="#7c3aed" />
              <ellipse cx="554" cy="115" rx="5" ry="3" fill="#16a34a" />
    <text x="540" y="50" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">plant cell</text>
    <text x="540" y="66" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">50–100 μm</text>
    <line x1="540" y1="130" x2="540" y2="155" stroke="#4a5568" stroke-width="1" stroke-dasharray="2 3" />
    <polygon points="642,115 678,115 672,85 652,80" fill="#a16207" stroke="#1a202c" stroke-width="1.2" />
    <text x="660" y="50" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#a16207" text-anchor="middle">grain of sand</text>
    <text x="660" y="66" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">~1 mm</text>
    <line x1="660" y1="116" x2="660" y2="155" stroke="#4a5568" stroke-width="1" stroke-dasharray="2 3" />
  <line x1="80" y1="220" x2="350" y2="220" stroke="#2b6cb0" stroke-width="3" />
  <text x="215" y="244" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="middle">needs an electron microscope</text>

  <line x1="350" y1="220" x2="600" y2="220" stroke="#15803d" stroke-width="3" />
  <text x="475" y="244" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">light microscope works</text>

  <line x1="600" y1="220" x2="660" y2="220" stroke="#dd6b20" stroke-width="3" />
  <text x="630" y="244" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dd6b20" text-anchor="middle">visible to the naked eye</text>

  <text x="360" y="268" font="10px system-ui" font-size="10" fill="#4a5568" text-anchor="middle">Note: scale is logarithmic — each tick is ten times bigger than the previous one.</text>

</svg>
