<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Interference versus diffraction comparison card">
  <title>Interference versus diffraction comparison card</title>
  <desc>Two-card comparison side by side: left card describes interference (two sources, equally-spaced fringes, Δy = λL/d, fringes equally bright, double-slit canonical setup). Right card describes diffraction (single source, central peak with side lobes, first minimum at sin θ = λ/a, central much brighter, single-slit canonical setup).</desc>
  
  <text x="300" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Interference vs Diffraction</text>

  <g>
    <rect x="40" y="60" width="240" height="220" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="2" />
    <text x="160" y="86" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#2b6cb0" text-anchor="middle">Interference</text>
    <text x="60" y="120" font="13px system-ui" font-size="13" fill="#1a202c">cause:</text>
    <text x="270" y="120" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">two (or more) sources</text>
    <text x="60" y="150" font="13px system-ui" font-size="13" fill="#1a202c">pattern:</text>
    <text x="270" y="150" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">equally-spaced fringes</text>
    <text x="60" y="180" font="13px system-ui" font-size="13" fill="#1a202c">spacing:</text>
    <text x="270" y="180" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">Δy = λL/d</text>
    <text x="60" y="210" font="13px system-ui" font-size="13" fill="#1a202c">brightness:</text>
    <text x="270" y="210" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">all fringes ≈ same</text>
    <text x="60" y="240" font="13px system-ui" font-size="13" fill="#1a202c">canonical setup:</text>
    <text x="270" y="240" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">double slit</text>
  </g>

  <g>
    <rect x="320" y="60" width="240" height="220" rx="10" fill="#f7fafc" stroke="#dd6b20" stroke-width="2" />
    <text x="440" y="86" font="bold 16px system-ui" font-size="16" font-weight="700" fill="#dd6b20" text-anchor="middle">Diffraction</text>
    <text x="340" y="120" font="13px system-ui" font-size="13" fill="#1a202c">cause:</text>
    <text x="550" y="120" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">single source spreading</text>
    <text x="340" y="150" font="13px system-ui" font-size="13" fill="#1a202c">pattern:</text>
    <text x="550" y="150" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">central peak + side lobes</text>
    <text x="340" y="180" font="13px system-ui" font-size="13" fill="#1a202c">first minimum:</text>
    <text x="550" y="180" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">sin θ = λ/a</text>
    <text x="340" y="210" font="13px system-ui" font-size="13" fill="#1a202c">brightness:</text>
    <text x="550" y="210" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">central ≫ sides</text>
    <text x="340" y="240" font="13px system-ui" font-size="13" fill="#1a202c">canonical setup:</text>
    <text x="550" y="240" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#1a202c" text-anchor="end">single slit</text>
  </g>

  <text x="300" y="308" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Both are wave behaviour. Interference combines waves from multiple paths; diffraction is what one path does by itself.</text>

</svg>
