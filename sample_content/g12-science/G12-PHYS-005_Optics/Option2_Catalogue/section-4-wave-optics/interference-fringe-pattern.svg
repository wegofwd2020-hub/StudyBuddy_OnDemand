<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Two-slit interference fringe pattern">
  <title>Two-slit interference fringe pattern</title>
  <desc>Left: a black screen with seven horizontal bright fringes equally spaced. Right: an intensity-vs-position plot showing the cos² oscillation with peaks at the bright fringes. The spacing between adjacent fringes is labelled Δy.</desc>
  
  <text x="300" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Interference Fringe Pattern on the Screen</text>
  <text x="300" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Equally-spaced bright bands separated by dark bands. Fringe spacing Δy = λL/d.</text>

