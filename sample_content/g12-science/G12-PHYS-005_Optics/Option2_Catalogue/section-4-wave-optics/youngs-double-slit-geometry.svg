<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Youngs double slit experiment geometry">
  <title>Youngs double slit experiment geometry</title>
  <desc>A point light source on the left feeds light into a barrier with two slits separated by distance d. Two beams pass through the slits and reach a vertical screen on the right, distance L away. A point P on the screen at height y above the centreline is marked. Caption gives the bright-fringe condition and the spacing formula Δy = λL/d.</desc>
  
  <text x="360" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Young's Double-Slit Geometry</text>
  <text x="360" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Light passes through two narrow slits and interferes on a distant screen.</text>

  <!-- Source -->
  <circle cx="80" cy="170" r="14" fill="#dc2626" />
  <text x="80" y="200" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">source</text>

  <!-- Two slits -->
  <line x1="200" y1="80" x2="200" y2="160" stroke="#1a202c" stroke-width="3" />
  <line x1="200" y1="180" x2="200" y2="260" stroke="#1a202c" stroke-width="3" />
  <text x="200" y="40" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">two slits, separation d</text>
  <line x1="190" y1="160" x2="190" y2="180" stroke="#dd6b20" stroke-width="2" />
  <line x1="180" y1="160" x2="180" y2="180" stroke="#dd6b20" stroke-width="2" />
  <text x="170" y="174" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dd6b20" text-anchor="end">d</text>

  <!-- Light from source to slits -->
  <line x1="94" y1="170" x2="200" y2="170" stroke="#dc2626" stroke-width="2" />

  <!-- Two paths to a screen point P -->
  <line x1="200" y1="170" x2="600" y2="120" stroke="#dc2626" stroke-width="1.5" />
  <line x1="200" y1="170" x2="600" y2="120" stroke="#dc2626" stroke-width="1.5" />

  <!-- Screen on right -->
  <line x1="600" y1="60" x2="600" y2="280" stroke="#1a202c" stroke-width="3" />
  <text x="600" y="48" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">screen</text>

  <!-- Distance L between slits and screen -->
  <line x1="200" y1="288" x2="600" y2="288" stroke="#4a5568" stroke-width="1.5" />
  <line x1="200" y1="284" x2="200" y2="292" stroke="#4a5568" stroke-width="1.5" />
  <line x1="600" y1="284" x2="600" y2="292" stroke="#4a5568" stroke-width="1.5" />
  <text x="400" y="304" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#4a5568" text-anchor="middle">distance L</text>

  <!-- Point P on screen -->
  <circle cx="600" cy="120" r="6" fill="#15803d" />
  <text x="612" y="118" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d">P</text>
  <line x1="600" y1="170" x2="600" y2="120" stroke="#15803d" stroke-width="1.5" stroke-dasharray="3 3" />
  <text x="616" y="148" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#15803d">y</text>

  <!-- Path-difference highlight -->
  <text x="360" y="308" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#2b6cb0" text-anchor="middle">Bright fringe at P when path difference = nλ.  Fringe spacing  Δy = λL/d.</text>

</svg>
