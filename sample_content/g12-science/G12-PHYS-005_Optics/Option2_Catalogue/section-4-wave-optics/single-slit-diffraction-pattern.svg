<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Single slit diffraction pattern">
  <title>Single slit diffraction pattern</title>
  <desc>A single narrow slit on the left feeds a fan of light to a vertical screen on the right. The screen shows a sinc²-shaped intensity profile: one tall central maximum flanked by symmetric side lobes that decay rapidly. Annotations identify the central maximum and the first minimum at sin θ = λ/a.</desc>
  
  <text x="300" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Single-Slit Diffraction Pattern</text>
  <text x="300" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">A single narrow slit produces one big central peak and progressively-fainter side lobes.</text>

  <!-- Slit setup -->
  <line x1="80" y1="120" x2="80" y2="180" stroke="#1a202c" stroke-width="3" />
  <line x1="80" y1="200" x2="80" y2="260" stroke="#1a202c" stroke-width="3" />
  <text x="80" y="100" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle">slit width a</text>
  <line x1="60" y1="180" x2="60" y2="200" stroke="#dd6b20" stroke-width="2" />
  <text x="50" y="194" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dd6b20" text-anchor="end">a</text>

  <!-- Light fan after slit -->
  <line x1="80" y1="190" x2="540" y2="100" stroke="#dc2626" stroke-width="1.2" opacity="0.6" />
  <line x1="80" y1="190" x2="540" y2="280" stroke="#dc2626" stroke-width="1.2" opacity="0.6" />
  <line x1="80" y1="190" x2="540" y2="190" stroke="#dc2626" stroke-width="2" />
