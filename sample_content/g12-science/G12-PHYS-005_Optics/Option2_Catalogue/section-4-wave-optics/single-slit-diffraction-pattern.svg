al maximum (bright)</text><text x="320" y="240" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#2b6cb0">first minimum at sin θ = λ/a</text>
  <text x="300" y="330" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Narrower slit → wider central peak. Wider slit → tighter peak.</text>
  <text x="300" y="346" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">First dark band at sin θ = λ/a. Side lobes are about 4–5% as bright as the central maximum.</text>

</svg>
