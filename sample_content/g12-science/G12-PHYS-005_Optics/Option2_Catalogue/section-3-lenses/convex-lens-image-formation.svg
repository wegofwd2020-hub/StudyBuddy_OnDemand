<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Convex lens image formation">
  <title>Convex lens image formation</title>
  <desc>A horizontal optical bench with a vertical converging-lens shape in the centre. Focal points F and F' on either side of the lens. A green object arrow stands on the left beyond 2F; three principal red rays from the top of the object pass through the lens and converge to form a smaller inverted red image arrow on the right between F' and 2F'.</desc>
  
  <text x="300" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Convex (Converging) Lens — Image Formation</text>

  <line x1="60" y1="180" x2="540" y2="180" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- Lens (vertical lens-shape) -->
  <ellipse cx="300" cy="180" rx="14" ry="100" fill="#bfdbfe" stroke="#1a202c" stroke-width="2" />

  <!-- F1 and F2 -->
  <circle cx="220" cy="180" r="4" fill="#2b6cb0" />
  <text x="220" y="198" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">F</text>
  <circle cx="380" cy="180" r="4" fill="#2b6cb0" />
  <text x="380" y="198" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">F'</text>

  <!-- Object (beyond 2F on the left) -->
<line x1="100" y1="180" x2="100" y2="120" stroke="#15803d" stroke-width="3" /><polygon points="94,128 106,128 100,120" fill="#15803d" /><text x="100" y="112" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">object</text><line x1="440" y1="180" x2="440" y2="218" stroke="#dc2626" stroke-width="3" /><polygon points="434,210 446,210 440,218" fill="#dc2626" /><text x="440" y="236" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">image (real, inverted)</text>
  <line x1="100.0" y1="120.0" x2="300.0" y2="120.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"  />
  <polygon points="220.0,120.0 212.0,124.0 212.0,116.0" fill="#dc2626" />
  <line x1="300.0" y1="120.0" x2="440.0" y2="218.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"  />
  <polygon points="384.0,178.8 375.2,177.5 379.7,170.9" fill="#dc2626" />
  <line x1="100.0" y1="120.0" x2="220.0" y2="180.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"  />
  <polygon points="172.0,156.0 163.1,156.0 166.6,148.8" fill="#dc2626" /><line x1="220" y1="180" x2="300" y2="156" stroke="#dc2626" stroke-width="2" /><line x1="300" y1="156" x2="440" y2="156" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 4" /><line x1="100" y1="120" x2="440" y2="218" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.6" /><text x="300" y="308" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Object beyond 2F → image between F' and 2F': real · inverted · smaller.</text>
</svg>
