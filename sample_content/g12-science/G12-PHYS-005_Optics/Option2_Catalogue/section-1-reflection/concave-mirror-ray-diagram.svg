<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Concave mirror ray diagram object beyond C">
  <title>Concave mirror ray diagram object beyond C</title>
  <desc>A concave mirror arc on the right; a horizontal principal axis with focal point F and centre of curvature C marked. A green upright object arrow stands at the far left beyond C; red light rays from the top of the object reflect off the mirror and converge to form a smaller inverted red image arrow between F and C.</desc>
  
  <text x="300" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Concave Mirror — Object Beyond Centre of Curvature</text>

  <!-- Principal axis -->
  <line x1="60" y1="200" x2="540" y2="200" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- Concave mirror arc (bulges toward the object) -->
  <path d="M 380 100 A 200 200 0 0 0 380 300" fill="none" stroke="#1a202c" stroke-width="3" />
