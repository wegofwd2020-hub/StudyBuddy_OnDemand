<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Convex mirror ray diagram">
  <title>Convex mirror ray diagram</title>
  <desc>A convex mirror arc bulging toward the object on the left. A virtual focal point F and centre of curvature lie behind the mirror (dashed). Object arrow at the far left; red rays reflect from the mirror diverging away. The diverging rays appear to come from a small upright virtual image just behind the mirror.</desc>
  
  <text x="300" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Convex Mirror — Always a Virtual, Smaller Image</text>

  <line x1="60" y1="200" x2="540" y2="200" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- Convex mirror arc (bulges left toward viewer) -->
  <path d="M 400 100 A 200 200 0 0 1 400 300" fill="none" stroke="#1a202c" stroke-width="3" />
  <!-- F and C are on the right (behind the mirror, dashed) -->
<circle cx="480" cy="200" r="5" fill="#2b6cb0" /><text x="480" y="222" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#2b6cb0" text-anchor="middle">F</text><text x="480" y="238" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">(virtual)</text><line x1="120" y1="200" x2="120" y2="140" stroke="#15803d" stroke-width="3" /><polygon points="114,148 126,148 120,140" fill="#15803d" /><text x="120" y="132" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">object</text><line x1="450" y1="200" x2="450" y2="175" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3" /><polygon points="445,181 455,181 450,175" fill="#dc2626" /><text x="450" y="169" font="bold 11px system-ui" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">virtual image</text><text x="450" y="222" font="9px system-ui" font-size="9" fill="#dc2626" text-anchor="middle">(upright, smaller)</text>
  <line x1="120.0" y1="140.0" x2="400.0" y2="140.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"  />
  <polygon points="288.0,140.0 280.0,144.0 280.0,136.0" fill="#dc2626" /><line x1="400" y1="140" x2="160" y2="70" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" /><line x1="400" y1="140" x2="480" y2="200" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3" opacity="0.5" /><line x1="120" y1="140" x2="400" y2="170" stroke="#dc2626" stroke-width="2" /><line x1="400" y1="170" x2="160" y2="170" stroke="#dc2626" stroke-width="2" /><text x="300" y="308" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Convex mirror always: virtual · upright · smaller. F and C are behind the reflective surface.</text>
</svg>
