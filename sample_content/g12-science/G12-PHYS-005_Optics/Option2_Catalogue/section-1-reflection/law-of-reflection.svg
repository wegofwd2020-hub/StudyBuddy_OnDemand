<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Law of reflection diagram">
  <title>Law of reflection diagram</title>
  <desc>A flat mirror surface (hatched) with a vertical dashed normal line at the point of incidence. A red incident ray comes in from the upper-left at 45° to the normal; a green reflected ray leaves to the upper-right at the same angle. Two angle arcs labelled θᵢ and θᵣ identify the equal angles. Caption: θᵢ = θᵣ.</desc>
  
  <text x="300" y="32" font="bold 18px system-ui" font-size="18" font-weight="700" fill="#1a202c" text-anchor="middle">Law of Reflection — angle of incidence = angle of reflection</text>
  <text x="300" y="54" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">Both angles measured from the normal — the line perpendicular to the surface.</text>

  <!-- Mirror surface with hatched back -->
  <line x1="60" y1="250" x2="540" y2="250" stroke="#1a202c" stroke-width="3" />
<line x1="60" y1="250" x2="72" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="80" y1="250" x2="92" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="100" y1="250" x2="112" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="120" y1="250" x2="132" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="140" y1="250" x2="152" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="160" y1="250" x2="172" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="180" y1="250" x2="192" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="200" y1="250" x2="212" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="220" y1="250" x2="232" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="240" y1="250" x2="252" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="260" y1="250" x2="272" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="280" y1="250" x2="292" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="300" y1="250" x2="312" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="320" y1="250" x2="332" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="340" y1="250" x2="352" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="360" y1="250" x2="372" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="380" y1="250" x2="392" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="400" y1="250" x2="412" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="420" y1="250" x2="432" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="440" y1="250" x2="452" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="460" y1="250" x2="472" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="480" y1="250" x2="492" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="500" y1="250" x2="512" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="520" y1="250" x2="532" y2="264" stroke="#4a5568" stroke-width="1.2" /><line x1="300.0" y1="70.0" x2="300.0" y2="270.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" /><text x="288" y="70" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">normal</text>
  <line x1="186.9" y1="136.9" x2="300.0" y2="250.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"  />
  <polygon points="254.7,204.7 246.3,201.9 251.9,196.3" fill="#dc2626" /><text x="178.8629150101524" y="130.8629150101524" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#dc2626" text-anchor="end">incident ray</text>
  <line x1="300.0" y1="250.0" x2="413.1" y2="136.9" stroke="#15803d" stroke-width="3" stroke-linecap="round"  />
  <polygon points="367.9,182.1 365.1,190.6 359.4,184.9" fill="#15803d" /><text x="421.1370849898476" y="130.8629150101524" font="bold 13px system-ui" font-size="13" font-weight="700" fill="#15803d">reflected ray</text><path d="M 299.5,200.0 A 50,50 0 0 0 264.6,214.6" fill="none" stroke="#dc2626" stroke-width="1.5" /><text x="268" y="190" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">θᵢ</text><path d="M 335.4,214.6 A 50,50 0 0 0 300.5,200.0" fill="none" stroke="#15803d" stroke-width="1.5" /><text x="332" y="190" font="bold 12px system-ui" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">θᵣ</text><text x="300" y="300" font="bold 14px system-ui" font-size="14" font-weight="700" fill="#1a202c" text-anchor="middle">θᵢ = θᵣ</text><text x="300" y="348" font="11px system-ui" font-size="11" fill="#4a5568" text-anchor="middle">The incident ray, the normal, and the reflected ray all lie in the same plane.</text>
</svg>
