# =============================================================================
# StudyBuddy OnDemand — Vaganam local dev overrides
#
# This machine's dev instance. Port 8001 (8000 occupied by Ghostscript).
#
# Usage (from project root):
#   deploy/vaganam/start.sh
#
# Or manually:
#   docker compose --project-directory . \
#     -f docker-compose.yml \
#     -f deploy/vaganam/overrides.yml \
#     --env-file .env \
#     up -d
# =============================================================================

# Build network: host — Docker NAT is broken on this machine (iptables/nftables
# conflict); host network gives build steps direct access to the host's working
# internet stack so apt-get update and npm install resolve DNS correctly.
x-build-host-net: &build-host-net
  network: host

services:

  migrate:
    build:
      network: host

  api:
    build:
      network: host
    environment:
      DATABASE_URL: postgresql://studybuddy:${POSTGRES_PASSWORD}@pgbouncer:5432/studybuddy
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: vaganam

  celery-worker:
    build:
      network: host

  celery-pipeline:
    build:
      network: host

  celery-beat-primary:
    build:
      network: host

  celery-beat-standby:
    build:
      network: host

  web:
    build:
      network: host
    ports:
      - "3000:3000"
    environment:
      AUTH0_DOMAIN: localhost
      AUTH0_CLIENT_ID: dev_client_vaganam
      AUTH0_CLIENT_SECRET: dev_secret_vaganam
      AUTH0_SECRET: dev_secret_key_vaganam
      APP_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
      NEXT_PUBLIC_CDN_URL: http://localhost:8001
      INTERNAL_API_URL: http://api:8000/api/v1
